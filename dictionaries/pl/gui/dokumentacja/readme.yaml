#   * `readme.md`       — wersja EN (smart_en: kanoniczny GitHub landing
#                          bez sufiksu ISO, renderowany na stronie repo
#                          domyślnie)
#   * `readme.pl.md`    — wersja PL (z tego pliku, język bazowy projektu)
#   * `readme.<iso>.md` — pozostałe 7 jzk (de/es/fi/fr/is/it/ru) po batch
#                          retranslate przez `buduj_wielojezyczne_docs.py`
#
# Konwencja sekcji: split na 13 logicznych części (analogicznie do
# manual.yaml/opowiesci.yaml/dictionaries.yaml refaktorowanych w task #3
# i #9). Pozwala na surgical update przez `--klucz <nazwa_sekcji>` przy
# kolejnych zmianach treści (np. opis nowej funkcji w v15.3+).
#
# Placeholdery `{numer_wersji}`, `{liczba_szyfrow}`, `{liczba_trybow_rezysera}`,
# `{liczba_trybow_opowiesci}`, `{liczba_akcentow_jezykowych}`,
