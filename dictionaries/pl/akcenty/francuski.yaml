# -----------------------------------------------------------------------------
#  AKCENT FRANCUSKI
#  Dla syntezatorów: Thomas / Amelie / Julie (francuski TTS).
# -----------------------------------------------------------------------------
id: francuski
etykieta: "Francuski (np. Thomas / Amelie / Julie)"
opis: |
  Upodabnia polski tekst do francuskiej wymowy: „sz”→„ch” (francuski
  zapis głoski /sz/), „cz”→„tch”, „rz”→„j”, „r”→„gh” (francuskie
  gardłowe R), „w”→„v”. Polskie „ch” zostaje — francuski głos i tak
  czyta „ch” jako /sz/, a samotne „h” jest u niego nieme z natury.
iso: fr
kategoria: akcent
kolejnosc: 50

czysc_tekst_tts: true
normalizuj_liczby: true
skleja_pojedyncze_litery: true

zamiany:
  # -- Polska romanizacja fonetyczna (v19.5; dawniej `podstawy.yaml`) --
  #    Pre-pass paczki biegnie PRZED tą listą, więc czoło `zamiany` jest
  #    miejscem równoważnym co do znaku. Dlaczego przeniesione → komentarz
  #    przy `polskie_znaki` w `dictionaries/pl/podstawy.yaml`.
  #    Kaskada z regułami niżej (`ć` → `c`, a dalej `c` → coś innego) jest
  #    ZAMIERZONA: pre-pass podawał im dokładnie ten sam wsad.
  - { wzor: "ą", zamiana: "on" }
  - { wzor: "ę", zamiana: "en" }
  - { wzor: "ł", zamiana: "l" }
  - { wzor: "ó", zamiana: "u" }
  - { wzor: "ś", zamiana: "s" }
  - { wzor: "ć", zamiana: "c" }
  - { wzor: "ń", zamiana: "n" }
  - { wzor: "ż", zamiana: "z" }
  - { wzor: "ź", zamiana: "z" }
  - { wzor: "Ą", zamiana: "On" }
  - { wzor: "Ę", zamiana: "En" }
  - { wzor: "Ł", zamiana: "L" }
  - { wzor: "Ó", zamiana: "U" }
  - { wzor: "Ś", zamiana: "S" }
  - { wzor: "Ć", zamiana: "C" }
  - { wzor: "Ń", zamiana: "N" }
  - { wzor: "Ż", zamiana: "Z" }
  - { wzor: "Ź", zamiana: "Z" }
  # AUDYT 18.12 (W-4): dawne „h”→„” kasowało h we WCZEŚNIEJ wprowadzonych
  # „sh”/„tch” („szum, czar, chleb”→„sum, tcagh, sleb”). Reguła usunięta —
  # francuski głos ma nieme h z natury — a /sz/ zapisujemy francuską
  # ortografią „ch” (nie anglosaskim „sh”). Polskie „ch” zostaje literalnie
  # (francuz przeczyta je jako /sz/ — akceptowalna karykatura).
  - { wzor: "sz", zamiana: "ch"  }
  - { wzor: "Sz", zamiana: "Ch"  }
  - { wzor: "SZ", zamiana: "CH"  }
  - { wzor: "cz", zamiana: "tch" }
  - { wzor: "Cz", zamiana: "Tch" }
  - { wzor: "CZ", zamiana: "TCH" }
  - { wzor: "rz", zamiana: "j"   }
  - { wzor: "Rz", zamiana: "J"   }
  - { wzor: "RZ", zamiana: "J"   }
  - { wzor: "r",  zamiana: "gh"  }
  - { wzor: "R",  zamiana: "Gh"  }
  - { wzor: "w",  zamiana: "v"   }
  - { wzor: "W",  zamiana: "V"   }
