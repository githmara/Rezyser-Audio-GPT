# -----------------------------------------------------------------------------
#  AKCENT FRANCUSKI
#  Dla syntezatorów: Thomas / Amelie / Julie (francuski TTS).
# -----------------------------------------------------------------------------
id: francuski
etykieta: "Francuski (np. Thomas / Amelie / Julie)"
opis: |
  Upodabnia polski tekst do francuskiej wymowy: „sz”→„ch” (francuski
  zapis głoski /sz/), „cz”→„tch”, „rz”→„j”, „r”→„gh” (francuskie
  gardłowe R), „w”→„v”. Polskie „ch” zostaje — francuski głos i tak
  czyta „ch” jako /sz/, a samotne „h” jest u niego nieme z natury.
iso: fr
kategoria: akcent
kolejnosc: 50

czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

zamiany:
  # AUDYT 18.12 (W-4): dawne „h”→„” kasowało h we WCZEŚNIEJ wprowadzonych
  # „sh”/„tch” („szum, czar, chleb”→„sum, tcagh, sleb”). Reguła usunięta —
  # francuski głos ma nieme h z natury — a /sz/ zapisujemy francuską
  # ortografią „ch” (nie anglosaskim „sh”). Polskie „ch” zostaje literalnie
  # (francuz przeczyta je jako /sz/ — akceptowalna karykatura).
  - { wzor: "sz", zamiana: "ch"  }
  - { wzor: "Sz", zamiana: "Ch"  }
  - { wzor: "cz", zamiana: "tch" }
  - { wzor: "Cz", zamiana: "Tch" }
  - { wzor: "rz", zamiana: "j"   }
  - { wzor: "Rz", zamiana: "J"   }
  - { wzor: "r",  zamiana: "gh"  }
  - { wzor: "R",  zamiana: "Gh"  }
  - { wzor: "w",  zamiana: "v"   }
  - { wzor: "W",  zamiana: "V"   }
