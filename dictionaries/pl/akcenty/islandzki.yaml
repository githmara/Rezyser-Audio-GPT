# -----------------------------------------------------------------------------
#  AKCENT ISLANDZKI
#  Upodabnia polski tekst do islandzkiej wymowy (syntezator Guðrún / eSpeak).
# -----------------------------------------------------------------------------
id: islandzki
etykieta: "Islandzki (np. Guðrún / eSpeak)"
opis: |
  Upodabnia polski tekst do islandzkiej wymowy: miękczy syczenie,
  zmienia „w” na „v”. Zaprojektowany pod syntezator mowy Guðrún lub
  eSpeak ustawiony na język islandzki.
iso: is
kategoria: akcent
kolejnosc: 30

# --- Pipeline przetwarzania ---
czysc_tekst_tts: true
normalizuj_liczby: true
skleja_pojedyncze_litery: true

# --- Właściwe zamiany fonetyczne (kolejność: dwuznaki PRZED jednoznakami) ---
zamiany:
  # -- Polska romanizacja fonetyczna (v19.5; dawniej `podstawy.yaml`) --
  #    Pre-pass paczki biegnie PRZED tą listą, więc czoło `zamiany` jest
  #    miejscem równoważnym co do znaku. Dlaczego przeniesione → komentarz
  #    przy `polskie_znaki` w `dictionaries/pl/podstawy.yaml`.
  #    Kaskada z regułami niżej (`ć` → `c`, a dalej `c` → coś innego) jest
  #    ZAMIERZONA: pre-pass podawał im dokładnie ten sam wsad.
  - { wzor: "ą", zamiana: "on" }
  - { wzor: "ę", zamiana: "en" }
  - { wzor: "ł", zamiana: "l" }
  - { wzor: "ó", zamiana: "u" }
  - { wzor: "ś", zamiana: "s" }
  - { wzor: "ć", zamiana: "c" }
  - { wzor: "ń", zamiana: "n" }
  - { wzor: "ż", zamiana: "z" }
  - { wzor: "ź", zamiana: "z" }
  - { wzor: "Ą", zamiana: "On" }
  - { wzor: "Ę", zamiana: "En" }
  - { wzor: "Ł", zamiana: "L" }
  - { wzor: "Ó", zamiana: "U" }
  - { wzor: "Ś", zamiana: "S" }
  - { wzor: "Ć", zamiana: "C" }
  - { wzor: "Ń", zamiana: "N" }
  - { wzor: "Ż", zamiana: "Z" }
  - { wzor: "Ź", zamiana: "Z" }
  - { wzor: "ch", zamiana: "h"  }
  - { wzor: "Ch", zamiana: "H"  }
  - { wzor: "CH", zamiana: "H"  }
  - { wzor: "cz", zamiana: "ts" }
  - { wzor: "Cz", zamiana: "Ts" }
  - { wzor: "CZ", zamiana: "TS" }
  - { wzor: "sz", zamiana: "s"  }
  - { wzor: "Sz", zamiana: "S"  }
  - { wzor: "SZ", zamiana: "S"  }
  - { wzor: "c",  zamiana: "ts" }
  - { wzor: "C",  zamiana: "Ts" }
  - { wzor: "w",  zamiana: "v"  }
  - { wzor: "W",  zamiana: "V"  }
