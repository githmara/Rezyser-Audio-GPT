# -----------------------------------------------------------------------------
#  AKCENT NIEMIECKI
#  Dla syntezatorów: Stefan / Markus / Katja / Hedda (niemiecki TTS).
# -----------------------------------------------------------------------------
id: niemiecki
etykieta: "Niemiecki (np. Stefan / Markus / Katja / Hedda)"
opis: |
  Upodabnia polski tekst do niemieckiej wymowy: „sz”→„sch”,
  „cz”→„tsch”, „rz”→„rsch”, „v”→„w” (rzadkie polskie „v” z zapożyczeń —
  niemieckie /w/ pisane „w”). Polskie „w” zostaje: niemiecki głos
  i tak czyta „w” jako /w/ (v).
iso: de
kategoria: akcent
kolejnosc: 60

czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

zamiany:
  # -- Polska romanizacja fonetyczna (v19.5; dawniej `podstawy.yaml`) --
  #    Pre-pass paczki biegnie PRZED tą listą, więc czoło `zamiany` jest
  #    miejscem równoważnym co do znaku. Dlaczego przeniesione → komentarz
  #    przy `polskie_znaki` w `dictionaries/pl/podstawy.yaml`.
  #    Kaskada z regułami niżej (`ć` → `c`, a dalej `c` → coś innego) jest
  #    ZAMIERZONA: pre-pass podawał im dokładnie ten sam wsad.
  - { wzor: "ą", zamiana: "on" }
  - { wzor: "ę", zamiana: "en" }
  - { wzor: "ł", zamiana: "l" }
  - { wzor: "ó", zamiana: "u" }
  - { wzor: "ś", zamiana: "s" }
  - { wzor: "ć", zamiana: "c" }
  - { wzor: "ń", zamiana: "n" }
  - { wzor: "ż", zamiana: "z" }
  - { wzor: "ź", zamiana: "z" }
  - { wzor: "Ą", zamiana: "On" }
  - { wzor: "Ę", zamiana: "En" }
  - { wzor: "Ł", zamiana: "L" }
  - { wzor: "Ó", zamiana: "U" }
  - { wzor: "Ś", zamiana: "S" }
  - { wzor: "Ć", zamiana: "C" }
  - { wzor: "Ń", zamiana: "N" }
  - { wzor: "Ż", zamiana: "Z" }
  - { wzor: "Ź", zamiana: "Z" }
  - { wzor: "sz", zamiana: "sch"  }
  - { wzor: "Sz", zamiana: "Sch"  }
  - { wzor: "SZ", zamiana: "SCH"  }
  - { wzor: "cz", zamiana: "tsch" }
  - { wzor: "Cz", zamiana: "Tsch" }
  - { wzor: "CZ", zamiana: "TSCH" }
  - { wzor: "rz", zamiana: "rsch" }
  - { wzor: "Rz", zamiana: "Rsch" }
  - { wzor: "RZ", zamiana: "RSCH" }
  # AUDYT 18.12 (W-4): dawna kaskada „w”→„v” + „v”→„f” czytała KAŻDE
  # polskie /w/ jako /f/ („woda i wino”→„foda ifino”). Niemiecka litera
  # „w” to natywnie /w/ (v) — polskie „w” zostawiamy, a rzadkie polskie
  # „v” (zapożyczenia) mapujemy na „w”, bo niemieckie „v” czyta się /f/.
  - { wzor: "v",  zamiana: "w"    }
  - { wzor: "V",  zamiana: "W"    }
