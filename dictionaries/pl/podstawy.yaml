# =============================================================================
#  PODSTAWY JĘZYKA POLSKIEGO
# =============================================================================
#
#  Ten plik zawiera wspólne dane wykorzystywane przez WSZYSTKIE akcenty
#  i szyfry w podfolderach akcenty/ i szyfry/.
#
#  Edytuj OSTROŻNIE – zmiana tutaj wpływa na KAŻDY akcent paczki
#  (pre-pass jest bezwarunkowy) oraz na szyfr Cezara.
# =============================================================================

id: podstawy
jezyk: pl
# 13.4.3: identyfikator lingua-language-detector używany przez detektor języka
# silnika Poligloty. Wartość MUSI być nazwą enum-a `lingua.Language` (bez
# prefiksu, wielkimi literami) — pełna lista na https://github.com/pemistahl/lingua-py
# (POLISH, GERMAN, SPANISH, …). Brak tego pola wyłącza dany język z detektora
# (sticky-fallback w core_poliglota), folder pozostaje w dictionaries widoczny.
lingua: POLISH
etykieta: "Polski – podstawy fonetyczne"
opis: |
  Bazowe reguły dla języka polskiego:
    1. Transliteracja diakrytyków OBCYCH (é, ü, ñ, å, ř, š…) na ASCII –
       pierwszy krok każdego akcentu oraz każdego szyfru. Polskich liter ta lista NIE spłaszcza: stoją
       w alfabecie niżej, a ich romanizację (ą→on, ę→en, ó→u…) niosą na
       czele listy `zamiany` te akcenty, które jej potrzebują.
    2. Alfabet polski (35 liter, wielkie) – używany przez szyfr Cezara,
       od v19.5 razem z dziewięcioma literami diakrytycznymi (szyfrowanie
       polskiego tekstu jest odtąd w pełni odwracalne).

# -----------------------------------------------------------------------------
# PRE-PASS paczki: zamiana OBCYCH znaków diakrytycznych na odpowiedniki ASCII.
# Wykonywana PRZED listą `zamiany` KAŻDEGO akcentu oraz przed każdym
# szyfrem — od v19.6 bezwarunkowo, bez flagi w pliku akcentu.
# -----------------------------------------------------------------------------
polskie_znaki:
  # -- Litery polskie: NIE MA ICH TUTAJ i to jest decyzja (v19.5) --
  #    Do v19.4.2 ta lista otwierała się romanizacją własnych liter paczki
  #    (`ą → on`, `ę → en`, `ó → u`, `ł ś ć ń ż ź`). Wszystkie dziewięć stoi
  #    w `alfabet` niżej, a znak stojący w `alfabet` JEST literą tego języka —
  #    spłaszczanie go w pre-passie łamało własną deklarację paczki i miało
  #    dwa skutki naraz:
  #      (1) szyfr Cezara nigdy nie zobaczył dziewięciu z trzydziestu pięciu
  #          liter swojego alfabetu, więc deszyfracja polskiego tekstu nie
  #          była wierna (ta sama klasa błędu co niemieckie Ä/Ö/Ü, v18.19);
  #      (2) pre-pass jest WSPÓLNY dla całej paczki, więc akcent, który
  #          polskich diakrytyków POTRZEBUJE, musiał wyłączać go w całości —
  #          `rosyjski.yaml` wyłączał go w całości i przez to przepuszczał
  #          do cyrylicy obcą łacinkę (`é ü Å ö ë ñ ú á`). Wyłącznika już
  #          nie ma (v19.6) — właśnie dlatego, że kosztował tyle.
  #
  #    Romanizacja nie zniknęła — przeniosła się na CZOŁO listy `zamiany:`
  #    w siedmiu akcentach, które jej chcą (angielski, fiński, francuski,
  #    hiszpański, islandzki, niemiecki, włoski). Pre-pass i tak biegł PRZED
  #    `zamiany`, więc wynik jest równoważny co do znaku, a decyzja „jak
  #    brzmi polskie ą dla tego głosu" należy odtąd do akcentu, nie do całej
  #    paczki. Lista niżej zaczyna się więc od razu od znaków OBCYCH.
  # 13.3: rozszerzenie listy o diakrytyki europejskich zapożyczeń
  # (Pokémon, café, jalapeño, façade, Schrödinger, naïve...). Bez tych
  # reguł szyfr Cezara pomijał obce znaki, łamiąc spójność szyfrowania
  # tekstów wielojęzycznych.
  #
  # -- v19.7: CELEM ZAMIANY JEST POLSZCZYZNA, NIE ASCII --
  #    Do v19.6 każdy obcy znak schodził do „najprostszej reprezentacji
  #    ASCII" i to było zubożenie, nie uproszczenie. Pre-pass biegnie PRZED
  #    listą `zamiany` KAŻDEGO akcentu, więc spłaszczenie `š` do gołego `s`
  #    odbierało akcentom regułę, którą mają od zawsze (angielski `sz → sh`,
  #    rosyjski `sz → ш`) — wiedza lądowała w koszu, zanim akcent zdążył
  #    ją zobaczyć. Odtąd obcy znak, który STABILNIE brzmi jak dźwięk
  #    zapisywany po polsku, dostaje polski zapis:
  #      č ĉ ċ → cz     š ş ŝ → sz     ž ĵ → ż     ř → rz
  #      ň ñ ņ → ń      đ → dź         ĝ ġ → dż    ŭ → ł
  #      ţ → c   (rumuńskie ț to /ts/, nigdy /t/)
  #      ç → s   (francuskie /s/ w „garçon"; dawne `c` czytało się /ts/)
  #      å → o   (skandynawskie /oː/: „Ångström" brzmi „ongstrem")
  #    Zmierzone: „Dvořák" wychodzi akcentem angielskim jako „Dvozhak"
  #    zamiast „Dvorak", a rosyjskim jako „Двожак" zamiast „Дворак".
  #
  #    Reszta listy zostaje przy ASCII i to TEŻ jest decyzja. Znak bez
  #    stabilnego polskiego odpowiednika zgaduje gorzej, niż upraszcza:
  #    `ä` jest raz niemieckim /ɛ/, raz fińskim /æ/; `æ` raz duńskim /ɛ/,
  #    raz islandzkim /ai/; `ü` i `ö` nie mają w polszczyźnie nic bliskiego.
  #    Gdy jeden znak ciągną dwa języki, wygrywa ten, który polski czytelnik
  #    spotka CZĘŚCIEJ — lista jest wspólna dla całej paczki, nie zależy od
  #    konkretnego tekstu.
  #
  #    Granicy pilnuje bramka `audyt_podstaw` (klasa `znaki-cel-obcy`): cel
  #    wolno pisać znakiem ASCII albo literą stojącą w `alfabet` niżej —
  #    nigdy literą trzeciego języka. `ž → ř` to błąd, nie wariant.
