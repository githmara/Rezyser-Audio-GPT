# -----------------------------------------------------------------------------
# REZYSER – panel modułu Reżyser (gui_rezyser.py)
# -----------------------------------------------------------------------------
rezyser:
  panel_name: "Ääniohjaaja GPT -paneeli"
  heading: "🎬  Ääniohjaaja GPT – Hybridi Luova Studio"
  description_name: "Ääniohjaaja GPT -moduulin kuvaus"
  tool_description: |-
    Ääniohjaaja GPT on hybridi luova studio.

    Aivoriihi-tila  – suunnittele juoni, luo 3 vaihtoehtoa (EI tallennusta tiedostoon).
    Käsikirjoitustila        – kirjoita raakakäsikirjoitus äänitehosteilla ja [Hahmo: tunne] -tageilla (TALLENNUS TIEDOSTOON).
    Äänikirjatila     – luo tiheää, klassista kirjallista proosaa (TALLENNUS TIEDOSTOON).

    Projektit tallennetaan ohjelman viereiseen 'skrypty/'-alikansioon.
    Anna projektin nimi ILMAN laajennusta (esim. kronikat_arkonia).
    Vaihtaaksesi projektia sinun on ensin tyhjennettävä nykyinen muisti.
  prompt_architekta_content: |-
    Olet merkittävä maailmojen arkkitehti (Worldbuilder) ja kirjallinen konsultti. Minulla on löyhä idea juonesta: [KIRJOITA IDEASI TÄHÄN]. Tehtäväsi on laajentaa tämä ammattimaiseksi "Maailmankirjaksi".
    Säädä sävy ja säännöt ideani mukaan. Vältä halpoja, satumaisia oikoteitä ja AI-kliseitä.

    MUOTOILUSÄÄNNÖT (KRIITTINEN):
    Sinun on palautettava vastaus kahdessa erillisessä osassa:

    OSA 1: MAAILMANKIRJA
    Tämä osa on ehdottomasti suljettava YHDESSÄ Markdown-koodilohkossa (käytä merkintöjä ```markdown alussa ja ``` lopussa). Koodilohkon sisällä noudata näitä sääntöjä:
    1. Aloita avoimen kirjan emojilla ja työnimellä, esim. 📖 Maailmankirja: [Nimi].
    2. Käytä yksittäistä risuaitaa (#) pääosioille (esim. # Maailman Säännöt, # Hahmot).
    3. Käytä kaksoisrisuaitaa (##) aliosioille.
    4. Käytä viivoja (-) luodaksesi selkeitä listoja.
    5. Käytä kaksoistähtiä (**teksti**), korostaaksesi ehdottomia, rikkomattomia sääntöjä (esim. **Sankari EI KOSKAAN valehtele**).
    6. Kuvaile hahmojen psykologiaa, heidän suurimpia heikkouksiaan ja motiivejaan. Vieraiden kielten hahmojen kohdalla lisää tieto aksentista suoraan tagin viereen, esim. `[Puhuja 1: Nimi] - lispaa ja puhuu ranskalaisella aksentilla`. **Tekninen vihje:** Avainsanan `aksentti` käyttö on ehdottomasti vaadittua, koska ulkoinen sovellusskripti tunnistaa ja soveltaa automaattisesti oikeat foneettiset säännöt kyseisen hahmon dialogeihin.

    OSA 2: TILASUOSITUS
    Tämä osa sijoitetaan koodilohkon ULKOPUOLELLE, tavallisena tekstinä alapuolelle. Suosittele minulle, mikä sovellukseni tila olisi paras tämän idean toteuttamiseen: 🎬 Raakakäsikirjoitustila (kuunnelmat, SFX, fonetiikka) vai 📖 Perinteinen Äänikirjatila (klassinen kirjallinen proosa).

  # Pasek pliku
  lbl_nazwa_pliku: "Projektitiedoston nimi (ilman laajennusta, esim. kronikat_arkonia):"
  txt_nazwa_pliku_name: "Projektitiedoston nimen kenttä"
  txt_nazwa_pliku_hint: "esim. kronikat_arkonia"
  txt_nazwa_pliku_tooltip: |-
    Kirjoita projektin nimi ILMAN laajennusta.
    Tarinatiedosto tallennetaan nimellä: skrypty/<nimi>.txt
    Kenttä on lukittu, kun muisti on käytössä.
  btn_wczytaj_label: "Lataa tarina"
  btn_wczytaj_tooltip: |-
    Lataa olemassa oleva projektitiedosto (skrypty/<nimi>.txt) muistiin.
    Aktiivinen vain, kun muisti on tyhjä ja nimi on annettu.
  btn_wyczysc_biezaca_label: "Tyhjennä nykyinen (jätä Yhteenveto)"
  btn_wyczysc_biezaca_tooltip: |-
    Tyhjentää vain nykyisen tarinan muistista.
    Yhteenveto (Pysyvä Muisti) ja Maailmankirja säilyvät.
    Käytä pitkän kirjan jatkamiseen yhteenvedon luomisen jälkeen.
  btn_hard_reset_label: "Sulje Projekti (Kova Nollaus)"
  btn_hard_reset_tooltip: |-
    PROJEKTIN KOKONAISTYHJENNYS: tarina, yhteenveto, Maailmankirja.
    Nollaa kaikki laskurit ja avaa tiedostonimikentän.
    Käytä projektin vaihtamiseen tai täysin uuden tarinan aloittamiseen.
  # Sidebar
  sidebar_heading: "📖 Projektin Sivupalkki"
  lbl_ksiega_swiata: "Maailmankirja – Säännöt ja Hahmot:"
  txt_ksiega_name: "Maailmankirjan kenttä – säännöt ja hahmot"
  txt_ksiega_hint: |-
    Kirjoita maailman säännöt, hahmojen kuvaus ja heidän foneettiset aksenttinsa…
    Esim. [Geralt: islantilainen aksentti]
    Sisältö liitetään jokaiseen AI-pyyntöön.
  txt_ksiega_tooltip: |-
    Konteksti, joka liitetään jatkuvasti AI:lle: maailman säännöt, hahmot, foneettiset aksentit.
    Tallennus levylle vaatii projektitiedoston nimen.
  btn_zapisz_ksiege_label: "💾 Tallenna Maailmankirja pysyvästi"
  btn_zapisz_ksiege_tooltip: |-
    Tallentaa Maailmankirjan tiedostoon: skrypty/<nimi>.md
    Vaatii projektitiedoston nimen.
  btn_prompt_architekta_label: "📖 Arkkitehdin Kehotus AI:lle…"
  btn_prompt_architekta_name: "Näytä Arkkitehdin Kehotus ulkoiselle chatbotille -painike"
  btn_prompt_architekta_tooltip: |-
    Avaa ikkuna valmiilla kehotuksella ulkoiselle chatbotille (ChatGPT, Claude).
    Liitä oma juoni-ideasi, ja AI luo ammattimaisen Maailmankirjan, joka on muotoiltu Markdownissa – liitettäväksi yllä olevaan "Maailmankirja"-kenttään.
  lbl_pamiec_dlugotrwala: "🧠 Pysyvä Muisti (Yhteenveto):"
  txt_pamiec_name: "Pysyvän Muistin kenttä – tapahtumien yhteenveto"
  txt_pamiec_hint: |-
    Tänne AI tallentaa yhteenvedon, kun muisti on täynnä.
    Voit myös muokata sitä manuaalisesti.
  txt_pamiec_tooltip: |-
    Aikaisempien tapahtumien yhteenveto liitetään jokaiseen AI-pyyntöön.
    Mahdollistaa tarinan jatkamisen ilman mallin kontekstin ikkunan rajoituksia.
  btn_zapisz_pamiec_label: "💾 Tallenna Yhteenveto"
