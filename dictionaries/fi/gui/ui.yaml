  choice_quick_start_name: "Valitse valmis Quick Start -skenaario"
  choice_quick_start_tooltip: 'Valitse valmis maailma, jotta voit heti sukeltaa kerrontaan. Esiasetus syöttää moottoriin lyhyen kuvauksen maailmasta ja sankarista, asettaa oletuspelitilan. "(oma peli)" jättää aloituksen vapaaksi — moottori keksii maailman ensimmäisen toiminnon perusteella.'
  lbl_ostatnia_tura: "Viimeinen kierros"
  txt_ostatnia_tura_name: "Viimeisen kierroksen sisältökenttä"
  txt_ostatnia_tura_tooltip: "Pikanäppäin, joka sisältää vain viimeksi luodun kohtauksen — NVDA lukee täällä tuoreen kertomuksen ilman, että tarvitsee selata satoja rivejä koko tarinasta. Jokaisen uuden kierroksen jälkeen kenttä korvataan uudella sisällöllä."
  txt_ostatnia_tura_init: "(Viimeinen kierros ilmestyy tähän kenttään ensimmäisen toimintasi jälkeen.)"
  txt_ostatnia_tura_skrot_naglowek: "[viimeksi tallennetun kierroksen tiivistelmä — koko kertomus alla olevassa kentässä]\n\n"
  btn_zasady_swiata_label: '&Muokkaa maailman sääntöjä…'
  btn_zasady_swiata_tooltip: Avaa maailman sääntöjen muokkausikkunan — valinnainen teksti, joka sisältää foneettisia, kulttuurisia tai mekaanisia sääntöjä, joita kerrontamoottorin tulee noudattaa koko pelin ajan. Tyhjä kenttä = ei lisäsääntöjä (oletuskäyttäytyminen).
  dlg_zasady_swiata_tytul: Pelin maailman säännöt
  dlg_zasady_swiata_lbl: 'Säännöt, joita kerrontamoottorin tulee noudattaa koko pelin ajan (valinnainen):'
  dlg_zasady_swiata_name: Maailman sääntöjen muokkauskenttä
  dlg_zasady_swiata_hint: "Esim.:\n- \"Nimi Joanna lausutaan aina kovana, puolalaisena [dż]; ei koskaan pehmeänä [j].\"\n- \"Tässä maailmassa magia toimii vain yöllä; päivällä hahmot ovat tavallisia ihmisiä.\"\n- \"Antagonisti Joana yrittää pehmentää protagonistin nimen lausumista kieliopillisella taivutuksella.\""
  dlg_zasady_swiata_btn_ok: '&Tallenna'
  dlg_zasady_swiata_btn_anuluj: '&Peruuta'
  status_zasady_zapisane: Maailman säännöt päivitetty ja tallennettu pelitiedostoon.
  zasady_bez_gry_tytul: Ei aktiivista peliä
  zasady_bez_gry_tresc: Aloita uusi peli painikkeella "Uusi peli" tai lataa aiemmin tallennettu peli ennen maailman sääntöjen määrittämistä — säännöt tallennetaan yhdessä pelitilan kanssa.
  btn_edytuj_tryb_label: '&Muokkaa pelitilaa…'
  btn_edytuj_tryb_tooltip: Avaa hätätilan pelitilan vaihtamisikkunan. Käytä vain, jos AI ei halua lopettaa tarinaa valintatilassa — siirtyminen vapaaseen tilaan antaa sinun kirjoittaa loppukohtauksen itse. Normaalissa pelissä tilaa ei pitäisi vaihtaa kesken pelin.
  dlg_edytuj_tryb_tytul: Pelitilan vaihtaminen kesken pelin
  dlg_edytuj_tryb_ostrzezenie: "HUOMIO: tilan vaihtaminen kesken aktiivisen pelin voi aiheuttaa kertojamoottorin epäsynkronoinnin.\n\nPelitila määrittää, miten seuraavat vuorot luodaan — AI-malli saa erilaisia ohjeita vapaassa tilassa (pelaaja kirjoittaa omat toimintonsa) kuin valintatiloissa (AI ehdottaa 3-5 vaihtoehtoa, joista valita, \"Pienemmässä pahassa\" kaikki ovat epäedullisia).\n\nTyypillinen syy tämän kiertotien käyttöön: AI itsepintaisesti luo uusia dilemmoja sen sijaan, että lopettaisi tarinan — siirtyminen vapaaseen tilaan antaa sinun kuvata loppukohtauksen itse.\n\nVaihdon jälkeen seuraava vuoro käyttää jo uusia sääntöjä. Pelin tila (hahmot, maailma, tähänastinen kerronta) pysyy ennallaan."
  dlg_edytuj_tryb_ostrzezenie_name: Varoituskenttä tilan vaihtamisen riskistä
  dlg_edytuj_tryb_lbl: 'Valitse uusi pelitila:'
  dlg_edytuj_tryb_name: Uuden pelitilan valinta
  dlg_edytuj_tryb_btn_ok: Vaihda &tila
  dlg_edytuj_tryb_btn_anuluj: '&Peruuta'
  status_tryb_zmieniony: Pelitila vaihdettu tilaan „{tryb_nazwa}". Seuraava vuoro käyttää uusia kerrontasääntöjä.
  dlg_wybierz_gre_tytul: Lataa Tarinapeli
  dlg_wybierz_gre_lbl: 'Saatavilla olevat pelit:'
  brak_gier_tytul: Ei pelejä
  brak_gier_tresc: 'Kansiossa runtime/opowiesci/ ei ole vielä tallennettuja pelejä. Aloita uusi peli: kirjoita nimi yllä olevaan kenttään, valitse tila ja käytä Uusi peli -painiketta.'
  btn_otworz_narracje_label: '&Avaa kertomustiedosto…'
  btn_otworz_narracje_tooltip: 'Avaa pelin kertomustiedoston (opowiesci/<nazwa>.txt) järjestelmän tekstieditorissa. Käytä hätätilanteessa, kun AI ei sulje tarinaa Valintojen/Pienemmän pahan tilassa ja haluat lisätä lopun käsin. HUOMIO: .txt sisältää vain tekstin TTS:lle; pelin tila (hahmot, sijainti, varusteet) on .game.json-tiedostossa eikä sitä päivitetä — seuraava LLM-kierros voi poiketa muutetusta kertomuksesta. Ennen avaamista näytetään vahvistusdialogi.'
  otworz_narracje_ostrzezenie_tytul: Kertomustiedoston muokkaus — tilan poikkeaman riski
  otworz_narracje_ostrzezenie_tresc: "Olet avaamassa kertomustiedoston (.txt) järjestelmän tekstieditorissa.\n\nHUOMIO: .txt-tiedosto sisältää vain kertomustekstin TTS:lle, kun taas pelin tila (hahmot, sijainti, varusteet, avoimet juonet) on erillisessä .game.json-tiedostossa. .txt:n muokkaaminen ei päivitä tilaa — seuraava LLM-kierros saa maailman ennen muokkaustasi, joten voi syntyä semanttinen poikkeama (esim. kuvailit hahmon kuolleeksi, mutta pelin tilassa hän on yhä elossa).\n\nTyypillinen turvallinen tapaus: sulkevan kohtauksen lisääminen, kun AI ei halua lopettaa tarinaa (vaihtoehto portille „Muokkaa pelitilaa…\" → Vapaa).\n\nJatketaanko?"
  blad_otwarcia_tytul: Tiedoston avaaminen epäonnistui
  blad_otwarcia_tresc: "Yritys avata tiedosto {sciezka_pliku} epäonnistui:\n{tresc_bledu}\n\nAvaa tiedosto manuaalisesti Tiedostonhallinnasta."
  plik_narracji_brak_tytul: Kertomustiedosto puuttuu
  plik_narracji_brak_tresc: Pelin kertomustiedostoa „{nazwa}" ei ole levyllä. Kertomustiedosto luodaan ensimmäisen kierroksen jälkeen — lähetä ensimmäinen toiminto, jotta kertomusmoottori luo tiedoston.
  btn_odswiez_z_dysku_label: "&Päivitä levyltä"
  btn_odswiez_z_dysku_tooltip: "Lataa kertomustiedoston (opowiesci/<nazwa>.txt) uudelleen ja täsmäyttää sisäisen muistin käsin tehtyihin muutoksiin — ilman kovaa nollausta ja pelin uudelleenlatausta. Tuore loppu siirtyy moottorin kontekstiin; aiempien kierrosten olemassa oleva yhteenveto jää koskemattomaksi. HUOMIO: pelin tilaa (hahmot, sijainti, varusteet) .game.json-tiedostossa EI päivitetä — seuraava kierros voi poiketa, jos maailman faktat muuttuvat."
  odswiez_z_dysku_tytul: "Kertomus päivitetty levyltä"
  odswiez_calosc_tresc: "Kertomus ladattu uudelleen levyltä, moottorin konteksti täsmäytetty tekstin loppuun.\n\nHUOMIO: pelin tilaa (hahmot, sijainti, varusteet, juonet) .game.json-tiedostossa EI muutettu — jos muokkaus muutti maailman faktoja, seuraava kierros voi poiketa."
  odswiez_streszczenie_tresc: "Moottorin konteksti päivitetty tuoreella lopulla levyltä. Aiempien kierrosten yhteenveto jäi koskemattomaksi, joten seuraava yhteenveto ja kierros eivät synny vanhentuneista tiedoista.\n\nHUOMIO: pelin tilaa .game.json-tiedostossa EI muutettu — jos maailman faktat muuttuvat, seuraava kierros voi poiketa."
  odswiez_zajete_tytul: "Toiminto käynnissä"
  odswiez_zajete_tresc: "Kierroksen tai yhteenvedon luonti on käynnissä. Odota sen valmistumista, ennen kuin päivität kertomuksen levyltä."
  btn_edytuj_stan_label: Muokkaa &peliä…
  btn_edytuj_stan_tooltip: 'Avaa pelitilan raakamuotoinen tiedosto (.game.json) suoraan muokattavaksi JSON-validoinnilla varustetussa ikkunassa. Edistyneille käyttäjille: mahdollistaa hahmojen, sijainnin, varusteiden, juonien ja laskureiden manuaalisen korjaamisen, kun kerronnan manuaalinen muokkaus on erkaantunut rakenteellisesta tilasta. VAROITUS: virheellinen muokkaus voi vahingoittaa tallennusta — muutokset validoidaan JSON-muodossa ennen tallennusta, mutta sisällön oikeellisuus (kenttien järkevyys) on omalla vastuullasi.'
  dlg_edytuj_stan_tytul: Pelitilan muokkaus (.game.json)
  dlg_edytuj_stan_lbl: 'Pelitilan raakamuotoinen JSON. Muokkaa varoen: tallennuksen jälkeen peli ladataan uudelleen tästä tiedostosta. Sisällön on pysyttävä kelvollisena JSON-objektina — muuten tallennus hylätään.'
  dlg_edytuj_stan_name: Pelitilan raakamuotoisen JSON-tiedoston muokkauskenttä
  dlg_edytuj_stan_btn_ok: '&Tallenna ja lataa uudelleen'
  dlg_edytuj_stan_btn_anuluj: '&Peruuta'
  edytuj_stan_blad_json_tytul: Virheellinen JSON
  edytuj_stan_blad_json_tresc: "Sisältö ei ole kelvollinen JSON, joten sitä ei tallennettu (peli vahingoittuisi). Korjaa syntaksi ja yritä uudelleen.\n\nVirheen yksityiskohdat:\n{tresc_bledu}"
  edytuj_stan_blad_typ_tresc: Pelitilan pääelementin on oltava JSON-objekti (avain–arvopari aaltosulkeissa), ei lista tai yksinkertainen arvo. Palauta objektin rakenne ja yritä uudelleen.
  edytuj_stan_zapisano_tytul: Pelitila tallennettu
  edytuj_stan_zapisano_tresc: Pelitila "{nazwa}" on tallennettu ja ladattu uudelleen levyltä. Hahmot, sijainti, varusteet, juonet ja laskurit heijastavat nyt muokkauksiasi.
  err_dlugosc: Mallin vastaus katkaistiin ennen kuin se ehti lopettaa sen (pituusraja ylitetty). Lyhennä kontekstia ja yritä uudelleen.
