id: opowiesci
tresc:
  naglowek: |
    Reżyser Audio GPT — Interaktiivisten Tarinoiden Moduuli ({app.wersja})

    Toinen sovelluksen päätila Reżyserin rinnalla — tällä kertaa sinusta tulee dynaamisesti luodun tarinan pelaaja sen kirjoittajan sijaan. Tekoäly ohjaa kerrontaa yksikön toisessa persoonassa ("Kävelet sumuisen metsän läpi, tunnet märän lehden tuoksun..."), ja sinä päätät seuraavasta liikkeestä — kirjoittamalla vapaamuotoisen toiminnon tai valitsemalla yhden numeroiduista vaihtoehdoista.

    Moduuli on alusta alkaen suunniteltu näkövammaisille pelaajille — kerronta luetaan lineaarisesti näytönlukijalla (NVDA) tai TTS-moottorilla, dynaamiset valinnat äänikuvauksilla varustettujen painikkeiden muodossa, jokainen päättynyt vuoro merkitään kellon äänellä ja automaattisella fokuksen siirrolla uuteen luotuun tekstiin.

    Avaat paneelin painikkeella "{main.btn.opowiesci}" työkalupalkissa tai pikanäppäimellä Ctrl+5.
  krok_1_tryby_gry: |
    KROK 1: Kolme pelitilaa — valitse pelityyli

    Juuri pelin nimen alapuolella löydät tilan valintaruudun (RadioBox). Tila määrittää, miten kerrontamoottori käy kanssasi vuoropuhelua:

    VAPAA TILA — kirjoitat minkä tahansa toiminnon vapaalla tekstillä ("yritän avata oven", "kysyn vartijalta tietä", "pakenen takaovista"). Kerrontamoottori voi ehdottaa 1-3 vihjettä, mutta ne ovat vain ehdotuksia — eivät pakollisia polkuja. Vapaamuotoisin tila, suositellaan kokeneille pelaajille, jotka improvisoivat omaa tarinaansa.

    VALINTATILA — jokainen kierros päättyy 3-5 numeroituun vaihtoehtoon A-E klikkattavina painikkeina. Jokainen valinta on tietty toiminto, jonka voit tehdä. Voit myös kirjoittaa oman toimintasi vapaalla tekstillä — moottori sovittaa sen lähimpään semanttiseen valintaan. Intuitiivisin tila näkövammaisille pelaajille: NVDA lukee sinulle kaikki vaihtoehdot, voit siirtyä niiden välillä Tab-näppäimellä ja vahvistaa Enterillä.

    PIENEMPI PAHA -TILA — kuten Valintatila, mutta jokainen 3-5 vaihtoehdosta on moraalisesti, fyysisesti tai strategisesti epäedullinen. Ei "neutraalia" vaihtoehtoa, ei onnellista loppua tällä kierroksella. Tila synkän fiktion ystäville "Tales of Consequence" -tyyliin tai moraalisiin draamoihin.

    Pullo Pienempi paha -tilassa (v15.2 alkaen): neljän pelivuoron jälkeen valintaruudussa näkyy lisävaihtoehto, nollanumeroinen "Avaa pullo" — ja se pysyy siellä pelin loppuun asti uudelleenkäytettävänä valintana (ei katoa käytön jälkeen, voit käyttää sitä toistuvasti). Pullo on "epätoivoinen pelastus" -vaihtoehto, mutta sen vaikutus on tarkoituksella arvaamaton ja sitä dramaattisempi, mitä harvinaisempi tulos: noin 60% tapauksista pullon sisältö on haitallista (myrkyttää, vahingoittaa, sokeuttaa), 30% aiheuttaa havaintohäiriöitä tai henkiä (hallusinaatiot, muuttunut puhe, paniikki), ja vain 10% osoittautuu harvoin hyödylliseksi (tilapäinen vahvistus, avulias henki, keskeinen tieto). Jakauma pakotetaan Pythonilla (`random.choices` sovelluksen puolella), LLM saa valmiin siemenen `{kategoria, kuvaus}` ja vain narratisoi sen — malli ei voi "keksiä" pelastavaa vaikutusta ilman arvontaa. Tämän ansiosta pullo EI KOSKAAN muutu deus ex machinaksi: jopa sen käyttö äärimmäisessä epätoivossa yleensä pahentaa tilannetta. Sen narratiivisen muodon valinta (murtuuko pullo lopullisesti vai piilotetaanko se takaisin vyölle) kuuluu kerrontamoottorille — joskus jo ensimmäisen 60%-haitallisen annoksen jälkeen et koskaan palaa.

    Tilaa voi vaihtaa pelin aikana — seuraavalla kierroksella kerrontamoottori mukautuu uuteen tyyliin (Vapaasta tilasta Valintoihin voi siirtyä yhdellä klikkauksella). Huomio: pullo on yksinomaan Pienempi paha -tilan ominaisuus — siirtyessäsi saman pelin aikana Valintoihin tai Vapaaseen tilaan, sen olemassaolo ja kierroslaskuri säilyvät pelitilassa, mutta ennen kuin palaat Pienempään pahaan, vaihtoehto "Avaa pullo" ei näy.
  krok_2_quick_start: |
    KROK 2: Pika-aloitus — valmiit aloitusskenaariot

    Pelinimen kentän alapuolella löydät toisen rivin etiketillä "{opowiesci.lbl_quick_start}" ja avattavan valikon (wx.Choice). Oletusasento on "{opowiesci.quick_start_wlasna}" — moottori keksii maailman ensimmäisen toimintasi perusteella.

    Voit kuitenkin valita yhden viidestä valmiista esiasetuksesta, jotta voit heti sukeltaa tiettyyn maailmaan:

    POST-APOKALYPTINEN SF — vuosisata ekologisen katastrofin jälkeen. Ihmiskunnan rippeet piilossa Pyhien Ristien vuorten alla. Olet nuori kuriiri Klan Sztolniasta ensimmäisellä vakavalla toimeksiannollasi. Oletustila: Valinnat.

    TUMMA FANTASIA — Kolmen Virran kuningaskunnan rajamailla, uskonsodan yhdeksäs vuosi. Olet nuorempi inkvisiittori jäljittämässä kylää, jossa joku suojelee riivattua lasta. Oletustila: Pienempi paha.

    KAUPUNKI FANTASIA DEKKARI — Varsova 2008, lokakuinen ilta. Olet yksityisetsivä, joka näkee henkiä. Asiakas haluaa löytää miehensä, joka katosi Kuninkaanlinnan alla. Oletustila: Valinnat.

    AVARUUSKAUHU — vuosi 2247, tutkimusasema neutronitähden kiertoradalla. Heräät horroksesta ilman kapteenia — eikä ole merkkejä siitä, että kapteeni olisi koskaan ollutkaan. Oletustila: Vapaa (lovecraftilainen ilmapiiri suosii improvisaatiota).

    ROMANTTINEN KOMEDIA — Saska Kępa huhtikuu 2024, pieni kahvila on sulkemisuhan alla. Olet barista-tarjoilija, jonka omistaja käskee "olla mukava" ujoa toimittajaa kohtaan, jota olet pitkään halunnut lähestyä itse. Oletustila: Vapaa.

    Valitse esiasetus ja napsauta "{opowiesci.btn_nowa_gra_label}" — moottori syöttää lyhyen kuvauksen maailmasta ja hahmosta, asettaa pelin oletustilan (voit muuttaa sitä RadioBoxilla ennen kuin napsautat "Uusi peli"). Ensimmäinen LLM-kierros pelaa avauskohtauksen.
  krok_3_pierwsza_gra: |
    KROK 3: Ensimmäinen peli alusta alkaen — ilman esiasetusta

    Jos haluat täydellisen vapauden, jätä "{opowiesci.quick_start_wlasna}" kenttään Quick Start ja valmistaudu kirjoittamaan ensimmäinen toiminto manuaalisesti.

    1. Kirjoita pelin nimi kenttään „{opowiesci.lbl_nazwa_gry}" (esim. „seikkailuni_1") — tällä nimellä tallennetaan narratiivin, tilan ja lokin tiedostot.
    2. Valitse tila (Vapaa/Valinnat/Pienempi paha).
    3. Klikkaa "{opowiesci.btn_nowa_gra_label}". Sovellus luo 3 tiedostoa: pelitila (.game.json), tyhjä Maailmankirja (.md) ja tilan metatiedot (.mode). Narratiivin tiedosto (.txt) luodaan ensimmäisen kierroksen jälkeen.
    4. Kirjoita ensimmäinen toiminto paneelin alareunan kenttään „{opowiesci.lbl_akcja}", esim. „herään tuntemattomassa huoneessa". Klikkaa "{opowiesci.btn_wyslij_label}". Narratiivimoottori avaa maailman toimintosi perusteella — huoneen kuvaus, äänet, hahmot, ensimmäiset päätökset.
    5. Jokainen kierros tallennetaan automaattisesti — voit milloin tahansa sulkea sovelluksen ja ladata pelin myöhemmin painikkeella "{opowiesci.btn_wczytaj_label}".
  krok_4_zasady_swiata: |
    KROK 4: Maailman säännöt — omat säännöt, joita moottori noudattaa koko pelin ajan

    Versiosta 15.1 alkaen kerrontakentän yläpuolella on painike "{opowiesci.btn_zasady_swiata_label}". Se avaa erillisen muokkausikkunan, jossa on monirivinen kenttä, johon voit kirjoittaa mitä tahansa sääntöjä — foneettisia, mekaanisia tai dramaturgisia — joita kerrontamoottori noudattaa jokaisella seuraavalla kierroksella tässä tietyssä pelissä. Säännöt tallennetaan yhdessä pelitilan kanssa (.game.json), joten pelin lataaminen säilyttää ne muuttumattomina.

    Kolme tyypillistä maailman sääntöjen käyttötapaa:

    FONEETTISET SÄÄNNÖT — ohjaavat hahmojen nimien ääntämistä TTS:n (Vocalizer, ElevenLabs) kautta. Esimerkki: "Nimi Joanna äännetään aina kovasti, puolalaisittain [dż]; ei koskaan pehmeästi [j]." Moottori lisää tämän variantin kerrontaan seuraavasta kierroksesta alkaen, ja hahmo Joanna Maailmankirjassa säilyttää tarkoitetun ääntämyksen. Tämä on myös luonnollinen silta Ohjaajan aksentteihin — jos lataat Maailmankirjan Ohjaajan paneeliin pelin päätyttyä (KROK 9 alla), foneettinen sääntö "siirtyy" peliin hahmon ominaisuutena.

    MEKAANISET SÄÄNNÖT — kuvaavat maailman "fysiikan lakeja", joita LLM:n on noudatettava. Esimerkki: "Tässä maailmassa magia toimii vain yöllä; päivällä hahmot ovat tavallisia ihmisiä." Moottori ei keksi loitsuja keskipäivällä, vaikka kierroksesi toiminta sitä vaatisi — sen sijaan se ehdottaa vaihtoehtoa tai ohjaa sinut kohti iltaa.

    DRAMATURGISET SÄÄNNÖT — määrittelevät pitkäaikaisia jännitteitä hahmojen välillä. Esimerkki: "Antagonisti Joana yrittää pehmentää protagonistin nimen ääntämistä kieliopillisella taivutuksella." Moottori sisällyttää tällaisia hienovaraisia vihjeitä Joanan dialogeihin, ylläpitäen konfliktia monen kierroksen ajan ilman, että sinun tarvitsee toistaa ohjeita.

    Tyhjä sääntökenttä = ei lisäsääntöjä (oletuskäyttäytyminen, kuten v15.0:ssa). Sinun ei tarvitse määritellä sääntöjä heti alussa — voit palata ikkunaan milloin tahansa kierroksen aikana, lisätä pelin aikana havaittuja sääntöjä ja klikata "{opowiesci.dlg_zasady_swiata_btn_ok}". Muutos astuu voimaan seuraavasta kierroksesta alkaen.

    Huomio: maailman säännöt vaativat aktiivisen pelin. Jos klikkaat "{opowiesci.btn_zasady_swiata_label}" ilman ladattua/aloitettua peliä, saat viestin "{opowiesci.zasady_bez_gry_tytul}" — klikkaa ensin "{opowiesci.btn_nowa_gra_label}" tai lataa tallennettu peli.
  krok_5_slash_komendy: |
    KROK 5: Slash-komennot — nopeat toiminnot ilman API:ta

    Toimintokentässä voit milloin tahansa kirjoittaa komennon, joka alkaa vinoviivalla `/`. Komennot ovat paikallisia (eivät vaadi OpenAI-kutsuja) ja toimivat pelitilasta riippumatta. Hyväksytään sekä suomen- että englanninkieliset versiot:

    /tallenna, /save — pakottaa manuaalisen pelitilan tallennuksen. Automaattinen tallennus tapahtuu jokaisen vuoron jälkeen, joten tämä komento on lähinnä varmistusta varten ennen sovelluksen sulkemista.

    /lataa, /load — avaa tiedoston valintaikkunan kansiosta runtime/opowiesci/. Lataamisen jälkeen pelin nimi, tila ja koko narratiivi palautetaan — voit jatkaa siitä vuorosta, johon jäit.

    Narratiivimoottori valitsee AI-mallin automaattisesti tilan mukaan: Valintojen ja Pienemmän pahan tilassa se käyttää kalliimpaa gpt-4o:ta (noudattaa tiukasti maailman sääntöjä), Vapaassa tilassa — nopeampaa ja halvempaa gpt-4o-miniä (pelaaja ohjaa juonta, joten dramaattista ohjausta ei tarvita).

    /visualisoi <kuvaus>, /visualize <kuvaus> — moniaistinen kuvaus nykyisestä kohtauksesta. Ei muuta pelitilaa, ei ehdota valintoja — narratiivimoottori käyttää kaikkia viittä aistia (näkö, kuulo, haju, kosketus, maku) näyttääkseen kohtauksen syvällisemmin. Tulos näkyy erillisessä ikkunassa, sitä EI lisätä narratiiviin eikä tallenneta äänikirjatiedostoon. Esimerkki: „/visualisoi miltä vartija näyttää" tai „/visualisoi kahvilan tuoksu".

    /lopeta, /quit — sulkee sovelluksen (automaattisen vuoron tallennuksen jälkeen).
  krok_6_pliki_gry: |
    KROK 6: Pelitiedostot — missä löydät tietosi

    Jokainen peli tuottaa viisi tiedostoa, jokainen eri kansiossa ja eri rooleissa:

    skrypty/<nimi>.txt — täydellinen kertomus valmiina kuunneltavaksi äänikirjana. Voidaan avata Muistiossa tai ladata Audiokirja-arkkitehtiin (Muunnin) ja luoda Word-tiedosto luvuilla tai ajoitus ElevenLabsille.

    skrypty/<nimi>.md — Hahmojen Maailmakirja muodossa [Nimi: ominaisuudet], regeneroitu jokaisen kierroksen jälkeen. Muoto yhteensopiva Reżyserin parserin kanssa! Voit ladata tämän tiedoston Reżyserin paneeliin (Tiedosto → Lataa) ja saat luonnolliset hahmojen aksentit klassisessa TTS-kertomuksessa — silta sovelluksen kahden päämoduulin välillä.

    runtime/opowiesci/<nimi>.game.json — pelin täydellinen tila: nimi, tila, aktiiviset hahmot, sijainti, varusteet, avoimet juonenkäänteet, viimeiset 6 kierrosta tiivistetyssä muodossa. Tämä on totuuden lähde pelin lataamiseen — ilman tätä tiedostoa peliä ei voi jatkaa.

    runtime/opowiesci/<nimi>.story.jsonl — jokaisen kierroksen raakalogit (pelaajan pyyntö + mallin vastaus JSON-muodossa). Tiedostoa ei tarvita peliin — se on tarkoitettu debuggaamiseen tai myöhempään analyysiin (esim. tilastot kuinka monta kierrosta seikkailu kesti, mitä juonenkäänteitä LLM esitteli).

    runtime/skrypty/<nimi>.mode — tilanumeron metadata (3=Vapaa, 4=Valinnat, 5=Pienempi paha). Yhteinen tiedosto Reżyserin kanssa, mutta numerointi ei mene päällekkäin (Reżyser käyttää 0-2).
  krok_7_pamiec_modelu: |
    KROK 7: Mallimallin muistin osoitin — miksi vanhojen pelien vuorot eivät vaadi sinulta manuaalista työtä

    Tilavalinnan RadioBoxin alapuolella on mallimallin muistin osoitin — edistymispalkki (wx.Gauge) tilan kuvauksella vieressä. Osoitin näyttää kertomusmoottorin kontekstin ikkunan täyttöprosentin (gpt-4o-mini:llä on 128 000 tokenin puskuri).

    Neljä täyttötasoa:

    🟢 puhdas (0%) — peli on vasta alkanut, ei tallennettuja vuoroja.
    🟢 OK (1-69%) — kaikki on kunnossa, voit jatkaa ilman rajoituksia.
    ⚠️ varoitus (70-89%) — moottori luo automaattisesti yhteenvedon aiemmista vuoroista taustaketjussa. Näkyviin tulee viesti "Kontekstin automaattinen tiivistäminen käynnissä…" — älä lähetä seuraavaa vuoroa ennen kuin tiivistäminen on valmis. Onnistumisen jälkeen aiemmat vuorot tiivistetään yhdeksi kondensaatiksi, puskuri vapautuu, ja saat vahvistuksen "Mallimallin muisti palautettu" tiivistettyjen vuorojen määrällä.
    🚨 HÄLYTYS (90%+) — automaattinen tiivistäminen ei vapauttanut puskuria (harvinainen tapaus API-virheen jälkeen). Seuraavan vuoron lähettäminen on estetty. Pakota pelin lopetus komennolla /koniec, lataa se sitten uudelleen — moottori lataa tilan game.json-tiedostosta ilman viimeisten vuorojen historiaa, puskuri on tuore.

    Käytännössä automaattinen vähennysmekanismi on näkymätön — pelaaja ei huomaa, että mitään tapahtuu, koska taustaketju ratkaisee ongelman ennen kuin se huomataan. On tärkeää vain, ettet lähetä seuraavaa vuoroa automaattisen tiivistämisen aikana (painike "{opowiesci.btn_wyslij_label}" on silloin harmaana).
  krok_8_cinematic_warning: |
    KROK 8: Cinematic Meta Warning — dramaattinen keskeytys 150. kierroksen jälkeen

    150 kierroksen jälkeen yhdessä pelissä narratiivimoottori lisää KERRAN "Cinematic Meta Warning" — meta-narratiivisen dramaattisen keskeytyksen. Se ilmestyy erilliseen dialogiin kellon äänellä, suoraan sinulle suunnattuna toisessa persoonassa, saavutusten yhteenvedolla ja varoituksella päätösten merkityksestä.

    Cinematic Warning EI ole osa äänikirjan narratiivia — .txt-suodatinmoottori poistaa sen sisällön automaattisesti (merkitty merkeillä ⚠️🚨⚠️), jotta et kuule äänikirjaa kuunnellessasi meta-kommenttia omasta pelistäsi. Sisältö tallennetaan vain .story.jsonl-lokiin (reflektointia tai muistoksi säilyttämistä varten) ja GUI-dialogiin, jossa voit lukea sen kerran ja jatkaa.
  krok_9_most_do_rezysera: |
    KROK 9: Silta Reżyseriin — käytä Tarinoissa luotua Maailmankirjaa

    Peliä pelatessa luotu tiedosto skrypty/<nazwa>.md sisältää Maailmankirjan hahmoineen, jotka esiintyivät kertomuksessa, sekä niiden piirteet, aksentit ja luonteen. Muoto on täsmälleen sellainen, mitä Reżyserin jäsennin vaatii — [Nimi: piirteet aksentin kuvauksella].

    Mitä voit tehdä tällä:

    1. Pelin päätyttyä avaa paneeli "{main.btn.rezyser}" (Ctrl+1).
    2. Lataa samanniminen projekti — Reżyser lataa .txt-tiedoston tarinana ja .md-tiedoston Maailmankirjana.
    3. Saat nyt klassisen Reżyserin kerronnan (pitkät, jäsennellyt kohtaukset näytöksineen ja lukuineen) alkuperäisillä aksenteilla, joista pidit Tarinoissa. Karmelin vartija turvapaikasta puhuu lyhyin lausein, inkvisiittori Rosanna laulaen itäisellä aksentilla — kaikki piirteet säilytettyinä.

    Tämä on yksisuuntainen silta: Tarinat tuottavat materiaalia, Reżyser muotoilee sen. Käänteinen ei ole mahdollista — Reżyser ei lataa Tarinoiden pelejä interaktiivisena tilana.
  krok_10_dostepnosc_nvda: |
    KROK 10: Saavutettavuus (NVDA ja ruudunlukijat) — suunniteltu alusta alkaen

    Koko Tarinat-moduuli on optimoitu sokeille pelaajille. Tässä mitä olemme tehneet:

    VIIMEINEN KIERROS KENTTÄ — tämä on erillinen wx.TextCtrl vain luku -monirivinen (~140 px korkea) KOKO kertomuksen YLÄPUOLELLA. Jokaisen kierroksen jälkeen kenttä korvataan uudella osalla (otsikko "--- Kierros N ---" + kertomuksen sisältö). NVDA lukee sen heti, kun se on fokuksessa (automaattinen fokus kierroksen onnistumisen jälkeen), ilman että tarvitsee navigoida satojen rivien läpi koko tarinassa. Tallennetun pelin lataamisen jälkeen kenttä näyttää VIIMEISEN tallennetun kierroksen TIIVISTELMÄN (enintään 400 merkkiä `viimeiset_kierrokset` puskurista) etuliitteellä, joka ilmoittaa, että koko kertomus on alla olevassa kentässä.

    KOKO KERTOMUKSEN KENTTÄ — tämä on wx.TextCtrl vain luku -monirivinen, joka kasvaa jokaisen kierroksen jälkeen. NVDA lukee koko kertomuksen lineaarisesti, voit navigoida nuolilla tekstin sisällä, kopioida osia Ctrl+C:llä. Kenttä ei ole koskaan muokattavissa — muokkaat tarinaa VAIN uuden kierroksen kautta tai muokkaamalla .txt-tiedostoa sovelluksen ulkopuolella. Tämä kenttä on synkronoitu tiedoston `käsikirjoitukset/<nimi>.txt` kanssa, voit käsitellä sitä äänikirjan esikatseluna.

    DYNAMIISET VALINTAPAINIKKEET — Valinnat- ja Vähemmän paha -tiloissa jokainen kierros luo uusia wx.Button-painikkeita valinta-alueelle. Jokaisella on NVDA:n lukema vihje ("Valitse: jatka metsään"). Välilehti niiden välillä toimii luonnollisesti. Enter valitulla painikkeella lähettää valinnan automaattisesti kertomuskoneelle.

    TYHJÄN ALUEEN PIILOTTAMINEN — Vapaassa tilassa valinta-alue on TÄYSIN piilotettu (wx.Hide), ei vain harmaana — Välilehti ohittaa sen, NVDA ei vedä sitä elementtilistaan. Tämä estää pelaajaa eksymästä tyhjään paikkamerkkiin. Tiloissa 4 ja 5 alue näkyy vain mallin vastauksen onnistuneen validoinnin jälkeen (ei-tyhjä valintataulukko); mallin hallusinaatio (tyhjät valinnat) johtaa paluuseen vapaaseen tekstiin ilman käyttöliittymän sotkemista.

    ÄÄNISIGNALIT — jokainen päättynyt kierros ilmoitetaan wx.Bell (järjestelmäkello) jälkeen, jota seuraa automaattinen fokuksen siirto kertomuskenttään. NVDA lukee sitten uuden kertomuksen ilman manuaalista navigointia.

    VÄRILLISET MUISTITILAT — mallin muistimittari muuttaa fontin väriä (vihreä/oranssi/punainen) täyttötason mukaan. Näkeville käyttäjille tämä on lisävisuaalinen signaali; NVDA lukee kuitenkin tilatekstin, joten sokeat eivät menetä tietoa.

    NÄPPÄIMISTÖN PIKAKOMENNOT — kaikilla painikkeilla on merkki `&` yhden etiketin kirjaimen edessä, mikä aktivoi Alt+kirjain-pikakomennon. Toimii identtisesti muiden sovellusmoduulien kanssa.
  najczestsze_problemy: |
    Yleiset ongelmat

    Ongelma: Kun napsautan "{opowiesci.btn_nowa_gra_label}", näkyviin tulee viesti "API-avainta ei löydy".
    Syy ja ratkaisu: Sovelluksen pääkansiossa oleva golden_key.env-tiedosto ei sisällä oikeaa OpenAI-avainta. Palaa aloitusnäyttöön (Home-painike), napsauta "{home.btn_generate}" ja seuraa ohjeita (VAIHE 2 pääoppaassa).

    Ongelma: Yritän lähettää uuden kierroksen, mutta "{opowiesci.btn_wyslij_label}"-painike on harmaana.
    Syy ja ratkaisu: Kontekstin automaattinen tiivistäminen tai Cinematic Warning -varoituksen luominen on käynnissä taustalla. Muistin tila näyttää "Kontekstin automaattinen tiivistäminen käynnissä…". Odota muutama sekunti — painike vapautuu automaattisesti onnistumisen jälkeen.

    Ongelma: Viesti "Mallin muisti ylikuormitettu" estää pelin.
    Syy ja ratkaisu: Automaattinen tiivistäminen ei vapauttanut puskuria (esim. OpenAI:n nopeusrajoitus). Lopeta peli komennolla /loppu tai sulje sovellus, sitten lataa se uudelleen — moottori lataa vain tilan game.json-tiedostosta ilman viime kierrosten historiaa.

    Ongelma: Valintatilassa moottori ei luonut painikkeita, vaikka odotin niitä.
    Syy ja ratkaisu: Mallin hallusinaatio — huolimatta 4 LLM-tilasta, se palautti tyhjän valintataulukon. Sovellus piilottaa silloin tietoisesti valinta-alueen (sen sijaan, että näyttäisi tyhjän paikan) ja sallii jatkamisen vapaalla tekstillä. Seuraava kierros luultavasti luo valinnat oikein.

    Ongelma: .game.json ja .story.jsonl tiedostoja ei näy työpöydällä.
    Syy ja ratkaisu: Tämä on tarkoituksellista — runtime/ on järjestelmäkansio tavallisille käyttäjille, eikä se ole näkyvissä tiedostoselaimessa. Kertomustiedostot (.txt, .md) tallennetaan skrypty/-kansioon — löydät ne sieltä.
