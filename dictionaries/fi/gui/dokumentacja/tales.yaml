    ## Yleisimmät ongelmat

    Ongelma: Kun napsautat "{opowiesci.btn_nowa_gra_label}", näyttöön tulee viesti „API-avain puuttuu".
    Syy ja ratkaisu: Sovelluksen pääkansiossa oleva golden_key.env-tiedosto ei sisällä kelvollista Anthropic-avainta (se käyttää Tarinat-tilaa). Palaa aloitusnäyttöön (Home-painike), napsauta "{home.btn_generate}" ja seuraa ohjeita (päämanuaalin VAIHE 2).

    Ongelma: Yritän lähettää seuraavan vuoron, mutta "{opowiesci.btn_wyslij_label}"-painike on harmaana.
    Syy ja ratkaisu: Kontekstin automaattinen tiivistys tai Cinematic Warning -generointi on käynnissä taustaketjussa. Muistitila näyttää tekstin „Kontekstin automaattinen tiivistys käynnissä…". Odota muutama sekunti — painike vapautuu automaattisesti onnistumisen jälkeen.

    Ongelma: Napsautin valintaa, mutta sen sijaan että se olisi lähetetty, sen sisältö (ilman A–E-kirjainta) ilmestyi toimintokenttään.
    Syy ja ratkaisu: Tilanne on sama kuin edellisessä ongelmassa — "{opowiesci.btn_wyslij_label}"-painike oli juuri sillä hetkellä hetkellisesti harmaana (automaattinen tiivistys tai Cinematic Warning oli käynnissä taustalla). Normaalisti valintaa napsauttamalla siirto on valmis ja lähtee heti moottorille; kun lähetys on kuitenkin juuri sillä hetkellä estetty, sovellus ei hylkää valintaasi vaan kirjoittaa sen sisällön toimintokenttään ja asettaa kursorin siihen. Sinulla on tällöin kaksi vaihtoehtoa. Ensimmäinen: odota muutama sekunti, kunnes painike vapautuu, ja lähetä valinta sellaisenaan — käsittele sitä siis valmiina luonnoksena (tämä on versiosta 15.1 lähtien oleva oletustoiminta). Toinen: korvaa kentän sisältö kokonaan omalla tekstilläsi — tämä on erityisen hyvä hetki heti Cinematic Meta Warning -viestin jälkeen, kun sen sijaan että napsauttaisit seuraavaa dilemmaa, haluat kirjoittaa selkeän käskyn tarinan ja avointen juonilankojien sulkemiseksi, jos katsot sen aiheelliseksi. Muokkauksen jälkeen napsauta "{opowiesci.btn_wyslij_label}" (tai paina Enter).

    Ongelma: Viesti „Mallin muisti ylikuormittunut" estää pelin jatkumisen.
    Syy ja ratkaisu: Automaattinen tiivistys ei vapauttanut puskuria (esim. AI-palveluntarjoajan hetkellinen kyselyraja). Lopeta peli komennolla /koniec tai sulje sovellus, avaa se sitten uudelleen — moottori lataa tallennetun pelitilan automaattisesti ilman viimeisten vuorojen historiaa.

    Ongelma: Valinta-tilassa moottori ei generoinut painikkeita, vaikka odotin niitä.
    Syy ja ratkaisu: Mallin hallusinaatio — vaikka tila 4 on käytössä, LLM palautti tyhjän valintamatriisin. Sovellus piilottaa tällöin tarkoituksella valinta-alueen (sen sijaan että näyttäisi tyhjän paikkamerkin) ja sallii jatkamisen vapaan tekstin avulla. Seuraava vuoro todennäköisesti generoi valinnat oikein.

    Ongelma: En näe yhtään tallennettua pelitiedostoa.
    Syy ja ratkaisu: Tämä on tarkoituksellista — sovellus säilyttää pelitilan piilotetussa järjestelmäkansiossa ja hallinnoi sitä itse, joten sinun ei tarvitse etsiä sitä eikä tallentaa mitään manuaalisesti. Ainoa tiedosto, jota todella tarvitset, on valmis narratiivi sovelluksen vieressä olevassa opowiesci/-kansiossa — löydät sen sieltä. Tallennetut pelit voit ladata "{opowiesci.btn_wczytaj_label}"-painikkeella tai komennolla /wczytaj.
