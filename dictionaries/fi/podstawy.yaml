# =============================================================================
#  SUOMEN KIELEN PERUSTEET
# =============================================================================
#
#  Perustiedosto kansiolle `dictionaries/fi/`. Poliglota-moottori vaatii, että
#  jokaisella kielellä on tämä tiedosto — ilman sitä uutta kieltä EI tunnisteta
#  lainkaan.
#
#  Rakenne mallinnettu tiedostosta `dictionaries/pl/podstawy.yaml`. Kenttä
#  `polskie_znaki`, vaikka nimi on historiallinen, sisältää KAIKKI diakriittiset
#  merkit, jotka pitäisi normalisoida ASCII:ksi ennen salakirjoituksen tai
#  korostussääntöjen soveltamista. Suomalaiset Å, Ä, Ö ovat natiivit eikä niitä
#  sisällytetä — ne ovat osa aakkostoa ja Caesar-salakirjoitus salaa ne suoraan.
# =============================================================================

id: podstawy
jezyk: fi
# 13.4.3: lingua-language-detector -tunniste, jota Poliglota-moottori käyttää.
# Arvon on oltava `lingua.Language`-enumin nimi (isolla, ilman etuliitettä) —
# täydellinen lista: https://github.com/pemistahl/lingua-py. Kentän puuttuminen
# poistaa kielen tunnistimesta (sticky-fallback aktivoituu), kansio pysyy näkyvissä.
lingua: FINNISH
etykieta: "Suomi – foneettiset perusteet"
opis: |
  Suomen kielen perussäännöt:
    1. Diakriittisten merkkien normalisointi eurooppalaisten lainasanojen
       osalta (`polskie_znaki`) — niin että Caesar ja korostusmoottorit
       näkevät vain 29-kirjaimisen suomalaisen aakkoston.
    2. Suomalainen aakkosto (29 isoa kirjainta, alkuperäisessä järjestyksessä) –
       Caesar-salakirjoituksen käyttämä.

# -----------------------------------------------------------------------------
# Diakriittisten merkkien normalisointi. Jokainen ei-suomalainen latinalainen
# kirjain mapataan muotoon, jonka Caesar ja korostussäännöt osaavat käsitellä,
# eli sellaiseen, joka kirjoitetaan alla olevan `alfabet`-kentän kirjaimilla.
# Suomalaiset Å, Ä, Ö EIVÄT ole tällä listalla — ne ovat natiivit aakkoston
# kirjaimet ja Caesar salaa ne suoraan.
#
# v19.7: KOHTEENA ON SUOMI, EI PALJAS PERUSKIRJAIN. Versioon v19.6 asti jokainen
# vieras kirjain putosi peruskirjaimekseen, ja se oli köyhdyttämistä eikä
# yksinkertaistamista: pre-pass ajetaan ENNEN jokaisen tämän paketin korostuksen
# `zamiany`-listaa, joten litistäminen `š → s` heitti roskiin koko tiedon
# äänteestä, ennen kuin yksikään korostus ehti nähdä sitä. Vieras kirjain, joka
# kantaa VAKAASTI äänteen, jolle suomella on oma kirjoitusasu, saa nyt sen
# kirjoitusasun — eikä asuja tarvitse keksiä: Kotuksen suositus antaa ne
# suoraan (kun š:ää ja ž:aa ei voi kirjoittaa, ne korvataan muodoilla sh ja zh;
# samoin tš → tsh ja dž → dzh — šakki → shakki, Tšekki → Tshekki):
#     š ş ŝ ś → sh    č ĉ ċ ć → tsh    ž ĵ ź ż → zh    đ ĝ ġ → dzh
#     ř → rzh    ñ → nj    ţ → ts    ç → s    ą → on    ę → en
#     ø œ ő → ö       ü ű → y         ł ŭ → v
#   Mitattuna: „Škoda Žižek Dvořák Đoković" → „Shkoda Zhizhek Dvorzhak
#   Dzhokovitsh" eikä „Skoda Zizek Dvorak Dokovic"; „garçon Müller" →
#   „garson Myller" eikä „garcon Muller".
#
# KOLME PÄÄTÖSTÄ, JOTKA OVAT TÄMÄN LISTAN SISÄLTÖÄ:
#   1. `ü ű → y` ja `ø œ ő → ö` osuvat TÄMÄN PAKETIN OMIIN KIRJAIMIIN (v19.7
#      sallii sen: molemmat ovat `alfabet`-kentässä). Suomen y ON [y] eli sama
#      äänne kuin saksan ü, ja ö ON [ø] eli sama kuin tanskan ø — „Müller →
#      Myller" ja „Søren → Sören" ovat tarkempia kuin „Muller" ja „Soren", ja
#      samalla ne herättävät henkiin korostusten ä/ö/y-säännöt, jotka eivät
#      saksalaiselle tai tanskalaiselle tekstille koskaan käynnistyneet.
#      Espanjan ü (pingüino) on treema eikä [y], mutta saksa, turkki ja unkari
#      vievät tämän merkin selvällä enemmistöllä.
#   2. `ł ŭ → v`, VAIKKA SAKSALAINEN PAKETTI PITÄÄ `ł → l`. Puolan ł on [w],
#      eikä suomessa ole [w]:tä — mutta suomen v on approksimantti [ʋ], ja se
#      on juuri se äänne, jolla suomi lukee englannin w:n (Washington, Wales).
#      Saksassa w on frikatiivi, joten siellä ei ole mihin tähdätä; tässä on.
#      Sama kirjain, kaksi pakettia, kaksi oikeaa vastausta.
#   3. `ñ → nj`, MUTTA `ń ň ņ → n`. Kaikki neljä ovat [ɲ], joten äänne ei
#      ratkaise — ASEMA ratkaisee. Espanjan kieli ei koskaan päätä sanaa ñ:ään
#      (mañana → manjana, España → Espanja: suomen oma vakiintunut asu), kun
#      taas puolan, tšekin ja latvian vastineet seisovat sananlopussa jatkuvasti
#      (Poznań, Plzeň). Suomi ei salli sananloppuista konsonanttiyhtymää, joten
#      ääni joko nielaisee j:n tai lisää vokaalin — kumpikin muuttaa nimen
#      HAHMOA, mikä on suurempi virhe kuin liudennuksen menetys.
#
# LOPPU PYSYY ASCII:NA, JA SEKIN ON PÄÄTÖS. Kriteerillä on kaksi puolta ja
# molempien on pidettävä: LÄHTEEN on tarkoitettava yhtä äännettä niissä
# kielissä, joista se tulee (`ä` on kerran saksan [ɛ] ja kerran suomen [æ],
# `æ` tanskan [ɛ] ja islannin [ai], `ó` puolan [u], islannin [ou] ja espanjan
# painollinen [o] — siksi ne jäävät ennalleen), ja KOHTEEN on oltava jotain,
# jonka TÄMÄN paketin ääni lukee joka kerta samalla tavalla. Islannin ð pysyy
# d:nä: suomessa ei ole [ð] eikä sille kirjoitusasua (þ → th on eri asia — se
# on vakiintunut suomalainen asu).
#
# UUSI DIGRAFI ON VELKA, JONKA PAKETIN KOROSTUKSET MAKSAVAT. Translitteroiva
# korostus (kyrilliseen) kartoittaa yksittäisiä kirjaimia, joten sille
# tuntematon digrafi hajoaa: `sh` päätyi venäläiselle korostukselle muodossa
# `с` + `х`. Korjaus kuuluu KOROSTUKSEEN — yksi yksikkösääntö ennen jokaista
# lyhyempää siihen sisältyvää kuviota (`akcenty/rosyjski.yaml`). Se maksaa
# samalla vanhan velan, sillä sh ja tsh saapuivat jo ennestään tavallisessa
# suomenkielisessä tekstissä (shakki, tshekki).
#
# Rajaa vartioi `audyt_podstaw` (luokka `znaki-cel-obcy`): kohde saa olla
# ASCII tai alla olevan `alfabet`-kentän kirjain — ei koskaan kolmannen kielen
# kirjain.
# -----------------------------------------------------------------------------
