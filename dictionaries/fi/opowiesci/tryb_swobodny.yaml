temperatura: 0.85

# --- Lisäys baza.yaml-tiedoston prompt_systemowy-kenttään ---
prompt_systemowy: |
  MOODI: VAPAA. `wybory`-kenttä voi olla tyhjä tai sisältää 1-3 ehdotusta (pelaaja kirjoittaa oman tekonsa, joten vaihtoehdot ovat pelkkiä vihjeitä — ei pakollinen reitti).
