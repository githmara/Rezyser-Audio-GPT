  - { wzor: "Ý", zamiana: "Y"  }
  - { wzor: "Ÿ", zamiana: "Y"  }
  # -- Macrones de la romanización japonesa (Tōkyō, rāmen) → vocal base --
  - { wzor: "ā", zamiana: "a"  }
  - { wzor: "ē", zamiana: "e"  }
  - { wzor: "ī", zamiana: "i"  }
  - { wzor: "ō", zamiana: "o"  }
