# -----------------------------------------------------------------------------
# Alfabeto español — 27 letras mayúsculas (A–Z + Ñ).
# Utilizado por el cifrado de César. La Ñ no rompe el índice porque
# `.upper()` la convierte en un solo carácter (Ñ).
# -----------------------------------------------------------------------------
alfabet: "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ"

# -----------------------------------------------------------------------------
# Palabras disparadoras del analizador de acentos en la Biblia del Mundo
# (13.3+). core_rezyser.zastosuj_akcenty_uniwersalne construye una regex a
# partir de esta lista para reconocer frases «<palabra> X» o «X <palabra>».
# -----------------------------------------------------------------------------
slowo_akcent:
  - "acento"
  - "pronunciación"
