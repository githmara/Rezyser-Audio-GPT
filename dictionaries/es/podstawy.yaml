# =============================================================================
#  FUNDAMENTOS DE LA LENGUA ESPAÑOLA
# =============================================================================
#
#  Archivo base para `dictionaries/es/`. El motor Poliglota requiere que
#  cada lengua disponga de este fichero — sin él, una lengua nueva no se
#  reconoce siquiera por `dostepne_jezyki_bazowe()`.
#
#  Estructura análoga a `dictionaries/pl/podstawy.yaml`. El campo
#  `polskie_znaki`, pese a su nombre histórico, contiene TODOS los signos
#  diacríticos que deben normalizarse a ASCII antes de aplicar los
#  cifrados o las reglas de acentuación (el pre-pass del paquete).
#
#  Notas específicas del español:
#    - La «ñ» SÍ se incluye en `alfabet`, porque `.upper()` la transforma
#      en «Ñ» (un único carácter) — no rompe el índice del cifrado César.
#    - Las vocales acentuadas (á, é, í, ó, ú) y la diéresis (ü) se
#      tratan como variantes tonales: van a vocales sin acento en
#      `polskie_znaki` (no entran en `alfabet`).
# =============================================================================

id: podstawy
jezyk: es
# Enumeración lingua-language-detector (en mayúsculas, sin prefijo).
# Lista completa: https://github.com/pemistahl/lingua-py
lingua: SPANISH
etykieta: "Español – fundamentos fonéticos"
opis: |
  Reglas básicas para la lengua española:
    1. Normalización de los signos diacríticos (`polskie_znaki`) — para
       que el cifrado de César y los motores de acentuación traten
       correctamente los caracteres especiales (las vocales acentuadas
       á/é/í/ó/ú y la ü se reducen a su vocal base; otros diacríticos
       europeos también se aplanan a ASCII).
    2. Alfabeto español (27 letras: A–Z + Ñ) — utilizado por el cifrado
       de César. La Ñ se conserva como letra propia.

# -----------------------------------------------------------------------------
# Normalización de los signos diacríticos. Las vocales acentuadas españolas
# (á, é, í, ó, ú) y la ü pierden el acento; «ñ» NO se normaliza (es letra
# propia del alfabeto). Otros diacríticos europeos pasan a ASCII para que
# los acentos extranjeros vean, tras el pre-pass, una base
# limpia antes de aplicar sus propias transliteraciones.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# v19.7: EL DESTINO ES EL ESPAÑOL, NO LA LETRA BASE DESNUDA. Hasta la v19.6 cada
# letra extranjera caía a su letra base, y eso era empobrecimiento y no
# simplificación: este pre-pass corre ANTES de la lista `zamiany` de CADA acento
# del paquete, así que aplanar `š` a una `s` pelada tiraba a la basura la regla
# que los acentos tienen desde siempre — siete de los ocho archivos de
# `akcenty/` traen reglas para `ch`, los ocho para `ñ`, siete para `ll` y `j`,
# porque son los dígrafos del español (el inglés es el que no necesita regla
# para `ch`: esa voz ya lo lee [tʃ] sola).
# Una letra extranjera que lleva de forma ESTABLE un sonido que el español ya
# escribe recibe ahora esa escritura:
#     š ş ŝ ś č ĉ ċ ć → ch    ń ň ņ → ñ    ž ĵ đ ĝ ġ → y    ř → rch
#     ł ŭ → u    ç → s    þ → z    ĥ ħ → j    ţ → ts    ą → on    ę → en
#   Medido: „Škoda Dvořák señor Gdańsk" sale como „Chkoda Dvorchak señor
#   Gdañsk" y no como „Skoda Dvorak señor Gdansk"; con el acento ruso,
#   „Гданьск" en lugar de „Гданск", y „гарсон" en lugar de „гаркон".
#
# CUATRO DECISIONES QUE SON EL CONTENIDO DE ESTA LISTA:
#   1. `ñ` ES LETRA DE ESTE PAQUETE (está en `alfabet`), así que la `ń` polaca,
#      la `ň` checa y la `ņ` letona la reciben. Aquí NO hay la trampa de la
#      sílaba de más que obligó al inglés a dejar `ń → n`: la `ñ` es UNA letra
#      y „Poznañ" tiene las mismas sílabas que „Poznań".
#   2. EL ESPAÑOL NO TIENE /ʃ/ Y NO LO FINGE: lo toma prestado como /tʃ/ y lo
#      escribe `ch` (champú, chalé, chef). Por eso `š` y `č` comparten destino.
#      Lo que se pierde es una distinción que esta voz no sabe pronunciar de
#      todos modos; lo que se gana es que los acentos ya saben leer `ch`.
#   3. `ł ŭ → u` PORQUE EL ESPAÑOL SÍ ESCRIBE /w/, con `u` en diptongo, y en
#      las dos posiciones: „cuatro" [kwa], „auto" [aw]. La `ł` polaca es [w] en
#      las dos („Wałęsa → Wauensa", „Michał → Michau"). Único punto ciego: `gu`
#      y `qu` ante e/i se leen sin la [w] („Głębocki → Guenbocki"), pero el
#      pre-pass no puede mirar la letra siguiente.
#   4. `ž ĵ đ ĝ ġ → y` PERO `ź ż → z`, y lo decide la POSICIÓN, no el sonido
#      (la regla de la etapa 11). La `y` española es el único sonido palatal
#      sonoro del idioma — en medio mundo hispanohablante es literalmente [ʒ] —
#      pero a FINAL de palabra se lee como vocal („hoy", „muy"), y la `ź`/`ż`
#      polacas están en final de palabra constantemente („już", „też", „Łódź"):
#      „Lody" ganaría una sílaba que el nombre no tiene. Las demás (checa,
#      croata, esperanto, maltesa) no acaban palabra, así que se quedan con `y`.
#
# EL RESTO SIGUE EN ASCII Y ESO TAMBIÉN ES UNA DECISIÓN. El criterio tiene dos
# caras y ambas deben aguantar: el ORIGEN tiene que significar un sonido en las
# lenguas de las que viene (`ä` es [ɛ] alemana y [æ] finlandesa; `ó` es [u]
# polaca, [ou] islandesa y [o] tónica española), y el DESTINO tiene que ser algo
# que la voz de ESTE paquete lea igual cada vez. Por eso `ç → s` y no `c` (ante
# a/o/u la `c` es [k]: „garcon" sonaba /garkón/, un error real hasta hoy), y por
# eso `þ → z` y no `th` (la `z` castellana ES [θ], mientras que la `h` española
# es muda y „Thingvellir" se leía /tingvellir/). Por la misma razón `ĥ ħ → j`:
# la jota española es [x], el sonido que esas dos letras traen.
#
# El límite lo vigila `audyt_podstaw` (clase `znaki-cel-obcy`): el destino puede
# ser ASCII o una letra del `alfabet` de abajo (por eso se permite `ñ`), nunca
# una letra de un tercer idioma.
# -----------------------------------------------------------------------------
polskie_znaki:
  # -- Vocales acentuadas españolas → vocal base --
  - { wzor: "á", zamiana: "a"  }
  - { wzor: "Á", zamiana: "A"  }
  - { wzor: "é", zamiana: "e"  }
  - { wzor: "É", zamiana: "E"  }
  - { wzor: "í", zamiana: "i"  }
  - { wzor: "Í", zamiana: "I"  }
  - { wzor: "ó", zamiana: "o"  }
  - { wzor: "Ó", zamiana: "O"  }
  - { wzor: "ú", zamiana: "u"  }
  - { wzor: "Ú", zamiana: "U"  }
  - { wzor: "ü", zamiana: "u"  }
  - { wzor: "Ü", zamiana: "U"  }
  # -- Caracteres polacos: cada uno significa UN sonido en polaco y para cada
  #    uno el español tiene una escritura, así que escribimos esa escritura en
  #    vez de tirar el diacrítico. Excepciones: `ó` (origen inestable) y
  #    `ź ż` (posición final de palabra — ver la cabecera) --
  - { wzor: "ą", zamiana: "on" }
  - { wzor: "ć", zamiana: "ch" }
  - { wzor: "ę", zamiana: "en" }
  - { wzor: "ł", zamiana: "u"  }
  - { wzor: "ń", zamiana: "ñ"  }
  - { wzor: "ś", zamiana: "ch" }
  - { wzor: "ź", zamiana: "z"  }
  - { wzor: "ż", zamiana: "z"  }
  - { wzor: "Ą", zamiana: "On" }
  - { wzor: "Ć", zamiana: "Ch" }
  - { wzor: "Ę", zamiana: "En" }
  - { wzor: "Ł", zamiana: "U"  }
  - { wzor: "Ń", zamiana: "Ñ"  }
  - { wzor: "Ś", zamiana: "Ch" }
  - { wzor: "Ź", zamiana: "Z"  }
  - { wzor: "Ż", zamiana: "Z"  }
  # -- Diacríticos franceses / italianos / nórdicos → ASCII --
  - { wzor: "à", zamiana: "a"  }
  - { wzor: "â", zamiana: "a"  }
  - { wzor: "ã", zamiana: "a"  }
  - { wzor: "ä", zamiana: "a"  }
  - { wzor: "À", zamiana: "A"  }
  - { wzor: "Â", zamiana: "A"  }
  - { wzor: "Ã", zamiana: "A"  }
  - { wzor: "Ä", zamiana: "A"  }
  # -- å → o (la å sueca/noruega es [o], no [a]: Ångström → Ongstrom) --
  - { wzor: "å", zamiana: "o"  }
  - { wzor: "Å", zamiana: "O"  }
  # -- æ → ae --
  - { wzor: "æ", zamiana: "ae" }
  - { wzor: "Æ", zamiana: "Ae" }
  # -- ç → s (la cedilla francesa es [s]; ante a/o/u la `c` española es [k]) --
  - { wzor: "ç", zamiana: "s"  }
  - { wzor: "Ç", zamiana: "S"  }
  # -- ð → d (islandés) --
  - { wzor: "ð", zamiana: "d"  }
  - { wzor: "Ð", zamiana: "D"  }
  # -- e con otros acentos (francés, italiano) → e --
  - { wzor: "è", zamiana: "e"  }
  - { wzor: "ê", zamiana: "e"  }
  - { wzor: "ë", zamiana: "e"  }
  - { wzor: "È", zamiana: "E"  }
  - { wzor: "Ê", zamiana: "E"  }
  - { wzor: "Ë", zamiana: "E"  }
  # -- i con otros acentos → i --
  - { wzor: "ì", zamiana: "i"  }
  - { wzor: "î", zamiana: "i"  }
  - { wzor: "ï", zamiana: "i"  }
  - { wzor: "Ì", zamiana: "I"  }
  - { wzor: "Î", zamiana: "I"  }
  - { wzor: "Ï", zamiana: "I"  }
  # -- o con otros acentos → o --
  - { wzor: "ò", zamiana: "o"  }
