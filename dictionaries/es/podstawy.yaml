  - { wzor: "Ö", zamiana: "O"  }
  - { wzor: "Ø", zamiana: "O"  }
  # -- œ → oe --
  - { wzor: "œ", zamiana: "oe" }
  - { wzor: "Œ", zamiana: "Oe" }
  # -- ß → ss (alemán) --
  - { wzor: "ß", zamiana: "ss" }
  - { wzor: "ẞ", zamiana: "SS" }
  # -- þ → z (islandés): la `z` castellana ES [θ], el mismo sonido; la `h`
  #    española es muda, así que `th` se leía simplemente [t] --
  - { wzor: "þ", zamiana: "z"  }
  - { wzor: "Þ", zamiana: "Z"  }
  # -- u con otros acentos → u --
  - { wzor: "ù", zamiana: "u"  }
  - { wzor: "û", zamiana: "u"  }
  - { wzor: "Ù", zamiana: "U"  }
  - { wzor: "Û", zamiana: "U"  }
  # -- y con acento → y --
  - { wzor: "ý", zamiana: "y"  }
