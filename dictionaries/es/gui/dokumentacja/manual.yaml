  - Carga automática del modo creativo (NUEVO). Al cargar un proyecto, la aplicación restaura automáticamente el último modo de trabajo utilizado (Guion o Audiolibro) desde un archivo de metadatos gestionado por la aplicación. De esta manera, al reabrir el proyecto, el RadioBox se configura solo, sin necesidad de recordar en qué modo estabas trabajando.

