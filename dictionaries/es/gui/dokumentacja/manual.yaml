  - Optimización completa para lectores de pantalla (NVDA, VoiceOver) — nombres de accesibilidad en polaco, orden de tabulación correcto.
  - Protección del modo creativo contra cambios accidentales durante el trabajo.
  - Reinicio Completo del proyecto con un solo clic en el Director.
  - Carga automática del modo creativo desde el archivo de metadatos del proyecto.
  - Todos los acentos de versiones anteriores (Inglés, Francés, Alemán, Español, Italiano, Finés, Islandés) y Reparador de Etiquetas.
  - Funciones completas de IA: Brainstorming, Guion, Audiolibro, Acumulador de Trama, Memoria Infinita, Asignación de Títulos.
