  - Generador automático del archivo de configuración golden_key.env integrado directamente en la interfaz principal de la aplicación. El usuario ya no necesita crear manualmente el archivo ni preocuparse por la trampa de la extensión .txt — basta con un clic en el botón disponible en la pantalla de inicio, y el sistema crea un archivo limpio y listo en el lugar correcto.
  - Eliminación completa del script obsoleto napraw_api.bat, que ya no es necesario. El problema que este script resolvía (extensión de archivo incorrecta asignada por el Bloc de notas) ahora está completamente eliminado gracias al generador integrado.
  - Multilibro del Libro del Mundo — cada proyecto ahora tiene su propio archivo de lore (NUEVO). Antes existía un solo archivo compartido mi_lore.md, que se cargaba cada vez que se iniciaba la aplicación — independientemente del proyecto en el que estuvieras trabajando. Desde la versión 10, el Libro del Mundo está estrictamente vinculado al nombre del archivo del proyecto: si tu historia es guiones/emilia_heist_audiobook.txt, su Libro es guiones/emilia_heist_audiobook.md. El botón "Guardar Libro permanentemente" está desactivado hasta que ingreses el nombre del archivo — el orden es intencional y forzado por la interfaz. Hacer clic en "Cargar historia" carga automáticamente el archivo .md correspondiente desde el disco, si existe. El cambio también tiene una dimensión práctica organizativa: ahora puedes llevar varios proyectos a la vez, y cada uno tendrá sus propias reglas del mundo y lista de personajes aisladas — sin riesgo de que Emilia del atraco al tesoro termine en una ópera espacial.

