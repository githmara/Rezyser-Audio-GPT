  Nuevas funciones y cambios en la versión 13.0 — Release Candidate

  - Refactorización a YAML — acentos, cifrados y modos del Director en archivos de texto (CAMBIO ARQUITECTÓNICO, el mayor desde la migración a wxPython). Hasta la versión 12.0, todas las reglas fonéticas (acentos) y modos creativos del Director (Brainstorming, Guion, Audiolibro, postproducción de títulos) estaban "codificadas" en Python como constantes, funciones y cadenas rígidas de prompts, y toda la categoría de cifrados/juegos de texto simplemente no existía — se introducen junto con el refactor 13.0. En la versión 13.0, todo esto se encuentra en archivos .yaml en la nueva carpeta `dictionaries/` — el motor (`core_poliglota.py`, `core_rezyser.py`, `przepisy_rezysera.py`) los carga dinámicamente al inicio. Efecto práctico: añadir un nuevo acento, un nuevo cifrado basado en sustituciones o cambiar el tono del prompt del sistema para algún modo del Director no requiere conocimientos de Python — basta con un editor de texto. Una breve descripción para los usuarios finales se encuentra en `docs/dictionaries.pl.txt` (incluido en los paquetes de Releases); la documentación técnica completa del formato — en `dictionaries/README.md` (solo en el repositorio Git, ya que los paquetes de lanzamiento filtran los archivos .md).

  - Gestor de Reglas — cuarta herramienta en la barra (NUEVO, Ctrl+4). Explorador visual de la carpeta `dictionaries/` con un árbol de archivos YAML (wx.TreeCtrl nativo, soporte completo para NVDA) y un conjunto de acciones: "Abrir en editor de texto", "Nuevo archivo de reglas..." (asistente con selección de tipo: acento, cifrado, modo, nuevo idioma), "Duplicar archivo seleccionado", "Eliminar archivo", "Actualizar árbol". Para casos que van más allá de simples sustituciones (nuevo idioma base, cifrado algorítmico), el asistente genera un prompt listo para copiar para el chatbot de IA — explicación completa en el nuevo PASO 7b.

  - Prompt del Arquitecto directamente en el panel del Director (CAMBIO A11y). Hasta ahora, el prompt para el chatbot externo para generar el Libro del Mundo solo existía en esta instrucción — el usuario tenía que copiarlo de un archivo de texto (lo cual puede ser problemático con lectores de pantalla debido a caracteres polacos y comillas). En la versión 13.0, el panel del Director tiene un nuevo botón "📖 Prompt del Arquitecto para IA..." (justo debajo de "Guardar Libro permanentemente"), que abre una ventana de diálogo nativa con el texto completo del prompt en un campo READONLY y un botón separado "Copiar al portapapeles". El patrón A11y es idéntico al del diálogo de resultados del asistente en el Gestor de Reglas — NVDA lee inmediatamente todo el contenido de la ventana sin configuración adicional. Descripción completa en el actualizado PASO 7.

  - Acento ruso en el Políglota (NUEVO — octavo idioma europeo en el menú del Modo Director). Se añade la opción "Ruso (por ejemplo, Milena / Irina / Yuri / Pavel)" a la lista desplegable "Modo Director / Acentos". A diferencia de los otros acentos, que solo "deforman" el texto polaco a nivel de letras latinas (por ejemplo, "sz" → "sh", "w" → "v"), el acento ruso realiza una transliteración completa del texto polaco al cirílico — permitiendo que las voces TTS en ruso (Vocalizer Milena, OneCore Irina / Pavel / Yuri, eSpeak "ru") puedan "pronunciar" las palabras. Se ha enriquecido el mapeo con vocales palatalizadas ("ja" → "я", "je" → "е", "jo" → "ё", "ju" → "ю"), suavizaciones polacas si/ci/ni/zi + vocal (por ejemplo, "ciocia" → "цёця"), así como dígrafos especiales rusos: "ść" / "szcz" → "щ", "sz" → "ш", "cz" → "ч", "rz" → "ж", "ch" → "х".

    Nota fonética: El acento no es una transliteración académica rusa (ISO 9, GOST, BGN/PCGN). El objetivo es únicamente hacer que el texto polaco suene más ruso — para fines de síntesis de voz, no para una transliteración seria de nombres propios. Para este último trabajo, utiliza herramientas lingüísticas dedicadas.

    Código de idioma para el archivo resultante: "ru" (ISO 639-1). NVDA con la opción "Cambiar idioma automáticamente cuando sea compatible" activada cambiará inmediatamente a la voz rusa.

  - Nota sobre "ź": En ruso no hay un equivalente exacto del polaco "ź", por lo que este carácter se normaliza a "ж" — al igual que "ż". Algunos dialectos del norte de Rusia y el bielorruso pronuncian "ź" más cerca de "зь", pero desde la perspectiva del sintetizador de voz, la diferencia es insignificante. Si un lingüista considera que prefiere "зь", puede reemplazar esta única regla en el archivo `dictionaries/pl/akcenty/rosyjski.yaml` — el motor carga YAMLs dinámicamente, por lo que no requiere recompilar la aplicación.

  - Barra de navegación ampliada y menú de Herramientas (CAMBIO). La barra ahora tiene un cuarto botón — Gestor de Reglas — y el menú "Herramientas" soporta el nuevo atajo Ctrl+4. Los atajos existentes (Ctrl+0 Página principal, Ctrl+1 Director, Ctrl+2 Políglota, Ctrl+3 Convertidor) permanecen sin cambios.

  - Botón "Actualizar acentos del Director desde YAML" en la Página principal (NUEVO). Después de añadir un nuevo acento a través del Gestor de Reglas (o editar manualmente un archivo YAML), hacer clic en este botón recargará los wrappers acento_* en el motor del Políglota y del Director, para que el nuevo acento sea visible en el menú y en la detección automática de acentos basada en etiquetas de personajes en el Libro del Mundo. El Políglota detecta YAMLs automáticamente (sin actualización), pero el Director necesita regenerar los wrappers — generalmente después de actualizar, es necesario reiniciar la aplicación.

