  - Barra de navegación con teclas de acceso rápido (NUEVO). Las herramientas se cambian mediante tres botones en la barra (Director, Políglota, Convertidor) o a través del menú Herramientas. Atajos de teclado disponibles: Ctrl+0 (Página principal con System Check), Ctrl+1 (Director), Ctrl+2 (Políglota), Ctrl+3 (Convertidor). La herramienta activa se destaca visualmente con un botón en negrita.

