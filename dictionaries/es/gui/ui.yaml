    El modo libre te permite intentar cualquier acción ingresada en el campo inferior. El modo de elecciones ofrece 3-5 opciones numeradas para elegir con botones. El modo "menor mal" presenta solo elecciones desfavorables: eliges lo que te conviene menos. Los comandos que comienzan con una barra inclinada (/guardar, /cargar, /configuración, /fin, /visualizar) funcionan en cualquier momento.

