home:
  panel_name: "Panel de inicio – Página principal"
  welcome_text: |-
    Este es tu estudio de grabación integrado.
    Selecciona una herramienta de la barra de botones o del menú Herramientas:

      •  Director       –  Escribe guiones y prosa con IA; gestiona dinámicamente el Libro del Mundo.
      •  Políglota     –  Aplica acentos fuertes para sintetizadores locales (NVDA/Vocalizer) y traduce textos.
      •  Convertidor     –  Crea rápidamente archivos Word profesionales con encabezados de nivel 1.
      •  Gestor de Reglas –  Explora y crea reglas de diccionario sin entrar manualmente en archivos YAML.
  heading_system_check: "System Check"
  checking: "Verificando configuración…"
  # Błędy walidacji golden_key.env
  err_brak_pliku: |-
    🚨 ¡Falta el archivo de configuración del entorno!

    Se detectó el primer inicio del programa. Los módulos están bloqueados por razones de seguridad.
    Para desbloquear todas las herramientas, haz clic en el botón de abajo: el programa generará automáticamente el archivo golden_key.env y lo abrirá en el editor de texto predeterminado.
  err_odczyt: "🚨 No se pudo leer el archivo golden_key.env:\n{tresc_bledu}"
  err_struktura: |-
    🚨 ¡Error en la estructura del archivo!
    Falta el parámetro requerido OPENAI_API_KEY=.
    Probablemente eliminaste el signo igual o el nombre de la variable.
    Elimina el archivo, genéralo nuevamente y pega la clave con más cuidado.
  err_tekst_zastepczy: |-
    ⚠️ ¡Clave no ingresada!
    El archivo golden_key.env todavía contiene texto de marcador de posición.
    Abre el archivo en un editor de texto, elimina el texto de marcador de posición y pega tu clave API real.
  err_cudzyslowy: |-
    🚨 ¡Comillas innecesarias alrededor de la clave!
    La clave API se pegó entre comillas (por ejemplo, "sk-…").
    Abre el archivo en un editor de texto y elimina las comillas —
    la clave debe estar escrita directamente después del signo '=', sin caracteres adicionales.
  err_niedozwolone_znaki: |-
    🚨 ¡Caracteres no permitidos alrededor de la clave!
    Se detectó un espacio u otro carácter invisible antes o después de la clave API.
    Abre el archivo en un editor de texto y asegúrate de que el valor comience
    inmediatamente después del signo '=', sin espacios.
  err_format: |-
    🚨 ¡Formato de clave sospechoso!
    Una clave OpenAI válida siempre comienza con los caracteres sk- (por ejemplo, sk-proj-…).
    Asegúrate de haber copiado la cadena correcta y que no haya espacios antes de ella.
  err_zbyt_krotki: |-
    ⚠️ La clave parece demasiado corta (se detectaron {liczba_znakow} caracteres, se esperaban al menos {minimum_znakow}).
    Probablemente solo copiaste un fragmento de la clave.

    Si ya cerraste la ventana con la clave en platform.openai.com,
    debes volver a la cuenta, usar la opción 'Revocar clave secreta' para esta
    clave truncada y generar una nueva. Recuerda copiar la clave completa antes de hacer clic en 'Hecho'.
  ok_klucz_wykryty: |-
    ✅ Clave API (golden_key.env) detectada y correctamente formateada.
    Todos los módulos están listos para funcionar.
  # Przyciski akcji panelu startowego
  btn_generate: "Generar archivo golden_key.env y abrir editor de texto"
  btn_open: "📝 Abrir archivo golden_key.env en editor de texto"
  blad_tworzenia_env_tytul: "Error"
  blad_tworzenia_env_tresc: "No se pudo crear el archivo golden_key.env:\n{tresc_bledu}"
  ok_plik_wygenerowany: |-
    ✅ ¡Archivo {nazwa_pliku} generado!
    El editor de texto se abre automáticamente.
    Pega tu clave API, guarda el archivo (Ctrl+S) y reinicia la aplicación.
  blad_otwarcia_pliku_tytul: "Información"
  blad_otwarcia_pliku_tresc: "No se pudo abrir el archivo automáticamente.\nÁbrelo manualmente:\n{sciezka_pliku}"
  # Posproducción de audio (ElevenLabs) — opcional (v16.0)
  heading_elevenlabs: "Posproducción de audio (ElevenLabs) — opcional"
  el_brak: |-
    ℹ️ La clave de ElevenLabs no está configurada (opcional).
    El puente con ElevenLabs Studio está inactivo — el resto del programa funciona con normalidad.
    Para activarlo, añade en golden_key.env la línea ELEVENLABS_API_KEY=sk_… (una clave con guion bajo).
  el_placeholder: |-
    ⚠️ ¡No se ha introducido la clave de ElevenLabs!
    En golden_key.env sigue estando el texto de marcador.
    Abre el archivo, elimina el marcador y pega tu clave de ElevenLabs (sk_…) — o borra la línea si no quieres esta función.
  el_cudzyslowy: |-
    🚨 ¡Comillas innecesarias alrededor de la clave de ElevenLabs!
    La clave se pegó entre comillas. Abre golden_key.env y elimina las comillas —
    el valor debe escribirse directamente después del signo '=', sin caracteres adicionales.
  el_spacje: |-
    🚨 ¡Caracteres no permitidos alrededor de la clave de ElevenLabs!
    Se detectó un espacio u otro carácter invisible antes o después de la clave.
    Abre golden_key.env y asegúrate de que el valor empiece inmediatamente después del signo '='.
  el_format: |-
    🚨 ¡Formato sospechoso de la clave de ElevenLabs!
    Una clave de ElevenLabs siempre empieza por sk_ (con GUION BAJO, no sk- como OpenAI).
    Asegúrate de haber pegado una clave de ElevenLabs y no de otra plataforma.
  el_zbyt_krotki: |-
    ⚠️ La clave de ElevenLabs parece demasiado corta (se detectaron {liczba_znakow} caracteres, se esperaban al menos {minimum_znakow}).
    Probablemente copiaste solo una parte de la clave. Genera una nueva clave en el panel de ElevenLabs y pégala completa.
  el_ok: |-
    ✅ Clave de ElevenLabs detectada y con el formato correcto.
    El puente con ElevenLabs Studio (posproducción de audio) está activo en el panel del Director.
  # Sekcja: Narzędzia słownikowe
  heading_narzedzia_slownikowe: "Herramientas de diccionario"
  narzedzia_slownikowe_name: "Descripción de herramientas de diccionario"
  tools_info: |-
    ¿Quieres añadir un nuevo acento, cifrado o modo de Director?
    Abre el Gestor de Reglas (Ctrl+4) – encontrarás allí un árbol de todos los archivos YAML en dictionaries/ y un creador que generará automáticamente una plantilla o un prompt para el chatbot de IA.

    Después de añadir un nuevo ACENTO, haz clic adicionalmente en el botón "Actualizar acentos de Director desde YAML" a continuación – esto permitirá al Modo de Director notar el nuevo acento (Políglota detecta los YAML automáticamente). Después de actualizar, reinicia la aplicación.
  btn_open_manager_label: "📚 Abrir Gestor de Reglas"
  btn_open_manager_name: "Botón Abrir Gestor de Reglas"
  btn_open_manager_tooltip: "Va al Gestor de Reglas – explorador de archivos YAML y creador de nuevos acentos / modos / cifrados (Ctrl+4)."
  btn_odswiez_label: "🔄 Actualizar acentos de Director desde YAML"
  btn_odswiez_name: "Botón Actualizar acentos de Director desde YAML"
  btn_odswiez_tooltip: "Escanea dictionaries/*/akcenty/ y regenera los envoltorios akcent_* en core_poliglota.py y core_rezyser.py. Después de una actualización exitosa, es necesario reiniciar la aplicación."
  # Raport po kliknięciu „Odśwież akcenty Reżysera z YAML"
  raport_niespodziewany_tytul: "Error al actualizar acentos"
  raport_niespodziewany_tresc: "Se produjo un error inesperado:\n{tresc_bledu}"
  raport_tytul_blad: "Actualizar acentos de Director – ERROR"
  raport_header_blad: "⛔ El generador encontró errores – ver log a continuación."
  raport_tytul_sukces: "Actualizar acentos de Director – Éxito"
  raport_header_sukces: |-
    ✅ Archivos modificados para {liczba_akcentow} acentos.
    Para que los nuevos acentos aparezcan en el Modo de Director, reinicia la aplicación.
  raport_tytul_bez_zmian: "Actualizar acentos de Director – Sin cambios"
  raport_header_bez_zmian: "ℹ️ Sin cambios. Se detectaron {liczba_akcentow} acentos – los envoltorios ya están actualizados."
  raport_lbl_log: "Log completo (Ctrl+A, Ctrl+C copia al portapapeles):"
  raport_log_name: "Log del generador de acentos de Director"

# -----------------------------------------------------------------------------
# REZYSER – panel modułu Reżyser (gui_rezyser.py)
# -----------------------------------------------------------------------------
rezyser:
  panel_name: "Panel de Director de Audio GPT"
  heading: "🎬  Director de Audio GPT – Estudio Creativo Híbrido"
  description_name: "Descripción del módulo Director de Audio GPT"
  tool_description: |-
    Director de Audio GPT es un estudio creativo híbrido.

    Modo Tormenta de Ideas  – planifica la trama, genera 3 opciones (SIN guardar en archivo).
    Modo Guion        – escribe un guion de audio crudo con etiquetas [SFX] y [Personaje: emoción] (GUARDAR EN ARCHIVO).
    Modo Audiolibro     – genera prosa literaria densa y clásica (GUARDAR EN ARCHIVO).

    Los proyectos se guardan en la subcarpeta 'skrypty/' junto al programa.
    Proporciona el nombre del proyecto SIN extensión (por ejemplo, cronicas_arkonii).
    Para cambiar de proyecto, primero debes limpiar la memoria actual.
  prompt_architekta_content: |-
    Eres un destacado arquitecto de mundos (Worldbuilder) y consultor literario. Tengo una idea vaga para una trama: [ESCRIBE TU IDEA AQUÍ]. Tu tarea es expandir esto a un "Libro del Mundo" profesional.
    Ajusta el tono y las reglas a mi idea. Evita atajos baratos y clichés de IA.

    REGLAS DE FORMATO (CRÍTICAS):
    Debes devolver la respuesta en dos partes separadas:

    PARTE 1: LIBRO DEL MUNDO
    Esta parte debe estar encerrada en UN bloque de código Markdown (usa los marcadores ```markdown al principio y ``` al final). Dentro del bloque de código, sigue estas reglas:
    1. Comienza con un emoji de libro abierto y un título de trabajo, por ejemplo, 📖 Libro del Mundo: [Título].
    2. Usa un solo hashtag (#) para las secciones principales (por ejemplo, # Reglas del Mundo, # Personajes).
    3. Usa doble hashtag (##) para subsecciones.
    4. Usa guiones (-) para crear listas legibles.
    5. Usa doble asterisco (**texto**) para resaltar reglas absolutas e inquebrantables (por ejemplo, **El héroe NUNCA miente**).
    6. Describe la psicología de los personajes, sus mayores defectos y motivaciones. Para personajes de idiomas extranjeros, añade información sobre el acento directamente en la etiqueta, por ejemplo, `[Speaker 1: Nombre] - cecea y tiene acento francés`. **Consejo técnico:** El uso de la palabra clave `acento` es absolutamente necesario, ya que un script externo de la aplicación detecta automáticamente y aplica las reglas fonéticas correctas a los diálogos de ese personaje.

    PARTE 2: RECOMENDACIÓN DE MODO
    Esta parte debe colocarse FUERA del bloque de código, como texto normal debajo. Aconséjame cuál de los modos de mi aplicación será el mejor para realizar esta idea: 🎬 Modo de Guion Crudo (dramas de audio, SFX, fonética), o 📖 Modo de Audiolibro Tradicional (prosa literaria clásica).

  # Pasek pliku
  lbl_nazwa_pliku: "Nombre del archivo del proyecto (sin extensión, por ejemplo, cronicas_arkonii):"
  txt_nazwa_pliku_name: "Campo de nombre del archivo del proyecto"
  txt_nazwa_pliku_hint: "por ejemplo, cronicas_arkonii"
  txt_nazwa_pliku_tooltip: |-
    Introduce el nombre del proyecto SIN extensión.
    Archivo de historia guardado como: skrypty/<nombre>.txt
    Campo bloqueado cuando la memoria está ocupada.
  btn_wczytaj_label: "Cargar historia"
  btn_wczytaj_tooltip: |-
    Carga un archivo de proyecto existente (skrypty/<nombre>.txt) en la memoria.
    Activo solo cuando la memoria está vacía y se ha proporcionado un nombre.
  btn_wyczysc_biezaca_label: "Limpiar actual (dejar Resumen)"
  btn_wyczysc_biezaca_tooltip: |-
    Limpia solo la historia actual de la memoria.
    El Resumen (Memoria a Largo Plazo) y el Libro del Mundo se conservan.
    Úsalo para continuar un libro largo después de generar un resumen.
  btn_hard_reset_label: "Cerrar Proyecto (Reinicio Completo)"
  btn_hard_reset_tooltip: |-
    Limpieza COMPLETA del proyecto: historia, resumen, Libro del Mundo.
    Restablece todos los contadores y desbloquea el campo de nombre del archivo.
    Úsalo al cambiar de proyecto o para una historia completamente nueva.
  # Sidebar
  sidebar_heading: "📖 Barra Lateral del proyecto"
  lbl_ksiega_swiata: "Libro del Mundo – Reglas y Personajes:"
  txt_ksiega_name: "Campo del Libro del Mundo – reglas y personajes"
  txt_ksiega_hint: |-
    Introduce las reglas del mundo, la descripción de los personajes y sus acentos fonéticos…
    Por ejemplo, [Geralt: acento islandés]
    El contenido se adjunta a cada consulta de IA.
  txt_ksiega_tooltip: |-
    Contexto siempre adjunto a la IA: reglas del mundo, personajes, acentos fonéticos.
    Guardar en disco requiere proporcionar el nombre del archivo del proyecto.
  btn_zapisz_ksiege_label: "💾 Guardar Libro permanentemente"
  btn_zapisz_ksiege_tooltip: |-
    Guarda el Libro del Mundo en un archivo: skrypty/<nombre>.md
    Requiere proporcionar el nombre del archivo del proyecto.
  btn_prompt_architekta_label: "📖 Prompt del Arquitecto para IA…"
  btn_prompt_architekta_name: "Botón Mostrar Prompt del Arquitecto para chatbot externo"
  btn_prompt_architekta_tooltip: |-
    Abre una ventana con un prompt listo para un chatbot externo (ChatGPT, Claude).
    Pega tu idea de trama, y la IA generará un Libro del Mundo profesional formateado en Markdown – para pegar en el campo "Libro del Mundo" de arriba.
  lbl_pamiec_dlugotrwala: "🧠 Memoria a Largo Plazo (Resumen):"
  txt_pamiec_name: "Campo de Memoria a Largo Plazo – resumen de eventos"
  txt_pamiec_hint: |-
    Aquí la IA guardará el resumen cuando la memoria esté llena.
    También puedes editarlo manualmente.
  txt_pamiec_tooltip: |-
    Resumen de eventos anteriores adjunto a cada consulta de IA.
    Permite continuar la historia sin las limitaciones de la ventana de contexto del modelo.
  btn_zapisz_pamiec_label: "💾 Guardar Resumen"
  btn_zapisz_pamiec_tooltip: |-
    Guarda el resumen en un archivo: skrypty/<nombre>_resumen.txt
    Después de guardar, puedes limpiar la memoria actual de forma segura.
  # Obszar roboczy
  main_heading: "🎬 Área de Trabajo"
  rb_tryb_label: "Modo de trabajo:"
  rb_tryb_name: "Selección de modo de trabajo de IA"
  rb_tryb_tooltip: |-
    Tormenta de Ideas – planificación sin guardar en archivo.
    Guion        – guion de audio crudo (guardado en archivo).
    Audiolibro     – prosa literaria tradicional (guardada en archivo).
  # 13.2: komunikaty fallbacku reżysera (gdy brak reguł dla języka UI ani EN)
  brak_trybow_dla_jezyka: |-
    Para el idioma "{jezyk}" no se encontraron modos de director de IA ni fallback
    en inglés (dictionaries/en/rezyser/). Añade un archivo YAML con el modo
    a la carpeta de reglas del idioma o restaura el paquete predeterminado en inglés.
  brak_trybow_tytul: "Faltan modos de director"
  placeholder_brak_trybow: "(sin modos para seleccionar)"
  # Panel struktury
  struktura_heading: "✂️ Gestión de Estructura"
  btn_prolog_label: "📜 Insertar Prólogo"
  btn_prolog_name: "Botón Insertar Prólogo"
  btn_prolog_tooltip: |-
    Inserta el encabezado 'Prólogo' al comienzo de la historia.
    Posible solo cuando la historia está vacía. Requiere nombre del proyecto.
  btn_epilog_label: "🏁 Insertar Epílogo"
  btn_epilog_name: "Botón Insertar Epílogo"
  btn_epilog_tooltip: |-
    Inserta el encabezado 'Epílogo' al final de la historia.
    Bloquea la adición de contenido después del Epílogo.
  btn_rozdzial_label: "✂️ Insertar corte (Capítulo {numer_rozdzialu})"
  btn_rozdzial_name: "Botón Insertar Capítulo"
  btn_rozdzial_tooltip: |-
    Inserta el encabezado del siguiente capítulo en la historia y el archivo.
    Disponible solo en modo Audiolibro.
  btn_akt_label: "🎭 Insertar Acto {numer_aktu}"
  btn_akt_name: "Botón Insertar Acto"
  btn_akt_tooltip: |-
    Inserta el encabezado 'Acto N' y automáticamente 'Escena 1' en la historia y el archivo.
    Disponible solo en modo Guion.
  btn_scena_label: "🎬 Insertar Escena {numer_sceny}"
