  welcome_text: |-
    Este es tu estudio de grabación integrado.
    Selecciona una herramienta de la barra de botones o del menú Herramientas:

      •  Director       –  Escribe guiones y prosa con IA; gestiona dinámicamente el Libro del Mundo.
      •  Políglota     –  Aplica acentos fuertes para sintetizadores locales (NVDA/Vocalizer) y traduce textos.
      •  Convertidor     –  Crea rápidamente archivos Word profesionales con encabezados de nivel 1.
      •  Gestor de Reglas –  Explora y crea reglas de diccionario sin entrar manualmente en archivos YAML.
  heading_system_check: "System Check"
  checking: "Verificando configuración…"
  # Błędy walidacji golden_key.env
  err_brak_pliku: |-
    🚨 ¡Falta el archivo de configuración del entorno!

    Se detectó el primer inicio del programa. Los módulos están bloqueados por razones de seguridad.
    Para desbloquear todas las herramientas, haz clic en el botón de abajo: el programa generará automáticamente el archivo golden_key.env y lo abrirá en el editor de texto predeterminado.
  err_odczyt: "🚨 No se pudo leer el archivo golden_key.env:\n{tresc_bledu}"
  err_tekst_zastepczy: |-
    ⚠️ ¡Clave no ingresada!
    El archivo golden_key.env todavía contiene texto de marcador de posición.
    Abre el archivo en un editor de texto, elimina el texto de marcador de posición y pega tu clave API real.
  err_cudzyslowy: |-
    🚨 ¡Comillas innecesarias alrededor de la clave!
    La clave API se pegó entre comillas (por ejemplo, "sk-…").
    Abre el archivo en un editor de texto y elimina las comillas —
    la clave debe estar escrita directamente después del signo '=', sin caracteres adicionales.
  err_niedozwolone_znaki: |-
    🚨 ¡Caracteres no permitidos alrededor de la clave!
    Se detectó un espacio u otro carácter invisible antes o después de la clave API.
    Abre el archivo en un editor de texto y asegúrate de que el valor comience
    inmediatamente después del signo '=', sin espacios.
  ok_klucz_wykryty: |-
    ✅ Clave API (golden_key.env) detectada y correctamente formateada.
    Todos los módulos están listos para funcionar.
