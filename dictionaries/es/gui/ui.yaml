    Después de guardar, puedes limpiar la memoria actual de forma segura.
  # Obszar roboczy
  main_heading: "🎬 Área de Trabajo"
  rb_tryb_label: "Modo de trabajo:"
  rb_tryb_name: "Selección de modo de trabajo de IA"
  rb_tryb_tooltip: |-
