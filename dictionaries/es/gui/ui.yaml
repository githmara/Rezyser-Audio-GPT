  otworz_narracje_ostrzezenie_tytul: Edición del archivo de narración — riesgo de desincronización del estado
  otworz_narracje_ostrzezenie_tresc: "Estás a punto de abrir el archivo de narración (.txt) en el editor del sistema.\n\nATENCIÓN: el archivo .txt solo contiene texto de narración para TTS, mientras que el estado del juego (personajes, ubicación, inventario, tramas abiertas) vive en un archivo separado .game.json. Editar .txt no actualiza el estado — la siguiente ronda de LLM recibirá el mundo antes de tu edición, por lo que puede haber una desincronización semántica (por ejemplo, describiste que un personaje murió, pero en el estado del juego todavía vive).\n\nCaso típico seguro: escribir la escena de cierre cuando la IA no quiere terminar la historia (alternativa a la opción \"Editar modo de juego…\" → Libre).\n\n¿Continuar?"
  blad_otwarcia_tytul: No se pudo abrir el archivo
  blad_otwarcia_tresc: "El intento de abrir el archivo {sciezka_pliku} resultó en un error:\n{tresc_bledu}\n\nAbre el archivo manualmente desde el Explorador de archivos."
  plik_narracji_brak_tytul: Falta el archivo de narración
  plik_narracji_brak_tresc: El archivo de narración del juego "{nazwa}" no existe en el disco. El archivo de narración se crea después del primer turno — envía la primera acción para que el motor de narración cree el archivo.
  # v15.5: Actualizar desde el disco — sincroniza la memoria interna tras la
  # edición manual de opowiesci/<nazwa>.txt (p. ej. recortar un corte cinematográfico roto).
  btn_odswiez_z_dysku_label: "Act&ualizar desde el disco"
  btn_odswiez_z_dysku_tooltip: "Vuelve a cargar el archivo de narración (opowiesci/<nazwa>.txt) y sincroniza la memoria interna con tus cambios manuales — sin un reinicio completo ni recargar el juego. El final reciente pasa al contexto del motor; el resumen existente de los turnos anteriores queda intacto. ATENCIÓN: el estado del juego (personajes, ubicación, inventario) en .game.json NO se actualiza — el siguiente turno puede desincronizarse si has cambiado hechos del mundo."
  odswiez_z_dysku_tytul: "Narración actualizada desde el disco"
  odswiez_calosc_tresc: "La narración se volvió a cargar desde el disco y el contexto del motor se sincronizó con el final del texto.\n\nATENCIÓN: el estado del juego (personajes, ubicación, inventario, tramas) en .game.json NO se ha modificado — si la edición cambió hechos del mundo, el siguiente turno puede desincronizarse."
  odswiez_streszczenie_tresc: "El contexto del motor se actualizó con el final reciente del disco. El resumen de los turnos anteriores queda intacto, así que el próximo resumen y turno no se construirán sobre datos obsoletos.\n\nATENCIÓN: el estado del juego en .game.json NO se ha modificado — si cambias hechos del mundo, el siguiente turno puede desincronizarse."
  odswiez_zajete_tytul: "Operación en curso"
  odswiez_zajete_tresc: "Se está generando un turno o un resumen. Espera a que la operación termine antes de actualizar la narración desde el disco."
  btn_edytuj_stan_label: Editar estado del &juego…
  btn_edytuj_stan_tooltip: 'Abre el archivo de estado del juego (.game.json) para edición directa en una ventana con validación JSON. Para avanzados: permite corregir manualmente personajes, ubicación, equipamiento, tramas y contadores cuando la edición manual de la narrativa se ha desincronizado con el estado estructural. ADVERTENCIA: una edición incorrecta puede dañar el guardado — los cambios se validan como JSON antes de guardar, pero la corrección del contenido (coherencia de los campos) es tu responsabilidad.'
  dlg_edytuj_stan_tytul: Edición del estado del juego (.game.json)
  dlg_edytuj_stan_lbl: 'Estado del juego en bruto en formato JSON. Edita con cuidado: después de guardar, el juego se recargará desde este archivo. El contenido debe seguir siendo un objeto JSON válido, de lo contrario, el guardado será rechazado.'
  dlg_edytuj_stan_name: Campo de edición del estado del juego en bruto en formato JSON
  dlg_edytuj_stan_btn_ok: '&Guardar y recargar'
  dlg_edytuj_stan_btn_anuluj: '&Cancelar'
  edytuj_stan_blad_json_tytul: JSON no válido
  edytuj_stan_blad_json_tresc: "El contenido no es un JSON válido, por lo que no se ha guardado (el juego se dañaría). Corrige la sintaxis y vuelve a intentarlo.\n\nDetalles del error:\n{tresc_bledu}"
  edytuj_stan_blad_typ_tresc: El elemento principal del estado del juego debe ser un objeto JSON (un par clave-valor entre llaves), no una lista ni un valor simple. Restaura la estructura del objeto e inténtalo de nuevo.
  edytuj_stan_zapisano_tytul: Estado del juego guardado
  edytuj_stan_zapisano_tresc: El estado del juego "{nazwa}" ha sido guardado y recargado desde el disco. Los personajes, ubicación, equipamiento, tramas y contadores ahora reflejan tu edición.
  err_dlugosc: La respuesta del modelo fue cortada antes de que pudiera completarla (se excedió el límite de longitud). Acorta el contexto e intenta de nuevo.
  odrzucenie_tytul: Acción no ejecutable
  odrzucenie_tresc: El motor narrativo no puede ejecutar esta acción — podría estar fuera de tema, ser imposible en este mundo o no cumplir con las reglas de contenido. El turno no fue guardado. Reformula la acción y vuelve a intentarlo.
  btn_zamknij_gre_label: '&Cerrar juego'
  btn_zamknij_gre_tooltip: Cierra el juego actual y vuelve a la pantalla de creación de uno nuevo (desbloquea la selección de modo y Quick Start). El juego está guardado en disco — puedes cargarlo más adelante. Se pedirá confirmación.
  zamknij_gre_pytanie_tytul: ¿Cerrar el juego actual?
  zamknij_gre_pytanie: "¿Cerrar el juego actual y volver a la pantalla de creación de uno nuevo?\n\nEl estado del juego se guarda en disco tras cada turno, así que no perderás nada — puedes cargarlo de nuevo más adelante con el botón «Cargar»."
  komenda_odswiez_zablokowana_tytul: Comando bloqueado
  komenda_odswiez_zablokowana_tresc: El comando «{komenda}» está bloqueado por defecto, ya que actualizar la narración desde el disco no recalcula el estado del juego (personajes, ubicación, inventario) y puede provocar deriva semántica. Para desbloquearlo, establece EDYCJA_STANU_GRY_WIDOCZNA = True en gui_opowiesci.py:72 y compila tu propio paquete.
  komenda_odswiez_zablokowana_hint: (/odswiez, /refresh — bloqueados; establece EDYCJA_STANU_GRY_WIDOCZNA = True en gui_opowiesci.py:72 para desbloquear)
  err_struktura: El modelo de IA devolvió una estructura de datos incorrecta varias veces y no fue posible corregirla. Inténtalo de nuevo; si el error persiste, adjunta el archivo error_log.txt al informe.
  pamiec_status_offline: '⚠️ Sin conexión a Internet: el contador exacto de memoria no está disponible, los valores son aproximados (~{procent}% — {tokeny} tokens). Cuando recuperes la conexión, reinicia la aplicación.'
  err_kontekst: El historial del juego no cupo en la ventana de contexto del modelo. Termina esta partida y comienza una nueva, o elige un modelo con una ventana más grande — los modelos Claude tienen aquí el mayor margen.
  err_odmowa: El modelo se negó a ejecutar esta instrucción; su contenido podría infringir las normas del modelo o ser demasiado ambiguo. No se guardó nada; formule la instrucción de otra manera e inténtelo de nuevo.
bot:
  closure:
    Lumi: "¡Hola!\n\n¡La nieve se ha asentado y la corrección ha llegado! Todo lo que pediste acaba de aterrizar en la última publicación del Director de Audio GPT.\n\nConsigue la actualización aquí: {link}\n\nCierro la incidencia para que no entre el frío. ¡Que la escarcha te acompañe!\n— Lumi"
    Vieno: "Saludos.\n\nLos vientos del Norte han traído noticia de que tu solicitud ha encontrado su lugar en la nueva versión. La visión se ha manifestado.\n\nLa última versión te espera aquí: {link}\n\nCierro este círculo — el asunto ha llegado a su fin.\n— Vieno"
    Katla: "¡Hey!\n\n¡Forjada en fuego volcánico y todavía al rojo vivo! Tu solicitud ha sido resuelta en la última versión del Director de Audio GPT.\n\nRecógela aquí: {link}\n\nCierro la incidencia — ¡saludos volcánicos!\n— Katla"
  answered:
    Lumi: "¡Hola!\n\nUna noticia desde el Centro ha llegado al Norte — una respuesta para ti. La transmito exactamente tal como fue formulada:\n\n{maintainer_answer}\n\nCierro la incidencia — la nieve se ha asentado sobre este asunto. ¡Que la escarcha te acompañe!\n— Lumi"
    Vieno: "Saludos.\n\nLos vientos del Norte han traído palabras de respuesta desde el Centro. Las relevo intactas:\n\n{maintainer_answer}\n\nCierro este círculo — la pregunta ha llegado a su fin.\n— Vieno"
    Katla: "¡Hey!\n\nUna palabra ardiente del Centro llegó al Norte — te la paso directamente:\n\n{maintainer_answer}\n\nCierro la incidencia — ¡saludos volcánicos!\n— Katla"
  personal_note_intro: 'Un mensaje adicional del maintainer para ti:'
  patch:
    Lumi:
      subject: 'Parche Tiflotecnia Voices — entrega invernal #{issue_number}'
      body: "¡Hola!\n\n¡He atravesado los ventisqueros para entregártelo! Tu parche está listo y he cerrado la incidencia para que no entre el frío.\n{link}\n\nSi una ventisca ha escondido el mensaje en tu bandeja, revisa la carpeta de Spam o Correo no deseado.\n\nQue la escarcha te acompañe,\nLumi"
    Vieno:
      subject: 'Parche Tiflotecnia Voices — una visión para la solicitud #{issue_number}'
      body: "Saludos.\n\nLos Espíritus del Norte han traído noticias de tu solicitud. El ritual ha concluido y el parche se ha manifestado aquí:\n{link}\n\nSi la visión no llegó a tu bandeja, busca entre la niebla en la carpeta de Spam.\n\nEscucha al viento,\nVieno"
    Katla:
      subject: 'Parche Tiflotecnia Voices — recién salido de la fragua #{issue_number}'
      body: "¡Hey!\n\n¡Forjado en fuego volcánico y todavía al rojo vivo! Te envío el parche y cierro la incidencia.\n{link}\n\nSi el humo te ha tapado la bandeja, asegúrate de revisar la carpeta de Spam.\n\nSaludos volcánicos,\nKatla"
    footer: 'Recibes este mensaje porque tu dirección de correo se proporcionó en el GitHub Issue #{issue_number}. Si no fuiste tú quien lo solicitó, por favor ignóralo.'
    brak_emaila: No encontré ninguna dirección de correo electrónico en el contenido — por favor, añádela.
    pauza: Actualmente se está actualizando el patch de Tiflotecnia Voices. Dejo esta incidencia abierta y volveré con el enlace actualizado en cuanto termine — no necesitas hacer nada.
  sami_comment: "¡Ciao! 🌞 Sami del Sur ha visto tu reporte y ha salido disparada con el prompt técnico hacia el Centro. El diseñador de la aplicación se ocupará en breve — y cuando la corrección llegue a la última versión, aparecerá por aquí una de mis colegas del Norte: Lumi, Vieno o Katla. ¡A presto!\n— Sami"
diag:
  tytul: Reglas omitidas
  wstep: "Los siguientes archivos de reglas (o fragmentos de ellos) fueron omitidos por el motor.\nPor eso los modos de IA, herramientas de posproducción o plantillas iniciales\ncorrespondientes no aparecen en la aplicación."
  szczegol: '   Detalles técnicos: {szczegol}'
  wpis: 📄 {plik}
  stopka: "Cómo solucionarlo: en el Gestor de Reglas, selecciona el archivo en la lista y ábrelo\nen el editor de texto, corrige el lugar indicado y guarda los cambios. Después actualiza el árbol\nen el Gestor de Reglas –las reglas se volverán a cargar sin cerrar la aplicación–\ny vuelve a la herramienta.\nSi no sabes qué corregir, abre el mismo archivo en otro idioma y compara\nambos, o restaura el paquete de reglas predeterminado reinstalando la aplicación\n(tus proyectos y juegos permanecerán intactos)."
  brak_zastrzezen: Todos los archivos de reglas se cargaron sin problemas.
  brak_zastrzezen_tytul: Reglas verificadas
  powod:
    parse: "No se pudo leer el archivo: sintaxis YAML incorrecta. El archivo fue\nomitido por completo. Los dos números en los detalles indican el lugar del error:\nel número de línea y el número de carácter en esa línea."
    brak_pol: "Al archivo le faltan campos sin los cuales el motor no puede reconocer la regla (están indicados\nen los detalles). El archivo fue omitido."
    kategoria: "El campo «kategoria» tiene un valor que el motor no reconoce; no se sabe si el archivo\ndescribe un modo de IA o una herramienta de posproducción. El archivo fue omitido."
    zakres: "El campo «zakres» tiene un valor fuera del conjunto permitido, y de él depende\nla forma de procesar el texto (capítulo por capítulo o todo de una vez).\nLa herramienta fue omitida para evitar que funcione de forma distinta a la esperada."
    sufiks: "El campo «sufiks_pliku_wyniku» contiene caracteres no permitidos en un nombre de archivo,\npor lo que el resultado no tendría dónde guardarse. La herramienta fue omitida."
    pole: "Alguno de los campos tiene un valor del tipo incorrecto; lo más común es texto donde\nel motor espera un número, o una lista donde debería haber un conjunto de pares.\nEl archivo fue omitido."
    duplikat: "Otro archivo en la misma carpeta ya tiene el mismo identificador. El motor\ncargó aquel (se indica en los detalles) y omitió este; dos reglas\ncon un mismo identificador serían indistinguibles."
    rola: "El campo «rola» tiene un valor desconocido y fue ignorado. El archivo en sí funciona,\npero la herramienta no recibirá el comportamiento asignado a ese rol."
    klucz: "Al archivo le falta una clave requerida por el motor (se indica\nen los detalles). Esta parte de la receta no funcionará hasta que la clave vuelva\na su lugar."
    wpis: "Una entrada dentro del archivo está incompleta (indicada en los detalles)\ny fue omitida. Las demás entradas de este archivo funcionan con normalidad."
    lingua: "El campo «lingua» del archivo de fundamentos indica a la aplicación con qué nombre reconocer\neste idioma en un texto mixto, y el valor introducido no coincide con ninguno de los nombres\nque conoce el detector integrado. Si en los detalles hay una propuesta, escríbela\nen lugar del valor actual. Si no hay ninguna propuesta, lo más probable es que el detector\nno admita este idioma; el paquete funcionará con normalidad, pero no\nse reconocerá a partir del contenido: selecciónalo en la lista de Políglota y activa\nla opción de forzar un único idioma para todo el documento."
