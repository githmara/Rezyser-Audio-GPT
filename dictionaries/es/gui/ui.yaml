  ant_err_zbyt_krotki: "⚠️ La clave Anthropic parece demasiado corta (se detectaron {liczba_znakow} caracteres, se esperaban al menos {minimum_znakow}).\nProbablemente solo copiaste una parte de la clave. Regresa a console.anthropic.com y cópiala completa."
  compat_ok: "✅ Configuración OpenAI-compatible detectada (modelo: {model}).\nTodos los módulos están listos para funcionar."
  compat_err_niekompletny: "⚠️ El modo OpenAI-compatible está incompleto.\nCompleta los tres campos en golden_key.env: LLM_BASE_URL, OPENAI_API_KEY y LLM_MODEL."
  compat_jakosc_info: ℹ️ Los prompts están optimizados para el modelo Claude (Anthropic). Otros modelos pueden ofrecer menor calidad — es una decisión consciente del director (coste frente a calidad).
rezyser:
  panel_name: "Panel de Director de Audio GPT"
  heading: "🎬  Director de Audio GPT – Estudio Creativo Híbrido"
  description_name: "Descripción del módulo Director de Audio GPT"
  tool_description: |-
    Director de Audio GPT es un estudio creativo híbrido.

    Modo Tormenta de Ideas  – planifica la trama, genera 3 opciones (SIN guardar en archivo).
    Modo Guion        – escribe un guion de audio crudo con etiquetas [SFX] y [Personaje: emoción] (GUARDAR EN ARCHIVO).
    Modo Audiolibro     – genera prosa literaria densa y clásica (GUARDAR EN ARCHIVO).

    Los proyectos se guardan en la subcarpeta 'skrypty/' junto al programa.
    Proporciona el nombre del proyecto SIN extensión (por ejemplo, cronicas_arkonii).
    Para cambiar de proyecto, primero debes limpiar la memoria actual.
  prompt_architekta_content: |-
    Eres un destacado arquitecto de mundos (Worldbuilder) y consultor literario. Tengo una idea vaga para una trama: [ESCRIBE TU IDEA AQUÍ]. Tu tarea es expandir esto a un "Libro del Mundo" profesional.
    Ajusta el tono y las reglas a mi idea. Evita recursos narrativos baratos y clichés de IA.

    REGLAS DE FORMATO (CRÍTICAS):
    Debes devolver la respuesta en dos partes separadas:

    PARTE 1: LIBRO DEL MUNDO
    Esta parte debe estar encerrada en UN bloque de código Markdown (usa los marcadores ```markdown al principio y ``` al final). Dentro del bloque de código, sigue estas reglas:
    1. Comienza con un emoji de libro abierto y un título de trabajo, por ejemplo, 📖 Libro del Mundo: [Título].
    2. Usa un solo hashtag (#) para las secciones principales (por ejemplo, # Reglas del Mundo, # Personajes).
    3. Usa doble hashtag (##) para subsecciones.
    4. Usa guiones (-) para crear listas legibles.
    5. Usa doble asterisco (**texto**) para resaltar reglas absolutas e inquebrantables (por ejemplo, **El héroe NUNCA miente**).
    6. Describe la psicología de los personajes, sus mayores defectos y motivaciones. Para personajes de idiomas extranjeros, añade información sobre el acento directamente en la etiqueta, por ejemplo, `[Speaker 1: Nombre] - cecea y tiene acento francés`. **Consejo técnico:** El uso de la palabra clave `acento` es absolutamente necesario, ya que un script externo de la aplicación detecta automáticamente y aplica las reglas fonéticas correctas a los diálogos de ese personaje.

    PARTE 2: RECOMENDACIÓN DE MODO
    Esta parte debe colocarse FUERA del bloque de código, como texto normal debajo. Aconséjame cuál de los modos de mi aplicación será el mejor para realizar esta idea: 🎬 Modo de Guion Crudo (dramas de audio, SFX, fonética), o 📖 Modo de Audiolibro Tradicional (prosa literaria clásica).

  # Pasek pliku
  lbl_nazwa_pliku: "Nombre del archivo del proyecto (sin extensión, por ejemplo, cronicas_arkonii):"
  txt_nazwa_pliku_name: "Campo de nombre del archivo del proyecto"
  txt_nazwa_pliku_hint: "por ejemplo, cronicas_arkonii"
  txt_nazwa_pliku_tooltip: |-
    Introduce el nombre del proyecto SIN extensión.
    Archivo de historia guardado como: skrypty/<nombre>.txt
    Campo bloqueado cuando la memoria está ocupada.
  btn_wczytaj_label: "Cargar historia"
  btn_wczytaj_tooltip: |-
    Carga un archivo de proyecto existente (skrypty/<nombre>.txt) en la memoria.
    Activo solo cuando la memoria está vacía y se ha proporcionado un nombre.
  btn_hard_reset_label: "Cerrar Proyecto (Reinicio Completo)"
  btn_hard_reset_tooltip: |-
    Limpieza COMPLETA del proyecto: historia, resumen, Libro del Mundo.
    Restablece todos los contadores y desbloquea el campo de nombre del archivo.
    Úsalo al cambiar de proyecto o para una historia completamente nueva.
  # Sidebar
  sidebar_heading: "📖 Barra Lateral del proyecto"
  lbl_ksiega_swiata: "Libro del Mundo – Reglas y Personajes:"
  txt_ksiega_name: "Campo del Libro del Mundo – reglas y personajes"
  txt_ksiega_hint: |-
    Introduce las reglas del mundo, la descripción de los personajes y sus acentos fonéticos…
    Por ejemplo, [Geralt: acento islandés]
    El contenido se adjunta a cada consulta de IA.
  txt_ksiega_tooltip: |-
    Contexto siempre adjunto a la IA: reglas del mundo, personajes, acentos fonéticos.
    Guardar en disco requiere proporcionar el nombre del archivo del proyecto.
  btn_zapisz_ksiege_label: "💾 Guardar Libro permanentemente"
  btn_zapisz_ksiege_tooltip: |-
    Guarda el Libro del Mundo en un archivo: skrypty/<nombre>.md
    Requiere proporcionar el nombre del archivo del proyecto.
  btn_prompt_architekta_label: "📖 Prompt del Arquitecto para IA…"
  btn_prompt_architekta_name: "Botón Mostrar Prompt del Arquitecto para chatbot externo"
  btn_prompt_architekta_tooltip: |-
    Abre una ventana con un prompt listo para un chatbot externo (ChatGPT, Claude).
    Pega tu idea de trama, y la IA generará un Libro del Mundo profesional formateado en Markdown – para pegar en el campo "Libro del Mundo" de arriba.
  lbl_pamiec_dlugotrwala: "🧠 Memoria a Largo Plazo (Resumen):"
  txt_pamiec_name: "Campo de Memoria a Largo Plazo – resumen de eventos"
  txt_pamiec_hint: |-
