  uwagi:
    akcent: |-
      La plantilla en `dictionaries/{jezyk_bazowy}/akcenty/{id_pliku}.yaml` tiene una canalización de sustituciones fonéticas vacía. El acento se detecta dinámicamente: solo necesitas reiniciar la aplicación (desde v17.5 sin el paso de regeneración de código).

      ADVERTENCIA: la lista `zamiany:` se aplica SECUENCIALMENTE: cada regla opera sobre la salida de la anterior. Una regla que introduce una letra utilizada posteriormente como `wzor` en otra regla entrará en un bucle (clásico: `ñ → nj` antes de `j → x` da `ñ → nx`, no `nj`). Primero cambia el TARGET a algo seguro, luego introduce el SOURCE.
    akcent_oczyszczenie: |-
      Acento de limpieza (`kategoria: oczyszczenie`) en el paquete `{jezyk_bazowy}/`. La estructura de archivos de este tipo es idéntica en todos los paquetes implementados: solo difiere la etiqueta, la descripción y los comentarios (nativos).
    akcent_naprawiacz: |-
      Reparador de etiquetas (`kategoria: naprawiacz`) en el paquete `{jezyk_bazowy}/`. Modo especial: inyecta el código ISO en los archivos resultantes (HTML/DOCX), no modifica el contenido.
    szyfr_zamiany: |-
      Plantilla de cifrado "sustituciones puras" en `dictionaries/{jezyk_bazowy}/szyfry/{id_pliku}.yaml`. Formato = `kategoria: szyfr` + lista `zamiany:` (como el acento, pero sin la canalización fonética). Toma el patrón de ESTRUCTURA de los acentos: todos los cifrados implementados son algoritmos (otro formato, sin lista `zamiany:`).
    tryb_rezysera: |-
      Plantilla basada en el modo Audiolibro (paquete `{jezyk_bazowy}/`). El agente diseñará `prompt_systemowy`, `przypomnienie_uzytkownika` y `slowa_wyzwalajace` en el idioma nativo del paquete.
    tryb_opowiesci: |-
      El modo de Narración REQUIERE edición del código fuente — el Manager NO crea el archivo, solo da un prompt para el agente. Los modos de juego son reconocidos por constantes numéricas y diccionarios en `opowiesci_ai.py`/`gui_opowiesci.py`, por lo que el nuevo modo debe ser integrado (constante int añadida al final, entradas en diccionarios, etiqueta RadioBox, modelo por modo). Desde la aplicación instalada (sin repositorio) esto es inviable — se necesita la versión de código fuente.
    postprodukcja: |-
      La plantilla de postproducción itera por capítulos (paquete `{jezyk_bazowy}/`). El agente diseñará `prompt_systemowy`, `prompt_uzytkownika_szablon` (marcadores de posición {{naglowek}}, {{probka}}) y `regex_podzial_rozdzialow` adaptado a los nombres nativos de los capítulos (Rozdział/Kapitel/Capitolo/Глава…).
    jezyk_bazowy: |-
      El gestor creará `dictionaries/{id_pliku}/` con subcarpetas `akcenty/`, `szyfry/`, `rezyser/`, `gui/` y `opowiesci/`. La plantilla `podstawy.yaml` tiene marcadores `<FILL NATIVELY>`. El agente se basa en `de/podstawy.yaml` o `it/podstawy.yaml`. La traducción de la interfaz de usuario (`gui/ui.yaml`) genera `buduj_wielojezyczne_ui.py`. El motor requiere ≥1 archivo en `rezyser/` para considerar el idioma como completo.
    szyfr_algorytm: |-
      Cifrado ALGORÍTMICO: requiere una función en `core_poliglota.py` junto al archivo YAML. El gestor NO crea ningún archivo; el agente añadirá la función `_algorytm_*` + entrada en el mapa `_ALGORYTMY` + archivo YAML en `dictionaries/{jezyk_bazowy}/szyfry/{id_pliku}.yaml`. Este es el ÚNICO tipo de regla que requiere edición del código fuente: desde la aplicación instalada (sin repositorio) es inviable, se necesita la versión de código fuente.
    jezyk_agenta: |-
      El prompt a continuación está en inglés (idioma de trabajo de los agentes de codificación); el contenido de los archivos creados se genera en el idioma nativo del paquete. Si prefieres que el agente se comunique contigo en tu idioma, configúralo en su configuración (por ejemplo, en Claude Code a través de `/config`).
    srodowisko_zrodlo: |-
      Flujo de trabajo: copia el siguiente prompt al agente de IA con acceso a este repositorio (Claude Code, Cursor, Aider). El agente abrirá archivos de referencia, creará/completará el archivo y lo verificará. Los cambios en `akcenty/`, `szyfry/`, `rezyser/` se detectan al reiniciar la aplicación.
    srodowisko_frozen: |-
      Estás utilizando la aplicación instalada (sin fuentes del repositorio). El siguiente prompt asume un desarrollador con el repositorio y un agente de IA: el flujo de trabajo completo del agente requiere la versión de código fuente. Sin embargo, desde la aplicación puedes completar manualmente la plantilla YAML generada (los archivos `dictionaries/` están junto al programa y son editables); verás los cambios al reiniciar la aplicación.

# -----------------------------------------------------------------------------
# UPDATER – auto-aktualizacja (core_updater.py + wątek tła w main.py)
# -----------------------------------------------------------------------------
  typ:
    akcent:
      etykieta: "Acento fonético (cross-language, por ejemplo, sueco, finlandés)"
      opis: |-
        Archivo en <jezyk>/akcenty/<id>.yaml con `kategoria: akcent`. El texto del paquete base (jezyk_bazowy) se translitera según la pronunciación del sintetizador de destino (iso != jezyk_bazowy). El gestor crea una plantilla + prompt para el agente de IA, que diseñará la lista `zamiany:`.
    akcent_oczyszczenie:
      etykieta: "Acento limpiador (preprocesador, sin fonética)"
      opis: |-
        Archivo en <jezyk>/akcenty/<id>.yaml con `kategoria: oczyszczenie`. Limpia el texto para TTS (elimina el galimatías, normaliza los números) SIN cambiar la fonética. iso == jezyk_bazowy. El gestor crea una plantilla (patrón listo) + prompt para traducir la etiqueta/descripción al idioma nativo.
    akcent_naprawiacz:
      etykieta: "Reparador de etiquetas (inyecta ISO en HTML/DOCX)"
      opis: |-
        Archivo en <jezyk>/akcenty/<id>.yaml con `kategoria: naprawiacz`. NO modifica el contenido — inyecta el código ISO del idioma en los archivos de salida (<html lang>, <w:lang>). iso vacío (el código lo proporciona el usuario en la GUI). El gestor crea una plantilla + prompt para traducir la etiqueta/descripción al idioma nativo.
    szyfr_zamiany:
      etykieta: 'Nuevo cifrado tipo "sustituciones puras"'
      opis: |-
        Archivo en <jezyk>/szyfry/. El gestor crea una plantilla + prompt para la IA, que traducirá las etiquetas/comentarios al idioma nativo del paquete y generará una lista de pares patrón→sustitución.
    tryb_rezysera:
      etykieta: "Nuevo modo Director (modo creativo)"
      opis: |-
        Archivo en <jezyk>/rezyser/tryb_*.yaml. Plantilla basada en el modo Audiolibro + prompt para la IA que traduce prompt_systemowy, przypomnienie_uzytkownika y slowa_wyzwalajace al idioma nativo del paquete base.
    tryb_opowiesci:
      etykieta: "Nuevo modo de Narración (REQUIERE DESARROLLADOR)"
      opis: |-
        Modo de juego interactivo (Historias). A diferencia de los modos de Director NO es data-driven: el archivo YAML por sí solo es código muerto — el motor reconoce los modos por constantes numéricas y diccionarios en Python. El Manager NO crea el archivo; solo da un prompt para la IA/desarrollador con una lista completa de puntos de anclaje en el código (constante int, dos diccionarios, RadioBox, modelo por modo).
    postprodukcja:
      etykieta: "Nueva postproducción (iteración por capítulos)"
      opis: |-
        Archivo en <jezyk>/rezyser/postprod_*.yaml. Plantilla con campos para prompt, regex y parámetros de iteración + prompt para la IA que genera el prompt_systemowy nativo y regex_podzial_rozdzialow.
    jezyk_bazowy:
      etykieta: "Nuevo idioma base (por ejemplo, en, de, fr)"
      opis: |-
        Crea la carpeta <jezyk>/ con podstawy.yaml y subcarpetas akcenty/, szyfry/, rezyser/, gui/. Los datos fonéticos los genera la IA a partir del prompt; la traducción de la UI – buduj_wielojezyczne_ui.py; los modos del Director se copian de pl/rezyser/ (se requiere ≥1 archivo tryb_*.yaml para que el motor considere el idioma como completo).
    szyfr_algorytm:
      etykieta: "Nuevo cifrado algorítmico (REQUIERE PROGRAMADOR)"
      opis: |-
        Los algoritmos (por ejemplo, inversión, tipoglicemia) requieren funciones en core_poliglota.py. El gestor solo proporciona un prompt para la IA con la descripción de la tarea.

