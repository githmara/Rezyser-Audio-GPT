konwerter:
  panel_name: "Panel del Arquitecto de Audiolibros"
  # 18.8: segmento localizado del nombre del archivo de salida (una palabra, sin espacios)
  filename_architektura: "arquitectura"
  heading: "📄  Arquitecto de Audiolibros"
  tool_description: |-
