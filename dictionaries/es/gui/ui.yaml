  edytuj_stan_blad_typ_tresc: El elemento principal del estado del juego debe ser un objeto JSON (un par clave-valor entre llaves), no una lista ni un valor simple. Restaura la estructura del objeto e inténtalo de nuevo.
  edytuj_stan_zapisano_tytul: Estado del juego guardado
  edytuj_stan_zapisano_tresc: El estado del juego "{nazwa}" ha sido guardado y recargado desde el disco. Los personajes, ubicación, equipamiento, tramas y contadores ahora reflejan tu edición.
