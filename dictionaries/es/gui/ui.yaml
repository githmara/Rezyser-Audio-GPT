  btn_przeladuj_tooltip: 'Carga TODO el proyecto nuevamente desde el disco después de tus cambios manuales en el archivo de narración (skrypty/<nombre>.txt) — recalcula los contadores de Capítulos/Actos/Escenas, levanta el Libro del Mundo, el modo y las opciones de Lluvia de Ideas y sincroniza la memoria de trabajo. La historia corta se carga por completo; para una larga, preguntará desde qué encabezado debe comenzar la memoria de trabajo de la IA (el resto se representa como Resumen). ATENCIÓN: sobrescribe el contenido de los campos con la versión del disco — guarda primero los cambios no guardados.'
  przeladuj_ostrzezenie_tytul: ¿Recargar el proyecto desde el disco?
  przeladuj_ostrzezenie_tresc: "La recarga reemplazará el contenido actual (Libro del Mundo, Memoria a Largo Plazo, narración, contadores de estructura) con la versión guardada en el disco. Los cambios no guardados en los campos se perderán.\n\n¿Continuar?"
  przeladuj_tytul: Proyecto recargado desde el disco
  przeladuj_calosc_tresc: Todo el proyecto recargado desde el disco ({liczba_znakow} caracteres). Los contadores de estructura, el Libro del Mundo, el modo y la memoria de trabajo están sincronizados con el archivo.
  przeladuj_calosc_skasowano_tresc: Todo el proyecto recargado desde el disco ({liczba_znakow} caracteres) — todo el texto cabía en la ventana de contexto, por lo que el resumen innecesario fue eliminado (el motor ahora trabaja con la historia completa). Los contadores y el Libro del Mundo están sincronizados con el archivo.
  marker_dlg_tytul: Punto de referencia de la memoria de trabajo
  marker_dlg_plaski_lbl: La historia es demasiado larga para caber por completo. ¿Desde qué Capítulo debe comenzar la memoria de trabajo de la IA? (Los eventos anteriores se representan como Resumen. Cancelar = último fragmento de texto).
  marker_dlg_akt_lbl: La historia es demasiado larga para caber por completo. ¿Desde qué Acto debe comenzar la memoria de trabajo de la IA? (Cancelar = último fragmento de texto).
  marker_dlg_scena_lbl: ¿Desde qué Escena de este Acto debe comenzar la memoria de trabajo de la IA?
  marker_dlg_caly_akt: ← todo el Acto (desde el encabezado del acto)
  punkt_odniesienia_tytul: Punto de referencia de la memoria de trabajo
  punkt_odniesienia_snap_tresc: La memoria de trabajo de la IA comienza desde el encabezado "{naglowek}" ({liczba_znakow} caracteres). Los eventos anteriores se representan como Resumen a Largo Plazo (permanece intacto).
  punkt_odniesienia_fallback_tresc: 'No se indicó un punto de referencia — el último fragmento de la narración ({liczba_znakow} caracteres) se transfirió a la memoria de trabajo. El resumen permanece intacto. Consejo: inserta encabezados de Capítulo/Acto/Escena para poder elegir con precisión el inicio de la memoria.'
  punkt_odniesienia_za_dluga_tresc: 'El fragmento seleccionado "{naglowek}" es tan extenso que no cabe por sí solo en la ventana de memoria de trabajo — se aplicó un corte de emergencia a los últimos {liczba_znakow} caracteres. Director, esto es un poco de locura: considera dividir Actos/Capítulos en Escenas más pequeñas — secciones más cortas permitirán a la IA mantener un contexto coherente.'
  kod_jezyka_blad_tytul: Idioma de receta desconocido
  kod_jezyka_blad_tresc: No se pudo determinar el código de idioma (ISO) para la respuesta "{jezyk_odpowiedzi}". Abre la receta en el Administrador de Reglas y establece el campo codigo_idioma (por ejemplo, "fi") para que los encabezados de estructura y los acentos coincidan con el idioma del contenido.
  jezyk_naglowkow_ostrzezenie_tytul: Idioma de los encabezados y el idioma de la receta
  jezyk_naglowkow_ostrzezenie_tresc: El proyecto cargado tiene encabezados de estructura que parecen estar en el idioma "{wykryty}", y la receta activa genera contenido en el idioma "{kod}". Los nuevos encabezados se insertarán después de "{kod}" — si esto no es intencionado, ajusta el campo codigo_idioma en la receta o elige otro modo.
  pamiec_status_czysta: 🟢 Memoria limpia. Máquina lista para una nueva historia.
  pamiec_status_ok: '🟢 Uso de memoria: {tokeny} / {maks} tokens. Búfer seguro.'
  pamiec_status_ostrzezenie: '⚠️ ESTADO DE ADVERTENCIA: Se han utilizado {tokeny} de {maks} tokens. La memoria se está llenando; pronto será necesario generar un resumen (botón de Memoria a Largo Plazo en la sección de posproducción).'
  pamiec_status_alarm: '🚨 SOBRECARGA CRÍTICA: Se han utilizado {tokeny} de {maks} tokens. Tras el próximo envío correcto, la aplicación guardará automáticamente la Memoria a Largo Plazo; para liberar memoria de trabajo, vuelva a cargar el proyecto desde el disco después.'
  tytuly_postep: 'Titulación: {naglowek} ({step}/{total})…'
  tytuly_blad_brak_struktury: No se encontraron etiquetas de estructura (Prólogo / Capítulo N / Epílogo) en el archivo. Inserte cortes de capítulos antes de asignar títulos.
  kod_jezyka_rozjazd_tytul: El código de idioma no coincide con el contenido
  kod_jezyka_rozjazd_tresc: 'En la receta se ingresó el código de idioma "{kod_wpisany}", pero el idioma de respuesta es "{jezyk_odpowiedzi}" — que corresponde al código "{kod_wykryty}". Solo "jezyk_odpowiedzi" NO es suficiente: el código ISO controla los encabezados de la estructura (Prólogo/Acto/Escena), la selección de acentos y el puente ElevenLabs. Se utilizó el código "{kod_wykryty}". Si es un error, corrige el campo kod_jezyka en el Administrador de Reglas.'
  kod_jezyka_edu_tytul: No se pudo determinar el código de idioma
  kod_jezyka_edu_naglowek: 'Código ISO del idioma del contenido — acción requerida:'
  kod_jezyka_edu_tresc: 'No se pudo determinar automáticamente el código ISO 639-1 para el idioma de respuesta "{jezyk_odpowiedzi}" (sin conexión a la API o respuesta ambigua). Este código de dos letras es necesario: controla los encabezados de la estructura (Prólogo/Acto/Escena), la selección de acentos y el idioma del proyecto en ElevenLabs. Solo la descripción "jezyk_odpowiedzi" no es suficiente. Abre la receta en el Administrador de Reglas e ingresa el código correcto en el campo kod_jezyka (por ejemplo, "fi" para finlandés, "de" para alemán).'
  kod_jezyka_edu_prompt: "Si no conoces el código, copia la siguiente pregunta y pégala en cualquier chatbot (por ejemplo, ChatGPT):\n\n\"Proporcione el código ISO 639-1 de dos letras para el idioma descrito como: {jezyk_odpowiedzi}. Responda solo con el código.\""
  kod_jezyka_edu_name: Explicación del código de idioma y prompt para el chatbot
  ostrzezenie_urwane_tytul: El fragmento puede haber sido cortado
  ostrzezenie_urwane_tresc: La respuesta del modelo alcanzó el límite de longitud y se interrumpió a mitad de una frase; el intento automático de completar la última oración no tuvo éxito. El fragmento se ha guardado tal como está — revisa el final y, si es necesario, añade el cierre manualmente o envía una instrucción breve para continuar.
  err_struktura: El modelo de IA devolvió una estructura de datos incorrecta varias veces y no fue posible corregirla. Inténtalo de nuevo o simplifica la instrucción; si el error persiste, adjunta el archivo error_log.txt al informe.
  pamiec_status_offline: '⚠️ Sin conexión a Internet: el contador exacto de memoria no está disponible, los valores son aproximados (~{tokeny} / {maks} tokens). Cuando recuperes la conexión, reinicia la aplicación.'
  err_timeout: Se agotó el tiempo de espera de la respuesta del modelo. Comprueba tu conexión a Internet e inténtalo de nuevo.
  postprod_postep_generowanie: 'Posproducción: generando resultado…'
  postprod_postep_gotowe: Posproducción completada.
  postprod_pusta_tresc: El modelo devolvió una respuesta vacía. Inténtalo de nuevo.
  postprod_ucieta_tresc: El resultado de la posproducción alcanzó el límite de longitud y su final podría haberse cortado. El resultado está disponible; revisa el final y, si está incompleto, ejecuta la herramienta de nuevo o aumenta el valor de `max_tokens_wyjscia` en el archivo YAML de la herramienta.
  # Título común para los avisos de corte Y las notas del validador de la ficha
  # (v18.14), por eso es neutral — el cuerpo del mensaje dice qué revisar.
  postprod_ostrzezenie_tytul: "El resultado requiere una revisión"
  postprod_nadpisac_tytul: El archivo de resultado ya existe
  postprod_nadpisac_tresc: El archivo {plik} ya existe en la carpeta skrypty. ¿Deseas sobrescribirlo con el nuevo resultado?
  postprod_dlg_lbl: 'Resultado de la herramienta — copia (Ctrl+A, Ctrl+C) o cierra:'
  postprod_dlg_zapisano: 'El resultado se guardó en el archivo {plik} (carpeta skrypty). Vista previa a continuación:'
  postprod_dlg_name: Campo de resultado de posproducción
  err_kontekst: El material enviado al modelo no cupo en su ventana de contexto. Guarda la Memoria a Largo Plazo (el resumen reduce el contexto de las próximas llamadas), divide el proyecto en archivos más pequeños o elige un modelo con una ventana más grande — los modelos Claude tienen aquí el mayor margen.
  postprod_kontekst_tytul: Proyecto grande — revisa la ventana del modelo
  postprod_kontekst_tresc: "El material para la herramienta tiene aproximadamente {tokeny} tokens y supera {limit} tokens, que es la ventana de contexto con la que la aplicación mide la ocupación de memoria.\n\nLos modelos Claude tienen una ventana mucho más grande que este contador, así que lo más probable es que la llamada se realice con éxito. Sin embargo, si utilizas tu propio proveedor de IA con una ventana más pequeña, el modelo rechazará la solicitud — y aun así pagarás por el intento.\n\n¿Deseas ejecutar la herramienta de todos modos?"
  pamiec_auto_start: La memoria del modelo está casi llena — guardando la Memoria a Largo Plazo…
  pamiec_auto_zapisana_tytul: Memoria a Largo Plazo guardada automáticamente
  pamiec_auto_zapisana_tresc: "La memoria del modelo superó el umbral de alarma, así que la aplicación preparó automáticamente un resumen del proyecto {nazwa_projektu} y lo guardó como {plik}.\n\nEl resumen aparece en el campo «Memoria a Largo Plazo»: puedes modificarlo libremente y guardarlo de nuevo.\n\nEl guardado en sí aún no reduce el uso de memoria: el indicador bajará solo al recargar el proyecto desde el disco, ya que entonces la aplicación sustituirá todo el historial por el resumen más el tramo final de la narración. Hasta entonces, el proceso automático no se repetirá; podrás solicitar otro resumen con el botón de la sección de posproducción."
