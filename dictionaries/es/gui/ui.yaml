  otworz_narracje_ostrzezenie_tytul: Edición del archivo de narración — riesgo de desincronización del estado
  otworz_narracje_ostrzezenie_tresc: "Estás a punto de abrir el archivo de narración (.txt) en el editor del sistema.\n\nATENCIÓN: el archivo .txt solo contiene texto de narración para TTS, mientras que el estado del juego (personajes, ubicación, inventario, tramas abiertas) vive en un archivo separado .game.json. Editar .txt no actualiza el estado — la siguiente ronda de LLM recibirá el mundo antes de tu edición, por lo que puede haber una desincronización semántica (por ejemplo, describiste que un personaje murió, pero en el estado del juego todavía vive).\n\nCaso típico seguro: escribir la escena de cierre cuando la IA no quiere terminar la historia (alternativa a la opción \"Editar modo de juego…\" → Libre).\n\n¿Continuar?"
