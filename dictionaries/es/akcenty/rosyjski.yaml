# -----------------------------------------------------------------------------
#  ACENTO RUSO (español → TTS ruso)
#  Para sintetizadores: Irina / Pavel (TTS ruso).
# -----------------------------------------------------------------------------
id: rosyjski
etykieta: "Ruso (p. ej. Irina / Pavel)"
opis: |
  Translitera el texto español COMPLETAMENTE al alfabeto cirílico para que
  el sintetizador de voz ruso (Irina / Pavel) lo lea con acento ruso.
  La transcripción es fonética, no académica (no sigue ISO 9 ni GOST):
  el objetivo es un ruso hablando español.

  Correspondencias principales:
    - « ch » → « ч »,  « ll » → « й »,  « ñ » → « нь »
    - « j » → « х »,   « ge/gi » → « хе/хи »
    - « gue/gui » → « ге/ги »,  « que/qui » → « ке/ки » (u muda)
    - « ce/ci » → « се/си » (seseo),  « z » → « с »
    - « v » → « б » (betacismo),  « h » muda → se elimina
    - « ya/ye/yo/yu » → « я/е/ё/ю »,  « y » restante → « и »
    - vocales a/e/i/o/u → а/е/и/о/у, resto de letras 1:1 en cirílico
    - « rr » → « рр » sale de forma natural de « r » → « р ».

  Simplificaciones conscientes (impuestas por el pipeline): la etapa
  previa `usun_polskie_znaki` quita las tildes ANTES de estas reglas
  (á→a, …, ü→u), por lo que « güe/güi » pierde la /w/ (pingüino →
  пингино) y el acento tónico no se marca.
iso: ru
kategoria: akcent
kolejnosc: 60

# --- Pipeline ---
czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: false

# -----------------------------------------------------------------------------
# ORDEN CRÍTICO (str.replace secuencial):
#   1. Dígrafos y trígrafos (ch, ll, ñ, gue/gui, que/qui, ge/gi, ce/ci)
#   2. j → х,  h muda → (eliminada; segura: ningún resultado contiene « h »)
#   3. Yotación ya/ye/yo/yu, luego « y » restante
#   4. Letras sueltas → cirílico
# Todos los resultados son cirílicos — los patrones latinos posteriores
# ya no pueden dañar los resultados anteriores.
# -----------------------------------------------------------------------------
zamiany:
  # --- 1. Dígrafos y trígrafos ---
  - { wzor: "ch",  zamiana: "ч"  }
  - { wzor: "Ch",  zamiana: "Ч"  }
  - { wzor: "CH",  zamiana: "Ч"  }
  - { wzor: "ll",  zamiana: "й"  }
  - { wzor: "Ll",  zamiana: "Й"  }
  - { wzor: "LL",  zamiana: "Й"  }
  - { wzor: "ñ",   zamiana: "нь" }
  - { wzor: "Ñ",   zamiana: "Нь" }
  # --- gu/qu + e/i (u muda) — ANTES de ge/gi ---
  - { wzor: "gue", zamiana: "ге" }
  - { wzor: "Gue", zamiana: "Ге" }
  - { wzor: "GUE", zamiana: "ГЕ" }
  - { wzor: "gui", zamiana: "ги" }
  - { wzor: "Gui", zamiana: "Ги" }
  - { wzor: "GUI", zamiana: "ГИ" }
  - { wzor: "que", zamiana: "ке" }
  - { wzor: "Que", zamiana: "Ке" }
  - { wzor: "QUE", zamiana: "КЕ" }
  - { wzor: "qui", zamiana: "ки" }
  - { wzor: "Qui", zamiana: "Ки" }
  - { wzor: "QUI", zamiana: "КИ" }
  # --- ge/gi → хе/хи ---
  - { wzor: "ge",  zamiana: "хе" }
  - { wzor: "Ge",  zamiana: "Хе" }
  - { wzor: "GE",  zamiana: "ХЕ" }
  - { wzor: "gi",  zamiana: "хи" }
  - { wzor: "Gi",  zamiana: "Хи" }
  - { wzor: "GI",  zamiana: "ХИ" }
  # --- ce/ci → се/си (seseo) ---
  - { wzor: "ce",  zamiana: "се" }
  - { wzor: "Ce",  zamiana: "Се" }
  - { wzor: "CE",  zamiana: "СЕ" }
  - { wzor: "ci",  zamiana: "си" }
  - { wzor: "Ci",  zamiana: "Си" }
  - { wzor: "CI",  zamiana: "СИ" }

  # --- 2. j → х, h muda eliminada ---
  - { wzor: "j",   zamiana: "х"  }
  - { wzor: "J",   zamiana: "Х"  }
  - { wzor: "h",   zamiana: ""   }
  - { wzor: "H",   zamiana: ""   }

  # --- 3. Yotación ---
  - { wzor: "ya",  zamiana: "я"  }
  - { wzor: "Ya",  zamiana: "Я"  }
  - { wzor: "YA",  zamiana: "Я"  }
  - { wzor: "ye",  zamiana: "е"  }
  - { wzor: "Ye",  zamiana: "Е"  }
  - { wzor: "YE",  zamiana: "Е"  }
  - { wzor: "yo",  zamiana: "ё"  }
  - { wzor: "Yo",  zamiana: "Ё"  }
  - { wzor: "YO",  zamiana: "Ё"  }
  - { wzor: "yu",  zamiana: "ю"  }
  - { wzor: "Yu",  zamiana: "Ю"  }
  - { wzor: "YU",  zamiana: "Ю"  }
  - { wzor: "y",   zamiana: "и"  }
  - { wzor: "Y",   zamiana: "И"  }

  # --- 4. Letras sueltas → cirílico ---
  - { wzor: "a",   zamiana: "а"  }
  - { wzor: "A",   zamiana: "А"  }
  - { wzor: "b",   zamiana: "б"  }
  - { wzor: "B",   zamiana: "Б"  }
