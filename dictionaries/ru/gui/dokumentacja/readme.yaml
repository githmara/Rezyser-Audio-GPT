id: readme
tresc:
  naglowek: |
    # Reżyser Audio GPT

    **Гибридная студия звукозаписи для радиопостановок, аудиокниг и интерактивных историй**

    **Другие языковые версии / Other languages:** [English](readme.md) · [Deutsch](readme.de.md) · [Español](readme.es.md) · [Suomi](readme.fi.md) · [Français](readme.fr.md) · [Íslenska](readme.is.md) · [Italiano](readme.it.md) · [Polski](readme.pl.md) · [Русский](readme.ru.md)
  wprowadzenie: |
    Набор автономных инструментов на базе ИИ для автоматического написания, планирования, форматирования и перевода объемных сценариев, а также проведения интерактивных текстовых игр. Проект является нативным настольным приложением (wxPython), разработанным с нуля с учетом полной доступности для экранных чтецов (NVDA, VoiceOver) и совместимости с профессиональными синтезаторами речи (TTS). Работает без браузера и без локального сервера — запускается как обычное окно программы.

    Версия: **{numer_wersji}** · Поддерживаемые языки нативно ({liczba_kompletnych_jezykow}): {lista_kompletnych_jezykow_natywnie}.
  glowne_moduly: |
    ## Главные модули

    Приложение объединяет в одном окне пять инструментов, переключаемых с помощью горячих клавиш (Ctrl+1 / Ctrl+2 / Ctrl+3 / Ctrl+4 / Ctrl+5) или кнопками на панели инструментов. Каждый модуль работает независимо, но все они используют общие пакеты словарей из папки `dictionaries/` (акценты, шифры, творческие режимы AI) и центральные настройки.
  modul_rezyseria: |
    ### 1. Режиссура (Ctrl+1)

    Главная студия для написания радиопостановок и аудиокниг. Выбираете режим — Мозговой Штурм, Сценарий (с тегами `[SFX]`/`[Персонаж: эмоция]`), Аудиокнига (традиционная проза) — и управляете диалогом с моделью через поле Инструкции + Книгу Мира + Долговременную Память:

    * **Многопроектная Книга Мира:** Система автоматически загружает в фоновом режиме посвященные правила вселенной (`.md`) на основе активного исходного файла, обеспечивая полную изоляцию (zero-click context loading).
    * **Аккумулятор Сюжета:** Алгоритм «бесконечной памяти». Краткое содержание сюжета создаёт отдельный инструмент постобработки (с v18.13), а когда индикатор памяти входит в состояние красной тревоги, система запускает его сама и сохраняет результат и в файл, и в поле Долговременной Памяти. Последующие резюме инкрементальны — модель получает прежнюю память и только новую часть повествования.
    * **{liczba_trybow_rezysera} творческих режимов:** Каждый из файлов в `dictionaries/<jzk>/rezyser/` описывает отдельную «личность» режиссера AI (Мозговой Штурм, Сценарий, Аудиокнига) или инструмент постобработки (Заголовки Глав, Долговременная Память). Вы можете настроить их звучание без программирования — см. Менеджер Правил ниже.
  modul_opowiesci: |
    ### 2. Истории (Ctrl+5, второй основной режим начиная с v15.0)

    Интерактивные текстовые игры, ведомые ИИ в роли повествовательного движка. В отличие от Режиссуры (где вы генерируете готовый аудиокнигу), Истории — это поэтапный, тура-за-турой развивающийся сюжет:

    * **Режим Выбора:** каждый ход заканчивается 3-5 пронумерованными вариантами A-E. Наиболее интуитивный режим для незрячих игроков — NVDA озвучивает варианты, вы нажимаете Tab и Enter.
    * **Режим Меньшее Зло:** как Выбор, но каждый вариант невыгоден морально, физически или стратегически. Начиная с v15.2 добавлена «фляжка» — многоразовый вариант с номером ZERO, отчаянное спасение, эффекты которого псевдослучайны (60% вредных / 30% искажающих восприятие / 10% редко-полезных, распределение принудительно задается Python, у LLM нет возможности придумать спасительный исход).
    * **Свободный режим:** любое действие свободным текстом («попробую открыть дверь»), движок предлагает 1-3 подсказки, но не навязывает выбор.
    * **Единая ИИ-модель для всех режимов:** начиная с v18.1 все режимы Историй используют одну и ту же общую модель (по умолчанию и рекомендовано Anthropic Claude Sonnet 5) — более мощная модель строго придерживается правил мира (особенно важно в режиме Меньшее Зло, где каждый вариант должен быть реально невыгодным).
  modul_poliglota: |
    ### 3. Полиглот (Ctrl+2, Переводчик ИИ + Акценты TTS)

    * **Безопасный Переводчик:** Длинные тексты автоматически разбиваются на блоки, измеряемые в токенах модели (безопасно и для языков с плотной письменностью, например китайского), и переводятся последовательно; обрезанный ответ модели обнаруживается и повторяется на меньших фрагментах. Каждый блок немедленно сохраняется в скрытый файл `.jsonl`. Возобновление после исчерпания лимитов API полностью автоматическое.
    * **Автоматизация NVDA:** Переводы сохраняются как готовые файлы `.html` с встроенным языковым тегом или файлы `.docx` с тегами, внедренными непосредственно в структуру XML.
    * **{liczba_akcentow_jezykowych} локальных акцентов:** Возможность намеренного принуждения к ломаному акценту для локальных синтезаторов (Tiflotecnia Voices, eSpeak, OneCore) благодаря продвинутым правилам regex. Поддерживаемые иностранные акценты: английский, польский (с транслитерацией на кириллицу), французский, немецкий, испанский, итальянский, финский, исландский.
    * **Режим Шифровальщика:** {liczba_szyfrow} локальных алгоритмов искажения текста — от чтения задом наперед, через типогликемию, до классического шифра Цезаря. Каждый с локальным алфавитом языкового пакета (например, шифр Цезаря на 35-символьном алфавите PL с диакритическими знаками).
    * **Исправитель Тегов:** Безинвазивно внедряет указанный код языка ISO — в том числе региональный, например pt-BR или zh-CN — в существующие файлы.
  modul_konwerter: |
    ### 4. Конвертер / Архитектор Аудиокниг (Ctrl+3)

    * Обрабатывает исходные файлы `.txt` или `.docx` для клавиатурной навигации в NVDA и системах, таких как ElevenLabs.
    * Автоматически преобразует ключевые слова (Акт, Глава, Пролог) в заголовки «Heading 1» в документе Word, а также очищает ненужные HTML-теги и Markdown-разметку.
    * С версии 15.1 группировка 5 туров в сцены с заголовками H1 (авто-детекция Историй) — подготавливает файл, сгенерированный в режиме Историй, для традиционной публикации аудиокниг.
  modul_manager_regul: |
    ### 5. Менеджер Правил (Ctrl+4, новинка с v13.0)

    * **Обозреватель словарей без Python:** Визуальное дерево всех файлов YAML в папке `dictionaries/` — фонетические акценты, шифры, творческие режимы Режиссера и Историй. Лингвист или переводчик может просматривать, дублировать, редактировать и удалять правила прямо из GUI.
    * **Создатель новых правил:** Форма с выбором типа (акцент, шифр чистых замен, режим Режиссера, новый базовый язык, алгоритмический шифр) создает готовый шаблон YAML, а для более сложных случаев генерирует форматированный запрос для вставки в ChatGPT / Claude.
    * **Рефактор v13.0 — правила в YAML:** Все акценты, шифры и режимы AI, которые до версии 12.0 существовали как «вшитые» константы в коде Python, были перенесены в декларативные файлы `.yaml`, загружаемые динамически при запуске приложения. Каждый, кто умеет работать с Блокнотом, может настроить акцент (например, заменить `sz → sh` на `sz → sch`), добавить новый язык, а также изменить звучание системного запроса для AI — без компиляции кода.
  wielojezycznosc: |
    ## Многоязычность ({liczba_kompletnych_jezykow} языков нативно)

    Начиная с версии 14.0, приложение поддерживает нативно {liczba_kompletnych_jezykow} базовых языков: {lista_kompletnych_jezykow_natywnie}. Каждая папка `dictionaries/<kod>/` содержит диакритические знаки, алфавит и фонетические правила, которые работают с текстом на этом конкретном языке — приложение автоматически определяет язык источника с помощью lingua-language-detector (по абзацу) и загружает соответствующий пакет для каждого фрагмента отдельно.

    Весь интерфейс GUI, документация (`docs/manual.<iso>.html`) и большинство системных сообщений доступны нативно на каждом из поддерживаемых языков. Системные подсказки AI в режимах Режиссера и Истории написаны на целевых языках (вручную, не автопереведены — см. `dictionaries/<kod>/rezyser/` и `dictionaries/<kod>/opowiesci/`).
  architektura_ai: |
    ## Архитектура ИИ и используемые модели

    Рекомендуемым и стандартным поставщиком ИИ является Anthropic (Claude) — все системные промпты настроены именно под него, поэтому он обеспечивает наивысшее качество повествования, наилучшее соблюдение правил мира и наиболее естественную прозу. Консолидация на Claude проходила поэтапно (Режиссер в v18.0, Истории в v18.1, Полиглот и постпродакшн в v18.2) — она стала результатом эмпирически подтвержденного превосходства в соблюдении правил мира, естественности прозы и избегании клише.

    * **Anthropic Claude Sonnet 5 (стандартный столп качества):** Движок ВСЕГО интеллекта приложения. Отвечает за творческое повествование (режиссуру сценариев, написание традиционной прозы Аудиокниги, Мозговой Штурм, а также ВСЕ режимы Историй — Выборы, Меньшее Зло, Свободный — вместе с генерацией резюме и кинематографических вставок Cinematic), продвинутые переводы с сохранением многоблочного контекста (Полиглот), а также микрозадачи: итеративное присвоение литературных названий главам и определение кода языка контента.

    * **Собственный endpoint, совместимый с OpenAI (продвинутая опция, с v18.4):** Вместо Anthropic можно указать любой endpoint, совместимый с API OpenAI (OpenRouter, Groq, Fireworks, DeepSeek, локальный Ollama, OpenAI-совместимый Gemini и другие) — единым, общим путем кода, без отдельной интеграции для каждого поставщика. Настройка в файле `golden_key.env` (`LLM_PROVIDER`, `LLM_BASE_URL`, `LLM_MODEL`, `OPENAI_API_KEY`); полная инструкция в главном руководстве (ШАГ 2B). Другие модели могут дать более низкое качество, чем Claude, под которого настроены промпты — это осознанный выбор пользователя в соотношении стоимость↔качество.
  ograniczenia_modeli: |
    ### Известные ограничения моделей (Anti-Closure)

    Несмотря на внедрение строгих системных директив, предписывающих прерывание действий в моменты напряжения (так называемая директива Anti-Closure), современные модели LLM обладают сильной, врожденной склонностью к "закрытию" историй. Это приводит к частому включению нежелательных выводов, моралей или ложных "счастливых концовок", особенно в Режиме Традиционной Аудиокниги.

    Это фундаментальное ограничение текущего поколения искусственного интеллекта. По этой причине приложение сохраняет проекты в обычных, легко редактируемых текстовых файлах (`.txt`). Это требует от пользователя принятия на себя роли живого монтажера — периодического, ручного удаления последних, "закрывающих" предложений, сгенерированных ИИ, с последующей синхронизацией памяти с исправленным файлом кнопкой «{opowiesci.btn_odswiez_z_dysku_label}» и продолжением работы.
  instalacja_uzytkownicy: |
    ## Установка и запуск

    ### Для конечных пользователей (Windows)

    1. Загрузите последний выпуск из вкладки **Releases** (пакет, помеченный как *Latest*) — файл `Rezyser_Audio_v<numer>_Installer.exe`. Запустите его двойным щелчком. Установщик по умолчанию размещается в локальном каталоге вашей учетной записи (`%LocalAppData%\Programs\Reżyser Audio GPT`) и не требует прав администратора; вы можете выбрать собственный путь с помощью кнопки «Przeglądaj». По завершении создаются ярлыки в меню «Пуск» и на рабочем столе, а также опционально открывается руководство пользователя в редакторе файлов `.txt` по умолчанию.
    2. **Настройка API Anthropic:** При первом запуске приложение сообщит об отсутствии ключа в разделе System Check. Нажмите отображаемую кнопку, чтобы сгенерировать файл `golden_key.env`, откройте его в текстовом редакторе и вставьте свой ключ Anthropic (начинающийся с `sk-ant-`).
    3. **Первые шаги:** Откройте файл `docs/manual.pl.html` (или на другом языке) в папке установки — это полное руководство пользователя, написанное доступным языком для любого пользователя, а не только для разработчиков.
  instalacja_deweloperzy: |
    ### Для разработчиков (клонирование + настройка)

    1. Клонируйте репозиторий на свой диск.
    2. Запустите файл `setup_dev.bat`, чтобы автоматически создать виртуальную среду (`.venv/`) и загрузить зависимости из `requirements.txt`.
    3. Запустите приложение командой `python main.py` или через файл `run_dev.bat`.

    Скрипты `.sh` для macOS/Linux были удалены в v13.1 — среда разработки сосредоточена на Windows из-за специфики тестирования доступности NVDA. Работа с кодом на других системах возможна, но требует ручной настройки: `python -m venv .venv && .venv/bin/pip install -r requirements.txt`.

    **Скрипты сборки релизных пакетов** (`build_release.py`, `rezyser_audio.spec`, `installer.iss`) предназначены исключительно для создания пакетов для Windows. Начиная с версии 17.0 `build_release.py` замораживает приложение с помощью PyInstaller (onedir + windowed) согласно `rezyser_audio.spec` — создает `dist/` с нативным `.exe` и папкой бандла `runtime/` (интерпретатор + библиотеки). Больше не требуется никакой переносимый Python, загруженный вручную в репозиторий; каталоги `dist/` и `build/` находятся в `.gitignore`.
  dokumentacja: |
    ## Полная документация

    Этот README — лишь архитектурный обзор проекта. Чтобы узнать о передовых техниках предотвращения галлюцинаций ИИ, инструкциях по установке совместимых синтезаторов речи (Tiflotecnia Voices, OneCore, eSpeak, Apple Voices), полном описании режимов Истории с флаконом и полном руководстве пользователя, ознакомьтесь с файлами в папке `docs/`:

    * `docs/manual.<iso>.html` — основное руководство пользователя (написано для конечного пользователя).
    * `docs/tales.<iso>.html` — руководство по режиму Истории (интерактивные текстовые игры).
    * `docs/dictionaries.<iso>.html` — инструкция для лингвистов без Python, как добавлять собственные akcenty/szyfry/режимы ИИ.

    Каждый из этих файлов доступен на {liczba_kompletnych_jezykow} языках — суффикс `.<iso>.html` (например, `manual.pl.html`, `manual.en.html`, `manual.de.html`).
  polskie_nazewnictwo: |
    ### Польская терминология — руководство для пользователей, не говорящих на польском

    Основным языком этого проекта является польский. Названия модулей, классов, комментарии в коде, а также названия каталогов и файлов данных на польском языке и — для обеспечения обратной совместимости и контракта многоязыкового движка — намеренно НЕ переводятся и не изменяются. Следующий глоссарий поможет разработчикам и пользователям систем macOS/Linux ориентироваться в структуре.

    **Каталоги пользовательских данных (рядом с исполняемым файлом или в каталоге проекта):**

    * `skrypty/` — *scripts*: проекты модуля Режиссер (`.txt` с повествованием, `.md` с Книгой Мира, `_streszczenie.txt`).
    * `opowiesci/` — *stories*: записи интерактивных Историй.
    * `runtime/` — двойная роль: каталог бандла замороженного приложения (интерпретатор + библиотеки) И контейнер скрытых метаданных проектов (`runtime/skrypty/`, `runtime/opowiesci/`).

    **Подкаталоги исходных данных в `dictionaries/<kod>/` (видимые в Менеджере Правил):**

    * `podstawy.yaml` — *basics*: конфигурация и метаданные языкового пакета.
    * `akcenty/` — *accents*: фонетические правила для синтезаторов речи.
    * `szyfry/` — *ciphers*: режимы шифрования текста.
    * `rezyser/` — *director*: творческие режимы модуля Режиссер.
    * `opowiesci/` — *stories*: режимы интерактивных Историй.
    * `gui/` — тексты интерфейса (`ui.yaml`) и шаблоны документации.
