id: tales
tresc:
  naglowek: |
    # Reżyser Audio GPT — Модуль Интерактивные Истории ({app.wersja})

    Второй основной режим приложения наряду с Режиссером — на этот раз вы становитесь игроком в динамически создаваемой истории, а не ее автором. Искусственный интеллект ведет повествование во втором лице единственного числа («Ты идешь через туманный лес, чувствуешь запах мокрых листьев..."), а вы решаете, какой будет следующий шаг — написав любое действие свободным текстом или выбрав один из пронумерованных вариантов.

    Модуль изначально был разработан с учетом нужд незрячих игроков — повествование воспроизводится линейно экранным ридером (NVDA) или TTS-движком, динамические выборы представлены в виде кнопок с голосовыми описаниями, каждое завершенное действие сигнализируется звуком звонка и автоматическим переносом фокуса на вновь сгенерированный текст.

    Вы откроете панель кнопкой "{main.btn.opowiesci}" на панели инструментов или с помощью сочетания клавиш Ctrl+5.
  krok_1_tryby_gry: |
    ## ШАГ 1: Три режима игры — выберите стиль прохождения

    Прямо под строкой с названием игры вы найдёте поле выбора режима. Режим определяет, как нарративный движок ведёт с вами диалог:

    СВОБОДНЫЙ РЕЖИМ — вы вводите любое действие произвольным текстом («попробую открыть дверь», «спрашиваю стражника о дороге», «убегаю по задней лестнице»). Нарративный движок может предложить 1–3 подсказки, но это лишь рекомендации — не обязательный путь. Наиболее свободный режим, рекомендуется опытным игрокам, импровизирующим собственную историю.

    РЕЖИМ ВЫБОРОВ — каждый ход завершается 3–5 пронумерованными вариантами A–E в виде кликабельных кнопок. Каждый выбор — это конкретное действие, которое вы можете совершить. Вы также можете ввести собственное действие произвольным текстом — движок семантически сопоставит его с ближайшим вариантом. Наиболее интуитивный режим для незрячих игроков: NVDA зачитает вам все варианты, вы переключаетесь между ними клавишей Tab, Enter подтверждает выбор.

    РЕЖИМ МЕНЬШЕГО ЗЛА — как Режим выборов, но каждый из 3–5 вариантов является невыгодным с моральной, физической или стратегической точки зрения. Нет «нейтрального» варианта, нет счастливого конца в этом ходу. Режим для любителей мрачной фантастики в духе «Tales of Consequence» или моральных драм.

    Флакон в режиме Меньшего зла (начиная с v15.2): после четырёх ходов игры в поле вариантов появляется дополнительный, НУЛЕВОЙ по номеру вариант «Откупори флакон» — и остаётся там до конца партии как повторно используемый выбор (не исчезает после применения, вы можете обращаться к нему многократно). Флакон — это вариант «отчаянного спасения», однако его действие намеренно непредсказуемо и тем драматургически весомее, чем реже даёт благоприятный результат: примерно в 60% случаев содержимое флакона вредоносно (отравляет, калечит, ослепляет), в 30% вызывает нарушение восприятия или духа (галлюцинации, изменённая речь, паника), и лишь в 10% оказывается редко-благоприятным (кратковременное усиление, дружественный дух, ключевая информация). Распределение обеспечивается Python (`random.choices` на стороне приложения), LLM получает готовый seed `{kategoria, opis}` и лишь нарративизирует его — модель не может «придумать» спасительный эффект в обход жеребьёвки. Благодаря этому флакон НИКОГДА не становится deus ex machina: даже обращение к нему в момент крайней безнадёжности, как правило, ухудшает положение. Выбор его нарративной формы (разобьётся ли флакон окончательно или будет убран обратно за пояс) остаётся за нарративным движком — иногда после первой из 60%-вредоносных доз вы уже никогда не вернётесь.

    Режим можно изменить в ходе игры, но исключительно через аварийную кнопку «Редактировать режим игры…» рядом с полем выбора режима (начиная с v15.2.3) — само поле выбора замораживается на зафиксированном режиме сразу после создания или загрузки игры, аналогично защите в Режиссер. Кнопка открывает модальный диалог с предупреждением; типичное использование этой лазейки — ситуация, когда ИИ в Режиме выборов или Меньшего зла упорно генерирует новые дилеммы вместо завершения истории: переключение на Свободный режим позволяет игроку самостоятельно описать финальную сцену. Если вы хотите начать вторую игру в другой тональности, достаточно ввести новое название игры в поле названия — поле выбора режима разблокируется само, поскольку приложение распознаёт, что вы готовите новый проект. Внимание: флакон является исключительной особенностью режима Меньшего зла — при переходе (через лазейку) в рамках той же игры в Режим выборов или Свободный режим его существование и счётчик ходов сохраняются в состоянии игры, однако пока вы не вернётесь в режим Меньшего зла, вариант «Откупори флакон» отображаться не будет.
  krok_2_quick_start: |
    ## ШАГ 2: Quick Start — готовые сценарии открытия

    Под полем названия игры найдёшь второй ряд с меткой «{opowiesci.lbl_quick_start}» и выпадающим списком. Позиция по умолчанию — "{opowiesci.quick_start_wlasna}": движок сам придумает мир на основе твоего первого действия.

    Однако ты можешь выбрать один из пяти готовых пресетов, чтобы сразу погрузиться в конкретный мир:

    ПОСТАПОКАЛИПТИЧЕСКАЯ НФ — столетие после экологической катастрофы. Остатки человечества в убежищах под Свентокшискими горами. Ты — молодой курьер Клана Штольня с первым серьёзным заданием. Режим по умолчанию: Выборов.

    ТЁМНОЕ ФЭНТЕЗИ — приграничье Королевства Трёх Струг, девятый год религиозной войны. Ты — молодая Инквизиторша, идущая по следу деревни, где кто-то укрывает одержимого ребёнка. Режим по умолчанию: Меньшее зло.

    URBAN FANTASY DETECTIVE — Варшава, 2008 год, октябрьский вечер. Ты — частный детектив, видящий призраков. Клиентка хочет найти мужа, пропавшего у Королевского замка. Режим по умолчанию: Выборов.

    КОСМИЧЕСКИЙ ХОРРОР — 2247 год, исследовательская станция на орбите нейтронной звезды. Ты просыпаешься из гибернации без капитана — и без каких-либо следов того, что капитан вообще существовал. Режим по умолчанию: Свободный (лавкрафтовская атмосфера поощряет импровизацию).

    РОМАНТИЧЕСКАЯ КОМЕДИЯ — Саска Кемпа, апрель 2024 года, маленькое кафе стоит перед угрозой закрытия. Ты — бариста-официантка, которой владелец велит «быть милой» с застенчивым редактором, которого ты давно хотела сама окликнуть. Режим по умолчанию: Свободный.

    После выбора пресета нажми "{opowiesci.btn_nowa_gra_label}" — движок внедрит в себя краткое описание мира и героя, установит режим игры по умолчанию (его можно переопределить полем выбора режима до нажатия кнопки «Новая игра»). Первый ход LLM разыграет вступительную сцену.
  krok_3_pierwsza_gra: |
    ## ШАГ 3: Первая игра с нуля — без пресета

    Если вы предпочитаете полную свободу, оставьте "{opowiesci.quick_start_wlasna}" в поле Quick Start и приготовьтесь вводить первое действие вручную.

    1. Введите название игры в строке „{opowiesci.lbl_nazwa_gry}" (например, „moja_przygoda_1") — под этим именем будут сохранены файлы нарратива, состояния и лога.
    2. Выберите режим (Свободный/Выборов/Меньшее зло).
    3. Нажмите "{opowiesci.btn_nowa_gra_label}". Приложение создаст новую игру и с этого момента начнёт автоматически сохранять её состояние. Файл с готовым нарративом появится после первого хода.
    4. В поле „{opowiesci.lbl_akcja}" внизу панели введите первое действие, например: „budzę się w nieznanym pokoju". Нажмите "{opowiesci.btn_wyslij_label}". Нарративный движок откроет мир на основе вашего действия — описание помещения, звуки, персонажи, первые решения.
    5. Каждый ход сохраняется автоматически — вы можете в любой момент закрыть приложение и загрузить игру позже с помощью кнопки "{opowiesci.btn_wczytaj_label}".
  krok_4_zasady_swiata: |
    ## ШАГ 4: Правила мира — собственные правила, которые движок соблюдает на протяжении всей игры

    Начиная с версии 15.1, над полем повествования вы найдете кнопку "{opowiesci.btn_zasady_swiata_label}". Она открывает отдельное окно редактирования с многострочным полем, в котором вы можете ввести любые правила — фонетические, механические или драматургические — которые повествовательный движок будет соблюдать в каждом последующем ходе этой конкретной игры. Правила сохраняются вместе с состоянием игры, так что загрузка игры сохраняет их в неизменном виде.

    Три типичных применения правил мира:

    ФОНЕТИЧЕСКИЕ ПРАВИЛА — управляют произношением имен персонажей через TTS (Vocalizer, ElevenLabs). Пример: «Имя Joanna всегда произносится твердо, польское [dż]; никогда мягко [j]." Движок вставляет этот вариант со следующего хода, благодаря чему имя сохранит задуманное звучание в каждой последующей сцене этой игры.

    МЕХАНИЧЕСКИЕ ПРАВИЛА — описывают «законы физики» вашего мира, которых LLM должен придерживаться. Пример: «В этом мире магия действует только ночью; днем персонажи обычные люди." Движок не придумает заклинаний в полдень, даже если действие вашего хода этого требует — вместо этого он предложит альтернативу или направит вас к сумеркам.

    ДРАМАТУРГИЧЕСКИЕ ПРАВИЛА — определяют долгосрочные напряжения между персонажами. Пример: «Антагонистка Joana пытается смягчить произношение имени протагонистки через грамматическое склонение." Движок вплетает такие тонкие сигналы в диалоги Joana, поддерживая конфликт на протяжении многих ходов без ваших повторных инструкций.

    Пустое поле правил = отсутствие дополнительных правил (поведение по умолчанию, как в v15.0). Вам не нужно определять правила сразу в начале — вы можете вернуться к окну в любой момент игры, дописать правила, замеченные в ходе игры, и нажать "{opowiesci.dlg_zasady_swiata_btn_ok}". Изменение вступает в силу с следующего хода.

    Внимание: правила мира требуют активной игры. Если вы нажмете "{opowiesci.btn_zasady_swiata_label}" без загруженной/созданной игры, вы получите сообщение «{opowiesci.zasady_bez_gry_tytul}" — сначала нажмите "{opowiesci.btn_nowa_gra_label}" или загрузите сохраненную игру.
  krok_5_slash_komendy: |
    ## ШАГ 5: Слэш-команды — быстрые действия без API

    В поле действий вы можете в любой момент ввести команду, начинающуюся с косой черты `/`. Команды локальные (не расходуют никаких вызовов к API) и работают независимо от режима игры. Принимаются как польские, так и английские варианты:

    /zapisz, /save — принудительное ручное сохранение состояния игры. Автосохранение работает после каждого хода, так что эта команда нужна в основном для уверенности перед закрытием приложения.

    /wczytaj, /load — открывает диалог выбора игры со списком доступных названий (начиная с v15.2.3 вместо системного диалога файлов — прямой список всех ваших сохранённых игр). NVDA читает список естественно, незрячему игроку не нужно перемещаться по системному диалогу файлов. После выбора название игры, режим и полное повествование восстанавливаются — вы можете продолжить с того хода, на котором остановились. Идентичное поведение имеет кнопка «{opowiesci.btn_wczytaj_label}».

    Повествовательный движок всех режимов Историй использует единую, общую модель (по умолчанию и рекомендуется Anthropic Claude Sonnet 5; начиная с v18.4 продвинутый пользователь может указать собственный endpoint, совместимый с OpenAI — см. основной manual, ШАГ 2B). Более мощная модель строго придерживается правил мира — это особенно важно в режиме Меньшее зло, где каждый вариант выбора должен оставаться реально невыгодным.

    /wizualizuj `<opis>`, /visualize `<opis>` — мультисенсорное описание текущей сцены. Не меняет состояние игры, не предлагает выборов — повествовательный движок задействует все пять чувств (зрение, слух, запах, осязание, вкус), чтобы показать сцену с большей глубиной. Результат появляется в отдельном диалоговом окне и НЕ дописывается к повествованию. Пример: «/wizualizuj jak wygląda strażnik» («/визуализируй, как выглядит страж») или «/wizualizuj zapach kawiarni» («/визуализируй запах кофейни»).

    /pomoc, /help — выводит диалоговое окно со списком всех доступных команд. Диалог доступен только для чтения и NVDA-friendly — текстовое поле получает фокус автоматически, программа чтения с экрана сразу озвучивает весь список без необходимости навигации.

    /koniec, /quit — закрывает приложение (после автосохранения текущего хода).
  krok_6_pliki_gry: |
    ## ШАГ 6: Ваши файлы — где найти готовую нарратив

    С вашей точки зрения важен один файл — готовая нарратив:

    `opowiesci/<nazwa>.txt` — полная нарратив, готовая к прослушиванию в виде аудиокниги, в папке opowiesci/ рядом с приложением. Вы можете открыть её в Блокноте, прочитать с помощью экранного диктора или загрузить в Архитектор Аудиокниг (Конвертер) и сгенерировать документ Word с главами либо временну́ю шкалу для ElevenLabs.

    Всем состоянием игры — персонажами, локацией, снаряжением, открытыми сюжетными линиями и историей предыдущих ходов — приложение управляет за вас автоматически. Оно сохраняет его после каждого хода в скрытой системной папке, которую вам не нужно (и не следует) трогать. Для загрузки сохранённой игры служит кнопка "{opowiesci.btn_wczytaj_label}" или команда /wczytaj — они покажут вам список всех ваших игр по названию. Благодаря этому вы в любой момент можете закрыть приложение и вернуться к игре позже, не беспокоясь о ручном сохранении чего-либо.
  krok_7_pamiec_modelu: |
    ## ШАГ 7: Индикатор памяти модели — почему туры в старых играх не требуют от вас ручной работы

    Под полем выбора режима находится индикатор памяти модели — полоса прогресса с описанием статуса рядом. Индикатор показывает процент заполнения контекстного окна нарративного движка (буфер рассчитан на 128 000 токенов).

    Четыре уровня заполнения:

    🟢 чистая (0%) — игра только началась, сохранённых туров нет.
    🟢 OK (1–69%) — всё в норме, можно продолжать без ограничений.
    ⚠️ предупреждение (70–89%) — движок автоматически генерирует резюме предыдущих туров в фоновом потоке. Появится сообщение «Авто-резюмирование контекста выполняется…» — не отправляйте следующий ход, пока резюмирование не завершится. После успешного завершения предыдущие туры будут свёрнуты в один конденсат, буфер освободится, и вы получите подтверждение «Память модели восстановлена» с указанием количества свёрнутых туров.
    🚨 ТРЕВОГА (90%+) — авто-резюмирование не освободило буфер (редкий случай после сбоя соединения с ИИ). Отправка следующего хода заблокирована. Принудительно завершите игру командой /koniec, затем загрузите её снова — движок самостоятельно загрузит сохранённое состояние игры без истории последних туров, буфер будет свежим.

    На практике механизм авторедукции невидим — игрок не замечает, что что-то происходит, поскольку фоновый поток решает проблему до того, как она становится заметной. Важно лишь не отправлять следующий ход во время авто-резюмирования (кнопка "{opowiesci.btn_wyslij_label}" в этот момент неактивна).
  krok_8_cinematic_warning: |
    ## ШАГ 8: Cinematic Meta Warning — драматическое прерывание после 150-го хода

    После 150 ходов одной игры нарративный движок ОДИН РАЗ вставит «Cinematic Meta Warning» — метанарративное драматическое прерывание. Оно появится в отдельном диалоговом окне со звуком колокольчика, с обращением напрямую к тебе во втором лице, с подведением итогов достижений и предупреждением о весомости принимаемых решений.

    Cinematic Warning НЕ является частью аудиокнижного повествования — приложение автоматически вырезает его содержимое из файла нарратива (помеченное маркерами ⚠️🚨⚠️), чтобы во время прослушивания аудиокниги ты не услышал мета-комментарий о собственной игре. Ты увидишь его только один раз, в отдельном диалоговом окне, где сможешь прочитать его и спокойно продолжить игру.
  krok_10_dostepnosc_nvda: |
    ## ШАГ 9: Доступность (NVDA и экранные дикторы) — проектируется с самого начала

    Весь модуль Истории был оптимизирован для незрячих игроков. Вот что конкретно было сделано:

    ПОЛЕ «ПОСЛЕДНИЙ ХОД» — это отдельное текстовое поле только для чтения (высотой в несколько строк), расположенное НАД полной нарративной историей. После каждого хода поле заменяется свежим фрагментом (заголовок «--- Tura N ---» + текст нарратива). NVDA считывает его немедленно после получения фокуса (автоматически после успешного хода), без необходимости навигировать по сотням строк полной истории. После загрузки сохранённой игры поле показывает КРАТКОЕ СОДЕРЖАНИЕ последнего сохранённого хода (обрезанное по границе предложения примерно до 1200 символов, без обрыва на середине слова) с префиксом, сообщающим, что полный нарратив находится в поле ниже.

    ПОЛЕ ПОЛНОГО НАРРАТИВА — это прокручиваемое текстовое поле (только для чтения), которое пополняется после каждого хода. NVDA читает нарратив линейно, можно навигировать стрелками внутри текста, копировать фрагменты через Ctrl+C. Поле никогда не доступно для редактирования — историю можно изменить ТОЛЬКО через новый ход, через новую кнопку «Otwórz plik narracji…» (начиная с v15.2.3, описана ниже) или через прямое редактирование файла .txt из Проводника. Это поле синхронизировано с файлом `opowiesci/<nazwa>.txt` и может использоваться как предпросмотр аудиокниги.

    КНОПКА «{opowiesci.btn_otworz_narracje_label}» (начиная с v15.2.3) — рядом с кнопками «Nowa gra» / «Wczytaj» / «Zapisz» появляется четвёртая: «Otwórz plik narracji…». Она открывает файл `opowiesci/<nazwa>.txt` в системном текстовом редакторе (Блокнот в Windows, TextEdit в macOS, редактор GUI по умолчанию в Linux — аналогично тому, как Менеджер правил открывает файлы YAML или как главная панель открывает `golden_key.env`). Типичный сценарий использования — альтернатива обходному пути «Редактировать режим игры…» → Свободный: вместо переключения в другой режим для написания финала можно просто открыть файл .txt и дописать завершающую сцену вручную. ВНИМАНИЕ — РИСК РАССИНХРОНИЗАЦИИ: перед открытием приложение показывает модальное предупреждение, поскольку .txt — это ТОЛЬКО нарратив для TTS, а источником истины о состоянии игры (персонажи, локация, инвентарь, сюжетные линии) является отдельное скрытое сохранение, которым управляет сама программа. Редактирование .txt не обновляет состояние — следующий ход LLM получит мир таким, каким он был до вашей правки: например, можно описать в файле гибель персонажа, а в состоянии игры он останется живым и появится в следующем ходу. Используйте осознанно — лучше всего только для дописывания финальной сцены, после которой вы всё равно не планируете новых ходов.

    ДИНАМИЧЕСКИЕ КНОПКИ ВЫБОРА — в режимах «Выборы» и «Меньшее зло» каждый ход создаёт новые кнопки в области выборов. Каждая имеет подсказку (tooltip), которую читает NVDA («Wybierz: idź dalej do lasu»). Переключение между ними по Tab работает естественно. Enter на выделенной кнопке автоматически отправляет этот выбор в нарративный движок.

    СКРЫТИЕ ПУСТЫХ ОБЛАСТЕЙ — в режиме «Свободный» область выборов ПОЛНОСТЬЮ скрыта, а не просто затенена: Tab её пропускает, NVDA не включает её в список элементов. Это предотвращает дезориентацию игрока, попадающего в пустой плейсхолдер. В режимах 4 и 5 область появляется только после успешной валидации ответа модели (непустой массив выборов); галлюцинация модели (пустые выборы) приводит к откату в режим свободного ввода без засорения интерфейса.

    ЗВУКОВЫЕ СИГНАЛЫ — каждый завершённый ход сопровождается системным звонком, после которого фокус автоматически переносится на поле «Последний ход». NVDA тогда прочитает свежий ход с самого начала, без необходимости навигировать по всей предыдущей истории.

    ЦВЕТОВЫЕ ИНДИКАТОРЫ ПАМЯТИ — индикатор памяти модели меняет цвет шрифта (зелёный / оранжевый / красный) в соответствии с уровнем заполнения. Для зрячих пользователей это дополнительный визуальный сигнал; NVDA в любом случае читает текст статуса, поэтому незрячие не теряют информацию.

    КЛАВИАТУРНЫЕ АКСЕЛЕРАТОРЫ — все кнопки имеют символ `&` перед одной из букв метки, что активирует акселератор Alt+буква. Работает идентично другим модулям приложения.
  najczestsze_problemy: |
    ## Наиболее распространённые проблемы

    Проблема: После нажатия «{opowiesci.btn_nowa_gra_label}» появляется сообщение «Brak klucza API».
    Причина и решение: Файл golden_key.env в главной папке приложения не содержит корректного ключа Anthropic (именно он обеспечивает работу режима Истории). Вернитесь на стартовый экран (кнопка Home), нажмите «{home.btn_generate}» и следуйте инструкциям (ШАГ 2 основного руководства).

    Проблема: Я пытаюсь отправить следующий ход, но кнопка «{opowiesci.btn_wyslij_label}» неактивна (серая).
    Причина и решение: В фоновом потоке выполняется автосжатие контекста или генерация Cinematic Warning. В строке состояния памяти отобразится «Авто-резюме контекста в процессе…». Подождите несколько секунд — кнопка разблокируется автоматически после завершения операции.

    Проблема: Я нажал на вариант выбора, но вместо отправки его текст (без буквы A–E) оказался в поле действия.
    Причина и решение: Это та же ситуация, что описана выше, — кнопка «{opowiesci.btn_wyslij_label}» в этот момент была временно неактивна (шло автосжатие или Cinematic Warning в фоне). В обычном режиме нажатие на вариант — это готовый ход, который сразу отправляется в движок; однако если отправка заблокирована, приложение не теряет ваш выбор, а вставляет его текст в поле действия и устанавливает там курсор. В этом случае у вас два пути. Первый: подождите несколько секунд, пока кнопка не разблокируется, и отправьте вариант как есть — то есть воспринимайте его как готовый черновик (это поведение по умолчанию начиная с версии 15.1 и выше). Второй: полностью замените содержимое поля своим текстом — это особенно удобно сразу после Cinematic Meta Warning, когда вместо выбора следующей дилеммы вы хотите ввести чёткую команду завершить историю и закрыть открытые сюжетные линии, если сочтёте это нужным. После редактирования нажмите «{opowiesci.btn_wyslij_label}» (или клавишу Enter).

    Проблема: Сообщение «Память модели перегружена» блокирует игру.
    Причина и решение: Автосжатие не освободило буфер (например, из-за временного превышения лимита запросов на стороне провайдера ИИ). Завершите игру командой /koniec или закройте приложение, затем перезапустите его — движок самостоятельно загрузит сохранённое состояние игры без истории последних ходов.

    Проблема: В режиме Выборов движок не сгенерировал кнопки выбора, хотя я их ожидал.
    Причина и решение: Галлюцинация модели — несмотря на режим 4, LLM вернул пустой массив вариантов. Приложение намеренно скрывает область выборов в таком случае (вместо того чтобы показывать пустой placeholder) и позволяет продолжить в режиме свободного текста. В следующем ходу варианты, скорее всего, сгенерируются корректно.

    Проблема: Я не вижу никаких файлов сохранения моей игры.
    Причина и решение: Это сделано намеренно — состояние игры приложение хранит в скрытой системной папке и управляет им самостоятельно, поэтому вам не нужно его искать или сохранять вручную. Единственный файл, который действительно вам нужен, — это готовая нарратив в папке opowiesci/ рядом с приложением — вы найдёте его там. Сохранённые игры можно загрузить кнопкой «{opowiesci.btn_wczytaj_label}» или командой /wczytaj.
