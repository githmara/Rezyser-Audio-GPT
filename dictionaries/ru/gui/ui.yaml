  btn_edytuj_stan_label: Редактировать состояние &игры…
  btn_edytuj_stan_tooltip: 'Открывает сырой файл состояния игры (.game.json) для прямого редактирования в окне с валидацией JSON. Для продвинутых: позволяет вручную исправить персонажей, локацию, инвентарь, сюжетные линии и счетчики, когда ручное редактирование повествования расходится со структурным состоянием. ВНИМАНИЕ: неправильное редактирование может повредить сохранение — изменения проверяются как JSON перед сохранением, но правильность содержания (осмысленность полей) лежит на вашей ответственности.'
  dlg_edytuj_stan_tytul: Редактирование состояния игры (.game.json)
  dlg_edytuj_stan_lbl: 'Сырой файл состояния игры в формате JSON. Редактируйте осторожно: после сохранения игра будет перезагружена из этого файла. Содержание должно оставаться корректным объектом JSON — в противном случае сохранение будет отклонено.'
  dlg_edytuj_stan_name: Поле редактирования сырого состояния игры в формате JSON
  dlg_edytuj_stan_btn_ok: '&Сохранить и перезагрузить'
  dlg_edytuj_stan_btn_anuluj: '&Отмена'
