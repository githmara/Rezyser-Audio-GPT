  btn_edytuj_tryb_label: '&Редактировать режим игры…'
  btn_edytuj_tryb_tooltip: Открывает окно аварийного изменения режима игры. Используйте только в случае, если AI не хочет завершить историю в режимах с выбором — переключение на свободный режим позволит вам самостоятельно написать финальную сцену. В нормальной игре режим не должен изменяться в процессе.
  dlg_edytuj_tryb_tytul: Изменение режима игры во время игры
  dlg_edytuj_tryb_ostrzezenie: "ВНИМАНИЕ: изменение режима во время активной игры может рассинхронизировать нарративный движок.\n\nРежим игры определяет способ генерации следующих ходов — модель AI получает разные инструкции в свободном режиме (игрок пишет собственные действия), чем в режимах с выбором (AI предлагает 3-5 вариантов на выбор, в «Меньшем зле» все неблагоприятные).\n\nТипичная причина использования этой лазейки: AI упорно генерирует очередные дилеммы вместо завершения истории — переключение на свободный режим позволяет вам самостоятельно описать финальную сцену.\n\nПосле изменения следующий ход будет использовать уже новые правила. Состояние игры (персонажи, мир, текущая наррация) остается нетронутым."
