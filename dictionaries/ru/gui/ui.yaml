  uwagi:
    akcent: |-
      Шаблон в `dictionaries/{jezyk_bazowy}/akcenty/{id_pliku}.yaml` имеет пустой конвейер фонетических замен. Акцент определяется динамически — достаточно перезапустить приложение (с версии 17.5 без шага регенерации кода).

      ВНИМАНИЕ: список `zamiany:` применяется ПОСЛЕДОВАТЕЛЬНО — каждое правило действует на выход предыдущего. Правило, вводящее букву, используемую позже как `wzor` в другом правиле, попадет в цикл (классика: `ñ → nj` перед `j → x` дает `ñ → nx`, не `nj`). Сначала замените ЦЕЛЬ на что-то безопасное, только потом вводите ИСТОЧНИК.
    akcent_oczyszczenie: |-
      Акцент очистки (`kategoria: oczyszczenie`) в пакете `{jezyk_bazowy}/`. Структура файлов этого типа идентична во всех внедренных пакетах — различается ТОЛЬКО метка, описание и комментарии (родные).
    akcent_naprawiacz: |-
      Исправитель тегов (`kategoria: naprawiacz`) в пакете `{jezyk_bazowy}/`. Специальный режим: внедряет код ISO в выходные файлы (HTML/DOCX), не изменяет содержимое.
    szyfr_zamiany: |-
      Шаблон шифра «чистые замены» в `dictionaries/{jezyk_bazowy}/szyfry/{id_pliku}.yaml`. Формат = `kategoria: szyfr` + список `zamiany:` (как акцент, но без фонетического конвейера). Образец СТРУКТУРЫ берите из акцентов — все внедренные шифры это алгоритмы (другой формат, без списка `zamiany:`).
    tryb_rezysera: |-
      Шаблон, основанный на режиме Аудиокнига (пакет `{jezyk_bazowy}/`). Агент разработает `prompt_systemowy`, `przypomnienie_uzytkownika` и `slowa_wyzwalajace` на родном языке пакета.
    tryb_opowiesci: |-
      Режим Историй ТРЕБУЕТ редактирования исходного кода — Менеджер НЕ создает файл, он дает только подсказку для агента. Режимы игры распознаются по числовым константам и словарям в `opowiesci_ai.py`/`gui_opowiesci.py`, поэтому новый режим нужно подключить (константа int добавлена в конце, записи в словарях, метка RadioBox, модель на режим). Из установленного приложения (без репозитория) это невыполнимо — нужна версия с исходным кодом.
    postprodukcja: |-
      Шаблон постпродакшена итерации по главам (пакет `{jezyk_bazowy}/`). Агент разработает `prompt_systemowy`, `prompt_uzytkownika_szablon` (плейсхолдеры {{naglowek}}, {{probka}}) и `regex_podzial_rozdzialow` подстроенный под родные названия глав (Глава/Capitolo/Kapitel/Chapter…).
    jezyk_bazowy: |-
      Менеджер создаст `dictionaries/{id_pliku}/` с подкаталогами `akcenty/`, `szyfry/`, `rezyser/`, `gui/` и `opowiesci/`. Шаблон `podstawy.yaml` имеет маркеры `<FILL NATIVELY>`. Агент ориентируется на `de/podstawy.yaml` или `it/podstawy.yaml`. Перевод UI (`gui/ui.yaml`) генерирует `buduj_wielojezyczne_ui.py`. Движок требует ≥1 файла в `rezyser/`, чтобы считать язык полным.
    szyfr_algorytm: |-
      АЛГОРИТМИЧЕСКИЙ шифр — требует функции в `core_poliglota.py` рядом с файлом YAML. Менеджер НЕ создает никакого файла; агент добавит функцию `_algorytm_*` + запись в карте `_ALGORYTMY` + файл YAML в `dictionaries/{jezyk_bazowy}/szyfry/{id_pliku}.yaml`. Это ЕДИНСТВЕННЫЙ тип правила, требующий редактирования исходного кода — из установленного приложения (без репозитория) невыполнимо, нужна исходная версия.
    jezyk_agenta: |-
      Подсказка ниже на английском (рабочий язык кодирующих агентов); содержание создаваемых файлов все равно будет на родном языке пакета. Если вы предпочитаете, чтобы агент общался с вами на вашем языке, установите это в его конфигурации (например, в Claude Code через `/config`).
    srodowisko_zrodlo: |-
      Рабочий процесс: скопируйте приведенную ниже подсказку в AI-агента с доступом к этому репозиторию (Claude Code, Cursor, Aider). Агент откроет справочные файлы, создаст/дополнит файл и проверит его. Изменения в `akcenty/`, `szyfry/`, `rezyser/` обнаруживаются после перезапуска приложения.
    srodowisko_frozen: |-
      Вы используете установленное приложение (без исходников репозитория). Приведенная ниже подсказка предполагает разработчика с репозиторием и AI-агентом — полный агентный рабочий процесс требует исходной версии. Однако из самого приложения вы можете вручную дополнить сгенерированный шаблон YAML (файлы `dictionaries/` лежат рядом с программой и редактируемы); изменения увидите после перезапуска приложения.

