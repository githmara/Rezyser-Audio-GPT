      opis: |-
        Файл в <jezyk>/akcenty/<id>.yaml с `kategoria: akcent`. Текст базового пакета (jezyk_bazowy) транслитерируется под произношение целевого синтезатора (iso != jezyk_bazowy). Менеджер создает шаблон + подсказку для агента AI, который разработает список `zamiany:`.
    akcent_oczyszczenie:
      etykieta: "Акцент очистки (предобработка, без фонетики)"
      opis: |-
        Файл в <jezyk>/akcenty/<id>.yaml с `kategoria: oczyszczenie`. Очищает текст для TTS (удаляет шум, нормализует числа) БЕЗ изменения фонетики. iso == jezyk_bazowy. Менеджер создает шаблон (готовый образец) + подсказку для перевода метки/описания на родной язык.
    akcent_naprawiacz:
      etykieta: "Исправитель тегов (вставляет ISO в HTML/DOCX)"
      opis: |-
        Файл в <jezyk>/akcenty/<id>.yaml с `kategoria: naprawiacz`. НЕ изменяет содержимое — вставляет код ISO языка в выходные файлы (<html lang>, <w:lang>). iso пустой (код указывает пользователь в GUI). Менеджер создает шаблон + подсказку для перевода метки/описания на родной язык.
    szyfr_zamiany:
      etykieta: 'Новый шифр типа «чистые замены»'
      opis: |-
        Файл в <jezyk>/szyfry/. Менеджер создает шаблон + подсказку для AI, который переведет метки/комментарии на родной язык пакета и сгенерирует список пар wzor→zamiana.
    tryb_rezysera:
      etykieta: "Новый режим Режиссера (творческий режим)"
      opis: |-
        Файл в <jezyk>/rezyser/tryb_*.yaml. Шаблон основан на режиме Аудиокнига + подсказка для AI, переводящая prompt_systemowy, przypomnienie_uzytkownika и slowa_wyzwalajace на родной язык базового пакета.
    tryb_opowiesci:
      etykieta: "Новый режим Историй (ТРЕБУЕТ РАЗРАБОТЧИКА)"
      opis: |-
        Интерактивный режим игры (Истории). В отличие от режимов Режиссера НЕ является управляемым данными: сам файл YAML — это мертвый код — движок распознает режимы по числовым константам и словарям в Python. Менеджер НЕ создает файл; он дает только подсказку для AI/разработчика с полным списком точек подключения в коде (константа int, два словаря, RadioBox, модель на режим).
    postprodukcja:
      etykieta: "Новый постпродакшн (итерация по главам)"
      opis: |-
        Файл в <jezyk>/rezyser/postprod_*.yaml. Шаблон с полями для подсказки, regex и параметров итерации + подсказка для AI, генерирующая родной prompt_systemowy и regex_podzial_rozdzialow.
    jezyk_bazowy:
      etykieta: "Новый базовый язык (например, en, de, fr)"
      opis: |-
        Создает папку <jezyk>/ с podstawy.yaml и подкаталогами akcenty/, szyfry/, rezyser/, gui/. Фонетические данные генерирует AI из подсказки; перевод UI – buduj_wielojezyczne_ui.py; режимы Режиссера копируются из pl/rezyser/ (требуется ≥1 файл tryb_*.yaml, чтобы движок признал язык полным).
    szyfr_algorytm:
      etykieta: "Новый алгоритмический шифр (ТРЕБУЕТ ПРОГРАММИСТА)"
      opis: |-
        Алгоритмы (например, реверсирование, типогликемия) требуют функций в core_poliglota.py. Менеджер дает только подсказку для AI с описанием задачи.

