  # v15.5: Обновить с диска — синхронизация внутренней памяти после ручного
  # редактирования opowiesci/<nazwa>.txt (например, обрезки сломанного кинематографического перехода).
  btn_odswiez_z_dysku_label: "Обновить с &диска"
  btn_odswiez_z_dysku_tooltip: "Заново загружает файл повествования (opowiesci/<имя>.txt) и синхронизирует внутреннюю память с вашими ручными изменениями — без жесткого сброса и повторной загрузки игры. Свежая концовка попадает в контекст движка; существующее резюме предыдущих ходов остается нетронутым. ВНИМАНИЕ: состояние игры (персонажи, локация, инвентарь) в .game.json НЕ обновляется — следующий ход может рассинхронизироваться, если вы изменили факты мира."
  odswiez_z_dysku_tytul: "Повествование обновлено с диска"
  odswiez_calosc_tresc: "Повествование заново загружено с диска, контекст движка синхронизирован с концовкой текста.\n\nВНИМАНИЕ: состояние игры (персонажи, локация, инвентарь, сюжетные линии) в .game.json НЕ было изменено — если редактирование изменило факты мира, следующий ход может с ними рассинхронизироваться."
  odswiez_streszczenie_tresc: "Контекст движка обновлен свежей концовкой с диска. Резюме предыдущих ходов осталось нетронутым, поэтому следующее резюме и ход не возникнут на устаревших данных.\n\nВНИМАНИЕ: состояние игры в .game.json НЕ было изменено — при изменении фактов мира следующий ход может рассинхронизироваться."
