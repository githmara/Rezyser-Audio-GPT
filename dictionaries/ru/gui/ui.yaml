  btn_otworz_narracje_label: '&Открыть файл повествования…'
  btn_otworz_narracje_tooltip: 'Открывает файл повествования игры (opowiesci/<nazwa>.txt) в системном текстовом редакторе. Используйте в экстренных случаях, когда AI не завершает историю в режиме Выборов/Меньшего зла и вы хотите дописать финал вручную. ВНИМАНИЕ: .txt содержит только текст для TTS; состояние игры (персонажи, локация, инвентарь) хранится в .game.json и НЕ будет обновлено — следующий ход LLM может не совпадать с измененной повествовательной частью. Перед открытием появится диалог подтверждения.'
  otworz_narracje_ostrzezenie_tytul: Редактирование файла повествования — риск несоответствия состояния
  otworz_narracje_ostrzezenie_tresc: "Сейчас вы откроете файл повествования (.txt) в системном текстовом редакторе.\n\nВНИМАНИЕ: файл .txt содержит только текст повествования для TTS, тогда как состояние игры (персонажи, локация, инвентарь, открытые сюжетные линии) хранится в отдельном файле .game.json. Редактирование .txt не обновляет состояние — следующий ход LLM получит мир до вашего редактирования, поэтому может возникнуть семантическое несоответствие (например, вы описали, что персонаж погиб, но в состоянии игры он все еще жив).\n\nТипичный безопасный случай: дописание завершающей сцены, когда AI не хочет завершить историю (альтернатива к опции «Редактировать режим игры…» → Свободный).\n\nПродолжить?"
