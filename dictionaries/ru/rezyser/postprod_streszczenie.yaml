# -----------------------------------------------------------------------------
#  ПОСТПРОДАКШН: ДОЛГОВРЕМЕННАЯ ПАМЯТЬ (СВОДКА ПРОЕКТА) — v18.13
#
#  До версии 18.12 сводка возникала ТОЛЬКО как побочный продукт режима Мозгового
#  штурма (суффиксы `streszczenie` / `alarm` в tryb_burza.yaml). Режиссёр,
#  которому нужна была одна лишь сводка, наталкивался на конфликт инструкций:
#  промпт Мозгового штурма запрещает писать что-либо, кроме трёх вариантов
#  сюжета, а схема JSON требует ключ `opcje`. Здесь модель получает ОДНУ задачу
#  и ни одного конкурирующего запрета.
#
#  Охват `rekoncyliacja` (v18.13): на вход подаётся НЕ весь файл проекта, а
#  существующая Долговременная Память + повествование от её якоря (последнего
#  заголовка, охваченного предыдущей сводкой). Благодаря этому каждая новая
#  сводка инкрементальна, а объём запроса не растёт линейно с длиной проекта.
#
#  Роль `pamiec_dlugotrwala` (v18.13): результат не ложится «рядом», как отчёт, —
#  он СТАНОВИТСЯ Долговременной Памятью проекта: файлом, мета-якорем сверки и
#  полем «Долговременная Память» на панели. Инструмент запускается также САМ,
#  когда индикатор памяти модели достигает тревожного уровня (90 %).
# -----------------------------------------------------------------------------
id: streszczenie
etykieta: "Сохранить Долговременную Память (сводка ИИ)"
kategoria: postprodukcja
kolejnosc: 20

# --- Видимость и охват обработки ---
# Пустой список = все режимы, которые пишут в файл проекта
# (Сценарий, Аудиокнига).
dla_trybow: []
zakres: rekoncyliacja
rola: pamiec_dlugotrwala

# ВНИМАНИЕ: суффикс попадает прямо в имя файла на диске
# (`<проект>_streszczenie.txt`) и должен оставаться ОДИНАКОВЫМ во всех языковых
# пакетах — это не текст для локализации, а часть имени файла (как теги-якоря
# в baza.yaml). Изменение этого значения требует также ручного переименования
# существующих файлов сводок; автоматически приложение переносит только
# исторический `_streszczenie`.
sufiks_pliku_wyniku: "_streszczenie"

# Сводка растёт вместе с проектом (охватывает ВЕСЬ сюжет на данный момент),
# поэтому лимит заметно выше, чем для заголовка главы.
max_tokens_wyjscia: 2000

# --- Параметры Anthropic ---
# Низкая температура — нужна точная запись фактов, а не творчество.
model: claude-sonnet-5
temperatura: 0.3
jezyk_odpowiedzi: по-русски
kod_jezyka: "ru"

# --- Системный промпт ---
prompt_systemowy: |
  # Роль: Архивариус сюжета

  Ты создаёшь ДОЛГОВРЕМЕННУЮ ПАМЯТЬ проекта — сжатую запись фактов, по которой повествовательный движок восстановит непрерывность, когда полный текст перестанет помещаться в его рабочую память. Твой адресат — машина, продолжающая историю, а не человек-читатель.

  ### ⚙️ Алгоритм работы:
  1. **ОБЪЕДИНЯЙ, А НЕ ДОПИСЫВАЙ.** Если в материале есть блок `[STRESZCZENIE POPRZEDNICH WYDARZEŃ]:`, это предыдущая версия памяти — она охватывает события до блока `[OBECNA FABUŁA]:`. Твой ответ заменяет её целиком, поэтому объедини оба источника в ОДНУ связную хронологическую запись. Ничто из прежней памяти не должно исчезнуть без причины; сокращай только то, что дальнейший ход событий сделал несущественным.
  2. **ФАКТЫ ВАЖНЕЕ СТИЛЯ.** Фиксируй: ход событий в хронологическом порядке, решения персонажей и их последствия, персонажей (имена, роли, отношения, состояние), места, предметы и сведения, значимые для продолжения, ОТКРЫТЫЕ линии и обещания, данные читателю.
  3. **ПИШИ СЖАТО, В ТРЕТЬЕМ ЛИЦЕ, В ПРОШЕДШЕМ ВРЕМЕНИ.** Без украшений, без диалогов, без цитат из текста. Имена собственные пиши в точности как в исходном материале — опечатка в имени вернётся в следующих главах как новый персонаж.
  4. **НЕ ТОЛКУЙ И НЕ РАЗВИВАЙ.** Не предлагай продолжения, не оценивай качество текста, не добавляй событий, которых в материале нет. Не обращайся к режиссёру.

  ### 📋 ФОРМАТ ВЫВОДА (без вступления, без комментариев, без заголовка «Сводка»):
  Сначала сама запись событий (абзацы, при необходимости — список открытых линий).
  В самом конце ОБЯЗАТЕЛЬНО одна строка:

  [СТИЛЬ И ТОН]: <одно предложение о настроении, темпе и условности повествования>

# --- Шаблон пользовательской инструкции (role=user) ---
# Подстановка {tresc} = собранный вход (прежняя память + сюжет).
prompt_uzytkownika_szablon: |
  Обнови Долговременную Память на основе приведённого ниже материала.

  {tresc}

# --- Блок Книги Мира (необязательный контекст) ---
# Добавляется ПЕРЕД содержимым, когда у проекта есть файл `<проект>.md`.
prompt_ksiegi_szablon: |
  [КНИГА МИРА — правила и персонажи, контекст для имён собственных; НЕ пересказывай её]:
  {ksiega}
