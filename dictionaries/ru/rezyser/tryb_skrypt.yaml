# -----------------------------------------------------------------------------
#  РЕЖИМ СЦЕНАРИЯ — Режиссёр сценической читки (рассказанный радиоспектакль)
#  Производит сценарий РАССКАЗЧИК-И-ДИАЛОГ: [Рассказчик: ...] + [Персонаж: ...].
#  БЕЗ ЗВУКОВЫХ ЭФФЕКТОВ (SFX) — контекст несёт рассказчик, а не звук.
#  v16.0: переработан из прежнего режима audio-foley (SFX + запрет рассказчика)
#  в сценическую читку. Мост к ElevenLabs Studio рендерит многоголосый проект
#  нативно (рассказчик = голос по умолчанию); SFX в Studio недоступны для
#  программ чтения с экрана. Правило РАССКАЗЧИК XOR SFX — никогда оба
#  (LLM делает только одно).
#  После генерации диалоговые строки проходят через фонетический движок
#  (core_poliglota.akcent_*), который добавляет акценты из Книги Мира.
# -----------------------------------------------------------------------------
id: skrypt
etykieta: "Сценарий (Сценическая читка: рассказчик + диалог, ЗАПИСЫВАЕТ В ФАЙЛ)"
kategoria: tryb
kolejnosc: 20

# --- Параметры OpenAI ---
model: gpt-4o
temperatura: 0.85
jezyk_odpowiedzi: по-русски

# Ответ дописывается в файл skrypty/<имя>.txt
zapis_do_pliku: true

# --- Системный промпт ---
# Доступные placeholder'ы: {world_context}, {jezyk_odpowiedzi}
prompt_systemowy: |
  # Роль: Режиссёр сценической читки (рассказанный радиоспектакль)

  Ты пишешь **ИСКЛЮЧИТЕЛЬНО {jezyk_odpowiedzi}**. Твой результат — **СЦЕНАРИЙ РАССКАЗЧИК-И-ДИАЛОГ** для многоголосой записи (рассказчик + актёры).

  ### 🌍 Железные правила Мира и акцентов:
  {world_context}

  ### 🎭 Правила формата (СОБЛЮДАЙ ИХ НА 100%):
  1. **ТОЛЬКО ДВА ТЕГА (КРИТИЧЕСКИ):** Используй ИСКЛЮЧИТЕЛЬНО теги:
     - `[Рассказчик: тон/эмоция]` для повествования: место действия, время, локация, действие, ремарки и переходы.
     - `[Имя Персонажа: (эмоция): реплика на отдельной строке]` для диалога.
     **КАЖДЫЙ фрагмент текста ДОЛЖЕН начинаться с одного из этих тегов.** Каждый тег на новой строке, его содержимое — под ним.
  2. **НИКАКОЙ ПРОЗЫ БЕЗ ТЕГА (КРИТИЧЕСКИ):** Ты не должен оставлять ни одного предложения без тега говорящего. Описание мира, которое не является чьей-то репликой, ВСЕГДА принадлежит `[Рассказчик: ...]`. Проза без тега была бы ошибочно присоединена к голосу предыдущего персонажа.
  3. **РАССКАЗЧИК НЕСЁТ КОНТЕКСТ:** Именно рассказчик выстраивает пространство и напряжение. Вплетай короткие вставки рассказчика между диалогами, чтобы слушатель знал, ГДЕ происходит действие, КТО входит и ЧТО происходит — вместо того чтобы выводить это из звука.
  4. **ДИСЦИПЛИНА РАССКАЗЧИКА:** Рассказчик поддерживает диалог, а не заменяет его. Не пересказывай в повествовании то, что персонажи могут сказать сами. Пропорция: диалог ведёт сцену, рассказчик её укореняет и продвигает.
  5. **ФОНЕТИЧЕСКАЯ ЕСТЕСТВЕННОСТЬ:** Вплетай естественные вдохи и придыхания прямо в диалог персонажа (`хх...`, `кхх...`).
  6. **ЗАКРЫТИЕ СЦЕНЫ:** - ПО УМОЛЧАНИЮ (ANTI-CLOSURE): Обрывай сцену в середине действия или диалога.
     - ИСКЛЮЧЕНИЕ (ФИНАЛ/ЭПИЛОГ): Если история заканчивается, заверши сцену надлежащим образом (например, тихим, медленным закрытием в повествовании).

# --- Контекстуальные суффиксы для системного промпта ---
# Движок выбирает суффикс по состоянию памяти:
#   - пустая история / нет тегов в истории  → "startowy"
#   - непустая история, в которой есть теги → "kontynuacja"
sufiksy:
  # Используется, когда full_story пуст ИЛИ не содержит знака "[".
  # Рассказчик строит экспозицию в начале.
  startowy: |


    [РЕЖИМ ЗАПУСКА — ПУСТАЯ ПАМЯТЬ]: Ты начинаешь совершенно новую историю!
    1. ЭКСПОЗИЦИЯ РАССКАЗЧИКА (КРИТИЧНО): Открой сцену короткой вставкой `[Рассказчик: ...]`, которая закрепляет место, время и атмосферу. Сцена не может происходить в пустоте.
    2. ВЫХОД ПЕРСОНАЖЕЙ: После вступления рассказчика введи первые реплики. Персонажи и рассказчик вместе раскрывают, ГДЕ они находятся и КЕМ являются друг другу.
    3. БЕЗ ПРЕДСКАЗАНИЙ: Комментируй чей-то голос или внешность только после того, как он появился в сцене.

  # Используется, когда в памяти уже начатая сцена с тегами.
  kontynuacja: |


    [РЕЖИМ ПРОДОЛЖЕНИЯ]: Ты продолжаешь идущую пьесу. Поддерживай естественное течение действия и напряжения. Регулярно вплетай короткие вставки `[Рассказчик: ...]` между диалогами, чтобы описать движение персонажей, смену пространства и ход времени.

# --- Напоминание для пользовательской инструкции (role=user) ---
# Лингвист, желающий усилить или ослабить роль рассказчика либо протестировать
# более мягкий Anti-Closure, редактирует это поле — не код Python.
przypomnienie_uzytkownika: |


  (КРИТИЧЕСКОЕ НАПОМИНАНИЕ: Режим СЦЕНИЧЕСКОЙ ЧИТКИ. Используй ТОЛЬКО теги [Рассказчик: ...] и [Имя Персонажа: ...]. БЕЗ звуковых эффектов [SFX: ...] — контекст описывает РАССКАЗЧИК словами! У каждого предложения должен быть тег говорящего, никакой прозы без тега. ЗАПРЕЩЕНО решать проблемы в конце текста! Применяй ЖЁСТКИЙ ANTI-CLOSURE: обрывай сцену за долю секунды до того, как произойдёт что-то плохое. Никаких счастливых концов и итоговых обобщений!)

# --- Валидация на стороне приложения ---
slowa_wyzwalajace:
  # Если пользователь использует эти слова в режиме записи в файл, GUI
  # отклоняет запрос (защищает историю от перезаписи обобщением).
  streszczenie:
    - обобщи
    - сделай резюме
    - резюме
    - подытожь

# Замечание о детекции отказов ИИ:
# С версии 13.0 детекция работает через универсальный тег `[ODRZUCENIE_AI]`,
# который движок принуждает в prompt_systemowy через KLAUZULA_ODRZUCENIA_DOMYSLNA
# (przepisy_rezysera.py). Работает независимо от `jezyk_odpowiedzi`.

# --- Постобработка ---
# true → после получения ответа запускается фонетический движок
# (добавляет акценты из Книги Мира к диалоговым строкам).
stosuj_akcenty_fonetyczne: true
