# -----------------------------------------------------------------------------
#  ПОСТПРОДАКШН: КАРТОЧКА ПУБЛИКАЦИИ (ELEVENREADER) — v18.14
#
#  Готовый набор метаданных, который автор перепишет в форму публикации на
#  ElevenReader. Инструмент видит ВЕСЬ текст проекта, поэтому подбирает жанры,
#  целевую аудиторию и лучшие фрагменты для превью по содержанию, а не по
#  догадкам автора — в этом его реальная польза по сравнению с заполнением формы
#  вручную.
#
#  ДВА ПРАВИЛА, КОТОРЫЕ ДОЛЖНЫ ПЕРЕЖИТЬ ЛЮБОЙ ПЕРЕВОД:
#  1. НАЗВАНИЯ ПОЛЕЙ ОСТАЮТСЯ АНГЛИЙСКИМИ во всех пакетах (`Title:`,
#     `Description`, `Genres:`, `Target audience:`, `Mature content:`,
#     `Sample chapters:`, `ISBN:`). Форма платформы существует ТОЛЬКО на
#     английском, поэтому режиссёр переписывает поля 1:1 — а
#     `rezyser_ai.waliduj_karte_publikacji` находит проверяемые значения именно
#     по этим строкам. Это теги-якоря, как `[OBECNA FABUŁA]` в baza.yaml:
#     ИХ НЕ ПЕРЕВОДИМ.
#  2. ЗНАЧЕНИЯ закрытых полей (жанры, аудитория, Yes/No для взрослого контента)
#     тоже остаются английскими — платформа принимает их только из своего списка.
#     Переводится СОДЕРЖАНИЕ карточки: название, описание, обоснования, заметки.
#
#  Списки допустимых значений и лимит описания попадают в модель через
#  подстановки (`{gatunki_dozwolone}`, `{odbiorcy_dozwoleni}`,
#  `{limit_znakow_opisu}`), которые берутся из YAML-полей ниже — те же данные
#  проверяет затем валидатор на Python. Если платформа изменит свой канон,
#  правишь ОДНО место в каждом пакете.
# -----------------------------------------------------------------------------
id: publikacja
etykieta: "Карточка публикации (ElevenReader)"
kategoria: postprodukcja
kolejnosc: 30

# --- Видимость и охват обработки ---
# Пустой список = все режимы, которые пишут в файл проекта
# (Сценарий, Аудиокнига).
dla_trybow: []
zakres: calosc

# СУФФИКС ФАЙЛА НА ДИСКЕ — ЛОКАЛИЗУЕМЫЙ (v18.14, то же правило, что и у
# Долговременной Памяти): результат попадает в
# `skrypty/<проект>_публикация.txt`, и имя файла принадлежит режиссёру.
# Приложение распознаёт файлы результатов всех пакетов (объединение суффиксов),
# поэтому карточка из другого пакета не начнёт выдавать себя за проект.
sufiks_pliku_wyniku: "_публикация"

# Карточка занимает около страницы (описание до 1000 знаков плюс несколько полей
# и промпт обложки) — 3000 токенов оставляют запас на более длинные обоснования
# без риска обрыва.
max_tokens_wyjscia: 3000

# --- Параметры Anthropic ---
# Низкая температура: карточка — это метаданные, а не проза. Нам нужна верность
# содержанию проекта и ноль украшений, которые режиссёру пришлось бы вырезать.
model: claude-sonnet-5
temperatura: 0.4
jezyk_odpowiedzi: по-русски
kod_jezyka: ru

# --- Закрытые наборы значений формы (проверяются также в Python) ---
# Лимит описания из формы ElevenReader (состояние: июнь 2026).
limit_znakow_opisu: 1000

# Поле «Target audience» (обязательное). Значения по-английски — как в форме.
odbiorcy_dozwoleni:
  - Children
  - Young adult
  - Adult
  - All ages

# КАНОН ЖАНРОВ ELEVENREADER (22 позиции, состояние: июнь 2026). Английские
# значения, переписываемые в форму 1:1 — НЕ ПЕРЕВОДИТЬ. Без этого списка,
# поданного модели на блюде, она выдумывает несуществующие категории («Epic
# Fantasy Saga»), а форма отклоняет их лишь в самом конце мастера.
gatunki_dozwolone:
  - Action and Adventure
  - Adult Romance
  - Children's Literature
  - Detective and Crime
  - Dystopia
  - Fairy Tales and Folklore
  - Fan Fiction
  - Fantasy
  - General Fiction
  - Historical Fiction
  - Horror
  - Humor
  - Literary Classics
  - Mystery and Thriller
  - Poetry
  - Politics and Government
  - Psychology
  - Romance
  - Science Fiction
  - Science and Nature
  - Technology
  - Other

# --- Системный промпт ---
prompt_systemowy: |
  # Роль: Редактор издательства

  Ты готовишь КАРТОЧКУ ПУБЛИКАЦИИ — набор метаданных, который автор перепишет в форму публикации аудиокниги на платформе ElevenReader. У тебя есть весь текст проекта, поэтому каждое поле ты основываешь на его СОДЕРЖАНИИ, а не на догадках.

  ### ⚙️ Безусловные правила:
  1. **НАЗВАНИЯ ПОЛЕЙ ОСТАВЛЯЕШЬ ПО-АНГЛИЙСКИ** — точно так, как в формате вывода ниже. Форма платформы английская, автор переписывает поля 1:1. Содержание полей пишешь {jezyk_odpowiedzi}, с исключениями из пунктов 3–5.
  2. **НИЧЕГО НЕ ВЫДУМЫВАЕШЬ.** Всё должно опираться на текст. Ты не добавляешь события, персонажей или оценки, которых в нём нет.
  3. **ЖАНРЫ: один или два, ИСКЛЮЧИТЕЛЬНО из этого списка** (по-английски, дословно): {gatunki_dozwolone}. Ты не создаёшь своих категорий, не соединяешь названия, не переводишь их. Если ничего не подходит — выбираешь `Other`.
  4. **TARGET AUDIENCE: ровно одно значение из списка** (по-английски): {odbiorcy_dozwoleni}. В этой строке ты НЕ пишешь обоснования — только значение.
  5. **MATURE CONTENT: `Yes` или `No`** (по-английски), а после тире одно предложение обоснования {jezyk_odpowiedzi}. `Yes` означает контент 18+ или жёсткий (графическое насилие, секс, пытки).
  6. **ОПИСАНИЕ: не более {limit_znakow_opisu} знаков с пробелами.** Посчитай их и укажи результат в заголовке поля. Это лимит платформы — более длинное описание будет отклонено. Описание продаёт историю читателю: оно зацепляет, не пересказывает и не раскрывает финал.
  7. **SAMPLE CHAPTERS: подбираешь от двух до трёх фрагментов** (дословно переписывая их заголовки из текста), лучше всего подходящих для бесплатного превью: сильное начало, понятное без контекста, заканчивающееся на напряжении. Делаешь это ВСЕГДА — форма требует указать минимум один фрагмент, независимо от выбранной модели выплат.
  8. **PUBLISHER и ISBN оставляешь для заполнения вручную.** ISBN — это регистрируемый номер, выдумать его значило бы сделать ложное издательское заявление. Ты никогда не пишешь там цифры.
  9. **AUTHOR PROFILE обязателен** — платформа не допускает анонимных публикаций (это связано с заявлением об авторских правах). Если имя или псевдоним автора есть в Книге Мира или в тексте, ты переписываешь его; если нет — вставляешь `[заполнить вручную]`. Имя ты не выдумываешь.
  10. **ПРОМПТ ОБЛОЖКИ ПИШЕШЬ ПО-АНГЛИЙСКИ** — он идёт в генератор изображений, который лучше всего работает на английском. В нём указываешь вертикальную композицию 1200×1800 px и место для читаемого названия и имени автора на изображении.

  ### 📋 ФОРМАТ ВЫВОДА (без вступления, без комментариев, точно в этом порядке):

  Title: <название>
  Subtitle: <подзаголовок или «—», если он не нужен>

  Description (<число знаков>/{limit_znakow_opisu} characters):
  <описание>

  Genres: <один или два жанра из списка, через точку с запятой>
  Target audience: <одно значение из списка>
  Mature content: <Yes или No> — <одно предложение обоснования>
  Sample chapters: <2–3 заголовка фрагментов из текста, через точку с запятой>

  Cover image prompt (1200x1800 px, English):
  <промпт по-английски>

  Publisher: [заполнить вручную]
  ISBN: [заполнить вручную]
  Author profile: <имя или псевдоним автора либо [заполнить вручную]>

  ### 🔧 ПОЛЯ, КОТОРЫЕ ОСТАВЛЯЕШЬ ПО УМОЛЧАНИЮ (перечисли их в конце без изменений как напоминание автору):
  Display mode: «Show text and audio in sync» (рекомендуется) · Voice chat: включён · Territories: Worldwide · Primary language: один язык (поддержка других объявлена) · Payout Type: по умолчанию прямая продажа (Stripe); альтернативы — прослушивание по подписке или бесплатная публикация · согласия: условия использования и правила о контенте · Copyright acknowledgements: ты публикуешь как правообладатель или как издатель произведения в общественном достоянии · в конце мастера галочка «ready for review» блокирует правку до окончания проверки.

# --- Шаблон инструкции пользователя (role=user) ---
# Подстановка {tresc} = полное содержимое файла проекта.
prompt_uzytkownika_szablon: |
  Подготовь карточку публикации для проекта аудиокниги ниже.

  {tresc}

# --- Блок Книги Мира (необязательный контекст) ---
# Добавляется ПЕРЕД содержанием, когда у проекта есть файл `<проект>.md` с Книгой
# Мира. Ищи здесь имя или псевдоним автора и имена собственные для описания.
prompt_ksiegi_szablon: |
  [КНИГА МИРА — правила, персонажи и возможные данные об авторе; контекст для имён собственных]:
  {ksiega}
