# -----------------------------------------------------------------------------
#  СВОБОДНЫЙ РЕЖИМ (режим 3) — игрок пишет своё действие свободным
#  текстом. Поле `wybory` в ответе LLM может быть пустым или содержать
#  1-3 подсказки (трактуются только как намёки, а не как обязательный
#  путь). В режиме 3 интерфейс ВСЕГДА скрывает область выборов (A11y),
#  независимо от содержимого.
# -----------------------------------------------------------------------------
id: tryb_swobodny
etykieta: "Свободный режим — пиши любое действие"
kategoria: tryb
kolejnosc: 30

# --- Параметры Anthropic (наследуются из baza.yaml, если не заданы здесь) ---
model: claude-sonnet-4-6
temperatura: 0.85

# --- Дополнение к prompt_systemowy из baza.yaml ---
prompt_systemowy: |
  РЕЖИМ: СВОБОДНЫЙ. Поле `wybory` может быть пустым или содержать 1-3 подсказки (игрок пишет своё действие, поэтому варианты — лишь намёки, а не обязательный путь).
