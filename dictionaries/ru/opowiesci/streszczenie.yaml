# -----------------------------------------------------------------------------
#  РЕЗЮМЕ — автоматическое сжатие `ostatnie_tury` после превышения
#  порога памяти модели (PROG_OSTRZEZENIE = 70 % от 128k токенов ≈
#  89,6k). Результат заменяет всю историю ходов одной записью в
#  формате `{"akcja_gracza": "(резюме предыдущих ходов)",
#  "narracja_skrot": <результат>}`. Интерфейс запускает его в фоновом
#  потоке ПОСЛЕ успешного хода, блокируя `_btn_wyslij` до завершения
#  (race condition guard `_meta_w_toku=True`).
# -----------------------------------------------------------------------------
id: streszczenie
etykieta: "Автоматическое резюме контекста"
kategoria: meta
kolejnosc: 60

# --- Параметры Anthropic ---
# Низкая температура — нам нужно верное, фактическое резюме (не творческое).
model: claude-sonnet-4-6
temperatura: 0.3
max_tokens: 800
timeout_s: 60.0

# --- Системный промпт ---
prompt_systemowy: |
  Ты — нарративный ассистент. Ты получаешь список недавних ходов интерактивной истории (действие игрока + сжатый нарратив за ход). Сгенерируй резюме объёмом 200-400 слов, охватывающее: ключевые события сюжета, решения игрока и их последствия, важных персонажей, появляющихся в повествовании, посещённые места, нерешённые нити. Пиши в третьем лице, нейтрально, как краткое содержание романа — ЭТО НЕ ход игры, игрок не читает это как нарратив, нарративный движок использует это как долговременную память.

# --- role=user message wrappers (lifted out of opowiesci_ai.py, v17.9) ---
instrukcja_payload: "Список ходов для резюмирования ниже."
