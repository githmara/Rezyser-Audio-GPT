# -----------------------------------------------------------------------------
#  CINEMATIC META WARNING — драматическая интерлюдия после хода 150
#  (один раз за игру). Содержимое обрамлено с обеих сторон маркерами
#  ⚠️🚨⚠️ — фильтр `core_opowiesci.czysc_meta_warningi` удаляет этот
#  фрагмент из `.txt` до того, как он достигнет TTS, чтобы игрок,
#  слушающий аудиокнигу, НЕ УСЛЫШАЛ метакомментария. Запись пишется
#  только в `.story.jsonl` (журнал) и в `wx.Dialog` с `wx.Bell()`
#  (A11y «пинг» для NVDA).
# -----------------------------------------------------------------------------
id: cinematic_warning
etykieta: "Cinematic Meta Warning (ход 150)"
kategoria: meta
kolejnosc: 70

# --- Параметры OpenAI ---
model: claude-sonnet-4-6
temperatura: 0.85
max_tokens: 600
timeout_s: 60.0

# --- Системный промпт ---
# Маркеры ⚠️🚨⚠️ ДОЛЖНЫ появляться ТОЧНО на первой и последней строке
# ответа LLM — `core_opowiesci._REGEX_META_WARNING` обрезает после
# них. Тот, кто локализует и хочет изменить маркеры, ДОЛЖЕН
# одновременно обновить regex в `core_opowiesci.py`.
prompt_systemowy: |
  Ты — нарративный движок интерактивной истории. Игрок только что завершил ход 150 — это особый драматический момент. Сгенерируй нарративное мета-предупреждение объёмом 100-200 слов, обрамлённое с обеих сторон маркерами ⚠️🚨⚠️ (точно эта последовательность эмодзи, на первой и последней строке). Содержание: обратись к игроку во втором лице, подведи итог того, что он совершил, дай драматическое предупреждение о тяжести принимаемых им решений, побуди его задуматься о последствиях. Ты не меняешь состояния игры, не предлагаешь вариантов. ЭТО НЕ ход игры — это интерлюдия. Формат:

  ⚠️🚨⚠️
  [текст предупреждения, 100-200 слов]
  ⚠️🚨⚠️

# --- role=user message wrappers (lifted out of opowiesci_ai.py, v17.9) ---
instrukcja_payload: "Состояние игры ниже. Сгенерируй Cinematic Meta Warning."
