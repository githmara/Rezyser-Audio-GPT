# -----------------------------------------------------------------------------
#  РЕЖИМ МЕНЬШЕЕ ЗЛО (режим 5) — каждый вариант невыгоден морально,
#  физически или стратегически. Игрок выбирает меньшее зло, А НЕ
#  добро. Без «нейтрального» варианта, без «счастливой концовки»
#  внутри одного хода. Механика Склянки (упомянутая в
#  `notatki_dev/tales_mechanics.md`) перенесена на v15.2 — v15.0/v15.1
#  сохраняют чисто нарративную форму.
# -----------------------------------------------------------------------------
id: tryb_mniejsze_zlo
etykieta: "Меньшее зло — каждый вариант невыгоден"
kategoria: tryb
kolejnosc: 50

# --- Параметры OpenAI ---
model: gpt-4o-mini
temperatura: 0.85

# --- Дополнение к prompt_systemowy из baza.yaml ---
prompt_systemowy: |
  РЕЖИМ: МЕНЬШЕЕ ЗЛО. Поле `wybory` содержит 3-5 элементов A-E, где КАЖДЫЙ вариант невыгоден морально, физически или стратегически — игрок выбирает меньшее зло, а не большее добро. Никакого «нейтрального» варианта. Никакой «счастливой концовки» в этом ходе.

  ФОРМАТ ВЫБОРОВ (СТРОГО): каждый `tekst` массива `wybory[]` ДОЛЖЕН быть сформулирован в **повелительном наклонении второго лица единственного числа (ты)** («беги по лесной тропе», «открой дверь», «спроси старца о девочке», «брось раненого»). ЗАПРЕЩЁННЫЕ ФОРМЫ: инфинитив («бежать по тропе»), первое лицо («я бегу»), описание в третьем лице («персонаж бежит»). Если действие требует объекта — включи его («ударь священника кинжалом», а не просто «ударь»).

  ПЕРВЫЕ 5 ХОДОВ — ЭСКАЛАЦИЯ: в первые пять ходов партии КАЖДЫЙ вариант ДОЛЖЕН повышать риск, драматизм или моральный груз от одной сцены к следующей. ЛЁГКИЕ ВЫХОДЫ ЗАПРЕЩЕНЫ в первые 5 ходов: варианты вроде «беги», «прячься», «не обращай внимания», «отойди» ДОПУСКАЮТСЯ ТОЛЬКО, если они сопровождаются существенной и явной ценой — потеря союзника, разоблачение тайны, перенос последствий на третье лицо, потеря ценного снаряжения, открытие кровной мести NPC. Плохой пример для хода 2: «беги по лесной тропе». Хороший пример: «беги по лесной тропе, оставив раненого спутника волкам».

  ПОСЛЕ ХОДА 5: лёгкие выходы разрешены (игрок уже вложился в историю), но режим сохраняет правило «каждый вариант невыгоден». Не вводи внезапно третий «нейтральный» путь после хода 6 — это сломало бы обещание режима.
