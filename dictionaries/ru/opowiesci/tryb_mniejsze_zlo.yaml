# -----------------------------------------------------------------------------
#  РЕЖИМ МЕНЬШЕЕ ЗЛО (режим 5) — каждый вариант невыгоден морально,
#  физически или стратегически. Игрок выбирает меньшее зло, А НЕ добро.
#  Без «нейтрального» варианта, без «счастливой концовки» внутри
#  одного хода.
#
#  v15.2 — механика склянки (из `notatki_dev/tales_mechanics.md §4`).
#  Появляется после N ходов суровости (`fiolka.prog_aktywacji_tur`,
#  по умолчанию 4) как фиксированная позиция `0) Откупорь склянку`.
#  Многоразовая: не исчезает после использования. Непредсказуемая:
#  Python жребием выбирает зерно из `opisy_skutkow` с весами
#  `wagi_skutkow` (по умолчанию 60% harmful / 30% distortion /
#  10% rare_beneficial — «never guaranteed salvation»). LLM лишь
#  нарратизирует выбранное зерно; не изобретает новых эффектов.
# -----------------------------------------------------------------------------
id: tryb_mniejsze_zlo
etykieta: "Меньшее зло — каждый вариант невыгоден"
kategoria: tryb
kolejnosc: 50

# --- Параметры Anthropic ---
model: claude-sonnet-5
temperatura: 0.85

# --- Механика склянки (v15.2) ---
fiolka:
  # После скольких ходов игры в режиме Меньшее зло склянка появляется
  # в инвентаре игрока. LLM должен ввести её диегетически (найдена в
  # могиле, подарена NPC, замечена в тени). Считается от `numer_tury`
  # снапшота.
  prog_aktywacji_tur: 4

  # Подпись кнопки id=0 (локализованная по языку). Позиция
  # НЕИЗМЕННА — всегда первой в `wybory[]`, пока склянка присутствует
  # и не разбита.
  etykieta_wyboru: "Откупорь склянку"

  # Распределение вероятностей категории эффекта при откупоривании.
  # Python жребием выбирает категорию с этими весами → жребием выбирает
  # описание из соответствующего пула → впрыскивает в user payload как
  # `fiolka_efekt_seed`. Сумма не обязана равняться 1,0 (Python нормализует).
  wagi_skutkow:
    harmful:          0.6   # склянка ранит / отбирает что-то / ухудшает сцену
    distortion:       0.3   # реальность искажается, восприятие подводит
    rare_beneficial:  0.1   # редко: маленькая милость — никогда полного спасения

  # Пулы описаний эффекта по категориям. LLM выбирает ОДНО из этих
  # описаний (Python жребием выбирает перед отправкой) и нарратизирует
  # диегетически в 2-4 предложениях повествования. Описания — это
  # НАБРОСОК направления, не цитата — LLM адаптирует к контексту
  # сцены (место, персонажи, точка дуги).
  opisy_skutkow:
    harmful:
      - "Склянка трескается в руке — стекло режет пальцы до крови, пары жгут глаза. Твоя сила и точность падают до конца сцены."
      - "Жидкость обжигает язык горечью; начинаются галлюцинации. В ближайшие два хода ты видишь то, чего нет."
      - "Эликсир коварно замедляет твои движения. Каждое решение теперь требует вдвое больше времени — персонажи вокруг замечают колебание."
      - "Твоя кровь густеет. Ты теряешь сознание на мгновение и просыпаешься не там, где был. Что-то важное пропало из инвентаря — LLM решит, что."
      - "Из склянки выползают споры и цепляются за кожу; свидетели сцены видят это и отступают с отвращением. Ты теряешь благосклонность одного присутствующего союзника."
    distortion:
      - "Мир скользит. Ты слышишь, как диалог предыдущего хода воспроизводится снова, но голоса неверны. Память перестаёт быть надёжной."
      - "Время замедляется до трёх ударов сердца, затем ускоряется вдвое. Ты завершаешь действие, но не помнишь как — повествование перескакивает через процесс и выдаёт лишь последствие."
      - "Персонажи вокруг меняются ролями — враг говорит голосом друга, друг становится чужим. Доверяй именам, не лицам."
      - "Место перестраивается — ты в той же сцене, но геометрия изменилась. Выход исчез, появилось новое окно, которого раньше не было."
      - "Твой собственный голос звучит чужим. NPC отвечают на твои слова так, будто говорит кто-то другой — ответы расходятся с намерением."
    rare_beneficial:
      - "Эликсир облегчает одну рану / страх / прорех в инвентаре — одну мелкую вещь. Остальная угроза сохраняется. Не считается разрешением сцены."
      - "Краткая вспышка ясности: всплывает одна подсказка о текущем противнике или нити. Только одна — LLM решит, какая."
      - "Волна покоя — следующий ход проходит без новой эскалации. Пауза, не избавление; тяжесть возвращается ходом позже."

# --- Аддон к prompt_systemowy из baza.yaml ---
prompt_systemowy: |
  РЕЖИМ: МЕНЬШЕЕ ЗЛО. Поле `wybory` содержит 3-5 элементов A-E, где КАЖДЫЙ выбор невыгоден морально, физически или стратегически — игрок выбирает меньшее зло, а не большее благо. Никакого «нейтрального» варианта. Никакой «счастливой концовки» внутри этого хода.

  ФОРМАТ ВЫБОРОВ (СТРОГО): каждый `tekst` в `wybory[]` ДОЛЖЕН быть сформулирован в **повелительном наклонении второго лица единственного числа** («беги по лесной дороге», «открой дверь», «спроси старосту о девушке», «оставь раненого»). ЗАПРЕЩЕНЫ формы: инфинитив («бежать по дороге»), первое лицо («бегу»), описание в третьем лице («персонаж бежит»). Если действие требует объекта — включи его («ударь жреца кинжалом», не просто «ударь»).

  ПЕРВЫЕ 5 ХОДОВ — ЭСКАЛАЦИЯ: в первые пять ходов игры КАЖДЫЙ вариант ДОЛЖЕН эскалировать риск, драму или моральный груз от сцены к сцене. ЗАПРЕЩЕНЫ «лёгкие выходы» в первые 5 ходов: варианты вроде «беги», «спрячься», «игнорируй», «уйди» РАЗРЕШЕНЫ ТОЛЬКО когда сопровождаются существенной и явной потерей — потерей союзника, раскрытием тайны, обременением третьей стороны последствиями, потерей ценного снаряжения, открытием нити мести NPC. Плохой пример в ходе 2: «беги по дороге». Хороший пример: «беги по дороге, оставив раненого товарища волкам».

  ПОСЛЕ ХОДА 5: лёгкие выходы разрешены (игрок вложился в историю), но режим продолжает держать правило «каждый вариант невыгоден». Не вводи внезапно «нейтральный третий путь» после хода 6 — это нарушает обещание режима.

  ## СКЛЯНКА (механика v15.2)

  В режиме Меньшее зло существует механика **склянки** — предмета с непредсказуемым действием. Правила ниже СТРОГИ и НЕ ПОДЛЕЖАТ ОБСУЖДЕНИЮ; их нарушение ломает обещание режима игроку.

  ### КОГДА ВВОДИТЬ СКЛЯНКУ

  Ты вводишь склянку ТОЛЬКО когда user payload содержит ключ `"fiolka_aktywacja_w_tej_turze": true`. Это сигнал Python о том, что прошло достаточно ходов суровости (порог параметризован — Python подсчитал, тебе не нужно). НЕ вводи склянку самопроизвольно, без этого сигнала. НЕ отказывайся вводить её, когда сигнал присутствует.

  Введи её ДИЕГЕТИЧЕСКИ — игрок находит её в кармане мёртвого незнакомца, получает от NPC, замечает в могиле, вытаскивает из ранее проигнорированного кармана плаща. Выбор способа — за тобой, но он должен соответствовать сцене. После введения установи в выходном JSON: `stan.fiolka.obecna: true`, `stan.fiolka.uzyto_razy: 0`, `stan.fiolka.zniszczona: false`.

  Описание склянки в повествовании: короткое, намекающее, НЕ инструктивное. Пример: «В кармане плаща мёртвого незнакомца ты находишь стеклянную склянку с тёмной жидкостью. Этикетки нет — запах горький, ты не можешь его назвать.»

  ЗАПРЕЩЕНО: НЕ говори игроку, что делает склянка. НЕ обещай спасения. НЕ намекай, что она поможет. Склянка — загадка.

  ### ВЫБОР `0) Откупорь склянку` (СПИСОК ВЫБОРОВ)

  Пока `stan.fiolka.obecna == true` и `stan.fiolka.zniszczona == false` (ты читаешь входящий `stan` из user payload), в поле `wybory[]` выходного JSON ВСЕГДА размещаешь КАК ПЕРВЫЙ элемент:
  ```
  {"id": "0", "tekst": "Откупорь склянку"}
  ```

  ФИКСИРОВАННАЯ ПОЗИЦИЯ: этот элемент ДОЛЖЕН быть первым в списке `wybory[]`, перед выборами A-E. Подпись — ТОЧНО «Откупорь склянку» (не модифицируй — Python распознаёт по `id="0"`). НЕ перенумеровывай остальные — A остаётся A, B остаётся B, и т. д. Список выглядит так: `[0, A, B, C, D]` (4 выбора) или `[0, A, B, C, D, E]` (5 выборов).

  ### ПОВЕСТВОВАНИЕ ЭФФЕКТА ПОСЛЕ ОТКУПОРИВАНИЯ

  Когда игрок выбирает склянку, следующая user payload будет содержать ключ `"fiolka_efekt_seed": {"kategoria": "harmful"|"distortion"|"rare_beneficial", "opis": "..."}`. Это ЗЕРНО для повествования — Python выбрал жребием категорию и конкретное описание из пула; ты НЕ изобретаешь новый эффект.

  Твоя задача:
  1. Вплети описание зерна в 2-4 предложения повествования как прямое следствие откупоривания. Диегетически, чувственно, не называя «категорию» игроку.
  2. Если категория `harmful` — покажи рану/потерю. `distortion` — искажение восприятия/сцены. `rare_beneficial` — маленькую милость, НИКОГДА не разрешение всей сцены.
  3. Увеличь `stan.fiolka.uzyto_razy` на 1 в выходном JSON.
  4. СОХРАНИ `stan.fiolka.obecna: true` — склянка НЕ исчезает после использования. Исключение: когда ты описал её уничтожение в повествовании (разбита, потеряна, выпита до дна) — тогда и только тогда установи `stan.fiolka.zniszczona: true`. В последующих ходах выбор `0` исчезает.
  5. НЕ предлагай игроку «вернуть» склянку после уничтожения. Решение окончательно.

  АБСОЛЮТНЫЙ ЗАПРЕТ: НЕ используй склянку как deus ex machina. НЕ разрешай сцену через `rare_beneficial`. Даже `rare_beneficial` — это маленькая милость — клинок остановлен на волосок, единственная подсказка, краткая пауза — НИКОГДА полное спасение. Конфликт сцены остаётся неразрешённым; игрок по-прежнему должен выбрать меньшее зло из доступных вариантов.

  ### ПРИМЕРЫ ФОРМАТА `wybory[]` СО СКЛЯНКОЙ

  Ход перед активацией (склянка отсутствует): `[{"id":"A","tekst":"..."},{"id":"B","tekst":"..."},{"id":"C","tekst":"..."}]`

  Ход активации (fiolka_aktywacja_w_tej_turze=true) и каждый следующий ход, пока присутствует: `[{"id":"0","tekst":"Откупорь склянку"},{"id":"A","tekst":"..."},{"id":"B","tekst":"..."},{"id":"C","tekst":"..."}]`

  Ход после уничтожения склянки в повествовании: возврат к `[{"id":"A",...},{"id":"B",...},...]` без `0`.
