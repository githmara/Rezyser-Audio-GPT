# -----------------------------------------------------------------------------
#  РЕЖИМ ВЫБОРОВ (режим 4) — 3-5 пронумерованных вариантов за ход.
#  Свободный текстовый ввод игрока сопоставляется семантически с
#  ближайшим вариантом. Интерфейс отображает область выборов с
#  динамическими `wx.Button`, если LLM вернул непустой массив
#  `wybory[]` (галлюцинация → откат на свободный текст).
# -----------------------------------------------------------------------------
id: tryb_wyborow
etykieta: "Режим выборов — 3-5 вариантов A-E"
kategoria: tryb
kolejnosc: 40

# --- Параметры OpenAI ---
model: gpt-4o-mini
temperatura: 0.85

# --- Дополнение к prompt_systemowy из baza.yaml ---
prompt_systemowy: |
  РЕЖИМ: ВЫБОРЫ. Поле `wybory` ВСЕГДА содержит 3-5 элементов, помеченных буквами A, B, C, D, E. Каждый выбор — это конкретное действие, которое игрок может совершить — отдельное, не избыточное. Свободный текстовый ввод игрока будет сопоставлен семантически с ближайшим вариантом.

  ФОРМАТ ВЫБОРОВ (СТРОГО): каждый `tekst` массива `wybory[]` ДОЛЖЕН быть сформулирован в **повелительном наклонении второго лица единственного числа (ты)** («беги по лесной тропе», «открой дверь», «спроси старца о девочке», «возьми фонарь со стола»). ЗАПРЕЩЁННЫЕ ФОРМЫ: инфинитив («бежать по тропе»), первое лицо («я бегу по тропе», «беру фонарь»), описание в третьем лице («персонаж бежит»). Если действие требует объекта — включи его в выбор («спроси повитуху о ребёнке», а не просто «спроси»). Структурный параллелизм между A-E ВАЖНЕЕ стилистических вариаций — игрок должен видеть пять параллельных форм.

  РАЗНООБРАЗИЕ: 3-5 вариантов должны быть разными действиями (а не вариантами одного и того же), с отдельными нарративными последствиями. Избегай «ложных выборов» вроде «осмотрись вокруг» рядом с «иди к двери» — осмотр должен быть частью повествования, а не выбором.
