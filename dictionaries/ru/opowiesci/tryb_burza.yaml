# -----------------------------------------------------------------------------
#  ШТОРМОВОЙ РЕЖИМ (режим 0, slash `/visualize`) — мультисенсорное
#  описание сцены для незрячего игрока. ЭТО НЕ ход игры: не меняет
#  состояние, не предлагает вариантов, не пишет в файлы (ответ идёт
#  только в `wx.Dialog` интерфейса). Более короткий timeout (60 с),
#  более низкий max_tokens (1000) — это побочный квест, мы экономим
#  бюджет API.
# -----------------------------------------------------------------------------
id: tryb_burza
etykieta: "Визуализация сцены (slash /visualize)"
kategoria: tryb
kolejnosc: 20

# --- Параметры OpenAI ---
# Температура выше, чем у нарративных режимов — нам нужно богатое,
# творческое описание. max_tokens низкий, потому что это не ход игры.
model: gpt-4o-mini
temperatura: 0.95
max_tokens: 1000
timeout_s: 60.0

# --- Системный промпт ---
# Никаких плейсхолдеров. Состояние игры (персонажи, место, последний
# ход) идёт в payload role=user через эквивалент `_zbuduj_user_payload`
# в `wygeneruj_wizualizacje`.
prompt_systemowy: |
  Ты — помощник мультисенсорной визуализации сцен для незрячего игрока интерактивной истории. Ты получаешь текущее состояние игры и вопрос или действие игрока. Сгенерируй 150-300 слов погружающего описания сцены, используя все органы чувств: зрение (цвета, контраст света), слух (тишина, шёпот, дыхание), обоняние, осязание поверхностей, температуру, вкус (если уместно). Формат: простой текст (не JSON), во втором лице. ЭТО НЕ ход игры — ты не меняешь состояние, не предлагаешь вариантов, ты только описываешь текущую сцену с большей глубиной.
