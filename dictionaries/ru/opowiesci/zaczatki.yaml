# -----------------------------------------------------------------------------
#  ZACZATKI — 5 пресетов Quick Start для новой игры. Когда игрок
#  выбирает «Новая игра», выбранный пресет автоматически заполняет
#  режим и впрыскивает `seed_swiata` в snapshot (LLM получает его как
#  контекст открывающей сцены).
#
#  КАЖДЫЙ пресет написан ВРУЧНУЮ для каждого языка — это литература,
#  а не техническая i18n. Целевой язык имеет свои культурные мотивы;
#  МЫ НЕ калькируем с польского (ср. `feedback_yaml_prompty.md` и
#  `feedback_lokalizacja_nazw.md`).
#
#  Сфера RU: русскоязычные сеттинги (убежища в карстовых пещерах
#  Урала / средневековая Русь под дождём / Санкт-Петербург 2008
#  после финансового кризиса / исследовательская станция с
#  русскоязычным экипажем / кофейня на Васильевском острове). Имена,
#  говоры и культурные отсылки русские по своей природе, а не
#  транслитерации с польского.
#
#  Поле `tryb_domyslny`: 3=Свободный / 4=Выборы / 5=Меньшее Зло.
#  Для незрячего игрока режимы 4 и 5 предпочтительнее (точные
#  кликаемые варианты), но Свободный сохраняется для ужаса/комедии
#  (где импровизация игрока — часть опыта).
#
#  YAML-ключи (`po_apokaliptyczna_sf` и т.д.) остаются на польском —
#  это внутренние идентификаторы, индексируемые позиционно
#  интерфейсом, а не строки, видимые пользователем.
# -----------------------------------------------------------------------------
zaczatki:

  po_apokaliptyczna_sf:
    etykieta: "Постапокалиптическая НФ"
    opis_krotki: "Век после экологического коллапса. Остатки человечества в убежищах, вырубленных под Уральскими горами. Выбор между прагматизмом и человечностью."
    tryb_domyslny: 4
    seed_swiata: |
      Мир, двести лет после Долгого Горения — планетарного катаклизма, выжегшего атмосферу. УФ-лучи убивают каждого, кто ступит на поверхность без скафандра. Человечество живёт в убежищах, вырубленных в известняке карстовых пещер Урала, питается гидропоникой, синтетическим белком и экономикой нулевой воды. Игрок — молодой посыльный из Клана Глубокий-Корень, одной из двенадцати общин, выживающих под землёй. Кланы торгуют между собой, но иногда сражаются за ресурсы — батарейные ячейки, семена, гены, которые радиация ещё не успела разрушить. У Глубокого-Корня есть тайна: его вентиляционная шахта выходит в подземное озеро пресной воды. Никто за пределами Совета Старейшин этого не знает. Игрок только что получил своё первое серьёзное задание — переправить контрабандой микрофлору пробиотиков в Клан Цапля, который умирает от необратимого кишечного дисбиоза. Маршрут проходит через затопленный туннель, где, по слухам, живут мутировавшие крысы. Повторяющиеся персонажи: Анна Петровна Кравченко (40 лет, диспетчер посыльных, прагматичная; говор: короткие фразы, всех новобранок зовёт «голубушкой» вместо имени), старик Тимофей (60 лет, Старейшина клана, хранит память о времени до Горения; говор: архаичный русский, использует слова из теленовостей восьмидесятых). Атмосфера давящая, оранжевый неон натриевых ламп, запах машинного масла и плесени.

  mroczne_fantasy:
    etykieta: "Тёмное фэнтези"
    opis_krotki: "Окраина княжества, набухшего от дождя. Инквизиторша демонов по следу деревенских жителей, которые, возможно, скрывают девочку — или нечто куда худшее."
    tryb_domyslny: 5
    seed_swiata: |
      Княжество Трёх Ручьёв, девятый год религиозной войны между Церковью Пламени и Старыми Богами. Игрок — молодая Инквизиторша из Ордена Сестёр Чертополоха — женщины, нарушившие свои обеты и берущиеся за меч, когда Церкви нужно что-то иное, нежели молитвы. Задание: ты прибыла в село Дубрава, откуда анонимный донос сообщает о признаках Утаивания (обряд Старых Богов, состоящий в том, чтобы сохранить жизнь ребёнку «одержимому» вместо того, чтобы утопить его, как требует Пламя). Донос написан нерешительной рукой — автор неграмотен, дворовый или дворовая. Село молчит. Староста Игнат (50 лет, румяное лицо, избегает твоего взгляда; говор: владимиро-суздальское оканье, говорит «ну да, госпожа» и тянет конечные гласные) приглашает тебя на ужин и говорит о цене ржи. Повитуха Прасковья (35 лет, вдова, длинные чёрные косы; говор: южнорусское аканье, любит метафоры о погоде) встречает тебя с открытой враждебностью. В избе на опушке леса живёт семья, держащаяся странно особняком — бортник Прохор, жена его Авдотья, двое взрослых детей. Молва говорит, что есть и третий, поменьше. Дождь идёт уже три дня, дорога до ближайшего гарнизона — грязь, и ты застрянешь здесь на полмесяца. Печать Инквизиторши хранит магию Пламени — она может сжечь и невинных, если село восстанет против тебя. Ночью из избы на опушке леса ты слышишь странное гудение, словно два материнских голоса говорят одновременно, только один из них не человеческий.

  urban_fantasy_detective:
    etykieta: "Детектив городского фэнтези"
    opis_krotki: "Санкт-Петербург, 2008. Частный сыщик, видящий призраков. Клиентка хочет, чтобы ты нашёл её мужа — он исчез на Большой Морской, но Большая Морская — не только Большая Морская."
    tryb_domyslny: 4
    seed_swiata: |
      Санкт-Петербург, октябрь 2008, дождливый день — банки рухнули две недели назад, рубль обвалился, все на нервах. Игрок — частный сыщик — Иван «Ваня» Сергеев, 38 лет, бывший оперативник уголовного розыска, уволенный за пьянство на службе. Он несёт в себе нечто, чего не хочет называть: видит тени, которых там быть не должно. Лица за плечом прохожих. Силуэты в Александро-Невской лавре, отвечающие на твои вопросы, если приносишь им рюмку настойки. Ваня не верит в «оккультное», но после развода и операции на аппендиксе признаёт, что что-то в нём идёт не так. Сегодня в его конторе на Гороховой (низкая аренда, лестница пахнет холодным дымом) входит женщина — Нора Дмитриевна, 45 лет, овдовела месяц назад, только сейчас признаётся самой себе, что что-то не так. Её муж Тимофей, ресторатор с Большой Морской, «пошёл на Сенной рынок за рыбой» на третий день после Покрова. Вернулся домой нормальным вечером, но с той ночи бормотал сам с собой по-немецки — на языке, которого не знал. Через две недели сбросился с Аничкова моста. Полиция закрыла дело как самоубийство. Нора думает иначе. Атмосфера: Петербург, зажатый между фасадами доходных домов и стеклянными башнями Лахта-Центра, морось, кафе пахнут пирожками и холодным табаком, бездомные спят в подворотнях и, возможно, что-то ещё. Повторяющиеся персонажи: Нора (элегантная седая стрижка, лёгкий вологодский акцент), старший следователь Игорь Палыч Колосов (60 лет, бывший напарник Вани по патрулю, всё ещё подбрасывает ему дела; говор: старый ленинградский — «пышка» вместо «пончик», «поребрик» вместо «бордюр», прячется за шутками, когда разговор становится серьёзным).

  kosmiczny_horror:
    etykieta: "Космический ужас"
    opis_krotki: "Исследовательская станция на орбите нейтронной звезды. Экипаж выходит из гибернации — без капитана. И без единого следа того, что капитан когда-либо существовал."
    tryb_domyslny: 3
    seed_swiata: |
      Год 2247. Исследовательская станция «Кассандра» вращается вокруг нейтронной звезды PSR J1748-2446ad, самой быстровращающейся звезды, известной человечеству (716 оборотов в секунду). Миссия: исследование магнитных пульсаций. Игрок — научный офицер — доктор Инна Соколова, квантовый невролог, 42 года, из новосибирского Академгородка. Экипаж из семи человек, гибернация запрограммирована на четыре года, интервалы пробуждения с шагом в четыре часа. Игрок просыпается третьим по счёту. Бортовой компьютер «Мнемозина» сообщает: гибернация 4 года 23 дня 6 часов, всё штатно. Но счётчик экипажа показывает 6, а не 7. Капитана не хватает — командира Бориса Журавлёва. Мнемозина не помнит никакого капитана. Манифест отправления с Земли: 7 человек. Список гибернации: 6. Твоя собственная память: да, Журавлёв существовал, ты обедала с ним в Академгородке. Двое уже проснувшихся — инженер Олег (28 лет, неразговорчивый, говор: уральский, с твёрдым «ч») и биолог Люсьен (50 лет, из Квебека, продолжает говорить «bonjour» вместо «здравствуй») — утверждают, что не помнят никакого капитана. Ты чувствуешь, что на станции есть кто-то ещё. В возвратной воздушной шахте, по которой воздух должен возвращаться из гидропоники, ты слышишь ритм — не механический, органический, как дыхание. Мнемозина не сигнализирует об аномалиях. Твоё неврологическое сканирование за вчерашний день: на левом виске у тебя шрам хирургического происхождения. Ты не помнишь операции.

  romantyczna_komedia_obyczajowa:
    etykieta: "Романтическая бытовая комедия"
    opis_krotki: "Маленькая кофейня на Васильевском острове. Постоянный посетитель, которого хозяин хочет использовать, чтобы спасти заведение. И она — она знает правду."
    tryb_domyslny: 3
    seed_swiata: |
      Санкт-Петербург, Васильевский остров, апрель 2024. Кофейня «Ветер» — маленькое заведение на 6-й линии, открытое с 1998 года, в доходном доме дореволюционной постройки. Хозяин — Афанасий Никитич Лебедев, 67 лет, театральный сценограф на пенсии, держащий заведение из любви, а не ради прибыли. Другая работница — бариста и официантка одновременно — игрок: Маргарита Коэн, 31 год, выпускница английской филологии, работает здесь четыре года, мечтает открыть собственный книжный магазин. Кофейня — атмосфера сама по себе: старые пишущие машинки на полках, виниловый музыкальный автомат, фортепиано Schimmel, на котором сосед-пенсионер Константин играет по субботам. Клиентура постоянная, тёплая, любимая. Проблема: владелец помещения, Роман Балышев (55 лет, агрессивный, говорит быстро), удвоил арендную плату — Афанасий не может платить. Шесть недель до закрытия. Каждый день в кофейне сидит один и тот же мужчина, Кирилл Севастьянов (38 лет, редактор небольшого издательства, вежливый, болезненно застенчивый) — Маргарита замечает его уже несколько месяцев, но не сказала ему ни слова. Сегодня утром Афанасий признаётся Маргарите, что Кирилл — племянник Балышева, и что он должен «замолвить словечко за кофейню». Афанасий ожидает от Маргариты, чтобы она «была мила» с Кириллом — в манере, которая ей не нравится. А она давно хотела подойти к Кириллу по собственной воле, свободно. Сейчас понедельник, после полудня. Кирилл только что вошёл, заказал флэт уайт, сел за столик у окна. Афанасий многозначительно смотрит на тебя из-за стойки.
