# =============================================================================
#  ОСНОВЫ РУССКОГО ЯЗЫКА
# =============================================================================
#
#  Базовый файл для `dictionaries/ru/`. Движок Poliglota требует, чтобы каждый
#  язык имел этот файл — без него новый язык вообще НЕ обнаруживается.
#
#  Структура построена по образцу `dictionaries/pl/podstawy.yaml`. Имя ключа
#  `polskie_znaki` историческое (поле читается всеми акцентами пакета
#  как пре-пасс); менеджер правил ожидает его наличия, поэтому мы его
#  не переименовываем.
# =============================================================================

id: podstawy
jezyk: ru
# 13.4.3: идентификатор lingua-language-detector, используемый движком Poliglota.
# Значение ДОЛЖНО быть именем enum-а `lingua.Language` (заглавными буквами,
# без префикса) — полный список: https://github.com/pemistahl/lingua-py.
# Отсутствие поля отключает язык в детекторе (включается sticky-fallback),
# папка остаётся видимой.
lingua: RUSSIAN
etykieta: "Русский – фонетические основы"
opis: |
  Базовые правила для русского языка:
    1. Нормализация латинских диакритиков (`polskie_znaki`) — каждая
       не-русская буква с акцентом сводится к ближайшему ASCII-эквиваленту,
       чтобы фонетические акценты (cyrillic→latin) видели чистый исходник.
       Русские буквы НЕ трогаются — они нативные; буквы соседних
       кириллических алфавитов (украинские і ї є ґ, белорусская ў,
       сербские, казахские, татарские…) сводятся к русскому написанию.
    2. Расширенный алфавит для шифра Цезаря: 33 буквы кириллицы + 26 букв
       латиницы (заглавные). Это делает Цезаря предсказуемым для смешанных
       текстов, в которых часто встречаются латинские названия (Apple,
       Müller, iPhone) — каждый знак из обоих скриптов попадает под сдвиг,
       и читатель не теряет половину названия после декодирования.

# -----------------------------------------------------------------------------
# 13.5: нормализация латинских диакритиков перед фонетической обработкой.
# Русская кириллица не может стоять СЛЕВА (в `wzor`) — это нативные буквы пакета
# (буквы ЧУЖИХ кириллических алфавитов — могут, см. блок v19.17 в конце списка),
# и каждый акцент `dictionaries/ru/akcenty/<jezyk>.yaml` сам решает, как
# транслитерировать их в нужную целевую латиницу. Таблица выполняется ДО
# `zamiany` каждого акцента и перед каждым шифром, без выключателя.
#
# -- v19.7: ЦЕЛЬ ЗАМЕНЫ — КИРИЛЛИЦА, А НЕ ПЛОСКАЯ ЛАТИНИЦА --
#    До v19.6 каждый чужой знак сводился к «простейшему ASCII», и это было
#    обеднением, а не упрощением. Пре-пасс идёт ПЕРЕД списком `zamiany`
#    любого акцента, поэтому `š`, сплющенное в голое `s`, отнимало у
#    акцентов правило, которое у них есть всегда (`ш → sh` в английском,
#    `ш → SZ` в польском): знание выбрасывалось до того, как акцент успевал
#    его увидеть. Теперь чужая буква со СТАБИЛЬНЫМ звучанием получает
#    русское написание — то самое, которым её передаёт практическая
#    транскрипция:
#      č ĉ ċ ć → ч     š ş ŝ → ш     ž ĵ → ж     ř → рж
#      ň ñ ņ → нь      đ ĝ ġ → дж    ţ → ц       ç → с
#      ü → ю   ö ø → ё   å → о   þ → т   ð → д   ß → сс
#      польские: ą → он, ę → эн, ł → л, ń → нь, ó → у, ś → сь, ź → зь, ż → ж
#    Измерено: «Dvořák Đoković Müller Göring» выходит английским акцентом
#    как «Dvorzhak Dzhokovich Myuller Gyoring» вместо «Dvorak Dokovic
#    Muller Goring», а «Wałęsa» — как «Walensa» вместо «Walesa».
#
#    Смешение скриптов внутри слова («Шkoda») наружу не выходит: пре-пасс
#    доступен только акцентам и шифрам, а акцент пакета `ru` переводит
#    кириллицу целиком (`oczyszczenie` и `naprawiacz` сюда не доходят —
#    `core_poliglota._przetworz_rezyser` разворачивает их раньше).
#
#    Остальной список остаётся в ASCII, и это ТОЖЕ решение: у знака без
#    устойчивого русского соответствия (`ä` — то немецкое /ɛ/, то финское
#    /æ/; `æ` — то датское /ɛ/, то исландское /ai/) догадка хуже упрощения.
#    Когда один знак тянут два языка, побеждает тот, который читатель
#    встретит ЧАЩЕ: список общий для всего пакета.
#
#    Границу держит шлюз `audyt_podstaw` (класс `znaki-cel-obcy`): цель
#    пишется либо в ASCII, либо буквой из `alfabet` ниже — но никогда
#    буквой третьего языка.
# -----------------------------------------------------------------------------
