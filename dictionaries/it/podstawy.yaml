  - { wzor: "Ï", zamiana: "I"  }
  # -- → gn (il gn italiano È [ɲ]: España → Espagna). Le ń/ň/ņ restano `n`:
  #    finiscono la parola di continuo (Poznań, Plzeň) --
  - { wzor: "ñ", zamiana: "gn" }
  - { wzor: "Ñ", zamiana: "Gn" }
  # -- → o --
  - { wzor: "ò", zamiana: "o"  }
