# =============================================================================
#  FONDAMENTI DELLA LINGUA ITALIANA
# =============================================================================
#
#  File di base per `dictionaries/it/`. Il motore Poliglota richiede che ogni
#  lingua abbia questo file — senza di esso una nuova lingua NON viene affatto
#  rilevata.
#
#  Struttura modellata su `dictionaries/pl/podstawy.yaml`. Il campo
#  `polskie_znaki`, nonostante il nome storico, contiene TUTTI i segni
#  diacritici da normalizzare in ASCII prima dell'applicazione di cifrari
#  o regole di accento. L'italiano usa l'alfabeto latino di 21 lettere
#  native, senza diacritici nativi (à, è, ì, ò, ù sono trattati come
#  varianti tonali di forma di base) — quindi normalizziamo TUTTO.
# =============================================================================

id: podstawy
jezyk: it
# 13.4.3: identificatore lingua-language-detector utilizzato dal motore Poliglota.
# Deve essere il nome di un enum `lingua.Language` (maiuscolo, senza prefisso) —
# elenco completo: https://github.com/pemistahl/lingua-py. La mancanza del campo
# disabilita questa lingua nel rilevatore (si attiva lo sticky-fallback),
# la cartella rimane visibile.
lingua: ITALIAN
etykieta: "Italiano – fondamenti fonetici"
opis: |
  Regole di base per la lingua italiana:
    1. Normalizzazione dei segni diacritici per parole prese in prestito
       (`polskie_znaki`) — affinché il cifrario di Cesare e i motori di
       accento vedano solo l'alfabeto italiano di 21 lettere.
    2. Alfabeto italiano (21 lettere maiuscole native, senza J, K, W, X, Y) –
       utilizzato dal cifrario di Cesare.

# -----------------------------------------------------------------------------
# Normalizzazione dei segni diacritici. Ogni lettera latina non-italiana
# viene mappata al suo equivalente ASCII più vicino. Le vocali accentate
# italiane (à, è, é, ì, ò, ù) vanno alle vocali base senza accento.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# v19.7: L'OBIETTIVO È L'ITALIANO, NON LA LETTERA BASE NUDA. Fino alla v19.6
# ogni lettera straniera cadeva sulla propria lettera base, e quello era un
# impoverimento e non una semplificazione: questo pre-pass gira PRIMA della
# lista `zamiany` di OGNI accento del pacchetto, quindi appiattire una lettera
# buttava via la regola che gli accenti hanno da sempre — sei degli otto file
# di `akcenty/` portano una regola per `gn`, sette per `ci` e `sci`, perché
# sono i digrammi dell'italiano (il francese non ne ha bisogno per `gn`: il suo
# `gn` è già [ɲ]).
#     ñ → gn    đ ĝ ġ ĵ → gi    ł ŭ → u    ç → ss    þ → t    å → o
#     ą → on    ę → en    ţ → ts    ĳ → ei    ŵ → u    ŷ → i
#   Misurato: „Đoković señor mañana" esce come „Giokovic segnor magnana" e non
#   come „Dokovic senor manana"; con l'accento russo „Джокович" invece di
#   „Доковик", e „Тингвеллир" invece di „Тхингвеллир".
#
# QUATTRO DECISIONI CHE SONO IL CONTENUTO DI QUESTA LISTA:
#   1. `ñ → gn` E `đ ĝ ġ ĵ → gi` SONO LA SCRITTURA ITALIANA DI QUEI SUONI (gn
#      È [ɲ], gi davanti ad a/o/u È [dʒ]), e quasi tutti gli accenti del
#      pacchetto le leggono già: l'accento russo rende `gn` come „нь" e `gi`
#      come „дж".
#   2. `š č ž ś ź ż` RESTANO COME ERANO, E QUESTA È LA DECISIONE PIÙ LUNGA DA
#      SPIEGARE. L'italiano scrive [ʃ] e [tʃ] SOLO in modo posizionale — „sci",
#      „sce", „ci", „ce" — e una resa fissa aggiunge una vocale proprio dove
#      queste lettere vivono davvero, cioè in fine di parola: „Đoković →
#      Giokovici" avrebbe quattro sillabe invece di tre, e i cognomi in -ić
#      sono il caso più frequente. Lo stesso per `ž` davanti a i („Žižek →
#      Giigiek", con la vocale raddoppiata). Una sillaba sbagliata cambia la
#      FORMA della parola; una consonante approssimata ne cambia solo il
#      colore. Nota che la stessa regola dà la risposta OPPOSTA per `đ`: quella
#      lettera sta all'inizio di parola e davanti a vocale, mai in fine.
#   3. `ł ŭ → u` PERCHÉ L'ITALIANO SCRIVE DAVVERO [w], con la u in dittongo, e
#      in tutte e due le posizioni: „uomo" [wɔ], „auto" [aw]. La ł polacca è
#      [w] in tutte e due („Michał → Michau", „Łódź → Uodz").
#   4. `ç → ss` E NON `s`: fra due vocali la s singola è [z] in mezza Italia,
#      mentre `ss` è [s] ovunque — è la stessa ragione per cui il pacchetto
#      francese scrive „garsson" dalla v19.6. E `þ → t` invece di `th`: l'acca
#      italiana è muta, quindi „th" era già solo [t], ma l'accento russo lo
#      spezzava in „т" + „х" („Тхингвеллир").
#
# IL RESTO RESTA ASCII E ANCHE QUELLO È UNA DECISIONE. Il criterio ha due
# facce: l'ORIGINE deve significare un suono nelle lingue da cui viene (`ä` è
# [ɛ] tedesca e [æ] finlandese; `ó` è [u] polacca, [ou] islandese e [o] tonica
# spagnola), e l'OBIETTIVO deve essere qualcosa che la voce di QUESTO
# pacchetto legge sempre allo stesso modo.
#
# UNA NOTA SULL'ALFABETO DI 21 LETTERE. J, K, W, X, Y non ci sono, quindi il
# cifrario di Cesare non le sposta: una lettera del genere prodotta qui
# uscirebbe in chiaro dal crittogramma (la falla chiusa nella v19.4.2 per tutto
# il latino esteso). Per questo `ĵ → gi`, `ĳ → ei`, `ŵ → u`, `ŷ → i` — e sono
# anche foneticamente più giuste. `ķ ĸ → k` resta l'unica eccezione, di
# proposito: quelle due lettere sono [k], e ogni scrittura italiana di [k] è
# posizionale (`c` davanti ad a/o/u, `ch` davanti a e/i), quindi una resa
# fissa sbaglierebbe più spesso della k stessa.
#
# Il limite è sorvegliato da `audyt_podstaw` (classe `znaki-cel-obcy`):
# l'obiettivo può essere ASCII o una lettera dell'`alfabet` qui sotto, mai la
# lettera di una terza lingua.
# -----------------------------------------------------------------------------
