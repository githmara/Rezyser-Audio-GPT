  typ:
    akcent:
      etykieta: "Accento fonetico (cross-language, ad es. svedese, finlandese)"
      opis: |-
        File in <jezyk>/akcenty/<id>.yaml con `kategoria: akcent`. Il testo del pacchetto base (jezyk_bazowy) è traslitterato secondo la pronuncia del sintetizzatore di destinazione (iso != jezyk_bazowy). Il manager crea un modello + prompt per l'agente AI, che progetterà l'elenco `zamiany:`.
    akcent_oczyszczenie:
      etykieta: "Accento di pulizia (preprocessor, senza fonetica)"
      opis: |-
        File in <jezyk>/akcenty/<id>.yaml con `kategoria: oczyszczenie`. Pulisce il testo per TTS (rimuove il rumore, normalizza i numeri) SENZA cambiare la fonetica. iso == jezyk_bazowy. Il manager crea un modello (schema pronto) + prompt per tradurre l'etichetta/descrizione in lingua nativa.
    akcent_naprawiacz:
      etykieta: "Correttore di tag (inietta ISO in HTML/DOCX)"
      opis: |-
        File in <jezyk>/akcenty/<id>.yaml con `kategoria: naprawiacz`. NON modifica il contenuto — inietta il codice ISO della lingua nei file di output (<html lang>, <w:lang>). iso vuoto (il codice è fornito dall'utente nell'interfaccia grafica). Il manager crea un modello + prompt per tradurre l'etichetta/descrizione in lingua nativa.
    szyfr_zamiany:
      etykieta: 'Nuovo cifrario tipo "sostituzioni pure"'
      opis: |-
        File in <jezyk>/szyfry/. Il manager crea un modello + prompt per l'AI, che tradurrà etichette/commenti nella lingua nativa del pacchetto e genererà un elenco di coppie modello→sostituzione.
    tryb_rezysera:
      etykieta: "Nuova modalità Regista (modalità creativa)"
      opis: |-
        File in <jezyk>/rezyser/tryb_*.yaml. Modello basato sulla modalità Audiobook + prompt per l'AI che traduce prompt_systemowy, przypomnienie_uzytkownika e slowa_wyzwalajace nella lingua nativa del pacchetto base.
    tryb_opowiesci:
      etykieta: "Nuova modalità Storia (RICHIEDE UNO SVILUPPATORE)"
      opis: |-
        Modalità di gioco interattiva (Storia). A differenza delle modalità Regista, NON è guidata dai dati: il solo file YAML è codice morto — il motore riconosce le modalità tramite costanti numeriche e mappe in Python. Il Manager NON crea il file; fornisce solo un prompt per l'AI/sviluppatore con un elenco completo di punti di ancoraggio nel codice (costante int, due mappe, RadioBox, modello per modalità).
    postprodukcja:
      etykieta: "Nuova post-produzione (iterazione per capitoli)"
      opis: |-
        File in <jezyk>/rezyser/postprod_*.yaml. Modello con campi per prompt, regex e parametri di iterazione + prompt per l'AI che genera prompt_systemowy nativo e regex_podzial_rozdzialow.
    jezyk_bazowy:
      etykieta: "Nuova lingua base (ad es. en, de, fr)"
      opis: |-
        Crea la cartella <jezyk>/ con podstawy.yaml e sottocartelle akcenty/, szyfry/, rezyser/, gui/. I dati fonetici sono generati dall'AI con il prompt; traduzione UI – buduj_wielojezyczne_ui.py; le modalità Regista sono copiate da pl/rezyser/ (è richiesto ≥1 file tryb_*.yaml affinché il motore consideri la lingua completa).
    szyfr_algorytm:
      etykieta: "Nuovo cifrario algoritmico (RICHIEDE PROGRAMMATORE)"
      opis: |-
        Gli algoritmi (ad es. inversione, typoglikemia) richiedono funzioni in core_poliglota.py. Il manager fornisce solo un prompt per l'AI con la descrizione del compito.

