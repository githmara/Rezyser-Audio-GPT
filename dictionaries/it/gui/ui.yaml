  # ---- Faza 5: Quick Start preset picker ----------------------------------
  lbl_quick_start: "Avvio rapido:"
  quick_start_wlasna: "(gioco personalizzato)"
  choice_quick_start_name: "Selezione di uno scenario Quick Start"
  choice_quick_start_tooltip: 'Scegli un mondo predefinito per immergerti subito nella narrazione. Il preset inietterà nel motore una breve descrizione del mondo e del personaggio, impostando la modalità di gioco predefinita. "(gioco personalizzato)" lascia l''inizio libero — il motore inventerà il mondo basandosi sulla prima azione.'
  lbl_ostatnia_tura: "Ultimo turno"
  txt_ostatnia_tura_name: "Campo con il contenuto dell'ultimo turno"
  txt_ostatnia_tura_tooltip: "Scorciatoia contenente esclusivamente l'ultima scena generata — NVDA legge qui la narrazione fresca senza navigare attraverso centinaia di righe della storia completa. Dopo ogni turno successivo, il campo viene sostituito con il nuovo contenuto."
  txt_ostatnia_tura_init: "(L'ultimo turno apparirà in questo campo dopo la tua prima azione.)"
  txt_ostatnia_tura_skrot_naglowek: "[riassunto dell'ultimo turno salvato — narrazione completa nel campo sottostante]\n\n"
  btn_zasady_swiata_label: '&Modifica le regole del mondo…'
  btn_zasady_swiata_tooltip: Apre la finestra di modifica delle regole del mondo — testo opzionale con regole fonetiche, culturali o meccaniche che il motore narrativo deve rispettare durante tutto il gioco. Campo vuoto = nessuna regola aggiuntiva (comportamento predefinito).
  dlg_zasady_swiata_tytul: Regole del mondo di gioco
  dlg_zasady_swiata_lbl: 'Regole che il motore narrativo deve rispettare durante tutto il gioco (opzionali):'
  dlg_zasady_swiata_name: Campo di modifica delle regole del mondo
  dlg_zasady_swiata_hint: "Ad esempio:\n- \"Pronuncia sempre il nome Joanna in modo duro, polacco [dż]; mai morbido [j].\"\n- \"In questo mondo la magia funziona solo di notte; di giorno i personaggi sono persone comuni.\"\n- \"L'antagonista Joana cerca di ammorbidire la pronuncia del nome della protagonista attraverso la declinazione grammaticale.\""
  dlg_zasady_swiata_btn_ok: '&Salva'
  dlg_zasady_swiata_btn_anuluj: '&Annulla'
  status_zasady_zapisane: Regole del mondo aggiornate e salvate nel file di gioco.
  zasady_bez_gry_tytul: Nessun gioco attivo
  zasady_bez_gry_tresc: Crea un nuovo gioco con il pulsante "Nuovo gioco" oppure carica uno salvato in precedenza prima di definire le regole del mondo — le regole vengono salvate insieme allo stato del gioco.
  btn_edytuj_tryb_label: '&Modifica modalità di gioco…'
  btn_edytuj_tryb_tooltip: Apre la finestra di cambio modalità di gioco d'emergenza. Usare solo quando l'AI non vuole concludere la storia nelle modalità con scelte — passare alla modalità libera ti permetterà di scrivere autonomamente la scena finale. In una partita normale, la modalità non dovrebbe essere cambiata durante il gioco.
  dlg_edytuj_tryb_tytul: Cambio modalità di gioco durante la partita
  dlg_edytuj_tryb_ostrzezenie: "ATTENZIONE: cambiare modalità durante una partita attiva può desincronizzare il motore narrativo.\n\nLa modalità di gioco determina il modo in cui vengono generate le mosse successive — il modello AI riceve istruzioni diverse in modalità libera (il giocatore scrive le proprie azioni) rispetto alle modalità con scelte (l'AI propone 3-5 opzioni tra cui scegliere, in \"Il male minore\" tutte sfavorevoli).\n\nMotivo tipico per usare questa scappatoia: l'AI continua ostinatamente a generare nuovi dilemmi invece di concludere la storia — passare alla modalità libera ti permette di descrivere autonomamente la scena finale.\n\nDopo il cambio, il turno successivo utilizzerà le nuove regole. Lo stato del gioco (personaggi, mondo, narrazione fino a quel momento) rimane intatto."
  dlg_edytuj_tryb_ostrzezenie_name: Campo di avviso sul rischio di cambio modalità
  dlg_edytuj_tryb_lbl: 'Scegli una nuova modalità di gioco:'
  dlg_edytuj_tryb_name: Scelta della nuova modalità di gioco
  dlg_edytuj_tryb_btn_ok: Cambia &modalità
  dlg_edytuj_tryb_btn_anuluj: '&Annulla'
  status_tryb_zmieniony: Modalità di gioco cambiata in "{tryb_nazwa}". Il turno successivo utilizzerà le nuove regole di narrazione.
  dlg_wybierz_gre_tytul: Carica gioco Racconti
  dlg_wybierz_gre_lbl: 'Giochi disponibili:'
  brak_gier_tytul: Nessun gioco
  brak_gier_tresc: 'Nella cartella runtime/opowiesci/ non ci sono ancora giochi salvati. Inizia un nuovo gioco: inserisci il nome nel campo sopra, scegli la modalità e usa il pulsante Nuovo gioco.'
  btn_otworz_narracje_label: '&Apri file di narrazione…'
  btn_otworz_narracje_tooltip: "Apre il file di narrazione del gioco (opowiesci/<nome>.txt) nell'editor di testo di sistema. Usalo in caso di emergenza, quando l'AI non chiude la storia in modalità Scelte/Minor Male e vuoi scrivere manualmente il finale. ATTENZIONE: il .txt contiene solo testo per TTS; lo stato del gioco (personaggi, posizione, equipaggiamento) vive in .game.json e NON verrà aggiornato — il turno successivo di LLM potrebbe non corrispondere alla narrazione modificata. Prima dell'apertura apparirà una finestra di conferma."
  otworz_narracje_ostrzezenie_tytul: Modifica del file di narrazione — rischio di discrepanza dello stato
  otworz_narracje_ostrzezenie_tresc: "Stai per aprire il file di narrazione (.txt) nell'editor di testo di sistema.\n\nATTENZIONE: il file .txt contiene solo il testo della narrazione per TTS, mentre lo stato del gioco (personaggi, posizione, equipaggiamento, trame aperte) vive in un file separato .game.json. La modifica del .txt non aggiorna lo stato — il turno successivo di LLM riceverà il mondo prima della tua modifica, quindi potrebbe verificarsi una discrepanza semantica (ad esempio, hai descritto che un personaggio è morto, ma nello stato del gioco è ancora vivo).\n\nCaso tipico sicuro: aggiungere una scena finale quando l'AI non vuole concludere la storia (alternativa alla porta \"Modifica modalità gioco…\" → Libero).\n\nContinuare?"
  blad_otwarcia_tytul: Impossibile aprire il file
  blad_otwarcia_tresc: "Tentativo di apertura del file {sciezka_pliku} non riuscito:\n{tresc_bledu}\n\nApri il file manualmente dall'Esplora file."
  plik_narracji_brak_tytul: File di narrazione mancante
  plik_narracji_brak_tresc: Il file di narrazione del gioco "{nazwa}" non esiste sul disco. Il file di narrazione viene creato dopo il primo turno — invia la prima azione affinché il motore narrativo crei il file.
  btn_odswiez_z_dysku_label: "A&ggiorna dal disco"
  btn_odswiez_z_dysku_tooltip: "Ricarica il file di narrazione (opowiesci/<nome>.txt) e sincronizza la memoria interna con le tue modifiche manuali — senza reset completo né ricaricamento del gioco. La parte finale aggiornata entra nel contesto del motore; il riassunto esistente dei turni precedenti rimane intatto. ATTENZIONE: lo stato del gioco (personaggi, posizione, equipaggiamento) nel .game.json NON viene aggiornato — il turno successivo potrebbe non corrispondere se sono cambiati i fatti del mondo."
  odswiez_z_dysku_tytul: "Narrazione aggiornata dal disco"
  odswiez_calosc_tresc: "Narrazione ricaricata dal disco, contesto del motore sincronizzato con la parte finale del testo.\n\nATTENZIONE: lo stato del gioco (personaggi, posizione, equipaggiamento, trame) nel .game.json NON è stato modificato — se la modifica ha cambiato i fatti del mondo, il turno successivo potrebbe non corrispondere."
  odswiez_streszczenie_tresc: "Contesto del motore aggiornato con la parte finale fresca dal disco. Il riassunto dei turni precedenti è intatto, quindi il riassunto successivo e il turno non si baseranno su dati non aggiornati.\n\nATTENZIONE: lo stato del gioco nel .game.json NON è stato modificato — se cambiano i fatti del mondo, il turno successivo potrebbe non corrispondere."
  odswiez_zajete_tytul: "Operazione in corso"
  odswiez_zajete_tresc: "È in corso la generazione di un turno o di un riassunto. Attendi il completamento prima di aggiornare la narrazione dal disco."
  btn_edytuj_stan_label: Modifica stato &gioco…
  btn_edytuj_stan_tooltip: 'Apre il file di stato del gioco grezzo (.game.json) per la modifica diretta in una finestra con convalida JSON. Per esperti: consente di correggere manualmente personaggi, posizione, equipaggiamento, trame e contatori quando la modifica manuale della narrazione non è allineata con lo stato strutturale. ATTENZIONE: una modifica errata può danneggiare il salvataggio — le modifiche sono convalidate come JSON prima del salvataggio, ma la correttezza del contenuto (sensatezza dei campi) è sotto la tua responsabilità.'
  dlg_edytuj_stan_tytul: Modifica stato del gioco (.game.json)
  dlg_edytuj_stan_lbl: 'Stato del gioco grezzo in formato JSON. Modifica con cautela: dopo il salvataggio, il gioco verrà ricaricato da questo file. Il contenuto deve rimanere un oggetto JSON valido — altrimenti il salvataggio verrà rifiutato.'
  dlg_edytuj_stan_name: Campo di modifica dello stato del gioco grezzo in formato JSON
  dlg_edytuj_stan_btn_ok: '&Salva e ricarica'
  dlg_edytuj_stan_btn_anuluj: '&Annulla'
  edytuj_stan_blad_json_tytul: JSON non valido
  edytuj_stan_blad_json_tresc: "Il contenuto non è un JSON valido, quindi non è stato salvato (il gioco sarebbe stato danneggiato). Correggi la sintassi e riprova.\n\nDettagli dell'errore:\n{tresc_bledu}"
  edytuj_stan_blad_typ_tresc: L'elemento principale dello stato del gioco deve essere un oggetto JSON (una coppia chiave-valore tra parentesi graffe), non un elenco o un valore semplice. Ripristina la struttura dell'oggetto e riprova.
  edytuj_stan_zapisano_tytul: Stato del gioco salvato
  edytuj_stan_zapisano_tresc: Lo stato del gioco "{nazwa}" è stato salvato e ricaricato dal disco. Personaggi, posizione, equipaggiamento, trame e contatori ora riflettono la tua modifica.
  err_dlugosc: La risposta del modello è stata troncata prima che potesse completarla (superato il limite di lunghezza). Accorcia il contesto e riprova.
