# -----------------------------------------------------------------------------
#  ACCENTO FRANCESE (italiano → TTS francese)
#  Per i sintetizzatori: Thomas / Julie / Marie (TTS francese).
# -----------------------------------------------------------------------------
id: francuski
etykieta: "Francese (es. Thomas / Julie / Marie)"
opis: |
  Adatta il testo italiano al sintetizzatore vocale francese
  (Thomas / Julie / Marie).

  Compatibilità naturale italiano-francese:
    - v   = /v/ in entrambi ✓
    - h   — muta in entrambe le lingue! ✓
    - gn  = /ɲ/ in entrambe le lingue! (come "montagne") ✓ → si conserva
    - g + e/i = /dʒ/ it vs /ʒ/ fr → molto simile, si conserva ✓

  Correzioni critiche italiano → francese:
    - ch + e/i = /k/ it, francese legge /ʃ/ ("chiesa"→/ʃjeza/) →
      che→ke, chi→ki. (Copre anche sch=/sk/: "maschera"→"maskera".)
    - cch geminata → kk ("vecchio"→"vekkio", "gnocchi"→"gnokki" —
      il francese legge gn=/ɲ/ da solo ✓).
    - c + e/i = /tʃ/ it, francese legge /s/ ("cena"→/sena/) → ce→tche,
      ci→tchi (fr. "tch" = unica grafia standard di /tʃ/; "ciao"→"tchiao").
    - cc + e/i geminata → cce→tche, cci→tchi ("faccia"→"fatchia").
    - gh + e/i = /g/ it, francese ge=/ʒ/ → ghe→gue, ghi→gui
      (fr. "guerre"/"guitare" = /g/; "spaghetti"→"spaguetti").
    - gli = /ʎ/ it, francese legge /gli/ → gli→li ("figlio"→"filio",
      il francese legge "lio" = /ljo/).
    - sc + e/i = /ʃ/ it → sce→che, sci→chi (fr. ch=/ʃ/ — corrispondenza
      esatta; "scena"→"chena", "uscita"→"uchita").

  Accenti naturali del francese sull'italiano (lasciati intenzionalmente):
    - z = /ts/ in italiano, francese legge come /z/ → accento francese
    - u = /u/ it letta /y/ francese, nasalizzazioni an/en/on → accento francese
    - qu = /kw/ it letta /k/ francese → accento francese
iso: fr
kategoria: akcent
kolejnosc: 60

# --- Pipeline ---
czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

# --- Sostituzioni fonetiche ---
# ORDINE CRITICO (str.replace sequenziale — vedi regole di architettura):
# 1. cch PRIMA di che/chi (la geminata verrebbe spezzata);
# 2. che/chi→ke/ki consuma il ch ITALIANO (/k/);
# 3. SOLO DOPO sce/sci→che/chi introduce il ch FRANCESE (/ʃ/) — l'ordine
#    inverso trasformerebbe "scena" in "skena";
# 4. cce/cci PRIMA di ce/ci ("ce" è contenuto in "cce").
zamiany:
  # --- 1. cch geminata → kk ("vecchio"→"vekkio") ---
  - { wzor: "cch", zamiana: "kk" }
  - { wzor: "CCH", zamiana: "KK" }
  # --- 2. ch + e/i → k (CRITICO: francese ch=/ʃ/, italiano ch=/k/) ---
  - { wzor: "Che", zamiana: "Ke"  }
  - { wzor: "che", zamiana: "ke"  }
  - { wzor: "CHE", zamiana: "KE"  }
  - { wzor: "Chi", zamiana: "Ki"  }
  - { wzor: "chi", zamiana: "ki"  }
  - { wzor: "CHI", zamiana: "KI"  }
  # --- 3. sc + e/i → ch (fr. ch=/ʃ/ — corrispondenza esatta; DOPO il passo 2) ---
  - { wzor: "sce", zamiana: "che" }
  - { wzor: "Sce", zamiana: "Che" }
  - { wzor: "SCE", zamiana: "CHE" }
  - { wzor: "sci", zamiana: "chi" }
  - { wzor: "Sci", zamiana: "Chi" }
  - { wzor: "SCI", zamiana: "CHI" }
  # --- 4. cc + e/i geminata → tch ("faccia"→"fatchia") ---
  - { wzor: "cce", zamiana: "tche" }
  - { wzor: "CCE", zamiana: "TCHE" }
  - { wzor: "cci", zamiana: "tchi" }
  - { wzor: "CCI", zamiana: "TCHI" }
  # --- 5. c + e/i → tch (fr. tch=/tʃ/; "cena"→"tchena") ---
  - { wzor: "ce", zamiana: "tche" }
  - { wzor: "Ce", zamiana: "Tche" }
  - { wzor: "CE", zamiana: "TCHE" }
  - { wzor: "ci", zamiana: "tchi" }
  - { wzor: "Ci", zamiana: "Tchi" }
  - { wzor: "CI", zamiana: "TCHI" }
  # --- 6. gh + e/i → gu (fr. "guerre"/"guitare" = /g/) ---
  - { wzor: "Ghe", zamiana: "Gue" }
  - { wzor: "ghe", zamiana: "gue" }
  - { wzor: "GHE", zamiana: "GUE" }
  - { wzor: "Ghi", zamiana: "Gui" }
  - { wzor: "ghi", zamiana: "gui" }
  - { wzor: "GHI", zamiana: "GUI" }
  # --- 7. gli → li (il francese legge "li"+vocale = /lj/) ---
  - { wzor: "gli", zamiana: "li" }
  - { wzor: "Gli", zamiana: "Li" }
  - { wzor: "GLI", zamiana: "LI" }
