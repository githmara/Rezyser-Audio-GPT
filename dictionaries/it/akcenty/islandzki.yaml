# -----------------------------------------------------------------------------
#  ACCENTO ISLANDESE (italiano → TTS islandese)
#  Per i sintetizzatori: Dóra / Gunnar / Ísrún (TTS islandese).
# -----------------------------------------------------------------------------
id: islandzki
etykieta: "Islandese (es. Dóra / Gunnar / Ísrún)"
opis: |
  Adatta il testo italiano al sintetizzatore vocale islandese
  (Dóra / Gunnar / Ísrún).

  Compatibilità naturale italiano-islandese:
    - v   = /v/ in entrambi ✓
    - j   = /j/ in entrambi ✓ (raro in italiano, ma compatibile)
    - r   — r vibrante islandese ≈ r vibrante italiana ✓
    - geminati (ll, nn, tt) — presenti in entrambe le lingue ✓

  Correzioni critiche italiano → islandese:
    - ch + e/i = /k/ it, TTS islandese imprevedibile (/x/?) → che→ke, chi→ki.
    - cch geminata → kk ("vecchio"→"vekkio", "gnocchi"→"njokki").
    - c + e/i = /tʃ/ it, islandese legge /k/ o /s/ → ce→tse, ci→tsi
      (isl. ts, convenzione delle sorelle nordiche; "cena"→"tsena").
    - cc + e/i geminata → cce→tse, cci→tsi ("faccia"→"fatsia").
    - gh + e/i = /g/ it → ghe→ge, ghi→gi (l'islandese legge /g~gj/,
      approssimazione accettabile).
    - gn = /ɲ/ it → gn→nj (isl. nj; "signora"→"sinjora").
    - gli = /ʎ/ it → gli→li ("figlio"→"filio").
    - sc + e/i = /ʃ/ it → sce→se, sci→si (l'islandese non ha /ʃ/ —
      la /s/ è il sostituto naturale; "scena"→"sena").

  Accenti naturali dell'islandese sull'italiano (lasciati intenzionalmente):
    - g + e/i = /dʒ/ in italiano, islandese legge come /g~gj/ → accento islandese
    - z = /ts/ in italiano, islandese legge come /s/ → accento islandese
    - h muta italiana → TTS islandese legge come /h/ → accento islandese
    - b/d/g pre-aspirate e desonorizzate dall'islandese → accento islandese
iso: is
kategoria: akcent
kolejnosc: 55

# --- Pipeline ---
czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

# --- Sostituzioni fonetiche ---
# ORDINE CRITICO (str.replace sequenziale — vedi regole di architettura):
# 1. sce/sci PRIMA di ce/ci ("ce" è contenuto in "sce");
# 2. cch PRIMA di che/chi; 3. che/chi→ke/ki PRIMA di ce/ci→tse/tsi
# (nessuna regola successiva consuma ke/ki/ts).
zamiany:
  # --- 1. sc + e/i → s (l'islandese non ha /ʃ/) ---
  - { wzor: "sce", zamiana: "se" }
  - { wzor: "Sce", zamiana: "Se" }
  - { wzor: "SCE", zamiana: "SE" }
  - { wzor: "sci", zamiana: "si" }
  - { wzor: "Sci", zamiana: "Si" }
  - { wzor: "SCI", zamiana: "SI" }
  # --- 2. cch geminata → kk ("vecchio"→"vekkio") ---
  - { wzor: "cch", zamiana: "kk" }
  - { wzor: "CCH", zamiana: "KK" }
  # --- 3. ch + e/i → k (CRITICO: italiano ch=/k/, islandese incerto) ---
  - { wzor: "Che", zamiana: "Ke"  }
  - { wzor: "che", zamiana: "ke"  }
  - { wzor: "CHE", zamiana: "KE"  }
  - { wzor: "Chi", zamiana: "Ki"  }
  - { wzor: "chi", zamiana: "ki"  }
  - { wzor: "CHI", zamiana: "KI"  }
  # --- 4. cc + e/i geminata → ts ("faccia"→"fatsia") ---
  - { wzor: "cce", zamiana: "tse" }
  - { wzor: "CCE", zamiana: "TSE" }
  - { wzor: "cci", zamiana: "tsi" }
  - { wzor: "CCI", zamiana: "TSI" }
  # --- 5. c + e/i → ts (isl. ts ≈ /tʃ/ italiana) ---
  - { wzor: "ce", zamiana: "tse" }
  - { wzor: "Ce", zamiana: "Tse" }
  - { wzor: "CE", zamiana: "TSE" }
  - { wzor: "ci", zamiana: "tsi" }
  - { wzor: "Ci", zamiana: "Tsi" }
  - { wzor: "CI", zamiana: "TSI" }
  # --- 6. gh + e/i → g (l'islandese legge /g~gj/) ---
  - { wzor: "Ghe", zamiana: "Ge"  }
  - { wzor: "ghe", zamiana: "ge"  }
  - { wzor: "GHE", zamiana: "GE"  }
  - { wzor: "Ghi", zamiana: "Gi"  }
  - { wzor: "ghi", zamiana: "gi"  }
  - { wzor: "GHI", zamiana: "GI"  }
  # --- 7. gn → nj (isl. nj ≈ /ɲ/) ---
  - { wzor: "gn", zamiana: "nj" }
  - { wzor: "Gn", zamiana: "Nj" }
  - { wzor: "GN", zamiana: "NJ" }
  # --- 8. gli → li (approssimazione di /ʎ/) ---
  - { wzor: "gli", zamiana: "li" }
  - { wzor: "Gli", zamiana: "Li" }
  - { wzor: "GLI", zamiana: "LI" }
