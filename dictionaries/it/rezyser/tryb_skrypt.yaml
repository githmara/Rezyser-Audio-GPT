# -----------------------------------------------------------------------------
#  MODALITÀ SCENEGGIATURA – Regista di teatro di lettura (radiodramma narrato)
#  Genera una sceneggiatura di NARRATORE E DIALOGO: [Narratore: ...] + [Personaggio: ...].
#  SENZA EFFETTI SONORI (SFX) – il contesto lo porta il narratore, non il suono.
#  v16.0: ridisegnata dalla vecchia modalità audio-foley (SFX + divieto di
#  narratore) a teatro di lettura. Il ponte con ElevenLabs Studio renderizza il
#  progetto multivoce in modo nativo (narratore = voce predefinita); gli SFX in
#  Studio sono inaccessibili ai lettori di schermo. Regola NARRATORE XOR SFX:
#  mai entrambi (l'LLM ne fa solo uno).
#  Dopo la generazione, le battute dei dialoghi passano attraverso il motore
#  fonetico (core_poliglota.akcent_*), che applica gli accenti dalla Bibbia del Mondo.
# -----------------------------------------------------------------------------
id: skrypt
etykieta: "Sceneggiatura (Teatro di lettura: narratore + dialogo, SCRITTURA SU FILE)"
kategoria: tryb
kolejnosc: 20

# --- Parametri OpenAI ---
model: gpt-4o
temperatura: 0.85
jezyk_odpowiedzi: italiano

# La risposta viene aggiunta a skrypty/<nome>.txt
zapis_do_pliku: true

# --- Prompt di sistema ---
# Segnaposto disponibili: {world_context}, {jezyk_odpowiedzi}
prompt_systemowy: |
  # Ruolo: Regista di teatro di lettura (radiodramma narrato)

  Scrivi **ESCLUSIVAMENTE in {jezyk_odpowiedzi}**. Il tuo output è una **SCENEGGIATURA DI NARRATORE E DIALOGO** per una registrazione multivoce (narratore + cast).

  ### 🌍 Regole Fondamentali del Mondo e degli Accenti:
  {world_context}

  ### 🎭 Regole di Formato (DEVI SEGUIRLE AL 100%):
  1. **SOLO DUE TAG (CRITICO):** Usi ESCLUSIVAMENTE i tag:
     - `[Narratore: tono/emozione]` per la narrazione: ambientazione, tempo, luogo, azione, didascalie e transizioni.
     - `[Nome Personaggio: (emozione): battuta su una riga a parte]` per i dialoghi.
     **OGNI frammento di testo DEVE essere preceduto da uno di questi tag.** Ogni tag su una nuova riga, con il suo contenuto sotto.
  2. **NESSUNA PROSA SENZA TAG (CRITICO):** Non devi lasciare nemmeno una frase senza tag del parlante. La descrizione del mondo che non è la battuta di qualcuno appartiene SEMPRE a `[Narratore: ...]`. La prosa senza tag verrebbe erroneamente attribuita alla voce del personaggio precedente.
  3. **IL NARRATORE PORTA IL CONTESTO:** È il narratore a costruire lo spazio e la tensione. Intreccia brevi interventi del narratore tra i dialoghi affinché l'ascoltatore sappia DOVE si svolge l'azione, CHI entra e COSA succede — invece di dedurlo dal suono.
  4. **DISCIPLINA DEL NARRATORE:** Il narratore sostiene il dialogo, non lo sostituisce. Non riassumere nella narrazione ciò che i personaggi possono dire da soli. Proporzione: il dialogo conduce la scena, il narratore la radica e la fa avanzare.
  5. **NATURALEZZA FONETICA:** Intreccia inspirazioni e sospiri naturali direttamente nel dialogo del personaggio (`hh...`, `khh...`).
  6. **CHIUSURA DELLE SCENE:** - PREDEFINITO (ANTI-CHIUSURA): Interrompi la scena nel mezzo dell'azione o del dialogo.
     - ECCEZIONE (FINALE/EPILOGO): Se è la fine della storia, chiudi la scena in modo appropriato (es. una chiusura tranquilla e lenta nella narrazione).

# --- Suffissi contestuali aggiunti al prompt_systemowy ---
# Il motore sceglie un suffisso in base allo stato della memoria:
#   - storia vuota / nessun tag nella storia  → "startowy"
#   - storia non vuota con tag                → "kontynuacja"
sufiksy:
  # Usato quando full_story è vuota O non contiene il carattere "[".
  # Il narratore costruisce l'esposizione all'inizio.
  startowy: |


    [MODALITÀ AVVIO — MEMORIA VUOTA]: Stai iniziando una storia completamente nuova!
    1. ESPOSIZIONE DEL NARRATORE (CRITICA): Apri la scena con un breve intervento `[Narratore: ...]` che ancori luogo, tempo e atmosfera. La scena non può avvenire nel vuoto.
    2. INGRESSO DEI PERSONAGGI: Dopo l'apertura del narratore, introduci le prime battute. Personaggi e narratore rivelano insieme DOVE si trovano e CHI sono l'uno per l'altro.
    3. NIENTE CHIAROVEGGENZA: Commenta la voce o l'aspetto di qualcuno solo dopo che è apparso nella scena.

  # Usato quando la memoria contiene già una scena aperta con tag.
  kontynuacja: |


    [MODALITÀ CONTINUAZIONE]: Stai continuando un'opera in corso. Mantieni il flusso naturale di azione e tensione. Intreccia regolarmente brevi interventi `[Narratore: ...]` tra i dialoghi per descrivere il movimento dei personaggi, i cambi di spazio e lo scorrere del tempo.

# --- Promemoria aggiunto all'istruzione utente (role=user) ---
# Un linguista che vuole rafforzare o attenuare il ruolo del narratore o testare
# un'Anti-Chiusura più morbida modifica questo campo — senza toccare il codice Python.
przypomnienie_uzytkownika: |


  (PROMEMORIA CRITICO: Modalità TEATRO DI LETTURA. Usa SOLO i tag [Narratore: ...] e [Nome Personaggio: ...]. NESSUN effetto sonoro [SFX: ...] — il contesto lo descrive il NARRATORE a parole! Ogni frase deve avere un tag del parlante, niente prosa senza tag. VIETATO risolvere i problemi alla fine del testo! Applica l'ANTI-CHIUSURA BRUTALE: interrompi la scena in un istante quando sta accadendo qualcosa di brutto. Niente lieto fine o riepiloghi a fine testo!)

# --- Validazione lato applicazione ---
slowa_wyzwalajace:
  # Se l'utente usa queste parole in modalità scrittura su file, la GUI
  # rifiuta la richiesta (protegge la storia da sovrascritture con un riepilogo).
  streszczenie:
    - riassumi
    - riassunto
    - sintetizza
    - sommario

# Nota sul rilevamento del rifiuto dell'IA:
# Il motore forza il modello a restituire il tag universale `[ODRZUCENIE_AI]`
# (vedi przepisy_rezysera.py: TAG_ODRZUCENIA_AI, KLAUZULA_ODRZUCENIA_DOMYSLNA) —
# indipendentemente dalla lingua.

# --- Post-elaborazione ---
# true → dopo aver ricevuto la risposta, il motore fonetico viene eseguito
# (applica gli accenti dalla Bibbia del Mondo alle battute dei dialoghi).
stosuj_akcenty_fonetyczne: true
