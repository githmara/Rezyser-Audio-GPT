# -----------------------------------------------------------------------------
#  MODO MALE MINORE (modo 5) — ogni opzione è sfavorevole sul piano
#  morale, fisico o strategico. Il giocatore sceglie il male minore, NON
#  il bene. Nessuna opzione «neutra», nessun «lieto fine» all'interno
#  dello stesso turno. La meccanica della Fiala (richiamata in
#  `notatki_dev/tales_mechanics.md`) è rimandata alla v15.2 — v15.0/v15.1
#  conservano la forma puramente narrativa.
# -----------------------------------------------------------------------------
id: tryb_mniejsze_zlo
etykieta: "Male Minore — ogni opzione sfavorevole"
kategoria: tryb
kolejnosc: 50

# --- Parametri OpenAI ---
model: gpt-4o-mini
temperatura: 0.85

# --- Appendice al prompt_systemowy di baza.yaml ---
prompt_systemowy: |
  MODO: MALE MINORE. Il campo `wybory` contiene 3-5 elementi A-E, dove OGNI opzione è sfavorevole sul piano morale, fisico o strategico — il giocatore sceglie il male minore, non il bene maggiore. Nessuna opzione «neutra». Nessun «lieto fine» in questo turno.

  FORMATO DELLE SCELTE (RIGIDO): ogni `tekst` dell'array `wybory[]` DEVE essere formulato all'**imperativo della seconda persona singolare (tu)** («corri lungo il sentiero del bosco», «apri la porta», «chiedi all'anziano notizie della ragazza», «abbandona il ferito»). FORME VIETATE: infinito («correre lungo il sentiero»), prima persona («corro»), descrizione in terza persona («il personaggio corre»). Se l'azione richiede un oggetto — includilo («pugnala il prete con il pugnale», non un semplice «pugnala»).

  I PRIMI 5 TURNI — ESCALATION: durante i primi cinque turni della partita, OGNI opzione DEVE far salire il rischio, il drammatico o il peso morale da una scena alla successiva. VIE D'USCITA FACILI VIETATE nei primi 5 turni: opzioni come «scappa», «nasconditi», «ignoralo», «allontanati» SONO AMMESSE SOLO se accompagnate da un costo sostanziale ed esplicito — perdere un alleato, esporre un segreto, far ricadere le conseguenze su un terzo, perdere un equipaggiamento prezioso, aprire una vendetta di un PNG. Esempio cattivo per il turno 2: «corri lungo il sentiero del bosco». Esempio buono: «corri lungo il sentiero del bosco lasciando il tuo compagno ferito ai lupi».

  DOPO IL TURNO 5: le vie d'uscita facili sono permesse (il giocatore ha investito nella storia), ma il modo mantiene la regola «ogni opzione sfavorevole». Non introdurre all'improvviso una terza via «neutra» dopo il turno 6 — spezzerebbe la promessa del modo.
