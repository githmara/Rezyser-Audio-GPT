temperatura: 0.85

# --- Appendice al prompt_systemowy di baza.yaml ---
prompt_systemowy: |
  MODO: LIBERO. Il campo `wybory` può essere vuoto o contenere 1-3 suggerimenti (il giocatore scrive la propria azione, quindi le opzioni sono solo spunti — non una via obbligata).
