# -----------------------------------------------------------------------------
#  CIFRARIO: CESARE
#  Classico cifrario a scorrimento che sposta ogni lettera di N posizioni
#  nell'alfabeto italiano esteso (26 lettere: le 21 italiane più J, K, W, X, Y).
# -----------------------------------------------------------------------------
id: cezar
etykieta: "Cifrario di Cesare (scorrimento alfabeto IT)"
opis: |
  Classico cifrario di Cesare: ogni lettera viene spostata di N posizioni
  nell'alfabeto italiano esteso (ABCDEFGHIJKLMNOPQRSTUVWXYZ, 26 caratteri:
  le 21 lettere italiane più J, K, W, X, Y al loro posto latino, senza spazi
  bianchi). I caratteri al di fuori dell'alfabeto (cifre, punteggiatura)
  rimangono invariati.

  Le lettere straniere J, K, W, X, Y fanno parte dell'anello: senza di esse
  resterebbero in chiaro nel testo cifrato (ad esempio in "weekend").

  Il valore di scorrimento viene fornito dall'utente nell'interfaccia
  grafica (campo "Scorrimento cifrario di Cesare"). Il valore 0 significa
  "sorteggia casualmente nell'intervallo 1..25".
iso: it
kategoria: szyfr
kolejnosc: 60
algorytm: cezar

# L'anello del cifrario estende l'alfabeto di dictionaries/it/podstawy.yaml
# (21 lettere, che resta invariato per il rilevamento della lingua e per la
# voce) con J, K, W, X, Y al loro posto nell'ordine latino. Se preferisci
# l'anello puramente italiano, nella TUA copia installata (non nel
# repository, dove un test lo vieta) scrivi "ABCDEFGHILMNOPQRSTUVZ" e riduci
# l'intervallo a ±20 — ma allora J, K, W, X, Y resteranno in chiaro.
alfabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"

# Intervallo di scorrimento consentito nella GUI (SpinCtrl).
# 26 lettere → ±25 copre tutte le rotazioni distinte.
min_przesuniecie: -25
max_przesuniecie: 25
