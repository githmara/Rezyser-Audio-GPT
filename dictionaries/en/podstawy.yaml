# =============================================================================
#  ENGLISH LANGUAGE BASICS
# =============================================================================
#
#  Foundation file for `dictionaries/en/`. The Poliglota engine requires every
#  language to have this file — without it, a new language is NOT detected
#  at all.
#
#  Structure modeled after `dictionaries/pl/podstawy.yaml`. The `polskie_znaki`
#  field, despite its historical name, holds ALL diacritics that should be
#  normalised to ASCII before cipher application or accent rules — including
#  loanwords from other European languages (Pokémon, café, jalapeño, façade,
#  Schrödinger…). The rule manager expects the key name `polskie_znaki`,
#  so we keep it.
# =============================================================================

id: podstawy
jezyk: en
# 13.4.3: lingua-language-detector identifier used by the Poliglota engine.
# Must be the name of a `lingua.Language` enum (uppercase, no prefix) — full
# list at https://github.com/pemistahl/lingua-py. Missing field disables this
# language in the detector (sticky-fallback kicks in), the folder stays visible.
lingua: ENGLISH
etykieta: "English – phonetic basics"
opis: |
  Base rules for the English language:
    1. Diacritic normalisation for European loanwords (`polskie_znaki`) –
       so that the Caesar cipher and accent engines see only the 26-letter
       English alphabet (otherwise non-native chars slip through).
    2. English alphabet (26 uppercase letters) – used by the Caesar cipher.

# -----------------------------------------------------------------------------
# Diacritic normalisation. Every non-English Latin letter is mapped to a form
# the Caesar cipher and the accent rules can work on, i.e. one written with the
# 26 letters of `alfabet` below. Without this list, "Pokémon" + Caesar(3) →
# "Srnéprq" (é stays unencrypted) — a real bug fixed in 13.3.
#
# v19.7: THE TARGET IS ENGLISH, NOT THE POOREST ASCII SHAPE. Up to v19.6 every
# foreign letter fell to its bare base letter, and that was impoverishment
# rather than simplification: the pre-pass runs BEFORE the `zamiany` list of
# EVERY accent of this pack, so flattening `š` to a plain `s` threw away the
# rule the accents have always had (`sh → ш`, `ch → ч` in rosyjski.yaml) before
# the accent could see anything at all. A foreign letter that STABLY carries a
# sound English already writes now gets the English spelling — usually a
# digraph, because a digraph FORCES the sound a single letter only suggests:
#     š ş ŝ → sh    č ĉ ċ → ch    ž ĵ → zh    ř → rzh    ñ → ny
#     đ ĝ ġ → j     ţ → ts        ŭ ł → w     ç → s      ð → th    å → o
#   Polish letters follow the same rule: ą → on, ę → en, ć → ch, ś → sh,
#   ź ż → zh. Measured: "Wałęsa Żeromski" now comes out as "Wawensa
#   Zheromski" instead of "Walesa Zeromski", and "Dvořák Đoković" as
#   "Dvorzhak Jokovic" instead of "Dvorak Dokovic".
#
#   A DIGRAPH MAY NOT INVENT A SYLLABLE, and that is why `ñ → ny` while
#   Polish `ń`, Czech `ň` and Latvian `ņ` keep the plain `n`. All four are
#   /ɲ/, so the sound argues for one target — but position decides: Spanish
#   never ends a word in `ñ` (mañana → manyana, three syllables both ways),
#   while the other three stand at the end constantly (Poznań, Plzeň). There
#   a final `y` is read as a vowel, so "Poznany" gains a syllable the name
#   does not have — a bigger error than the lost palatalisation, because it
#   changes the shape of the word rather than its colour. The engine applies
#   a sequential `str.replace` and cannot see the next character, so this is
#   a choice made once for the whole pack.
#
# THE REST STAYS ASCII AND THAT IS ALSO A DECISION. The criterion has two
# sides and both must hold: the SOURCE has to mean one sound in the languages
# it comes from (`ä` is German /ɛ/ once and Finnish /æ/ the next, `æ` Danish
# /ɛ/ and Icelandic /ai/), and the TARGET has to be something THIS pack's
# voice reads the same way every time. The second half is why `ó → o` stays:
# `ó` is Polish /u/, Icelandic /ou/ and Spanish stressed /o/ at once, so there
# is nothing stable to aim at. Where two languages pull one character, the one
# an English reader meets more often wins (`ç` French /s/ over Turkish /tʃ/;
# `ż` Polish /ʐ/ over Maltese /z/) — this list is shared by the whole pack and
# cannot look at the text.
#
# The boundary is enforced by `audyt_podstaw` (class `znaki-cel-obcy`): the
# target may use ASCII or a letter standing in `alfabet` below — never a letter
# of a third language.
#
# Categories: Polish, French/European, Spanish, Scandinavian, Icelandic, German.
# -----------------------------------------------------------------------------
polskie_znaki:
  # -- Polish: every letter here means ONE sound in Polish and English has a
  #    spelling for it, so we write that spelling instead of dropping the
  #    diacritic. `ó` is the exception: Polish /u/, but Icelandic /ou/ and
  #    Spanish stressed /o/ as well, so the source is not stable and the plain
  #    `o` stays. Nasals go to `on`/`en` — a reader needs no /ɔ̃/ in the
  #    description to read "Wawensa" closer than "Walesa" --
  - { wzor: "ą", zamiana: "on" }
  - { wzor: "ć", zamiana: "ch" }
  - { wzor: "ę", zamiana: "en" }
  - { wzor: "ł", zamiana: "w"  }
  - { wzor: "ń", zamiana: "n"  }
  - { wzor: "ó", zamiana: "o"  }
  - { wzor: "ś", zamiana: "sh" }
  - { wzor: "ź", zamiana: "zh" }
  - { wzor: "ż", zamiana: "zh" }
  - { wzor: "Ą", zamiana: "On" }
  - { wzor: "Ć", zamiana: "Ch" }
  - { wzor: "Ę", zamiana: "En" }
  - { wzor: "Ł", zamiana: "W"  }
  - { wzor: "Ń", zamiana: "N"  }
  - { wzor: "Ó", zamiana: "O"  }
  - { wzor: "Ś", zamiana: "Sh" }
  - { wzor: "Ź", zamiana: "Zh" }
  - { wzor: "Ż", zamiana: "Zh" }
  # -- → a (French/Spanish/Portuguese/Scandinavian/German) --
  - { wzor: "á", zamiana: "a"  }
  - { wzor: "à", zamiana: "a"  }
  - { wzor: "â", zamiana: "a"  }
  - { wzor: "ã", zamiana: "a"  }
  - { wzor: "ä", zamiana: "a"  }
  - { wzor: "å", zamiana: "o"  }
  - { wzor: "Á", zamiana: "A"  }
  - { wzor: "À", zamiana: "A"  }
  - { wzor: "Â", zamiana: "A"  }
  - { wzor: "Ã", zamiana: "A"  }
  - { wzor: "Ä", zamiana: "A"  }
  - { wzor: "Å", zamiana: "O"  }
  # -- → ae --
  - { wzor: "æ", zamiana: "ae" }
  - { wzor: "Æ", zamiana: "Ae" }
  # -- → s (the French cedilla is /s/ in "garçon"; a bare `c` before `o`
  #    reads /k/, which is the one sound the cedilla exists to rule out) --
  - { wzor: "ç", zamiana: "s"  }
  - { wzor: "Ç", zamiana: "S"  }
  # -- → th (Icelandic Ð/ð is /ð/ — the sound English `th` carries in "the".
  #    `þ` below takes the voiceless one, exactly as English writes both with
  #    the same digraph) --
  - { wzor: "ð", zamiana: "th" }
  - { wzor: "Ð", zamiana: "Th" }
  # -- → e --
  - { wzor: "é", zamiana: "e"  }
  - { wzor: "è", zamiana: "e"  }
  - { wzor: "ê", zamiana: "e"  }
  - { wzor: "ë", zamiana: "e"  }
  - { wzor: "É", zamiana: "E"  }
  - { wzor: "È", zamiana: "E"  }
  - { wzor: "Ê", zamiana: "E"  }
  - { wzor: "Ë", zamiana: "E"  }
  # -- → i --
  - { wzor: "í", zamiana: "i"  }
  - { wzor: "ì", zamiana: "i"  }
  - { wzor: "î", zamiana: "i"  }
  - { wzor: "ï", zamiana: "i"  }
  - { wzor: "Í", zamiana: "I"  }
  - { wzor: "Ì", zamiana: "I"  }
  - { wzor: "Î", zamiana: "I"  }
  - { wzor: "Ï", zamiana: "I"  }
  # -- → ny (Spanish /ɲ/, the sound English writes in "canyon") --
  - { wzor: "ñ", zamiana: "ny" }
  - { wzor: "Ñ", zamiana: "Ny" }
  # -- → o --
  - { wzor: "ò", zamiana: "o"  }
  - { wzor: "ô", zamiana: "o"  }
  - { wzor: "õ", zamiana: "o"  }
  - { wzor: "ö", zamiana: "o"  }
  - { wzor: "ø", zamiana: "o"  }
  - { wzor: "Ò", zamiana: "O"  }
  - { wzor: "Ô", zamiana: "O"  }
  - { wzor: "Õ", zamiana: "O"  }
  - { wzor: "Ö", zamiana: "O"  }
  - { wzor: "Ø", zamiana: "O"  }
  # -- → oe --
  - { wzor: "œ", zamiana: "oe" }
  - { wzor: "Œ", zamiana: "Oe" }
  # -- → ss (German ß; only lowercase form exists in standard orthography) --
  - { wzor: "ß", zamiana: "ss" }
  # -- → th (Icelandic Þ/þ) --
  - { wzor: "þ", zamiana: "th" }
  - { wzor: "Þ", zamiana: "Th" }
  # -- → u --
  - { wzor: "ú", zamiana: "u"  }
  - { wzor: "ù", zamiana: "u"  }
  - { wzor: "û", zamiana: "u"  }
  - { wzor: "ü", zamiana: "u"  }
  - { wzor: "Ú", zamiana: "U"  }
  - { wzor: "Ù", zamiana: "U"  }
  - { wzor: "Û", zamiana: "U"  }
  - { wzor: "Ü", zamiana: "U"  }
  # -- → y --
  - { wzor: "ý", zamiana: "y"  }
  - { wzor: "ÿ", zamiana: "y"  }
  - { wzor: "Ý", zamiana: "Y"  }
  - { wzor: "Ÿ", zamiana: "Y"  }
  # -- Japanese romanization macrons (Tōkyō, rāmen) → base vowel --
  - { wzor: "ā", zamiana: "a"  }
  - { wzor: "ē", zamiana: "e"  }
  - { wzor: "ī", zamiana: "i"  }
  - { wzor: "ō", zamiana: "o"  }
  - { wzor: "ū", zamiana: "u"  }
  - { wzor: "Ā", zamiana: "A"  }
  - { wzor: "Ē", zamiana: "E"  }
  - { wzor: "Ī", zamiana: "I"  }
  - { wzor: "Ō", zamiana: "O"  }
  - { wzor: "Ū", zamiana: "U"  }
  # -- Latin Extended-A: diacritics FOREIGN to this pack (v19.5) --
  #    Default pairs: `manager_regul_szablony.TABELA_LACINKI` — a map to bare
  #    ASCII, neutral for a language whose author the template does not know.
  #    v19.7 tunes the ones whose sound English writes on its own (see the
  #    section note above); the rest keep the neutral default, because a letter
  #    without a stable English spelling guesses worse than it simplifies
  #    (`ď ť ľ ģ ķ ļ` are palatal consonants English has no digraph for, and
  #    `ğ` only lengthens the Turkish vowel in front of it).
