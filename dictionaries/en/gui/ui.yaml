  ant_err_struktura: "🚨 File structure error!\nThe required variable ANTHROPIC_API_KEY= is missing.\nSince version 18.2, the entire AI engine (Director, Stories, Polyglot, chapter titles) runs on the Claude model and requires an Anthropic key.\nDelete the file, regenerate it, and paste the key more carefully."
  ant_err_format: "🚨 Suspicious Anthropic key format!\nA valid Anthropic (Claude) key always starts with sk-ant- (e.g. sk-ant-api03-…).\nMake sure you copied the key from console.anthropic.com and not a key from another provider."
