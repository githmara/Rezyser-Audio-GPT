  kod_jezyka_blad_tresc: "Could not determine the language code (ISO) for the response language \"{jezyk_odpowiedzi}\". Open the recipe in the Rules Manager and set the kod_jezyka field (e.g. \"fi\") so structure headers and accents match the content language."
  jezyk_naglowkow_ostrzezenie_tytul: Header language vs recipe language
  jezyk_naglowkow_ostrzezenie_tresc: "The loaded project has structure headers that look like \"{wykryty}\", but the active recipe generates content in \"{kod}\". New headers will be inserted in \"{kod}\" — if that is unintended, adjust the recipe's kod_jezyka field or pick another mode."
  # Model-memory indicator (gui_rezyser._aktualizuj_pamiec_modelu builds the text from i18n by `poziom`)
  pamiec_status_czysta: "🟢 Memory clear. The engine is ready for a new story."
  pamiec_status_ok: "🟢 Memory usage: {tokeny} / {maks} tokens. Safe buffer."
  pamiec_status_ostrzezenie: "⚠️ WARNING STATE: {tokeny} of {maks} tokens used. Memory is filling up – you'll soon need to generate a summary (the Long-Term Memory button in the post-production section)."
  pamiec_status_alarm: "🚨 CRITICAL OVERLOAD: {tokeny} of {maks} tokens used. After the next successful send, the application will automatically save the Long-Term Memory; to free up working memory, reload the project from disk afterward."
  err_dlugosc: The model's response was cut off before it could be completed (length limit exceeded). Shorten the context — e.g., the World Book or instruction — and try again.
  btn_przeladuj_label: '&Reload project from disk'
  btn_przeladuj_tooltip: 'Reloads the ENTIRE project from disk after your manual changes in the narration file (skrypty/<name>.txt) — recalculates Chapter/Act/Scene counters, raises the World Book, mode and Brainstorm options, and synchronizes working memory. Loads a short story in full; for a long one, it will ask from which header the AI working memory should start (the rest is represented by the Summary). WARNING: overwrites field contents with the version from disk — save unsaved changes first.'
  przeladuj_ostrzezenie_tytul: Reload project from disk?
  przeladuj_ostrzezenie_tresc: "Reloading will replace the current content (World Book, Long-term Memory, narration, structure counters) with the version saved on disk. Unsaved changes in fields will be lost.\n\nContinue?"
  przeladuj_tytul: Project reloaded from disk
  przeladuj_calosc_tresc: The entire project reloaded from disk ({liczba_znakow} characters). Structure counters, World Book, mode, and working memory are synchronized with the file.
  przeladuj_calosc_skasowano_tresc: The entire project reloaded from disk ({liczba_znakow} characters) — the entire text fit into the context window, so the unnecessary summary was removed (the engine now works on the full history). Counters and World Book synchronized with the file.
  marker_dlg_tytul: Working memory reference point
  marker_dlg_plaski_lbl: The story is too long to fit in full. From which Chapter should the AI working memory start? (Earlier events are represented by the Summary. Cancel = last text fragment.)
  marker_dlg_akt_lbl: The story is too long to fit in full. From which Act should the AI working memory start? (Cancel = last text fragment.)
  marker_dlg_scena_lbl: From which Scene of this Act should the AI working memory start?
  marker_dlg_caly_akt: ← entire Act (from act header)
  punkt_odniesienia_tytul: Working memory reference point
  punkt_odniesienia_snap_tresc: AI working memory starts from the header “{naglowek}" ({liczba_znakow} characters). Earlier events are represented by the Long-term Summary (remained untouched).
  punkt_odniesienia_fallback_tresc: 'No reference point indicated — the last fragment of the narration ({liczba_znakow} characters) entered the working memory. The summary remained untouched. Tip: insert Chapter/Act/Scene headers to precisely choose the start of memory.'
  punkt_odniesienia_za_dluga_tresc: "The selected fragment “{naglowek}\" is so extensive that it doesn't fit into the working memory window by itself — emergency cutting to the last {liczba_znakow} characters was applied. Director, this is a bit of madness: consider dividing Acts/Chapters into smaller Scenes — shorter sections will allow the AI to maintain consistent context."
  tytuly_postep: 'Titling: {naglowek} ({step}/{total})…'
  tytuly_blad_brak_struktury: No structure tags found (Prologue / Chapter N / Epilogue) in the file. Insert chapter breaks before titling.
  kod_jezyka_rozjazd_tytul: The language code does not match the content
  kod_jezyka_rozjazd_tresc: 'The recipe specifies the language code "{kod_wpisany}", but the response language is "{jezyk_odpowiedzi}" — which corresponds to the code "{kod_wykryty}". The "jezyk_odpowiedzi" alone is NOT sufficient: the ISO code controls the structure headers (Prologue/Act/Scene), accent selection, and the ElevenLabs bridge. The code "{kod_wykryty}" was used. If this is a mistake, correct the kod_jezyka field in the Rule Manager.'
  kod_jezyka_edu_tytul: Failed to determine the language code
  kod_jezyka_edu_naglowek: 'ISO language code of the content — required action:'
  kod_jezyka_edu_tresc: 'Failed to automatically determine the ISO 639-1 code for the response language "{jezyk_odpowiedzi}" (no connection to the API or ambiguous response). This two-letter code is necessary: it controls the structure headers (Prologue/Act/Scene), accent selection, and the project language in ElevenLabs. The "jezyk_odpowiedzi" description alone is not enough. Open the recipe in the Rule Manager and enter the correct code in the kod_jezyka field (e.g., "fi" for Finnish, "de" for German).'
  kod_jezyka_edu_prompt: "If you don't know the code, copy the following question and paste it into any chatbot (e.g., ChatGPT):\n\n\"Provide the two-letter ISO 639-1 code for the language described as: {jezyk_odpowiedzi}. Respond with the code only.\""
  kod_jezyka_edu_name: Explanation of the language code and prompt for the chatbot
  ostrzezenie_urwane_tytul: Fragment may have been cut off
  ostrzezenie_urwane_tresc: The model's response reached the length limit and was cut off mid-sentence, and the automatic attempt to complete the last sentence failed. The fragment has been saved as-is — check the ending and, if needed, add a conclusion manually or send a short continuation prompt.
  err_struktura: The AI model returned an invalid data structure several times and it could not be corrected. Please try again or simplify the instruction — if the error persists, attach the error_log.txt file to your report.
  pamiec_status_offline: '⚠️ No internet connection: the exact memory counter is unavailable, values are approximate (~{tokeny} / {maks} tokens). Restart the application once your connection is restored.'
  err_timeout: The model response timed out. Check your internet connection and try again.
  err_kontekst: The material sent to the model didn't fit in its context window. Save Long-Term Memory (the summary shortens the context for subsequent calls), split the project into smaller files, or choose a model with a larger window — Claude models have the most headroom here.
  postprod_kontekst_tytul: Large project — check the model's window
  postprod_kontekst_tresc: "The material for the tool is about {tokeny} tokens and exceeds {limit} tokens, the context window the application uses to measure memory usage.\n\nClaude models have a window much larger than this counter, so the call will most likely succeed. However, if you're using your own AI provider with a smaller window, the model will reject the request — and you'll still pay for the attempt.\n\nRun the tool anyway?"
  pamiec_auto_start: Model memory almost full — saving Long-Term Memory…
  pamiec_auto_zapisana_tytul: Long-Term Memory saved automatically
  pamiec_auto_zapisana_tresc: "Model memory has exceeded the alarm threshold, so the application automatically prepared a summary of project {nazwa_projektu} and saved it as {plik}.\n\nThe summary now appears in the \"Long-Term Memory\" field — you can freely edit it and save it again.\n\nSaving alone does not yet reduce memory usage: the indicator will only drop once the project is reloaded from disk, since that is when the application replaces the entire history with the summary plus the tail end of the narrative. Until then, the automatic process won't repeat — you can request another summary using the button in the postproduction section."
