  sr_heading: 📖 Screen Reader Version (NVDA)
  sr_info: 'Build a separate HTML file from the ready script for screen readers: character lines with an accent receive a phonetic transcription and a language tag (lang), so the screen reader reads them with the correct accent. The ElevenLabs bridge uses plain text and an accented voice for this — these are two independent outputs of the same script.'
  btn_sr_label: 📖 Generate Screen Reader Version
  btn_sr_name: Generate Screen Reader Version
  btn_sr_tooltip: "Creates file skrypty/<name>_screen_reader.html: accents by misspelling + language tag, audio tags removed.\nRequires a saved project file; the World Book determines which character has which accent."
  sr_sukces_tytul: Screen Reader Version Ready
  sr_sukces_tresc: 'Screen reader file saved: skrypty/{nazwa_pliku}_screen_reader.html'
  sr_blad_tytul: Error Generating Screen Reader Version
