  blad_tworzenia: "Failed to create file:\n{tresc_bledu}"
  niepelna_struktura_tytul: "Incomplete language structure"
  niepelna_struktura_tresc: |-
    File podstawy.yaml saved, but failed to create subfolders akcenty/, szyfry/, rezyser/, and gui/:
    {tresc_bledu}

    Create them manually in File Explorer before running Polyglot — otherwise, the engine will throw an error when scanning the new language.
  # "Next steps" notes in WynikKreatoraDialog. Composed in
  # manager_regul_szablony._uwagi(): rule-type note + jezyk_agenta + environment
  # paragraph (source vs installed package, per sys.frozen). Placeholders
  # {jezyk_bazowy}/{id_pliku} are substituted; {{naglowek}}/{{probka}} are literals.
  uwagi:
    akcent: |-
      The template at `dictionaries/{jezyk_bazowy}/akcenty/{id_pliku}.yaml` has an empty phonetic-substitution pipeline. The accent is detected dynamically — just restart the app (since v17.5 there is no code-regeneration step).

      NOTE: the `zamiany:` list is applied SEQUENTIALLY — each rule operates on the output of the previous one. A rule that introduces a letter later used as a `wzor` (pattern) by another rule will fall into a loop (classic: `ñ → nj` before `j → x` yields `ñ → nx`, not `nj`). First replace the TARGET with something safe, only then introduce the SOURCE.
    akcent_oczyszczenie: |-
      Cleaning accent (`kategoria: oczyszczenie`) in the `{jezyk_bazowy}/` package. The structure of files of this type is identical across all shipped packages — only the label, description, and comments (native) differ.
    akcent_naprawiacz: |-
      Tag repairer (`kategoria: naprawiacz`) in the `{jezyk_bazowy}/` package. Special mode: it injects the ISO language code into output files (HTML/DOCX) without modifying the content.
    szyfr_zamiany: |-
      Template for a "pure substitutions" cipher at `dictionaries/{jezyk_bazowy}/szyfry/{id_pliku}.yaml`. Format = `kategoria: szyfr` + a `zamiany:` list (like an accent, but without the phonetic pipeline). Take the STRUCTURE model from the accents — all shipped ciphers are algorithmic (a different format, with no `zamiany:` list).
    tryb_rezysera: |-
      Template based on the Audiobook mode (`{jezyk_bazowy}/` package). The agent will design `prompt_systemowy`, `przypomnienie_uzytkownika`, and `slowa_wyzwalajace` in the package's native language.
    tryb_opowiesci: |-
      Story Mode REQUIRES source code editing — the Manager does NOT create a file, it only provides a prompt for the agent. Game modes are recognized by numerical constants and maps in `opowiesci_ai.py`/`gui_opowiesci.py`, so the new mode needs to be wired (int constant added at the end, entries in maps, RadioBox label, model per mode). From an installed application (without a repository), this is unfeasible — a source version is needed.
    postprodukcja: |-
      The postproduction template iterates over chapters (`{jezyk_bazowy}/` package). The agent will design `prompt_systemowy`, `prompt_uzytkownika_szablon` (placeholders {{naglowek}}, {{probka}}), and `regex_podzial_rozdzialow` matched to the native chapter names (Rozdział/Kapitel/Capitolo/Глава…).
    jezyk_bazowy: |-
      The Manager will create `dictionaries/{id_pliku}/` with the subfolders `akcenty/`, `szyfry/`, `rezyser/`, `gui/`, and `opowiesci/`. The `podstawy.yaml` template has `<FILL NATIVELY>` markers. The agent models it on `de/podstawy.yaml` or `it/podstawy.yaml`. The UI translation (`gui/ui.yaml`) is generated by `buduj_wielojezyczne_ui.py`. The engine requires ≥1 file in `rezyser/` to consider the language complete.
    szyfr_algorytm: |-
      ALGORITHMIC cipher — it requires a function in `core_poliglota.py` alongside the YAML file. The Manager creates no file; the agent adds an `_algorytm_*` function + an entry in the `_ALGORYTMY` map + a YAML file at `dictionaries/{jezyk_bazowy}/szyfry/{id_pliku}.yaml`. This is the ONLY rule type that requires editing source code — from the installed application (without the repository) it is not feasible; the source version is needed.
    jezyk_agenta: |-
      The prompt below is in English (the working language of coding agents); the content of the created files is produced in the package's native language regardless. If you prefer the agent to communicate with you in your language, set that in its configuration (e.g. in Claude Code via `/config`).
    srodowisko_zrodlo: |-
      Workflow: copy the prompt below into an AI agent with access to this repository (Claude Code, Cursor, Aider). The agent will open the reference files, create/complete the file, and verify it. Changes in `akcenty/`, `szyfry/`, `rezyser/` are picked up after restarting the app.
    srodowisko_frozen: |-
      You are using the installed application (without the repository sources). The prompt below assumes a developer with the repository and an AI agent — the full agentic workflow requires the source version. From the app alone, however, you can manually fill in the generated YAML template (the `dictionaries/` files sit next to the program and are editable); you will see the changes after restarting the app.
  # manager_regul_szablony.LISTA_TYPOW — label (creator ComboBox) + description
  # (TextCtrl below the ComboBox) for each rule type. <jezyk>/<id> in the
  # descriptions are illustrative paths (not i18n placeholders); identifiers in
  # `backticks` and file names (.py/.yaml) stay untranslated.
  typ:
    akcent:
      etykieta: "Phonetic accent (cross-language, e.g. Swedish, Finnish)"
      opis: |-
        A file at <jezyk>/akcenty/<id>.yaml with `kategoria: akcent`. The base-package text (jezyk_bazowy) is transliterated for the target synthesizer's pronunciation (iso != jezyk_bazowy). The Manager creates a template + a prompt for an AI agent that will design the `zamiany:` list.
    akcent_oczyszczenie:
      etykieta: "Cleaning accent (preprocessor, no phonetics)"
      opis: |-
        A file at <jezyk>/akcenty/<id>.yaml with `kategoria: oczyszczenie`. It cleans the text for TTS (removes gibberish, normalizes numbers) WITHOUT changing phonetics. iso == jezyk_bazowy. The Manager creates a template (a ready-made model) + a prompt for translating the label/description into the native language.
    akcent_naprawiacz:
      etykieta: "Tag repairer (injects ISO into HTML/DOCX)"
      opis: |-
        A file at <jezyk>/akcenty/<id>.yaml with `kategoria: naprawiacz`. It does NOT modify the content — it injects the ISO language code into output files (<html lang>, <w:lang>). iso is empty (the user supplies the code in the GUI). The Manager creates a template + a prompt for translating the label/description into the native language.
    szyfr_zamiany:
      etykieta: 'New "pure substitutions" cipher'
      opis: |-
        A file in <jezyk>/szyfry/. The Manager creates a template + a prompt for an AI that will translate the labels/comments into the package's native language and generate a list of wzor→zamiana (pattern→replacement) pairs.
    tryb_rezysera:
      etykieta: "New Director mode (creative mode)"
      opis: |-
        A file at <jezyk>/rezyser/tryb_*.yaml. A template based on the Audiobook mode + a prompt for an AI that translates prompt_systemowy, przypomnienie_uzytkownika, and slowa_wyzwalajace into the base package's native language.
    tryb_opowiesci:
      etykieta: "New Story Mode (REQUIRES DEVELOPER)"
      opis: |-
        Interactive game mode (Stories). Unlike Director modes, it is NOT data-driven: the YAML file alone is dead code — the engine recognizes modes by numerical constants and maps in Python. The Manager does NOT create a file; it only provides a prompt for AI/developer with a complete list of code entry points (int constant, two maps, RadioBox, model per mode).
    postprodukcja:
      etykieta: "New postproduction (chapter-by-chapter iteration)"
      opis: |-
        A file at <jezyk>/rezyser/postprod_*.yaml. A template with fields for the prompt, regex, and iteration parameters + a prompt for an AI that generates a native prompt_systemowy and regex_podzial_rozdzialow.
    jezyk_bazowy:
      etykieta: "New base language (e.g. en, de, fr)"
      opis: |-
        Creates the <jezyk>/ folder with podstawy.yaml and the subfolders akcenty/, szyfry/, rezyser/, gui/. The phonetic data is generated by the AI from the prompt; the UI translation – buduj_wielojezyczne_ui.py; the Director modes are copied from pl/rezyser/ (≥1 tryb_*.yaml file is required for the engine to consider the language complete).
    szyfr_algorytm:
      etykieta: "New algorithmic cipher (REQUIRES A PROGRAMMER)"
      opis: |-
        Algorithms (e.g. reversal, typoglycemia) require a function in core_poliglota.py. The Manager only provides a prompt for an AI with a description of the task.

