  btn_edytuj_stan_tooltip: 'Opens the raw game state file (.game.json) for direct editing in a window with JSON validation. For advanced users: allows manual correction of characters, location, inventory, plots, and counters when manual narrative editing has diverged from the structural state. WARNING: incorrect editing may corrupt the save — changes are validated as JSON before saving, but content correctness (field sensibility) is your responsibility.'
  dlg_edytuj_stan_tytul: Game state editing (.game.json)
  dlg_edytuj_stan_lbl: 'Raw game state in JSON format. Edit carefully: after saving, the game will be reloaded from this file. The content must remain a valid JSON object — otherwise, the save will be rejected.'
  dlg_edytuj_stan_name: Raw game state editing field in JSON format
  dlg_edytuj_stan_btn_ok: '&Save and reload'
  dlg_edytuj_stan_btn_anuluj: '&Cancel'
  edytuj_stan_blad_json_tytul: Invalid JSON
  edytuj_stan_blad_json_tresc: "The content is not valid JSON, so it was not saved (the game would be corrupted). Correct the syntax and try again.\n\nError details:\n{tresc_bledu}"
  edytuj_stan_blad_typ_tresc: The main game state element must be a JSON object (a key-value pair in curly braces), not a list or a simple value. Restore the object structure and try again.
  edytuj_stan_zapisano_tytul: Game state saved
  edytuj_stan_zapisano_tresc: Game state “{nazwa}" has been saved and reloaded from disk. Characters, location, inventory, plots, and counters now reflect your edits.
  err_dlugosc: The model's response was cut off before it could be completed (length limit exceeded). Shorten the context and try again.
  odrzucenie_tytul: Action cannot be conducted
  odrzucenie_tresc: The narrative engine cannot conduct this action — it might have been off-topic, impossible in this world, or against content rules. The turn was not saved. Rephrase the action and try again.
  btn_zamknij_gre_label: '&Close Game'
  btn_zamknij_gre_tooltip: Closes the current game and returns to the new game setup screen (unlocks mode selection and Quick Start). The game is saved to disk — you can load it later. A confirmation prompt will appear.
  zamknij_gre_pytanie_tytul: Close current game?
  zamknij_gre_pytanie: "Close the current game and return to the new game setup screen?\n\nThe game state is saved to disk after each turn, so nothing is lost — you can reload the game later using the \"Load\" button."
  komenda_odswiez_zablokowana_tytul: Command locked
  komenda_odswiez_zablokowana_tresc: The "{komenda}" command is locked by default, because refreshing the narrative from disk does not recalculate the game state (characters, location, inventory) and may cause semantic drift. To unlock it, set EDYCJA_STANU_GRY_WIDOCZNA = True in gui_opowiesci.py:72 and build your own package.
  komenda_odswiez_zablokowana_hint: (/odswiez, /refresh — locked; set EDYCJA_STANU_GRY_WIDOCZNA = True in gui_opowiesci.py:72 to unlock)
  err_struktura: The AI model returned an invalid data structure several times and it could not be corrected. Please try again — if the error persists, attach the error_log.txt file to your report.
  pamiec_status_offline: '⚠️ No internet connection: the exact memory counter is unavailable, values are approximate (~{procent}% — {tokeny} tokens). Restart the application once your connection is restored.'
  err_kontekst: The game history didn't fit in the model's context window. End this game and start a new one, or choose a model with a larger window — Claude models have the most headroom here.
  err_odmowa: The model refused to carry out this command — its content may have violated the model's policies or been too ambiguous. Nothing was saved; rephrase the command and try again.
