  el_sieroty_btn_anuluj: '&Cancel and fix'
  el_build_blad_tytul: "ElevenLabs error"
  el_build_blad_uprawnienia_tresc: |-
    The ElevenLabs key lacks the required permissions (scopes).
    In the ElevenLabs panel (Profile → API key → edit) add the projects_write and voices_read permissions and try again.
  el_build_blad_tresc: "Failed to create the ElevenLabs Studio project:\n{tresc_bledu}"
  el_raport_tytul: "ElevenLabs Studio project created"
  el_raport_tresc: |-
    ✅ The project "{nazwa}" has been created in ElevenLabs Studio (0 credits — creating a project consumes no text characters).

