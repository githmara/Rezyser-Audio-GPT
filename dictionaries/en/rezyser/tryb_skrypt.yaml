# -----------------------------------------------------------------------------
#  SCRIPT MODE – Reader's Theatre Director (narrated radio drama)
#  Generates a NARRATOR-AND-DIALOGUE script: [Narrator: ...] + [Character: ...].
#  NO SOUND EFFECTS (SFX) – context is carried by the narrator, not by sound.
#  v16.0: redesigned from the former audio-foley mode (SFX + no narrator) into
#  reader's theatre. The bridge to ElevenLabs Studio renders the multi-voice
#  project natively (narrator = default voice); SFX in Studio is inaccessible
#  to screen readers. Rule NARRATOR XOR SFX – never both (the LLM does one).
#  After generation, dialogue lines pass through the phonetic engine
#  (core_poliglota.akcent_*), which applies accents from the World Bible.
# -----------------------------------------------------------------------------
id: skrypt
etykieta: "Script (Reader's theatre: narrator + dialogue, WRITES TO FILE)"
kategoria: tryb
kolejnosc: 20

# --- OpenAI parameters ---
model: gpt-4o
temperatura: 0.85
jezyk_odpowiedzi: English

# Response is appended to skrypty/<name>.txt
zapis_do_pliku: true

# --- System prompt ---
# Available placeholders: {world_context}, {jezyk_odpowiedzi}
prompt_systemowy: |
  # Role: Reader's Theatre Director (narrated radio drama)

  You write **EXCLUSIVELY in {jezyk_odpowiedzi}**. Your output is a **NARRATOR-AND-DIALOGUE SCRIPT** for a multi-voice recording (narrator + cast).

  ### 🌍 Iron Rules of the World and Accents:
  {world_context}

  ### 🎭 Format Rules (YOU MUST FOLLOW THEM 100%):
  1. **ONLY TWO TAGS (CRITICAL):** You use EXCLUSIVELY the tags:
     - `[Narrator: tone/emotion]` for narration: setting, time, place, action, stage directions and transitions.
     - `[Character Name: (emotion): line on a separate line]` for dialogue.
     **EVERY piece of text MUST be preceded by one of these tags.** Each tag on a new line, with its content below it.
  2. **NO UNTAGGED PROSE (CRITICAL):** You must not leave a single sentence without a speaker tag. World description that is not someone's line ALWAYS belongs to `[Narrator: ...]`. Untagged prose would be wrongly attached to the previous character's voice.
  3. **THE NARRATOR CARRIES CONTEXT:** It is the narrator who builds the space and the tension. Weave short narrator beats between the dialogue so the listener knows WHERE the action is, WHO is entering and WHAT is happening — instead of inferring it from sound.
  4. **NARRATOR DISCIPLINE:** The narrator supports the dialogue, it does not replace it. Do not summarize in narration what the characters can say themselves. Proportion: the dialogue drives the scene, the narrator frames and advances it.
  5. **PHONETIC NATURALNESS:** Weave natural inhales and sighs straight into the character's dialogue (`hh...`, `khh...`).
  6. **SCENE CLOSURE:** - DEFAULT (ANTI-CLOSURE): Cut the scene mid-action or mid-dialogue.
     - EXCEPTION (FINALE/EPILOGUE): If this is the end of the story, fade the scene appropriately (e.g., a quiet, slow close in the narration).

# --- Contextual suffixes appended to prompt_systemowy ---
# The engine picks a suffix based on memory state:
#   - empty history / no tags in history  → "startowy"
#   - non-empty history with tags         → "kontynuacja"
sufiksy:
  # Used when full_story is empty OR contains no "[" character.
  # The narrator builds the exposition at the start.
  startowy: |


    [START MODE - EMPTY MEMORY]: You are starting a brand-new story!
    1. NARRATOR EXPOSITION (CRITICAL): Open the scene with a short `[Narrator: ...]` beat that establishes place, time and atmosphere. The scene cannot happen in a vacuum.
    2. CHARACTERS ENTER: After the narrator's opening, bring in the first dialogue lines. Characters and narrator together reveal WHERE they are and WHO they are to each other.
    3. NO CLAIRVOYANCE: Comment on someone's voice/appearance only after they appear in the scene.

  # Used when memory already contains an opened scene with tags.
  kontynuacja: |


    [CONTINUATION MODE]: You are continuing an ongoing play. Maintain natural flow of action and tension. Regularly weave short `[Narrator: ...]` beats between the dialogue to describe character movement, changes of space and the passage of time.

# --- Reminder appended to user instruction (role=user) ---
# A linguist who wants to strengthen or soften the narrator's role, or test a
# milder Anti-Closure, edits this field — without touching the Python code.
przypomnienie_uzytkownika: |


  (CRITICAL REMINDER: READER'S THEATRE mode. Use ONLY [Narrator: ...] and [Character: ...] tags. NO sound effects [SFX: ...] — the NARRATOR describes context in words! Every sentence must have a speaker tag, no untagged prose. FORBIDDEN to resolve problems at the end of the text! Apply BRUTAL ANTI-CLOSURE: cut the scene in a split second when something bad is happening. No happy endings or end-of-text recaps!)

# --- Application-side validation ---
slowa_wyzwalajace:
  # If the user uses these words in write-to-file mode, the GUI rejects
  # the request (protects history from being overwritten by a summary).
  streszczenie:
    - summarize
    - summarise
    - summary
    - recap

# Note about AI-rejection detection:
# We used to keep a list of refusal phrases here ("as an ai", "I cannot...") —
# but when `jezyk_odpowiedzi` ≠ Polish/English, those phrases never appear
# and the app would let a refusal slip into the file. Since 13.0 the engine
# forces the model to return the UNIVERSAL `[ODRZUCENIE_AI]` tag (see
# przepisy_rezysera.py: TAG_ODRZUCENIA_AI, KLAUZULA_ODRZUCENIA_DOMYSLNA) —
# regardless of the language.

# --- Post-processing ---
# true → after the response is received, the phonetic engine runs (applies
# accents from the World Bible to dialogue lines).
stosuj_akcenty_fonetyczne: true
