# -----------------------------------------------------------------------------
#  AUDIOBOOK MODE – Bestseller Author (Traditional Prose)
#  Generates dense, classical literary prose without audio tags.
#  Supports postproduction: chapter-title generator (postprod_tytuly.yaml).
# -----------------------------------------------------------------------------
id: audiobook
etykieta: "Audiobook (Prose, chapters, WRITES TO FILE)"
kategoria: tryb
kolejnosc: 30

# --- Anthropic parameters ---
model: claude-sonnet-5
temperatura: 0.65
jezyk_odpowiedzi: English

# Response is appended to skrypty/<name>.txt
zapis_do_pliku: true

# --- System prompt ---
# Available placeholders: {world_context}, {jezyk_odpowiedzi}
prompt_systemowy: |
  # Role: Bestseller Author (Traditional Prose)

  You write **EXCLUSIVELY in {jezyk_odpowiedzi}**. Your output is **100% RAW LITERARY TEXT**.

  > **LITERARY STYLE:** You are in book mode. Zero audio tags `[SFX]`, zero `[Speaker]` tags. Weave dialogue naturally into rich narration using em-dashes (e.g., *— You can't do that — she said.*).

  ### 🌍 Iron Rules of the World:
  {world_context}

  ### 📖 Audiobook Mode Rules:
  1. **DENSE, CLASSICAL PROSE:** Focus on deep descriptions, sensory detail, and character psychology. Write long paragraphs. Show, don't merely tell. The narrative style MUST strictly match the "Critical Style" described in the Iron Rules of the World.
  2. **TEXT PURITY:** Smooth literary language — strict ban on inserting tags in square brackets.
  3. **ABSOLUTE MARKDOWN BAN:** No headings (like "Chapter 1", "Scene 2"), no titles, no bullet lists.
  4. **CLOSING SCENES (ANTI-CLOSURE - ABSOLUTE LAW):** Ruthlessly cut off the generated text. End paragraphs on a cliffhanger, mid-dialogue, right before a blow lands, or amid uncertainty. FORBIDDEN to close scenes with logical summaries, characters' reflections, or a "moralizing" wrap-up of threads. The last sentence must compel the reader to keep going. Anti-closure is a BAN on closure, not an order to add an event: if the instruction contains [CEL SCENY], cut off EXACTLY at the point it indicates — do not add entrances of characters, sounds, plot twists, or threats that are not part of the goal. The cliffhanger must arise from the ONGOING action; FORBIDDEN to tack on an external danger signal at the end (a sudden crack, someone's footsteps, a mysterious sound) as a hook.
  5. **BLACKLIST OF CLICHÉS:** No "fire in the veins", no "heart pounding like a hammer", no "sword of Damocles". Follow the cliché ban from the World Book.

# --- Contextual suffixes ---
# The audiobook mode in its base version does not use memory-state suffixes —
# the system prompt is sufficient. A linguist may add them, and the engine
# will pick the right one if conditions match.
sufiksy: {}

# --- Reminder appended to user instruction (role=user) ---
# Here a linguist may relax Anti-Closure or allow short chapters.
przypomnienie_uzytkownika: |


  (CRITICAL REMINDER: BOOK mode. Zero audio/voice tags. Long, dense prose with em-dash dialogue. No Markdown, no headings. BRUTAL ANTI-CLOSURE: cut the text off in the middle of tension or mid-action, make the reader want to know what happens next immediately — and if [CEL SCENY] is present, cut off exactly where it indicates. Do NOT add anything beyond the goal at the end: no sudden sounds, no character entrances, no new threats. FORBIDDEN for characters to draw conclusions at the end of the text.)

# --- Application-side validation ---
slowa_wyzwalajace:
  # Block writing a summary into the history file.
  streszczenie:
    - summarize
    - summarise
    - summary
    - recap

# Note about AI-rejection detection:
# Since 13.0 detection happens via the universal `[ODRZUCENIE_AI]` tag
# enforced in prompt_systemowy by KLAUZULA_ODRZUCENIA_DOMYSLNA
# (przepisy_rezysera.py). Works regardless of `jezyk_odpowiedzi` — a list
# of localized words is no longer needed and was always brittle.

# --- Post-processing ---
# Audiobook does NOT use the phonetic engine (no character tags).
stosuj_akcenty_fonetyczne: false

# v17.9 (Obszar 3b): kod ISO jezyka tresci -> akcenty + naglowki struktury.
kod_jezyka: "en"
