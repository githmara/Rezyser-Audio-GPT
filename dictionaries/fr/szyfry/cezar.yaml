# CHIFFREMENT : CÉSAR
# Chiffre de décalage classique qui déplace chaque lettre de N positions
# dans l'alphabet français (26 lettres latines).

id: cezar
etykieta: "Chiffrement de César (décalage alphabet FR)"
opis: |
  Chiffrement de César classique : chaque lettre est décalée de N positions
  dans l'alphabet français (ABCDEFGHIJKLMNOPQRSTUVWXYZ, 26 caractères, sans
  espaces). Les caractères hors alphabet (chiffres, ponctuation et lettres
  accentuées comme é, à, ç) restent inchangés.

  La valeur du décalage est saisie par l'utilisateur dans l'interface
  graphique (champ « Décalage de César »). La valeur 0 signifie
  « sélection aléatoire dans la plage 1..25 ».
iso: fr
kategoria: szyfr
kolejnosc: 60
algorytm: cezar

# L'alphabet est chargé depuis dictionaries/fr/podstawy.yaml (clé : alfabet).
# Pour utiliser un alphabet différent, décommenter la ligne suivante :
# alfabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"

# Plage de décalage autorisée dans l'interface (SpinCtrl).
# 26 lettres → ±25 couvre toutes les rotations distinctes.
min_przesuniecie: -25
max_przesuniecie: 25
