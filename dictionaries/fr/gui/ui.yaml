  pobieranie_tresc: "Téléchargement de {nazwa_pliku}…"
  # Zakończenie pobierania i uruchomienie instalatora
  instalacja_tytul: "Téléchargement terminé"
  instalacja_tresc: |-
    Téléchargement terminé. L'installateur démarre.
    L'application va se fermer.
  # Błędy
  blad_pobierania_tytul: "Erreur de téléchargement"
  blad_pobierania_tresc: "Impossible de télécharger la mise à jour :\n{tresc_bledu}"
  blad_uruchomienia_tytul: "Erreur de démarrage de l'installateur"
