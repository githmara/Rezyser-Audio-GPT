    Une nouvelle version est disponible : {nowa_wersja}.

    Cette installation n'utilise pas le pack runtime — le téléchargement de l'installateur n'est pas disponible.
    Visitez la page de version sur GitHub et téléchargez l'archive « Source code » ou clonez le dépôt :

    {url_release}

