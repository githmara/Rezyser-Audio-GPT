    Bloque l'ajout ultérieur de contenu après l'Épilogue.
  btn_rozdzial_label: "✂️ Insérer une coupure (Chapitre {numer_rozdzialu})"
  btn_rozdzial_name: "Bouton Insérer un Chapitre"
