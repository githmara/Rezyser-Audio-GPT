    Sélectionnez un outil dans la barre des boutons ou dans le menu Outils :

      •  Réalisateur     —  Écris scénarios et prose avec l'IA ; gère dynamiquement la Bible du Monde.
      •  Polyglotte      —  Applique des accents marqués aux synthétiseurs locaux (NVDA/Vocalizer) et traduis des textes.
      •  Convertisseur   —  Crée rapidement des fichiers Word professionnels avec titres de niveau 1.
      •  Gestionnaire de Règles —  Explore et crée des règles de dictionnaire sans entrer manuellement dans les fichiers YAML.
