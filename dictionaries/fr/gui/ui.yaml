  dlg_edytuj_tryb_ostrzezenie: "ATTENTION : changer de mode en cours de jeu peut désynchroniser le moteur narratif.\n\nLe mode de jeu détermine la façon dont les tours suivants sont générés — le modèle IA reçoit des instructions différentes en mode libre (le joueur écrit ses propres actions) qu'en modes avec choix (l'IA propose 3 à 5 options à choisir, dans « Moindre Mal » toutes défavorables).\n\nRaison typique d'utilisation de cette échappatoire : l'IA génère obstinément des dilemmes au lieu de terminer l'histoire — passer en mode libre vous permet de décrire vous-même la scène finale.\n\nAprès le changement, le tour suivant utilisera déjà les nouvelles règles. L'état du jeu (personnages, monde, narration jusqu'à présent) reste inchangé."
  dlg_edytuj_tryb_ostrzezenie_name: Champ d'avertissement sur le risque de changement de mode
  dlg_edytuj_tryb_lbl: 'Choisissez un nouveau mode de jeu :'
  dlg_edytuj_tryb_name: Choix d'un nouveau mode de jeu
  dlg_edytuj_tryb_btn_ok: Changer de &mode
  dlg_edytuj_tryb_btn_anuluj: '&Annuler'
  status_tryb_zmieniony: Mode de jeu changé en « {tryb_nazwa} ». Le tour suivant utilisera les nouvelles règles de narration.
  dlg_wybierz_gre_tytul: Charger le jeu d'Histoires
  dlg_wybierz_gre_lbl: 'Jeux disponibles :'
  brak_gier_tytul: Aucun jeu
  brak_gier_tresc: "Il n'y a pas encore de jeux enregistrés dans le dossier runtime/opowiesci/. Commencez un nouveau jeu : entrez un nom dans le champ ci-dessus, choisissez un mode et utilisez le bouton Nouveau jeu."
  btn_otworz_narracje_label: '&Ouvrir le fichier de narration…'
  btn_otworz_narracje_tooltip: "Ouvre le fichier de narration du jeu (opowiesci/<nom>.txt) dans l'éditeur de texte système. Utilisez en cas d'urgence lorsque l'IA ne termine pas l'histoire en mode Choix/Moindre Mal et que vous souhaitez écrire la fin manuellement. ATTENTION : le .txt ne contient que le texte pour le TTS ; l'état du jeu (personnages, emplacement, inventaire) est dans le .game.json et NE sera PAS mis à jour — le prochain tour du LLM peut diverger de la narration modifiée. Une boîte de dialogue de confirmation apparaîtra avant l'ouverture."
  otworz_narracje_ostrzezenie_tytul: Édition du fichier de narration — risque de divergence d'état
  otworz_narracje_ostrzezenie_tresc: "Vous allez ouvrir le fichier de narration (.txt) dans l'éditeur de texte système.\n\nATTENTION : le fichier .txt ne contient que le texte de narration pour le TTS, tandis que l'état du jeu (personnages, emplacement, inventaire, intrigues ouvertes) est dans un fichier séparé .game.json. L'édition du .txt n'actualise pas l'état — le prochain tour du LLM recevra le monde tel qu'il était avant votre édition, ce qui peut entraîner une divergence sémantique (par exemple, vous avez décrit qu'un personnage est mort, mais dans l'état du jeu, il est toujours vivant).\n\nCas typique sûr : ajouter une scène de clôture lorsque l'IA ne veut pas terminer l'histoire (alternative à la porte « Modifier le mode de jeu… » → Libre).\n\nContinuer ?"
  blad_otwarcia_tytul: Impossible d'ouvrir le fichier
  blad_otwarcia_tresc: "La tentative d'ouverture du fichier {sciezka_pliku} a échoué :\n{tresc_bledu}\n\nOuvrez le fichier manuellement depuis l'Explorateur de fichiers."
  plik_narracji_brak_tytul: Fichier de narration manquant
  plik_narracji_brak_tresc: Le fichier de narration du jeu « {nazwa} » n'existe pas sur le disque. Le fichier de narration est créé après le premier tour — envoyez la première action pour que le moteur narratif crée le fichier.
  btn_odswiez_z_dysku_label: "&Actualiser depuis le disque"
  btn_odswiez_z_dysku_tooltip: "Recharge le fichier de narration (opowiesci/<nom>.txt) et synchronise la mémoire interne avec les modifications manuelles — sans réinitialisation complète ni rechargement du jeu. La fin fraîche est injectée dans le contexte du moteur ; le résumé existant des tours précédents reste intact. ATTENTION : l'état du jeu (personnages, emplacement, inventaire) dans le .game.json N'est PAS mis à jour — le prochain tour peut diverger en cas de changement des faits du monde."
  odswiez_z_dysku_tytul: "Narration actualisée depuis le disque"
  odswiez_calosc_tresc: "La narration a été rechargée depuis le disque, le contexte du moteur est synchronisé avec la fin du texte.\n\nATTENTION : l'état du jeu (personnages, emplacement, inventaire, intrigues) dans le .game.json N'a PAS été modifié — si l'édition a changé les faits du monde, le prochain tour peut diverger."
  odswiez_streszczenie_tresc: "Le contexte du moteur a été actualisé avec la fin fraîche du disque. Le résumé des tours précédents est intact, le prochain résumé et le prochain tour ne seront donc pas construits sur des données obsolètes.\n\nATTENTION : l'état du jeu dans le .game.json N'a PAS été modifié — en cas de changement des faits du monde, le prochain tour peut diverger."
  odswiez_zajete_tytul: "Opération en cours"
  odswiez_zajete_tresc: "Un tour ou un résumé est en cours de génération. Attendez la fin avant d'actualiser la narration depuis le disque."
  btn_edytuj_stan_label: Modifier l'état du &jeu…
  btn_edytuj_stan_tooltip: "Ouvre le fichier brut de l'état du jeu (.game.json) pour une édition directe dans une fenêtre avec validation JSON. Pour les avancés : permet de corriger manuellement les personnages, la localisation, l'équipement, les intrigues et les compteurs lorsque l'édition manuelle de la narration ne correspond plus à l'état structurel. ATTENTION : une édition incorrecte peut endommager la sauvegarde — les modifications sont validées en tant que JSON avant l'enregistrement, mais la validité du contenu (pertinence des champs) est de votre responsabilité."
  dlg_edytuj_stan_tytul: Édition de l'état du jeu (.game.json)
  dlg_edytuj_stan_lbl: "État brut du jeu au format JSON. Éditez avec précaution : après l'enregistrement, le jeu sera rechargé à partir de ce fichier. Le contenu doit rester un objet JSON valide — sinon, l'enregistrement sera rejeté."
  dlg_edytuj_stan_name: Champ d'édition de l'état brut du jeu au format JSON
  dlg_edytuj_stan_btn_ok: '&Enregistrer et recharger'
  dlg_edytuj_stan_btn_anuluj: '&Annuler'
  edytuj_stan_blad_json_tytul: JSON invalide
  edytuj_stan_blad_json_tresc: "Le contenu n'est pas un JSON valide, il n'a donc pas été enregistré (le jeu serait endommagé). Corrigez la syntaxe et réessayez.\n\nDétails de l'erreur :\n{tresc_bledu}"
  edytuj_stan_blad_typ_tresc: L'élément principal de l'état du jeu doit être un objet JSON (paire clé-valeur entre accolades), et non une liste ou une valeur simple. Rétablissez la structure de l'objet et réessayez.
  edytuj_stan_zapisano_tytul: État du jeu enregistré
  edytuj_stan_zapisano_tresc: L'état du jeu «{nazwa}» a été enregistré et rechargé depuis le disque. Les personnages, la localisation, l'équipement, les intrigues et les compteurs reflètent maintenant votre édition.
  err_dlugosc: La réponse du modèle a été coupée avant qu'il ne puisse la terminer (limite de longueur dépassée). Raccourcissez le contexte et réessayez.
  odrzucenie_tytul: Action impossible à mener
  odrzucenie_tresc: Le moteur narratif ne peut pas mener cette action — elle pourrait être hors sujet, impossible dans ce monde ou non conforme aux règles de contenu. Le tour n'a pas été enregistré. Reformulez l'action et réessayez.
  btn_zamknij_gre_label: '&Fermer la partie'
  btn_zamknij_gre_tooltip: Ferme la partie en cours et revient à l'écran de création d'une nouvelle partie (déverrouille le choix du mode et le Quick Start). La partie est sauvegardée sur le disque — vous pourrez la recharger ultérieurement. Une confirmation vous sera demandée.
  zamknij_gre_pytanie_tytul: Fermer la partie en cours ?
  zamknij_gre_pytanie: "Fermer la partie en cours et revenir à l'écran de création d'une nouvelle partie ?\n\nL'état de la partie est sauvegardé sur le disque après chaque tour, vous ne perdez donc rien — vous pourrez la recharger plus tard via le bouton « Charger »."
  komenda_odswiez_zablokowana_tytul: Commande verrouillée
  komenda_odswiez_zablokowana_tresc: La commande « {komenda} » est verrouillée par défaut, car le rechargement de la narration depuis le disque ne recalcule pas l'état du jeu (personnages, lieu, équipement) et peut provoquer une dérive sémantique. Pour la déverrouiller, définissez EDYCJA_STANU_GRY_WIDOCZNA = True dans gui_opowiesci.py:72 et générez votre propre package.
  komenda_odswiez_zablokowana_hint: (/odswiez, /refresh — verrouillées ; définissez EDYCJA_STANU_GRY_WIDOCZNA = True dans gui_opowiesci.py:72 pour déverrouiller)
  err_struktura: Le modèle IA a renvoyé plusieurs fois une structure de données incorrecte et il n'a pas été possible de la corriger. Réessayez — si l'erreur persiste, joignez le fichier error_log.txt à votre signalement.
  pamiec_status_offline: "⚠️ Pas de connexion Internet : le compteur de mémoire exact n'est pas disponible, les valeurs affichées sont approximatives (~{procent} % — {tokeny} jetons). Redémarrez l'application une fois la connexion rétablie."
  err_kontekst: L'historique de la partie ne tient pas dans la fenêtre contextuelle du modèle. Terminez cette partie et commencez-en une nouvelle, ou choisissez un modèle avec une fenêtre plus grande — les modèles Claude offrent ici la plus grande marge.
  err_odmowa: Le modèle a refusé d'exécuter cette instruction — son contenu enfreignait peut-être les règles du modèle ou était trop ambigu. Rien n'a été enregistré ; reformulez l'instruction et réessayez.
bot:
  closure:
    Lumi: "Bonjour !\n\nLa neige s'est posée et le correctif est arrivé ! Tout ce que vous avez demandé vient d'atterrir dans la dernière version du Réalisateur Audio GPT.\n\nRécupérez la mise à jour ici : {link}\n\nJe clôture le ticket pour que le froid ne s'engouffre pas. Glaciales salutations !\n— Lumi"
    Vieno: "Salutations.\n\nLes vents du Nord ont porté la nouvelle : votre demande a trouvé sa place dans la nouvelle version. La vision s'est manifestée.\n\nLa dernière version vous attend ici : {link}\n\nJe referme ce cercle — l'affaire a atteint sa fin.\n— Vieno"
    Katla: "Hé !\n\nForgée dans le feu volcanique et encore brûlante ! Votre demande a été résolue dans la dernière version du Réalisateur Audio GPT.\n\nAttrapez-la ici : {link}\n\nJe clôture le ticket — salutations volcaniques !\n— Katla"
  answered:
    Lumi: "Bonjour !\n\nUn message du Centre est parvenu au Nord — une réponse pour vous. Je vous la transmets exactement comme elle a été formulée :\n\n{maintainer_answer}\n\nJe clôture le ticket — la neige s'est posée sur cette affaire. Glaciales salutations !\n— Lumi"
    Vieno: "Salutations.\n\nLes vents du Nord ont porté les mots de réponse du Centre. Je vous les relaye intacts :\n\n{maintainer_answer}\n\nJe referme ce cercle — la question a atteint sa fin.\n— Vieno"
    Katla: "Hé !\n\nUn mot brûlant du Centre est arrivé au Nord — je vous le transmets directement :\n\n{maintainer_answer}\n\nJe clôture le ticket — salutations volcaniques !\n— Katla"
  personal_note_intro: 'Un message supplémentaire du mainteneur pour vous :'
  patch:
    Lumi:
      subject: 'Patch Tiflotecnia Voices — livraison hivernale #{issue_number}'
      body: "Bonjour !\n\nJe me suis frayée un chemin à travers les congères pour vous livrer ceci ! Votre patch est prêt et j'ai clôturé le ticket pour que le froid ne s'engouffre pas.\n{link}\n\nSi une tempête de neige a caché le message dans votre boîte, vérifiez le dossier Spam ou Courrier indésirable.\n\nGlaciales salutations,\nLumi"
    Vieno:
      subject: 'Patch Tiflotecnia Voices — une vision pour la demande #{issue_number}'
      body: "Salutations.\n\nLes Esprits du Nord ont apporté des nouvelles de votre demande. Le rituel s'est achevé et le patch s'est matérialisé ici :\n{link}\n\nSi la vision n'a pas atteint votre boîte, fouillez la brume dans le dossier Spam.\n\nÉcoute le vent,\nVieno"
    Katla:
      subject: 'Patch Tiflotecnia Voices — sorti tout chaud de la forge #{issue_number}'
      body: "Hé !\n\nForgé dans le feu volcanique et encore brûlant ! Je vous envoie le patch et je clôture le ticket.\n{link}\n\nSi la fumée vous a masqué la vue de votre boîte, pensez à vérifier le dossier Spam.\n\nSalutations volcaniques,\nKatla"
    footer: "Vous recevez ce message car votre adresse e-mail a été indiquée dans le GitHub Issue #{issue_number}. Si vous n'êtes pas à l'origine de cette demande, veuillez l'ignorer."
    brak_emaila: Aucune adresse e-mail n'a été trouvée dans le contenu — merci de bien vouloir la compléter.
    pauza: La mise à jour du patch Tiflotecnia Voices est en cours. Je laisse ce ticket ouvert et reviendrai avec un lien à jour dès que j'aurai terminé — vous n'avez rien à faire.
  sami_comment: "Ciao ! 🌞 Sami du Sud a repéré ton signalement et est partie en trombe avec le prompt technique vers le Centre. Le concepteur de l'application s'en occupera sous peu — et lorsque la correction arrivera dans la dernière version, l'une de mes collègues du Nord passera par ici : Lumi, Vieno ou Katla. À presto !\n— Sami"
diag:
  tytul: Règles ignorées
  wstep: "Les fichiers de règles suivants (ou certains de leurs fragments) ont été ignorés par le moteur.\nC'est pourquoi les modes IA, les outils de postproduction ou les modèles\nde départ correspondants n'apparaissent pas dans l'application."
  szczegol: '   Détails techniques : {szczegol}'
  wpis: 📄 {plik}
  stopka: "Comment corriger : dans le Gestionnaire de règles, sélectionnez le fichier dans la liste et ouvrez-le\ndans un éditeur de texte, corrigez l'endroit indiqué et enregistrez. Ensuite, actualisez l'arborescence\ndu Gestionnaire de règles – les règles seront rechargées, sans fermer l'application –\net revenez à l'outil.\nSi vous ne savez pas quoi corriger, ouvrez ce même fichier dans une autre langue et comparez\nles deux, ou restaurez le pack de règles par défaut en réinstallant l'application\n(vos projets et jeux resteront intacts)."
  brak_zastrzezen: Tous les fichiers de règles ont été chargés sans problème.
  brak_zastrzezen_tytul: Règles vérifiées
  powod:
    parse: "Impossible de lire le fichier – syntaxe YAML invalide. Le fichier a été\nentièrement ignoré. Les deux nombres dans les détails indiquent l'emplacement de l'erreur :\nle numéro de ligne et le numéro de caractère sur cette ligne."
    brak_pol: "Il manque au fichier des champs sans lesquels le moteur ne peut pas reconnaître la règle (ils sont listés\ndans les détails). Le fichier a été ignoré."
    kategoria: "Le champ « kategoria » a une valeur inconnue du moteur – impossible de déterminer si le fichier\ndécrit un mode IA ou un outil de postproduction. Le fichier a été ignoré."
    zakres: "Le champ « zakres » a une valeur en dehors de l'ensemble autorisé, et c'est de cette valeur que dépend\nla méthode de traitement du texte (chapitre par chapitre ou en une seule fois).\nL'outil a été ignoré pour éviter qu'il ne fonctionne autrement que prévu."
    sufiks: "Le champ « sufiks_pliku_wyniku » contient des caractères non autorisés dans un nom de fichier,\ndonc le résultat n'aurait nulle part où être enregistré. L'outil a été ignoré."
    pole: "Un champ a une valeur du mauvais type – le plus souvent du texte là où\nle moteur attend un nombre, ou une liste là où il faudrait un ensemble de paires.\nLe fichier a été ignoré."
    duplikat: "Un autre fichier dans le même dossier possède déjà cet identifiant. Le moteur\na chargé cet autre fichier (indiqué dans les détails) et a ignoré celui-ci – deux règles\nayant le même identifiant seraient indiscernables."
    rola: "Le champ « rola » a une valeur inconnue et a été ignoré. Le fichier lui-même fonctionne,\nmais l'outil n'aura pas le comportement associé à ce rôle."
    klucz: "Il manque au fichier une clé requise par le moteur (elle est indiquée\ndans les détails). Cette partie de la recette ne fonctionnera pas tant que la clé\nn'aura pas été remise en place."
    wpis: "Une entrée à l'intérieur du fichier est incomplète (indiquée dans les détails)\net a été ignorée. Les autres entrées de ce fichier fonctionnent normalement."
