    Ouvre golden_key.env et assure-toi que la valeur commence immédiatement après le signe '='.
  el_format: |-
    🚨 Format suspect de la clé ElevenLabs !
    Une clé ElevenLabs commence toujours par sk_ (avec un TIRET BAS, pas sk- comme OpenAI).
    Assure-toi d'avoir collé une clé d'ElevenLabs et non d'une autre plateforme.
  el_zbyt_krotki: |-
    ⚠️ La clé ElevenLabs semble trop courte ({liczba_znakow} caractères détectés, au moins {minimum_znakow} attendus).
    Tu n'as probablement copié qu'une partie de la clé. Génère une nouvelle clé dans le panneau ElevenLabs et colle-la en entier.
  el_ok: |-
    ✅ Clé ElevenLabs détectée et correctement formatée.
    Le pont vers ElevenLabs Studio (post-production audio) est actif dans le panneau du Réalisateur.
  # Sekcja: Narzędzia słownikowe
  heading_narzedzia_slownikowe: "Outils de dictionnaire"
  narzedzia_slownikowe_name: "Description des outils de dictionnaire"
  tools_info: |-
