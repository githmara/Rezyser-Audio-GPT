  err_dlugosc: La réponse du modèle a été coupée avant qu'il ne puisse la terminer (limite de longueur dépassée). Raccourcissez le contexte — par exemple, le Livre du Monde ou l'instruction — et réessayez.
  btn_przeladuj_label: '&Recharger le projet depuis le disque'
  btn_przeladuj_tooltip: "Recharge TOUT le projet depuis le disque après vos modifications manuelles dans le fichier de narration (skrypty/<nom>.txt) — recalcule les compteurs de Chapitres/Actes/Scènes, met à jour le Livre du Monde, le mode et les options de Brainstorming, et synchronise la mémoire de travail. Une courte histoire est chargée en entier ; pour une longue, il vous sera demandé à partir de quel en-tête la mémoire de travail de l'IA doit commencer (le reste est représenté par un Résumé). ATTENTION : cela écrase le contenu des champs avec la version du disque — enregistrez d'abord les modifications non sauvegardées."
  przeladuj_ostrzezenie_tytul: Recharger le projet depuis le disque ?
  przeladuj_ostrzezenie_tresc: "Le rechargement remplacera le contenu actuel (Livre du Monde, Mémoire à Long Terme, narration, compteurs de structure) par la version enregistrée sur le disque. Les modifications non sauvegardées dans les champs seront perdues.\n\nContinuer ?"
  przeladuj_tytul: Projet rechargé depuis le disque
  przeladuj_calosc_tresc: Tout le projet a été rechargé depuis le disque ({liczba_znakow} caractères). Les compteurs de structure, le Livre du Monde, le mode et la mémoire de travail sont synchronisés avec le fichier.
  przeladuj_calosc_skasowano_tresc: Tout le projet a été rechargé depuis le disque ({liczba_znakow} caractères) — tout le texte tient dans la fenêtre de contexte, donc le résumé inutile a été supprimé (le moteur fonctionne maintenant sur l'histoire complète). Les compteurs et le Livre du Monde sont synchronisés avec le fichier.
  marker_dlg_tytul: Point de référence de la mémoire de travail
  marker_dlg_plaski_lbl: L'histoire est trop longue pour être chargée en entier. À partir de quel Chapitre la mémoire de travail de l'IA doit-elle commencer ? (Les événements antérieurs sont représentés par un Résumé. Annuler = dernier fragment de texte.)
  marker_dlg_akt_lbl: L'histoire est trop longue pour être chargée en entier. À partir de quel Acte la mémoire de travail de l'IA doit-elle commencer ? (Annuler = dernier fragment de texte.)
  marker_dlg_scena_lbl: À partir de quelle Scène de cet Acte la mémoire de travail de l'IA doit-elle commencer ?
  marker_dlg_caly_akt: ← tout l'Acte (à partir de l'en-tête de l'acte)
  punkt_odniesienia_tytul: Point de référence de la mémoire de travail
  punkt_odniesienia_snap_tresc: La mémoire de travail de l'IA commence à partir de l'en-tête «{naglowek}» ({liczba_znakow} caractères). Les événements antérieurs sont représentés par le Résumé à Long Terme (resté intact).
  punkt_odniesienia_fallback_tresc: 'Aucun point de référence indiqué — le dernier fragment de narration ({liczba_znakow} caractères) a été ajouté à la mémoire de travail. Le résumé est resté intact. Conseil : insérez des en-têtes Chapitre/Acte/Scène pour pouvoir choisir précisément le début de la mémoire.'
  punkt_odniesienia_za_dluga_tresc: "Le fragment sélectionné «{naglowek}» est si vaste qu'il ne tient pas seul dans la fenêtre de mémoire de travail — une coupe d'urgence a été appliquée aux derniers {liczba_znakow} caractères. Réalisateur, c'est un peu fou : envisagez de diviser les Actes/Chapitres en Scènes plus petites — des sections plus courtes permettront à l'IA de maintenir un contexte cohérent."
  kod_jezyka_blad_tytul: Langue de recette inconnue
  kod_jezyka_blad_tresc: Impossible de déterminer le code langue (ISO) pour la réponse « {jezyk_odpowiedzi} ». Ouvrez la recette dans le Gestionnaire de Règles et définissez le champ code_langue (par exemple, « fi ») pour que les en-têtes de structure et les accents correspondent à la langue du contenu.
  jezyk_naglowkow_ostrzezenie_tytul: Langue des en-têtes et langue de la recette
  jezyk_naglowkow_ostrzezenie_tresc: Le projet chargé a des en-têtes de structure qui semblent être en langue « {wykryty} », et la recette active génère du contenu en langue « {kod} ». Les nouveaux en-têtes seront insérés après « {kod} » — si ce n'est pas intentionnel, ajustez le champ code_langue dans la recette ou choisissez un autre mode.
  pamiec_status_czysta: 🟢 Mémoire claire. Machine prête pour une nouvelle histoire.
  pamiec_status_ok: '🟢 Utilisation de la mémoire : {tokeny} / {maks} jetons. Tampon sécurisé.'
  pamiec_status_ostrzezenie: "⚠️ ÉTAT D'ALERTE : {tokeny} jetons utilisés sur {maks}. La mémoire commence à saturer – il faudra bientôt générer un résumé (bouton Mémoire à long terme dans la section postproduction)."
  pamiec_status_alarm: "🚨 SURCHARGE CRITIQUE : {tokeny} jetons utilisés sur {maks}. Après le prochain envoi réussi, l'application enregistrera automatiquement la Mémoire à long terme ; pour libérer la mémoire de travail, rechargez ensuite le projet depuis le disque."
  tytuly_postep: 'Titres : {naglowek} ({step}/{total})…'
  tytuly_blad_brak_struktury: Aucun tag de structure trouvé (Prologue / Chapitre N / Épilogue) dans le fichier. Insérez des coupures de chapitres avant de donner des titres.
  kod_jezyka_rozjazd_tytul: Le code de langue ne correspond pas au contenu
  kod_jezyka_rozjazd_tresc: "Le code de langue « {kod_wpisany} » a été saisi dans la recette, mais la langue de réponse est « {jezyk_odpowiedzi} » — ce qui correspond au code « {kod_wykryty} ». Le seul « jezyk_odpowiedzi » NE suffit pas : c'est le code ISO qui contrôle les en-têtes de structure (Prologue/Acte/Scène), le choix des accents et le pont ElevenLabs. Le code « {kod_wykryty} » a été utilisé. Si c'est une erreur, corrigez le champ kod_jezyka dans le Gestionnaire de Règles."
  kod_jezyka_edu_tytul: Impossible de déterminer le code de langue
  kod_jezyka_edu_naglowek: 'Code ISO de la langue du contenu — action requise :'
  kod_jezyka_edu_tresc: "Impossible de déterminer automatiquement le code ISO 639-1 pour la langue de réponse « {jezyk_odpowiedzi} » (pas de connexion à l'API ou réponse ambiguë). Ce code à deux lettres est nécessaire : il contrôle les en-têtes de structure (Prologue/Acte/Scène), le choix des accents et la langue du projet dans ElevenLabs. La seule description « jezyk_odpowiedzi » ne suffit pas. Ouvrez la recette dans le Gestionnaire de Règles et entrez le code correct dans le champ kod_jezyka (par exemple, « fi » pour le finnois, « de » pour l'allemand)."
  kod_jezyka_edu_prompt: "Si vous ne connaissez pas le code, copiez la question ci-dessous et collez-la dans n'importe quel chatbot (par exemple, ChatGPT) :\n\n« Donnez le code à deux lettres ISO 639-1 pour la langue décrite comme : {jezyk_odpowiedzi}. Répondez uniquement avec le code. »"
  kod_jezyka_edu_name: Explication du code de langue et invite pour le chatbot
  ostrzezenie_urwane_tytul: Le fragment a peut-être été tronqué
  ostrzezenie_urwane_tresc: La réponse du modèle a atteint la limite de longueur et s'est interrompue en milieu de phrase. La tentative automatique de compléter la dernière phrase a échoué. Le fragment a été enregistré tel quel — vérifiez sa fin et, si nécessaire, ajoutez manuellement une conclusion ou envoyez une courte instruction de continuation.
  err_struktura: Le modèle IA a renvoyé plusieurs fois une structure de données incorrecte et il n'a pas été possible de la corriger. Réessayez ou simplifiez l'instruction — si l'erreur persiste, joignez le fichier error_log.txt à votre signalement.
  pamiec_status_offline: "⚠️ Pas de connexion Internet : le compteur de mémoire exact n'est pas disponible, les valeurs affichées sont approximatives (~{tokeny} / {maks} jetons). Redémarrez l'application une fois la connexion rétablie."
  err_timeout: Le délai d'attente de la réponse du modèle a été dépassé. Vérifiez votre connexion Internet et réessayez.
  postprod_postep_generowanie: 'Post-production : génération du résultat…'
  postprod_postep_gotowe: Post-production terminée.
  postprod_pusta_tresc: Le modèle a renvoyé une réponse vide. Veuillez réessayer.
  postprod_ucieta_tresc: Le résultat de la post-production a atteint la limite de longueur et sa fin a peut-être été tronquée. Le résultat est disponible — vérifiez la fin, et si elle est coupée, relancez l'outil ou augmentez la valeur `max_tokens_wyjscia` dans le fichier YAML de l'outil.
  # Titre commun aux avertissements de troncature ET aux remarques du validateur
  # de la fiche (v18.14), donc neutre — le corps du message dit quoi vérifier.
  postprod_ostrzezenie_tytul: "Le résultat demande une vérification"
  postprod_nadpisac_tytul: Le fichier de résultat existe déjà
  postprod_nadpisac_tresc: Le fichier {plik} existe déjà dans le dossier skrypty. Voulez-vous l'écraser avec le nouveau résultat ?
  postprod_dlg_lbl: "Résultat de l'outil — copiez (Ctrl+A, Ctrl+C) ou fermez :"
  postprod_dlg_zapisano: 'Le résultat a été enregistré dans le fichier {plik} (dossier skrypty). Aperçu ci-dessous :'
  postprod_dlg_name: Champ du résultat de post-production
  err_kontekst: Le contenu envoyé au modèle ne tient pas dans sa fenêtre contextuelle. Enregistrez la Mémoire à Long Terme (le résumé réduit le contexte des appels suivants), divisez le projet en fichiers plus petits, ou choisissez un modèle avec une fenêtre plus grande — les modèles Claude offrent ici la plus grande marge.
  postprod_kontekst_tytul: Projet volumineux — vérifiez la fenêtre du modèle
  postprod_kontekst_tresc: "Le contenu destiné à l'outil compte environ {tokeny} jetons et dépasse {limit} jetons, soit la fenêtre contextuelle utilisée par l'application pour mesurer l'occupation de la mémoire.\n\nLes modèles Claude ont une fenêtre bien plus grande que ce seuil, donc l'appel devrait probablement réussir. Cependant, si vous utilisez votre propre fournisseur d'IA avec une fenêtre plus petite, le modèle rejettera la requête — et vous paierez quand même pour la tentative.\n\nVoulez-vous lancer l'outil malgré tout ?"
  pamiec_auto_start: Mémoire du modèle presque pleine — enregistrement de la Mémoire à Long Terme…
  pamiec_auto_zapisana_tytul: Mémoire à Long Terme enregistrée automatiquement
  pamiec_auto_zapisana_tresc: "La mémoire du modèle a dépassé le seuil d'alerte, l'application a donc préparé elle-même un résumé du projet {nazwa_projektu} et l'a enregistré sous {plik}.\n\nLe résumé apparaît dans le champ « Mémoire à Long Terme » — vous pouvez librement le corriger et l'enregistrer à nouveau.\n\nL'enregistrement en lui-même ne réduit pas encore l'occupation de la mémoire : l'indicateur ne baissera qu'après le rechargement du projet depuis le disque, car l'application remplacera alors tout l'historique par le résumé plus la fin de la narration. D'ici là, l'automatisme ne se répétera plus — vous pourrez demander un nouveau résumé via le bouton de la section postproduction."
