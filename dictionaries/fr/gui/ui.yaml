home:
  panel_name: "Panneau de démarrage — Page d'accueil"
  welcome_text: |-
    Voici votre studio d'enregistrement intégré.
    Sélectionnez un outil dans la barre des boutons ou dans le menu Outils :

      •  Réalisateur     —  Écris scénarios et prose avec l'IA ; gère dynamiquement la Bible du Monde.
      •  Polyglotte      —  Applique des accents marqués aux synthétiseurs locaux (NVDA/Vocalizer) et traduis des textes.
      •  Convertisseur   —  Crée rapidement des fichiers Word professionnels avec titres de niveau 1.
      •  Gestionnaire de Règles —  Explore et crée des règles de dictionnaire sans entrer manuellement dans les fichiers YAML.
  heading_system_check: "Vérification du Système"
  checking: "Vérification de la configuration…"
  # Błędy walidacji golden_key.env
  err_brak_pliku: |-
    🚨 Fichier de configuration d'environnement manquant !

    Premier démarrage du programme détecté. Les modules sont bloqués pour des raisons de sécurité.
    Pour débloquer tous les outils, cliquez sur le bouton ci-dessous — le programme générera automatiquement le fichier golden_key.env et l'ouvrira dans l'éditeur de texte par défaut.
  err_odczyt: "🚨 Impossible de lire le fichier golden_key.env :\n{tresc_bledu}"
  err_struktura: |-
    🚨 Erreur dans la structure du fichier !
    Le paramètre obligatoire OPENAI_API_KEY= est manquant.
    Vous avez probablement supprimé le signe égal ou le nom de la variable.
    Supprimez le fichier, regénérez-le et collez la clé avec attention.
  err_tekst_zastepczy: |-
    ⚠️ Clé non saisie !
    Le fichier golden_key.env contient encore le texte de remplacement.
    Ouvrez le fichier dans l'éditeur de texte, supprimez le texte de remplacement et collez votre véritable clé API.
  err_cudzyslowy: |-
    🚨 Guillemets superflus autour de la clé !
    La clé API a été collée entre guillemets (par ex. "sk-…").
    Ouvrez le fichier dans l'éditeur de texte et supprimez les guillemets —
    la clé doit être saisie directement après le signe '=', sans caractères supplémentaires.
  err_niedozwolone_znaki: |-
    🚨 Caractères non autorisés autour de la clé !
    Un espace ou un autre caractère invisible a été détecté avant ou après la clé API.
    Ouvrez le fichier dans l'éditeur de texte et assurez-vous que la valeur commence
    immédiatement après le signe '=', sans espaces.
  err_format: |-
    🚨 Format de clé suspect !
    Une clé OpenAI correcte commence toujours par les caractères sk- (par ex. sk-proj-…).
    Assurez-vous d'avoir copié la chaîne correcte et qu'il n'y a pas d'espaces avant elle.
  err_zbyt_krotki: |-
    ⚠️ La clé semble trop courte ({liczba_znakow} caractères détectés, au moins {minimum_znakow} attendus).
    Vous n'avez probablement copié qu'une partie de la clé.

    Si vous avez déjà fermé la fenêtre avec la clé sur platform.openai.com,
    vous devez retourner à votre compte, utiliser l'option « Revoke secret key » pour cette
    clé tronquée et en générer une nouvelle. N'oubliez pas de copier la clé entière
    avant de cliquer sur « Done » la prochaine fois.
  ok_klucz_wykryty: |-
    ✅ Clé API (golden_key.env) détectée et correctement formatée.
    Tous les modules sont prêts à l'emploi.
