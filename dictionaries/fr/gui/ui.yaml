poliglota:
  panel_name: "Panneau Polyglotte IA"
  heading: "🌍  Polyglotte IA — Studio de Traduction Hybride"
  description_name: "Description du module Polyglotte"
  tool_description: |-
    Le module Polyglotte sert à appliquer des accents phonétiques marqués aux synthétiseurs vocaux locaux (NVDA/Vocalizer/eSpeak), à des jeux de mots en Mode Chiffrant et à traduire des textes via l'IA (OpenAI gpt-4o).

    Prend en charge les fichiers : .txt, .html, .htm, .docx.
    Le résultat est sauvegardé dans le même répertoire que le fichier source.
