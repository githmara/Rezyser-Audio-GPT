# UPDATER – auto-aktualizacja (core_updater.py + wątek tła w main.py)
# -----------------------------------------------------------------------------
  typ:
    akcent:
      etykieta: "Accent phonétique (cross-language, par exemple suédois, finnois)"
      opis: |-
        Fichier dans <jezyk>/akcenty/<id>.yaml avec `kategoria: akcent`. Le texte du paquet de base (jezyk_bazowy) est translittéré selon la prononciation du synthétiseur cible (iso != jezyk_bazowy). Le gestionnaire crée un modèle + prompt pour l'agent AI, qui concevra la liste `zamiany:`.
    akcent_oczyszczenie:
      etykieta: "Accent nettoyant (préprocesseur, sans phonétique)"
      opis: |-
        Fichier dans <jezyk>/akcenty/<id>.yaml avec `kategoria: oczyszczenie`. Nettoie le texte pour le TTS (supprime le charabia, normalise les nombres) SANS changer la phonétique. iso == jezyk_bazowy. Le gestionnaire crée un modèle (patron prêt) + prompt pour traduire l'étiquette/la description en natif.
    akcent_naprawiacz:
      etykieta: "Réparateur de balises (injecte ISO dans HTML/DOCX)"
      opis: |-
        Fichier dans <jezyk>/akcenty/<id>.yaml avec `kategoria: naprawiacz`. NE modifie PAS le contenu — injecte le code ISO de la langue dans les fichiers de sortie (<html lang>, <w:lang>). iso vide (le code est fourni par l'utilisateur dans l'interface graphique). Le gestionnaire crée un modèle + prompt pour traduire l'étiquette/la description en natif.
    szyfr_zamiany:
      etykieta: 'Nouveau chiffre de type « substitutions pures »'
      opis: |-
        Fichier dans <jezyk>/szyfry/. Le gestionnaire crée un modèle + prompt pour l'AI, qui traduira les étiquettes/commentaires dans la langue native du paquet et générera une liste de paires wzor→zamiana.
    tryb_rezysera:
      etykieta: "Nouveau mode Réalisateur (mode créatif)"
      opis: |-
        Fichier dans <jezyk>/rezyser/tryb_*.yaml. Modèle basé sur le mode Livre audio + prompt pour l'AI traduisant prompt_systemowy, przypomnienie_uzytkownika et slowa_wyzwalajace dans la langue native du paquet de base.
    tryb_opowiesci:
      etykieta: "Nouveau mode Récit (NÉCESSITE UN DÉVELOPPEUR)"
      opis: |-
        Mode de jeu interactif (Histoire). Contrairement aux modes Réalisateur, il n'est PAS axé sur les données : le fichier YAML seul est un code mort — le moteur reconnaît les modes par des constantes numériques et des mappages en Python. Le Manager NE crée PAS de fichier ; il donne seulement une invite pour l'IA/développeur avec une liste complète des points d'ancrage dans le code (constante int, deux mappages, RadioBox, modèle par mode).
    postprodukcja:
      etykieta: "Nouvelle postproduction (itération par chapitres)"
      opis: |-
        Fichier dans <jezyk>/rezyser/postprod_*.yaml. Modèle avec des champs pour le prompt, regex et paramètres d'itération + prompt pour l'AI générant un prompt_systemowy natif et regex_podzial_rozdzialow.
    jezyk_bazowy:
      etykieta: "Nouvelle langue de base (par exemple en, de, fr)"
      opis: |-
        Crée un dossier <jezyk>/ avec podstawy.yaml et les sous-dossiers akcenty/, szyfry/, rezyser/, gui/. Les données phonétiques sont générées par l'AI à partir du prompt ; traduction de l'interface utilisateur – buduj_wielojezyczne_ui.py ; les modes Réalisateur sont copiés de pl/rezyser/ (≥1 fichier tryb_*.yaml requis pour que le moteur considère la langue comme complète).
    szyfr_algorytm:
      etykieta: "Nouveau chiffre algorithmique (NÉCESSITE UN PROGRAMMEUR)"
      opis: |-
        Les algorithmes (par exemple inversion, typoglycémie) nécessitent des fonctions dans core_poliglota.py. Le gestionnaire fournit uniquement un prompt pour l'AI avec la description de la tâche.

