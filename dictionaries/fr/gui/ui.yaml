# -----------------------------------------------------------------------------
# REZYSER – panel modułu Reżyser (gui_rezyser.py)
# -----------------------------------------------------------------------------
rezyser:
  panel_name: "Panneau Réalisateur Audio GPT"
  heading: "🎬  Réalisateur Audio GPT — Studio Créatif Hybride"
  description_name: "Description du module Réalisateur Audio GPT"
  tool_description: |-
    Réalisateur Audio GPT est un studio créatif hybride.

    Mode Brainstorming  — planifie l'intrigue, génère 3 options (SANS sauvegarde fichier).
    Mode Scénario       — écris un scénario audio brut avec balises [SFX] et [Personnage : émotion] (SAUVEGARDE FICHIER).
    Mode Livre audio    — génère une prose littéraire dense et classique (SAUVEGARDE FICHIER).

    Les projets sont enregistrés dans le sous-dossier 'skrypty/' à côté du programme.
    Indique le nom du projet SANS extension (par ex. chroniques_arkonia).
    Pour changer de projet, il faut d'abord effacer la mémoire actuelle.
  prompt_architekta_content: |-
    Tu es un excellent architecte de mondes (Worldbuilder) et conseiller littéraire. J'ai une idée vague d'intrigue : [INSÈRE ICI TON IDÉE]. Ta mission est de la développer en une « Bible du Monde » professionnelle.
    Adapte le ton et les règles à mon idée. Évite les raccourcis de conte de fées et les clichés de l'IA.

    RÈGLES DE FORMATAGE (CRITIQUES) :
    Tu dois renvoyer ta réponse en deux parties séparées :

    PARTIE 1 : BIBLE DU MONDE
    Cette partie doit être strictement enfermée dans UN bloc de code Markdown (utilise les marqueurs ```markdown au début et ``` à la fin). À l'intérieur du bloc de code, applique ces règles :
    1. Commence par une émoji de livre ouvert et un titre de travail, par ex. 📖 Bible du Monde : [Titre].
    2. Utilise un seul dièse (#) pour les sections principales (par ex. # Règles du Monde, # Personnages).
    3. Utilise un double dièse (##) pour les sous-sections.
    4. Utilise des tirets (-) pour créer des listes lisibles.
    5. Utilise des doubles astérisques (**texte**) pour mettre en évidence les règles absolues et inviolables (par ex. **Le héros NE ment JAMAIS**).
    6. Décris la psychologie des personnages, leurs principaux défauts et leurs motivations. Pour les personnages parlant une langue étrangère, ajoute l'information sur l'accent directement à la balise, par ex. `[Speaker 1 : Nom] - bégaie et a un accent français`. **Astuce technique :** L'utilisation du mot-clé `accent` est absolument requise, car c'est sur lui qu'un script externe de l'application détecte automatiquement et applique les bonnes règles phonétiques aux dialogues du personnage.

    PARTIE 2 : RECOMMANDATION DE MODE
    Cette partie doit être placée HORS du bloc de code, comme texte normal en dessous. Conseille-moi lequel des modes de mon application sera le meilleur pour réaliser cette idée : 🎬 Mode Scénario Brut (pièce radiophonique, SFX, phonétique), ou 📖 Mode Livre Audio Traditionnel (prose littéraire classique).

  # Pasek pliku
  lbl_nazwa_pliku: "Nom du fichier de projet (sans extension, par ex. chroniques_arkonia) :"
  txt_nazwa_pliku_name: "Champ nom du fichier de projet"
  txt_nazwa_pliku_hint: "par ex. chroniques_arkonia"
  txt_nazwa_pliku_tooltip: |-
    Saisissez le nom du projet SANS extension.
    Le fichier de l'histoire est sauvegardé sous : skrypty/<nom>.txt
    Champ verrouillé lorsque la mémoire est occupée.
  btn_wczytaj_label: "Charger l'histoire"
  btn_wczytaj_tooltip: |-
    Charge un fichier de projet existant (skrypty/<nom>.txt) en mémoire.
    Actif uniquement quand la mémoire est vide et qu'un nom est fourni.
  btn_wyczysc_biezaca_label: "Effacer la courante (laisser le Résumé)"
  btn_wyczysc_biezaca_tooltip: |-
    Efface uniquement l'histoire courante de la mémoire.
    Le Résumé (Mémoire à Long Terme) et la Bible du Monde sont conservés.
    À utiliser pour continuer un livre long après avoir généré le résumé.
  btn_hard_reset_label: "Fermer le Projet (Réinitialisation Complète)"
  btn_hard_reset_tooltip: |-
    Effacement COMPLET du projet : histoire, résumé, Bible du Monde.
    Remet à zéro tous les compteurs et déverrouille le champ nom de fichier.
    À utiliser quand vous changez de projet ou commencez une histoire totalement nouvelle.
  # Sidebar
  sidebar_heading: "📖 Barre latérale du projet"
  lbl_ksiega_swiata: "Bible du Monde — Règles et Personnages :"
  txt_ksiega_name: "Champ Bible du Monde — règles et personnages"
  txt_ksiega_hint: |-
    Saisissez les règles du monde, la description des personnages et leurs accents phonétiques…
    Par ex. [Geralt : accent islandais]
    Le contenu est inclus dans chaque requête IA.
  txt_ksiega_tooltip: |-
    Contexte toujours inclus pour l'IA : règles du monde, personnages, accents phonétiques.
    La sauvegarde sur disque nécessite de fournir le nom du fichier de projet.
  btn_zapisz_ksiege_label: "💾 Sauvegarder la Bible de manière permanente"
  btn_zapisz_ksiege_tooltip: |-
    Sauvegarde la Bible du Monde dans le fichier : skrypty/<nom>.md
    Nécessite de fournir le nom du fichier de projet.
  btn_prompt_architekta_label: "📖 Prompt de l'Architecte pour l'IA…"
  btn_prompt_architekta_name: "Bouton Afficher le Prompt de l'Architecte pour chatbot externe"
  btn_prompt_architekta_tooltip: |-
    Ouvre une fenêtre avec un prompt prêt pour un chatbot externe (ChatGPT, Claude).
    Colle ton idée d'intrigue et l'IA générera une Bible du Monde professionnelle formatée en Markdown — à coller dans le champ « Bible du Monde » ci-dessus.
  lbl_pamiec_dlugotrwala: "🧠 Mémoire à Long Terme (Résumé) :"
  txt_pamiec_name: "Champ Mémoire à Long Terme — résumé des événements"
  txt_pamiec_hint: |-
    L'IA y enregistrera le résumé quand la mémoire sera pleine.
    Vous pouvez aussi le modifier manuellement.
  txt_pamiec_tooltip: |-
    Résumé des événements précédents inclus dans chaque requête IA.
    Permet de continuer l'histoire sans les limitations de la fenêtre contextuelle du modèle.
  btn_zapisz_pamiec_label: "💾 Sauvegarder le Résumé"
  btn_zapisz_pamiec_tooltip: |-
    Sauvegarde le résumé dans le fichier : skrypty/<nom>_resume.txt
    Après la sauvegarde, vous pouvez effacer la mémoire courante en toute sécurité.
  # Obszar roboczy
  main_heading: "🎬 Espace de Travail"
  rb_tryb_label: "Mode de travail :"
  rb_tryb_name: "Sélection du mode de travail IA"
  rb_tryb_tooltip: |-
    Brainstorming — planification sans sauvegarde fichier.
    Scénario      — scénario audio brut (sauvegardé dans le fichier).
    Livre audio   — prose littéraire traditionnelle (sauvegardée dans le fichier).
  # 13.2: komunikaty fallbacku reżysera (gdy brak reguł dla języka UI ani EN)
  brak_trybow_dla_jezyka: |-
    Pour la langue « {jezyk} », aucun mode réalisateur IA ni fallback
    anglais (dictionaries/en/rezyser/) n'a été trouvé. Ajoutez un fichier YAML avec le mode
    dans le dossier de règles de la langue ou restaurez le pack anglais par défaut.
  brak_trybow_tytul: "Aucun mode réalisateur"
  placeholder_brak_trybow: "(aucun mode disponible)"
  # Panel struktury
  struktura_heading: "✂️ Gestion de la Structure"
  btn_prolog_label: "📜 Insérer le Prologue"
  btn_prolog_name: "Bouton Insérer le Prologue"
  btn_prolog_tooltip: |-
    Insère l'en-tête « Prologue » au début de l'histoire.
    Possible uniquement quand l'histoire est vide. Nécessite le nom du projet.
  btn_epilog_label: "🏁 Insérer l'Épilogue"
  btn_epilog_name: "Bouton Insérer l'Épilogue"
  btn_epilog_tooltip: |-
