    Pour des tâches plus complexes (nouvelle langue, accent de phonétique étrangère, chiffrement algorithmique), le Gestionnaire générera un prompt pour le chatbot IA — il suffit de le coller dans ChatGPT ou Claude et de sauvegarder la réponse.
