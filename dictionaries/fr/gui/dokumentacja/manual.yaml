id: manual
tresc:
  naglowek: |
    Manuel du Réalisateur Audio AI - Guide complet (Version {app.wersja})

    Bienvenue dans le Studio d'Enregistrement Hybride ! Cet ensemble d'outils permet l'écriture, la planification, le formatage et la traduction automatiques de scripts pour pièces radiophoniques et livres audio. Il est optimisé pour fonctionner avec des synthétiseurs vocaux professionnels ainsi que des moteurs de lecteurs d'écran locaux (NVDA).

    L'ensemble se compose du studio principal (Réalisation), de l'outil de traduction et d'accents (Polyglotte), de l'outil de construction de structure de fichier (Architecte de Livres Audio), du Gestionnaire de Règles (à partir de la version 13.0 — sans Python, vous pouvez ajouter un nouvel accent, un chiffre ou un mode créatif, voir ÉTAPE 7b ci-dessous) et — à partir de la version 15.0 — du module Récits (fiction interactive à la deuxième personne générée par IA, lue par TTS ou lecteur d'écran, décrite dans le manuel séparé recits.fr.txt). Les cinq outils sont disponibles dans une seule fenêtre de programme, commutable par des boutons sur la barre ou par des raccourcis clavier Ctrl+1..Ctrl+5.
  krok_1_pierwsze_uruchomienie: |
    ÉTAPE 1 : Première exécution (Cross-Platform)

    Téléchargez le dernier installateur depuis l'onglet Releases sur GitHub (fichier Rezyser_Audio_v<numéro>_Installer.exe) et lancez-le par un double-clic. L'installateur proposera un emplacement d'installation par défaut — le dossier Programs dans le répertoire local de votre compte — et ne nécessite pas de droits administrateur. Vous pouvez choisir votre propre chemin en cliquant sur "Parcourir" ; dans ce cas, RETENEZ-LE (il sera utile pour les mises à jour — voir "Mises à jour automatiques" ci-dessous). Après l'installation, lancez le programme via l'icône sur le bureau ou depuis le Menu Démarrer. Après un moment, la fenêtre principale du programme apparaîtra — {app.nazwa}. Depuis la version 17.0, l'application est figée en tant que fichier exécutable natif en mode fenêtré, donc aucune fenêtre de terminal ne clignote plus, et elle se lance plus rapidement qu'auparavant. Pas de navigateur, pas de serveur en arrière-plan. Lorsque vous avez terminé votre travail, fermez simplement la fenêtre du programme.

    L'application entière, y compris le moteur Python, les projets et la clé API, vit dans un seul dossier sous le chemin d'installation — tout le dossier peut être déplacé sur une clé USB, dans le cloud ou sur un autre ordinateur (instructions détaillées dans la section "Transfert de projets et de clé API" ci-dessous).

    Important : Le dossier runtime/ à l'intérieur du dossier d'installation est le bundle PyInstaller (depuis la version 17.0) — il contient un interpréteur Python isolé et des bibliothèques, prêtes à l'emploi sans installation système séparée ; il sert également de conteneur pour les métadonnées cachées des projets. Si vous clonez le dépôt (chemin développeur), ce dossier n'existe pas et ne devrait pas exister — vous utilisez alors un environnement virtuel venv décrit dans la section pour développeurs ci-dessous.

    --- Pour les développeurs (Windows — dépôt Git) ---

    1. Clonez le dépôt sur votre disque.
    2. Exécutez le fichier setup_dev.bat. Le script créera automatiquement un environnement virtuel Python (venv) et installera toutes les dépendances requises depuis le fichier requirements.txt.
    3. Lancez l'application avec la commande python main.py ou via le fichier run_dev.bat — le script détectera automatiquement le dossier venv et lancera le programme.

    --- Pour les développeurs et utilisateurs ordinaires (macOS / Linux) ---

    1. Clonez le dépôt sur votre disque.
    2. Ouvrez un terminal dans le dossier du projet et accordez aux scripts les droits d'exécution : chmod +x *.sh
    3. Exécutez le script de configuration : ./setup_dev.sh — le script créera un environnement venv et installera les dépendances.
    4. Lancez l'application : python main.py ou ./run.sh

    Ce que vous verrez au démarrage : Après le lancement du programme, une fenêtre avec l'écran de démarrage s'ouvre. Vous y trouverez une brève description des outils disponibles ainsi qu'une section "{home.heading_system_check}". Si la clé API n'est pas encore configurée, un message rouge vous informera que les modules basés sur l'IA (Réalisation, Traducteur) ne fonctionneront pas — les fonctionnalités locales gratuites (accents, Architecte) sont cependant actives immédiatement. La configuration de la clé est décrite dans l'étape suivante.

    Mises à jour automatiques

    L'application vérifie au démarrage si une nouvelle version est disponible sur GitHub — la vérification se fait en arrière-plan et ne bloque pas l'interface.

    Si vous avez installé le programme via le fichier installateur (.exe) : lorsqu'une nouvelle version est détectée, une fenêtre s'affiche pour vous demander si vous souhaitez la télécharger. Après confirmation, une barre de progression s'affiche, et lorsque le téléchargement est terminé, l'application se ferme automatiquement et le nouvel installateur se lance automatiquement. IMPORTANT : dans la fenêtre du nouvel installateur, assurez-vous que le chemin d'installation proposé est LE MÊME que lors de la première installation (généralement visible dans le champ "Dossier de destination"). Si vous acceptez la proposition par défaut alors que vous aviez initialement choisi un autre emplacement en cliquant sur "Parcourir", vous obtiendrez une DEUXIÈME installation vide sans vos projets et votre clé API — la première reste toujours à l'ancien emplacement, mais le raccourci sur le bureau et dans le Menu Démarrer sera remplacé par le nouveau. Si vous acceptez le même chemin qu'initialement, l'installateur écrase les fichiers du moteur de l'application et tout le package de règles (dossier dictionaries/) — vos projets (dossiers skrypty/, opowiesci/) et la clé API (golden_key.env) restent intacts. IMPORTANT : si vous avez édité des fichiers existants dans le package via le Gestionnaire de Règles (par exemple, des modifications d'accent dans `dictionaries/pl/akcenty/wloski.yaml`), ces éditions SERONT ÉCRASÉES lors de la mise à jour — avant de confirmer la mise à jour, faites une sauvegarde du dossier `dictionaries/` selon la procédure de la section "Transfert de projets et de clé API" ci-dessous (il suffit de copier le dossier `dictionaries/` sur une clé USB), puis après la mise à jour, remettez-le en écrasant les fichiers plus récents. Les nouvelles règles que vous avez créées à partir de zéro et qui ne sont pas dans le package (par exemple, une langue de base supplémentaire ou un chiffre personnel) restent intactes automatiquement — l'installateur ne supprime pas les fichiers en dehors du package. Depuis la version 15.2.8, le dialogue proposant la mise à jour affiche cet avertissement directement dans le texte et contient un bouton "Ouvrir le dossier dictionaries", qui ouvre l'Explorateur d'un simple clic au bon endroit — il suffit de le presser avant de confirmer la mise à jour pour faire facilement une sauvegarde, puis de revenir au dialogue et de cliquer sur "Télécharger et installer".

    Si vous ne vous souvenez pas de votre chemin d'installation, il existe deux moyens rapides de le récupérer. Windows 11 : dans le menu contextuel du raccourci sur le bureau, sélectionnez "Ouvrir l'emplacement du fichier" (si l'option n'est pas visible dans le nouveau menu contextuel simplifié, sélectionnez d'abord "Afficher plus d'options" ou appuyez deux fois sur Shift+F10 pour ouvrir directement le menu complet), remontez d'un niveau avec la touche Backspace, sélectionnez le dossier de l'application et appuyez sur Ctrl+Shift+C (ou choisissez "Copier en tant que chemin" dans le menu contextuel) — le chemin complet ira dans le presse-papiers entre guillemets (en collant dans l'installateur, n'oubliez pas de supprimer les guillemets eux-mêmes). Versions antérieures de Windows (7/8/10) : cliquez avec le bouton droit de la souris sur le raccourci et sélectionnez "Propriétés" ; dans l'onglet "Raccourci", dans le champ "Cible", vous verrez le chemin complet vers le fichier exécutable (`.exe` dans la version 15.2.5+ ou `run.bat` dans les versions antérieures) — copiez-le et supprimez le nom du fichier final, il ne restera que le chemin du dossier d'installation.

    Attention lors de la mise à jour à partir de versions plus anciennes (v15.2.4 ou antérieure, lorsque l'application était lancée via `run.bat` à partir du package Portable ZIP) : le raccourci existant sur le bureau peut pointer vers `run.bat` dans l'ancien emplacement, qui n'existe plus après la mise à jour vers v15.2.5+ — les versions 15.2.5+ utilisent un fichier `.exe` autonome créé par l'installateur. Si le raccourci cesse de fonctionner après la mise à jour, supprimez-le manuellement et laissez l'installateur en créer un nouveau lors de la réinstallation.

    Si vous utilisez le dépôt Git (développeurs et utilisateurs macOS/Linux) : au lieu de la proposition de téléchargement, vous verrez une information sur la nouvelle version avec un lien direct vers la page de publication sur GitHub. Téléchargez le code source à partir de là ou mettez à jour le dépôt avec la commande git pull.

    Transfert de projets et de clé API (migration)

    Si vous souhaitez transférer vos projets, votre clé API et vos paramètres locaux sur un autre ordinateur (ou restaurer le tout après avoir réinstallé Windows), il n'est pas nécessaire de copier manuellement des fichiers individuels — tout le dossier de l'application est autonome.

    1. Assurez-vous que l'application est COMPLÈTEMENT fermée. Si vous voyez l'icône du programme dans la barre système (à côté de l'horloge, sur le côté droit de la barre des tâches), cliquez dessus avec le bouton droit de la souris et sélectionnez "Fermer". Les fichiers ouverts bloquent la copie.
    2. Trouvez le raccourci {app.nazwa} sur le bureau. Cliquez dessus avec le bouton droit de la souris (ou avec la touche Application ou Shift+F10 lors de la navigation NVDA) et sélectionnez l'option "Ouvrir l'emplacement du fichier". ATTENTION sous Windows 11 : dans le nouveau menu contextuel simplifié, cette option peut être cachée — sélectionnez d'abord "Afficher plus d'options" (ou appuyez deux fois sur Shift+F10 pour ouvrir directement le menu complet avec l'option).
    3. Une fenêtre de l'Explorateur Windows s'ouvrira dans le dossier d'installation du programme. Appuyez sur la touche Backspace (le moyen le plus simple, fonctionne toujours) ou cliquez sur la flèche "Vers le haut" dans la barre d'outils pour monter d'un niveau — vous y verrez le dossier complet de l'application. Attention : le raccourci Alt+Flèche vers le haut ne fonctionne que lorsque le focus est sur la liste des fichiers — si l'Explorateur s'est ouvert avec le focus sur la barre d'adresse (typique), Alt+Flèche vers le haut ne fera rien, utilisez alors Backspace.
    4. Copiez tout ce dossier sur une clé USB, un disque cloud (OneDrive, Google Drive, Dropbox) ou un disque externe. Le dossier contient tout ce qui est nécessaire pour restaurer l'état de travail :
       - Vos projets (dossier skrypty/ — fichiers .txt de narration, .md Livre du Monde, _résumé.txt ; dossier opowiesci/ — jeux interactifs).
       - La clé API (fichier golden_key.env dans le dossier principal de l'application).
       - Vos propres règles phonétiques, accents, chiffres, si vous avez édité quelque chose dans le Gestionnaire de Règles (dossier dictionaries/<kod>/, par exemple dictionaries/pl/akcenty/wloski.yaml).
       - Les préférences de l'application et le choix des modes créatifs (dossier runtime/skrypty/, fichiers .mode).
       - Un environnement Python isolé (dossier runtime/), vous n'avez donc rien à installer sur le nouvel ordinateur.
    5. Sur le nouvel ordinateur : téléchargez le dernier installateur depuis l'onglet Releases sur GitHub et installez l'application normalement. Lancez le programme une fois pour créer une structure de fichiers de configuration vide. Fermez l'application. Ensuite, copiez le dossier précédemment enregistré à l'emplacement d'installation en écrasant les fichiers — ou sélectionnez uniquement les dossiers qui vous intéressent (skrypty/, opowiesci/, golden_key.env) et collez-les aux endroits appropriés de la nouvelle installation.

    Astuce pour les utilisateurs de NVDA : le menu contextuel "Ouvrir l'emplacement du fichier" appelé avec la touche Application est entièrement accessible — NVDA lit chaque élément en français. Après avoir ouvert l'Explorateur dans le dossier cible, utilisez la touche Backspace pour monter d'un niveau (fonctionne toujours, que le focus soit sur la liste des fichiers ou sur la barre d'adresse), puis Ctrl+A pour tout sélectionner et Ctrl+C pour copier.

    Astuce : l'option "Ouvrir l'emplacement du fichier" est le nom natif pour la version polonaise de Windows. Dans le système anglais, elle est "Open file location", dans les autres versions linguistiques — de manière analogue dans la langue locale du système d'exploitation.

    Accents disponibles

    - Anglais (Samantha/Mark dans Vocalizer, Zira/Hazel dans OneCore)
    - Finnois (Satu/Mikko dans Vocalizer, Heidi dans OneCore)
    - Italien (Alice/Luca dans Vocalizer, Elsa dans OneCore)
    - Polonais (Ewa dans Vocalizer, Paulina dans OneCore)
    - Allemand (Stefan/Katja dans Vocalizer, Hedda dans OneCore)
    - Espagnol (Jorge/Monica dans Vocalizer, Helena dans OneCore)
    - Russe (Irina/Pavel dans Vocalizer, Yuri dans OneCore)
    - Français (Thomas/Amelie/Julie dans Vocalizer)

    Chiffre : Inverseur de texte

    L'Inverseur de texte est un outil simple qui inverse l'ordre des caractères dans chaque phrase. Avant d'inverser, le script développe certaines abréviations pour éviter des inversions phonétiquement absurdes. Par exemple, "p. ex." devient "par exemple", "c.-à-d." devient "c'est-à-dire", etc. Sans cette expansion, les abréviations avec des points inverseraient en un non-sens phonétique (exemple français : ".xe").

    Chiffre : Typoglycémie

    Selon une étude de l'Université de Cambridge, l'ordre des lettres dans un mot n'a pas d'importance, tant que la première et la dernière lettre sont à la bonne place. Vous puoevz lirre un txete mêm si les ltrtees sont mélgaéens, tnat que la pmrèire et la dèrneie lterte de cahuqe mto sont à la bnoe pclae.
  krok_2_klucz_api: |
    ÉTAPE 2 : Alimentation de l'API (clé Anthropic / Claude)

    Depuis la version 18.2, l'application utilise un seul fournisseur d'intelligence artificielle — Anthropic (Claude) — et nécessite UNE SEULE clé API dans le fichier golden_key.env :

    •  Clé Anthropic (Claude) — alimente L'INTÉGRALITÉ du moteur IA : la narration du Réalisateur (livre audio, théâtre lu, brainstorming), le mode Histoires, le Polyglotte (traducteur) ainsi que l'attribution de titres aux chapitres et la détection de la langue du contenu. Elle commence par sk-ant-.

    Si vous effectuez une mise à jour depuis une version antérieure : l'ancienne clé OpenAI n'est plus nécessaire — vous pouvez laisser ou supprimer sa ligne dans golden_key.env, l'application l'ignore.

    Comment obtenir une clé Anthropic :
    1. Créez un compte sur console.anthropic.com et approvisionnez-le (onglet Billing / Plans).
    2. Générez une clé dans la section API Keys (elle commence par sk-ant-). Copiez-la immédiatement — elle n'est parfois affichée qu'une seule fois.

    Comment saisir la clé dans le programme :
    3. Sur l'écran de démarrage du programme, cliquez sur le bouton "{home.btn_generate}". Le système créera automatiquement un fichier de configuration vierge au bon emplacement et ouvrira le Bloc-notes avec un modèle prêt à être édité.
    4. Dans le fichier ouvert, vous verrez la ligne : ANTHROPIC_API_KEY=TUTAJ_WKLEJ_SWOJ_KLUCZ. Supprimez le texte de remplacement et collez votre clé directement après le signe égal (sans espace ni guillemets). Enregistrez le fichier et redémarrez l'application.

    Conseil : Après le redémarrage, l'application vérifiera le fichier et affichera le statut de la clé dans la section "{home.heading_system_check}". Il doit être vert pour que tous les modules IA soient prêts à fonctionner. Si la clé est absente ou incorrecte, le programme l'indiquera clairement et permettra d'ouvrir un éditeur de texte pour corriger rapidement l'erreur.
  krok_3_glowne_studio: |
    KROK 3 : Studio Principal de Réalisation

    C'est votre centre de commande pour imaginer des histoires et écrire des scénarios. Accédez-y en cliquant sur le bouton "{main.btn.rezyser}" dans la barre d'outils ou en sélectionnant Outils → {main.menu.rezyser} dans le menu (raccourci : Ctrl+1).



    IMPORTANT : Format des fichiers de projet — retour au .txt

    Dans la version 7, les fichiers de projet étaient enregistrés au format Markdown (.md), par exemple skrypty/znieczulica.md. C'était une expérience délibérée — le format .md devait constituer une barrière psychologique pour les personnes non techniques, les décourageant d'ouvrir et de modifier manuellement le fichier dans le Bloc-notes (et ainsi éviter d'endommager accidentellement les en-têtes de structure).

    L'expérience n'a pas fonctionné. L'IA enfreint souvent l'une des interdictions fondamentales (plus à ce sujet dans un instant). Pour cette raison, dans la version 8, nous sommes revenus à de simples fichiers .txt — plus intuitifs et lisibles pour tout le monde. Par exemple, un projet nommé "znieczulica" sera désormais enregistré sous skrypty/znieczulica.txt, et son résumé sous skrypty/znieczulica_streszczenie.txt. Cela permettra à chacun d'apporter plus facilement des corrections ou des coupes au texte en temps réel.


    ⚠️ RÈGLE CRITIQUE DU MONTEUR (LISEZ AVANT DE COMMENCER !) ⚠️

    Tous vos scripts et livres générés sont enregistrés dans des fichiers texte simples (.txt), que vous pouvez facilement ouvrir dans le Bloc-notes.

    En tant que Réalisateur, vous avez le DROIT COMPLET (et même le devoir) d'éditer ce fichier ! Si l'intelligence artificielle s'emballe et, par exemple, résout elle-même le problème des personnages à la fin du fragment généré, ouvrez le fichier, supprimez les dernières lignes et laissez le texte en suspens au moment le plus tendu, puis cliquez sur "{rezyser.btn_przeladuj_label}" pour synchroniser la mémoire du modèle avec le fichier corrigé, et "{rezyser.btn_wyslij_label}" pour continuer.

    🔴 CEPENDANT - CE QUE VOUS NE DEVEZ PAS TOUCHER :

    Ne modifiez jamais, ne supprimez jamais et ne changez jamais les lignes contenant la structure (par exemple, Acte 1, Scène 2, Chapitre 1, Prologue). Si vous endommagez ces en-têtes :
    1. Votre histoire se désintégrera dans les lecteurs d'écran (NVDA).
    2. L'architecte de l'audiobook, et donc aussi le Studio Eleven Labs, ne pourra pas diviser correctement votre livre en segments à lire.
    3. Le Convertisseur interne de l'application ne générera pas une table des matières correcte dans le fichier Word ni sur la chronologie dans ElevenLabs.

    Éditez les dialogues, coupez l'action, mais laissez la structure intacte !


    Comment utiliser la Réalisation ?

    - Livre du Monde (barre latérale à gauche) : Ici, vous écrivez les règles de l'univers. Chaque projet a maintenant son propre Livre lié au nom du fichier — si votre fichier d'histoire est par exemple emilia_heist_audiobook.txt, le Livre du Monde sera enregistré sous skrypty/emilia_heist_audiobook.md. C'est pourquoi l'ordre est important : entrez d'abord le nom du fichier de projet dans le champ "Nom du fichier de projet", puis vous pouvez enregistrer le Livre. Le bouton "{rezyser.btn_zapisz_ksiege_label}" reste grisé tant que vous n'avez pas fourni de nom. Charger un projet existant avec le bouton "{rezyser.btn_wczytaj_label}" chargera automatiquement le fichier .md correspondant — vous n'avez rien à faire manuellement. Note : Sans Livre du Monde rempli, l'application bloquera l'envoi de requêtes à l'IA — c'est une protection délibérée qui vous empêche de générer du texte sans règles.
    - Mémoire à Long Terme (barre latérale à gauche) : Le deuxième champ dans la barre latérale. Ici, l'IA enregistre automatiquement un résumé de l'intrigue lorsque la mémoire commence à se remplir. Vous pouvez également y ajouter vos propres notes manuellement — le modèle les considérera comme "ce que je sais déjà" avant de lire la scène actuelle. FAILLE HISTORIQUE (corrigée en v15.5) : auparavant, si vous écriviez une très courte note ici et cliquiez sur "Enregistrer le Résumé" avant qu'il y ait quelque chose de significatif dans le fichier de narration, lors du prochain chargement, l'application chargeait PRIORITAIREMENT le résumé et IGNORAIT l'histoire complète — le modèle recevait alors seulement le Livre du Monde et une note d'une phrase, sans contexte de ton et des dernières scènes. Depuis la v15.5, le chargement est intelligent : si toute l'histoire tient dans la fenêtre de contexte, elle est chargée en entier (et l'ancien résumé inutile est supprimé), donc le modèle ne perd pas le contexte. Et après avoir édité manuellement le fichier de narration dans l'éditeur, utilisez le nouveau bouton "{rezyser.btn_przeladuj_label}" (depuis la v15.5), qui synchronise en un clic la mémoire interne avec le disque ; pour simplement ouvrir le fichier dans l'éditeur, utilisez toujours "{rezyser.btn_otworz_narracje_label}".
    - Mode Brainstorming : Entrez une idée vague, et l'IA vous proposera 3 options de développement de l'intrigue. Pour chaque option, elle générera immédiatement un bloc "--- ÉBAUCHE DE PROMPT ---". Après avoir choisi l'une d'elles, collez ce prompt dans le Mode Script ou Audiobook et ajoutez éventuellement des remarques ou des informations pour le modèle. La mémoire de l'intrigue ne change pas pendant le Brainstorming — vous pouvez expérimenter sans risque !
    - Mode Script Brut (depuis v16.0 — théâtre lu) : Vous collez ici "Ébauche de Prompt" générée lors du Brainstorming. L'IA écrira un long fragment narratif-dialogué : la narration (scène, temps, action) dans les balises [Narrateur : ...] et les répliques des personnages dans les balises [Nom : émotion]. Sans effets sonores — le contexte est porté par le narrateur avec des mots. Le texte est automatiquement ajouté à votre fichier (par exemple, nouvelle_scene.txt) dans le dossier skrypty/. Ce script prêt peut ensuite être transformé en audiobook multivoix (pont vers ElevenLabs Studio — chapitre séparé ci-dessous).
    - Mode Audiobook Traditionnel : Mode pour les écrivains. L'IA génère une prose littéraire pure — pas de balises, pas de phonétique, des dialogues classiques intégrés dans la narration. Le texte est ajouté au fichier de la même manière que dans le Mode Script.
    - Création automatique de personnages : Le script est programmé pour créer automatiquement de nouvelles balises [Speaker] si l'intrigue nécessite un nouveau personnage. Conseil : Si l'IA crée un personnage intéressant, copiez sa balise et collez-la dans le Livre du Monde pour que le modèle s'en souvienne définitivement !

    Gestion de projet — trois boutons d'action :
    - {rezyser.btn_wczytaj_label} : Charge un projet existant en mémoire. Disponible lorsque la mémoire actuelle est vide. Depuis la version 15.2.3, il prend en charge deux chemins : si le champ du nom du projet est vide, une boîte de dialogue de sélection s'ouvre avec la liste de tous les projets trouvés dans le dossier skrypty/ (ignore les fichiers de résumés) — NVDA lit la liste naturellement, le joueur n'a pas besoin de se souvenir et de taper le nom au clavier. Si le champ du nom est rempli, l'application essaie immédiatement de charger le projet portant ce nom (chemin expert : Entrée dans le champ du nom ou clic après avoir tapé de mémoire).
    - {rezyser.btn_hard_reset_label} : Efface complètement le projet. Supprime l'histoire, le résumé, le Livre du Monde et réinitialise tous les compteurs. À utiliser lors du changement de projet ou d'une nouvelle histoire.
    - {rezyser.btn_otworz_narracje_label} (depuis v15.2.3) : Édition d'urgence du fichier de narration dans l'éditeur de texte système. Nécessite un nom de projet saisi. L'application ouvre skrypty/<nazwa>.txt dans le Bloc-notes (Windows), TextEdit (macOS) ou l'éditeur GUI par défaut (Linux). Scénarios typiques : (a) L'IA ne clôt pas la scène et vous souhaitez ajouter la fin manuellement ; (b) vous avez chargé un projet avec un résumé et souhaitez copier les dernières scènes dans la Mémoire à Long Terme pour que le modèle ait le contexte complet du ton (lacune architecturale décrite ci-dessus) ; (c) vous souhaitez couper le texte au milieu d'un chapitre, ce que le moteur de l'application ne prend pas en charge nativement.
    - {rezyser.btn_przeladuj_label} (depuis v15.5, reconstruit en v17.6) : Recharge TOUT le projet depuis le disque après l'édition manuelle du fichier de narration — c'est un rechargement réel, pas seulement un rafraîchissement de la mémoire actuelle. Recalcule les compteurs de Chapitres/Actes/Scènes, relève le Livre du Monde, le mode et les options de Brainstorming, et synchronise la mémoire de travail. Si toute l'histoire tient dans la fenêtre de contexte, elle est chargée en entier (et l'ancien résumé inutile est supprimé pour que le moteur fonctionne sur le texte complet). Si l'histoire est longue et a un résumé enregistré, il le conserve intact et vous demande à partir de quel en-tête la mémoire de travail de l'IA doit démarrer : en mode Audiobook, vous choisissez le Chapitre, en mode Script d'abord l'Acte, puis la Scène de cet acte (ou tout l'Acte) — le reste est représenté par le résumé. Annuler le choix = coupe d'urgence au dernier fragment de texte (c'est pourquoi il est bon de conserver la structure des en-têtes). Avant de remplacer les champs par la version du disque, il avertit si vous avez du contenu non enregistré. Scénario typique : L'IA a mal clôturé la scène (a enfreint l'anti-closure), vous coupez la mauvaise fin dans l'éditeur et cliquez sur Recharger — plus besoin de corriger à deux endroits.

    Note historique — pourquoi les modes sont maintenant protégés contre les changements accidentels :
    Dans les versions précédentes de l'application, personne ne surveillait la cohérence du mode créatif au sein d'un même projet. Le résultat était une certaine possibilité créative subtile, que l'on pourrait décrire ainsi : vous commencez une histoire en Mode Script, insérez "Acte 1" et "Scène 1" (l'application est ravie de votre cohérence), générez quelques écrans de tension avec des balises [SFX : Porte qui claque] et [Speaker 1 : Marek - résigné]... puis — car l'inspiration vient de frapper — vous cliquez sur "Insérer coupe Chapitre 1". L'application ajoute sans sourciller l'en-tête "Chapitre 1" au fichier, juste après "Scène 3". Vous avez maintenant dans le fichier un hybride de pièce radiophonique des années 50 et de roman contemporain. ElevenLabs regarde cette structure, voit l'en-tête de chapitre au milieu d'un acte et décide que c'est probablement une erreur dans la matrice. La table des matières ressemble à une œuvre d'art avant-gardiste. L'Architecte des Audiobooks, quant à lui, part du principe que vous êtes un adulte et traite cela sans mot dire — mais aussi sans aucune garantie de résultat. Depuis la version 12.0, l'interface a essayé de bloquer le changement de mode d'enregistrement — du moins en théorie. La pratique s'est révélée plus créative : le Brainstorming (toujours actif en tant que mode de planification) était une porte dérobée par laquelle on pouvait passer entre Script et Audiobook avec les flèches haut et bas (Audiobook → Brainstorming → Script et inversement). Le premier clic sur "Insérer Acte 1" ou "Insérer Chapitre 1" dans le nouveau mode choisi écrasait facilement le fichier .mode, mélangeant actes et chapitres dans un seul fichier de narration. Ce n'est qu'à partir de la version 15.2.3 que nous avons une véritable protection : après avoir fixé la décision de mode (première structure ou premier envoi de production réussi), la deuxième position d'enregistrement dans le RadioBox est effectivement désactivée. Le Brainstorming reste toujours actif en tant que mécanisme d'urgence — il génère un résumé lors du dépassement de la fenêtre de contexte et des options d'intrigue — mais il n'est plus possible de passer par là à un autre mode d'enregistrement.


    Prompts de Showrunner — L'IA en tant que scénariste de série (depuis la version 7, conservé)

    C'est le plus grand changement introduit dans la version 7, conservé sans modification. Il n'est pas visible dans l'interface, mais change radicalement la qualité de l'intrigue générée.

    Le Showrunner est dans l'industrie télévisuelle la personne responsable de l'ensemble de la série — il veille à ce que l'intrigue ne se dirige jamais vers une solution facile, mais qu'elle s'épaississe constamment, multiplie les conflits et maintienne le spectateur en haleine pendant de nombreuses saisons. Dans la version 7, cette philosophie a été intégrée directement dans les instructions système de l'IA.

    Directive Anti-Closure — état dans la version 8

    Malgré le test de différentes approches, l'interdiction Anti-Closure est souvent enfreinte par le modèle, en particulier en Mode Audiobook Traditionnel. L'IA a une forte tendance à "fermer" l'histoire à chaque occasion — elle insère des phrases résumant l'intrigue, crée de faux happy ends ou clôt les intrigues au milieu d'un chapitre, comme si chaque fragment était le dernier. Le résultat est que le fragment suivant commence à zéro, sans continuité naturelle.

    C'est pourquoi la règle du monteur décrite ci-dessus est si importante : si l'IA enfreint l'interdiction et clôt elle-même la scène, votre tâche en tant que Réalisateur est d'ouvrir le fichier .txt, de supprimer ces dernières phrases et de laisser le texte en suspens au moment le plus tendu, puis de cliquer sur "{rezyser.btn_przeladuj_label}" pour synchroniser la mémoire avec le fichier corrigé.

    Chaque mode possède une directive Anti-Closure intégrée :

    - Brainstorming : L'IA fonctionne comme un scénariste de série multi-saisons. Chacune des 3 options proposées DOIT accumuler des obstacles, introduire de nouveaux dilemmes, des intrigues ouvertes et des cliffhangers. Il est absolument interdit de proposer des options où les personnages se réconcilient définitivement, surmontent le principal obstacle sans conséquences majeures ou où l'histoire se dirige vers une fin précipitée. Interdiction de créer des lieux magiques bon marché qui brisent l'architecture du monde.
    - Mode Script Brut : Interdiction absolue de terminer le texte par des résumés, des morales ou des conclusions. L'IA doit interrompre l'action naturellement à un moment de tension (cliffhanger), en évitant les conclusions, afin que le fragment suivant puisse reprendre la narration en douceur.
    - Mode Audiobook Traditionnel : Interdiction absolue de terminer le texte par des résumés pathétiques, de clore les intrigues ou de suggérer la fin de l'histoire (par exemple, "Elle était prête pour de nouveaux défis", "Elle comprit qu'il était temps d'aller de l'avant"). Le texte doit s'interrompre au milieu d'une action en cours, d'une tension ou d'une pensée ouverte.

    Exception à la règle : Si vous demandez explicitement une conclusion, une fin ou un épilogue, l'IA générera une clôture satisfaisante de l'histoire — l'interdiction ne s'applique pas lorsque vous le demandez vous-même.


    Gestion des Actes et Scènes (Mode Script, depuis la version 7, conservé)

    Le Mode Script Brut dispose d'un panneau dédié "{rezyser.struktura_heading}" avec des boutons pour construire la structure de la pièce radiophonique en temps réel.

    - Insérer Acte X : Insère un en-tête d'acte (par exemple, "Acte 2") ET ajoute automatiquement en dessous "Scène 1" — car chaque nouvel acte commence par la première scène. Le compteur d'actes passe au numéro suivant, et le compteur de scènes se réinitialise à 2 (prêt pour la scène suivante dans cet acte).
    - Insérer Scène X : Insère uniquement l'en-tête de scène (par exemple, "Scène 3") dans l'acte en cours. Le compteur de scènes augmente automatiquement.

    Chargement intelligent du fichier : Lorsque vous chargez un fichier de script existant, l'application le scanne automatiquement et règle les compteurs d'actes et de scènes sur les numéros corrects. Le compteur de scènes est toujours calculé dans le dernier acte du fichier.

    Prologue et Épilogue : Les boutons "{rezyser.btn_prolog_label}" et "{rezyser.btn_epilog_label}" sont communs aux deux modes et disponibles dans le même panneau.

    L'Architecte des Audiobooks convertira automatiquement les Actes en principaux points de navigation (Heading 1) pour ElevenLabs et NVDA — les Scènes deviendront du texte en gras visible dans le document, mais invisible dans la table des matières.


    Gestion Intelligente des Chapitres (Mode Audiobook, depuis la version 5, conservé)

    LLM génère au maximum environ 5000 caractères par requête — c'est insuffisant pour un chapitre complet. C'est pourquoi vous travaillez de manière itérative : vous générez des fragments successifs avec le bouton "Envoyer à l'IA" jusqu'à ce que vous jugiez le chapitre prêt. Ensuite, vous cliquez sur "Insérer coupure de chapitre" — l'application ajoute un en-tête au fichier et à la mémoire, et le compteur de chapitres passe automatiquement au numéro suivant.

    Boutons dans le panneau :

    - Insérer coupure (Chapitre X) : Insère un en-tête (par exemple, "Chapitre 3") dans le fichier et la mémoire. Le compteur de chapitres se met à jour automatiquement.
    - Insérer Prologue : Fonctionne uniquement au début, lorsque la mémoire est vide. Protection contre l'insertion accidentelle d'un Prologue au milieu de l'histoire.
    - Insérer Épilogue : Clôt l'histoire. Après avoir inséré un Épilogue avec du contenu, l'application bloquera la génération de nouveaux fragments — c'est intentionnel, car après la fin de l'histoire, il n'y a plus rien à ajouter.

    Chargement intelligent du fichier : Lorsque vous chargez un fichier existant, l'application le scanne automatiquement et règle le compteur de chapitres sur le bon numéro. Si le fichier a un Prologue et trois chapitres, le compteur affichera "Chapitre 4" — sans comptage manuel.


    Accumulateur de l'Intrigue — comment fonctionne la mémoire de l'IA

    Seul le texte pur de l'histoire entre dans la mémoire du modèle — ce que l'IA a effectivement écrit. Les instructions, options et plans disparaissent après utilisation et ne surchargent pas le contexte. Résultat ? Le modèle reste concentré plus longtemps, se souvient mieux des accents des personnages et "s'échappe" moins souvent des règles du Livre du Monde.

    L'indicateur "Mémoire du Modèle" à l'écran montre à quel point la fenêtre contextuelle du modèle est remplie. Depuis la version 15.1, ce n'est plus un simple comptage des caractères de l'histoire — l'application compte les TOKENS réels (de la même manière que le modèle) et additionne TOUT le contenu envoyé à l'IA : l'histoire en cours, la Mémoire à Long Terme (résumé) ET le Livre du Monde. C'est pourquoi l'indicateur augmente également lorsque vous développez le Livre du Monde ou avez un long résumé — pas seulement à cause de la narration elle-même. La valeur est affichée en pourcentage de remplissage de la fenêtre :
    - Vert (jusqu'à environ 70%) : Le modèle est pleinement concentré, vous avez un tampon de sécurité.
    - Jaune (environ 70–90%) : Vous approchez de la limite. L'IA peut commencer à raccourcir les réponses et à ignorer les règles ; en mode planification (Brainstorming), le moteur commence à forcer un résumé. Commencez à clore lentement l'intrigue.
    - Rouge (au-dessus d'environ 90%) : Surcharge critique !

    Diagnostic du seuil de résumé (lorsque l'IA hallucine plus tôt que prévu) : les seuils (avertissement ~70%, alarme ~90%) sont estimés empiriquement. Si vous remarquez une tendance récurrente où le modèle "s'échappe" des règles ou commence à halluciner AVANT que l'indicateur n'entre dans le jaune/rouge — c'est-à-dire plus tôt que prévu — ouvrez un problème dans le dépôt de l'application et décrivez à quel pourcentage approximatif cela commence réellement à se produire, de préférence avec un exemple. Si cette tendance se confirme plus largement (chez d'autres utilisateurs, sur différents projets), le seuil de résumé automatique sera abaissé dans le prochain patch. C'est un mécanisme consciemment itératif — mieux vaut l'ajuster sur des données réelles que de deviner à l'avance.

    Mémoire Infinie (depuis la version 6, conservée)

    Lorsque l'alarme rouge s'allume, vous n'avez plus besoin de copier manuellement le résumé. Tapez dans le Brainstorming une commande contenant le mot "résumé" ou "synthèse" — l'IA générera une capsule concise de connaissances sur toute l'intrigue jusqu'à présent. Ensuite, cliquez sur le bouton "Enregistrer le Résumé (de manière permanente)" — l'application crée automatiquement un fichier _résumé.txt dans le dossier skrypty/ et le protège contre l'écrasement accidentel. Après l'enregistrement, videz la mémoire et vous pouvez continuer à créer dans le fichier actuel. Vous chargerez le résumé dans le champ de la Mémoire à Long Terme avant la prochaine session — et vous pouvez continuer l'histoire indéfiniment, sans aucune limitation de longueur.

    Quand résumer (mis à jour en v15.5) : Vous n'avez plus besoin de surveiller un seuil strict de caractères "avant de terminer le travail". Il est préférable de résumer après la clôture naturelle d'une plus grande partie structurelle — après la fin d'une scène, d'un acte ou d'un chapitre. Raison : lorsque vous corrigerez manuellement la fin dans le fichier de narration et cliquerez sur "{rezyser.btn_przeladuj_label}", l'application vous demandera à partir de quel en-tête reconstituer le nouveau fragment — et le résumé de la partie précédente restera intact (fin des corrections à deux endroits). C'est pourquoi il est d'autant plus important de maintenir la structure : insérez régulièrement les en-têtes Chapitre/Acte/Scène à partir du panneau de structure (les longues formes sans actes/chapitres, par exemple "drame moderniste" en une seule fois, sont déconseillées). EXCEPTION : si vous menez une très longue histoire SANS en-têtes, générer et enregistrer un Résumé avant une pause reste nécessaire — sans marqueurs, l'application ne peut reconstituer que le dernier fragment compté en caractères, et le moteur sans contexte pourrait "paniquer".

    Résumé automatique : Lorsque la mémoire entre en état d'alarme, le Brainstorming passe automatiquement en mode de secours — au lieu de générer immédiatement des options, il crée d'abord un résumé détaillé de toute l'intrigue jusqu'à présent et le sauvegarde dans des balises <RÉSUMÉ>. L'application détecte ces balises et transfère automatiquement le résumé dans le champ de la Mémoire à Long Terme. Zéro travail manuel !

    Chargement et rechargement intelligents depuis le disque (mis à jour en v17.6) : Tant lors du chargement d'un projet que après avoir cliqué sur "{rezyser.btn_przeladuj_label}" (après l'édition manuelle du fichier de narration dans l'éditeur), l'application harmonise la mémoire avec le disque en un seul passage — elle recalcule les compteurs de structure et relève le Livre du Monde et le mode. Si TOUTE l'histoire tient dans la fenêtre de contexte — elle la charge en entier, et l'ancien résumé inutile est supprimé pour que le moteur fonctionne sur le texte complet (cela comble l'ancienne lacune où le modèle recevait seulement le résumé sans le contexte des dernières scènes). Si l'histoire est LONGUE et a un fichier de résumé enregistré — elle conserve le résumé intact et vous demande à partir de quel en-tête de structure (Chapitre/Acte/Scène) la mémoire de travail de l'IA doit commencer ; le reste de l'intrigue est représenté par le résumé. Ainsi, vous ne gaspillez pas de tokens à recharger toute l'histoire, tout en garantissant que le prochain résumé ne se base pas sur des données obsolètes.
  krok_3b_most_elevenlabs: |
    ÉTAPE 3b : Deux sorties du Scénario — livre audio multivoix (ElevenLabs) et version pour lecteurs d'écran

    Le scénario de théâtre radiophonique finalisé (mode Scénario) dispose de deux sorties indépendantes : un projet ElevenLabs Studio multivoix (audio) et une version HTML pour lecteurs d'écran. Ce sont deux façons d'« entendre » la même pièce — vous pouvez utiliser l'une, l'autre ou les deux. Toutes deux sont optionnelles et ne modifient pas le flux classique avec le convertisseur.

    ─────────── Passerelle vers ElevenLabs Studio (audio, optionnel) ───────────

    La passerelle transforme le scénario en projet Studio multivoix — le narrateur et chaque personnage reçoivent une voix distincte. Sans clé ElevenLabs, rien ne change : la passerelle reste simplement masquée.

    Clé ElevenLabs (optionnelle)

    Collez votre clé ElevenLabs dans le fichier golden_key.env, sur une ligne séparée : ELEVENLABS_API_KEY=sk_... Attention : la clé ElevenLabs commence par sk_ (avec UNDERSCORE), contrairement à la clé Anthropic (sk-ant-). Si vous utilisez une clé avec restrictions (restricted key), accordez-lui les permissions (scopes) projects_write et voices_read. Le statut de la clé est visible sur l'écran principal (System Check) — l'absence de clé n'est pas une erreur, la passerelle reste simplement masquée.

    La passerelle apparaît dans le panneau du Réalisateur en mode Scénario (lorsque la clé est valide). Elle fonctionne sur une pièce finalisée enregistrée sur le disque — générez ou chargez d'abord le projet, puis accédez à la passerelle.

    Étape 1 — Distribution des voix

    Cliquez sur « Distribution des voix… ». L'application lira les personnages ayant des répliques dans votre scénario et ajoutera toujours un emplacement Narrateur (le narrateur est la voix par défaut — il lit les titres de chapitres et toute la narration). Pour chaque locuteur, collez un voice ID. IMPORTANT : chaque voix utilisée dans la pièce doit d'abord figurer dans vos « My Voices » — les voix que vous créez vous-même (par exemple via « Voice Design ») y arrivent automatiquement, tandis que les voix de la bibliothèque publique se parcourent dans l'onglet « Explore » et s'ajoutent via le bouton « Add to My Voices ». Comment obtenir un voice ID dans ElevenLabs (dans le navigateur) : trouvez la voix, écoutez l'échantillon pour vous assurer qu'il s'agit du bon, et copiez son identifiant via le bouton « Copy Voice ID » ; lorsque la voix est déjà dans « My Voices », ce bouton est disponible immédiatement — sans développer « More actions ». Choix des voix : pour limiter les éventuelles régénérations, le plus simple est de choisir dans la collection « Best for Eleven v3 » (voix validées pour le modèle v3 sur lequel le projet est créé) ; vous pouvez aussi concevoir votre propre voix dans « Voice Design », et pour les plus aventureux, il reste le clonage IVC (Instant Voice Cloning) ou PVC (Professional Voice Cloning). Vous pouvez laisser les champs vides et revenir plus tard — la sauvegarde est un brouillon.

    Étape 2 — Construire le projet

    Cliquez sur « Créer un projet ElevenLabs Studio… ». L'application vérifiera que le scénario comporte au moins un chapitre (Prologue/Acte/Chapitre) et que chaque locuteur ainsi que le narrateur ont une voix assignée, puis créera dans votre compte un projet Studio multivoix divisé en chapitres. La simple création du projet NE consomme PAS de crédits. L'application configure immédiatement la langue du projet (prononciation correcte des lignes d'en-tête) ainsi que la normalisation du volume selon le standard du livre audio — tout cela via l'API, afin que vous n'ayez pas à accéder aux paramètres du projet dans le navigateur.

    Gardien du format (extension de la Règle du Monteur) : la passerelle exige que dans le scénario CHAQUE ligne soit soit une réplique avec indicateur de locuteur ([Narrator: …] ou [Nom: …]), soit un en-tête de structure (Prologue, Acte, Scène, Chapitre). La prose ordinaire non balisée saisie « librement » — par exemple une note d'auteur ou un fragment de narration sans balise — n'est attribuée à aucune voix et est silencieusement ignorée lors de la construction, de sorte que le projet final pourrait diverger de votre fichier. C'est pourquoi, si l'application détecte de telles lignes orphelines, elle en affiche la liste avec les numéros et demande si la construction doit quand même avoir lieu : vous pouvez alors annuler et corriger le scénario (ouvrez-le via le bouton « Ouvrir le fichier de narration… », ajoutez les indicateurs de locuteur manquants ou supprimez ces lignes) ou choisir délibérément de construire malgré tout, en acceptant leur omission. C'est une extension naturelle de la Règle du Monteur : tout comme il est interdit d'altérer les en-têtes de structure, dans un scénario destiné à la passerelle, chaque ligne doit avoir son locuteur ou être un en-tête.

    Étape 3 — Rendu dans le navigateur

    Après la création du projet, l'application affichera son identifiant ainsi qu'un bouton ouvrant ElevenLabs Studio. Dans le navigateur, trouvez le projet, effectuez le rendu de la parole (c'est seulement à ce moment que les crédits sont consommés — environ 1 crédit par caractère), puis exportez le fichier audio ou publiez le projet dans Eleven Reader. Le rendu et la publication se font de votre côté, en toute connaissance de cause — l'application se contente de construire le projet.

    Expression et accents (modèle Eleven v3)

    Le projet est créé sur le modèle Eleven v3 (plus de 70 langues). Les émotions NE s'expriment PAS par des majuscules, des points de suspension ou des tirets — le moteur les ignore. À la place, le Réalisateur intègre dans les répliques des balises audio v3 en anglais, par exemple [whispers], [sighs], [angry], [laughs] — ce sont elles qui contrôlent l'expression et fonctionnent indépendamment de la langue parlée. L'ACCENT d'un personnage provient en revanche de l'ÉCHANTILLON DE VOIX : si vous souhaitez qu'un personnage parle par exemple en polonais avec un accent étranger, choisissez ou concevez dans Voice Design une voix dont l'échantillon possède cet accent. En pratique, expérimentez avec le prompt de la voix jusqu'à entendre par exemple un échantillon polonais avec un accent finnois — le modèle v3 conservera cet accent dans l'enregistrement final. Conseil : les phrases très longues affaiblissent l'accent, c'est pourquoi le Réalisateur est déjà invité dans le prompt à utiliser des phrases courtes.

    Conscience du modèle v3 (phase alpha)

    Eleven v3 est le plus expressif, mais toujours en phase alpha. Il arrive qu'une réplique isolée soit rendue sous forme de grésillements plutôt que de parole — il suffit de la régénérer dans Studio (chaque bloc dispose de quelques régénérations gratuites). Dans les paramètres du projet ElevenLabs, des recommandations de changement de modèle peuvent également s'afficher (vers Eleven Flash v2.5 ou Multilingual v2) — ce n'est PAS une erreur, seulement une suggestion du moteur. Si vous ne souhaitez pas voir ces messages, n'ouvrez simplement pas les paramètres du projet : l'application a déjà tout configuré via l'API (modèle, langue, normalisation du volume).

    Pourquoi le théâtre radiophonique et non les effets sonores ? Dans les versions précédentes, le mode Scénario produisait des effets bruts [SFX: ...] sans narrateur. La passerelle vers un enregistrement multivoix finalisé exige cependant que le contexte (lieu, temps, action) soit porté par le narrateur en mots : les effets sonores dans Studio ne sont pas accessibles aux lecteurs d'écran, et le modèle réalise de toute façon soit le narrateur, soit les effets — jamais les deux de manière stable simultanément. C'est pourquoi le mode Scénario est un théâtre radiophonique : narrateur plus dialogue, sans SFX.

    ─────────── Version pour lecteurs d'écran (HTML, sans ElevenLabs) ───────────

    En mode Scénario, indépendamment de la clé ElevenLabs, vous disposez du bouton « Générer la version pour lecteurs d'écran ». Il crée le fichier skrypty/<nazwa>_screen_reader.html — une sortie distincte pour les personnes utilisant des lecteurs d'écran (par exemple NVDA). Son fonctionnement : les répliques des personnages qui ont un accent défini dans le Livre du Monde (par exemple l'entrée « [Joana] accent finnois ») reçoivent une transcription phonétique (orthographe délibérément « altérée ») ainsi qu'un marqueur de langue (attribut lang), grâce auquel le lecteur d'écran les lit avec l'accent étranger approprié. Les balises audio v3 (par exemple [whispers]) sont supprimées dans cette version — le lecteur ne doit pas les lire à voix haute. Les en-têtes Prologue/Acte/Scène deviennent des en-têtes HTML, ce qui permet une navigation aisée dans le document.

    C'est un complément délibéré à la passerelle audio : l'accent pour le modèle v3 est porté par l'échantillon de voix, et pour le lecteur d'écran — par l'orthographe et le marqueur de langue. C'est pourquoi l'orthographe dans la version audio reste propre (v3 choisit lui-même la langue), tandis que l'« altération » de l'orthographe se retrouve exclusivement dans le fichier HTML séparé, où elle est souhaitée.
  krok_4_postprodukcja: |
    ÉTAPE 4 : Postproduction dans Reżyser Audio GPT

    Après avoir écrit votre histoire, vous avez à votre disposition un outil de postproduction disponible en bas du panneau de Réalisateur (apparaît uniquement en Mode Audiobook).

    Attribution de Titres aux Chapitres (Mode Audiobook)

    L'IA analysera toute l'histoire et proposera des titres descriptifs et littéraires pour chaque chapitre (ainsi que pour un éventuel Prologue et Épilogue). Le module itère à travers les chapitres du fichier enregistré et leur attribue un titre court, en analysant uniquement le début de chaque chapitre (jusqu'à 6000 caractères). Il retourne uniquement une liste numérotée de titres — sans retranscrire le contenu du livre.

    Remarque : Le module nécessite que le fichier soit déjà enregistré sur le disque (généré ou chargé). Si le fichier n'existe pas, l'application affichera un message approprié.
  krok_5_poliglota_intro: |
    ÉTAPE 5 : Polyglotte AI

    Application pour la traduction et l'imposition d'accents forts sur les synthétiseurs de lecteurs d'écran. Accédez-y en cliquant sur le bouton "{main.btn.poliglota}" dans la barre de boutons ou en sélectionnant Outils → {main.menu.poliglota} dans le menu (raccourci : Ctrl+2).

    Mode 1 : Traducteur Ordinaire (Utilise l'IA - Payant)

    Idéal pour écouter des histoires dans une belle langue étrangère correcte.

    - Chargez un fichier avec le bouton "{poliglota.btn_wczytaj}" ou utilisez le bouton "Parcourir..." pour sélectionner un fichier dans la fenêtre système.
    - Choisissez le mode "Traducteur IA", entrez la langue cible (par exemple, "Finnois").
    - Le script traduira le contenu. Si vous chargez un fichier .html, il traduira uniquement le texte visible pour le lecteur et mettra à jour le code de langue dans la balise html.
    - Si vous chargez un fichier .txt ou .md ordinaire (par exemple, un script généré par le Réalisateur), le script enregistrera automatiquement le résultat comme un fichier .html avec une balise de langue intégrée — prêt à être lu par NVDA sans aucun travail supplémentaire.
    - Prend également en charge les fichiers .docx.

    Division intelligente en blocs : Les longs textes sont automatiquement divisés en blocs mesurés en tokens du modèle (et non en caractères) et traduits séquentiellement avec une barre de progression. Ainsi, même les langues à écriture dense, comme le chinois ou le japonais, tiennent dans la limite de réponse du modèle, et une réponse tronquée est détectée et automatiquement retentée sur des fragments plus petits.

    Enregistrement de progression résistant aux pannes (NOUVEAUTÉ dans la version 9) : Chaque bloc traduit est immédiatement enregistré dans un fichier temporaire caché dans le dossier système de l'application. Si la traduction est interrompue en raison de l'épuisement de la limite API, lors du prochain lancement, l'application détectera automatiquement ce fichier, restaurera la progression déjà payée et terminera tranquillement le travail à partir du point d'interruption — sans aucun copier-coller manuel. Après une fin réussie, le fichier temporaire est automatiquement supprimé.

    Pourquoi est-ce important ? Dans la version 8, l'approche de reprise de traduction avait un bug critique et silencieux : si vous ne renommiez pas le fichier avec une traduction partielle et coupiez le fragment traduit selon les instructions, puis repreniez immédiatement la traduction du reste — l'application ouvrait le fichier de sortie en mode écrasement. La progression payée était effacée de manière irréversible et inconsciente avant que vous ne puissiez vous en rendre compte. La version 9 élimine complètement ce piège : l'enregistrement est permanent après chaque bloc, peu importe ce que vous faites ensuite.

    Mode 2 : Mode Réalisateur / Accents (Gratuit - Fonctionne localement)

    Outil pour "détériorer" le texte. Imposant un accent polonais cassé sur les synthétiseurs.

    Le menu déroulant intégré du Mode Réalisateur permet de choisir l'accent directement à partir d'une seule liste. Les options disponibles sont :
    Anglais (Samantha / Mark — Vocalizer/Apple, Zira / Hazel — OneCore)
    Russe (Milena — Vocalizer/Apple, Irina / Pavel / Yuri — OneCore, eSpeak)
    Polonais (Ewa — Vocalizer, Paulina — OneCore)
    Allemand (Markus / Stefan — Vocalizer/Apple, Hedda / Katja — OneCore)
    Espagnol (Jorge / Monica — Vocalizer/Apple, Helena — OneCore)
    Islandais (Gudrun — OneCore, eSpeak ; note : Vocalizer ne prend pas en charge cette langue !)
    Italien (Alice / Luca — Vocalizer/Apple, Elsa — OneCore)
    Finnois (Satu / Mikko — Vocalizer/Apple, Heidi — OneCore)
    Et aussi deux options de nettoyage sans accent :
    "Aucun (Nettoyage SANS normalisation des nombres)"
    "Aucun (Nettoyage AVEC normalisation des nombres)"
    L'option avec normalisation des nombres convertit automatiquement les chiffres en leur forme écrite (par exemple, 15 devient "quinze") avant le traitement — ainsi NVDA lit les nombres de manière fluide, et si le texte a un accent imposé, le nombre l'aura aussi, sans aucune exception.
    Vous vous demandez probablement si le synthétiseur saura décliner ces nombres normalisés en fonction du contexte ? La réponse est : non. Et c'est une fonctionnalité délibérée. Comme on le sait bien : "la langue polonaise être difficile" — et un étranger écorchant notre grammaire ne fait qu'ajouter à l'authenticité de l'accent cassé !

    Réparateur de Balises (NOUVEAUTÉ dans la version 9) : À la fin de la liste, vous trouverez une option supplémentaire — le Réparateur de Balises. Il n'applique aucune règle phonétique ni de nettoyage. Il fait une chose : injecte dans le fichier le code de langue ISO que vous fournissez — à deux lettres (par exemple, "fi" pour le finnois, "en" pour l'anglais) ou avec un sous-tag de région ou d'écriture (par exemple, "pt-BR" pour le portugais brésilien, "zh-Hans" pour le chinois simplifié). Utile lorsque vous avez déjà un fichier prêt — par exemple, précédemment traduit par le Traducteur IA — mais qui est sorti avec une balise de langue incorrecte ou manquante. Au lieu de le traduire à nouveau, vous lancez simplement le Réparateur avec le bon code ISO et en un rien de temps, vous avez un fichier corrigé.

    Le script nettoie les didascalies entre parenthèses — il supprime tous les fragments de texte entre parenthèses (par exemple, "(avec des respirations intégrées)", "(en chuchotant)", "(ironiquement)"). ElevenLabs doit lire uniquement les dialogues et la narration, et non les instructions de mise en scène intégrées dans le texte.

    Le script nettoie également les balises Markdown — il supprime les hashtags des en-têtes (par exemple, #, ##, ###), les signes égaux utilisés comme soulignements d'en-têtes, ainsi que les virgules orphelines qui pourraient perturber le rythme de lecture par le synthétiseur.

    - Bouclier de protection : Le script protège toutes les balises HTML. Il ne détériore que les dialogues et la narration.
    - Fonctionne localement et ne coûte rien !

    Chiffre : Inverseur de Texte

    Cette fonction inverse les phrases, mais d'abord elle développe les abréviations françaises courantes. Par exemple, "p. ex." devient "par exemple", "c.-à-d." devient "c'est-à-dire", etc. Sans cette expansion, les abréviations pointées se renverseraient en un non-sens phonétique (exemple français : ".xe.p").

    Chiffre : Typoglycémie

    Selon une recherche à l'Université de Cambridge, il n'importe pas dans quel ordre les lettres dans un mot sont, la seule chose importante est que la première et la dernière lettre soient à la bonne place.
  krok_5_tryb_szyfrant: |
    Tryb 3 : Chiffreur (NOUVEAUTÉ dans la version 13.0 — jeux de texte, gratuit, local)

    Le troisième RadioButton dans Polyglot, à côté du Traducteur IA et du Mode Réalisateur : « Mode Chiffreur (jeux de texte, découpage aléatoire) ». Il active six algorithmes locaux de distorsion de texte — pour des jeux, des énigmes, des casse-têtes linguistiques. Après avoir sélectionné le mode, une liste déroulante d'algorithmes apparaît, et pour l'un d'eux (Chiffre de César), un champ numérique supplémentaire pour le décalage.

    Algorithmes disponibles (sélectionnez dans le menu « Choisir l'algorithme de distorsion ») :

    - Inverseur de Texte (Lecture à l'envers avec une majuscule) — chaque phrase est inversée caractère par caractère, en conservant le point/exclamation/interrogation à la fin et la majuscule au début. Avant l'inversion, le script développe les abréviations populaires (p. ex., c.-à-d., etc., M., Dr, etc.), pour que le résultat après inversion ait encore du sens — sans cela, « p. ex. » après inversion devient un absurde « .xe ».

      Inspiration : mission du programme « The Traitors. Traîtres ». Quand l'animatrice a montré sans préavis aux participants une chanson populaire polonaise de dessin animé — simplement jouée à l'envers — les réactions allaient dans le style « quelle est cette langue ? », « c'est peut-être de l'arménien », « hongrois ou finnois ». La mission proprement dite consistait en ce qu'une équipe recevait dans la forêt le texte de la chanson écrit à l'envers, devait la chanter sous cette forme inversée, l'autre équipe l'enregistrait, la jouait à l'envers — et en théorie récupérait la chanson originale à deviner. Exactement le même malentendu phonétique amusant est généré par notre Inverseur lorsque vous passez le fichier traité par un synthétiseur TTS.

    - Typoglycémie (Milieu des mots mélangé) — effet psycholinguistique classique : « Vous puoevz lirre un txete peu i'moprte l'odrre des ltteers, tnat que la piremère et la derinère ltteer sont à la bnnoe pclae ». Le script mélange aléatoirement le milieu de chaque mot de plus de 4 lettres, la première et la dernière lettre restent intactes. Idéal pour tester « combien je vois vraiment, et combien mon cerveau devine ».

    - Téléphone Cassé / Dialecte Serpent — chaque « s », « z » ou digramme « sz » est allongé aléatoirement en un sifflement de 4 à 8 caractères (« sssssss », « zzzzzzz », « sssssssz »). Inspiration : Snecko du jeu « Slay the Spire ». Effet : le texte semble lu par un serpent avec un défaut de prononciation.

    - Voyelliseur (Tout résonne en « O ») — chaque voyelle dans le texte est remplacée par « o », en conservant les adoucissements polonais. « Bonjour » → « Bonjoor ». Plus le texte est long, plus l'effet est amusant (et le lecteur d'écran le lit avec pleine conviction).

    - Bégaiement Fort / Robot Endommagé — ajoute des bégaiements au début des mots : « or-or-or-ordinateur », « st-st-stratégie ». Pour les mots courts (moins de 3 lettres), l'algorithme les ignore. Si la deuxième lettre du mot est une consonne, il répète les deux premières lettres (effet plus naturel) ; si c'est une voyelle — il ne répète que la première.

    - Chiffre de César (décalage de l'alphabet FR) — chiffre de substitution classique : chaque lettre est décalée de N positions dans l'alphabet français (ABCDEFGHIJKLMNOPQRSTUVWXYZ, 26 lettres). Vous entrez la valeur du décalage dans le champ numérique « Décalage du chiffre de César (0 = aléatoire, plage -25…25) ». Si vous entrez 0 — l'application choisira un décalage aléatoire dans la plage 1-25 et l'affichera dans un message après la fin (pour que vous puissiez ensuite déchiffrer). Les caractères hors alphabet (chiffres, ponctuation, espaces et lettres accentuées comme é, à, ç) restent inchangés.

    Application pratique : les chiffres enregistrent le résultat dans le même format que le Mode Réalisateur (.html avec balise lang ou .docx avec balises XML), donc NVDA les lira avec la voix de la langue appropriée. En particulier, l'Inverseur et le Voyelliseur sonnent beaucoup plus intéressants dans le synthétiseur que lorsque vous les lisez avec vos yeux — car le cerveau lors de la lecture visuelle essaie automatiquement de « décoder » le texte, tandis que le TTS le lit exactement tel qu'il est écrit.

    Les six chiffres sont également décrits dans un langage plus large et accessible dans le fichier docs/dictionaries.pl.txt du package de l'application — avec des conseils sur la façon d'ajouter votre propre chiffre de type « substitution de lettres » sans connaissance en programmation (par exemple, langage argot scolaire, langue de bois).
  krok_5_detekcja_jezyka: |
    Détection de la langue

    Avant que le script ne "détériore" le texte, il vérifie dans quelle langue il est écrit. S'il détecte que ce n'est pas du polonais, il affichera un avertissement. Les règles phonétiques sont conçues pour le polonais — les appliquer à un texte dans une autre langue donnerait des résultats imprévisibles.
  krok_5_akcenty_nvda: |
    Accents optimisés pour les synthétiseurs locaux (NVDA)

    Les accents ont été conçus à 100 % pour les synthétiseurs-lecteurs d'écran locaux, gratuits et payants — Vocalizer et eSpeak dans NVDA. Cela garantit la stabilité et la prévisibilité du résultat sur chaque ordinateur.

    Pourquoi pas ElevenLabs ? Les tests sur des documents plus longs ont montré que la distorsion phonétique du texte dans des moteurs comme ElevenLabs n'impose pas l'accent souhaité — le moteur "devine" simplement la langue et en fait plutôt un accent slave occidental/sud. Les synthétiseurs locaux NVDA sont beaucoup plus obéissants à cet égard.
  krok_5_specyfika_tts: |
    Spécificité des synthétiseurs vocaux locaux (TTS)

    Différents moteurs TTS se comportent différemment. Voici les principales différences qui influencent directement le fonctionnement des accents :

    eSpeak (Open Source)
    Un moteur léger et gratuit avec une vaste base de langues — prend en charge notamment l'islandais. Très strict en matière de codage des caractères, ce qui le rend prévisible. Cependant, il présente des défauts phonétiques : il partage souvent des phonèmes entre les langues, ce qui fait que, par exemple, l'ukrainien sonne avec une teinte russe.
  krok_5_tiflotecnia: |
    Tiflotecnia Voices pour NVDA (voix Cerrence — anciennement Vocalizer de Nuance)

    Tiflotecnia Voices est le successeur direct de Vocalizer de Nuance — un moteur commercial avec des voix de nouvelle génération de la société Cerrence, distribué sous forme de paquet .nvda-addon dans le NVDA Add-on Store. L'ancien Vocalizer (bibliothèques .dll 32 bits de Nuance) a été abandonné avec NVDA 2026.1 ; Cerrence a recompilé les voix en 64 bits et Tiflotecnia les a publiées sous un nouveau nom. La qualité de la prononciation est sensiblement meilleure que dans la génération précédente.

    Comment installer : NVDA → Outils → Add-on Store → recherchez « Tiflotecnia Voices for NVDA » → Installer. Après l'installation, un sous-menu dédié « Tiflotecnia Voices » apparaîtra dans le menu NVDA ainsi qu'une catégorie propre dans les paramètres de NVDA. L'interface utilisateur du module complémentaire guide pas à pas à travers l'achat de la licence (ou l'activation d'une période d'essai de 7 jours), le choix et l'installation des premières voix (par exemple, la voix polonaise Ewa pour une lecture fluide des contrôles système, la voix finlandaise Satu pour les accents dans Polyglot). L'aide intégrée du module complémentaire est claire, donc nous ne répétons pas la procédure ici — il suffit de se laisser guider par le module complémentaire.

    Conseil pour ceux qui migrent de Vocalizer et Eloquence : une mise à niveau à un prix réduit est disponible. Procédure : après un paiement réussi, écrivez immédiatement un e-mail à l'adresse liée sur l'écran de succès du paiement et demandez la validation de l'ancien code d'activation — Tiflotecnia confirmera le droit à la réduction et ajustera le prix. Sans cet e-mail, le système vous considère comme un nouveau client.

    Disponibilité des voix : Tiflotecnia Voices prend en charge la plupart des langues que Vocalizer avait (y compris le polonais, l'anglais, l'allemand, le français, l'espagnol, le finlandais, l'italien, le russe). La liste des voix par langue est visible dans la catégorie des paramètres du module complémentaire avant l'achat de la licence.
  krok_5_onecore: |
    Microsoft OneCore
    Voix gratuites intégrées dans Windows (Mobile Voices). Un bon compromis entre qualité et disponibilité des langues. Offre une haute qualité et dispose d'un support pour la langue islandaise (Gudrun), finnoise (Heidi) et italienne (Elsa). Remarque : OneCore ne prend PAS en charge nativement le changement automatique de langue basé sur les balises lang (à moins que vous n'utilisiez le lecteur d'écran intégré du système, le narrateur) — voir la section ci-dessous.

    Comment télécharger les voix OneCore sur Windows ? Les voix OneCore sont gratuites, mais la plupart des langues ne sont pas installées par défaut. Pour télécharger les langues manquantes, allez dans Paramètres Windows → Heure et langue → Voix → Gérer les voix (ou "Ajouter des voix"). Sélectionnez la langue dans la liste (par exemple, Islandais, Finnois, Italien) et cliquez sur Télécharger. Après le téléchargement, la voix apparaîtra automatiquement dans NVDA — sans aucune configuration supplémentaire.
  krok_5_apple: |
    Apple (iPhone / iPad / Mac) — VoiceOver avec Vocalizer
    Sur les appareils Apple, le moteur Vocalizer est intégré nativement dans le système d'exploitation et prend en charge toutes les langues sans achats supplémentaires. Cependant, les versions compactes des voix sont installées par défaut et peuvent sembler un peu mécaniques. Pour obtenir un son bien meilleur et plus naturel, il est conseillé de télécharger les versions étendues ou premium :
    - Sur iPhone/iPad : Réglages → Accessibilité → VoiceOver → Voix → choisir la langue (p. ex. Finnois) → toucher le nom de la voix (p. ex. Satu) → vous verrez les options "Étendu" et "Premium". Téléchargez la version choisie — elle prend plus de place sur le disque, mais la différence de qualité est notable.
    - Sur Mac : Préférences Système (ou Réglages Système) → Accessibilité → VoiceOver → Ouvrir l'utilitaire VoiceOver → Voix → cliquez sur "Personnaliser" à côté de la voix choisie et téléchargez la version étendue ou premium.
  krok_5_android: |
    Android — Vocalizer payant pour chaque voix
    Sur Android, Vocalizer est disponible en tant qu'application sur le Google Play Store (recherchez "Vocalizer TTS"). Attention : chaque langue et voix est achetée séparément — il n'existe pas de licence unique pour tout. Avant l'achat, vous pouvez tester la voix pendant quelques minutes en mode démo. Après l'achat, la voix est associée à votre compte Google et peut être installée sur n'importe quel appareil utilisant le même compte.
  krok_5_tagi_jezykowe: |
    Killer Feature pour les malvoyants : Fichiers avec balises linguistiques

    C'est une véritable révolution. Les fichiers traités sont maintenant enregistrés comme suit :

    - .html avec un attribut lang (par exemple, lang="fi" pour le finnois) — NVDA lit cette balise et bascule automatiquement sur le synthétiseur vocal approprié. Zéro configuration manuelle !
    - .docx en conservant le formatage — chaque segment de texte a une balise linguistique injectée dans le XML du document, donc Word et NVDA savent quelle voix utiliser pour chaque partie.

    Les fichiers traités sont toujours enregistrés comme de NOUVEAUX documents (par exemple, accent_Finski.html).
  krok_5_auto_jezyk_nvda: |
    Automatisation du changement de langue dans NVDA — ce que vous devez savoir

    Pour que NVDA change effectivement de voix en fonction de la balise lang, le paramètre "Changer automatiquement de langue si pris en charge" doit être activé. Vous le trouverez dans Préférences NVDA → Voix. Par défaut, il est activé lors du premier lancement du lecteur d'écran — mais il est bon de vérifier si quelqu'un ne l'a pas désactivé.

    Limitation importante des voix OneCore : Les voix Microsoft OneCore ne prennent pas en charge ce mécanisme avec NVDA de manière native, mais uniquement avec le narrateur intégré de Windows. Il existe un module complémentaire non officiel pour NVDA appelé "One Core Autolang" qui tente de résoudre ce problème — mais son développement a été rapidement interrompu. La raison est simple : chaque année, avec la première version de NVDA de l'année, des changements rompent la compatibilité API (appelés API Breaking Changes). Parfois, il suffit de mettre à jour le champ "last tested version" dans le manifeste du module, mais parfois de véritables modifications du code sont nécessaires — et l'auteur ne parvient pas à suivre les mises à jour. Si vous tenez à l'automatisation du changement de langue, un choix plus sûr est Tiflotecnia Voices (payant, section ci-dessus) ou eSpeak (gratuit, de moindre qualité), qui prennent en charge ce mécanisme de manière native — mais attention : actuellement, dans Tiflotecnia Voices, cela fonctionne avec un bug de priorités (voir "Astuce critique" ci-dessous). Après avoir appliqué le patch, le changement automatique fonctionne parfaitement, comme dans l'ancien Vocalizer.
  krok_5_alarm_detekcja_jezyka: |
    Krytyczny problème avec Tiflotecnia Voices : détection de langue défectueuse

    D'abord, la bonne nouvelle — l'alerte concernant NVDA 2026.1 des versions précédentes du manuel s'est terminée par une fin heureuse : Cerrence a fourni des bibliothèques 64 bits, Tiflotecnia les a publiées dans un paquet .nvda-addon disponible dans l'Add-on Store (section ci-dessus), et Vocalizer, pour ceux qui l'ont conservé jusqu'à la fin, est revenu sous un nouveau nom — avec une meilleure qualité et sans les limitations 32 bits.

    Cependant, avec le lancement de Tiflotecnia Voices, un nouveau problème critique est apparu — dans la détection de langue. Dans les paramètres de l'extension, on peut configurer quelle voix doit être utilisée pour certaines lettres (par exemple, latines, cyrilliques) en fonction des voix installées. Le problème réside dans l'ordre des priorités : actuellement, on applique d'abord le remplacement par lettre, puis le retour au code ISO de la langue (en pratique inatteignable pour le MÊME alphabet auquel le remplacement s'est déjà adapté), et enfin la voix choisie. Le résultat apparaît au sein du même alphabet : vous avez un texte en finnois avec la balise correcte `lang="fi"`, Satu installée comme voix finnoise de Tiflotecnia, MAIS dans les paramètres, une voix polonaise est définie pour les lettres latines — Satu NE lira PAS ce texte, malgré la balise ISO correcte. Le remplacement par lettre « voix polonaise pour le latin » l'emporte au premier niveau, l'ISO `fi` n'est jamais vérifié. Pour les paires d'alphabets différents, le mécanisme fonctionne correctement (texte russe + Milena pour le cyrillique + voix polonaise pour le latin — tout le cyrillique est lu par Milena, les éventuels noms propres latins par la voix polonaise ; chaque alphabet reste dans son remplacement). Après la migration de Vocalizer, où le changement de langue basé sur l'ISO fonctionnait parfaitement, les utilisateurs remarqueront cette régression immédiatement — en particulier ceux qui utilisent plusieurs accents européens dans Polyglot (Satu, Alice, Markus) sur le même ensemble de lettres latines.

    Diagnostic et correctif : j'ai diagnostiqué le problème au niveau de Python dans le code de l'extension et préparé un correctif modifiant l'ordre des priorités en : ISO → voix choisie → remplacement par lettre. Le correctif conserve le changement utile vers le latin pour les noms latins dans un texte russe, lorsque l'option « détection de langue basée sur les caractères Unicode » est activée dans les paramètres. J'ai envoyé le correctif aux développeurs de Tiflotecnia — pour l'instant sans réponse, ils s'en tiennent donc très probablement à leur propre solution. Si l'extension reçoit une mise à jour, je mettrai le correctif à jour si nécessaire.

    Que faire en attendant : si vous tenez à une détection correcte de la langue (cela vaut la peine — c'était l'une des fonctionnalités phares de l'ancien Vocalizer, voir « Fonctionnalité phare pour les aveugles » ci-dessus), ouvrez un problème dans le dépôt de l'application sur GitHub avec l'étiquette `tiflotecnia-patch` et votre adresse email dans le contenu. Il vaut la peine d'ajouter une courte description du problème dans votre propre langue (2–3 phrases suffisent) — le bot détectera la langue (prises en charge : polonais, anglais, allemand, espagnol, finnois, français, islandais, italien, russe) et répondra dans la même ; sans description ou dans une autre langue, la réponse arrivera en anglais. Un bot automatique fermera immédiatement le problème avec une confirmation de soumission (sans trace dans le fil public), et vous recevrez le correctif par email généralement dans quelques jours. Le correctif lui-même N'EST PAS publié dans le dépôt de l'application ni comme Gist — Tiflotecnia Voices for NVDA est un logiciel commercial, et la licence de l'extension n'autorise pas la redistribution de ses fichiers, même modifiés. Après avoir reçu le correctif, son contenu doit être copié dans `%appdata%\Roaming\nvda\addons\TiflotecniaVoices`, en remplaçant les fichiers. Attention lors de la copie : si Windows n'a pas demandé de remplacement, vous avez probablement copié tout le dossier `TiflotecniaVoices_edits` avec son contenu AU LIEU du contenu lui-même — dans ce cas, entrez dans le sous-dossier créé, coupez tout, collez un niveau plus haut et écrasez. Après avoir appliqué correctement le correctif, redémarrez NVDA — vous profitez de la meilleure qualité des voix Cerrence 64 bits et de la détection correcte de la langue, soit une combinaison introuvable chez un seul fabricant sur le marché. Nous supposons bien sûr que vous avez une licence valide pour Tiflotecnia Voices — nous ne vérifions pas cela, mais vous ne pourrez pas appliquer le correctif sur un dossier étranger sans licence.
  krok_6_architekt: |
    ÉTAPE 6 : Architecte des Livres Audio

    Outil pour préparer une structure de fichier professionnelle pour les lecteurs d'écran et ElevenLabs. Accédez-y en cliquant sur le bouton "{main.btn.konwerter}" dans la barre de boutons ou en sélectionnant Outils → {main.menu.konwerter} dans le menu (raccourci : Ctrl+3).

    Comment ça fonctionne ?

    1. Entrez le chemin du fichier source dans le champ texte ou cliquez sur le bouton "Parcourir..." pour sélectionner un fichier dans la boîte de dialogue système. Le script accepte les fichiers .txt, .docx ainsi que les fichiers .html et .htm.
    2. Cliquez sur "{konwerter.btn_buduj}".
    3. Le script scanne chaque ligne de texte et remplace les mots-clés (Acte, Chapitre, Prologue, Épilogue, Introduction) par des en-têtes "Heading 1" dans le document Word.
    4. Les scènes (lignes commençant par le mot "Scène") sont transformées en texte en gras — visible dans le document, mais invisible dans la table des matières d'ElevenLabs.
    5. Tout le texte restant (dialogues, descriptions) est laissé inchangé.
    6. Vous recevrez un fichier architektura_[nom_original].docx — un document Word professionnel prêt pour un travail ultérieur. Par exemple, si votre fichier d'entrée s'appelait indifférence.txt, le fichier de sortie s'appellera architektura_indifférence.docx et apparaîtra dans le même dossier que l'original.

    Nettoyage en passant : Le script supprime automatiquement les balises HTML (si le texte provient d'un navigateur ou d'un fichier .html local, par exemple généré par Polyglotte) ainsi que les balises d'en-tête Markdown (par exemple ### ou ####) avant le traitement. Vous n'avez pas besoin de nettoyer le fichier manuellement.

    Mode Histoire : regroupement automatique des tours en scènes (à partir de la v15.1)

    Si vous chargez dans l'Architecte un fichier opowiesci/<gra>.txt généré par le module Histoires Interactives, le convertisseur reconnaîtra les marqueurs de tour (par exemple, « --- Tour 7 ---") dans 9 langues (Tour, Turn, Runde, Turno, Vuoro, Tour, Umferð, Turno, Ход) et insérera un nouvel en-tête de premier niveau toutes les cinq tours sous la forme « Scène N" (le numéro commence à 1, local pour chaque langue — en anglais "Scene N", en allemand "Szene N", etc.). Les autres marqueurs de tour sont supprimés — ils n'apparaissent pas dans la narration du livre audio, car « Tour 7" prononcé par TTS brise l'immersion de l'auditeur. Le résultat est un fichier Word avec une division naturelle en scènes de quelques minutes audio chacune, prêt à être importé dans ElevenLabs. Le mécanisme est auto-détectable — les fichiers audio classiques sans marqueurs de tour (narration classique du Réalisateur) sont traités exactement comme auparavant.

    Un avantage puissant pour les utilisateurs de NVDA et ElevenLabs

    Le formatage "Heading 1" pour les chapitres n'est pas seulement esthétique. Dans NVDA, vous pouvez naviguer rapidement entre les en-têtes en appuyant sur la touche H (ou 1 pour les en-têtes de premier niveau). Au lieu de faire défiler des centaines de pages, vous passez d'un chapitre à l'autre en une fraction de seconde. Cela change la façon de travailler avec de longs documents. Dans ElevenLabs, vous avez la garantie que le moteur insérera automatiquement des coupures et ne se bloquera pas lors de la réalisation de clips audio.
  krok_7_ksiega_swiata: |
    ÉTAPE 7 : Comment écrire le Livre du Monde (Prompt de l'Architecte et Mini-cours Markdown)

    L'intelligence artificielle alimentant le Studio Principal comprend le mieux les commandes lorsqu'elles sont formatées en langage de balisage Markdown. Si vous fournissez à l'IA dans le Réalisateur seulement une idée vague (par exemple, "deux sœurs dans l'au-delà"), la machine paniquera par manque de détails et créera une histoire banale et prévisible, ignorant la logique.

    Pour éviter cela, utilisez un chatbot externe (par exemple, le ChatGPT ou Claude gratuit) comme votre Architecte personnel. Dans la version 13.0, vous n'avez plus besoin de recopier le prompt à partir des instructions — dans le panneau du Réalisateur, juste en dessous du bouton «{rezyser.btn_zapisz_ksiege_label}», vous trouverez le bouton «{rezyser.btn_prompt_architekta_label}». Cliquez dessus, et une fenêtre de dialogue s'ouvrira avec le texte du prompt prêt dans un champ «lecture seule» ainsi qu'un bouton «Copier dans le presse-papiers». NVDA annonce tout le contenu dès l'ouverture de la fenêtre — il suffit de cliquer sur «Copier», de coller (Ctrl+V) dans ChatGPT/Claude et de remplacer le segment «[INSÉREZ VOTRE IDÉE ICI]» par votre propre ébauche d'intrigue.

    Pourquoi ainsi, et non par copie depuis les instructions ? Le dialogue dans l'interface graphique a un avantage clé en termes d'accessibilité : il est natif et lu sans perturbation par le lecteur d'écran, ne nécessite pas de basculer vers un éditeur de texte (où les accents français et les guillemets peuvent être mal copiés) et fonctionne de manière identique sur chaque système d'exploitation. Le même modèle — un dialogue avec un prompt à copier — est également utilisé dans le Gestionnaire de Règles (voir ÉTAPE 7b ci-dessous).

    Comment l'IA répond : Vous recevrez une réponse en deux parties. La première est le Livre du Monde enfermé dans un bloc de code Markdown (balises ```markdown … ```). Copiez UNIQUEMENT le contenu du bloc de code (sans les balises ```) et collez-le dans le champ «Livre du Monde» dans le Réalisateur, puis cliquez sur «{rezyser.btn_zapisz_ksiege_label}». La deuxième partie est une recommandation sur lequel des modes créatifs (Script ou Audiobook) convient le mieux à votre idée — considérez-la comme une suggestion lors de la sélection du mode dans le RadioBox.

    Mini-cours Markdown dans le Livre : un seul hashtag (#) est une section principale (par exemple, «# Personnages»), un double hashtag (##) est une sous-section, les tirets (-) créent des listes, et les doubles astérisques (**texte**) mettent en gras les règles absolues et inviolables (par exemple, «**Le héros NE ment JAMAIS**»). Pour un personnage parlant une langue étrangère, ajoutez une étiquette avec l'accent, par exemple, «[Speaker 1: Marek] - a un accent polonais». Le mot-clé «accent» est NÉCESSAIRE — le moteur de l'application le détecte automatiquement et applique les règles phonétiques correctes aux dialogues du personnage.

    Astuce : N'oubliez pas de mettre à jour régulièrement votre Livre du Monde (avec l'expansion de l'intrigue à de nouveaux lieux ou personnages importants). Vous pouvez le faire manuellement ou avec l'aide d'un chatbot externe. Plus le fondement est riche, meilleurs seront les résultats en Réalisation !
  krok_7b_manager_regul: |
    ÉTAPE 7b : Gestionnaire de Règles (Ctrl+4) — dictionnaires pour les linguistes sans Python

    La version 13.0 introduit un quatrième outil dans la barre : le Gestionnaire de Règles. Vous l'ouvrez avec la touche Ctrl+4 ou depuis le menu Outils. C'est un explorateur visuel du dossier dictionaries/, où l'application stocke toutes les règles phonétiques (accents), les chiffres et les modes du Réalisateur dans des fichiers YAML (format lisible par l'homme, plus simple que JSON).

    Pourquoi utiliser YAML ? Jusqu'à la version 12.0, tous les accents, modes créatifs et filtres étaient « intégrés » dans le code Python. Ajouter un nouvel accent nécessitait un programmeur. Dans la version 13.0, tout a été déplacé vers des fichiers .yaml dans le dossier dictionaries/ — toute personne capable d'ouvrir le Bloc-notes peut ajuster un accent existant (« remplacer sz par sh par sch ») ou en ajouter un complètement nouveau (suédois, danois, dialecte russe).

    Ce que vous trouverez dans le Gestionnaire de Règles :
    - Arborescence des fichiers — liste complète de tous les fichiers YAML dans dictionaries/ avec une répartition par langues sources (actuellement complètement implémentées : {lista_kompletnych_jezykow_natywnie}) et catégories (akcenty/, szyfry/, rezyser/, opowiesci/, gui/). Navigation avec les flèches comme dans l'Explorateur de fichiers Windows, support complet de NVDA.
    - Bouton « {manager.btn_otworz_label} » — ouvre le fichier sélectionné dans le Bloc-notes par défaut du système. Vous éditez, enregistrez, cliquez sur « {manager.btn_odswiez_label} » et c'est prêt.
    - Bouton « {manager.btn_duplikuj_label} » — le moyen le plus rapide pour un nouvel accent : vous prenez un fichier existant (par exemple finski.yaml), donnez un nouveau nom (par exemple suédois), le Gestionnaire crée une copie avec le commentaire « changez les champs étiquette et description » et l'ouvre dans l'éditeur.
    - Bouton « {manager.btn_nowy_label} » — assistant avec choix du type (accent, chiffre, mode Réalisateur, nouvelle langue source, chiffre algorithmique). Pour les cas simples (accent, chiffre de type « remplacement de lettres »), l'assistant crée un modèle YAML prêt à éditer. Pour les cas nécessitant un programmeur (nouvelle langue source, algorithme de type « mélange du milieu des mots »), l'assistant génère une invite pour le chatbot AI — vous collez dans ChatGPT, obtenez un fichier YAML prêt, enregistrez dans dictionaries/ et c'est prêt.

    Application pratique : Vous voulez ajouter un accent suédois ? Ouvrez le Gestionnaire de Règles, choisissez dictionaries/pl/accents/finski.yaml, cliquez sur « Dupliquer », nommez le fichier suédois, changez dans celui-ci le champ étiquette en "Suédois (Alva / Oskar)", le code iso en sv, modifiez quelques règles de remplacement et enregistrez. Retournez à la Page d'accueil et relancez l'application. Le nouvel accent apparaîtra dans le menu Polyglotte (en Mode Réalisateur) et — si vous l'ajoutez au Livre du Monde des personnages (« [Marek] - a un accent suédois ») — également dans la détection automatique des accents du Réalisateur.

    Où chercher plus de documentation sur le dossier dictionaries/ :
    - Fichier `docs/dictionaries.pl.txt` (disponible dans le package pour les utilisateurs finaux depuis l'onglet Releases) — description courte, en langage simple, de chaque sous-dossier, 6 chiffres prêts, 8 accents prêts et des idées de ce que vous pouvez faire vous-même, sans connaissance de Python.
    - Fichier `dictionaries/README.md` (disponible uniquement lors du clonage du dépôt depuis GitHub — les packages de distribution filtrent les fichiers .md) — documentation technique détaillée du format YAML avec des exemples, des listes de champs, des règles de pipeline, des regex. Ce document est destiné aux linguistes connaissant les bases de la programmation ainsi qu'aux développeurs.

    ### Liste des accents disponibles
    - Anglais (Samantha/Mark dans Vocalizer, Zira/Hazel dans OneCore)
    - Finnois (Satu/Mikko dans Vocalizer, Heidi dans OneCore)
    - Italien (Alice/Luca dans Vocalizer, Elsa dans OneCore)
    - Polonais (Ewa dans Vocalizer, Paulina dans OneCore)
    - ...

    ### Chiffre : Inverseur de texte
    L'Inverseur de texte traite les abréviations françaises avant d'inverser la phrase — sans expansion, les abréviations avec points se transformeraient en non-sens phonétique (exemple français : ".xe").

    Liste des abréviations françaises :
    - "p. ex." → "par exemple"
    - "c.-à-d." → "c'est-à-dire"
    - "etc." → "et cetera"
    - "M." → "Monsieur"
    - "Dr" → "Docteur"

    Exemple de non-sens : ".xe"

    ### Chiffre : Typoglycémie
    Selon une étude à l'Université de Cambridge, peu importe l'ordre des lettres dans un mot, la seule chose importante est que la première et la dernière lettre soient à la bonne place.

    Trdaon une édtue à l'Ueivnrsité de Cgabrmide, peu ipomrtte l'odre des ltteers dans un mot, la sléeu chsoe ipmoratnte est que la piremère et la draineère ltteer soient à la bnoe palce.
  nvda_a11y: |
    Ważne wskazówki dla użytkowników czytników ekranu (NVDA)

    1. Komunikaty o sukcesie i błędach

    Lorsque l'application termine une action (par exemple, enregistre un fichier ou rencontre une erreur), une boîte de dialogue apparaît avec un titre tel que "Succès", "Avertissement" ou "Erreur". NVDA annoncera immédiatement cette fenêtre et lira son contenu. Vous n'avez rien à faire — les dialogues sont entièrement accessibles au clavier, et le focus se place automatiquement sur le bouton "OK". Il n'y a plus de ruses avec le préfixe "Alerte" — les boîtes de dialogue natives wxPython sont directement prises en charge par le lecteur d'écran.

    2. Avertissement important : traitement silencieux en arrière-plan

    Après avoir cliqué sur des boutons tels que "{rezyser.btn_wyslij_label}" ou "{poliglota.btn_process}", le programme commence immédiatement le traitement en arrière-plan. Une barre de progression (Gauge) apparaît à l'écran, mais NVDA NE lit PAS sa valeur en temps réel — le lecteur d'écran reste silencieux pendant le travail. Ne cliquez pas à nouveau sur le bouton. Attendez qu'une boîte de dialogue avec le résultat ou un message d'erreur apparaisse — NVDA l'annoncera automatiquement.

    3. Navigation entre les outils

    La navigation entre les outils (Réalisateur, Polyglotte, Convertisseur, Gestionnaire de Règles) se fait dans une seule fenêtre de programme à l'aide de quatre boutons sur la barre d'outils ou via le menu Outils (Alt, puis N). Raccourcis clavier disponibles : Ctrl+0 (Page d'accueil), Ctrl+1 (Réalisateur), Ctrl+2 (Polyglotte), Ctrl+3 (Convertisseur), Ctrl+4 (Gestionnaire de Règles — nouveauté en 13.0). Après avoir changé d'outil, le focus se place automatiquement sur la description du nouveau module — NVDA commence immédiatement à lire la nouvelle vue.

    4. Ordre de tabulation et noms des widgets

    Chaque élément de l'interface a un nom français lisible — NVDA le lira lorsqu'il sera focalisé. L'ordre de tabulation est logique : de la description de l'outil, en passant par les champs de configuration, jusqu'aux boutons d'action. Il n'y a pas de surprises ici — la navigation au clavier fonctionne comme dans n'importe quel autre programme natif Windows. Tous les menus et boutons sont en français et NVDA les lira avec une voix française sans aucun réglage supplémentaire.
  changelog_9: |
    Notes importantes pour la version 9.0 / Changelog

    Nouvelles fonctionnalités et changements dans la version 9

    Sauvegarde de la progression de traduction résistante aux plantages (CHANGEMENT — correction d'un bug critique)
    Dans la version 8, la reprise d'une traduction interrompue cachait un piège silencieux et destructeur : si l'utilisateur suivait les instructions (en découpant manuellement le fragment déjà traduit) puis reprenait immédiatement la traduction du reste, l'application ouvrait le fichier de sortie en mode écrasement — effaçant irrémédiablement et inconsciemment toute la progression payée. Dans la version 9, l'ensemble du mécanisme a été repensé. Chaque bloc traduit est désormais immédiatement enregistré dans un fichier temporaire (.jsonl) avec un index attribué. La reprise est entièrement automatique — l'application détecte elle-même le fichier et restaure la progression sans aucune intervention de l'utilisateur. Une fois l'opération terminée avec succès, le fichier temporaire est automatiquement supprimé.

    Réparateur de Balises dans le Mode Réalisateur (NOUVEAUTÉ)
    Une nouvelle option a été ajoutée au menu du Mode Réalisateur — le Réparateur de Balises. Il injecte dans le fichier uniquement le code de langue ISO à deux lettres indiqué par l'utilisateur, sans appliquer aucune règle phonétique ni nettoyage. C'est un outil de secours au cas où un fichier déjà prêt serait sorti avec une balise de langue incorrecte ou manquante.

    Conversion automatique de .txt en .html dans le Mode Traducteur (CHANGEMENT)
    Les fichiers texte (.txt et .md) traduits par le Traducteur IA sont désormais automatiquement enregistrés au format .html avec une balise de langue intégrée. Ainsi, NVDA lit immédiatement le fichier avec la voix correcte — sans aucune étape supplémentaire de la part de l'utilisateur.

    Nommage intelligent du fichier dans l'Architecte (CHANGEMENT)
    L'Architecte des Livres Audio n'enregistre plus le fichier résultant toujours sous le même nom architektura_gotowa.docx. Désormais, le nom dérive du fichier d'entrée — par exemple, pour znieczulica.txt, le fichier résultant est architektura_znieczulica.docx. Le fichier apparaît dans le même dossier que l'original.

    Fonctionnalités conservées sans changement depuis la version 8

    Retour au format .txt pour les fichiers de projet (CHANGEMENT)
    Les fichiers de projet et les résumés sont désormais enregistrés au format .txt au lieu de .md (Markdown). L'expérience du format .md comme barrière psychologique contre la modification s'est révélée inefficace — l'IA enfreint souvent et notoirement la règle anti-closure, et il vaut souvent mieux modifier le fichier à la volée puis recharger la mémoire afin que l'IA, dans la mesure du possible, ne reçoive pas une permission cachée de violer l'interdiction. Le format .txt est plus intuitif et lisible pour tous.

    Règle du Monteur — nouvel avertissement
    Dans les instructions (et dans les futures versions de l'interface), un avertissement clair a été ajouté, expliquant ce qui peut et ne peut pas être modifié dans les fichiers de projet. L'utilisateur a pleinement le droit de modifier les dialogues et le contenu, mais ne peut absolument pas modifier les lignes de structure (Acte, Scène, Chapitre, Prologue, Épilogue) — leur détérioration perturbe la navigation NVDA, le découpage dans ElevenLabs et la table des matières dans Word.

    Prompt de l'Architecte mis à jour (CHANGEMENT)
    Le prompt pour le chatbot externe (ChatGPT/Claude) a été repensé. Au lieu de renvoyer du code Markdown brut, l'IA renvoie maintenant la réponse en deux parties clairement séparées : la Partie 1 est le Livre du Monde enfermé dans un bloc de code Markdown (facile à copier sans les marqueurs), et la Partie 2 est la Recommandation de Mode sous forme de texte simple en dehors du bloc — elle conseille s'il vaut mieux utiliser le Mode Script Brut ou le Mode Audiobook Traditionnel. La description des balises de personnage a également été modifiée : au lieu de « sonores », on parle désormais de l'accent et du ton de la voix dans la balise, par ex. [Speaker 1: Nom] - zézaie et accent français.

    Explication du statut de la directive Anti-Closure (DOCUMENTATION)
    Les instructions incluent désormais une explication franche du fait que, malgré les interdictions Anti-Closure intégrées, le modèle enfreint toujours notoirement cette règle, en particulier dans le Mode Audiobook. Au lieu de cacher ce problème, la version 8 met les choses au clair et renvoie la responsabilité de la « clôture manuelle » au Réalisateur — d'où la Règle du Monteur comme outil de travail officiel et le retour au format texte ordinaire.

    Fonctionnalités conservées sans changement depuis la version 7

    Prompts Showrunner — Directive Anti-Closure (Réalisation — tous les modes)
    Les trois modes de Réalisation conservent les directives showrunner intégrées. Le Brainstorming agit comme un scénariste de série à plusieurs saisons. Le Mode Script Brut et le Mode Audiobook ont l'interdiction de terminer le texte par des résumés, des morales et des clôtures narratives — sauf lorsque l'utilisateur demande explicitement un final ou un épilogue.

    Gestion des Actes et des Scènes en temps réel (Réalisation — Mode Script)
    Le Mode Script Brut dispose d'un panneau avec les boutons « Insérer Acte X » et « Insérer Scène X ». Les compteurs se mettent à jour automatiquement. Le chargement d'un fichier existant règle les deux compteurs sur les bons numéros.

    Nettoyage des didascalies de mise en scène entre parenthèses (Polyglot — Mode Réalisateur)
    Le script supprime des fragments de texte entiers placés entre parenthèses (par ex. « (en chuchotant) », « (avec des respirations entrecoupées) »). ElevenLabs ne lit que les dialogues et la narration.

    Mémoire Infinie et Résumé Automatique (Réalisation — Accumulateur d'Intrigue)
    Lorsque l'indicateur de mémoire passe en état d'alerte rouge, le Brainstorming génère automatiquement un résumé de l'intrigue et l'enregistre dans le champ de Mémoire à Long Terme. Cliquer sur « Enregistrer le Résumé (de façon permanente) » crée un fichier _streszczenie.txt. Après avoir vidé la mémoire et chargé le résumé, vous pouvez continuer l'histoire sans aucune restriction de longueur.

    Architecte des Livres Audio
    L'outil prend en charge les mots-clés Acte, Chapitre, Prologue, Épilogue et Générique comme en-têtes de premier niveau. Les scènes sont converties en texte gras. Le script nettoie automatiquement les balises HTML et les marqueurs Markdown avant le traitement.

    Gestion Intelligente des Chapitres (Mode Audiobook)
    Un panneau dédié avec des boutons pour insérer Prologue, Épilogues et coupes de chapitre directement depuis l'interface. Le compteur de chapitres se met à jour automatiquement. Le chargement d'un fichier existant règle le compteur sur le bon numéro sans comptage manuel.

    Attribution de Titres aux Chapitres (Postproduction — Mode Audiobook)
    Le module parcourt les chapitres du fichier enregistré et leur attribue un titre court et littéraire à l'aide d'un modèle d'IA rapide, en analysant uniquement les débuts de chaque chapitre.

    Fonctionnalités supprimées (inchangées depuis la version 7)

    Carte des Coupes (Mode Script) — remplacée par le panneau de gestion des Actes et des Scènes en temps réel.
    Adaptation du Script en Audiobook (Mode Script) — supprimée pour des raisons financières. Le flux de travail générait trois coûts distincts : la génération du script, le résumé éventuel en cas de dépassement de la mémoire et, enfin, la régénération de l'ensemble en prose d'audiolivre. Nous recommandons d'écrire directement en Mode Audiobook Traditionnel dès le départ.


    Fonctionnalités de la version 10.0 (conservées sans changement dans les versions 11.0 et 12.0)

    - Générateur automatique du fichier de configuration golden_key.env intégré directement dans l'interface principale de l'application. L'utilisateur n'a plus besoin de créer le fichier manuellement ni de se soucier du piège de l'extension .txt — un seul clic sur le bouton disponible sur l'écran d'accueil, et le système crée un fichier propre et prêt au bon endroit.
    - Suppression complète du script obsolète napraw_api.bat, qui n'est plus nécessaire. Le problème que ce script résolvait (extension de fichier incorrecte attribuée par le Bloc-notes) est désormais totalement éliminé grâce au générateur intégré.
    - Multi-livres du Livre du Monde — chaque projet possède désormais son propre fichier de lore (NOUVEAUTÉ). Auparavant, il existait un seul fichier partagé, moje_lore.md, qui était chargé à chaque lancement de l'application — quel que soit le projet sur lequel vous travailliez. Depuis la version 10, le Livre du Monde est étroitement lié au nom du fichier de projet : si votre histoire est skrypty/emilia_heist_audiobook.txt, son Livre est skrypty/emilia_heist_audiobook.md. Le bouton « Enregistrer le Livre de façon permanente » est grisé tant que vous n'avez pas saisi le nom du fichier — l'ordre est intentionnel et imposé par l'interface. Cliquer sur « Charger l'histoire » charge automatiquement le fichier .md correspondant depuis le disque, s'il existe. Le changement a aussi une dimension organisationnelle pratique : vous pouvez désormais mener plusieurs projets simultanément, chacun avec ses propres règles du monde isolées et sa propre liste de personnages — sans risquer qu'Emilia du casse du coffre-fort se retrouve soudain dans un opéra spatial.
  changelog_11: |
    Nouvelles fonctionnalités et changements dans la version 11.0

    - Nouveaux accents dans Polyglot (NOUVEAUTÉ — quatre nouvelles langues européennes). Quatre nouvelles options de "détérioration" phonétique du texte ont été ajoutées au menu du Mode Réalisateur : Anglais (Samantha / Mark / Zira / Hazel), Allemand (Stefan / Markus / Katja / Hedda), Espagnol (Jorge / Monica / Helena), Polonais (Ewa / Paulina). Chaque nouvel accent injecte automatiquement le code ISO approprié (en, de, es, pl) dans le fichier .html ou .docx généré — NVDA utilisera immédiatement la voix correcte pour le texte traité.

    - Cross-platform : Support pour macOS et Linux (MODIFICATION de la documentation). La section "Première exécution" a été entièrement réécrite. Elle distingue maintenant trois parcours : les utilisateurs finaux Windows téléchargent un paquet ZIP prêt à l'emploi depuis l'onglet Releases et exécutent run.bat ; les développeurs Windows configurent l'environnement via setup_dev.bat ; les utilisateurs macOS et Linux configurent l'environnement via ./setup_dev.sh et exécutent ./run.sh. (Remarque : dans les versions 11.x–13.0, ces scripts portaient des noms différents — `Uruchom_Rezysera.bat`, `skonfiguruj_dev.bat`, `skonfiguruj_dev.sh`, `uruchom_rezysera.sh` — ils ont été renommés en équivalents anglais dans la version 13.1 car les développeurs étrangers clonant le dépôt signalaient que les noms de fichiers polonais compliquaient la saisie des commandes dans le terminal.)

    - Dossier runtime/ — explication du statut (DOCUMENTATION). La section "Première exécution" contient maintenant une explication explicite que le dossier runtime/ (environnement Python pour les paquets ZIP) est distribué uniquement dans les paquets prêts à l'emploi pour Windows depuis l'onglet Releases. Dans le dépôt Git, ce dossier n'existe pas et ne devrait pas exister.

    - Mise à jour des noms des synthétiseurs dans le menu Polyglot (MODIFICATION). Les noms des voix dans le menu selectbox pour les langues existantes ont été mis à jour : l'Italien a maintenant également Luca (Vocalizer), le Finnois a maintenant également Mikko (Vocalizer). L'Islandais a conservé le nom sans caractères diacritiques (Gudrun au lieu de Gudrun avec le signe eth) pour une meilleure compatibilité.

    Fonctionnalités conservées sans changement depuis la version 10

    - Générateur automatique de fichier golden_key.env intégré dans l'interface.
    - Multi-livre du Livre du Monde (chaque projet a son propre fichier .md avec les règles du monde).
    - Mécanisme de reprise de traduction résistant aux pannes (enregistrement en .jsonl).
    - Correcteur de Tags en Mode Réalisateur (injection de code ISO).
  changelog_12: |
    Nouvelles fonctionnalités et modifications dans la version 12.0 — Release Candidate

    - Révision complète de l'interface utilisateur (CHANGEMENT ARCHITECTURAL). L'application n'est plus un outil web fonctionnant dans un navigateur. Toute l'interface a été réécrite à partir de zéro en tant qu'application de bureau native basée sur le framework wxPython. Il n'y a plus de serveur local, plus de navigateur, plus de fenêtre de terminal fonctionnant en arrière-plan — il y a une seule fenêtre normale du programme. Le point d'entrée est main.py.

    - Barre de navigation avec raccourcis clavier (NOUVEAUTÉ). Les outils se changent par trois boutons sur la barre (Réalisateur, Polyglotte, Convertisseur) ou via le menu Outils. Raccourcis clavier disponibles : Ctrl+0 (Page d'accueil avec vérification du système), Ctrl+1 (Réalisateur), Ctrl+2 (Polyglotte), Ctrl+3 (Convertisseur). L'outil actif est visuellement mis en évidence par un bouton en gras.

    - Optimisation complète pour les lecteurs d'écran dès le départ (NVDA, VoiceOver). Chaque widget a un nom d'accessibilité clair en polonais. Le focus, après le changement d'outil, se place automatiquement sur la description du module — NVDA commence immédiatement à lire la nouvelle vue. Les dialogues wx.MessageBox sont annoncés nativement par le lecteur d'écran sans aucun truc. L'ordre des tabulations est logique et cohérent dans toute l'interface. Les limitations historiques de Streamlit et du framework React disparaissent.

    - Pas de configuration de pare-feu réseau (CHANGEMENT). L'élimination du serveur web local signifie que le pare-feu Windows n'affiche plus de fenêtre demandant l'autorisation d'accéder au réseau lors du premier lancement. L'application se lance simplement.

    - Fenêtres de dialogue de sélection de fichiers natives (NOUVEAUTÉ). Les modules Polyglotte et Convertisseur possèdent désormais un bouton "Parcourir..." qui ouvre le dialogue de sélection de fichier du système au lieu de saisir manuellement le chemin.

    - Protection du mode créatif (NOUVEAUTÉ). Dans le Réalisateur, il n'est plus possible de changer accidentellement le mode de travail (par exemple, d'Audiobook à Script) lorsque la mémoire est occupée — l'interface bloque le changement vers un autre mode d'enregistrement tant que l'historique ou le résumé n'est pas effacé. Le mode Brainstorming est toujours disponible.

    - Bouton de Réinitialisation Dure dans le Réalisateur (NOUVEAUTÉ). Un nouveau bouton "Fermer le Projet (Réinitialisation Dure)" permet de nettoyer tout le projet d'un seul clic : historique, résumé, Livre du Monde et tous les compteurs — sans avoir à réinitialiser manuellement chaque champ séparément.

    - Chargement automatique du mode créatif (NOUVEAUTÉ). Lors du chargement d'un projet, l'application restaure automatiquement le dernier mode de travail utilisé (Script ou Audiobook) à partir du fichier de métadonnées géré par l'application. Ainsi, lors de la réouverture du projet, le RadioBox se règle automatiquement — vous n'avez pas besoin de vous souvenir du mode dans lequel vous travailliez.

    Fonctionnalités inchangées depuis la version 11.0

    - Accents phonétiques dans le Polyglotte (Anglais, Polonais, Allemand, Espagnol, Italien, Finnois, Islandais).
    - Générateur automatique de fichier golden_key.env intégré dans l'écran de démarrage.
    - Multilivres du Livre du Monde (chaque projet a son propre fichier .md).
    - Mécanisme de reprise de traduction résistant aux pannes (enregistrement en .jsonl).
    - Correcteur de Tags dans le Mode Réalisateur (injection de code ISO).
    - Toutes les fonctionnalités AI : Brainstorming, Script, Audiobook, Accumulateur de Scénario, Mémoire Infinie, Attribution de Titres.
  changelog_13: |
    Nouvelles fonctionnalités et modifications de la version 13.0 — Release Candidate

    - Refactorisation en YAML — accents, chiffres et modes du Réalisateur dans des fichiers texte (CHANGEMENT ARCHITECTURAL, le plus grand depuis la migration vers wxPython). Jusqu'à la version 12.0, toutes les règles phonétiques (accents) et les modes créatifs du Réalisateur (Tempête, Script, Livre audio, postproduction des titres) étaient "encodés" dans le code Python en tant que constantes, fonctions et chaînes de prompt rigides, et toute une catégorie de chiffres/jeux de texte n'existait tout simplement pas — ils sont introduits avec la refactorisation 13.0. Dans la version 13.0, tout cela se trouve dans des fichiers .yaml dans le nouveau dossier `dictionaries/` — le moteur (`core_poliglota.py`, `core_rezyser.py`, `przepisy_rezysera.py`) les charge dynamiquement au démarrage. Effet pratique : ajouter un nouvel accent, un nouveau chiffre basé sur des substitutions ou changer le son du prompt système pour un mode du Réalisateur ne nécessite pas de connaître Python — un éditeur de texte suffit. Une brève description pour les utilisateurs finaux se trouve dans `docs/dictionaries.pl.txt` (inclus dans les paquets des Releases) ; la documentation technique complète du format — dans `dictionaries/README.md` (uniquement dans le dépôt Git, car les paquets de version filtrent les fichiers .md).

    - Gestionnaire de Règles — quatrième outil dans la barre (NOUVEAUTÉ, Ctrl+4). Explorateur visuel du dossier `dictionaries/` avec un arbre de fichiers YAML (wx.TreeCtrl natif, support complet NVDA) et un ensemble d'actions : « Ouvrir dans un éditeur de texte », « Nouveau fichier de règles... » (assistant avec choix du type : accent, chiffre, mode, nouvelle langue), « Dupliquer le fichier sélectionné », « Supprimer le fichier », « Rafraîchir l'arbre ». Pour les cas dépassant les simples substitutions (nouvelle langue de base, chiffre algorithmique), l'assistant génère un prompt prêt à être copié pour le chatbot AI — explication complète dans la nouvelle ÉTAPE 7b.

    - Prompt de l'Architecte directement dans le panneau du Réalisateur (CHANGEMENT A11y). Jusqu'à présent, le prompt pour le chatbot externe pour générer le Livre du Monde n'existait que dans cette instruction — l'utilisateur devait le copier à partir d'un fichier texte (ce qui peut être problématique avec les lecteurs d'écran pour les caractères polonais et les guillemets). Dans la version 13.0, le panneau du Réalisateur dispose d'un nouveau bouton « 📖 Prompt de l'Architecte pour AI... » (juste en dessous de « Enregistrer le Livre de manière permanente »), qui ouvre une fenêtre de dialogue native avec le texte complet du prompt dans un champ READONLY et un bouton séparé « Copier dans le presse-papiers ». Le modèle A11y est identique à celui du dialogue de résultats de l'assistant dans le Gestionnaire de Règles — NVDA lit immédiatement tout le contenu de la fenêtre sans configuration supplémentaire. Description complète dans l'ÉTAPE 7 mise à jour.

    - Accent russe dans le Polyglotte (NOUVEAUTÉ — huitième langue européenne dans le menu du Mode Réalisateur). L'option « Russe (p. ex. Milena / Irina / Yuri / Pavel) » est ajoutée à la liste déroulante « Mode Réalisateur / Accents ». Contrairement aux autres accents, qui ne font que « déformer » le texte polonais au niveau des lettres latines (p. ex. « sz » → « sh », « w » → « v »), l'accent russe effectue une translittération complète du texte polonais en cyrillique — permettant ainsi aux voix synthétisées TTS russophones (Vocalizer Milena, OneCore Irina / Pavel / Yuri, eSpeak « ru ») de « prononcer » les mots. Le mappage a été enrichi avec des voyelles iotisées (« ja » → « я », « je » → « е », « jo » → « ё », « ju » → « ю »), des adoucissements polonais si/ci/ni/zi + voyelle (p. ex. « ciocia » → « цёця »), ainsi que des digrammes spéciaux russes : « ść » / « szcz » → « щ », « sz » → « ш », « cz » → « ч », « rz » → « ж », « ch » → « х ».

      Remarque phonétique : L'accent n'est pas une translittération académique russe (ISO 9, GOST, BGN/PCGN). Le but est uniquement de rendre le texte polonais phonétiquement similaire au russe — pour les besoins de la synthèse vocale, pas pour une translittération sérieuse des noms propres. Pour ce dernier travail, utilisez des outils linguistiques dédiés.

      Code langue pour le fichier de sortie : « ru » (ISO 639-1). NVDA avec l'option « Changer automatiquement de langue lorsque pris en charge » activée passera immédiatement à la voix russe.

    - Remarque sur « ź » : En russe, il n'y a pas d'équivalent exact du « ź » polonais, donc ce caractère est normalisé en « ж » — tout comme « ż ». Certains dialectes du nord de la Russie et le biélorusse prononcent « ź » plus proche de « зь », mais du point de vue du synthétiseur vocal, la différence est négligeable. Si un linguiste préfère « зь », il peut remplacer cette règle dans le fichier `dictionaries/pl/akcenty/rosyjski.yaml` — le moteur charge les YAML de manière dynamique, donc cela ne nécessite pas de recompilation de l'application.

    - Barre de navigation étendue et menu Outils (CHANGEMENT). La barre a maintenant un quatrième bouton — Gestionnaire de Règles — et le menu « Outils » prend en charge le nouveau raccourci Ctrl+4. Les raccourcis existants (Ctrl+0 Accueil, Ctrl+1 Réalisateur, Ctrl+2 Polyglotte, Ctrl+3 Convertisseur) restent inchangés.

    Fonctionnalités conservées sans changement depuis la version 12.0

    - Interface graphique native de bureau basée sur wxPython (sans navigateur, sans serveur local).
    - Barre de navigation avec raccourcis clavier (maintenant Ctrl+0/1/2/3/4 — ajout de Ctrl+4 pour le Gestionnaire de Règles).
    - Optimisation complète pour les lecteurs d'écran (NVDA, VoiceOver) — noms d'accessibilité en polonais, ordre correct des tabulations.
    - Protection du mode créatif contre les modifications accidentelles pendant le travail.
    - Réinitialisation complète du projet en un clic dans le Réalisateur.
    - Chargement automatique du mode créatif à partir du fichier de métadonnées du projet.
    - Tous les accents des versions précédentes (Anglais, Polonais, Allemand, Espagnol, Italien, Finnois, Islandais) ainsi que le Correcteur de Tags.
    - Fonctions AI complètes : Brainstorming, Script, Livre audio, Accumulateur d'Intrigue, Mémoire Infinie, Attribution de Titres.
  krok_7b_manager_regul_kolejnosc_zamian: |
    ÉTAPE 7b (complément) : L'ordre des règles `remplacement:` est important

    Les fichiers dans `dictionaries/<kod>/accents/*.yaml` contiennent une liste de règles `remplacement:` — des paires `modèle → remplacement` que le moteur applique SÉQUENTIELLEMENT. Chaque règle suivante opère sur la sortie de la précédente. Cela permet de construire des pipelines du type « décomposer le digramme `szcz` en `shch`, puis remplacer `ch` par `h` », mais cela ouvre également le piège classique pour l'auteur du pack linguistique.

    Le piège de la « boucle séquentielle ». Supposons que pour un accent espagnol visant à faire ressembler le « ñ » polonais à la prononciation de Diego (Loquendo), l'auteur ajoute deux règles :
    1. `ñ → nj` (pour que le « ñ » polonais sonne comme un « nj » doux)
    2. `j → x` (pour que le « j » polonais sonne comme le « j » espagnol — phonétiquement /x/)

    Après exécution, il s'avère que les mots avec « ñ » sont prononcés comme « nx », pas « nj ». Pourquoi ? Parce que lorsque la première règle remplace « ñ » par « nj », le nouveau « j » est immédiatement capturé par la deuxième règle et remplacé par « x ». Résultat : au lieu de l'intention « ñ → nj », nous obtenons « ñ → nx ».

    Règle de l'ordre (universelle). Lorsque qu'une règle introduit un caractère qu'une autre règle a comme modèle, L'ORDRE COMPTE. Une heuristique sûre : D'ABORD remplacez la CIBLE (le caractère utilisé plus tard comme `modèle` dans une autre règle) par quelque chose de sûr, ENSUITE introduisez la SOURCE (le caractère qui doit se décomposer en CIBLE). Pour l'exemple espagnol, correctement : d'abord `j → x`, puis `ñ → nj`. Résultat : « ñ » donne « nj » (le deuxième « j » ne sera plus consommé, car la règle `j → x` a été appliquée plus tôt, lorsque « nj » n'existait pas encore).

    Comment tester. Après avoir modifié l'ordre des règles dans le fichier d'accent, passez une phrase contenant LES DEUX lettres par le Mode Réalisateur. Pour l'exemple ES : « Niño de paja juega » → le résultat doit avoir l'accent ñ (« ñ → nj ») et l'accent j (« j → x »), c'est-à-dire quelque chose comme « Ninjo de paxa xuega ». Si vous voyez « ninxo » au lieu de « ninjo » — l'ordre est inversé.

    Validation dans le moteur (opt-in pour les auteurs de packs). L'application a une heuristique intégrée pour détecter les boucles potentielles, mais elle est désactivée par défaut — car de nombreux pipelines ressemblent à une boucle, bien qu'ils soient intentionnels (le classique « szcz → shch » + « ch → h »). Pour l'activer : réglez la variable d'environnement `REZYSER_VALIDATE_ZAMIANY=1` et lancez l'application depuis la console — depuis la source via `python main.py`, car l'exécutable `.exe` figé en mode fenêtre (à partir de la version 17.0) n'a pas de fenêtre de console. Le moteur affichera pour chaque fichier d'accents une ligne WARN agrégée avec les trois premières boucles potentielles et le nombre restant. Vérifiez la phonétique résultante sur une phrase test — si l'effet est intentionnel, ignorez le WARN.

    Les boutons de déplacement des règles dans le GUI du Gestionnaire de Règles (glisser-déposer, « Vers le haut / Vers le bas ») sont une fonction distincte prévue pour un cycle de version ultérieur — cela nécessite une refonte du Gestionnaire (actuellement, il délègue l'édition de fichiers à un Bloc-notes système externe et n'a pas sa propre vue des règles). Jusqu'à sa mise en œuvre : éditez le fichier YAML manuellement, déplacez les lignes dans la section `remplacement:`, utilisez le validateur avec la variable ENV et testez sur des phrases de contrôle.
  krok_7b_polskie_nazewnictwo: |
    ÉTAPE 7b — Noms polonais des dossiers et fichiers (pour les utilisateurs non polonophones)

    Le programme est régi par le polonais — c'est la langue principale du projet. En parcourant le dossier dictionaries/ dans le Gestionnaire de Règles (Ctrl+4) ou en ouvrant les dossiers de sauvegarde, vous rencontrerez des noms polonais. Ce ne sont PAS une erreur ni un défaut de traduction : ils restent en polonais à dessein, car ce sont les identifiants internes du moteur. Le glossaire ci-dessous explique leur signification.

    Sous-dossiers dans dictionaries/<kod>/ (c'est ce que vous voyez dans le Gestionnaire de Règles) :
    - podstawy (basics) — configuration du pack linguistique
    - akcenty (accents) — règles phonétiques pour les synthétiseurs vocaux
    - szyfry (ciphers) — modes de chiffrement du texte
    - rezyser (director) — modes créatifs du module Réalisateur
    - opowiesci (stories) — modes des Histoires interactives

    Dossiers contenant vos sauvegardes (à côté du programme) :
    - skrypty (scripts) — projets du Réalisateur : narration .txt, Livre du Monde .md
    - opowiesci (stories) — sauvegardes des Histoires interactives
