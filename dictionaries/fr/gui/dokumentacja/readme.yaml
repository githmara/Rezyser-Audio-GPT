id: readme
tresc:
  naglowek: |
    # Reżyser Audio GPT

    **Studio d'Enregistrement Hybride pour Drames Audio, Livres Audio et Histoires Interactives**

    **Autres versions linguistiques / Other languages:** [English](readme.md) · [Deutsch](readme.de.md) · [Español](readme.es.md) · [Suomi](readme.fi.md) · [Français](readme.fr.md) · [Íslenska](readme.is.md) · [Italiano](readme.it.md) · [Polski](readme.pl.md) · [Русский](readme.ru.md)
  wprowadzenie: |
    Ensemble d'outils autonomes alimentés par l'IA pour l'écriture automatique, la planification, le formatage et la traduction de scripts volumineux, ainsi que pour la conduite de jeux textuels interactifs. Le projet est une application de bureau native (wxPython) conçue dès le départ pour une accessibilité totale aux lecteurs d'écran (NVDA, VoiceOver) et pour fonctionner avec des synthétiseurs vocaux professionnels (TTS). Il fonctionne sans navigateur et sans serveur local — il se lance comme une fenêtre de programme ordinaire.

    Version : **{numer_wersji}** · Langues prises en charge nativement ({liczba_kompletnych_jezykow}) : {lista_kompletnych_jezykow_natywnie}.
  glowne_moduly: |
    ## Modules principaux

    L'application combine cinq outils dans une seule fenêtre, commutables par des raccourcis clavier (Ctrl+1 / Ctrl+2 / Ctrl+3 / Ctrl+4 / Ctrl+5) ou par des boutons sur la barre d'outils. Chaque module fonctionne indépendamment, mais tous partagent les packs de dictionnaires du dossier `dictionaries/` (accents, chiffres, modes créatifs AI) et les paramètres centraux.
  modul_rezyseria: |
    ### 1. Réalisation (Ctrl+1)

    Le principal studio pour écrire des pièces radiophoniques et des livres audio. Vous choisissez le mode — Brainstorming, Script (avec des balises `[SFX]`/`[Personnage: émotion]`), Livre audio (prose traditionnelle) — et dirigez le dialogue avec le modèle via le champ Instructions + Livre du Monde + Mémoire à Long Terme :

    * **Livre du Monde Multi-projet :** Le système charge automatiquement en arrière-plan les règles dédiées de l'univers (`.md`) en fonction du fichier source actif, assurant une isolation complète (chargement de contexte sans clic).
    * **Accumulateur de l'Intrigue :** Algorithme de « mémoire infinie ». Lorsque l'indicateur de mémoire entre en état d'alerte rouge, le système génère automatiquement un résumé de l'intrigue et l'enregistre dans le champ Mémoire à Long Terme.
    * **{liczba_trybow_rezysera} modes créatifs :** Chacun des fichiers dans `dictionaries/<jzk>/rezyser/` décrit une « personnalité » distincte du réalisateur AI (Brainstorming, Script, Livre audio, Postproduction des Titres). Vous pouvez ajuster leur tonalité sans programmation — voir le Gestionnaire de Règles ci-dessous.
  modul_opowiesci: |
    ### 2. Opowieści (Ctrl+2, deuxième mode principal depuis v15.0)

    Jeux de texte interactifs menés par l'IA dans le rôle de moteur narratif. Contrairement à la Régie (où vous générez un livre audio prêt à l'écoute), les Opowieści constituent une intrigue dynamique tour par tour :

    * **Mode Choix :** chaque tour se termine par 3 à 5 options numérotées A-E. Le mode le plus intuitif pour les joueurs non-voyants — NVDA lit les options, vous appuyez sur Tab et Entrée.
    * **Mode Moindre Mal :** comme le mode Choix, mais chaque option est défavorable sur le plan moral, physique ou stratégique. Depuis v15.2, une « fiole » supplémentaire — une option ZÉRO réutilisable de secours désespéré, dont les effets sont pseudo-aléatoires (60 % néfastes / 30 % perturbant la perception / 10 % rarement bénéfiques, distribution imposée par Python, le LLM n'a aucun moyen d'inventer un effet salvateur).
    * **Mode Libre :** toute action en texte libre (« j'essaierai d'ouvrir la porte »), le moteur propose 1 à 3 suggestions mais n'impose pas de choix.
    * **Un seul modèle d'IA pour tous les modes :** depuis v18.1, tous les modes des Opowieści utilisent le même modèle commun (par défaut et recommandé : Anthropic Claude Sonnet 4.6) — un modèle plus puissant respecte rigoureusement les règles du monde (crucial notamment en mode Moindre Mal, où chaque option doit être réellement défavorable).
  modul_poliglota: |
    ### 3. Polyglotte (Ctrl+3, Traducteur IA + Accents TTS)

    * **Traducteur Sécurisé :** Les longs textes sont automatiquement divisés en blocs mesurés en tokens du modèle (sûr aussi pour les langues à écriture dense, par ex. le chinois) et traduits séquentiellement ; une réponse tronquée du modèle est détectée et retentée sur des fragments plus petits. Chaque bloc est immédiatement enregistré dans un fichier caché `.jsonl`. La reprise après l'épuisement des limites de l'API est entièrement automatique.
    * **Automatisation NVDA :** Les traductions sont enregistrées sous forme de fichiers `.html` prêts à l'emploi avec une balise linguistique intégrée ou de fichiers `.docx` avec des balises injectées directement dans la structure XML.
    * **{liczba_akcentow_jezykowych} accents locaux :** Possibilité d'imposer intentionnellement un accent cassé pour les synthétiseurs locaux (Tiflotecnia Voices, eSpeak, OneCore) grâce à des règles regex avancées. Accents étrangers pris en charge : anglais, russe (avec translittération en cyrillique), allemand, espagnol, italien, finlandais, islandais, polonais.
    * **Mode Chiffreur :** {liczba_szyfrow} algorithmes locaux de distorsion de texte — de la lecture à l'envers, à la typoglycémie, en passant par le chiffre de César classique. Chacun avec l'alphabet local du pack linguistique (par exemple, le chiffre de César sur un alphabet FR de 35 caractères avec diacritiques).
    * **Réparateur de Balises :** Injecte de manière non invasive le code de langue ISO fourni — y compris régional, par ex. pt-BR ou zh-CN — dans les fichiers existants.
  modul_konwerter: |
    ### 4. Convertisseur / Architecte d'Audiobooks (Ctrl+4)

    * Traite les fichiers bruts `.txt` ou `.docx` pour la navigation par clavier avec NVDA et des systèmes tels que ElevenLabs.
    * Convertit automatiquement les mots-clés (Acte, Chapitre, Prologue) en en-têtes "Heading 1" dans le document Word, et nettoie également les balises HTML inutiles et les balises Markdown.
    * À partir de la version 15.1, regroupe 5 tours en scènes avec des en-têtes H1 (détection automatique des Histoires) — prépare le fichier généré par le mode Histoires pour une publication traditionnelle d'audiobook.
  modul_manager_regul: |
    ### 5. Gestionnaire de Règles (Ctrl+5, nouveauté depuis v13.0)

    * **Explorateur de dictionnaires sans Python :** Arborescence visuelle de tous les fichiers YAML dans le dossier `dictionaries/` — accents phonétiques, chiffres, modes créatifs du Réalisateur et du Narrateur. Un linguiste ou un traducteur peut parcourir, dupliquer, éditer et supprimer des règles directement depuis l'interface graphique.
    * **Créateur de nouvelles règles :** Formulaire avec choix de type (accent, chiffre de substitutions simples, mode Réalisateur, nouvelle langue de base, chiffre algorithmique) créant un modèle YAML prêt à l'emploi, et pour les cas plus complexes, générant une invite formatée à coller dans ChatGPT / Claude.
    * **Refactorisation v13.0 — règles dans les YAML :** Tous les accents, chiffres et modes AI, qui jusqu'à la version 12.0 étaient intégrés comme des constantes "codées en dur" dans le code Python, ont été transférés vers des fichiers déclaratifs `.yaml` chargés dynamiquement au démarrage de l'application. Toute personne capable d'utiliser un éditeur de texte peut ajuster un accent (par exemple, remplacer `sz → sh` par `sz → sch`), ajouter une nouvelle langue, voire modifier le ton de l'invite système pour l'AI — sans compiler le code.
  wielojezycznosc: |
    ## Multilinguisme ({liczba_kompletnych_jezykow} langues nativement)

    À partir de la version 14.0, l'application prend en charge nativement {liczba_kompletnych_jezykow} langues de base : {lista_kompletnych_jezykow_natywnie}. Chaque paquet `dictionaries/<kod>/` contient des diacritiques, un alphabet et des règles phonétiques opérant sur le texte dans cette langue spécifique — l'application détecte automatiquement la langue source grâce au détecteur de langue lingua (par paragraphe) et charge le paquet approprié pour chaque fragment individuellement.

    Toute l'interface GUI, la documentation (`docs/manual.<iso>.txt`) et la plupart des messages système sont disponibles nativement dans chacune des langues prises en charge. Les invites système AI dans les modes Réalisateur et Histoire sont écrites dans les langues cibles (manuellement, non traduites automatiquement — voir `dictionaries/<kod>/rezyser/` et `dictionaries/<kod>/opowiesci/`).
  architektura_ai: |
    ## Architecture IA et modèles utilisés

    Le fournisseur IA recommandé et par défaut est Anthropic (Claude) — tous les prompts système sont optimisés pour lui, ce qui lui confère la meilleure qualité narrative, le respect le plus fidèle des règles de l'univers et la prose la plus naturelle. La consolidation sur Claude s'est effectuée par étapes (Réalisateur en v18.0, Opowieści en v18.1, Polyglotte et postproduction en v18.2) — elle résulte d'une supériorité empiriquement confirmée dans le respect des règles de l'univers, la naturalité de la prose et l'évitement des clichés.

    * **Anthropic Claude Sonnet 4.6 (pilier de qualité par défaut) :** Moteur de TOUTE l'intelligence de l'application. Il est responsable de la narration créative (mise en scène des scripts, rédaction de la prose traditionnelle de l'Audiobook, Brainstorming et TOUS les modes d'Opowieści — Choix, Moindre Mal, Libre — ainsi que la génération de résumés et d'interludes Cinematic), des traductions avancées avec préservation du contexte multi-blocs (Polyglotte), ainsi que des microtâches : attribution itérative de titres littéraires aux chapitres et détection du code de langue du contenu.

    * **Endpoint personnalisé compatible OpenAI (option avancée, depuis v18.4) :** Au lieu d'Anthropic, il est possible de désigner n'importe quel endpoint compatible avec l'API OpenAI (OpenRouter, Groq, Fireworks, DeepSeek, Ollama local, Gemini compatible OpenAI et autres) — via un chemin de code unique et commun, sans intégration séparée par fournisseur. Configuration dans le fichier `golden_key.env` (`LLM_PROVIDER`, `LLM_BASE_URL`, `LLM_MODEL`, `OPENAI_API_KEY`) ; instructions complètes dans le manuel principal (ÉTAPE 2B). D'autres modèles peuvent offrir une qualité inférieure à celle de Claude, pour lequel les prompts sont optimisés — il s'agit d'un choix délibéré coût↔qualité de la part de l'utilisateur.
  ograniczenia_modeli: |
    ### Limitations connues des modèles (Anti-Closure)

    Malgré l'implémentation de directives systémiques rigoureuses visant à couper les actions aux moments de tension (dite directive Anti-Closure), les modèles LLM contemporains possèdent une forte tendance innée à « clore » les histoires. Cela se traduit souvent par l'insertion de conclusions indésirables, de morales ou de faux « happy ends », en particulier en Mode Livre Audio Traditionnel.

    C'est une limitation fondamentale de la génération actuelle d'intelligence artificielle. Pour cette raison, l'application enregistre les projets dans des fichiers texte ordinaires, faciles à éditer (`.txt`). Cela nécessite que l'utilisateur assume le rôle de monteur vivant — en supprimant occasionnellement et manuellement les phrases « de clôture » générées par l'IA, puis en synchronisant la mémoire avec le fichier corrigé via le bouton « Actualiser depuis le disque », et en poursuivant le travail.
  instalacja_uzytkownicy: |
    ## Installation et démarrage

    ### Pour les utilisateurs finaux (Windows)

    1. Téléchargez la dernière version depuis l'onglet **Releases** (le paquet marqué *Latest*) — le fichier `Rezyser_Audio_v<numer>_Installer.exe`. Lancez-le par un double-clic. L'installateur se place par défaut dans le répertoire local de votre compte (`%LocalAppData%\Programs\Reżyser Audio GPT`) et ne nécessite pas de droits administrateur ; vous pouvez choisir votre propre chemin via le bouton « Parcourir ». Une fois l'installation terminée, il crée des raccourcis dans le Menu Démarrer et sur le bureau, et ouvre optionnellement le manuel d'utilisation dans l'éditeur de fichiers `.txt` par défaut.
    2. **Configuration de l'API Anthropic :** Au premier lancement, l'application signalera l'absence de clé dans la section System Check. Cliquez sur le bouton visible pour générer le fichier `golden_key.env`, ouvrez-le dans un éditeur de texte et collez votre clé Anthropic (commençant par `sk-ant-`).
    3. **Premiers pas :** Ouvrez le fichier `docs/manual.pl.txt` (ou dans une autre langue) dans le dossier d'installation — il s'agit du manuel d'utilisation complet, rédigé dans un langage accessible à tout utilisateur, pas seulement aux développeurs.
  instalacja_deweloperzy: |
    ### Pour les développeurs (clone + configuration)

    1. Clonez le dépôt sur votre disque.
    2. Exécutez le fichier `setup_dev.bat` pour créer automatiquement un environnement virtuel (`.venv/`) et télécharger les dépendances depuis `requirements.txt`.
    3. Lancez l'application avec la commande `python main.py` ou via le fichier `run_dev.bat`.

    Les scripts `.sh` pour macOS/Linux ont été supprimés dans la version 13.1 — l'environnement de développement est concentré sur Windows en raison des spécificités des tests d'accessibilité NVDA. Travailler avec le code sur d'autres systèmes est possible, mais nécessite une configuration manuelle : `python -m venv .venv && .venv/bin/pip install -r requirements.txt`.

    **Les scripts de construction des paquets de release** (`build_release.py`, `rezyser_audio.spec`, `installer.iss`) servent uniquement à créer des paquets pour Windows. À partir de la version 17.0, `build_release.py` fige l'application avec PyInstaller (onedir + windowed) selon `rezyser_audio.spec` — il produit `dist/` avec un `.exe` natif et un dossier bundle `runtime/` (interpréteur + bibliothèques). Il n'est plus nécessaire d'avoir un Python portable installé manuellement dans le dépôt ; les répertoires `dist/` et `build/` sont dans `.gitignore`.
  dokumentacja: |
    ## Documentation complète

    Ce README est uniquement un aperçu architectural du projet. Pour découvrir les techniques avancées de prévention des hallucinations de l'IA, les instructions d'installation des synthétiseurs vocaux compatibles (Tiflotecnia Voices, OneCore, eSpeak, Apple Voices), une description complète des modes Histoires avec fiole, ainsi qu'un guide utilisateur complet, consultez les fichiers dans le dossier `docs/` :

    * `docs/manual.<iso>.txt` — le manuel principal (écrit pour l'utilisateur final).
    * `docs/tales.<iso>.txt` — le manuel du mode Histoires (jeux textuels interactifs).
    * `docs/dictionaries.<iso>.txt` — guide pour les linguistes sans Python, sur comment ajouter des accents/chiffres/modes IA personnalisés.

    Chacun de ces fichiers est disponible en {liczba_kompletnych_jezykow} langues — suffixe `.<iso>.txt` (par exemple, `manual.pl.txt`, `manual.en.txt`, `manual.de.txt`).
  polskie_nazewnictwo: |
    ### Nomenclature polonaise — guide pour les non-locuteurs du polonais

    La langue principale de ce projet est le polonais. Les noms des modules, des classes, les commentaires dans le code ainsi que les noms des répertoires et des fichiers de données sont en polonais et — pour assurer la rétrocompatibilité et le contrat du moteur multilingue — ne sont pas traduits ni modifiés intentionnellement. Le glossaire ci-dessous aidera les développeurs et les utilisateurs des systèmes macOS/Linux à se repérer dans la structure.

    **Répertoires de données utilisateur (à côté du fichier exécutable ou dans le répertoire du projet) :**

    * `skrypty/` — *scripts*: projets du module Réalisateur (`.txt` avec narration, `.md` avec le Livre du Monde, `_streszczenie.txt`).
    * `opowiesci/` — *histoires*: enregistrements d'histoires interactives.
    * `runtime/` — double rôle : répertoire du bundle de l'application figée (interpréteur + bibliothèques) ET conteneur de métadonnées cachées des projets (`runtime/skrypty/`, `runtime/opowiesci/`).

    **Sous-dossiers de données sources dans `dictionaries/<kod>/` (visibles dans le Gestionnaire de Règles) :**

    * `podstawy.yaml` — *basics*: configuration et métadonnées du pack linguistique.
    * `akcenty/` — *accents*: règles phonétiques pour les synthétiseurs vocaux.
    * `szyfry/` — *chiffres*: modes de chiffrement du texte.
    * `rezyser/` — *réalisateur*: modes créatifs du module Réalisateur.
    * `opowiesci/` — *histoires*: modes d'histoires interactives.
    * `gui/` — textes de l'interface (`ui.yaml`) et modèles de documentation.

    ### Accents disponibles

    - Anglais (Samantha/Mark dans Vocalizer, Zira/Hazel dans OneCore)
    - Finnois (Satu/Mikko dans Vocalizer, Heidi dans OneCore)
    - Italien (Alice/Luca dans Vocalizer, Elsa dans OneCore)
    - Polonais (Ewa dans Vocalizer, Paulina dans OneCore)
    - Allemand (Stefan/Katja dans Vocalizer, Hedda dans OneCore)
    - Espagnol (Jorge/Monica dans Vocalizer, Helena dans OneCore)
    - Russe (Irina/Pavel dans Vocalizer, Yuri dans OneCore)

    ### Chiffre : Inverseur de texte

    Ce chiffre inverse chaque phrase, mais d'abord il développe certaines abréviations pour éviter des inversions phonétiquement absurdes (par exemple : ".xel"). Les abréviations développées sont :

    - "p. ex." → "par exemple"
    - "c.-à-d." → "c'est-à-dire"
    - "etc." → "et cetera"
    - "M." → "Monsieur"
    - "Dr" → "Docteur"

    ### Chiffre : Typoglycémie

    Selon une rechreche à l'Université de Cmabrigde, il n'importe pas dans quel odrre les lettres dans un mot sont, la seule chose ipmrotnate est que la première et la dernière lettre soient à la bonne place.
