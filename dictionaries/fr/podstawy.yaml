# =============================================================================
#  FONDEMENTS DE LA LANGUE FRANÇAISE
# =============================================================================
#
#  Fichier de base pour `dictionaries/fr/`. Le moteur Poliglota exige que
#  chaque langue possède ce fichier — sans lui, une nouvelle langue ne sera
#  pas reconnue par `dostepne_jezyki_bazowe()`.
#
#  Structure analogue à `dictionaries/pl/podstawy.yaml`. Le champ
#  `polskie_znaki`, malgré son nom historique, contient TOUS les signes
#  diacritiques qui doivent être normalisés en ASCII avant l'application
#  des chiffrements ou des règles d'accentuation (le pre-pass du paquet).
#
#  Note spéciale : les ligatures « œ » et « æ » sont translittérées en
#  « oe » et « ae » dans `polskie_znaki` — elles ne peuvent PAS figurer
#  dans `alfabet`, car le mécanisme du chiffrement de César repose sur
#  `.upper()` et les ligatures cassent l'indice de position.
# =============================================================================

id: podstawy
jezyk: fr
# Énumération lingua-language-detector (en majuscules, sans préfixe).
# Liste complète : https://github.com/pemistahl/lingua-py
lingua: FRENCH
etykieta: "Français – fondements phonétiques"
opis: |
  Règles de base pour la langue française :
    1. Normalisation des signes diacritiques (`polskie_znaki`) — pour que
       le chiffrement de César et les moteurs d'accentuation puissent
       traiter correctement les caractères spéciaux (les ligatures
       œ/æ sont décomposées en oe/ae).
    2. Alphabet français (26 lettres standard + 14 diacritiques à la fin) —
       utilisé par le chiffrement de César.

# -----------------------------------------------------------------------------
# Normalisation des signes diacritiques.
# Les ligatures (œ, æ) sont décomposées en deux lettres pour préserver les
# indices du chiffrement de César.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# v19.7 : LA CIBLE EST LE FRANÇAIS, PAS LA LETTRE DE BASE NUE. Jusqu'à la v19.6
# chaque lettre étrangère tombait sur sa lettre de base, et c'était un
# appauvrissement et non une simplification : ce pre-pass tourne AVANT la liste
# `zamiany` de CHAQUE accent du paquet, donc aplatir « š » en un « s » nu jetait
# à la poubelle la règle que les accents ont depuis toujours — presque tous
# les fichiers de `akcenty/` portent des règles pour « ch », « gn », « j » ou
# « eu », parce que ce sont les digrammes du français. Une lettre étrangère qui
# porte de façon STABLE un son que le français écrit déjà reçoit désormais
# cette écriture — et il n'y a rien à inventer, la presse française les écrit
# ainsi depuis toujours (Chostakovitch, Tchekhov, Jivago, Djokovic) :
#     š ş ŝ ś → ch    č ĉ ċ ć → tch    ž ĵ ź ż → j    đ ĝ ġ → dj
#     ř → rj    ñ → gn    ţ → ts    ą → on    ę → in    ø ö ő → eu    å → o
#   Mesuré : « Škoda Žižek Dvořák Đoković » donne « Chkoda Jijek Dvorjak
#   Djokovitch » au lieu de « Skoda Zizek Dvorak Dokovic », et avec l'accent
#   russe « Шкода Жижек Дворжак Джокович » au lieu de « Скода Зизек Дворак
#   Доковик » — l'orthographe française à elle seule remet le nom d'aplomb.
#
# QUATRE DÉCISIONS QUI SONT LE CONTENU DE CETTE LISTE :
#   1. « ą → on » ET « ę → in », ET C'EST LE SEUL PAQUET OÙ CES DEUX CIBLES
#      SONT DE VRAIES VOYELLES NASALES. Ailleurs (en, de, fi) « on » n'est
#      qu'un o suivi d'un n ; ici « on » EST [ɔ̃] et « in » EST [ɛ̃], c'est-à-dire
#      exactement les deux nasales polonaises. « Wałęsa » sort en « Walinsa »,
#      lu /valɛ̃sa/. Angle mort : devant une voyelle, « in » se dénasalise, mais
#      le ę polonais précède presque toujours une consonne ou finit le mot.
#   2. « ø ö ő → eu » VISE UN SON QUE LE FRANÇAIS POSSÈDE (« eu » = [ø], et
#      trois accents le rendent déjà explicitement — le russe en fait « ё ») :
#      « Søren → Seuren »
#      vaut mieux que « Soren ». MAIS « œ » GARDE « oe », et ce n'est pas une
#      incohérence : « œ » est une ligature FRANÇAISE, qui a déjà son repli
#      ASCII français, et « cœur → ceur » changerait le [k] en [s] — devant
#      « o » le c est [k], devant « e » il est [s]. La cible ne doit pas
#      réécrire la lettre d'à côté.
#   3. « ź ż → j » ALORS QUE LE PAQUET ESPAGNOL LES LAISSE EN « z ». Même son,
#      deux réponses, et c'est la POSITION qui tranche (règle de l'étape 11) :
#      le « j » français reste une consonne en fin de mot (« Łódź → Lodj »,
#      une syllabe, comme l'original), tandis que le « y » espagnol y devient
#      une voyelle. Le français peut donc se permettre la cible juste.
#   4. « ł → l » RESTE. Le français écrit bien [w], mais avec « ou » et
#      seulement DEVANT une voyelle (oui, ouest) : après une voyelle, « aou »
#      se lit en deux syllabes et « Michał → Michaou » gagnerait une syllabe
#      que le nom n'a pas. Le pre-pass ne voit pas la lettre suivante, donc on
#      choisit une fois pour tout le paquet — et on choisit de ne pas casser la
#      forme du mot. Le finnois, lui, a une approximante et prend « v ».
#
# LE RESTE RESTE EN ASCII, ET C'EST AUSSI UNE DÉCISION. Le critère a deux
# faces : la SOURCE doit signifier un son dans les langues d'où elle vient
# (« ä » est [ɛ] en allemand et [æ] en finnois ; « ó » est [u] en polonais,
# [ou] en islandais et [o] tonique en espagnol), et la CIBLE doit être quelque
# chose que la voix de CE paquet lit pareil à chaque fois. « ü → u » était déjà
# juste — le u français EST [y] — et « ç → ss » garde sa raison de 19.6,
# expliquée juste en dessous.
#
# UN NOUVEAU DIGRAMME EST UNE DETTE QUE LES ACCENTS DU PAQUET PAIENT. Un accent
# qui TRANSLITTÈRE (vers le cyrillique) a une règle par lettre, donc un
# trigramme qu'il ne connaît pas comme un TOUT se casse : mesuré, « tch »
# arrivait à l'accent russe en « т » + « ш ». La règle unitaire (« tch » → « ч »,
# placée avant « ch ») est dans `akcenty/rosyjski.yaml` et elle paie aussi une
# dette plus ancienne, car « Tchekhov » arrivait déjà tel quel. Les accents
# latins, eux, s'en sortent par composition : « tch » devient « tsz » en
# polonais et « tsch » en allemand, ce qui EST leur écriture de [tʃ].
#
# La limite est gardée par `audyt_podstaw` (classe `znaki-cel-obcy`) : la cible
# peut être de l'ASCII ou une lettre de l'`alfabet` plus bas, jamais la lettre
# d'une troisième langue.
# -----------------------------------------------------------------------------
polskie_znaki:
  # -- Ligatures françaises → 2 lettres --
  - { wzor: "œ", zamiana: "oe" }
  - { wzor: "Œ", zamiana: "Oe" }
  - { wzor: "æ", zamiana: "ae" }
  - { wzor: "Æ", zamiana: "Ae" }
  # -- Diacritiques français → ASCII (pre-pass de TOUS les accents) --
  #    Les accents des voyelles ne changent pas le PHONÈME de la lettre de
  #    base : « é/è/ê » restent un /e/, « à/â » un /a/. La cédille, elle, le
  #    change — « ç » se lit /s/, jamais /k/ — donc elle n'est JAMAIS aplatie
  #    en « c » (18.22 : avec « c », les accents à pre-pass lisaient
  #    « français » avec /k/, car leur règle « c » → /k/ prenait le relais).
  #    Cible « ss » et non « s » (19.6) : en allemand un « s » entre voyelles
  #    se lit /z/, donc « garson » sortirait en /gaʁzɔn/ — c'est pour cela que
  #    fr/niemiecki portait sa propre règle « ç → ss » et devait couper le
  #    pre-pass en entier (au prix de 188 caractères latins laissés passer).
  #    Pour toutes les autres voix (pl, fi, ru, it, es, en, is) « ss » se lit
  #    /s/ exactement comme « s » : le réglage est gratuit ailleurs.
  - { wzor: "à", zamiana: "a"  }
  - { wzor: "À", zamiana: "A"  }
  - { wzor: "â", zamiana: "a"  }
  - { wzor: "Â", zamiana: "A"  }
  - { wzor: "ç", zamiana: "ss" }
  - { wzor: "Ç", zamiana: "Ss" }
  - { wzor: "é", zamiana: "e"  }
  - { wzor: "É", zamiana: "E"  }
  - { wzor: "è", zamiana: "e"  }
  - { wzor: "È", zamiana: "E"  }
  - { wzor: "ê", zamiana: "e"  }
  - { wzor: "Ê", zamiana: "E"  }
  - { wzor: "ë", zamiana: "e"  }
  - { wzor: "Ë", zamiana: "E"  }
  - { wzor: "î", zamiana: "i"  }
  - { wzor: "Î", zamiana: "I"  }
  - { wzor: "ï", zamiana: "i"  }
  - { wzor: "Ï", zamiana: "I"  }
  - { wzor: "ô", zamiana: "o"  }
  - { wzor: "Ô", zamiana: "O"  }
  - { wzor: "ù", zamiana: "u"  }
  - { wzor: "Ù", zamiana: "U"  }
  - { wzor: "û", zamiana: "u"  }
  - { wzor: "Û", zamiana: "U"  }
  - { wzor: "ü", zamiana: "u"  }
  - { wzor: "Ü", zamiana: "U"  }
  - { wzor: "ÿ", zamiana: "y"  }
  - { wzor: "Ÿ", zamiana: "Y"  }
  # -- Caractères polonais : chacun note UN son en polonais et le français a
  #    une écriture pour chacun, donc on écrit cette écriture au lieu de
  #    laisser tomber le diacritique. Exceptions : `ó` (source instable),
  #    `ł` et `ń` (position — voir l'en-tête) --
  - { wzor: "ą", zamiana: "on"  }
  - { wzor: "ć", zamiana: "tch" }
  - { wzor: "ę", zamiana: "in"  }
  - { wzor: "ł", zamiana: "l"   }
  - { wzor: "ń", zamiana: "n"   }
  - { wzor: "ó", zamiana: "o"   }
  - { wzor: "ś", zamiana: "ch"  }
  - { wzor: "ź", zamiana: "j"   }
  - { wzor: "ż", zamiana: "j"   }
  - { wzor: "Ą", zamiana: "On"  }
  - { wzor: "Ć", zamiana: "Tch" }
  - { wzor: "Ę", zamiana: "In"  }
  - { wzor: "Ł", zamiana: "L"   }
  - { wzor: "Ń", zamiana: "N"   }
  - { wzor: "Ó", zamiana: "O"   }
  - { wzor: "Ś", zamiana: "Ch"  }
  - { wzor: "Ź", zamiana: "J"   }
  - { wzor: "Ż", zamiana: "J"   }
  # -- Autres diacritiques européens → ASCII --
  - { wzor: "á", zamiana: "a"  }
  - { wzor: "ã", zamiana: "a"  }
  - { wzor: "ä", zamiana: "a"  }
  - { wzor: "Á", zamiana: "A"  }
  - { wzor: "Ã", zamiana: "A"  }
  - { wzor: "Ä", zamiana: "A"  }
  # -- å → o (le å suédois/norvégien est [o], pas [a]) --
  - { wzor: "å", zamiana: "o"  }
  - { wzor: "Å", zamiana: "O"  }
  - { wzor: "ð", zamiana: "d"  }
  - { wzor: "Ð", zamiana: "D"  }
  - { wzor: "í", zamiana: "i"  }
  - { wzor: "ì", zamiana: "i"  }
  - { wzor: "Í", zamiana: "I"  }
  - { wzor: "Ì", zamiana: "I"  }
  # -- ñ → gn (le gn français EST [ɲ] : Espagne, et les huit accents ont
  #    déjà une règle pour ce digramme). Les ń/ň/ņ restent en `n` : elles
  #    finissent le mot sans arrêt (Poznań, Plzeň) et le français n'y lit
  #    pas « gn » de façon fiable --
  - { wzor: "ñ", zamiana: "gn" }
  - { wzor: "Ñ", zamiana: "Gn" }
  - { wzor: "ò", zamiana: "o"  }
  - { wzor: "õ", zamiana: "o"  }
  - { wzor: "Ò", zamiana: "O"  }
  - { wzor: "Õ", zamiana: "O"  }
  # -- ö/ø → eu : le « eu » français EST [ø], le son même de ces deux
  #    lettres (Søren → Seuren, Köln → Keuln) --
  - { wzor: "ö", zamiana: "eu" }
  - { wzor: "Ö", zamiana: "Eu" }
  - { wzor: "ø", zamiana: "eu" }
  - { wzor: "Ø", zamiana: "Eu" }
  - { wzor: "ß", zamiana: "ss" }
  - { wzor: "ẞ", zamiana: "SS" }
  - { wzor: "þ", zamiana: "th" }
  - { wzor: "Þ", zamiana: "Th" }
  - { wzor: "ú", zamiana: "u"  }
  - { wzor: "Ú", zamiana: "U"  }
  - { wzor: "ý", zamiana: "y"  }
  - { wzor: "Ý", zamiana: "Y"  }
  # -- Macrons de la romanisation japonaise (Tōkyō, rāmen) → voyelle de base --
  - { wzor: "ā", zamiana: "a"  }
  - { wzor: "ē", zamiana: "e"  }
  - { wzor: "ī", zamiana: "i"  }
  - { wzor: "ō", zamiana: "o"  }
  - { wzor: "ū", zamiana: "u"  }
  - { wzor: "Ā", zamiana: "A"  }
  - { wzor: "Ē", zamiana: "E"  }
  - { wzor: "Ī", zamiana: "I"  }
