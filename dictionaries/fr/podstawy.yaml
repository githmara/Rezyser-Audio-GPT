# =============================================================================
#  FONDEMENTS DE LA LANGUE FRANÇAISE
# =============================================================================
#
#  Fichier de base pour `dictionaries/fr/`. Le moteur Poliglota exige que
#  chaque langue possède ce fichier — sans lui, une nouvelle langue ne sera
#  pas reconnue par `dostepne_jezyki_bazowe()`.
#
#  Structure analogue à `dictionaries/pl/podstawy.yaml`. Le champ
#  `polskie_znaki`, malgré son nom historique, contient TOUS les signes
#  diacritiques qui doivent être normalisés en ASCII avant l'application
#  des chiffrements ou des règles d'accentuation (le pre-pass du paquet).
#
#  Note spéciale : les ligatures « œ » et « æ » sont translittérées en
#  « oe » et « ae » dans `polskie_znaki` — elles ne peuvent PAS figurer
#  dans `alfabet`, car le mécanisme du chiffrement de César repose sur
#  `.upper()` et les ligatures cassent l'indice de position.
# =============================================================================

id: podstawy
jezyk: fr
# Énumération lingua-language-detector (en majuscules, sans préfixe).
# Liste complète : https://github.com/pemistahl/lingua-py
lingua: FRENCH
etykieta: "Français – fondements phonétiques"
opis: |
  Règles de base pour la langue française :
    1. Normalisation des signes diacritiques (`polskie_znaki`) — pour que
       le chiffrement de César et les moteurs d'accentuation puissent
       traiter correctement les caractères spéciaux (les ligatures
       œ/æ sont décomposées en oe/ae).
    2. Alphabet français (26 lettres standard + 14 diacritiques à la fin) —
       utilisé par le chiffrement de César.

# -----------------------------------------------------------------------------
# Normalisation des signes diacritiques.
# Les ligatures (œ, æ) sont décomposées en deux lettres pour préserver les
# indices du chiffrement de César.
# -----------------------------------------------------------------------------
polskie_znaki:
  # -- Ligatures françaises → 2 lettres --
  - { wzor: "œ", zamiana: "oe" }
  - { wzor: "Œ", zamiana: "Oe" }
  - { wzor: "æ", zamiana: "ae" }
  - { wzor: "Æ", zamiana: "Ae" }
  # -- Diacritiques français → ASCII (pre-pass de TOUS les accents) --
  #    Les accents des voyelles ne changent pas le PHONÈME de la lettre de
  #    base : « é/è/ê » restent un /e/, « à/â » un /a/. La cédille, elle, le
  #    change — « ç » se lit /s/, jamais /k/ — donc elle n'est JAMAIS aplatie
  #    en « c » (18.22 : avec « c », les accents à pre-pass lisaient
  #    « français » avec /k/, car leur règle « c » → /k/ prenait le relais).
  #    Cible « ss » et non « s » (19.6) : en allemand un « s » entre voyelles
  #    se lit /z/, donc « garson » sortirait en /gaʁzɔn/ — c'est pour cela que
  #    fr/niemiecki portait sa propre règle « ç → ss » et devait couper le
  #    pre-pass en entier (au prix de 188 caractères latins laissés passer).
  #    Pour toutes les autres voix (pl, fi, ru, it, es, en, is) « ss » se lit
  #    /s/ exactement comme « s » : le réglage est gratuit ailleurs.
  - { wzor: "à", zamiana: "a"  }
  - { wzor: "À", zamiana: "A"  }
  - { wzor: "â", zamiana: "a"  }
  - { wzor: "Â", zamiana: "A"  }
  - { wzor: "ç", zamiana: "ss" }
  - { wzor: "Ç", zamiana: "Ss" }
  - { wzor: "é", zamiana: "e"  }
  - { wzor: "É", zamiana: "E"  }
  - { wzor: "è", zamiana: "e"  }
  - { wzor: "È", zamiana: "E"  }
  - { wzor: "ê", zamiana: "e"  }
  - { wzor: "Ê", zamiana: "E"  }
  - { wzor: "ë", zamiana: "e"  }
  - { wzor: "Ë", zamiana: "E"  }
  - { wzor: "î", zamiana: "i"  }
  - { wzor: "Î", zamiana: "I"  }
  - { wzor: "ï", zamiana: "i"  }
  - { wzor: "Ï", zamiana: "I"  }
  - { wzor: "ô", zamiana: "o"  }
  - { wzor: "Ô", zamiana: "O"  }
  - { wzor: "ù", zamiana: "u"  }
