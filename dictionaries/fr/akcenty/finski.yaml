# -----------------------------------------------------------------------------
#  ACCENT FINNOIS (français → TTS finnois)
#  Pour les synthétiseurs : Heidi / Onni (TTS finnois).
# -----------------------------------------------------------------------------
id: finski
etykieta: "Finnois (par ex. Heidi / Onni)"
opis: |
  Adapte le texte français au synthétiseur vocal finnois (Heidi / Onni).
  Le finnois est très distant phonétiquement du français — il n'a ni /ʃ/,
  ni /ʒ/, ni /tʃ/, ni nasalisation. L'accent finnois sur le français est
  donc très marqué.

  Différences fonétiques critiques français → finnois :
    - « ch » fr = /ʃ/, absent en fi → on écrit « š » (lettre étrangère
      finnoise officielle pour /ʃ/ dans les emprunts).
    - « j »  fr = /ʒ/, « j » fi = /j/ → on écrit « ž » (lettre étrangère
      finnoise pour /ʒ/).
    - « gn » fr = /ɲ/, absent en fi → on écrit « nj » (approximation).
    - « ou » fr = /u/ → on écrit « uu » (fi note long /u/ comme uu, lecture
      claire).
    - « u »  fr = /y/, « y » fi = /y/ ✓ → on écrit « y ».
    - « ç »  fr = /s/ → on écrit « s ».
    - « qu » fr = /k/ → on écrit « k ».
    - « h »  fr muet, « h » fi = /h/ → on supprime.

  Accents naturels laissés intentionnellement : « r » uvulaire fr vs.
  « r » roulé fi, voyelles nasales — fi TTS les rendra en voyelle + n,
  ce qui est l'accent recherché.
iso: fi
kategoria: akcent
kolejnosc: 70

czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

zamiany:
  # --- Digrammes prioritaires ---
  - { wzor: "ch", zamiana: "š"  }
  - { wzor: "Ch", zamiana: "Š"  }
  - { wzor: "CH", zamiana: "Š"  }
  - { wzor: "gn", zamiana: "nj" }
  - { wzor: "Gn", zamiana: "Nj" }
  - { wzor: "GN", zamiana: "NJ" }
  - { wzor: "ou", zamiana: "uu" }
  - { wzor: "Ou", zamiana: "Uu" }
  - { wzor: "OU", zamiana: "UU" }
  - { wzor: "qu", zamiana: "k"  }
  - { wzor: "Qu", zamiana: "K"  }
  - { wzor: "QU", zamiana: "K"  }
  # --- Lettres simples (après digrammes) ---
  - { wzor: "j",  zamiana: "ž"  }
  - { wzor: "J",  zamiana: "Ž"  }
  - { wzor: "u",  zamiana: "y"  }
  - { wzor: "U",  zamiana: "Y"  }
  - { wzor: "ç",  zamiana: "s"  }
  - { wzor: "Ç",  zamiana: "S"  }
  - { wzor: "h",  zamiana: ""   }
  - { wzor: "H",  zamiana: ""   }
