# -----------------------------------------------------------------------------
#  ACCENT FINNOIS (français → TTS finnois)
#  Pour les synthétiseurs : Heidi / Onni (TTS finnois).
# -----------------------------------------------------------------------------
id: finski
etykieta: "Finnois (par ex. Heidi / Onni)"
opis: |
  Adapte le texte français au synthétiseur vocal finnois (Heidi / Onni).
  Le finnois est très distant phonétiquement du français — il n'a ni /ʃ/,
  ni /ʒ/, ni /tʃ/, ni nasalisation. L'accent finnois sur le français est
  donc très marqué.

  Différences phonétiques critiques français → finnois :
    - « ch » fr = /ʃ/, absent en fi → on écrit « š » (lettre étrangère
      finnoise officielle pour /ʃ/ dans les emprunts).
    - « j »  fr = /ʒ/, « j » fi = /j/ → on écrit « ž » (lettre étrangère
      finnoise pour /ʒ/).
    - « gn » fr = /ɲ/, absent en fi → on écrit « nj » (approximation).
    - « ou » fr = /u/ → on écrit « uu » (fi note long /u/ comme uu, lecture
      claire).
    - « u »  fr = /y/, « y » fi = /y/ ✓ → on écrit « y ».
    - « ç »  fr = /s/ → on écrit « s ».
    - « qu » fr = /k/ → on écrit « k ».
    - « h »  fr muet, « h » fi = /h/ → on supprime.

  Accents naturels laissés intentionnellement : « r » uvulaire fr vs.
  « r » roulé fi, voyelles nasales — fi TTS les rendra en voyelle + n,
  ce qui est l'accent recherché.
iso: fi
kategoria: akcent
kolejnosc: 70

czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

zamiany:
  # AUDYT 18.12 (W-4): „j"→„ž" PRZED „gn"→„nj" (inaczej „agneau"→„anžeau");
  # pułapka samogłoskowa łańcuchem: „ou"→„uu", potem „u"→„y" zamienia
  # uu→yy, naprawa „yy"→„uu" przywraca fińskie długie /u/ („douze" już
  # nie kończy jako „dyyze"). „h"→„" zostaje — wyniki š/ž/nj są bez h.
  - { wzor: "ch", zamiana: "š"  }
  - { wzor: "Ch", zamiana: "Š"  }
  - { wzor: "CH", zamiana: "Š"  }
  - { wzor: "qu", zamiana: "k"  }
  - { wzor: "Qu", zamiana: "K"  }
  - { wzor: "QU", zamiana: "K"  }
  - { wzor: "j",  zamiana: "ž"  }
  - { wzor: "J",  zamiana: "Ž"  }
  - { wzor: "gn", zamiana: "nj" }
  - { wzor: "Gn", zamiana: "Nj" }
  - { wzor: "GN", zamiana: "NJ" }
  # KASKADA ZAMIERZONA (opisana wyżej, oznaczona jawnie w v18.21): „ou" → „uu"
  # świadomie wpada pod „u" → „y", a reguła „yy" → „uu" niżej przywraca fińskie
  # długie /u/ — dlatego G3 ma tu milczeć, a nie raportować w każdym przebiegu.
  - { wzor: "ou", zamiana: "uu" }
  - { wzor: "Ou", zamiana: "Uu" }
  - { wzor: "OU", zamiana: "UU" }
  - { wzor: "au", zamiana: "o"  }
  - { wzor: "Au", zamiana: "O"  }
  - { wzor: "AU", zamiana: "O"  }
  - { wzor: "eu", zamiana: "ö"  }
  - { wzor: "Eu", zamiana: "Ö"  }
  - { wzor: "EU", zamiana: "Ö"  }
  - { wzor: "u",  zamiana: "y"  }
  - { wzor: "U",  zamiana: "Y"  }
  - { wzor: "yy", zamiana: "uu" }
  - { wzor: "Yy", zamiana: "Uu" }
  - { wzor: "YY", zamiana: "UU" }
  # « ç » N'EST PAS ici (correction v18.19) : le champ `alfabet` du français
  # compte 26 lettres ASCII, donc `polskie_znaki` dans `podstawy.yaml`
  # normalise « ç » en « c » AVANT cette liste — une règle sur « ç » était
  # inatteignable. La cédille se lit donc comme /k/ dans « français » ;
  # la corriger demanderait de désactiver la pré-passe pour cette paire et
  # d'y réécrire la table complète des diacritiques françaises.
  - { wzor: "h",  zamiana: ""   }
  - { wzor: "H",  zamiana: ""   }
