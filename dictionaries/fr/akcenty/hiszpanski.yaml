# -----------------------------------------------------------------------------
#  ACCENT ESPAGNOL (français → TTS espagnol)
#  Pour les synthétiseurs : Helena / Pablo / Lucia (TTS espagnol).
# -----------------------------------------------------------------------------
id: hiszpanski
etykieta: "Espagnol (par ex. Helena / Pablo / Lucia)"
opis: |
  Adapte le texte français au synthétiseur vocal espagnol (Helena /
  Pablo / Lucia). Deux langues romanes — l'espagnol n'a ni /ʒ/ ni /ʃ/
  ni /z/, donc plusieurs digrammes français doivent être réécrits.

  Différences phonétiques critiques français → espagnol :
    - « ch » fr = /ʃ/, « ch » es = /tʃ/ → on conserve « ch » (accent naturel).
    - « j »  fr = /ʒ/, absent en es → on écrit « ll » (es ll = /ʝ/, le
      plus proche TTS-friendly).
    - « gn » fr = /ɲ/, « ñ »  es = /ɲ/ ✓ → on écrit « ñ ».
    - « ou » fr = /u/, « u »  es = /u/ → on écrit « u ».
    - « u »  fr = /y/, absent en es → on écrit « iu » (approximation).
    - « ç »  fr = /s/, absent en es → on écrit « s ».
    - « qu » fr = /k/, « qu » es = /k/ ✓ → on conserve.
    - « v »  fr = /v/, « v »  es = /b/ → accent espagnol naturel, on conserve.
    - « h »  fr et es muets → on conserve (pas de conflit).

  Accents naturels laissés intentionnellement : nasalisations françaises,
  « r » uvulaire fr vs. « r » roulé es, « z » fr = /z/ vs. « z » es = /θ/
  (Espagne) ou /s/ (Amérique latine).
iso: es
kategoria: akcent
kolejnosc: 55

czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

zamiany:
  # AUDYT 18.12 (W-4): „ou"→„ú" (hiszpański zna ú = /u/, a znak nie wpada
  # w żadną późniejszą regułę — wzorzec fr/islandzki). Usunięte „u"→„iu"
  # (słaba karykatura, psuła qu: „qui"→„qiui"; hiszpański czyta qui/que
  # natywnie).
  - { wzor: "gn", zamiana: "ñ" }
  - { wzor: "Gn", zamiana: "Ñ" }
  - { wzor: "GN", zamiana: "Ñ" }
  - { wzor: "ou", zamiana: "ú" }
  - { wzor: "Ou", zamiana: "Ú" }
  - { wzor: "OU", zamiana: "Ú" }
  - { wzor: "j",  zamiana: "ll" }
  - { wzor: "J",  zamiana: "Ll" }
  # « ç » N'EST PAS ici (correction v18.19) : le champ `alfabet` du français
  # compte 26 lettres ASCII, donc `polskie_znaki` dans `podstawy.yaml`
  # normalise « ç » en « c » AVANT cette liste — une règle sur « ç » était
  # inatteignable. La cédille se lit donc comme /k/ dans « français » ;
  # la corriger demanderait de désactiver la pré-passe pour cette paire et
  # d'y réécrire la table complète des diacritiques françaises.
