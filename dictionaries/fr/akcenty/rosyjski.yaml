# -----------------------------------------------------------------------------
#  ACCENT RUSSE (français → TTS russe)
#  Pour les synthétiseurs : Irina / Pavel (TTS russe).
# -----------------------------------------------------------------------------
id: rosyjski
etykieta: "Russe (par ex. Irina / Pavel)"
opis: |
  Adapte le texte français au synthétiseur vocal russe (Irina / Pavel).
  Le TTS russe lit les lettres latines selon ses propres règles, donc
  on translittère les digrammes français pour qu'ils correspondent à
  l'orthographe latine adaptée au russe.

  Différences fonétiques critiques français → russe :
    - « ch » fr = /ʃ/, « sch » est l'écriture latine la plus lisible en russe.
    - « j »  fr = /ʒ/ → on écrit « zh » (transcription standard).
    - « ou » fr = /u/ → on écrit « u » (TTS russe lit u comme /u/ ✓).
    - « u »  fr = /y/, absent en russe → on écrit « ju » (approximation).
    - « ç »  fr = /s/ → on écrit « s ».
    - « qu » fr = /k/ → on écrit « k ».
    - « gn » fr = /ɲ/ → on écrit « nj » (analogie avec « н + ь »).
    - « h »  fr muet → on supprime.

  Accents naturels laissés intentionnellement : « r » uvulaire fr vs.
  « r » roulé russe, nasalisations non transformées (TTS russe les
  rendra en voyelle + n).
iso: ru
kategoria: akcent
kolejnosc: 60

czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

zamiany:
  # --- Digrammes prioritaires ---
  - { wzor: "ch", zamiana: "sch" }
  - { wzor: "Ch", zamiana: "Sch" }
  - { wzor: "CH", zamiana: "SCH" }
  - { wzor: "ou", zamiana: "u"   }
  - { wzor: "Ou", zamiana: "U"   }
  - { wzor: "OU", zamiana: "U"   }
  - { wzor: "gn", zamiana: "nj"  }
  - { wzor: "Gn", zamiana: "Nj"  }
  - { wzor: "GN", zamiana: "NJ"  }
  - { wzor: "qu", zamiana: "k"   }
  - { wzor: "Qu", zamiana: "K"   }
  - { wzor: "QU", zamiana: "K"   }
  # --- Lettres simples ---
  - { wzor: "j",  zamiana: "zh"  }
  - { wzor: "J",  zamiana: "Zh"  }
  - { wzor: "u",  zamiana: "ju"  }
  - { wzor: "U",  zamiana: "Ju"  }
  - { wzor: "ç",  zamiana: "s"   }
  - { wzor: "Ç",  zamiana: "S"   }
  - { wzor: "h",  zamiana: ""    }
  - { wzor: "H",  zamiana: ""    }
