# -----------------------------------------------------------------------------
#  ACCENT RUSSE (français → TTS russe)
#  Pour les synthétiseurs : Irina / Pavel (TTS russe).
# -----------------------------------------------------------------------------
id: rosyjski
etykieta: "Russe (par ex. Irina / Pavel)"
opis: |
  Translittère le texte français ENTIÈREMENT en cyrillique pour que le
  synthétiseur vocal russe (Irina / Pavel) le lise avec un accent russe.
  La transcription est phonétique, non académique (ni ISO 9 ni GOST) :
  l'objectif est un Russe qui parle français.

  Correspondances principales :
    - « ch » → « ш »,  « j » → « ж »,  « ge/gi » → « же/жи »
    - « gn » → « нь »,  « gue/gui » → « ге/ги »,  « qu » → « к »
    - « ou » → « у »,  « oi » → « уа »,  « u » → « ю »
    - « au/eau » → « о »,  « eu/œu » → « ё »,  « ai/ei » → « е »
    - « tion » → « сьон »,  « ph » → « ф »,  « ce/ci » → « се/си »
    - « h » muet → supprimé (sans danger : aucun résultat ne contient
      de « h » latin),  « c' » → « с' »,  autres lettres 1:1 en cyrillique.

  Simplifications conscientes :
    - les consonnes finales muettes NE sont PAS supprimées (irréalisable
      de façon fiable avec des remplacements séquentiels) ;
    - les nasales in/un/an/en restent voyelle + « н » (« эн » forcé
      casserait « une », « inutile », « cuisine ») ;
    - l'étape `usun_polskie_znaki` aplatit ç→c et é/è/ê→e AVANT ces
      règles, donc « ça » se lit « ка » et les e accentués → « е ».
iso: ru
kategoria: akcent
kolejnosc: 60

czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

# -----------------------------------------------------------------------------
# ORDRE CRITIQUE (str.replace séquentiel) — AUDYT 18.12 (W-3) : les règles
# latines de l'audit W-4 sont remplacées par la translittération cyrillique
# complète. Tous les résultats sont cyrilliques — les motifs latins
# ultérieurs ne peuvent plus abîmer les résultats précédents.
#   1. c' élidé, suffixe -tion
#   2. Groupes vocaliques (eau, oeu, au, ou, oi, eu, ai, ei)
#   3. Digrammes consonantiques (ch, ph, gn, gue/gui, ge/gi, qu, j)
#   4. h muet supprimé (APRÈS ch/ph), ce/ci, u → ю
#   5. Lettres seules → cyrillique
# -----------------------------------------------------------------------------
zamiany:
  # --- 1. c' élidé (c'est, c'était) — apostrophe droite et typographique ---
  - { wzor: "c'", zamiana: "с'" }
  - { wzor: "C'", zamiana: "С'" }
  - { wzor: "c’", zamiana: "с’" }
  - { wzor: "C’", zamiana: "С’" }
  # --- suffixe -tion → сьон ---
  - { wzor: "tion", zamiana: "сьон" }
  - { wzor: "Tion", zamiana: "Сьон" }
  - { wzor: "TION", zamiana: "СЬОН" }

  # --- 2. Groupes vocaliques (les plus longs d'abord) ---
  - { wzor: "eau", zamiana: "о"  }
  - { wzor: "Eau", zamiana: "О"  }
  - { wzor: "EAU", zamiana: "О"  }
  - { wzor: "oeu", zamiana: "ё"  }
  - { wzor: "Oeu", zamiana: "Ё"  }
  - { wzor: "OEU", zamiana: "Ё"  }
  - { wzor: "au",  zamiana: "о"  }
  - { wzor: "Au",  zamiana: "О"  }
  - { wzor: "AU",  zamiana: "О"  }
  - { wzor: "ou",  zamiana: "у"  }
  - { wzor: "Ou",  zamiana: "У"  }
  - { wzor: "OU",  zamiana: "У"  }
  - { wzor: "oi",  zamiana: "уа" }
  - { wzor: "Oi",  zamiana: "Уа" }
  - { wzor: "OI",  zamiana: "УА" }
  - { wzor: "eu",  zamiana: "ё"  }
  - { wzor: "Eu",  zamiana: "Ё"  }
  - { wzor: "EU",  zamiana: "Ё"  }
  - { wzor: "ai",  zamiana: "е"  }
  - { wzor: "Ai",  zamiana: "Е"  }
  - { wzor: "AI",  zamiana: "Е"  }
  - { wzor: "ei",  zamiana: "е"  }
  - { wzor: "Ei",  zamiana: "Е"  }
  - { wzor: "EI",  zamiana: "Е"  }

  # --- 3. Digrammes consonantiques ---
  - { wzor: "ch",  zamiana: "ш"  }
  - { wzor: "Ch",  zamiana: "Ш"  }
  - { wzor: "CH",  zamiana: "Ш"  }
  - { wzor: "ph",  zamiana: "ф"  }
  - { wzor: "Ph",  zamiana: "Ф"  }
  - { wzor: "PH",  zamiana: "Ф"  }
  - { wzor: "gn",  zamiana: "нь" }
  - { wzor: "Gn",  zamiana: "Нь" }
  - { wzor: "GN",  zamiana: "НЬ" }
  # --- gu + e/i (u muet) — AVANT ge/gi et u → ю ---
  - { wzor: "gue", zamiana: "ге" }
  - { wzor: "Gue", zamiana: "Ге" }
  - { wzor: "GUE", zamiana: "ГЕ" }
  - { wzor: "gui", zamiana: "ги" }
  - { wzor: "Gui", zamiana: "Ги" }
  - { wzor: "GUI", zamiana: "ГИ" }
  # --- ge/gi → же/жи ---
  - { wzor: "ge",  zamiana: "же" }
  - { wzor: "Ge",  zamiana: "Же" }
  - { wzor: "GE",  zamiana: "ЖЕ" }
  - { wzor: "gi",  zamiana: "жи" }
  - { wzor: "Gi",  zamiana: "Жи" }
  - { wzor: "GI",  zamiana: "ЖИ" }
  # --- qu → к (AVANT u → ю) ---
  - { wzor: "qu",  zamiana: "к"  }
  - { wzor: "Qu",  zamiana: "К"  }
  - { wzor: "QU",  zamiana: "К"  }
  # --- j → ж ---
  - { wzor: "j",   zamiana: "ж"  }
  - { wzor: "J",   zamiana: "Ж"  }

  # --- 4. h muet supprimé (APRÈS ch/ph), ce/ci, u → ю ---
  - { wzor: "h",   zamiana: ""   }
  - { wzor: "H",   zamiana: ""   }
  - { wzor: "ce",  zamiana: "се" }
  - { wzor: "Ce",  zamiana: "Се" }
