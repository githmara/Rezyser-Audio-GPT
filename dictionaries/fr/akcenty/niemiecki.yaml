# -----------------------------------------------------------------------------
#  ACCENT ALLEMAND (français → TTS allemand)
#  Pour les synthétiseurs : Hedda / Stefan / Katja (TTS allemand).
# -----------------------------------------------------------------------------
id: niemiecki
etykieta: "Allemand (par ex. Hedda / Stefan / Katja)"
opis: |
  Adapte le texte français au synthétiseur vocal allemand (Hedda / Stefan /
  Katja).

  Différences phonétiques critiques français → allemand :
    - « ch » fr = /ʃ/, « ch » de = /x/ → on écrit « sch ».
    - « j »  fr = /ʒ/, « j »  de = /j/ → on écrit « sch » (approximation).
    - « ou » fr = /u/, « ou » de inhabituel → on écrit « u ».
    - « u »  fr = /y/, « ü »  de = /y/ ✓ → on écrit « ü ».
    - « ç »  fr = /s/, absent en de → on écrit « ss ».
    - « qu » fr = /k/, « qu » de = /kv/ → on écrit « k ».
    - « gn » fr = /ɲ/, « gn » de = /gn/ → on écrit « nj ».
    - « h »  fr muet, « h »  de aspiré → on supprime.

  Accents naturels laissés intentionnellement : nasalisation française
  (an/en/in/on/un) — TTS allemand lit en voyelle + n, ce qui est l'accent
  recherché.
iso: de
kategoria: akcent
kolejnosc: 30

czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: false
skleja_pojedyncze_litery: true

zamiany:
  # AUDYT 18.12 (W-4): usunięte „h"→„" (kasowało h ze świeżych sch);
  # „j"→„sch" PRZED „gn"→„nj" (inaczej nj→nsch); pułapka samogłoskowa
  # rozwiązana łańcuchem naprawczym: „qu"→„k" najpierw, potem „u"→„ü"
  # (łapie też u wewnątrz ou/au/eu), potem naprawy „oü"→„u" (francuskie
  # ou = niemieckie /u/), „aü"→„au", „eü"→„eu". Koniec „au"→„aü",
  # „vieux"→„vieüx", „douze"→„düze".
  - { wzor: "ch", zamiana: "sch" }
  - { wzor: "Ch", zamiana: "Sch" }
  - { wzor: "CH", zamiana: "SCH" }
  - { wzor: "qu", zamiana: "k"   }
  - { wzor: "Qu", zamiana: "K"   }
  - { wzor: "QU", zamiana: "K"   }
  - { wzor: "j",  zamiana: "sch" }
  - { wzor: "J",  zamiana: "Sch" }
  - { wzor: "gn", zamiana: "nj"  }
  - { wzor: "Gn", zamiana: "Nj"  }
  - { wzor: "GN", zamiana: "NJ"  }
  - { wzor: "u",  zamiana: "ü"   }
  - { wzor: "U",  zamiana: "Ü"   }
  - { wzor: "oü", zamiana: "u"   }
  - { wzor: "Oü", zamiana: "U"   }
  - { wzor: "OÜ", zamiana: "U"   }
  - { wzor: "aü", zamiana: "au"  }
  - { wzor: "Aü", zamiana: "Au"  }
  - { wzor: "AÜ", zamiana: "AU"  }
  - { wzor: "eü", zamiana: "eu"  }
  - { wzor: "Eü", zamiana: "Eu"  }
  - { wzor: "EÜ", zamiana: "EU"  }
  - { wzor: "ç",  zamiana: "ss"  }
  - { wzor: "Ç",  zamiana: "Ss"  }
