# -----------------------------------------------------------------------------
#  ACCENT ANGLAIS (français → TTS anglais)
#  Pour les synthétiseurs : David / Zira / Samantha / Hazel (TTS anglais).
# -----------------------------------------------------------------------------
id: angielski
etykieta: "Anglais (par ex. David / Zira / Samantha)"
opis: |
  Adapte le texte français au synthétiseur vocal anglais (David / Zira /
  Samantha / Hazel).

  Différences phonétiques critiques français → anglais :
    - « ch » fr = /ʃ/, « ch » en = /tʃ/ → on écrit « sh ».
    - « j »  fr = /ʒ/, « j »  en = /dʒ/ → on écrit « zh » (digramme russe).
    - « gn » fr = /ɲ/, « gn » en = /gn/ → on écrit « ny ».
    - « ou » fr = /u/, « ou » en = /aʊ/ → on écrit « oo ».
    - « ç »  fr = /s/, lecture en imprévisible → on écrit « s ».
    - « qu » fr = /k/, « qu » en = /kw/ → on écrit « k ».
    - « h »  fr muet, « h » en aspiré → on supprime.

  Accents naturels laissés intentionnellement : nasalisation française
  (an / en / in / on / un) sans équivalent anglais, « r » uvulaire vs.
  « r » alvéolaire — sources naturelles d'un accent « English speaks French ».
iso: en
kategoria: akcent
kolejnosc: 40

czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

zamiany:
  # AUDYT 18.12 (W-4): usunięte „h"→„" — kasowało h ze świeżych sh/zh
  # („chez Charles"→„sez Sarles"). Angielski i tak nie czyta francuskiego
  # h muet na tyle często, by warto było niszczyć każdy digraf.
  - { wzor: "ch", zamiana: "sh" }
  - { wzor: "Ch", zamiana: "Sh" }
  - { wzor: "CH", zamiana: "SH" }
  - { wzor: "gn", zamiana: "ny" }
  - { wzor: "Gn", zamiana: "Ny" }
  - { wzor: "GN", zamiana: "NY" }
  - { wzor: "ou", zamiana: "oo" }
  - { wzor: "Ou", zamiana: "Oo" }
  - { wzor: "OU", zamiana: "OO" }
  - { wzor: "qu", zamiana: "k"  }
  - { wzor: "Qu", zamiana: "K"  }
  - { wzor: "QU", zamiana: "K"  }
  - { wzor: "j",  zamiana: "zh" }
  - { wzor: "J",  zamiana: "Zh" }
  # « ç » N'EST PAS ici (correction v18.19) : le champ `alfabet` du français
  # compte 26 lettres ASCII, donc `polskie_znaki` dans `podstawy.yaml`
  # normalise « ç » en « c » AVANT cette liste — une règle sur « ç » était
  # inatteignable. La cédille se lit donc comme /k/ dans « français » ;
  # la corriger demanderait de désactiver la pré-passe pour cette paire et
  # d'y réécrire la table complète des diacritiques françaises.
