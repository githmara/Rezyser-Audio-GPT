# POST-PRODUCTION : TITRES DE CHAPITRE PAR IA
# Outil pour le mode Livre audio : itère sur les chapitres dans le fichier
# de projet enregistré et génère pour chacun un court titre littéraire.
# Utilise par défaut un modèle peu coûteux (claude-sonnet-5).

id: tytuly
etykieta: "Attribuer les titres de chapitre (IA)"
kategoria: postprodukcja
kolejnosc: 10

# --- Visibilité et portée du traitement (v18.12) ---
# Modes créatifs proposant cet outil (liste des id de modes).
dla_trybow: [audiobook]
# per_rozdzial = itération chapitre par chapitre ; calosc = un seul appel avec le fichier entier.
zakres: per_rozdzial
# Limite de tokens de sortie par appel à l'IA (un titre tient sur une seule ligne).
max_tokens_wyjscia: 256

# --- Paramètres Anthropic ---
model: claude-sonnet-5
temperatura: 0.7
jezyk_odpowiedzi: français
kod_jezyka: fr

# --- Prompt système ---
prompt_systemowy: |
  Tu es un éditeur littéraire raffiné. Réponds uniquement avec le titre.

# --- Modèle de prompt utilisateur (role=user) ---
# Espaces réservés : {naglowek}, {probka}
prompt_uzytkownika_szablon: |
  Voici le contenu d'une section de livre ({naglowek}). Invente UN titre court, accrocheur et littéraire, sans guillemets.

  CONTENU :
  {probka}

# --- Paramètres d'itération sur le fichier de projet ---
regex_podzial_rozdzialow: "(?i)\\n*(Prologue|Chapitre \\d+|Épilogue)\\n*"
min_dlugosc_fragmentu: 50
max_dlugosc_probki: 6000

# Messages dans la fenêtre de résultats :
etykieta_fragment_zbyt_krotki: "(Section trop courte)"
etykieta_bled_brak_kredytow: "(Erreur — crédit API épuisé)"

# Per-rozdziałowe napisy (v17.10, w języku treści przepisu):
etykieta_odrzucenie: "(Refus de l'IA)"
etykieta_blad_fragment: "(Erreur – {blad})"
