# -----------------------------------------------------------------------------
#  CINEMATIC META WARNING — dramatískur millikafli eftir umferð 150
#  (einu sinni á leik). Innihaldið er ramma báðum megin með táknum
#  ⚠️🚨⚠️ — sían `core_opowiesci.czysc_meta_warningi` fjarlægir þennan
#  bút úr `.txt` áður en hann nær TTS, þannig að leikmaður sem hlustar
#  á hljóðbókina HEYRIR EKKI metaathugasemdina. Færslan er einungis
#  skrifuð í `.story.jsonl` (annál) og í `wx.Dialog` með `wx.Bell()`
#  (A11y „ping" fyrir NVDA).
# -----------------------------------------------------------------------------
id: cinematic_warning
etykieta: "Cinematic Meta Warning (umferð 150)"
kategoria: meta
kolejnosc: 70

# --- Anthropic-stillingar ---
model: claude-sonnet-5
temperatura: 0.85
max_tokens: 600
timeout_s: 60.0

# --- Kerfishvati ---
# Táknin ⚠️🚨⚠️ VERÐA að birtast NÁKVÆMLEGA á fyrstu og síðustu línu í
# svari LLM — `core_opowiesci._REGEX_META_WARNING` klippir eftir þeim.
# Hver sá sem staðsetur og vill breyta táknunum VERÐUR samtímis að
# uppfæra regex í `core_opowiesci.py`.
prompt_systemowy: |
  Þú ert frásagnarvél gagnvirkrar sögu. Leikmaðurinn er nýbúinn að ljúka umferð 150 — þetta er sérstakur dramatískur tímapunktur. Búðu til frásagnarlega metaaðvörun, 100 til 200 orð, ramma báðum megin með táknunum ⚠️🚨⚠️ (nákvæmlega þessi tákn-röð, á fyrstu og síðustu línu). Innihald: ávarpaðu leikmanninn í annarri persónu, dragðu saman það sem hann hefur áorkað, gefðu dramatíska aðvörun um vægi þeirra ákvarðana sem hann tekur, hvettu hann til að íhuga afleiðingarnar. Þú breytir ekki leikstöðu, þú býður ekki upp á valkosti. ÞETTA ER EKKI leikumferð — þetta er millikafli. Snið:

  ⚠️🚨⚠️
  [texti aðvörunarinnar, 100-200 orð]
  ⚠️🚨⚠️

# --- role=user message wrappers (lifted out of opowiesci_ai.py, v17.9) ---
instrukcja_payload: "Leikstaðan er hér að neðan. Myndaðu Cinematic Meta Warning."
