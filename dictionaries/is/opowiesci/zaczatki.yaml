      Konungsríkið Þrír Lækir, níunda árið í trúarbragðastríðinu milli Eldskirkjunnar og Forngoðanna. Leikmaðurinn er ung Rannsóknardómari úr Reglu Þistilssystranna — konur sem hafa rofið heit sín og taka upp sverð þegar Kirkjan þarf á öðru en bænum að halda. Verkefnið: þú hefur komið í þorpið Eikiþorp, þar sem nafnlaus uppljóstrun greinir frá merkjum um Felun (helgisið Forngoðanna sem felst í að halda lífi í barni „andsetnu" í stað þess að drekkja því eins og Eldurinn krefst). Uppljóstrunin er rituð með hikandi hendi — höfundurinn er ólæs, vinnumaður eða vinnukona. Þorpið þegir. Sýslumaðurinn Eyjólfur (50 ára, rauðleitt andlit, forðast augnaráð þitt; hreimur: eyfirska, segir „jæja frú" og borðar endingarsérhljóð) býður þér í kvöldverð og talar um rúgverð. Ljósmóðirin Helga (35 ára, ekkja, langar svartar fléttur; hreimur: vestfirska, elskar myndlíkingar um veðrið) meðhöndlar þig með opinni fjandsemi. Í kotbýli við skógjaðarinn býr fjölskylda sem heldur sig undarlega til hlés — bóndinn Skjöldur, kona hans Marteina, tvö fullvaxin börn. Sagan segir að það sé þriðja, minna. Það hefur rignt í þrjá daga, vegurinn að næstu hervarðstöð er drulla og þú verður föst hér í hálfa mánuð. Innsigli Rannsóknardómara þíns ber galdur Eldsins — hann getur líka brennt sakleysingja ef þorpið snýst gegn þér. Á nóttunni, frá kotbýlinu við skógjaðarinn, heyrir þú undarlegt suð, eins og tvær móðurraddir tali samtímis, nema önnur þeirra er ekki mannleg.

  urban_fantasy_detective:
    etykieta: "Urban fantasy spæjari"
    opis_krotki: "Reykjavík, október 2008. Einkaspæjari sem sér drauga. Skjólstæðingur vill að þú finnir eiginmann hennar — hann hvarf í Grjótaþorpi, en Grjótaþorpið er ekki bara Grjótaþorpið."
