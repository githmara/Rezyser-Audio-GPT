    seed_swiata: |
      Reykjavík, október 2008, rigningardagur — bankarnir hrundu fyrir tveimur vikum, gengið hrunið, allir á taugum. Leikmaðurinn er einkaspæjari — Jakob „Jakki" Þorsteinsson, 38 ára, fyrrverandi rannsóknarlögreglumaður, leystur frá störfum fyrir drykkju á vakt. Hann ber með sér eitthvað sem hann vill ekki nefna: hann sér skugga sem eiga ekki að vera þarna. Andlit aftan við axlir vegfarenda. Skuggalegar verur í Hólavallagarði sem svara spurningum þínum ef þú færir þeim brennivínsdropa. Jakki trúir ekki á „dulrænu", en eftir skilnaðinn og botnlangaaðgerðina viðurkennir hann að eitthvað sé ekki lengur rétt í honum. Í dag, á skrifstofu hans á Hverfisgötu (lágur leiga, stiginn lyktar af gömlum reyk), kemur kona inn — Nóra Jónsdóttir, 45 ára, ekkja í mánuð, viðurkennir loksins fyrir sjálfri sér að eitthvað sé bogið. Eiginmaður hennar Tómas, veitingamaður í Grjótaþorpi, „fór á fiskmarkaðinn að ná í steinbít" á þriðja deginum eftir Allraheilagra messu. Hann kom heim eðlilega um kvöldið, en frá þeirri nóttu muldraði hann fyrir munni sér á þýsku — tungumáli sem hann talaði ekki. Tveimur vikum síðar stökk hann af Sundabrú. Lögreglan flokkaði málið sem sjálfsvíg. Nóra heldur annað. Andrúmsloft: Reykjavík klofin milli gamalla bárujárnshúsa og glerturna á Borgartúni, rigningarsuða, kaffihúsin lykta af kanilsnúðum og köldu tóbaki, heimilislausir sofa í hurðaopum og hugsanlega líka eitthvað annað. Endurteknar persónur: Nóra (snyrtileg grá klipping, ofurlítill borgnesingur í hreim), ylirannsóknarlögreglumaðurinn Davíð (60 ára, gamall vakta-félagi Jakka, lætur hann enn fá bein; hreimur: Reykjavíkurslangur, felur sig á bak við gamansögur þegar samtalið verður alvarlegt).

  kosmiczny_horror:
    etykieta: "Kosmískur hryllingur"
    opis_krotki: "Rannsóknarstöð á braut um nifteindastjörnu. Áhöfnin vaknar úr dvala — án skipherra. Og án nokkurs ummerkis um að skipherra hafi nokkurn tíma verið til."
