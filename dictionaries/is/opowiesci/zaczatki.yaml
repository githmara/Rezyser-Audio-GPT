    seed_swiata: |
      Reykjavík, Þingholtin, apríl 2024. „Vindkaffi" — lítið kaffihús á Skólavörðustígnum, opið síðan 1998, í bárujárnshúsi frá fyrri stríðstíma. Eigandinn er Arnaldur Pálsson, 67 ára, leikhúsleikmyndahönnuður á eftirlaunum sem rekur staðinn af ást frekar en gróðasjónarmiðum. Hinn starfsmaðurinn er barista og þjónustustúlka í senn — leikmaðurinn: Áslaug Jónsdóttir, 31 ára, með próf í ensku, vinnur hér í fjögur ár, dreymir um að opna eigin bókabúð. Kaffihúsið er andrúmsloft í sjálfu sér: gamlar ritvélar á hillunum, vínyl-djúkkbox, uppréttur Pleyel-flygill sem nágranninn Konráð á eftirlaunum spilar á laugardögum. Viðskiptavinirnir eru fastagestir, hlýir, elskaðir. Vandamálið: húseigandinn, Reynir Bjarnason (55 ára, ágengur, talar hratt), hefur tvöfaldað leiguna — Arnaldur getur ekki greitt. Sex vikur fram að lokun. Á hverjum degi situr sami maðurinn á kaffihúsinu, Hrafn Sigurðsson (38 ára, ritstjóri í lítilli bókaforlagi, kurteis, sárt feiminn) — Áslaug hefur tekið eftir honum í marga mánuði en hefur ekki sagt við hann orð. Í morgun viðurkennir Arnaldur fyrir Áslaugu að Hrafn sé frændi Reynis og að hann eigi að „leggja gott orð inn fyrir kaffihúsið". Arnaldur ætlast til þess að Áslaug „sé góð" við Hrafn — á þann hátt sem henni líkar ekki. Og hún hafði löngu ætlað að ganga til Hrafns að eigin frumkvæði, frjáls. Það er mánudagseftirmiðdagur. Hrafn er nýkominn inn, hefur pantað flat white, sest við borðið við gluggann. Arnaldur starir á þig vitiborinn úr bakvið afgreiðsluborðið.
