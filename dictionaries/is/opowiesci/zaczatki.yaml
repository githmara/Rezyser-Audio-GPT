# -----------------------------------------------------------------------------
#  ZACZATKI — 5 Quick Start forstillingar fyrir nýjan leik. Þegar
#  leikmaðurinn velur „Nýr leikur" fyllir valda forstillingin sjálfkrafa
#  haminn og dælir `seed_swiata` inn í snapshot-ið (LLM fær hann sem
#  samhengi opnunarsenunnar).
#
#  HVER forstilling er skrifuð HANDVIRKT eftir tungumáli — þetta er
#  bókmenntir, ekki tæknileg i18n. Markmálið hefur sín eigin
#  menningarlegu mótíf; VIÐ köllum EKKI yfir úr pólsku (sbr.
#  `feedback_yaml_prompty.md` og `feedback_lokalizacja_nazw.md`).
#
#  Svið IS: íslensk svið (skýli í hraunhellum Reykjanesskaga / norrænt
#  miðaldarríki / Reykjavík 2008 í fjármálahruninu / rannsóknarstöð með
#  íslenskumælandi áhöfn / kaffihús í 101 Reykjavík). Nöfn, hreimir og
#  menningartilvísanir eru íslenskt í eðli sínu, ekki umritun úr pólsku.
#
#  Reitur `tryb_domyslny`: 3=Frjáls / 4=Val / 5=Minna illa.
#  Fyrir blindan leikmann eru hamir 4 og 5 æskilegir (smellanleg
#  nákvæm val), en Frjáls er haldið fyrir hrylling/gamanleik (þar sem
#  spuni leikmannsins er hluti af upplifuninni).
#
#  YAML-lyklar (`po_apokaliptyczna_sf` o.s.frv.) eru áfram á pólsku —
#  þetta eru innri auðkenni stöðu-vísuð af viðmótinu, ekki strengir
#  sýnilegir notandanum.
# -----------------------------------------------------------------------------
zaczatki:

  po_apokaliptyczna_sf:
    etykieta: "Eftirheimsendis-SF"
    opis_krotki: "Tveimur öldum eftir vistfræðilegt hrun. Leifar mannkynsins í skýlum grafnum undir Reykjanesi. Val milli raunsæis og mannúðar."
    tryb_domyslny: 4
    seed_swiata: |
      Heimurinn, tvö hundruð árum eftir Brennan löngu — alheimshamfarir sem brenndu lofthjúpinn. UV-geislar drepa alla sem stíga upp á yfirborðið án búninga. Mannkynið býr í skýlum sem skorin hafa verið í hraunhella Reykjanesskagans, lifir á vatnsræktun, gerviprótíni og núll-vatns hagkerfi. Leikmaðurinn er ungur sendiboði frá Klaninu Bergrót, einni af tólf samfélögum sem lifa af neðanjarðar. Klanin versla sín á milli en berjast stundum um auðlindir — rafhlöðufrumur, sáðkorn, gen sem geislunin hefur ekki enn brotið niður. Bergrót á leyndarmál: loftræstipípan opnast út í neðanjarðarvatn af fersku vatni. Enginn utan Öldungaráðsins veit það. Leikmaðurinn hefur einmitt fengið sitt fyrsta alvarlega verkefni — að smygla míkróflóru af probiotic-um til Klans Æðarkollu, sem er að deyja úr óafturkræfri þarmaójafnvægi. Leiðin liggur um flæddu gönguna, þar sem sagt er að lifi stökkbreyttar rottur. Endurteknar persónur: Halla Magnúsdóttir (40 ára, sendiboðadispatcher, raunsæ; hreimur: stuttar setningar, kallar alla nýliða „elskan mín" í stað nafns), gamli Þorbergur (60 ára, Öldungur klansins, ber minninguna fyrir Brennuna; hreimur: forn-íslenska, notar orð úr sjónvarpsfréttum níunda áratugarins). Andrúmsloft þrúgandi, appelsínugult neon af natríumlömpum, lykt af vélaolíu og myglu.

  mroczne_fantasy:
    etykieta: "Dark fantasy"
    opis_krotki: "Útnári konungsríkis gegnsóða af rigningu. Djöfla-rannsóknardómari á slóð þorpsbúa sem kannski fela barn — eða eitthvað margfalt verra."
