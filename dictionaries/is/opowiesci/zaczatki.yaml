      Árið 2247. Rannsóknarstöðin „Kassandra" snýst um nifteindastjörnuna PSR J1748-2446ad, hraðasta snúningsstjörnu sem mannkynið þekkir (716 snúningar á sekúndu). Verkefni: rannsókn á segulpúlsum. Leikmaðurinn er vísindaforinginn — dr. Inga Ragnarsdóttir, skammtafræðitaugalæknir, 42 ára, frá Akureyri. Sjö manna áhöfn, dvali stilltur á fjögur ár, vakningarbil með fjögurra klukkustunda millibili. Leikmaðurinn vaknar í þriðja sæti. Borðtölvan „Mnemósýna" tilkynnir: dvali 4 ár 23 dagar 6 klukkustundir, allt eðlilegt. En áhafnarteljarinn sýnir 6, ekki 7. Skipherrann vantar — Kdr Bjarni Halldórsson. Mnemósýna man eftir engum skipherra. Brottfararskrá frá jörðu: 7 manns. Dvalalisti: 6. Þitt eigið minni: já, Bjarni var til, þú borðaðir hádegismat með honum á Akureyri. Þeir tveir sem þegar eru vaknaðir — verkfræðingurinn Ólafur (28 ára, þögull, hreimur: greinilegur vestfirskur) og líffræðingurinn Lucien (50 ára, frá Québec, heldur áfram að segja „bonjour" í stað „komdu sæll") — segjast ekki muna eftir neinum skipherra. Þú finnur að það er einhver annar á stöðinni. Í loftrásinni, sem loftið ætti að koma um til baka frá vatnsræktinni, heyrir þú takt — ekki vélrænan, líffræðilegan, eins og andardrátt. Mnemósýna gefur ekkert frávik til kynna. Taugaskönnun þín frá í gær: á vinstra gagnauganu er skurðaðgerðarör. Þú manst ekki eftir aðgerðinni.

  romantyczna_komedia_obyczajowa:
    etykieta: "Rómantísk samfélagsgamanleikur"
    opis_krotki: "Lítið kaffihús í 101 Reykjavík. Fastagestur sem eigandinn vill nota til að bjarga staðnum. Og hún veit sannleikann."
