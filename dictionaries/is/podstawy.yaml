# =============================================================================
#  GRUNNATRIÐI ÍSLENSKU
# =============================================================================
#
#  Grunnskrá fyrir `dictionaries/is/`. Poliglota-vélin krefst þess að hvert
#  tungumál hafi þessa skrá — án hennar er nýtt tungumál EKKI yfirhöfuð
#  greint.
#
#  Uppbygging er mótuð eftir `dictionaries/pl/podstawy.yaml`. Reiturinn
#  `polskie_znaki`, þrátt fyrir sögulegt nafn, hýsir ALLA broddstafi sem
#  þarf að umrita í ASCII áður en dulritun eða hreimsreglur eru beittar.
#  Íslenskir broddstafir Á, É, Í, Ó, Ú, Ý, Þ, Æ, Ö og Ð eru NATIVA og
#  EKKI með á þessari listan — þeir eru hluti stafrófsins og Caesar
#  dulritar þá beint.
# =============================================================================

id: podstawy
jezyk: is
# 13.4.3: lingua-language-detector auðkenni notað af Poliglota-vélinni.
# Verður að vera nafn `lingua.Language` enum-s (hástafir, án forskeytis) —
# fullur listi: https://github.com/pemistahl/lingua-py. Ef reiturinn vantar
# er tungumálið slökkt í skynjaranum (sticky-fallback tekur við), mappan
# verður áfram sýnileg.
lingua: ICELANDIC
etykieta: "Íslenska – hljóðfræðilegur grunnur"
opis: |
  Grunnreglur íslenskunnar:
    1. Umritun broddstafa fyrir evrópsk lánsorð (`polskie_znaki`) — svo
       að Caesar og hreimsvélar sjái aðeins 32-stafa íslenska stafrófið.
    2. Íslenska stafrófið (32 hástafir, í eigin röð, án C, Q, W, Z) –
       notað af Caesar-dulmálinu.

# -----------------------------------------------------------------------------
# Umritun broddstafa. Sérhver ekki-íslenskur latneskur stafur er tengdur við
# rithátt sem Caesar og hreimsreglurnar ráða við, þ.e. rithátt sem er skrifaður
# með stöfunum í `alfabet` hér að neðan. Íslenskir broddstafir Á, É, Í, Ó, Ú,
# Ý, Þ, Æ, Ö, Ð eru EKKI á þessum lista — þeir eru hluti stafrófsins.
#
# v19.7: MARKMIÐIÐ ER ÍSLENSKA, EKKI NAKINN GRUNNSTAFUR. Fram að v19.6 féll
# sérhver erlendur stafur niður í grunnstaf sinn, og það var rýrnun en
# ekki einföldun: forkeyrslan (pre-pass) gengur Á UNDAN `zamiany`-lista HVERS
# hreims pakkans, svo `š → s` henti öllu sem vitað var um hljóðið áður en
# nokkur hreimur fékk að sjá það. Erlendur stafur sem ber STÖÐUGT hljóð sem
# íslenskan skrifar sjálf fær héðan í frá íslenska ritháttinn — og þá rithætti
# á íslenskan þegar til í tökuorðum (sjampó, sjeik, sjokk, djass, djús,
# Tsjetsjenía), svo hér er engin transkripsjón fundin upp:
#     š ş ŝ ś ž ĵ ź ż → sj    č ĉ ċ ć → tsj    đ ĝ ġ → dj    ř → rsj
#     ñ → nj    ţ → ts    ç → s    ą → on    ę → en    å → o    ø œ ő → ö
#   Mælt: „Škoda Žižek Dvořák Đoković" verður „Sjkoda Sjisjek Dvorsják
#   Djokovitsj" í stað „Skoda Zizek Dvorák Dokovic", og „garçon Søren cœur"
#   verður „garson Sören cöur" í stað „garcon Soren coeur".
#
# ÞRJÁR ÁKVARÐANIR SEM ERU INNIHALD ÞESSA LISTA:
#   1. RADDAÐ OG ÓRADDAÐ RENNUR SAMAN, OG ÞAÐ ER ENGIN TÖPUN. Íslenskan á
#      hvorki [z] né [ʒ], svo bæði `š` og `ž` fá `sj`: röddunin var hvort eð er
#      hljóð sem þessi rödd getur ekki myndað. Viðmiðið spyr um RÖDD ÞESSA
#      PAKKA, ekki um upprunamálið.
#   2. `ø œ ő → ö` HITTIR EIGIN STAF PAKKANS (v19.7 leyfir það: Ö stendur í
#      `alfabet`). Danska ø og íslenska ö eru sami kringdi framgómsstafurinn,
#      svo „Søren → Sören" er réttara en „Soren" — og um leið vakna ö-reglur
#      hreimanna, sem fóru aldrei í gang fyrir danskan texta. Sama hugsun
#      liggur að baki `å → o`.
#   3. `ł → l` STENDUR ÁFRAM, ÞÓTT FINNSKI PAKKINN TAKI `ł → v`. Pólska ł er
#      [w]; finnskan á [ʋ], nálgunarhljóð sem hún notar sjálf fyrir enskt w,
#      en íslenska v er önghljóð og hér er ekkert að miða á. Sami stafur, tveir
#      pakkar, tvö rétt svör. Af sömu ástæðu helst `ŭ → u`.
#   `ñ → nj` en `ń ň ņ → n`: allir fjórir eru [ɲ], svo hljóðið sker ekki úr —
#   STAÐAN gerir það. Spænska endar aldrei orð á ñ (mañana → manjana), en
#   pólska, tékkneska og lettneska gera það stöðugt (Poznań, Plzeň), og
#   íslenskt orð endar ekki á -nj.
#
# AFGANGURINN HELST ASCII OG ÞAÐ ER LÍKA ÁKVÖRÐUN. Viðmiðið hefur tvær hliðar
# og báðar verða að halda: UPPRUNINN verður að merkja eitt hljóð í þeim málum
# sem hann kemur úr (`ä` er þýskt [ɛ] í eitt skipti og finnskt [æ] það næsta),
# og MARKMIÐIÐ verður að vera eitthvað sem rödd ÞESSA pakka les eins í hvert
# sinn. Pólska `ó` er ekki á listanum yfirleitt — það rekst á íslenska Ó
# (athugasemdin hér að neðan er óbreytt frá 15.x).
#
# NÝR TVÍSTAFUR ER SKULD SEM HREIMAR PAKKANS GREIÐA. Hreimur sem umritar (yfir
# í kýrillískt letur) hefur reglu fyrir hvern EINSTAKAN staf, svo tvístafur sem
# hann þekkir ekki sem HEILD sundrast. Þrjár einingarreglur í
# `akcenty/rosyjski.yaml` greiða þá skuld — og um leið eldri skuld, því sj, tsj
# og dj komu þegar fyrir í venjulegum íslenskum texta (sjampó, djús).
#
# Mörkin ver `audyt_podstaw` (flokkur `znaki-cel-obcy`): markmiðið má vera
# ASCII eða stafur úr `alfabet` hér að neðan — aldrei stafur þriðja málsins.
# -----------------------------------------------------------------------------
polskie_znaki:
  # -- Pólskir stafir: hver þeirra merkir EITT hljóð í pólsku og fyrir hvert
  #    þeirra á íslenskan rithátt, svo við skrifum ritháttinn í stað þess að
  #    fella broddinn burt. Undantekningar: `ł` (ekkert [w] í íslensku) og
  #    `ń` (staðan í orðslok — sjá haus) --
  - { wzor: "ą", zamiana: "on"  }
  - { wzor: "ć", zamiana: "tsj" }
  - { wzor: "ę", zamiana: "en"  }
  - { wzor: "ł", zamiana: "l"   }
  - { wzor: "ń", zamiana: "n"   }
  - { wzor: "ś", zamiana: "sj"  }
  - { wzor: "ź", zamiana: "sj"  }
  - { wzor: "ż", zamiana: "sj"  }
  - { wzor: "Ą", zamiana: "On"  }
  - { wzor: "Ć", zamiana: "Tsj" }
  - { wzor: "Ę", zamiana: "En"  }
  - { wzor: "Ł", zamiana: "L"   }
  - { wzor: "Ń", zamiana: "N"   }
  - { wzor: "Ś", zamiana: "Sj"  }
  - { wzor: "Ź", zamiana: "Sj"  }
  - { wzor: "Ż", zamiana: "Sj"  }
  # NOTE: Polish "ó/Ó" NOT mapped here — collides with native Icelandic Ó.
  # An Icelandic reader of "Łódź" sees "Lódsj" → Caesar encrypts the Ó
  # natively. Acceptable; full ASCII reduction would lose the Icelandic Ó.
  # -- → a (NOT á — native) --
  - { wzor: "à", zamiana: "a"  }
  - { wzor: "â", zamiana: "a"  }
  - { wzor: "ã", zamiana: "a"  }
  - { wzor: "ä", zamiana: "a"  }
  - { wzor: "À", zamiana: "A"  }
  - { wzor: "Â", zamiana: "A"  }
  - { wzor: "Ã", zamiana: "A"  }
  - { wzor: "Ä", zamiana: "A"  }
  # -- → o (sænskt/norskt å er [o], ekki [a]: Ångström → Ongström) --
  - { wzor: "å", zamiana: "o"  }
  - { wzor: "Å", zamiana: "O"  }
  # -- → s (franskt ç er [s]; c er ekki í íslenska stafrófinu) --
  - { wzor: "ç", zamiana: "s"  }
  - { wzor: "Ç", zamiana: "S"  }
  # -- → e (NOT é — native) --
  - { wzor: "è", zamiana: "e"  }
  - { wzor: "ê", zamiana: "e"  }
  - { wzor: "ë", zamiana: "e"  }
  - { wzor: "È", zamiana: "E"  }
  - { wzor: "Ê", zamiana: "E"  }
  - { wzor: "Ë", zamiana: "E"  }
  # -- → i (NOT í — native) --
  - { wzor: "ì", zamiana: "i"  }
  - { wzor: "î", zamiana: "i"  }
  - { wzor: "ï", zamiana: "i"  }
  - { wzor: "Ì", zamiana: "I"  }
  - { wzor: "Î", zamiana: "I"  }
  - { wzor: "Ï", zamiana: "I"  }
  # -- → nj (spænskt ñ; íslenskan skrifar þetta hljóð svona: kanjón) --
  - { wzor: "ñ", zamiana: "nj" }
  - { wzor: "Ñ", zamiana: "Nj" }
  # -- → o (NOT ó — native; NOT ö — native) --
  - { wzor: "ò", zamiana: "o"  }
  - { wzor: "ô", zamiana: "o"  }
  - { wzor: "õ", zamiana: "o"  }
  - { wzor: "Ò", zamiana: "O"  }
  - { wzor: "Ô", zamiana: "O"  }
  - { wzor: "Õ", zamiana: "O"  }
  # -- → ö (danskt ø og franskt œ eru sami kringdi framgómsstafurinn og
  #    íslenska ö; markmiðið er því eigin stafur pakkans) --
  - { wzor: "ø", zamiana: "ö"  }
  - { wzor: "Ø", zamiana: "Ö"  }
  - { wzor: "œ", zamiana: "ö"  }
  - { wzor: "Œ", zamiana: "Ö"  }
  # -- → ss (German) --
  - { wzor: "ß", zamiana: "ss" }
  # -- → u (NOT ú — native) --
  - { wzor: "ù", zamiana: "u"  }
  - { wzor: "û", zamiana: "u"  }
  - { wzor: "ü", zamiana: "u"  }
  - { wzor: "Ù", zamiana: "U"  }
  - { wzor: "Û", zamiana: "U"  }
  - { wzor: "Ü", zamiana: "U"  }
  # -- → y (NOT ý — native) --
  - { wzor: "ÿ", zamiana: "y"  }
  - { wzor: "Ÿ", zamiana: "Y"  }
  # -- Japanese romanization macrons (Tōkyō, rāmen) → base vowel --
  - { wzor: "ā", zamiana: "a"  }
  - { wzor: "ē", zamiana: "e"  }
  - { wzor: "ī", zamiana: "i"  }
  - { wzor: "ō", zamiana: "o"  }
  - { wzor: "ū", zamiana: "u"  }
  - { wzor: "Ā", zamiana: "A"  }
  - { wzor: "Ē", zamiana: "E"  }
  - { wzor: "Ī", zamiana: "I"  }
  - { wzor: "Ō", zamiana: "O"  }
  - { wzor: "Ū", zamiana: "U"  }
  # -- Latin Extended-A: broddstafir sem eru FRAMANDI þessum pakka (v19.5) --
  #    Sjálfgefin pör: `manager_regul_szablony.TABELA_LACINKI`.
  - { wzor: "ă", zamiana: "a" }
  - { wzor: "Ă", zamiana: "A" }
  - { wzor: "ĉ", zamiana: "tsj" }
  - { wzor: "Ĉ", zamiana: "Tsj" }
  - { wzor: "ċ", zamiana: "tsj" }
  - { wzor: "Ċ", zamiana: "Tsj" }
  - { wzor: "č", zamiana: "tsj" }
