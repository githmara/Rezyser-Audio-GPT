  - { wzor: "đ", zamiana: "dj" }
  - { wzor: "Đ", zamiana: "Dj" }
  - { wzor: "ĕ", zamiana: "e" }
  - { wzor: "Ĕ", zamiana: "E" }
  - { wzor: "ė", zamiana: "e" }
  - { wzor: "Ė", zamiana: "E" }
  - { wzor: "ě", zamiana: "e" }
  - { wzor: "Ě", zamiana: "E" }
  - { wzor: "ĝ", zamiana: "dj" }
  - { wzor: "Ĝ", zamiana: "Dj" }
  - { wzor: "ğ", zamiana: "g" }
  - { wzor: "Ğ", zamiana: "G" }
  - { wzor: "ġ", zamiana: "dj" }
  - { wzor: "Ġ", zamiana: "Dj" }
  - { wzor: "ģ", zamiana: "g" }
  - { wzor: "Ģ", zamiana: "G" }
  - { wzor: "ĥ", zamiana: "h" }
  - { wzor: "Ĥ", zamiana: "H" }
  - { wzor: "ħ", zamiana: "h" }
