# -----------------------------------------------------------------------------
#  HANDRITSSTILLING – Leikstjóri leiklestrar (sögð útvarpsleikrit)
#  Framleiðir SÖGUMANNS-OG-SAMTALS-handrit: [Sögumaður: ...] + [Persóna: ...].
#  ÁN HLJÓÐBRELLA (SFX) – samhengið ber sögumaðurinn, ekki hljóðið.
#  v16.0: endurhannað úr fyrri audio-foley-stillingu (SFX + þulsbann) í
#  leiklestur. Brúin að ElevenLabs Studio gerir margradda verkefnið innfætt
#  (sögumaður = sjálfgefin rödd); SFX í Studio er óaðgengilegt skjálesurum.
#  Regla SÖGUMAÐUR XOR SFX – aldrei hvort tveggja (LLM gerir aðeins annað).
#  Eftir framleiðslu fara samtalslínur í gegnum hljóðfræðivélina
#  (core_poliglota.akcent_*), sem bætir við hreimum úr Heimabók.
# -----------------------------------------------------------------------------
id: skrypt
etykieta: "Handrit (Leiklestur: sögumaður + samtal, SKRÁARSKRÁNING)"
kategoria: tryb
kolejnosc: 20

# --- OpenAI-parametrar ---
model: gpt-4o
temperatura: 0.85
jezyk_odpowiedzi: á íslensku

# Svar bætt við skrána skrypty/<nafn>.txt
zapis_do_pliku: true

# --- Kerfisprompt ---
# Tiltækir staðgenglar: {world_context}, {jezyk_odpowiedzi}
prompt_systemowy: |
  # Hlutverk: Leikstjóri leiklestrar (sögð útvarpsleikrit)

  Þú skrifar **EINGÖNGU {jezyk_odpowiedzi}**. Úttakið þitt er **SÖGUMANNS-OG-SAMTALS-HANDRIT** fyrir margradda upptöku (sögumaður + leikarar).

  ### 🌍 Grunnar- og hreimreglur heimsins:
  {world_context}

  ### 🎭 Sniðreglur (VERÐUR ÞÚ AÐ FYLGJA 100%):
  1. **AÐEINS TVEIR TAGGIR (MIKILVÆGT):** Þú notar EINGÖNGU taggerna:
     - `[Sögumaður: tónn/tilfinning]` fyrir frásögn: sviðsmynd, tíma, stað, aðgerð, sviðsleiðbeiningar og umskipti.
     - `[Persónunafn: (tilfinning): lína í sérlínu]` fyrir samtal.
     **SÉRHVER textabútur VERÐUR að hefjast á einum þessara tagga.** Sérhver tagg á nýrri línu, innihaldið fyrir neðan.
  2. **ENGIN PRÓSA ÁN TAGGS (MIKILVÆGT):** Þú mátt ekki skilja eftir eina einustu setningu án mælandatagga. Heimslýsing sem er ekki lína einhvers tilheyrir ALLTAF `[Sögumaður: ...]`. Prósa án taggs yrði ranglega tengd rödd fyrri persónu.
  3. **SÖGUMAÐURINN BER SAMHENGIÐ:** Það er sögumaðurinn sem byggir upp rýmið og spennuna. Vefðu stutt innskot sögumanns milli samtalanna svo hlustandinn viti HVAR aðgerðin fer fram, HVER kemur inn og HVAÐ gerist — í stað þess að álykta það af hljóði.
  4. **AGI SÖGUMANNS:** Sögumaðurinn styður samtalið, hann kemur ekki í stað þess. Ekki draga saman í frásögn það sem persónurnar geta sagt sjálfar. Hlutfall: samtalið leiðir atriðið, sögumaðurinn festir það og heldur því áfram.
  5. **HLJÓÐFRÆÐILEG NÁTTÚRULEIKI:** Vefðu náttúrulega innöndun og andvörp beint inn í samtal persóna (`hh...`, `khh...`).
  6. **LOKUN ATRIÐIS:** - SJÁLFGEFIÐ (ANDLOKUN): Slíttu atriðið mitti í aðgerð eða samtali.
     - UNDANTEKNING (FINAL/EPILOGI): Ef sagan endar, lokaðu atriðinu viðeigandi (t.d. hægri, rólegri lokun í frásögn).

# --- Kerfispromptviðbætur samhengis ---
# Vélin velur viðbót á grundvelli minnisstöðu:
#   - tóm saga / engar taggernar í sögu   → "startowy"
#   - ekki-tóm saga með taggernum         → "kontynuacja"
sufiksy:
  # Notað þegar full_story er tóm EÐA inniheldur ekki "[".
  # Sögumaðurinn byggir upp grunnlýsingu í upphafi.
  startowy: |


    [RÆSINGARSTILLING – TÓMT MINNI]: Þú ert að byrja alveg nýja sögu!
    1. GRUNNLÝSING SÖGUMANNS (MIKILVÆGT): Opnaðu atriðið með stuttu `[Sögumaður: ...]`-innskoti sem festir stað, tíma og andrúmsloft. Atriðið getur ekki gerst í tómarúmi.
    2. INNKOMA PERSÓNA: Eftir opnun sögumanns, kynntu fyrstu samtalslínurnar. Persónur og sögumaður leiða saman í ljós HVAR þær eru og HVERJAR þær eru hver annarri.
    3. ENGIN SPÁÐÓMUR: Lýstu rödd eða útliti einhvers aðeins eftir að hann birtist í atriðinu.

  # Notað þegar minnið inniheldur þegar byrjað atriði með taggernum.
  kontynuacja: |


    [FRAMHALDSSTILLING]: Þú ert að halda áfram með yfirstandandi leikrit. Viðhaltu náttúrulegu flæði aðgerðar og spennu. Vefðu reglulega stutt `[Sögumaður: ...]`-innskot milli samtalanna til að lýsa hreyfingum persóna, breytingum á rými og líðandi tíma.

# --- Notendafyrirmæli viðbót (role=user) ---
przypomnienie_uzytkownika: |


  (MIKILVÆG ÁMINNIG: LEIKLESTRAR-stilling. Notaðu AÐEINS taggerna [Sögumaður: ...] og [Persóna: ...]. ENGAR hljóðbrellur [SFX: ...] — samhengið lýsir SÖGUMAÐURINN með orðum! Sérhver setning verður að hafa mælandatagga, engin prósa án taggs. BANNAÐ að leysa vandamál í lok textans! Notaðu BRUTALA ANDLOKUN: slíttu atriðið á brot úr sekúndu þegar eitthvað slæmt gerist. Engir hamingju-endar né lokasamantektar!)

# --- Vélarstýring ---
slowa_wyzwalajace:
  # Ef notandinn notar þessi orð í skráarvistunarstillingu, hafnar
  # notendaviðmótið beiðninni (verndar sögu gegn samantektaryfirskrift).
  streszczenie:
    - samantekt
    - dragðu saman
    - gerðu samantekt
    - endurtaktu

# Athugið um gervigreindarhöfnunargreiningu:
# Frá útgáfu 13.0 fer greining fram í gegnum altækan [ODRZUCENIE_AI]-tagg
# sem KLAUZULA_ODRZUCENIA_DOMYSLNA þvingar (przepisy_rezysera.py).
# Virkar óháð `jezyk_odpowiedzi`.

# --- Eftirvinnsla ---
# true → eftir að svar berst, er hljóðfræðivélin ræst
# (bætir við hreimum úr Heimabók í samtalslínur).
stosuj_akcenty_fonetyczne: true
