# -----------------------------------------------------------------------------
#  RÚSSNESKUR HREIMUR (íslenska → rússneskur TTS)
#  Fyrir talgervla: Milena / Irina / Yuri / Pavel (rússneskur TTS).
# -----------------------------------------------------------------------------
id: rosyjski
etykieta: "Rússneska (t.d. Milena / Irina / Yuri / Pavel)"
opis: |
  Þýðir íslenskan texta yfir á kýrilískt letur þannig að rússneskur talgervill
  (NVDA → Vocalizer Milena, eSpeak "ru", OneCore Irina/Pavel/Yuri) les
  íslenskan texta með rússneskum hreim.

  Séríslenskar sérhljóðar:
    - á  → а   (beint)
    - é  → э   (hart e — palataliserar ekki)
    - í  → и
    - ó  → о
    - ú  → у
    - ý  → и   (íslenskt ý = /iː/ → rússneskt и = /i/)
    - æ  → ай  (íslenskt /ai/ → rússneskur /aj/ ✓)
    - ö  → ё   (/ø/ → /ʲo/, líkt og finnska → rússneskt)

  Séríslenskar samhljóðar:
    - Þ/þ → с   (/θ/ → Rússar nota /s/ sem nálgun)
    - Ð/ð → д   (/ð/ → /d/)
    - h   → х   (rússneskt /x/ sterkara en íslenskt /h/ — hreimáhrif)

  Íslenskir tvístafir fyrir erlend hljóð (Á UNDAN öllu öðru):
    - sj  → ш   (sjampó, sjeik; einnig markmið forkeyrslunnar fyrir š/ž)
    - tsj → ч   (Tsjetsjenía; markmið forkeyrslunnar fyrir č/ć)
    - dj  → дж  (djass, djús; markmið forkeyrslunnar fyrir đ/ĝ/ġ)
    Án þeirra sundrast tvístafurinn í staka stafi (`sj` → `с` + `й`).

  Staðlaðar latneskur → kýrillískt: sömu reglur og finnska.
  j + sérhljóð (ja/je/jo/ju) → jótaðar rúnar ÁÐUR EN j → й-reglan.
iso: ru
kategoria: akcent
kolejnosc: 45

# --- Pipeline ---
czysc_tekst_tts: true
normalizuj_liczby: true
# Séríslenskir stafir standa í `alfabet`, svo pre-pass snertir þá ekki — þeir
# eru skráðir handvirkt í zamiany hér fyrir neðan. Pre-pass hreinsar aðeins
# erlenda latínustafi (é, š, ü) sem færu annars óbreyttir í kyrillískan texta.
# Tengsl staka latneskra stafa virka ekki eftir kýrillíska þýðingu.
skleja_pojedyncze_litery: false

# -----------------------------------------------------------------------------
# KRITIKAL RÖÐUN SKIPTA:
#   0. Tvístafir (tsj/sj/dj) Á UNDAN öllu öðru — lengsti fyrst.
#   1. Séríslenskir stafir (Þ/þ, Ð/ð, Æ/æ, Á/á, É/é, Í/í, Ó/ó, Ú/ú, Ý/ý, Ö/ö)
#      ÁÐUR EN venjulegar latneskur → kýrillískt (til að koma í veg fyrir
#      tvöfaldar skiptingar).
#   2. j + aðalsérhljóðar (ja/je/jo/ju) ÁÐUR EN j → й.
#   3. j → й (eftir j+sérhljóð-reglur).
#   4. Einstaka sérhljóðar → kýrillískt.
#   5. Samhljóðar → kýrillískt (h → х skapar hreiminn).
# -----------------------------------------------------------------------------
zamiany:
  # --- 0. Tvístafir fyrir hljóð sem íslenskan á ekki ein og sér ---
  # Íslenskan skrifar [ʃ], [tʃ] og [dʒ] með sj, tsj og dj (sjampó, Tsjetsjenía,
  # djass), og frá v19.7 er þetta líka markmið forkeyrslu pakkans: `Škoda`
  # kemur hingað sem `Sjkoda`. Listinn hér að neðan kortleggur STAKA stafi, svo
  # án þessara þriggja reglna sundrast tvístafurinn (`с` + `й`) — og rússneskan
  # á einmitt stafina ш, ч og дж fyrir þessi hljóð. `tsj` á undan `sj`, annars
  # tæki styttra mynstrið halann; `dj` á undan ja/je/jo/ju, annars breytti
  # `jo`-reglan „Djokovitsj" í „Дёковитсй".
  - { wzor: "tsj", zamiana: "ч"   }
  - { wzor: "Tsj", zamiana: "Ч"   }
  - { wzor: "TSJ", zamiana: "Ч"   }
  - { wzor: "sj",  zamiana: "ш"   }
  - { wzor: "Sj",  zamiana: "Ш"   }
  - { wzor: "SJ",  zamiana: "Ш"   }
  - { wzor: "dj",  zamiana: "дж"  }
  - { wzor: "Dj",  zamiana: "Дж"  }
  - { wzor: "DJ",  zamiana: "ДЖ"  }

  # --- 1a. Séríslenskt tvíhljóð: Æ/æ → ай ---
  - { wzor: "Æ",  zamiana: "Ай"  }
  - { wzor: "æ",  zamiana: "ай"  }

  # --- 1b. Séríslenskir samhljóðar ---
  - { wzor: "Þ",  zamiana: "С"   }
  - { wzor: "þ",  zamiana: "с"   }
  - { wzor: "Ð",  zamiana: "Д"   }
  - { wzor: "ð",  zamiana: "д"   }

  # --- 1c. Séríslenskir sérhljóðar → kýrillískt ---
  - { wzor: "Á",  zamiana: "А"   }
  - { wzor: "á",  zamiana: "а"   }
  - { wzor: "É",  zamiana: "Э"   }
  - { wzor: "é",  zamiana: "э"   }
  - { wzor: "Í",  zamiana: "И"   }
  - { wzor: "í",  zamiana: "и"   }
  - { wzor: "Ó",  zamiana: "О"   }
  - { wzor: "ó",  zamiana: "о"   }
  - { wzor: "Ú",  zamiana: "У"   }
  - { wzor: "ú",  zamiana: "у"   }
  - { wzor: "Ý",  zamiana: "И"   }
  - { wzor: "ý",  zamiana: "и"   }
  - { wzor: "Ö",  zamiana: "Ё"   }
  - { wzor: "ö",  zamiana: "ё"   }

  # --- 2. j + aðalsérhljóðar (jótaðar rúnar) ---
  - { wzor: "ja", zamiana: "я"   }
  - { wzor: "Ja", zamiana: "Я"   }
  - { wzor: "JA", zamiana: "Я"   }
  - { wzor: "je", zamiana: "е"   }
  - { wzor: "Je", zamiana: "Е"   }
  - { wzor: "JE", zamiana: "Е"   }
  - { wzor: "jo", zamiana: "ё"   }
  - { wzor: "Jo", zamiana: "Ё"   }
  - { wzor: "JO", zamiana: "Ё"   }
  - { wzor: "ju", zamiana: "ю"   }
  - { wzor: "Ju", zamiana: "Ю"   }
  - { wzor: "JU", zamiana: "Ю"   }

  # --- 3. Eftirstandandi j → й ---
  - { wzor: "j",  zamiana: "й"   }
  - { wzor: "J",  zamiana: "Й"   }

  # --- 4. Einstaka sérhljóðar → kýrillískt ---
  - { wzor: "a",  zamiana: "а"   }
  - { wzor: "A",  zamiana: "А"   }
