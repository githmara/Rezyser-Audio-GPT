id: opowiesci
tresc: |
  Reżyser Audio GPT — Modull Interaktívar Sögur ({app.wersja})

  Annar aðalhamur forritsins við hlið Reżysera — nú verður þú leikmaður í sögunni sem er sjálfkrafa búin til í stað þess að vera höfundur hennar. Gervigreindin segir söguna í annarri persónu eintölu („Þú gengur í gegnum þokuskóg, finnur lyktina af blautum laufum..."), og þú ákveður næstu hreyfingu — með því að skrifa hvaða aðgerð sem er í frjálsum texta eða velja einn af tölusettum valkostum.

  Modullinn var hannaður frá grunni með blindum leikmönnum í huga — frásögnin er lesin línulega með skjálesara (NVDA) eða TTS-vél, valkostir eru í formi hnappa með raddlýsingum, hver lokið umferð er merkt með bjölluhljóði og sjálfvirkri flutningi á fókus á nýmyndaðan texta.

  Þú opnar spjaldið með hnappinum "{main.btn.opowiesci}" á verkfærastikunni eða með flýtilykli Ctrl+5.



  SKREF 1: Þrír leikhamir — veldu leikstíl

  Rétt undir leikheiti finnurðu valreit (RadioBox) fyrir ham. Hamurinn ákvarðar hvernig frásagnarmótorinn talar við þig:

  FRJÁLS HAMUR — þú slærð inn hvaða aðgerð sem er í frjálsum texta („ég reyni að opna dyrnar", „ég spyr vörðinn um leiðina", „ég flý bakdyramegin"). Frásagnarmótorinn getur stungið upp á 1-3 tillögum, en þær eru aðeins ábendingar — ekki skyldubundin leið. Mest frjálsi hamurinn, mælt með fyrir reynda leikmenn sem spinna sína eigin sögu.

  VALHAMUR — hver umferð endar með 3-5 tölusettum valkostum A-E í formi smella hnappa. Hver valkostur er ákveðin aðgerð sem þú getur tekið. Þú getur líka slegið inn þína eigin aðgerð í frjálsum texta — mótorinn mun passa hana við næsta valkost merkingarlega. Mest innsæi hamurinn fyrir blinda leikmenn: NVDA les alla valkosti fyrir þig, þú smellir á Tab á milli þeirra, Enter staðfestir.

  MINNA ILLT HAMUR — eins og Valhamur, en hver af 3-5 valkostum er siðferðilega, líkamlega eða strategískt óhagstæður. Enginn „hlutlaus" valkostur, enginn hamingjusamur endir í þessari umferð. Hamur fyrir aðdáendur dökkra skáldskapa í anda „Tales of Consequence" eða siðferðilegra drama.

  Hægt er að breyta ham í miðjum leik — í næstu umferð mun frásagnarmótorinn aðlagast nýjum stíl (frá Frjálsum í Valhamur getur farið í einum smelli).



  SKREF 2: Quick Start — tilbúnar upphafssögur

  Undir leikheitinu finnurðu annan röð með merkimiðanum „{opowiesci.lbl_quick_start}" og fellival (wx.Choice). Sjálfgefið er "{opowiesci.quick_start_wlasna}" — mótorinn mun sjálfur búa til heiminn út frá fyrstu aðgerð þinni.

  Þú getur þó valið einn af fimm tilbúnum forstillingum til að sökkva þér strax í ákveðinn heim:

  EFTIR-APOKALYPTÍSKT SF — öld eftir vistfræðilega hörmung. Leifar mannkyns í skjólum undir Góram Świętokrzyskim. Þú ert ungur sendiboði Klan Sztolnia með fyrsta alvarlega verkefnið. Sjálfgefinn hamur: Valhamur.

  DÖKK FANTASÍA — landamæri Ríkis Þriggja Strauma, níunda ár trúarstríðs. Þú ert yngri Rannsóknardómari á slóðum þorps þar sem einhver verndar andsetið barn. Sjálfgefinn hamur: Minna illt.

  URBAN FANTASY DETECTIVE — Varsjá 2008, októberkvöld. Þú ert einkaspæjari sem sér drauga. Viðskiptavinurinn vill finna eiginmann sem hvarf undir Konungshöllinni. Sjálfgefinn hamur: Valhamur.

  GEIMHROLLVEKJA — árið 2247, rannsóknarstöð á sporbraut um nifteindastjörnu. Þú vaknar úr dvala án skipstjóra — og án ummerkja um að skipstjórinn hafi nokkurn tíma verið til. Sjálfgefinn hamur: Frjáls (lovecraftskur andi hvetur til spuna).

  RÓMANTÍSK GAMANLEIKUR — Saska Kępa apríl 2024, lítið kaffihús stendur frammi fyrir lokun. Þú ert barista-þjónn sem eigandinn biður um að „vera vingjarnleg" við feimna ritstjórann sem þú hefur lengi viljað tala við sjálf. Sjálfgefinn hamur: Frjáls.

  Eftir að hafa valið forstillingu, smelltu á "{opowiesci.btn_nowa_gra_label}" — mótorinn mun sprauta stuttum lýsingu á heiminum og hetjunni í sig, stilla sjálfgefinn leikham (þú getur hnekkt honum með RadioBox áður en þú smellir á „Nýr leikur"). Fyrsta umferð LLM mun spila upphafssenuna.



  SKREF 3: Fyrsti leikur frá grunni — án forstillingar

  Ef þú vilt fullkomið frelsi, skildu "{opowiesci.quick_start_wlasna}" í Quick Start reitnum og undirbúðu þig til að slá inn fyrstu aðgerðina handvirkt.

  1. Sláðu inn nafn leiksins í „{opowiesci.lbl_nazwa_gry}" reitnum (t.d. „mín_ævintýri_1") — undir þessu nafni verða skráðar skrár frásagnar, ástands og logs.
  2. Veldu ham (Frjáls/Valhamur/Minna illt).
  3. Smelltu á "{opowiesci.btn_nowa_gra_label}". Forritið mun búa til 3 skrár: leikástand (.game.json), tóma Heimabók (.md) og hamgögn (.mode). Frásagnarskráin (.txt) verður búin til eftir fyrstu umferð.
  4. Í „{opowiesci.lbl_akcja}" reitnum neðst á spjaldinu, sláðu inn fyrstu aðgerðina, t.d. „ég vakna í ókunnu herbergi". Smelltu á "{opowiesci.btn_wyslij_label}". Frásagnarmótorinn mun opna heiminn út frá aðgerð þinni — lýsing á herberginu, hljóð, persónur, fyrstu ákvarðanir.
  5. Hver umferð verður sjálfkrafa vistuð — þú getur lokað forritinu hvenær sem er og hlaðið leikinn aftur með hnappinum "{opowiesci.btn_wczytaj_label}".



  SKREF 4: Slash-kommendur — fljótlegar aðgerðir án API

  Í aðgerðarreitnum geturðu hvenær sem er slegið inn skipun sem byrjar á skástriki `/`. Skipanirnar eru staðbundnar (kosta ekki OpenAI köll) og virka óháð leikham. Bæði íslensk og ensk afbrigði eru samþykkt:

  /vista, /save — þvingar handvirka vistun á leikástandi. Sjálfvirk vistun virkar eftir hverja umferð, svo þessi skipun er aðallega til öryggis áður en forritinu er lokað.

  /hlaða, /load — opnar skráarvalmynd úr möppunni runtime/opowiesci/. Eftir að hafa hlaðið verða leikheiti, hamur og full frásögn endurheimt — þú getur haldið áfram frá þeirri umferð sem þú endaðir á.

  /stillingar, /settings — opnar valmynd fyrir val á AI líkani. Sjálfgefið notum við gpt-4o-mini (Standard) — hraðari og ódýrari. Eftir að hafa skipt yfir í gpt-4o (Hágæða) verður frásögnin ríkari, en hver umferð kostar meira og tekur lengri tíma.

  /sjá <lýsing>, /visualize <lýsing> — fjölskynja lýsing á núverandi senu. Breytir ekki leikástandi, leggur ekki til valkosti — frásagnarmótorinn notar öll fimm skilningarvit (sjón, heyrn, lykt, snertingu, bragð) til að sýna senu með meiri dýpt. Niðurstaðan birtist í sérstöku samtali, ER EKKI bætt við frásögnina né vistuð í hljóðbókasafnskrá. Dæmi: „/sjá hvernig vörðurinn lítur út" eða „/sjá lyktina af kaffihúsinu".

  /enda, /quit — lokar forritinu (eftir sjálfvirka vistun á umferð í gangi).



  SKREF 5: Leikskrár — hvar þú finnur gögnin þín

  Hver leikur framleiðir fimm skrár, hver í mismunandi möppu, með mismunandi hlutverkum:

  skrypty/<nazwa>.txt — full frásögn tilbúin til að hlusta á sem hljóðbók. Hægt að opna í Notepad eða hlaða inn í Audiobook Architect (Converter) og búa til Word skrá með köflum eða tímasetningu fyrir ElevenLabs.

  skrypty/<nazwa>.md — Heimabók persóna í formi [Nafn: einkenni], endurgerð eftir hverja umferð. Format samhæft við Reżyser parser! Þú getur hlaðið þessari skrá inn í Reżyser spjaldið (File → Load) og fengið innfæddar persónuáherslur í klassískri TTS frásögn — brú milli tveggja aðalmodula forritsins.

  runtime/opowiesci/<nazwa>.game.json — fullkomið leikástand: nafn, hamur, virkar persónur, staðsetning, búnaður, opnir þræðir, síðustu 6 umferðir í styttri formi. Þetta er sannleiksgjafi til að hlaða leikinn — án þessarar skrár er ekki hægt að halda áfram.

  runtime/opowiesci/<nazwa>.story.jsonl — hrá logg af hverri umferð (beiðni leikmanns + svar mótors í JSON). Skráin er ekki nauðsynleg fyrir leikinn — hún er til villuleitunar eða síðari greiningar (t.d. tölfræði um hversu margar umferðir ævintýrið stóð, hvaða þræði LLM kynnti).

  runtime/skrypty/<nazwa>.mode — metadata um hamnúmer (3=Frjáls, 4=Valhamur, 5=Minna illt). Skráin er sameiginleg með Reżyser, en númerun rekst ekki á (Reżyser notar 0-2).



  SKREF 6: Minni vísir mótors — af hverju umferðir í gömlum leikjum krefjast ekki handvirkrar vinnu frá þér

  Undir RadioBox hamnum finnurðu minni vísir mótors — framvindustiku (wx.Gauge) með stöðulýsingu við hliðina. Vísirinn sýnir prósentu fyllingar á samhengisglugga frásagnarmótorsins (gpt-4o-mini hefur 128.000 táknabúffer).

  Fjórir fyllingarstig:

  🟢 hreint (0%) — leikurinn er nýbyrjaður, engar vistaðar umferðir.
  🟢 OK (1-69%) — allt í lagi, þú getur haldið áfram án takmarkana.
  ⚠️ viðvörun (70-89%) — mótorinn býr sjálfkrafa til samantekt fyrri umferða í bakgrunnsþræði. Skilaboðin „Sjálfvirk samantekt á samhenginu í gangi..." birtast — ekki senda næstu umferð fyrr en samantektin er lokið. Eftir árangur verða fyrri umferðir þjappaðar í einn þéttingu, búfferinn losnar, og þú færð staðfestingu „Minni mótors endurheimt" með fjölda þjappaðra umferða.
  🚨 ALARM (90%+) — sjálfvirk samantekt losaði ekki búfferinn (sjaldgæft tilfelli eftir API bilun). Að senda næstu umferð er lokað. Þvingaðu lokun leiks með /enda, síðan hlaðið hann aftur — mótorinn mun hlaða ástandið úr game.json án sögu síðustu umferða, búfferinn verður nýr.

  Í reynd er sjálfvirka minnkunarkerfið ósýnilegt — leikmaðurinn finnur ekki fyrir því að eitthvað gerist, því bakgrunnsþráðurinn leysir vandamálið áður en það verður áberandi. Það er aðeins mikilvægt að þú sendir ekki næstu umferð meðan á sjálfvirkri samantekt stendur (hnappurinn "{opowiesci.btn_wyslij_label}" er þá gráður).



  SKREF 7: Cinematic Meta Warning — dramatískur millikafli eftir 150. umferð

  Eftir 150 umferðir í einum leik mun frásagnarmótorinn EINU SINNI setja inn „Cinematic Meta Warning" — meta-frásagnarmillikafla. Hann birtist í sérstöku samtali með bjölluhljóði, með beinni ávarpi til þín í annarri persónu, samantekt á afrekum og viðvörun um mikilvægi ákvarðana.

  Cinematic Warning ER EKKI hluti af hljóðbókanarratífi — sían í .txt skráni fjarlægir sjálfkrafa innihald hennar (merkt með merkjum ⚠️🚨⚠️), svo þú heyrir ekki meta-athugasemdir um eigin leik þegar þú hlustar á hljóðbókina. Innihaldið fer aðeins í .story.jsonl logginn (til íhugunar eða varðveislu) og í samtali í GUI, þar sem þú getur lesið það einu sinni og haldið áfram.



  SKREF 8: Brú til Reżysera — nýttu Heimabókina sem var búin til í Sögum

  Skráin skrypty/<nazwa>.md sem er búin til á meðan á leik stendur inniheldur Heimabók með persónum sem komu fram í frásögninni, ásamt einkennum þeirra, áherslum og persónuleika. Format er nákvæmlega eins og Reżyser parserinn krefst — [Nafn: einkenni með lýsingu á áherslu].

  Hvað geturðu gert við þetta:

  1. Eftir að leiknum lýkur, opnaðu spjaldið "{main.btn.rezyser}" (Ctrl+1).
  2. Hladdu inn verkefni með sama nafni — Reżyser mun hlaða .txt skrána sem sögu og .md sem Heimabók.
  3. Þú færð nú klassíska Reżyser frásögn (löng, skipulögð atriði með þáttum og köflum) með innfæddum áherslum persóna sem þú hafðir gaman af í Sögum. Verndari Karmela úr skýlinu sem talar í stuttum setningum, rannsóknardómari Rosanna með syngjandi austuráherslu — öll einkenni varðveitt.

  Þetta er einhliða brú: Sögur framleiða efni, Reżyser formatar það. Öfugt er ekki mögulegt — Reżyser hleður ekki leikjum úr Sögum sem gagnvirku ástandi.



  SKREF 9: Aðgengi (NVDA og skjálesarar) — hannað frá grunni

  Allur Sögumodullinn var bjartsýndur fyrir blinda leikmenn. Hvað við gerðum nákvæmlega:

  FRÁSAGNARSVÆÐI — þetta er wx.TextCtrl readonly multiline. NVDA les línulega alla frásögnina, þú getur farið um með örvum innan textans, afritað brot með Ctrl+C. Svæðið er aldrei breytanlegt — þú breytir sögunni AÐEINS með nýrri umferð eða með því að breyta .txt skrá utan forritsins.

  DYNAMÍSKIR VALHNAPPAR — í Valham og Minna illt ham hver umferð býr til nýja wx.Button-a á valkostasvæðinu. Hver hefur tooltip sem NVDA les („Veldu: farðu áfram í skóginn"). Tab á milli þeirra virkar náttúrulega. Enter á valinn hnapp sendir sjálfkrafa þann valkost til frásagnarmótorsins.

  FELA TÓM SVÆÐI — í Frjálsum ham er valkostasvæðið ALGJÖRLEGA falið (wx.Hide), ekki bara grátt — Tab sleppir því, NVDA mun ekki draga það inn í lista yfir hluti. Þetta kemur í veg fyrir rugling hjá leikmanni sem lendir í tómu plássi. Í ham 4 og 5 birtist svæðið aðeins eftir vel heppnaða staðfestingu á svari líkansins (ekki tóm fylki valkosta); ofskynjun líkansins (tómir valkostir) leiðir til fallbacks í frjáls-texta án þess að fylla viðmótið.

  HLJÓÐMERKI — hver lokið umferð er merkt með wx.Bell (kerfisbjöllu), á eftir kemur sjálfvirk flutningur á fókus á frásagnarsvæðið. NVDA les þá nýja frásögnina án þess að þurfa handvirka leiðsögn.

  LITIR Á MINNISSTAÐA — vísir minnismótorsins breytir leturlit (grænn/appelsínugulur/rauður) í samræmi við fyllingarstig. Fyrir sjáandi notendur er þetta viðbótar sjónrænt merki; NVDA les samt stöðutextann, svo blindir missa ekki upplýsingar.

  LYKLAR FLÝTILEIÐIR — allir hnappir hafa tákn `&` fyrir einni af stöfum merkimiðans, sem virkjar flýtileið Alt+stafur. Virkar eins og í öðrum einingum forritsins.



  Algengustu vandamál

  Vandamál: Eftir að hafa smellt á "{opowiesci.btn_nowa_gra_label}" birtist skilaboð „Enginn API lykill".
  Ástæða og lausn: Skráin golden_key.env í aðalmöppu forritsins hefur ekki réttan OpenAI lykil. Farðu aftur á upphafsskjáinn (hnappur Home), smelltu á "{home.btn_generate}" og fylgdu leiðbeiningunum (SKREF 2 aðalhandbókarinnar).

  Vandamál: Ég reyni að senda næstu umferð, en hnappurinn "{opowiesci.btn_wyslij_label}" er gráður.
  Ástæða og lausn: Sjálfvirk samantekt á samhenginu eða myndun Cinematic Warning í bakgrunnsþræði er í gangi. Minnisstaða mun sýna „Sjálfvirk samantekt á samhenginu í gangi…". Bíddu í nokkrar sekúndur — hnappurinn aflokast sjálfkrafa eftir árangur.

  Vandamál: Skilaboð „Minnisstaða mótorsins ofhlaðin" loka leiknum.
  Ástæða og lausn: Sjálfvirk samantekt losaði ekki búfferinn (t.d. OpenAI takmörkun). Lokaðu leiknum með /enda skipun eða lokaðu forritinu, síðan hlaðið það aftur — mótorinn mun hlaða aðeins ástandið úr game.json án sögu síðustu umferða.

  Vandamál: Í Valham bjó mótorinn ekki til hnappa, þrátt fyrir að ég hafi búist við þeim.
  Ástæða og lausn: Ofskynjun líkansins — þrátt fyrir ham 4 skilaði LLM tómu fylki valkosta. Forritið felur þá meðvitað valkostasvæðið (í stað þess að sýna tómt pláss) og leyfir áframhaldandi frjáls-texta. Næsta umferð mun líklega búa til valkosti rétt.

  Vandamál: Skrár .game.json og .story.jsonl eru ekki sýnilegar á skjáborðinu.
  Ástæða og lausn: Þetta er viljandi — runtime/ er kerfismappa fyrir venjulega notendur, ósýnileg frá skráarkönnuði. Frásagnarskrár (.txt, .md) fara í skrypty/ — þar finnurðu þær.
