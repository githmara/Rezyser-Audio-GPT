id: manual
tresc:
  naglowek: |
    Handbók Audio AI leikstjórans - Heildarleiðarvísir (Útgáfa {app.wersja})

    Velkomin í Hybrid Recording Studio! Þessi verkfærakista gerir þér kleift að skrifa, skipuleggja, stilla og þýða handrit fyrir hljóðleiki og hljóðbækur sjálfvirkt. Hún hefur verið fínstillt til að vinna með faglegum talgervlum og staðbundnum skjálestrum (NVDA).

    Verkfærakistan samanstendur af aðalstúdíóinu (Leikstjórn), þýðinga- og hreimaverkfærinu (Tungumálamaður), skráarbyggingarverkfærinu (Hljóðbókararkitekt), Reglustjóra (frá útgáfu 13.0 — án Python geturðu bætt við nýjum hreim, dulmáli eða sköpunarham, sjá SKREF 7b hér að neðan) og — frá útgáfu 15.0 — Sögueiningunni (gervigreindarframleidd gagnvirk skáldskapur í annarri persónu, lesin af TTS eða skjálesara, lýst í sérstöku handriti opowiesci.pl.txt). Öll fimm verkfærin eru aðgengileg í einu forritsglugga, skipt á milli með hnöppum á stikunni eða með lyklaborðssamsetningum Ctrl+1..Ctrl+5.
  krok_1_pierwsze_uruchomienie: |
    SKREF 1: Fyrsta gangsetning (Cross-Platform)

    Sæktu nýjasta uppsetningarforritið úr Releases-flipanum á GitHub (skráin Rezyser_Audio_v<númer>_Installer.exe) og keyrðu það með tvísmelli. Uppsetningarforritið stingur upp á sjálfgefinni uppsetningarstaðsetningu — Programs-möppunni í staðbundinni möppu reikningsins þíns — og krefst ekki stjórnandaaðgangs. Þú getur valið þína eigin slóð með „Vafra"-hnappinum; í því tilviki SKALTU MUNA hana (þú þarft hana við uppfærslur — sjá „Sjálfvirkar uppfærslur" hér að neðan). Eftir uppsetningu skaltu keyra forritið með flýtileið af skjáborðinu eða úr Start-valmyndinni. Stutt skráargluggi opnast (hverfur sjálfkrafa) og eftir smá stund birtist aðalgluggi forritsins — {app.nazwa}. Enginn vafri, enginn bakgrunnsþjónn. Þegar þú ert búinn að vinna, lokaðu einfaldlega forritsglugganum.

    Allt forritið — Python-vélin, verkefnin þín og API-lykillinn — býr í einni möppu undir uppsetningarslóðinni, þannig að hægt er að færa alla möppuna á USB-lykli, í skýið eða á aðra tölvu (nákvæmar leiðbeiningar í kaflanum „Að flytja verkefni og API-lykil" hér að neðan).


    Mikilvægt: Möppan runtime/ innan uppsetningarmöppunnar inniheldur einangrað Python umhverfi tilbúið til notkunar án sérstakrar kerfisuppsetningar. Ef þú klónar geymsluna (þróunaraðilaleið), er þessi mappa ekki til staðar og ætti ekki að vera — þú notar þá sýndarumhverfið venv eins og lýst er í hlutanum fyrir forritara hér að neðan.

    --- Fyrir Forritara (Windows — Git geymsla) ---

    1. Klónaðu geymsluna á diskinn þinn.
    2. Keyrðu skrána setup_dev.bat. Skjalið býr sjálfkrafa til sýndarumhverfi Pythons (venv) og setur upp allar nauðsynlegar háðingar úr skránni requirements.txt.
    3. Keyrðu forritið með skipuninni python main.py eða með skránni run_dev.bat — skjalið greinir sjálfkrafa venv möppuna og keyrir forritið.

    --- Fyrir Forritara og venjulega notendur (macOS / Linux) ---

    1. Klónaðu geymsluna á diskinn þinn.
    2. Opnaðu skel í verkefnamöppunni og gefðu skrám heimild til að keyra: chmod +x *.sh
    3. Keyrðu uppsetningarskrána: ./setup_dev.sh — skjalið býr til venv umhverfi og setur upp háðingar.
    4. Keyrðu forritið: python main.py eða ./run.sh

    Hvað þú sérð eftir gangsetningu: Eftir að forritið er keyrt opnast gluggi með upphafsskjá. Þar finnur þú stutta lýsingu á tiltækum verkfærum og hlutanum "{home.heading_system_check}". Ef API lykill er ekki enn stilltur, sérðu rauða tilkynningu sem segir að AI byggð einingar (Leikstjórn, Þýðandi) muni ekki virka — ókeypis staðbundin virkni (hreimsetning, Arkitekt) er þó virk strax. Stillingu lykilsins er lýst í næsta skrefi.

    Sjálfvirkar uppfærslur

    Forritið athugar við gangsetningu hvort nýrri útgáfa sé tiltæk á GitHub — athugunin fer fram í bakgrunni og truflar ekki viðmótið.

    Ef þú settir upp forritið með tilbúinni uppsetningarskrá (.exe): þegar nýrri útgáfa er greind birtist gluggi sem spyr hvort þú viljir sækja hana. Eftir staðfestingu mun framvindustika birtast og þegar niðurhalinu lýkur lokast forritið sjálfkrafa og nýja uppsetningarskráin keyrir sjálfkrafa. MIKILVÆGT: í glugga nýja uppsetningarforritsins skaltu tryggja að uppástungan uppsetningarslóðin sé SÚ SAMA og við fyrstu uppsetninguna (yfirleitt sjáanleg í reitnum „Áfangamappa"). Ef þú samþykkir sjálfgefnu uppástunguna en valdir upphaflega annan stað með „Vafra"-hnappinum, færðu AÐRA tóma uppsetningu án verkefnanna þinna og API-lykils — sú fyrri stendur enn á gamla staðnum, en flýtileiðir á skjáborðinu og í Start-valmyndinni eru færðar yfir á nýju uppsetninguna. Ef þú samþykkir sömu slóð og upphaflega skrifar uppsetningarforritið yfir vélaskrár forritsins og allan reglupakkann (mappa dictionaries/) — verkefnin þín (möppur skrypty/, opowiesci/) og API-lykillinn (golden_key.env) haldast óbreytt. AÐVÖRUN: ef þú hefur breytt skrám í Reglustjóra sem eru í pakkanum (t.d. hreimstillingar í `dictionaries/pl/akcenty/wloski.yaml`), þá VERÐUR SKRIFAÐ YFIR þessar breytingar við uppfærsluna — áður en þú staðfestir uppfærsluna skaltu taka afrit af möppunni `dictionaries/` samkvæmt verklaginu í kaflanum „Að flytja verkefni og API-lykil" hér að neðan (það nægir að afrita aðeins möppuna `dictionaries/` á USB-lykli), og eftir uppfærsluna límdu hana aftur yfir nýju skrárnar. Algjörlega nýjar reglur sem þú hefur búið til frá grunni og eru ekki í pakkanum (t.d. viðbótar grunnmál eða alveg ný dulkóðun) varðveitast sjálfkrafa — uppsetningarforritið eyðir aldrei skrám sem eru ekki í pakkanum. Frá og með útgáfu 15.2.8 sýnir uppfærsluglugginn sjálfur þessa viðvörun beint í textanum og inniheldur hnappinn „Opna dictionaries möppuna" sem opnar Explorer á réttum stað með einum smelli — smelltu á hann áður en þú staðfestir uppfærsluna til að gera öryggisafrit á þægilegan hátt, snúðu síðan aftur að glugganum og smelltu á „Sækja og setja upp".

    Ef þú manst ekki eftir uppsetningarslóð þinni eru tvær fljótlegar leiðir til að endurheimta hana. Windows 11: í samhengisvalmynd flýtileiðar á skjáborðinu skaltu velja „Opna staðsetningu skráar" (ef valkosturinn er ekki sýnilegur í nýju einfaldari samhengisvalmyndinni, veldu fyrst „Sýna fleiri valkosti" eða ýttu á Shift+F10 tvisvar til að opna fulla valmyndina beint), farðu einu stigi ofar með Backspace-takkanum, veldu möppu forritsins og ýttu á Ctrl+Shift+C (eða veldu „Afrita sem slóð" úr samhengisvalmyndinni) — heila slóðin fer á klippiborðið með gæsalöppum (þegar þú límir hana inn í uppsetningarforritið, mundu að fjarlægja aðeins gæsalappirnar). Eldri Windows-útgáfur (7/8/10): hægrismelltu á flýtileiðina og veldu „Eiginleikar"; í flipanum „Flýtileið" í reitnum „Mark" sérðu heila slóð að ræsiskrá forritsins (`.exe` í v15.2.5+ eða `run.bat` í eldri útgáfum) — afritaðu hana og fjarlægðu skráarheitið í lokin, eftir stendur ein og sér slóð uppsetningarmöppunnar.

    Athugasemd við uppfærslu úr eldri útgáfum (v15.2.4 eða eldri, þegar forritið var keyrt með `run.bat` úr Portable ZIP pakkanum): núverandi flýtileið á skjáborðinu kann að benda á `run.bat` á gamla staðnum, sem er ekki lengur til eftir uppfærslu í v15.2.5+ — útgáfur 15.2.5+ nota sjálfstæða `.exe` skrá sem uppsetningarforritið býr til. Ef flýtileiðin hættir að virka eftir uppfærsluna skaltu eyða henni handvirkt og leyfa uppsetningarforritinu að búa til nýja við næstu uppsetningu.

    Ef þú notar Git geymslu (forritarar og macOS/Linux notendur): í stað þess að fá tillögu um niðurhal sérðu tilkynningu um nýja útgáfu með beinni tengingu á útgáfusíðuna á GitHub. Sæktu þaðan „Source code“ skjalasafnið eða uppfærðu geymsluna með skipuninni git pull.

    Að flytja verkefni og API-lykil (flutningur)

    Ef þú vilt flytja verkefnin þín, API-lykilinn og staðbundnar stillingar á aðra tölvu (eða endurheimta allt eftir endur-uppsetningu á Windows), þarf ekki að afrita einstakar skrár handvirkt — öll mappa forritsins er sjálfstæð.

    1. Tryggðu að forritið sé ALGJÖRLEGA lokað. Ef þú sérð táknmynd forritsins á tilkynningasvæðinu (við hliðina á klukkunni, hægra megin á verkstikunni), hægrismelltu á hana og veldu „Loka". Opnar skrár hindra afritun.
    2. Finndu flýtileið {app.nazwa} á skjáborðinu. Hægrismelltu á hana (eða ýttu á Forritslykil eða Shift+F10 við NVDA-leiðsögn) og veldu valkostinn „Opna staðsetningu skráar". ATHUGIÐ á Windows 11: í nýju einfaldari samhengisvalmyndinni getur þessi valkostur verið falinn — veldu fyrst „Sýna fleiri valkosti" (eða ýttu á Shift+F10 tvisvar til að opna fulla valmyndina beint).
    3. Windows Explorer gluggi opnast í uppsetningarmöppu forritsins. Ýttu á Backspace (einfaldasta leiðin, virkar alltaf) eða smelltu á „Upp"-örina á tækjastikunni til að fara einu stigi ofar — þar sérðu heila möppu forritsins. Athugaðu: flýtilyklasamsetningin Alt+Upp virkar aðeins þegar fókusinn er á skráalistanum — ef Explorer opnast með fókus á slóðastikunni (dæmigert), gerir Alt+Upp ekkert; notaðu Backspace í staðinn.
    4. Afritaðu alla möppuna á USB-lykil, skýjadrif (OneDrive, Google Drive, Dropbox) eða ytri disk. Mappan inniheldur allt sem þarf til að endurheimta vinnustöðu þína:
       - Verkefnin þín (mappa skrypty/ — .txt frásögnskrár, .md Heimabókarskrár, _streszczenie.txt samantektir; mappa opowiesci/ — gagnvirkir leikir).
       - API-lykilinn (skráin golden_key.env í aðalmöppu forritsins).
       - Þínar eigin hljóðfræðireglur, hreim, dulmál, ef þú breyttir einhverju í Reglustjóra (mappa dictionaries/<tungumálakóði>/, t.d. dictionaries/pl/akcenty/wloski.yaml).
       - Stillingar forritsins og val á sköpunarham (mappa runtime/skrypty/, .mode-skrár).
       - Einangrað Python-umhverfi (mappa runtime/), þökk sé því þarftu ekki að setja upp neitt aukalega á nýju tölvunni.
    5. Á nýju tölvunni: sæktu nýjasta uppsetningarforritið úr Releases-flipanum á GitHub og settu forritið upp á venjulegan hátt. Keyrðu forritið einu sinni til að það búi til tóma uppbyggingu stillingaskráa. Lokaðu forritinu. Afritaðu síðan áður vistuðu möppuna yfir nýju uppsetninguna og yfirskrifaðu skrárnar — eða veldu sérstaklega aðeins þær möppur sem þú vilt (skrypty/, opowiesci/, golden_key.env) og límdu þær í samsvarandi staði í nýju uppsetningunni.

    Ábending fyrir NVDA-notendur: samhengisvalmyndin „Opna staðsetningu skráar" sem kölluð er fram með Forritslykli er að fullu aðgengileg — NVDA les hvert atriði innfætt. Þegar Explorer opnast í markmöppunni skaltu nota Backspace-takkann til að fara einu stigi ofar (virkar alltaf, óháð því hvort fókusinn er á skráalistanum eða slóðastikunni), síðan Ctrl+A til að velja allt og Ctrl+C til að afrita. Athugaðu: íslenska Dóra-röddin í OneCore les orðið „Backspace" oft staf fyrir staf („B-A-C-K-S-P-A-C-E") þar sem það er ekki kennt sem heil eining á íslensku — þetta er takmörkun í raddvélinni, ekki villa í forritinu eða lyklinum; aðgerðin sjálf virkar eðlilega þegar þú ýtir á lykilinn.

    Ábending: „Opna staðsetningu skráar" er innfædda nafnið á valkostinum í íslenskri Windows-uppsetningu. Í enska kerfinu heitir hann „Open file location", í öðrum útgáfum tungumáls — á samsvarandi hátt á staðbundnu tungumáli stýrikerfisins.
  krok_2_klucz_api: |
    SKREF 2: Zasilanie API (Klucz OpenAI)

    Til að gervigreindin geti virkað, þarf hún aðgang að netþjónum OpenAI (höfundar ChatGPT).

    1. Búðu til reikning á platform.openai.com og fylltu á reikninginn í flipanum Billing.
    2. Búðu til lykil í flipanum API Keys (byrjar á sk-proj-). Athugið: lykillinn er aðeins sýndur einu sinni — þegar hann er búinn til. Ef þú lokar glugganum án þess að afrita hann, tapast hann og þú þarft að afturkalla hann (valkostur revoke secret key) og búa til nýjan. Afritaðu hann strax, áður en þú smellir á neitt.
    3. Á upphafsskjá forritsins skaltu smella á hnappinn "{home.btn_generate}". Kerfið mun sjálfkrafa búa til hreina stillingaskrá á réttum stað og opna Notepad með sniðmáti tilbúið til breytinga.
    4. Í opna skjalinu sérðu línuna OPENAI_API_KEY=TUTAJ_WKLEJ_SWOJ_KLUCZ. Fjarlægðu staðgengilstextann og límdu inn afritaða lykilinn þinn beint eftir jafnaðarmerkið (án bils). Vistaðu skjalið og ræstu forritið aftur.

    Ábending: Eftir að forritið hefur verið endurræst mun það athuga skjalið og birta græna skilaboð í hlutanum "{home.heading_system_check}" — þetta þýðir að allir AI einingar eru tilbúnir til notkunar. Annars mun það skýrt segja þér hvað er að og leyfa þér að opna textaritilinn til að laga villuna fljótt.
  krok_3_glowne_studio: |
    SKREF 3: Aðalstúdíó Leikstjórans

    Þetta er stjórnstöðin þín til að skapa sögur og skrifa handrit. Færðu þig þangað með því að smella á "{main.btn.rezyser}" hnappinn á verkfæraslánni eða velja Verkfæri → {main.menu.rezyser} úr valmyndinni (flýtileið: Ctrl+1).



    MIKILVÆGT: Skráarsnið verkefna — aftur til .txt

    Í útgáfu 7 voru verkefnaskrár vistaðar á Markdown sniði (.md), t.d. handrit/dæmi.md. Þetta var meðvitað tilraun — .md sniðið átti að vera sálfræðileg hindrun fyrir ótekníska notendur, til að letja þá frá því að opna og breyta skránni handvirkt í Textaritli (og þar með tilviljunarkennt skemma uppbyggingu fyrirsagna).

    Tilraunin mistókst. AI brýtur oft eitt af grundvallarreglunum (meira um það á eftir). Þess vegna var í útgáfu 8 farið aftur í einfaldar .txt skrár — sem eru meira innsæi og læsilegar fyrir alla. Til dæmis verður verkefni sem heitir "dæmi" nú vistað sem handrit/dæmi.txt, og samantekt þess sem handrit/dæmi_samantekt.txt. Þetta gerir öllum auðveldara að gera leikstjórnarbreytingar eða klippingar á textanum í rauntíma.


    ⚠️ MIKILVÆG REGLA KLIPPARANS (LESTU ÁÐUR EN ÞÚ BYRJAR!) ⚠️

    Öll handritin þín og bækurnar eru vistaðar í venjulegum textaskrám (.txt), sem þú getur auðveldlega opnað í Textaritli.

    Sem Leikstjóri hefurðu FULLT LEYFI (og jafnvel skyldu) til að breyta þessari skrá! Ef gervigreindin fer á flug og t.d. leysir sjálf vandamál hetjanna í lok bútsins, opnaðu skrána, fjarlægðu síðustu línurnar og láttu textann enda á spennandi stað, áður en þú hreinsar minni, hleður skránni aftur til að endurhlaða samhengisgluggann og smellir á "{rezyser.btn_wyslij_label}" til að halda áfram.

    🔴 EN - HVAÐ ÞÚ MÁTT EKKI BREYTA:

    Aldrei breyta, fjarlægja eða breyta línum sem innihalda uppbyggingu (t.d. Þáttur 1, Atriði 2, Kafli 1, Formáli). Ef þú skemmir þessar fyrirsagnir:
    1. Sagan þín mun brotna í skjálesurum (NVDA).
    2. Hljóðbókaarkitektinn, og þar með einnig Studio Eleven Labs, mun ekki geta skipt bókinni þinni rétt í kafla til lesturs.
    3. Innbyggði breytirinn í forritinu mun ekki búa til rétt efnisyfirlit í Word skrá eða á tímalínu í ElevenLabs.

    Breyttu samtölum, klipptu aðgerðina, en láttu uppbygginguna vera!


    Hvernig á að nota Leikstjórn?

    - Heimabók (hliðarslá til vinstri): Hér skrifarðu reglur heimsins. Hvert verkefni hefur nú sína eigin Heimabók tengda við skráarnafnið — ef sagan þín heitir t.d. emilia_heist_audiobook.txt, verður Heimabókin vistuð sem handrit/emilia_heist_audiobook.md. Þess vegna skiptir röðin máli: fyrst skaltu slá inn nafn verkefnisskrárinnar í reitinn "Nafn verkefnisskrár", og þá geturðu vistað Heimabókina. Hnappurinn "{rezyser.btn_zapisz_ksiege_label}" verður gráður þar til þú gefur upp nafn. Að hlaða inn núverandi verkefni með hnappinum "{rezyser.btn_wczytaj_label}" mun sjálfkrafa hlaða viðeigandi .md skrá — þú þarft ekki að gera neitt handvirkt. Athugið: Án útfylltrar Heimabókar mun forritið læsa fyrirspurnum til AI — þetta er viljandi öryggisráðstöfun sem verndar þig frá því að búa til texta án nokkurra reglna.
    - Langtímaminni (hliðarslá til vinstri): Annar reiturinn í hliðarslánni. Hér skráir AI sjálfkrafa samantekt á söguþræði þegar minnið byrjar að fyllast. Þú getur líka skrifað þínar eigin athugasemdir handvirkt — líkanið mun líta á þær sem "hvað ég veit nú þegar" áður en það les núverandi atriði. SÖGULEG GLUFA (löguð í v15.5): áður fyrr, ef þú slóst hér inn mjög stutta athugasemd og smelltir á „Vista Samantekt" áður en eitthvað marktækt var komið í frásagnarskrána, hlóð forritið eftir næstu hleðslu samantektina í FORGANGI og SLEPPTI fullri sögu — líkanið fékk þá aðeins Heimsbókina og eins-setningar athugasemd, án samhengis um tón og síðustu atriði. Frá og með v15.5 er hleðslan greind: ef öll sagan kemst fyrir í samhengisglugganum, er hún hlaðin í heild sinni (og óþarfa gamla samantektin þurrkuð út), þannig að líkanið tapar ekki samhengi. Og eftir handvirka breytingu á frásagnarskránni í textaritli skaltu nota nýja hnappinn „{rezyser.btn_odswiez_z_dysku_label}" (frá v15.5), sem samstillir innra minnið við diskinn með einum smelli; til að opna skrána sjálfa í textaritli þjónar áfram „{rezyser.btn_otworz_narracje_label}".
    - Hugstormunarhamur: Skrifaðu lauslega hugmynd og AI mun gefa þér 3 valkosti fyrir þróun söguþráðar. Fyrir hvern valkost mun það strax búa til tilbúinn blokk "--- SKISSU PROMPTUR ---". Þegar þú hefur valið einn þeirra, límdu þennan prompt í Handrits- eða Hljóðbókaham og bættu við athugasemdum eða upplýsingum fyrir líkanið. Söguþráðurinn breytist ekki í Hugstormun — þú getur gert tilraunir án áhættu!
    - Grófur Handritshamur (frá v16.0 — leiklestur): Hér límirðu "Skissu Prompt" sem var búinn til í Hugstormun. AI mun skrifa langan sögumanns-og-samtals-bút: frásögn (sviðsmynd, tími, aðgerð) í [Sögumaður: ...] merkjum og persónulínur í [Nafn: tilfinning] merkjum. Engin hljóðáhrif — samhengið ber sögumaðurinn með orðum. Textinn bætist sjálfkrafa við skrána þína (t.d. nýtt_atriði.txt) í handritamöppunni. Slíkt tilbúið handrit geturðu svo breytt í margradda hljóðbók (brúin að ElevenLabs Studio — sérstakur kafli neðar).
    - Hefðbundinn Hljóðbókahamur: Hamur fyrir rithöfunda. AI býr til hreina bókmenntaprósa — engin merki, engin hljóðfræði, klassísk samtöl fléttuð inn í frásögnina. Textinn bætist við skrána á sama hátt og í Handritsham.
    - Sjálfvirk persónusköpun: Handritið er forritað til að búa sjálfkrafa til ný merki [Speaker] ef söguþráðurinn krefst nýrrar persónu. Ábending: Ef AI býr til áhugaverða persónu, afritaðu merkið hennar og límdu í Heimabókina, svo líkanið muni hana til frambúðar!

    Verkefnastjórnun — þrír aðgerðahnappir:
    - {rezyser.btn_wczytaj_label}: Hleður inn núverandi verkefni í minni. Tiltækt þegar núverandi minni er tómt. Frá og með útgáfu 15.2.3 styður tvær leiðir: ef nafnsreitur verkefnisins er tómur opnast valgluggi með lista yfir öll verkefni sem finnast í möppunni skrypty/ (samantektarskrár eru síaðar út) — NVDA les listann náttúrulega, leikmaður þarf ekki að muna og slá nafnið inn aftur á lyklaborði. Ef nafnsreiturinn er fylltur, reynir forritið beint að hlaða inn verkefni með því nafni (sérfræðileið: Enter í nafnsreitnum eða smella eftir að hafa slegið inn úr minninu).
    - Hreinsa núverandi (skilja eftir Samantekt): Hreinsar aðeins núverandi sögu. Samantekt í Langtímaminni og Heimabókin eru varðveittar — fullkomið til að halda áfram með langa bók eftir að samantekt hefur verið búin til.
    - Loka Verkefni (Harður Endurstilling): Hreinsar verkefnið alveg. Fjarlægir sögu, samantekt, Heimabók og núllstillar alla teljara. Notaðu þegar þú skiptir um verkefni eða byrjar nýja sögu.
    - {rezyser.btn_otworz_narracje_label} (frá v15.2.3): Neyðar-breyting á frásagnarskrá í kerfis-textaritlinum. Krefst nafns verkefnis í reitnum. Forritið opnar skrypty/<nafn>.txt í Notepad (Windows), TextEdit (macOS) eða sjálfgefnum GUI ritli (Linux). Dæmigert tilvik: (a) AI lokar ekki atriði og þú vilt skrifa endann handvirkt; (b) þú hleður inn verkefni með samantekt og vilt afrita síðustu atriðin í Langtímaminni svo líkanið hafi fullt tónsamhengi (arkitektónisk götur lýst að ofan); (c) þú vilt gera textaklippingu í miðjum kafla sem forritsvélin styður ekki innfædd.
    - {rezyser.btn_odswiez_z_dysku_label} (frá v15.5): Samstillir innra minni forritsins við frásagnarskrána eftir handvirka breytingu á henni — án harðrar endurstillingar og endurhleðslu verkefnisins. Það ákveður sjálft: ef öll sagan kemst fyrir í samhengisglugganum, hleður það henni í heild sinni (og þurrkar út óþarfa gamla samantekt, svo vélin vinni á fullum texta); ef sagan er löng og á vistaða samantekt, heldur það henni ósnertri og endurgerir aðeins ferska endann sem talinn er frá síðustu byggingarfyrirsögn (Kafli/Þáttur/Atriði) — þess vegna er þess virði að halda byggingu. Það breytir ekki Heimsbókinni né teljurum. Dæmigert tilvik: AI lokaði atriði ranglega (braut anti-closure), þú klippir slæma endann í textaritlinum og smellir á Endurhlaða — engin leiðrétting á tveimur stöðum lengur.

    Söguleg athugasemd — af hverju hamir eru nú verndaðir gegn tilviljunarkenndum breytingum:
    Í fyrri útgáfum forritsins var engin eftirlit með samkvæmni sköpunarhamar innan eins verkefnis. Niðurstaðan var ákveðin sköpunarmöguleiki sem mætti lýsa svona: þú byrjar söguna í Handritsham, setur inn "Þáttur 1" og "Atriði 1" (forritið er ánægt með samkvæmni þína), býrð til nokkra skjái af spennu með merkjum [SFX: Hurðaskellur] og [Speaker 1: Marek - vonlaus]... og síðan — því innblástur kemur — smellirðu á "Setja inn klippingu Kafli 1". Forritið bætir fyrirsögninni "Kafli 1" við skrána, rétt eftir "Atriði 3". Þú hefur nú í skránni blöndu af útvarpsleikriti frá 50. áratugnum og skáldsögu. ElevenLabs horfir á þessa uppbyggingu, sér kaflafyrirsögn í miðju þáttar og ákveður að þetta sé líklega villa í kerfinu. Efnisyfirlitið lítur út eins og verk framúrstefnulistamanns. Hljóðbókaarkitektinn gengur út frá því að þú sért fullorðinn einstaklingur og vinnur það bara án orðs — en líka án nokkurra ábyrgða á útkomu. Frá og með útgáfu 12.0 reyndi viðmótið að loka fyrir breytingu á skráningarham — að minnsta kosti í orði. Í verki reyndist þetta meira skapandi: Hugstormun (alltaf virk sem áætlanaham) var bakdyrahurð sem hægt var að nota til að skiptast á milli Handrits og Hljóðbókar með upp- og niðurörvunum (Hljóðbók → Hugstormun → Handrit og á sambærilegan hátt í öfuga átt). Fyrsta smellið á „Setja inn Þátt 1" eða „Setja inn Kafla 1" í nývöldum ham skrifaði þá .mode-skrána yfir á mjúkan hátt, og blandaði þáttum saman við kafla í sömu frásagnarskrá. Aðeins frá og með útgáfu 15.2.3 höfum við raunverulega vörn: þegar hamaákvörðunin er læst inni (fyrsta uppbyggingarmerki eða fyrsta árangursríka framleiðslusending), þá er önnur skráningarstaðan í RadioBox-inu raunverulega óvirk. Hugstormun er áfram alltaf virk sem neyðarkerfi — hún býr til samantekt þegar samhengisglugginn fyllist og gefur söguþráðsvalkosti — en hægt er ekki lengur að nota hana sem hliðarstökk yfir í annan skráningarham.


    Showrunner Prompts — AI sem handritshöfundur þáttaraðar (frá útgáfu 7, varðveitt)

    Þetta er stærsta breytingin sem kynnt var í útgáfu 7, varðveitt óbreytt. Hún er ekki sýnileg í viðmótinu, en breytir róttækt gæðum framleiddrar sögu.

    Showrunner er í sjónvarpsiðnaðinum sá sem ber ábyrgð á heildarþáttaraðinni — hann sér til þess að söguþráðurinn stefni aldrei í auðvelda lausn, heldur þéttist stöðugt, byggi upp átök og haldi áhorfendum í spennu í mörg tímabil. Í útgáfu 7 var þessi heimspeki beint innbyggð í kerfisleiðbeiningar AI.

    Anti-Closure fyrirmæli — staða í útgáfu 8

    Þrátt fyrir að prófa mismunandi nálganir er Anti-Closure bannið oft brotið af líkaninu, sérstaklega í Hefðbundnum Hljóðbókaham. AI hefur sterka tilhneigingu til að "loka" sögum við hvert tækifæri — það fléttar inn setningar sem draga saman söguþráðinn, býr til falska hamingjusama enda eða lokar sögulínum í miðjum kafla, eins og hver bútur væri sá síðasti. Áhrifin eru þau að næsti bútur byrjar frá grunni, án náttúrulegrar samfellu.

    Þess vegna er svo mikilvægt að fylgja reglu klipparans sem lýst er hér að ofan: ef AI brýtur bannið og lokar sjálft atriði, er þitt verkefni sem Leikstjóri að opna .txt skrána, fjarlægja þessar síðustu setningar og láta textann enda á spennandi stað áður en þú hleður honum aftur inn í forritið.

    Hver hamur hefur innbyggð Anti-Closure fyrirmæli:

    - Hugstormun: AI virkar sem handritshöfundur þáttaraðar með mörgum tímabilum. Hver af 3 boðnum valkostum VERÐUR að byggja upp hindranir, kynna nýjar ráðgátur, opna sögulínur og cliffhangera. Algjört bann við að bjóða upp á valkosti þar sem persónur sættast til frambúðar, sigrast á aðalhindruninni án mikilla afleiðinga eða sagan stefnir í hraðann endi. Bann við að búa til ódýra, töfrandi staði sem brjóta uppbyggingu heimsins.
    - Grófur Handritshamur: Algjört bann við að ljúka texta með samantektum, siðaboðum eða lokuðum endum. AI á að láta aðgerðina enda náttúrulega á spennandi stað (cliffhanger), forðast niðurstöður, svo næsti bútur geti tekið við frásögninni áreynslulaust.
    - Hefðbundinn Hljóðbókahamur: Algjört bann við að ljúka texta með hátíðlegum samantektum, loka sögulínum eða gefa til kynna endi sögunnar (t.d. "Hún var tilbúin fyrir nýjar áskoranir", "Hún skildi að það var kominn tími til að halda áfram"). Textinn á að enda í miðri aðgerð, spennu eða opnum hugsunum.

    Undantekning frá reglunni: Ef þú biður beint um lok, endalok eða eftirorð, mun AI búa til fullnægjandi lokun á sögunni — bannið gildir ekki þegar þú biður um það.


    Stjórnun á Þáttum og Atriðum (Handritshamur, frá útgáfu 7, varðveitt)

    Grófur Handritshamur hefur sérstakan "{rezyser.struktura_heading}" spjald með hnöppum til að byggja upp uppbyggingu útvarpsleikrits í rauntíma.

    - Setja inn Þátt X: Setur inn fyrirsögn þáttar (t.d. "Þáttur 2") OG bætir sjálfkrafa við "Atriði 1" undir henni — því hver nýr þáttur byrjar á fyrsta atriði. Þáttateljarinn hoppar á næsta númer og atriðateljarinn núllstillist í 2 (tilbúinn fyrir næsta atriði í þessum þætti).
    - Setja inn Atriði X: Setur aðeins inn fyrirsögn atriðis (t.d. "Atriði 3") innan núverandi þáttar. Atriðateljarinn hækkar sjálfkrafa.

    Snjall hleðsla skjals: Þegar þú hleður inn núverandi handritsskrá, mun forritið sjálfkrafa skanna hana og stilla teljara fyrir þætti og atriði á rétt númer. Atriðateljarinn er alltaf reiknaður innan síðasta þáttar í skjalinu.

    Formáli og Eftirorð: Hnappar "{rezyser.btn_prolog_label}" og "{rezyser.btn_epilog_label}" eru sameiginlegir fyrir báða hamina og aðgengilegir í sama spjaldi.

    Hljóðbókaarkitektinn mun sjálfkrafa breyta Þáttum í aðal leiðsögupunkta (Heading 1) fyrir ElevenLabs og NVDA — Atriði verða feitletraður texti sýnilegur í skjalinu, en ósýnilegur í efnisyfirlitinu.


    Snjall Stjórnun á Kafla (Hljóðbókahamur, frá útgáfu 5, varðveitt)

    LLM býr til allt að um 5000 stafi í einu fyrirspurn — það er of lítið fyrir heilan kafla. Þess vegna vinnurðu í lotum: býrð til næstu búta með því að smella á "Senda til AI", þar til þú telur að kaflinn sé tilbúinn. Þá smellirðu á "Setja inn klippingu kafla" — forritið bætir við fyrirsögn í skrána og minni, og kaflateljarinn hoppar sjálfkrafa á næsta númer.

    Hnappar í spjaldinu:

    - Setja inn klippingu (Kafli X): Setur inn fyrirsögn (t.d. "Kafli 3") í skrána og minni. Kaflateljarinn uppfærir sig sjálfkrafa.
    - Setja inn Formála: Virkar aðeins í upphafi, þegar minnið er tómt. Vernd gegn því að setja inn Formála í miðri sögu.
    - Setja inn Eftirorð: Lokar sögunni. Eftir að Eftirorð með efni hefur verið sett inn, mun forritið læsa fyrir frekari framleiðslu á nýjum bútum — þetta er viljandi, því eftir að sagan er lokið er ekkert meira að bæta við.

    Snjall hleðsla skjals: Þegar þú hleður inn núverandi skrá, mun forritið sjálfkrafa skanna hana og stilla kaflateljarann á rétt númer. Ef skráin hefur Formála og þrjá kafla, mun teljarinn sýna "Kafli 4" — án handvirkrar talningar.


    Söguuppsöfnun — hvernig AI minnið virkar

    Aðeins hreinn texti sögunnar fer í minni líkansins — það sem AI hefur í raun skrifað. Leiðbeiningar, valkostir og áætlanir hverfa eftir notkun og trufla ekki samhengið. Áhrifin? Líkanið heldur lengur einbeitingu, man betur eftir áherslum persóna og fer sjaldnar frá reglum Heimabókarinnar.

    Vísirinn "Minni Líkans" á skjánum sýnir hversu mikið pláss sagan þín tekur nú þegar:
    - Grænt (allt að 150.000 stafir): Líkanið er fullkomlega einbeitt, þú hefur öruggt svigrúm.
    - Gult (150.000 – 175.000 stafir): Þú nálgast mörkin. AI getur byrjað að stytta setningar og hunsa reglur. Byrjaðu að loka þræðinum hægt.
    - Rautt (yfir 175.000 stafir): Gagnrýnin ofhleðsla!

    Óendanlegt Minni (frá útgáfu 6, varðveitt)

    Þegar rauði viðvörunarljósin kvikna, þarftu ekki lengur að afrita samantekt handvirkt. Skrifaðu í Hugstormun skipun sem inniheldur orðið "samantekt" eða "yfirlit" — AI mun búa til stutta pilla af þekkingu um alla fyrri söguþráðinn. Smelltu síðan á "Vista Samantekt (varanlega)" — forritið býr sjálfkrafa til skrá _samantekt.txt í möppunni handrit/ og verndar hana gegn tilviljunarkenndri yfirskrift. Eftir að hafa vistað, hreinsaðu minnið og þú getur haldið áfram að skapa í núverandi skrá. Samantektin er hlaðin inn í Langtímaminni fyrir næstu lotu — og þú getur haldið áfram sögunni endalaust, án takmarkana á lengd.

    Hvenær á að taka saman (uppfært í v15.5): Þú þarft ekki lengur að fylgjast með stífum stafamörkum „áður en þú hættir vinnu". Best er að taka saman eftir náttúrulega lokun á stærri byggingarhluta — eftir lok atriðis, þáttar eða kafla. Ástæðan: þegar þú síðar lagar endann handvirkt í frásagnarskránni og smellir á „{rezyser.btn_odswiez_z_dysku_label}", endurgerir forritið nákvæmlega ferska bútinn sem talinn er frá síðustu fyrirsögn — en samantekt fyrri hlutans helst ósnortin. Þess vegna er enn meira virði að halda byggingu: settu reglulega inn fyrirsagnir Kafli/Þáttur/Atriði úr byggingarspjaldinu (langar formgerðir án nokkurra þátta/kafla, t.d. „módernískt drama" í einum streng, eru ekki ráðlagðar). UNDANTEKNING: ef þú heldur úti mjög langri sögu ALGJÖRLEGA án fyrirsagna, er áfram nauðsynlegt að búa til og vista Samantekt áður en þú gerir hlé — án markera getur forritið aðeins endurgert síðasta bútinn sem talinn er í stöfum.

    Sjálfvirk samantekt: Þegar minnið fer í viðvörunarástand, skiptir Hugstormun sjálfkrafa yfir í neyðarham — í stað þess að búa til valkosti strax, býr það fyrst til nákvæma samantekt á allri fyrri söguþræðinum og vistar hana í merkjum <SAMANTEKT>. Forritið greinir þessi merki og flytur samantektina sjálfkrafa í Langtímaminni. Engin handvirk vinna!

    Snjöll hleðsla og endurhleðsla af diski (uppfært í v15.5): Bæði við hleðslu verkefnis og eftir smell á nýja hnappinn „{rezyser.btn_odswiez_z_dysku_label}" (eftir handvirka breytingu á frásagnarskránni í textaritli) ákveður forritið sjálft hvernig það samræmir minnið við diskinn. Ef ÖLL sagan kemst fyrir í samhengisglugganum — hleður það henni í heild sinni og þurrkar út óþarfa gamla samantekt, svo vélin vinni á fullum texta (þetta lokar gömlu glufunni, þar sem líkanið fékk aðeins samantektina án samhengis síðustu atriða). Ef sagan er LÖNG og á vistaða samantektarskrá — heldur það samantektinni ósnertri og setur aðeins ferska endann inn í Núverandi minni, talinn frá síðustu byggingarfyrirsögn (Kafli/Þáttur/Atriði). Þannig sóarðu ekki táknum í að hlaða alla söguna aftur, og um leið verður næsta samantekt ekki til á úreltum gögnum.
  krok_3b_most_elevenlabs: |
    KROK 3b: Brú til ElevenLabs Studio (leikhúslestrar → margra radda hljóðbók)

    Frá útgáfu 16.0 geturðu breytt tilbúnum leikhússkrifum (Skjalastilling) í margra radda verkefni í ElevenLabs Studio — sögumaður og hver persóna fá sér rödd. Þetta er VALFRJÁLS eiginleiki, fullkomlega aðskilinn frá restinni af forritinu: án ElevenLabs lykils breytist ekkert, hefðbundið flæði með breytara heldur áfram.

    ElevenLabs lykill (valfrjáls)

    Límdu ElevenLabs lykilinn þinn í skrána golden_key.env, á sér línu: ELEVENLABS_API_KEY=sk_... Athugið: ElevenLabs lykill byrjar á sk_ (með UNDIRSTRIKI), ólíkt OpenAI lykli (sk-). Ef þú notar lykil með takmörkunum (restricted key), gefðu honum heimildir (scope) projects_write og voices_read. Staða lykilsins sést á aðalskjánum (System Check) — skortur á lykli er ekki villa, brúin er einfaldlega falin.

    Brúin birtist í Stjórnborði í Skjalastillingu (þegar lykillinn er réttur). Hún virkar á tilbúinni leikriti sem er vistað á disknum — fyrst skaltu búa til eða hlaða inn verkefni, síðan fara í brúna.

    Skref 1 — Raddsetning

    Smelltu á „Raddsetning…". Forritið les inn persónur úr skjalinu þínu sem hafa línur og bætir alltaf við rauf fyrir Sögumann (sögumaður er sjálfgefin rödd — les titla kafla og alla frásögn). Fyrir hvern ræðumann skaltu líma inn voice ID. Hvernig á að fá voice ID í ElevenLabs (í vafra): farðu í flipann Voices, finndu röddina og spilaðu sýnishorn til að vera viss um að það sé rétt; opnaðu „More actions" við þá rödd og veldu „Copy Voice ID"; límdu afritaða auðkennið í viðeigandi reit. Þú getur notað tilbúnar raddir (premade) eða þínar eigin, þar á meðal þær sem eru búnar til í flipanum Voice Design. Þú getur skilið reitina eftir tóma og komið aftur seinna — skráningin er drög.

    Skref 2 — Byggja verkefni

    Smelltu á „Búa til verkefni ElevenLabs Studio…". Forritið athugar hvort skjalið hafi að minnsta kosti einn kafla (Prolog/Akt/Kafli) og hvort hver ræðumaður og sögumaður hafi úthlutað rödd, og síðan býr það til margra radda Studio verkefni á reikningnum þínum skipt í kafla. Sjálf verkefnissköpunin EYÐIR EKKI inneignum.

    Skref 3 — Útgáfa í vafra

    Eftir að verkefnið hefur verið búið til sýnir forritið auðkenni þess og hnapp sem opnar ElevenLabs Studio. Í vafranum skaltu finna verkefnið, búa til tal (það eyðir inneignum — um það bil 1 inneign á tákn), og síðan flytja út hljóðskrána eða birta verkefnið í Eleven Reader. Útgáfa og birting fer fram þér megin, meðvitað — forritið byggir aðeins verkefnið.

    Af hverju leikhúslestrar, en ekki hljóðáhrif? Í fyrri útgáfum framleiddi Skjalastilling hrá hljóðáhrif [SFX: ...] án sögumanns. Brúin til tilbúins, margra radda upptöku krefst þess hins vegar að samhengi (staðsetning, tími, aðgerð) sé flutt af sögumanni með orðum: hljóðáhrif í Studio eru ekki aðgengileg fyrir skjálesara, og líkanið framkvæmir hvort sem er sögumann eða áhrif — aldrei stöðugt bæði í einu. Þess vegna er Skjalastilling núna leikhúslestrar: sögumaður plús samtal, án SFX.
  krok_4_postprodukcja: |
    SKREF 4: Eftirvinnsla í Reżyser Audio GPT

    Eftir að hafa skrifað söguna hefurðu aðgang að eftirvinnslutóli sem er aðgengilegt neðst á Leikstjóra spjaldinu (kemur aðeins fram í Hljóðbókarham).

    Að gefa kaflaheiti (Hljóðbókarhamur)

    Gervigreindin mun greina alla söguna og leggja til lýsandi, bókmenntaleg heiti fyrir hvern kafla (og hugsanlega Prolog og Epilog). Einingin fer í gegnum kaflana úr skrá sem hefur verið vistuð og gefur þeim stutt heiti með því að greina aðeins upphaf hvers kafla (allt að 6000 tákn). Hún skilar eingöngu tölusettum lista af heitum — án þess að afrita innihald bókarinnar.

    Athugið: Einingin krefst þess að skráin sé þegar vistuð á disk (búin til eða hlaðið inn). Ef skráin er ekki til, mun forritið birta viðeigandi skilaboð.
  krok_5_poliglota_intro: |
    SKREF 5: Tungumálamaður AI

    Forrit til þýðinga og þvingunar á hreimum á skjálesaralesurum. Fara í það með því að smella á hnappinn "{main.btn.poliglota}" á hnappastikunni eða velja Verkfæri → {main.menu.poliglota} úr valmyndinni (flýtilykill: Ctrl+2).

    Hamur 1: Venjulegur Þýðandi (Notar AI - Greitt)

    Tilvalið til að hlusta á sögur á fallegu, réttmætu erlendu máli.

    - Hladdu inn skrá með hnappnum "{poliglota.btn_wczytaj}" eða með því að nota hnappinn "Skoða..." til að velja skrá í kerfisglugganum.
    - Veldu "AI Þýðandi" ham, sláðu inn markmálið (t.d. "Finska").
    - Forritið mun þýða efnið. Ef þú hleður inn .html skrá, mun það aðeins þýða textann sem er sýnilegur lesandanum og uppfæra tungumálakóðann í html taginu.
    - Ef þú hleður inn venjulegri .txt eða .md skrá (t.d. skrá sem er búin til af Leikstjóra), mun forritið sjálfkrafa vista niðurstöðuna sem .html skrá með innbyggðum tungumálakóða eftir þýðingu — tilbúið til að lesa með NVDA án viðbótarvinnu.
    - Styður einnig .docx skrár.

    Snjöll skipting í blokkir: Langir textar eru sjálfkrafa skiptir í blokkir allt að 10.000 stafi og þýddir í röð með framvindustiku.

    Öruggt framvinduvistun (NÝTT í útgáfu 9): Hver þýdd blokk er strax vistuð í falda tímabundna skrá í kerfismöppu forritsins. Ef þýðingin er rofin vegna þess að API kvótinn er uppurinn, mun forritið sjálfkrafa greina þessa skrá við næstu ræsingu, endurheimta þegar greidda framvindu og ljúka verkinu rólega frá því sem var rofið — án handvirkrar afritunar. Eftir árangursríka lokun er tímabundna skráin sjálfkrafa fjarlægð.

    Af hverju er þetta mikilvægt? Í útgáfu 8 var nálgunin við að halda áfram þýðingu með alvarlegum, hljóðlátum galla: ef þú endurnefndir ekki skrána með hlutþýðingu og skarðst þýdda hlutann samkvæmt leiðbeiningum, og síðan hélt áfram að þýða restina strax — opnaði forritið útskriftarskrána í yfirskriftarham. Greidd framvinda var óafturkræf og ómeðvituð eytt áður en þú tókst eftir neinu. Útgáfa 9 útrýmir þessari gildru algjörlega: vistun er varanleg eftir hverja blokk, óháð því hvað þú gerir síðan.

    Hamur 2: Leikstjórahamur / Hreimar (Ókeypis - Virkar staðbundið)

    Tól til að "spilla" texta. Þvingar brotna pólsku á talgervla.

    Samþætt fellivalmynd Leikstjórahamar gerir þér kleift að velja hreim beint af einum lista. Í boði eru:
    Enska (Samantha / Mark — Vocalizer/Apple, Zira / Hazel — OneCore)
    Rússneska (Milena — Vocalizer/Apple, Irina / Pavel / Yuri — OneCore, eSpeak)
    Franska (Thomas / Amelie — Vocalizer/Apple, Julie — OneCore)
    Þýska (Markus / Stefan — Vocalizer/Apple, Hedda / Katja — OneCore)
    Spænska (Jorge / Monica — Vocalizer/Apple, Helena — OneCore)
    Pólska (Ewa — Vocalizer, Paulina — OneCore)
    Ítalska (Alice / Luca — Vocalizer/Apple, Elsa — OneCore)
    Finska (Satu / Mikko — Vocalizer/Apple, Heidi — OneCore)
    Og einnig tvær hreinsunarvalkostir án hreims:
    "Enginn (Hreinsun ÁN talnaviðmiðunar)"
    "Enginn (Hreinsun MEÐ talnaviðmiðunar)"
    Valmöguleikinn með talnaviðmiðunar breytir sjálfkrafa tölum í orðform (t.d. 15 verður "fimmtán") fyrir vinnslu — þannig les NVDA tölur áreynslulaust, og ef textinn hefur þvingaðan hreim, fær talan hann líka, án undantekninga.
    Þú spyrð kannski hvort talgervillinn muni geta beygt slíkar tölur eftir samhengi? Svarið er: nei. Og það er viljandi eiginleiki. Eins og alkunna er: "pólska erfið mál" — og útlendingur sem brýtur málfræðina okkar bætir aðeins við áreiðanleika brotins hreims!

    Tagaviðgerðarmaður (NÝTT í útgáfu 9): Neðst á listanum finnurðu viðbótarvalkost — Tagaviðgerðarmaður. Hann beitir engum hljóðreglum eða hreinsun. Hann gerir eitt: sprautar inn í skrána þann tveggja stafa ISO tungumálakóða sem þú gefur upp (t.d. "fi" fyrir finska, "en" fyrir enska). Gagnlegt þegar þú hefur þegar tilbúna skrá — t.d. áður þýdda af AI Þýðanda — en af einhverjum ástæðum kom hún út með röngum eða vantar tungumálamerki. Í stað þess að þýða hana aftur, einfaldlega keyrirðu Tagaviðgerðarmanninn með réttum ISO kóða og eftir smá stund hefurðu rétta skrá.

    Forritið hreinsar leikstjóraleiðbeiningar í sviga — fjarlægir alla texta sem eru í sviga (t.d. "(með innfelldum andardráttum)", "(hvíslað)", "(háðslega)"). ElevenLabs á að lesa aðeins samtöl og frásögn, ekki leikstjóraleiðbeiningar innfelldar í textann.

    Forritið hreinsar einnig Markdown merki — fjarlægir fyrirsagnahashmerki (t.d. #, ##, ###), jafnteignarmerki notuð sem undirstrikanir á fyrirsögnum og munaðarlaus kommur sem gætu truflað lestrarhrynjandi talgervilsins.

    - Verndarskjöldur: Forritið verndar öll HTML merki. Það spillir aðeins samtölum og frásögn.
    - Virkar staðbundið og kostar ekkert!
  krok_5_tryb_szyfrant: |
    Tryggð 3: Dulritari (NÝTT í 13.0 — skemmtun með texta, frítt, staðbundið)

    Þriðji RadioButton í Tungumálamanninum, við hliðina á AI Þýðanda og Leikstjóraham: „Dulritarahamur (skemmtun með texta, tilviljanakennd truflun)". Virkjar sex staðbundnar reiknirit sem afmynda texta — til skemmtunar, gátna, tungumálalegra þrauta. Eftir að hamurinn er valinn birtist fellilisti með reikniritum, og fyrir eitt þeirra (Cæsar dulritið) er viðbótar reitur fyrir færslu.

    Aðgengileg reiknirit (veldu í valmyndinni „Veldu afmyndar reiknirit"):

    - Texta Afturköllun (Lesið afturábak með stórum staf) — hver setning er snúin við staf fyrir staf, með punktum/upphrópunarmerki/spurningarmerki á enda og stórum staf í upphafi. Áður en snúið er við, stækkar skriftin vinsælar skammstafanir (t.d., þ.e., m.a., u.þ.b., o.s.frv.), svo útkoman eftir viðsnúning hafi enn merkingu — án þess myndi „t.d." snúast við í fáránlegt „.d.t".

      Innblástur: verkefni úr þættinum „The Traitors. Zdrajcy". Þegar stjórnandinn sýndi þátttakendum vinsælt pólsk lag úr teiknimynd — einfaldlega spilað afturábak — voru viðbrögðin á borð við „hvaða tungumál er þetta?", „þetta er líklega armenska", „ungverska eða finnska". Verkefnið var að eitt lið fékk texta lagsins í skóginum, skrifað afturábak, og átti að syngja það í þessari snúnu mynd, hitt liðið tók það upp, spilaði það afturábak — og í kenningu endurheimti upprunalega lagið til að giska á. Nákvæmlega sama fyndna hljóðvilla myndar okkar Afturköllun þegar þú spilar breytta skrá í gegnum TTS.

    - Typoglycemia (Blandaður miðhluti orða) — klassískur sálfræðilegur áhrif: „Þú gtiær lseið txeta í hvðaa röð sem er, svo fralarmega sem ftysri og sðsíiasti sftaur hvres oðrs er á rttéum saðt". Skriftin blandar tilviljanakennt miðhluta hvers orðs lengra en 4 stafir, fyrsti og síðasti stafur eru óbreyttir. Frábært til að prófa „hversu mikið sé ég í raun, og hversu mikið ályktar heilinn minn".

    - Skemmdur Sími / Ormadíalekt — hvert „s", „z" eða tvíhljóð „sz" er tilviljanakennt lengt í hvæs af lengd 4-8 stafa („ssssss", „zzzzzz", „ssssssz"). Innblástur: Snecko úr leiknum „Slay the Spire". Áhrif: textinn hljómar eins og hann hafi verið lesinn af ormi með talgalla.

    - Sérhljóðari (Allt hljómar á „O") — hver sérhljóði í textanum er breytt í „o", með varðveislu íslenskra mýkinga. „Góðan daginn" → „Góðon doginn". Því lengri texti, því skemmtilegri áhrif (og skjálesari les þetta með fullri sannfæringu).

    - Sterkt Stam / Skemmdur Vélmenni — bætir við stami í upphafi orða: „to-to-to-tölva", „st-st-sturta". Fyrir stutt orð (minna en 3 stafir) sleppir reikniritið þeim. Ef annar stafur orðsins er samhljóði, endurtekur það fyrstu tvo stafina (náttúrulegri áhrif); ef sérhljóði — endurtekur aðeins fyrsta.

    - Cæsar Dulrit (færslu íslenska stafrófsins) — klassískt staðgengils dulrit: hver stafur er færður um N stöður í íslenska stafrófinu (AÁBDÐEÉFGHIÍJKLMNOÓPRSTUÚVXYÝÞÆÖ, 32 stafir). Færslugildið slærðu inn í reitinn „Færsla Cæsar dulrits (0 = tilviljun, bil -32…32)". Ef þú slærð inn 0 — forritið velur tilviljanakennda færslu á bilinu 1-31 og sýnir hana í skilaboðum eftir að ljúka (svo þú getir síðan afkóðað). Stafir utan stafrófsins (tölur, greinarmerki, bil) eru óbreyttir.

    Hagnýt notkun: dulritin vista niðurstöðuna á sama formi og Leikstjórahamur (.html með lang tagi eða .docx með XML merkjum), þannig að NVDA les þau með rödd viðeigandi tungumáls. Sérstaklega Afturköllun og Sérhljóðari hljóma í talgervli mun áhugaverðari en þegar þú lest þau með augunum — því heilinn reynir sjálfkrafa að „afkóða" textann við sjónlestur, en TTS les hann nákvæmlega eins og hann er skráður.

    Öll sex dulritin eru einnig lýst á breiðari, aðgengilegri hátt í skjalinu docs/dictionaries.pl.txt í forritapakkanum — ásamt ráðum um hvernig á að bæta við eigin dulriti af gerðinni „skipta um stafi" án þess að kunna forritun (t.d. skólaslang, grasamál).
  krok_5_detekcja_jezyka: |
    Málgreining

    Áður en skriftin "spillar" textanum, athugar hún hvaða tungumál textinn er skrifaður á. Ef hún greinir að það sé ekki pólskur texti, birtir hún viðvörun. Hljóðfræðilegu reglurnar eru sniðnar fyrir pólsku — að beita þeim á texta á öðru tungumáli myndi leiða til ófyrirsjáanlegra áhrifa.
  krok_5_akcenty_nvda: |
    Akcentar hannaðir fyrir staðbundna talgervla (NVDA)

    Akcentarnir hafa verið 100% hannaðir fyrir staðbundna, ókeypis og greidda talgervla fyrir skjálesara — Vocalizer og eSpeak í NVDA. Þetta tryggir stöðugleika og fyrirsjáanleika á hverjum tölvu.

    Af hverju ekki ElevenLabs? Prófanir á lengri skjölum sýndu að hljóðfræðileg afbökun texta í vélum eins og ElevenLabs þvingar ekki fram tilætlaðan hreim — vélin "giskar" einfaldlega á tungumálið og gerir frekar hreim vestur-/suður-slavneskan. Staðbundnir talgervlar NVDA eru mun hlýðnari í þessu efni.
  krok_5_specyfika_tts: |
    Sérkenni staðbundinna talgervla (TTS)

    Mismunandi TTS-vélar hegða sér á ólíkan hátt. Hér að neðan eru lykilmunir sem hafa bein áhrif á framburð:

    eSpeak (Open Source)
    Léttur, ókeypis vél með gríðarlega stórt tungumálasafn — styður m.a. íslensku. Mjög strangur varðandi kóðun tákna, sem gerir hann fyrirsjáanlegan. Hins vegar hefur hann hljóðfræðilegar takmarkanir: oft deilir hann hljóðönum milli tungumála, sem veldur því að til dæmis úkraínska hljómar með rússneskum blæ.
  krok_5_tiflotecnia: |
    Tiflotecnia Voices fyrir NVDA (raddir Cerrence — áður Vocalizer frá Nuance)

    Tiflotecnia Voices er beinn arftaki Vocalizer frá Nuance — viðskiptahugbúnaður með raddir af nýrri kynslóð frá fyrirtækinu Cerrence, dreift sem .nvda-addon pakki í NVDA Add-on Store. Gamli Vocalizer (32-bita .dll bókasöfn frá Nuance) var lagður af með NVDA 2026.1; Cerrence endursamdi raddirnar í 64-bita og Tiflotecnia gaf þær út undir nýju nafni. Gæði framburðar eru áberandi betri en í fyrri kynslóðinni.

    Hvernig á að setja upp: NVDA → Verkfæri → Add-on Store → leita að „Tiflotecnia Voices for NVDA" → Setja upp. Eftir uppsetningu birtist sérstakt undirvalmynd „Tiflotecnia Voices" í NVDA valmyndinni og eigin flokkur í stillingum NVDA. GUI viðbótarinnar leiðir þig skref fyrir skref í gegnum kaup á leyfi (eða virkjun 7 daga prufutímabils), val og uppsetningu fyrstu raddanna (t.d. pólsku Ewa fyrir fljótlega lestur á kerfisstýringum, finnsku Satu fyrir hreim í Tungumálamanninum). Innbyggð hjálp viðbótarinnar er skýr, svo við endurtökum ekki ferlið hér — það er nóg að láta viðbótina leiða þig.

    Ábending fyrir þá sem flytja frá Vocalizer og Eloquence: uppfærsla á lægra verði er í boði. Ferli: eftir að greiðsla hefur verið staðfest, sendu strax tölvupóst á netfangið sem er tengt á skjánum eftir greiðslu og biðjið um staðfestingu á gamla virkjunarkóðanum — Tiflotecnia mun staðfesta rétt til afsláttar og laga verðið. Án þessa tölvupósts mun kerfið meðhöndla þig sem nýjan viðskiptavin.

    Aðgengi að röddum: Tiflotecnia Voices styður flest tungumál sem Vocalizer hafði (m.a. pólsku, ensku, þýsku, frönsku, spænsku, finnsku, ítölsku, rússnesku). Listi yfir raddir fyrir hvert tungumál er sýnilegur í stillingaflokki viðbótarinnar áður en leyfi er keypt.
  krok_5_onecore: |
    Microsoft OneCore
    Ókeypis raddir sem eru innbyggðar í Windows kerfið (Mobile Voices). Gott jafnvægi milli gæða og aðgengis tungumála. Býður upp á hágæða og hefur stuðning fyrir íslensku (Gudrun), finnsku (Heidi) og ítölsku (Elsa). Athugið: OneCore styður EKKI sjálfvirka tungumálaskiptingu byggða á lang-tögum (nema þú notir innbyggðan skjálesara kerfisins, sögumann) — sjá kafla hér að neðan.

    Hvernig á að sækja OneCore raddir á Windows? OneCore raddir eru ókeypis, en flest tungumál eru ekki uppsett sjálfgefið. Til að sækja vantar tungumál, farðu í Windows Stillingar → Tími og tungumál → Tal → Stjórna röddum (eða "Bæta við röddum"). Veldu tungumál af listanum (t.d. Íslenska, Finnska, Ítalska) og smelltu á Sækja. Eftir niðurhal birtist röddin sjálfkrafa í NVDA — án nokkurrar viðbótarstillingar.
  krok_5_apple: |
    Apple (iPhone / iPad / Mac) — VoiceOver með Vocalizer
    Á Apple tækjum er Vocalizer vél innbyggð í stýrikerfið og styður alla tungumál án nokkurra viðbótarkaupa. Sjálfgefið eru þó uppsett þétt útgáfa af röddum sem hljóma dálítið vélrænt. Til að fá mun betri og náttúrulegri hljóm er gott að hlaða niður útvíkkuðum eða úrvalsútgáfum:
    - Á iPhone/iPad: Stillingar → Aðgengi → VoiceOver → Tal → Rödd → veldu tungumál (t.d. Finnska) → snertu nafn raddarinnar (t.d. Satu) → þú munt sjá valkostina "Útvíkkað" og "Úrvals". Sæktu valda útgáfu — hún tekur meira pláss á disknum, en munurinn á gæðum er áberandi.
    - Á Mac: Kerfisvalkostir (eða Kerfisstillingar) → Aðgengi → VoiceOver → Opna VoiceOver verkfæri → Tal → Rödd → smelltu á "Sérsníða" við valda rödd og sæktu útvíkkaða eða úrvalsútgáfu.
  krok_5_android: |
    Android — Vocalizer greitt fyrir hvern rödd
    Á Android er Vocalizer fáanlegt sem forrit í Google Play Store (leitaðu að "Vocalizer TTS"). Athugið: hvert tungumál og rödd er keypt sérstaklega — það er ekki til ein leyfi fyrir allt. Áður en þú kaupir geturðu prófað röddina í nokkrar mínútur í kynningarham. Eftir kaup er röddin tengd við Google reikninginn þinn og hægt er að setja hana upp á hvaða tæki sem er með sama reikningi.
  krok_5_tagi_jezykowe: |
    Killer Feature fyrir blinda: Skrár með tungumálamerkjum

    Þetta er sannkölluð bylting. Unnar skrár eru nú vistaðar sem:

    - .html með lang eiginleika (t.d. lang="fi" fyrir finnska) — NVDA les þennan merkimiða og skiptir sjálfkrafa yfir á viðeigandi tungumálatalgervil. Engin handvirk stilling!
    - .docx með varðveittum sniði — hver textahluti hefur innsprautaðan tungumálamerki í XML skjalsins, þannig að Word og NVDA vita hvaða rödd á að nota fyrir hvern hluta.

    Unnar skrár eru alltaf vistaðar sem NÝ skjöl (t.d. akcent_Finski.html).
  krok_5_auto_jezyk_nvda: |
    Sjálfvirk tungumálaskipting í NVDA — það sem þú þarft að vita

    Til að NVDA skipti raunverulega um rödd byggt á lang tag, þarf að vera virkt stilling "Skiptu sjálfkrafa um tungumál þegar það er stutt". Þú finnur það í NVDA Valmynd → Tal. Sjálfgefið er það virkt við fyrstu ræsingu lesarans — en það er gott að athuga hvort einhver hafi slökkt á því.

    Mikilvægt takmörkun á OneCore röddum: Microsoft OneCore raddir styðja ekki innfæddan þennan eiginleika með NVDA, aðeins með innbyggða Windows lesaranum. Það er til óopinber viðbót við NVDA sem heitir „One Core Autolang", sem reynir að laga þetta — en þróun þess hefur verið stöðvuð fljótt. Ástæðan er einföld: á hverju ári, með fyrstu útgáfu NVDA á því ári, koma breytingar sem brjóta samhæfni API (svokallaðar API Breaking Changes). Stundum er nóg að uppfæra reitinn „last tested version" í yfirlýsingu viðbótarinnar, en stundum þarf raunverulegar breytingar á kóðanum — og höfundurinn nær ekki að fylgja eftir með uppfærslum. Ef þú vilt sjálfvirka tungumálaskiptingu, eru öruggari valkostir Tiflotecnia Voices (greitt, kafli hér að ofan) eða eSpeak (ókeypis, lakari gæði), sem styðja þennan eiginleika innfæddan — en varúð: núna í Tiflotecnia Voices virkar það með forgangsvillu (sjá „Kritískur krókur" hér að neðan). Eftir að hafa afritað plásturinn gengur sjálfvirk skipting eins og í gamla Vocalizer.
  krok_5_alarm_detekcja_jezyka: |
    Kritískur galli Tiflotecnia Voices: biluð tungumálagreining

    Fyrst góðu fréttirnar — viðvörunin um NVDA 2026.1 úr fyrri útgáfum handbókarinnar endaði með góðum árangri: Cerrence afhenti 64-bita bókasöfn, Tiflotecnia gaf þau út í .nvda-addon pakka sem er aðgengilegur í Add-on Store (sjá kaflann hér að ofan), og Vocalizer hjá þeim sem héldu honum til loka kom aftur undir nýju nafni — með betri gæðum og án 32-bita takmarkana.

    Með útgáfu Tiflotecnia Voices kom hins vegar nýr kritískur galli — í tungumálagreiningu. Í stillingum viðbótarinnar er hægt að stilla hvaða rödd á að nota fyrir ákveðna stafi (t.d. latneska, kyrillíska) eftir því hvaða raddir eru uppsettar. Vandamálið er í forgangsröðinni: núna er fyrst beitt yfirskrift á hvern staf, síðan fallbakki til ISO tungumálakóða (í reynd óaðgengilegt fyrir SAMA stafróf, sem yfirskriftin hefur nú þegar verið stillt á), og að lokum valin rödd. Afleiðingin birtist innan sama stafrófs: þú ert með texta á finnsku með réttum `lang="fi"` merkimiða, uppsett Satu sem finnska rödd Tiflotecnia, EN í stillingum er valin pólsk rödd fyrir latneska stafi — Satu LES ekki þennan texta, þrátt fyrir réttan ISO merkimiða. Yfirskrift á hvern staf „pólsk rödd fyrir latínu" vinnur á fyrsta stigi, ISO `fi` er aldrei athugað. Fyrir pör með mismunandi stafróf virkar kerfið rétt (rússneskur texti + Milena fyrir kyrillískt + pólsk rödd fyrir latínu — allt kyrillískt fer með Milenu, möguleg latnesk nöfn með pólskri rödd; hvert stafróf er í sinni yfirskrift). Eftir flutning frá Vocalizer, þar sem tungumálaskipting á grundvelli ISO virkaði fullkomlega, munu notendur taka eftir þessari afturför strax — sérstaklega þeir sem nota nokkra evrópska hreima í Tungumálamanninum (Satu, Alice, Markus) á sama latneska stafrófi.

    Greining og plástur: Ég greindi vandamálið á Python stigi í kóða viðbótarinnar og útbjó plástur sem breytir forgangsröðinni í: ISO → valin rödd → stafayfirskrift. Plásturinn viðheldur gagnlegri skiptingu á latínu fyrir latnesk nöfn í rússneskum texta, þegar „tungumálagreining á grundvelli Unicode stafa" er virk í stillingum. Ég sendi plásturinn til þróunaraðila Tiflotecnia fyrir 5 dögum — enn án svars.

    Hvað á að gera á meðan: ef þú vilt hafa rétta tungumálagreiningu (það er þess virði — þetta var eitt af „killer features" gamla Vocalizer, sjá „Killer Feature fyrir blinda" hér að ofan), opnaðu mál í forritasafni á GitHub með merkimiðanum `tiflotecnia-patch` og netfangið þitt í textanum. Það er þess virði að bæta við stuttri lýsingu á vandamálinu á eigin tungumáli (2–3 setningar duga) — bóturinn greinir tungumálið (stuðningur: pólska, enska, þýska, spænska, finnska, franska, íslenska, ítalska, rússneska) og svarar á sama tungumáli; án lýsingar eða á öðru tungumáli kemur svarið á ensku. Sjálfvirkur botn mun strax loka málinu með staðfestingu á innsendingu (án ummerkja í opinberu þræðinum), og þú færð plásturinn í tölvupósti yfirleitt innan nokkurra daga. Plásturinn er EKKI birtur í forritasafninu né sem Gist — Tiflotecnia Voices fyrir NVDA er viðskiptahugbúnaður, og leyfi viðbótarinnar leyfir ekki endurdreifingu á skrám þess, jafnvel ekki breyttum. Eftir að þú hefur fengið plásturinn þarftu að afrita innihald hans í `%appdata%\Roaming\nvda\addons\TiflotecniaVoices`, skipta út skrám. Varúð við afritun: ef Windows spurði ekki um skipti, þá hefurðu líklega afritað allan `TiflotecniaVoices_edits` möppuna með innihaldi hennar Í STAÐINN FYRIR einungis innihaldið — í slíku tilviki farðu inn í nýju undirmöppuna, klipptu allt, límdu það upp um eitt stig og skrifaðu yfir. Eftir að plásturinn hefur verið beittur með góðum árangri, endurræstu NVDA — njóttu betri gæða Cerrence 64-bita radda og réttrar tungumálagreiningar, sem er sambland sem enginn einstakur framleiðandi á markaðnum býður upp á. Við gerum ráð fyrir að þú hafir gilt leyfi fyrir Tiflotecnia Voices — við staðfestum það ekki, en þú getur ekki beitt plástrinum á möppu annarra án leyfis.
  krok_6_architekt: |
    SKREF 6: Arkitekt Hljóðbóka

    Tól til að undirbúa faglega uppbyggingu skráar fyrir skjálesara og ElevenLabs. Farðu í það með því að smella á "{main.btn.konwerter}" hnappinn á hnappastikunni eða velja Verkfæri → {main.menu.konwerter} úr valmyndinni (flýtileið: Ctrl+3).

    Hvernig virkar það?

    1. Sláðu inn slóðina að upprunaskránni í textareitinn eða smelltu á "Flettu..." hnappinn til að velja skrá í kerfisglugganum. Skiptin tekur við bæði .txt og .docx, sem og .html og .htm skrám.
    2. Smelltu á "{konwerter.btn_buduj}".
    3. Skiptin skannar hverja línu textans og breytir lykilorðum (Þáttur, Kafli, Formáli, Eftirskrift, Upphaf) í fyrirsagnir "Heading 1" í Word skjalinu.
    4. Senur (línur sem byrja á orðinu "Sena") verða að feitletruðum texta — sýnilegar í skjalinu, en ósýnilegar í innihaldsyfirliti ElevenLabs.
    5. Allur annar texti (samtöl, lýsingar) fer óbreyttur í gegn.
    6. Þú færð skrána architektura_[nafn_upprunans].docx — faglegt Word skjal tilbúið til frekari vinnslu. Til dæmis, ef upprunaskráin þín hét dofi.txt, verður úttaksskráin nefnd architektura_dofi.docx og birtist í sama möppu og upprunaskráin.

    Hreinsun í leiðinni: Skiptin fjarlægir sjálfkrafa HTML merki (ef textinn kemur úr vafra eða staðbundinni .html skrá, t.d. búin til af Tungumálamanninum) og Markdown fyrirsagnamerki (t.d. ### eða ####) áður en hann er unnin. Þú þarft ekki að hreinsa skrána handvirkt.

    Söguhamur: sjálfvirk hópun umferða í senur (frá v15.1)

    Ef þú hleður inn í Arkitekt skrá opowiesci/<leikur>.txt búin til af Interaktívu Sögumódúlnum, mun umbreytirinn þekkja umferðarmerki (t.d. „--- Umferð 7 ---") á 9 tungumálum (Umferð, Turn, Runde, Turno, Vuoro, Tour, Umferð, Turno, Ход) og á fimm umferðum mun hann setja nýja fyrirsögn á fyrsta stigi í formi „Sena N" (númer byrjar frá 1, staðbundið fyrir hvert tungumál — á ensku „Scene N", á þýsku „Szene N" o.s.frv.). Önnur umferðarmerki eru fjarlægð — þau birtast ekki í hljóðbókarfrásögninni, því „Umferð 7" lesið af TTS brýtur niðurdýfingu hlustandans. Útkoman er Word skjal með náttúrulegri skiptingu í senur með nokkrum mínútum af hljóði hver, tilbúið til innflutnings í ElevenLabs. Kerfið er sjálfvirkt — venjulegar hljóðbókarskrár án umferðarmerkja (hefðbundin frásögn úr Leikstjóra) eru unnar nákvæmlega eins og áður.

    Öflugur kostur fyrir NVDA og ElevenLabs notendur

    "Heading 1" snið fyrir kafla er ekki bara fagurfræði. Í NVDA geturðu flett á milli fyrirsagna á augabragði með því að ýta á H (eða 1 fyrir fyrirsagnir á fyrsta stigi). Í stað þess að fletta í gegnum hundruð blaðsíðna, hopparðu frá kafla til kafla á sekúndubroti. Þetta breytir því hvernig þú vinnur með löng skjöl. Í ElevenLabs hefurðu tryggingu fyrir því að vélin setji sjálfkrafa inn klippingar og festist ekki við að leikstýra hljóðklippum.
  krok_7_ksiega_swiata: |
    SKREF 7: Hvernig á að skrifa Heimsbókina (Arkitekts Prompt og Mini-námskeið í Markdown)

    Gervigreindin sem knýr Aðalstúdíóið skilur best skipanir þegar þær eru sniðnar í Markdown merkingarmáli. Ef þú gefur AI í Leikstjóra bara lauslega hugmynd (t.d. "tvær systur í undirheimum"), mun vélin verða stressuð vegna skorts á smáatriðum og búa til klisjukennda, fyrirsjáanlega sögu, sem hunsar rökfræði.

    Til að koma í veg fyrir þetta, notaðu ytri spjallmenni (t.d. ókeypis ChatGPT eða Claude) sem þinn persónulega Arkitekt. Í útgáfu 13.0 þarftu ekki lengur að afrita prompt úr leiðbeiningunum — í Leikstjóra spjaldinu, rétt undir hnappnum „{rezyser.btn_zapisz_ksiege_label}", finnurðu hnappinn „{rezyser.btn_prompt_architekta_label}". Smelltu á hann og gluggi með tilbúnum texta prompt í „aðeins til lesturs" reit og hnappinn „Afrita í klippiborð" opnast. NVDA tilkynnir allt innihaldið strax eftir að glugginn opnast — það nægir að smella á „Afrita", líma (Ctrl+V) í ChatGPT/Claude og skipta út hlutanum „[SETTU HUGMYND ÞÍNA HÉR]" með þinni eigin söguþráðarhugmynd.

    Af hverju svona, en ekki með því að afrita úr leiðbeiningunum? Samræðan í GUI hefur mikilvægt aðgengisatriði: hún er innfædd og lesin án truflana af skjálesara, krefst ekki þess að skipta yfir í textaritil (þar sem íslenskir stafir og gæsalappir eru oft ranglega afritaðir) og virkar eins á öllum stýrikerfum. Sama mynstur — samræða með prompt til að afrita — er einnig notað í Reglustjóra (sjá SKREF 7b hér að neðan).

    Hvernig AI svarar: Í svarinu færðu texta í tveimur hlutum. Fyrsti hlutinn er Heimsbókin lokuð í Markdown kóða blokk (merki ```markdown … ```). Afritaðu AÐEINS innihald kóðablokkarinnar (án sjálfra merkjanna ```) og límdu í reitinn „Heimsbók" í Leikstjóra, og smelltu síðan á „{rezyser.btn_zapisz_ksiege_label}". Annar hlutinn er tillaga um, hvaða skapandi hamur (Handrit eða Hljóðbók) passar best við hugmyndina þína — notaðu hana sem vísbendingu þegar þú velur ham í RadioBox.

    Mini-námskeið í Markdown í Heimsbókinni: einfalt pundmerki (#) er aðalhluti (t.d. „# Persónur"), tvöfalt pundmerki (##) er undirhluti, bandstrik (-) búa til lista, og tvöfaldar stjörnur (**texti**) feitletra algjörlega óhagganlegar reglur (t.d. „**Hetjan LJÚGAR ALDREI**"). Fyrir erlenda persónu, bættu við tagi með hreim, t.d. „[Speaker 1: Marek] - hefur franskan hreim". Lykilorðið „hreim" er NAUÐSYNLEGT — forritsvélin greinir það sjálfkrafa og setur rétt hljóðreglur á samtöl viðkomandi persónu.

    Ábending: Mundu að uppfæra Heimsbókina þína reglulega (með því að bæta við nýjum stöðum eða mikilvægum persónum) þegar sagan þróast. Þú getur gert þetta handvirkt eða með hjálp ytri spjallmenna. Því ríkari grunnur, því betri árangur í Leikstjóra!
  krok_7b_manager_regul: |
    SKREF 7b: Stjórnandi Reglna (Ctrl+4) — orðabækur fyrir málfræðinga án Python

    Útgáfa 13.0 kynnir fjórða tólið á stikunni: Stjórnandi Reglna. Þú opnar það með Ctrl+4 eða úr Verkfærameninu. Þetta er sjónrænn skoðari fyrir möppuna dictionaries/, þar sem forritið geymir allar hljóðreglur (hreim), dulmál og stillingar Leikstjóra í YAML skrám (mannlesanlegt snið, einfaldara en JSON).

    Af hverju YAML? Fram að útgáfu 12.0 voru allir hreimar, skapandi stillingar og síur „innbyggðar" í Python kóðann. Að bæta við nýjum hreim þurfti forritara. Í útgáfu 13.0 var þetta allt flutt í .yaml skrár í möppunni dictionaries/ — hver sem er sem getur opnað Notepad getur stillt núverandi hreim („skipta sz fyrir sh fyrir sch") eða bætt við alveg nýjum (sænskur, danskur, rússneskur mállýska).

    Hvað finnur þú í Stjórnanda Reglna:
    - Skjalamappa — fullur listi yfir allar YAML skrár í dictionaries/ með skiptingu eftir grunnmálum (nú fullkomlega útfærð: {lista_kompletnych_jezykow_natywnie}) og flokkum (akcenty/, szyfry/, rezyser/, opowiesci/, gui/). Leiðsögn með örvum eins og í Windows File Explorer, full NVDA stuðningur.
    - Hnappur „{manager.btn_otworz_label}" — opnar valda skrá í sjálfgefnum Notepad kerfisins. Þú breytir, vistar, smellir á „{manager.btn_odswiez_label}" og búið.
    - Hnappur „{manager.btn_duplikuj_label}" — fljótlegasta leiðin til nýs hreims: þú tekur núverandi skrá (t.d. finski.yaml), gefur nýtt nafn (t.d. sænska), Stjórnandi býr til afrit með athugasemd „breyta reitnum merki og lýsing" og opnar hana í ritli.
    - Hnappur „{manager.btn_nowy_label}" — skapalón með vali á tegund (hreim, dulmál, stilling Leikstjóra, nýtt grunnmál, reiknirit dulmál). Fyrir venjuleg tilfelli (hreim, dulmál eins og „skipta um stafi") býr skapalónið til tilbúið YAML sniðmát til að breyta. Fyrir tilfelli sem krefjast forritara (nýtt grunnmál, reiknirit eins og „blanda miðju orða") býr skapalónið til skeyti fyrir AI spjallmenni — þú límir það í ChatGPT, færð tilbúna YAML skrá, vistar í dictionaries/ og búið.

    Hagnýt notkun: Viltu bæta við sænskum hreim? Opnaðu Stjórnanda Reglna, veldu dictionaries/pl/akcenty/finski.yaml, smelltu á „Afrita", nefndu skrána sænska, breyttu reitnum merki í "Sænska (Alva / Oskar)", iso kóða í sv, breyttu nokkrum reglum um skipti og vistaðu. Farðu aftur á Heimaskjáinn, smelltu á „{home.btn_odswiez_label}" og ræstu forritið aftur. Nýi hreimurinn birtist í fjöltyngismeninu (í Leikstjóraham) og — ef þú bætir honum við Persónuheimsbókina („[Marek] - hefur sænskan hreim") — einnig í sjálfvirkri hreimsgreiningu Leikstjórans.

    Hvar á að leita að frekari skjölum um möppuna dictionaries/:
    - Skjal `docs/dictionaries.pl.txt` (aðgengilegt í pakkanum fyrir endanotendur frá Releases flipanum) — stutt, einföld lýsing á hverri undirmöppu, 6 tilbúin dulmál, 8 tilbúnir hreimar og hugmyndir um hvað hægt er að gera sjálfstætt, án Python þekkingar.
    - Skjal `dictionaries/README.md` (aðeins aðgengilegt við klónun úr GitHub geymslu — útgáfupakkar sía .md skrár) — ítarleg tæknileg skjölun á YAML sniðinu með dæmum, lista yfir reiti, reglur um leiðslur, regex. Þetta skjal er ætlað málvísindamönnum sem þekkja grunnatriði forritunar og þróunaraðilum.
  nvda_a11y: |
    Mikilvæg atriði fyrir notendur skjálesara (NVDA)

    1. Tilkynningar um árangur og villur

    Þegar forritið lýkur aðgerð (t.d. vista skrá eða lendir í villu), birtist valmyndargluggi með titli eins og "Árangur", "Viðvörun" eða "Villa". NVDA mun strax tilkynna þennan glugga og lesa innihald hans. Þú þarft ekki að gera neitt — valmyndirnar eru fullkomlega aðgengilegar með lyklaborðinu og fókus lendir sjálfkrafa á "OK" hnappinum. Það eru engar brellur með forskeytið "Viðvörun" — innbyggðir valmyndargluggar wxPython eru studdir beint af lesaranum.

    2. Mikilvæg viðvörun: hljóðlaus bakgrunnsvinnsla

    Eftir að smellt er á hnappa eins og "{rezyser.btn_wyslij_label}" eða "{poliglota.btn_process}", byrjar forritið strax að vinna í bakgrunni. Framvindustika (Gauge) birtist á skjánum, en NVDA LES ekki gildi hennar í rauntíma — skjálesarinn er hljóður á meðan unnið er. Ekki smella á hnappinn aftur. Bíddu þar til valmyndargluggi með niðurstöðu eða villuskilaboðum birtist — NVDA mun tilkynna það sjálfkrafa.

    3. Leiðsögn milli verkfæra

    Færsla milli verkfæra (Leikstjóri, Fjöltyngi, Umbreyting, Reglustjóri) fer fram í einu forritsglugga með fjórum hnöppum á verkfæraslánni eða í gegnum Verkfæri valmyndina (Alt, síðan N). Aðgengilegir lyklaborðsskammtar: Ctrl+0 (Heimasíða), Ctrl+1 (Leikstjóri), Ctrl+2 (Fjöltyngi), Ctrl+3 (Umbreyting), Ctrl+4 (Reglustjóri — nýjung í 13.0). Eftir að verkfæri er skipt, lendir fókus sjálfkrafa á lýsingu nýja einingarsins — NVDA byrjar strax að lesa nýja útsýnið.

    4. Röð flipa og nöfn búnaðar

    Hvert viðmótselement hefur skýrt íslenskt nafn — NVDA mun lesa það þegar það er í fókus. Röð flipa er rökrétt: frá lýsingu verkfæris, í gegnum stillingarsvæði, til aðgerðahnappa. Það eru engin óvænt atriði — lyklaborðsleiðsögn virkar eins og í hverju öðru innfæddu Windows forriti. Öll valmyndir og hnappar eru á íslensku og NVDA mun lesa þau með íslenskum hreim án nokkurra viðbótarstillinga.
  changelog_9: |
    Ważar atriðir fyrir útgáfu 9.0 / Breytingaskrá

    Nýir eiginleikar og breytingar í útgáfu 9

    Bilunarþolið skráning á framvindu þýðingar (BREYTING — viðgerð á alvarlegum galla)
    Í útgáfu 8 var endurupptaka rofinna þýðinga með hljóðlausri, eyðileggjandi gildru: ef notandi fylgdi leiðbeiningum (handvirkt klipping á þýddum hluta) og hélt síðan áfram með þýðingu á restinni, opnaði forritið útgangsskrána í yfirskriftarham — eyðandi óafturkræft og óafvitandi alla greidda framvindu. Í útgáfu 9 hefur allt kerfið verið endurhannað. Hver þýddur blokk er nú þegar skráð í tímabundna skrá (.jsonl) með úthlutuðu vísitölu. Endurupptaka er fullkomlega sjálfvirk — forritið greinir sjálfkrafa skrána og endurheimtir framvindu án nokkurrar íhlutunar notanda. Eftir vel heppnaða lokun er tímabundna skráin sjálfkrafa fjarlægð.

    Tagaviðgerð í Leikstjórahami (NÝTT)
    Ný valkostur hefur verið bætt við Leikstjórahami — Tagaviðgerð. Það sprautar aðeins inn tveggja stafa ISO tungumálakóða sem notandi gefur upp, án þess að nota neinar hljóðreglur eða hreinsun. Neyðartæki ef tilbúin skrá kemur út með röngum eða vantar tungumálamerki.

    Sjálfvirk umbreyting .txt í .html í Þýðingaham (BREYTING)
    Textaskrár (.txt og .md) sem þýddar eru af AI þýðanda eru nú sjálfkrafa vistaðar á .html formi með innbyggðu tungumálamerki. Þannig les NVDA strax skrána með réttum rödd — án nokkurra viðbótar skrefa af hálfu notanda.

    Snjöll skráarheiti í Arkitektinum (BREYTING)
    Arkitekt Ljóðabóka vistar ekki lengur niðurstöðuskrána alltaf undir sama nafni arkitektura_gotowa.docx. Nú kemur nafnið frá inntaksskránni — til dæmis fyrir znieczulica.txt verður niðurstöðuskráin arkitektura_znieczulica.docx. Skráin birtist í sama möppu og upprunalega skráin.

    Eiginleikar haldnir óbreyttir frá útgáfu 8

    Afturhvarf til .txt form fyrir verkefnaskrár (BREYTING)
    Verkefnaskrár og samantektir eru nú vistaðar á .txt formi í stað .md (Markdown). Tilraun með .md form sem sálfræðileg hindrun gegn breytingum reyndist árangurslaus — AI brýtur oft regluna um anti-closure og oft er betra að breyta skrá á staðnum og síðan endurhlaða minni, svo AI, eftir því sem mögulegt er, fái ekki leynilegt leyfi til að brjóta bannið. .txt formið er meira innsæi og læsilegt fyrir alla.

    Regla Klipparans — ný viðvörun
    Í leiðbeiningunum (og í framtíðarútgáfum viðmótsins) hefur verið bætt við skýrri viðvörun sem útskýrir hvað má og hvað má ekki breyta í verkefnaskrám. Notandi hefur fullan rétt til að breyta samtölum og efni, en má alls ekki breyta línustrúktúr (Aðgerð, Sena, Kafli, Prolog, Epilog) — skemmdir á þeim skemma leiðsögn NVDA, skiptingu í ElevenLabs og efnisyfirlit í Word.

    Uppfærð Ábending Arkitekts (BREYTING)
    Ábending til ytri spjallbots (ChatGPT/Claude) hefur verið endurhönnuð. Í stað þess að skila hráu Markdown kóða, skilar AI nú svari í tveimur skýrt aðskildum hlutum: Hluti 1 er Heimsbók lokað í Markdown kóðablokk (auðvelt að afrita án merkja), og Hluti 2 er Ráðlegging um Ham sem venjulegur texti utan bloksins — ráðleggur hvort betra sé að nota Hráa Handritsham eða Hefðbundinn Ljóðabókham. Lýsing á persónumerkjum hefur einnig verið breytt: í stað "hljóðlegra" er nú talað um hreim og tón raddar í merkinu, t.d. [Speaker 1: Nafn] - seplar og franskur hreimur.

    Útskýring á stöðu Anti-Closure tilskipunar (SKJÖL)
    Leiðbeiningarnar innihalda nú heiðarlega útskýringu á því að þrátt fyrir innbyggð bönn Anti-Closure brýtur líkanið ennþá oft þessa reglu, sérstaklega í Ljóðabókham. Í stað þess að fela þennan vanda, setur útgáfa 8 málið skýrt fram og færir ábyrgðina á "handvirkri lokun" aftur til Leikstjórans — þannig er Regla Klipparans sem opinbert vinnuverkfæri og afturhvarf til venjulegs textaforms.

    Eiginleikar haldnir óbreyttir frá útgáfu 7

    Showrunner Prompts — Anti-Closure tilskipun (Leikstjórn — allir hamir)
    Allir þrír hamir Leikstjórnar halda innbyggðum showrunner tilskipunum. Hugstormun virkar eins og handritshöfundur margra þátta sjónvarpsþáttar. Hrá Handritshamur og Ljóðabókhamur hafa bann við að ljúka texta með samantektum, siðferðislegum boðskap og frásagnarlokum — nema þegar notandi beinlínis biður um lokaorð eða epilog.

    Stjórnun Aðgerða og Sena í rauntíma (Leikstjórn — Handritshamur)
    Hrá Handritshamur hefur spjald með hnöppum "Setja inn Aðgerð X" og "Setja inn Sena X". Teljarar uppfærast sjálfkrafa. Hleðsla á núverandi skrá stillir báða teljara á réttan fjölda.

    Hreinsun á sviga leikstjórnarleiðbeiningum (Tungumálamaður — Leikstjórahami)
    Skriptið fjarlægir alla textahluta sem eru í sviga (t.d. "(hvíslað)", "(með innfelldum andardráttum)"). ElevenLabs les aðeins samtöl og frásögn.

    Óendanlegt Minni og Sjálfvirk Samantekt (Leikstjórn — Sögugeymir)
    Þegar minnivísir fer í rauða viðvörunarástand, býr Hugstormun sjálfkrafa til samantekt á sögunni og vistar hana í Langtímaminni. Að smella á "Vista Samantekt (varanlega)" býr til skrá _streszczenie.txt. Eftir að hreinsa minni og hlaða inn samantekt er hægt að halda áfram með söguna án nokkurra lengdarmarka.

    Arkitekt Ljóðabóka
    Tólið styður lykilorð Aðgerð, Kafli, Prolog, Epilog og Upphaf sem fyrirsagnir á fyrsta stigi. Senur breytast í feitletraðan texta. Skriptið hreinsar sjálfkrafa HTML merkja og Markdown merkja áður en það er unnið.

    Snjöll Stjórnun Kafla (Ljóðabókhamur)
    Sérstakt spjald með hnöppum til að setja inn Prolog, Epilog og kaflaskiptingar beint úr viðmótinu. Kaflateljarinn uppfærast sjálfkrafa. Hleðsla á núverandi skrá stillir teljarann á réttan fjölda án handvirkrar talningar.

    Nafngift Kafla (Eftirvinnsla — Ljóðabókhamur)
    Módúll gengur í gegnum kafla úr vistaðri skrá og gefur þeim stutt, bókmenntalegt nafn með því að nota hraðvirkt AI líkan, sem greinir aðeins upphaf hvers kafla.

    Fjarlægðir eiginleikar (óbreyttir frá útgáfu 7)

    Klippikort (Handritshamur) — skipt út fyrir rauntíma stjórnun á Aðgerðum og Senum.
    Aðlögun Handrits í Ljóðabók (Handritshamur) — fjarlægt af fjárhagsástæðum. Vinnuflæðið skapaði þrjú aðskilin kostnað: sköpun handrits, möguleg samantekt við minnisofhleðslu, og loks endursköpun alls sem ljóðabókarprosa. Við mælum með að skrifa beint í Hefðbundnum Ljóðabókham frá upphafi.

    Eiginleikar frá útgáfu 10.0 (haldnir óbreyttir í útgáfum 11.0 og 12.0)

    - Sjálfvirkur stillingaskrárframleiðandi golden_key.env innbyggður beint í aðalviðmót forritsins. Notandi þarf ekki lengur að búa til skrá handvirkt eða hafa áhyggjur af gildru .txt viðbótar — aðeins eitt smell á hnappinn sem er í boði á upphafsskjánum, og kerfið býr til hreina, tilbúna skrá á réttum stað.
    - Algjör fjarlæging úrelts skripts napraw_api.bat, sem er ekki lengur nauðsynlegt. Vandamálið sem þetta skript leysti (röng viðbótarskrá gefin af Notepad) er nú algjörlega útrýmt þökk sé innbyggðum framleiðanda.
    - Fjölbókmennt Heimsbók — hvert verkefni hefur nú sína eigin lore skrá (NÝTT). Áður var ein sameiginleg skrá moje_lore.md, sem var hlaðin við hvert upphaf forritsins — óháð því hvaða verkefni þú ert að vinna að. Frá útgáfu 10 er Heimsbók náið tengd við nafn verkefnisskrárinnar: ef saga þín er skrypty/emilia_heist_audiobook.txt, þá er Heimsbók hennar skrypty/emilia_heist_audiobook.md. Hnappurinn "Vista Heimsbók varanlega" er gráður þar til þú slærð inn skráarnafn — röðin er hér markviss og þvinguð af viðmótinu. Að smella á "Hlaða sögu" hleður sjálfkrafa samsvarandi .md skrá af disknum, ef hún er til. Breytingin hefur einnig hagnýtan skipulagsvídd: þú getur nú sinnt nokkrum verkefnum samtímis, og hvert þeirra mun hafa sínar eigin, einangruðu reglur heimsins og persónulista — án áhættu að Emilia úr bankaráninu endi skyndilega í geimóperu.
  changelog_11: |
    Nýir eiginleikar og breytingar í útgáfu 11.0

    - Nýir hreimsetningar í Tungumálamanninum (NÝTT — fjögur ný evrópsk tungumál). Fjórar nýjar valkostir fyrir hljóðfræðilega "spillingu" texta hafa verið bætt við í Leikstjórastillingu: Enska (Samantha / Mark / Zira / Hazel), Franska (Thomas / Amelie / Julie), Þýska (Stefan / Markus / Katja / Hedda), Spænska (Jorge / Monica / Helena). Hver nýr hreimur sprautar sjálfkrafa inn viðeigandi ISO kóða (en, fr, de, es) í framleitt .html eða .docx skjal — NVDA notar strax réttan rödd fyrir unnin texta.

    - Þverpallur: Stuðningur fyrir macOS og Linux (BREYTING á skjölum). Kaflinn "Fyrsta keyrsla" hefur verið endurskrifaður frá grunni. Nú greinir hann þrjár leiðir: Windows notendur sækja tilbúið ZIP pakka frá Releases flipanum og keyra run.bat; Windows forritarar setja upp umhverfi með setup_dev.bat; macOS og Linux notendur setja upp umhverfi með ./setup_dev.sh og keyra ./run.sh. (Athugið: í útgáfum 11.x–13.0 hétu sömu skriftur öðruvísi — `Uruchom_Rezysera.bat`, `skonfiguruj_dev.bat`, `skonfiguruj_dev.sh`, `uruchom_rezysera.sh` — þau voru endurnefnd í 13.1 í enskum samsvörunum, því erlendir forritarar sem klónaðu geymsluna kvörtuðu yfir því að pólsku skráarnöfnin gerðu þeim erfitt fyrir að slá inn skipanir í skelinni.)

    - Mappa runtime/ — útskýring á stöðu (SKJÖL). Kaflinn "Fyrsta keyrsla" inniheldur nú skýra útskýringu á því að mappan runtime/ (Python umhverfi fyrir ZIP pakka) er aðeins dreift í tilbúnum pökkum fyrir Windows frá Releases flipanum. Í Git geymslunni er þessi mappa ekki til og ætti ekki að vera.

    - Uppfærsla á nöfnum talgervla í valmynd Tungumálamannsins (BREYTING). Nöfn radda í selectbox valmyndinni fyrir núverandi tungumál hafa verið uppfærð: Ítalska hefur nú einnig Luca (Vocalizer), Finnska hefur nú einnig Mikko (Vocalizer). Pólska hefur haldið nafninu án kommustafa (Ewa í stað Ewa með kommustaf) fyrir betri samhæfni.

    Eiginleikar haldnir óbreyttir frá útgáfu 10

    - Sjálfvirkur lykilskráargjafi golden_key.env innbyggður í viðmótið.
    - Fjölbókmenntaverk Heimsbók (hver verkefni hefur sína eigin .md skrá með heimi reglum).
    - Bilunarþolið þýðingarskráningarferli (skráning í .jsonl).
    - Merkjaviðgerð í Leikstjórastillingu (innsprautun ISO kóða).
  changelog_12: |
    Nýir eiginleikar og breytingar í útgáfu 12.0 — Release Candidate

    - Algjör endurhönnun notendaviðmóts (ARKITEKTÓNÍSK BREYTING). Forritið er ekki lengur vefverkfæri sem keyrir í vafra. Allt viðmótið hefur verið endurskrifað frá grunni sem innfæddur skjáborðsforrit byggt á wxPython umgjörðinni. Enginn staðbundinn þjónn, enginn vafri, ekkert flugstöðvarglugga sem keyrir í bakgrunni — það er eitt, venjulegt forritsglugga. Innkomupunkturinn er main.py.

    - Leiðsögustika með flýtilyklum (NÝTT). Verkfærin eru skipt um með þremur hnöppum á stikunni (Leikstjóri, Fjöltyngdur, Umbreytingar) eða í gegnum Verkfæri valmyndina. Aðgengilegir flýtilyklar: Ctrl+0 (Heimasíða með Kerfisskoðun), Ctrl+1 (Leikstjóri), Ctrl+2 (Fjöltyngdur), Ctrl+3 (Umbreytingar). Virka verkfærið er sjónrænt dregið fram með feitletruðum hnappi.

    - Full hagræðing fyrir skjálesara frá grunni (NVDA, VoiceOver). Hver víðari hefur fengið skýrt íslenskt aðgengisnafn. Fókus eftir að verkfæri er skipt lendir sjálfkrafa á lýsingu eininganna — NVDA byrjar strax að lesa nýja útsýnið. wx.MessageBox samræður eru innfæddar tilkynntar af skjálesara án nokkurra brella. Tab-röðin er rökrétt og samræmd í öllu viðmótinu. Sögulegar takmarkanir Streamlit og React umgjörðarinnar hverfa.

    - Engin eldveggsstilling (BREYTING). Brottnám staðbundins vefþjóns þýðir að Windows Firewall sýnir ekki lengur glugga með spurningu um leyfi fyrir netaðgang við fyrstu ræsingu. Forritið einfaldlega ræsir sig.

    - Innfæddar skráarvalsgluggar (NÝTT). Fjöltyngdur og Umbreytingar einingar hafa nú hnappinn "Skoða...", sem opnar kerfisbundinn skráarvalsglugga í stað þess að þurfa að slá inn slóðina handvirkt.

    - Verndun sköpunarhamar (NÝTT). Í Leikstjóra er ekki lengur hægt að skipta um vinnuham fyrir slysni (t.d. úr Hljóðbók í Handrit) þegar minni er upptekið — viðmótið lokar á að skipta yfir í annan skráningarham þar til saga eða útdráttur hefur verið hreinsaður. Hugstormunarhamur er alltaf aðgengilegur.

    - Harðendurræsingarhnappur í Leikstjóra (NÝTT). Nýr hnappur "Loka Verkefni (Harðendurræsing)" gerir þér kleift að hreinsa allt verkefnið með einum smelli: sögu, útdrátt, Heimabók og alla teljara — án þess að þurfa að núllstilla hvert svið handvirkt.

    - Sjálfvirk innhleðsla sköpunarhamar (NÝTT). Við innhleðslu verkefnis endurheimtir forritið sjálfkrafa síðast notaða vinnuham (Handrit eða Hljóðbók) úr metaskrá sem forritið stjórnar. Þannig stillir RadioBox sig sjálfkrafa þegar verkefni er opnað aftur — þú þarft ekki að muna í hvaða ham þú varst að vinna.

    Eiginleikar haldnir óbreyttir frá útgáfu 11.0

    - Hljóðblæbrigði í Fjöltyngdum (Enska, Franska, Þýska, Spænska, Ítalska, Finnska, Pólska).
    - Sjálfvirkur gulllykilskrá (.env) rafall innbyggður í upphafsskjá.
    - Fjölbóka Heimabók (hvert verkefni hefur sína eigin .md skrá).
    - Bilanaþolið þýðingaraðlögunarkerfi (vistun í .jsonl).
    - Merkjalagfæring í Leikstjóra (ISO kóða innspýting).
    - Allir AI eiginleikar: Hugstormun, Handrit, Hljóðbók, Söguþráður, Óendanlegt Minni, Titlagjöf.
  changelog_13: |
    Nýir eiginleikar og breytingar í útgáfu 13.0 — Útgáfukandídat

    - Endurskipulagning í YAML — hreimsetningar, dulmál og stillingar Leikstjórans í textaskrám (ARKITEKTÓNÍSK BREYTING, sú stærsta síðan flutningur yfir í wxPython). Fram að útgáfu 12.0 voru allar hljóðreglur (hreimsetningar) og skapandi stillingar Leikstjórans (Stormur, Handrit, Hljóðbók, eftirvinnsla titla) „innbyggðar“ í Python kóðann sem fastar, föll og stífir strengir í skipunum, og heil flokkur dulmála/textaleikja var einfaldlega ekki til — þau eru kynnt með endurskipulagningu 13.0. Í útgáfu 13.0 er allt þetta í .yaml skrám í nýrri möppu `dictionaries/` — vélin (`core_poliglota.py`, `core_rezyser.py`, `przepisy_rezysera.py`) hleður þeim sjálfvirkt við ræsingu. Hagnýt áhrif: að bæta við nýjum hreim, nýju dulmáli byggðu á breytingum eða breyta hljómi kerfisskipunar fyrir einhverja stillingu Leikstjórans krefst ekki þekkingar á Python — aðeins textaritli. Stutt lýsing fyrir endanotendur er í `docs/dictionaries.pl.txt` (fylgir með útgáfupökkum); full tæknileg skjölun á sniði — í `dictionaries/README.md` (aðeins í Git geymslu, því útgáfupakkar sía .md skrár).

    - Reglustjóri — fjórða tólið á stikunni (NÝTT, Ctrl+4). Sjónrænn könnuður fyrir `dictionaries/` möppuna með YAML skráatré (innfædd wx.TreeCtrl, fullur stuðningur NVDA) og sett af aðgerðum: „Opna í textaritli", „Ný skrá með reglum…" (töframaður með val um tegund: hreim, dulmál, stilling, nýtt tungumál), „Afrita valda skrá", „Eyða skrá", „Endurnýja tré". Fyrir tilfelli sem fara út fyrir venjulegar breytingar (nýtt grunnmál, reiknirit dulmál) býr töframaðurinn til tilbúna skipun fyrir AI spjallmenni — full útskýring í nýju SKREFI 7b.

    - Skipun Arkitektsins beint í Leikstjórans pallborði (A11y BREYTING). Hingað til var skipun fyrir ytri spjallmenni til að búa til Heimsbókina aðeins í þessari leiðbeiningu — notandi þurfti að afrita hana úr textaskrá (sem getur verið vandamál á skjálesurum með íslenskum stöfum og gæsalöppum). Í útgáfu 13.0 hefur Leikstjórans pallborð nýjan hnapp „📖 Skipun Arkitekts fyrir AI…" (rétt undir „Vista Heimsbók varanlega"), sem opnar innfædda glugga með fullum texta skipunar í READONLY reit og sérstökum hnappi „Afrita í klippiborð". A11y sniðið er eins og fyrir niðurstöðugluggann í Reglustjórans töframanni — NVDA les strax allan gluggainnihaldið án viðbótarstillinga. Full lýsing í uppfærðu SKREFI 7.

    - Rússneskur hreimur í Tungumálamanninum (NÝTT — áttunda evrópska tungumálið í Leikstjórans stillingavalmynd). Í fellivalmyndinni „Leikstjórans stillingar / Hreimsetningar" bætist við valkosturinn „Rússneska (t.d. Milena / Irina / Yuri / Pavel)". Ólíkt öðrum hreimum, sem aðeins „spilla" íslenskum texta á latnesku stafi (t.d. „sj" → „sh", „v" → „v"), framkvæmir rússneski hreimurinn fulla umritun íslensks texta yfir á kyrillísku — þannig að rússneskumælandi TTS raddir (Vocalizer Milena, OneCore Irina / Pavel / Yuri, eSpeak „ru") hafa eitthvað til að „bera fram" orðin. Kortlagningin hefur verið bætt með jótun sérhljóða („ja" → „я", „je" → „е", „jo" → „ё", „ju" → „ю"), íslenskum mýkingum si/ci/ni/zi + sérhljóða (t.d. „frænka" → „цёця"), sem og sérstökum rússneskum tvíhljóðum: „ść" / „szcz" → „щ", „sz" → „ш", „cz" → „ч", „rz" → „ж", „ch" → „х".

      Hljóðskýrslun: Hreimurinn er ekki rússnesk fræðileg umritun (ISO 9, GOST, BGN/PCGN). Markmiðið er eingöngu að gera íslenskan texta hljóðlega líkan rússneskum — fyrir talgervil, ekki fyrir alvarlega umritun eiginnafna. Fyrir það verk notaðu sérstök málvísindatól.

      Tungumálakóði fyrir niðurstöðuskrá: „ru" (ISO 639-1). NVDA með valkostinn „Skipta sjálfkrafa um tungumál þegar stutt" virkt skiptir strax yfir í rússneska rödd.

    - Athugasemd um „ź": Í rússnesku er engin nákvæm samsvörun fyrir íslenska „ź", svo þessi stafur er venjulega breytt í „ж" — líkt og „ż". Sumir norður-rússneskir og hvítrússneskir mállýskur bera „ź" nær „зь", en frá sjónarhóli talgervils er munurinn óverulegur. Ef málfræðingur telur að hann kjósi „зь", getur hann sjálfur skipt út þessari einu reglu í skránni `dictionaries/pl/akcenty/rosyjski.yaml` — vélin hleður YAML skrár sjálfvirkt, svo það krefst ekki endursamsetningar forritsins.

    - Útvíkkuð leiðarstika og Verkfæri valmynd (BREYTING). Stikan hefur nú fjórða hnappinn — Reglustjóri — og valmyndin „Verkfæri" styður nýja flýtileiðina Ctrl+4. Fyrri flýtileiðir (Ctrl+0 Heim, Ctrl+1 Leikstjóri, Ctrl+2 Tungumálamaður, Ctrl+3 Breytir) haldast óbreyttar.

    - Hnappur „Endurnýja hreimsetningar Leikstjórans úr YAML" á Heimssíðu (NÝTT). Eftir að nýr hreimur hefur verið bætt við af Reglustjóra (eða handvirkri breytingu á YAML skrá) mun smella á þennan hnapp endurhlaða hreim_* umbúðir í Tungumálamanninum og Leikstjórans vél, svo nýi hreimurinn sé sýnilegur í valmyndinni og í sjálfvirkri greiningu hreima byggt á persónumerkjum í Heimsbókinni. Tungumálamaður greinir YAML skrár sjálfvirkt (án endurnýjunar), en Leikstjórinn þarf að endurbyggja umbúðir — venjulega þarf að endurræsa forritið eftir endurnýjun.

    Eiginleikar haldnir óbreyttir frá útgáfu 12.0

    - Innfæddur skjáborðsviðmót byggt á wxPython (án vafra, án staðbundins netþjóns).
    - Leiðarstika með flýtileiðum (nú Ctrl+0/1/2/3/4 — bætt við Ctrl+4 fyrir Reglustjóra).
    - Full hagræðing fyrir skjálesara (NVDA, VoiceOver) — íslenskir aðgengisnöfn, rétt röð á tökkum.
    - Verndun skapandi stillingar gegn óvart breytingu á meðan á vinnu stendur.
    - Harður Endurstilling verkefnis með einum smelli í Leikstjóra.
    - Sjálfvirk hleðsla skapandi stillingar úr verkefnismetaskrá.
    - Allir hreimar frá fyrri útgáfum (Enska, Franska, Þýska, Spænska, Ítalska, Finnska, Pólska) og Merkjaleiðréttari.
    - Fullir AI eiginleikar: Hugstormur, Handrit, Hljóðbók, Söguuppsöfnuður, Óendanlegt minni, Titlagjöf.
  krok_7b_manager_regul_kolejnosc_zamian: |
    SKREF 7b (viðbót): Röð reglna `zamiany:` skiptir máli

    Skrár í `dictionaries/<kod>/akcenty/*.yaml` innihalda lista yfir reglur `zamiany:` — pör `wzor → zamiana`, sem vélin framkvæmir Í RÖÐ. Hver næsta regla vinnur á útkomu þeirrar fyrri. Þetta gerir kleift að byggja leiðslur eins og „brjóta tvíhljóðið `szcz` niður í `shch`, og svo skipta `ch` út fyrir `h`", en það opnar einnig klassíska gildru fyrir höfund tungumálapakkans.

    Gildra „röðunarhrings". Segjum að fyrir spænska hreiminn sem á að líkja eftir pólsku „ñ" í framburði Diego (Loquendo), bætir höfundur við tveimur reglum:
    1. `ñ → nj` (til að pólsku „ñ" hljómi eins og mjúkt „nj")
    2. `j → x` (til að pólsku „j" hljómi eins og spænska „j" — hljóðfræðilega /x/)

    Eftir að keyra forritið kemur í ljós að orð með „ñ" eru borin fram sem „nx", ekki „nj". Hvers vegna? Því að þegar fyrsta reglan skiptir „ñ" út fyrir „nj", er nýja „j" strax gripið af annarri reglunni og skipt út fyrir „x". Útkoma: í stað fyrirhugaðs „ñ → nj", fáum við „ñ → nx".

    Röðunarregla (alhliða). Þegar ein regla kynnir tákn sem önnur regla hefur sem mynstur, SKIPTIR RÖÐIN MÁLI. Öruggur leiðarvísir: FYRST skaltu skipta TARGET (tákn sem er notað síðar sem `wzor` í annarri reglu) út fyrir eitthvað öruggt, SÍÐAN kynna SOURCE (tákn sem á að brotna niður í TARGET). Fyrir spænska dæmið rétt: fyrst `j → x`, svo `ñ → nj`. Útkoma: „ñ" gefur „nj" (seinni „j" verður ekki gripið, því reglan `j → x` var beitt fyrr, þegar „nj" var ekki til).

    Hvernig á að prófa. Eftir að hafa breytt röð reglna í hreimsskrá, keyrðu setningu sem inniheldur BÆÐI stafi í gegnum Leikstjórastillingu. Fyrir dæmi ES: „Niño de paja juega" → útkoman verður að hafa bæði hreim ñ („ñ → nj") og hreim j („j → x"), sem er eitthvað eins og „Ninjo de paxa xuega". Ef þú sérð „ninxo" í stað „ninjo" — er röðin röng.

    Staðfesting í vélinni (opt-in fyrir höfunda pakka). Forritið hefur innbyggða heuristík sem greinir mögulegar lykkjur, en hún er sjálfgefið óvirk — því margar leiðslur líta út eins og lykkja, þó þær séu viljandi (klassíska „szcz → shch" + „ch → h"). Til að virkja hana: stilltu umhverfisbreytuna `REZYSER_VALIDATE_ZAMIANY=1` og keyrðu forritið úr skel. Vélin mun prenta eina samantektarlínu WARN fyrir hverja hreimsskrá með fyrstu þremur mögulegum lykkjum og fjölda hinna. Athugaðu niðurstöðuna á prófunarsetningu — ef áhrifin eru fyrirhuguð, hunsaðu WARN.

    Hnappar til að færa reglur í Reglustjóra GUI (drag-and-drop, „Upp / Niður") er aðskilin virkni sem er áætluð fyrir seinni útgáfutíma — krefst endurhönnunar á Stjóranum (núna sendir hann skráarbreytingar til ytri Kerfisritils, og hefur ekki eigin regluyfirlit). Þangað til það er innleitt: breyttu YAML skránni handvirkt, færðu línur í `zamiany:` hlutanum, notaðu staðfestingar ENV-breytu og prófaðu á prófunarsetningum.
