id: manual
tresc:
  naglowek: |
    # Reżyser Audio GPT — Heildarleiðarvísir (Útgáfa {app.wersja})

    Velkomin í Hybrid Recording Studio! Þessi verkfærakista gerir þér kleift að skrifa, skipuleggja, stilla og þýða handrit fyrir hljóðleiki og hljóðbækur sjálfvirkt. Hún hefur verið fínstillt til að vinna með faglegum talgervlum og staðbundnum skjálestrum (NVDA).

    Verkfærakistan samanstendur af aðalstúdíóinu (Leikstjórn), þýðinga- og hreimaverkfærinu (Tungumálamaður), skráarbyggingarverkfærinu (Hljóðbókararkitekt), Reglustjóra (frá útgáfu 13.0 — án Python geturðu bætt við nýjum hreim, dulmáli eða sköpunarham, sjá SKREF 7b hér að neðan) og — frá útgáfu 15.0 — Sögueiningunni (gervigreindarframleiddur gagnvirkur skáldskapur í annarri persónu, lesin af TTS eða skjálesara, lýst í sérstöku handriti tales.is.html). Öll fimm verkfærin eru aðgengileg í einum forritsglugga, skipt á milli með hnöppum á stikunni eða með lyklaborðssamsetningum Ctrl+1..Ctrl+5.
  krok_1_pierwsze_uruchomienie: |
    ## SKREF 1: Fyrsta gangsetning (Cross-Platform)

    Sæktu nýjustu uppsetningarskrána frá Releases flipanum á GitHub (skrá `Rezyser_Audio_v<numer>_Installer.exe`) og keyrðu hana með því að tvísmella. Uppsetningarforritið mun bjóða upp á sjálfgefna staðsetningu fyrir uppsetningu — Programs möppuna í staðbundnu skráasafni á reikningnum þínum — og krefst ekki stjórnandaaðgangs. Þú getur einnig valið þína eigin slóð með „Browse" hnappnum — uppsetningarforritið man hana og notar hana sjálft við síðari uppfærslur, án þess að spyrja. Eftir uppsetningu skaltu ræsa forritið með tákninu á skjáborðinu eða úr Start valmyndinni. Eftir smá stund birtist aðalgluggi forritsins — {app.nazwa}. Frá útgáfu 17.0 er forritið fryst sem innfædd keyrsluskrá í gluggaham, svo enginn flöktandi terminalgluggi birtist lengur og það ræsir hraðar en áður. Engin vafri, enginn bakgrunnsþjónn. Þegar þú ert búinn að vinna, lokaðu bara glugganum.

    Allt forritið, þar á meðal Python vél, verkefni og API lykill, er í einni möppu undir uppsetningarslóðinni — alla möppuna má flytja á USB, í skýið eða á aðra tölvu (ítarleg leiðbeining í kaflanum „Flytja verkefni og API lykil" hér að neðan).

    **Mikilvægt:** Möppan runtime/ inni í uppsetningarmöppunni er PyInstaller pakki (frá útgáfu 17.0) — inniheldur einangraðan Python túlka og bókasöfn, tilbúin til notkunar án sérstakrar kerfisuppsetningar; hún gegnir einnig hlutverki íláts fyrir falin verkefnametadata. Ef þú klónar geymslu (þróunarslóð), er þessi mappa ekki til staðar og ætti ekki að vera — þú notar þá sýndarumhverfi venv eins og lýst er í kaflanum fyrir forritara hér að neðan.

    ### Fyrir Forritara (Windows — Git geymsla)

    1. Klónaðu geymsluna á diskinn þinn.
    2. Keyrðu skrána setup_dev.bat. Skjalið mun sjálfkrafa búa til sýndar Python umhverfi (venv) og setja upp allar nauðsynlegar háðar frá skránni requirements.txt.
    3. Keyrðu forritið með skipuninni python main.py eða með skránni run_dev.bat — skjalið mun sjálfkrafa greina venv möppuna og ræsa forritið.

    ### Fyrir Forritara og venjulega notendur (macOS / Linux)

    1. Klónaðu geymsluna á diskinn þinn.
    2. Opnaðu skel í verkefnamöppunni og gefðu skrám heimild til að keyra: chmod +x *.sh
    3. Keyrðu uppsetningarskrána: ./setup_dev.sh — skjalið mun búa til venv umhverfi og setja upp háðar.
    4. Keyrðu forritið: python main.py eða ./run.sh

    Hvað þú sérð eftir gangsetningu: Eftir að forritið hefur verið ræst opnast gluggi með upphafsskjá. Þar finnur þú stutta lýsingu á tiltækum verkfærum og kafla „{home.heading_system_check}". Ef API lykillinn er ekki enn stilltur, sérðu rauða tilkynningu sem segir að AI-byggðar einingar (Leikstjórn, Þýðandi) muni ekki virka — ókeypis staðbundnar aðgerðir (hreim, Arkitekt) eru þó virkar strax. Stillingu API-lykilsins er lýst í næsta skrefi.

    ### Sjálfvirkar uppfærslur

    Forritið athugar við ræsingu hvort nýrri útgáfa sé tiltæk á GitHub — athugunin fer fram í bakgrunni og lokar ekki viðmótinu.

    Ef þú settir upp forritið með tilbúinni uppsetningarskrá (.exe): þegar nýrri útgáfa er greind birtist gluggi með spurningu hvort þú viljir sækja hana. Eftir staðfestingu mun framvindustika hefjast og þegar niðurhalinu lýkur mun forritið loka sjálfkrafa og nýja uppsetningarskráin mun keyra sjálfkrafa. Þú þarft ekki að hafa áhyggjur af uppsetningarslóðinni: uppsetningarforritið þekkir fyrri uppsetningu og setur upp í sömu möppu og áður — leiðsagnarforritið sýnir þá alls ekki síðuna með markmöppunni (það á líka við um staðsetningu sem þú valdir handvirkt með „Browse"). Uppfærslan skrifar yfir skrár forritsvélarinnar og allan reglupakkann (möppuna dictionaries/) — verkefni þín (möppur skrypty/, opowiesci/) og API lykill (golden_key.env) verða óbreytt. MIKILVÆGT: ef þú breyttir skrám í pakkanum með Reglustjóra (t.d. breytingar á hreim í `dictionaries/pl/akcenty/wloski.yaml`), verða þessar breytingar YFIRSKRIFAÐAR við uppfærslu — áður en þú staðfestir uppfærsluna skaltu taka afrit af möppunni `dictionaries/` samkvæmt ferlinu í kaflanum „Flytja verkefni og API lykil" hér að neðan (það nægir að afrita möppuna `dictionaries/` á USB), og eftir uppfærsluna skaltu hlaða henni aftur yfir nýrri skrár. Alveg nýjar reglur sem þú bjóst til frá grunni og eru ekki í pakkanum (t.d. eigin viðbótar grunnmál eða eigin dulmál), verða ósnertar sjálfkrafa — uppsetningarskráin fjarlægir ekki skrár utan pakkans. Frá útgáfu 15.2.8 sýnir sjálfvirka uppfærslusamræðan þessa viðvörun beint í textanum og inniheldur hnappinn „Opna dictionaries möppu", sem opnar File Explorer á réttum stað með einum smelli — það nægir að smella á hann áður en uppfærslan er staðfest til að taka þægilega afrit og síðan fara aftur í samræðuna og smella á „Sækja og setja upp".

    Uppsetningarslóðin kemur hins vegar að gagni þegar skrár eru afritaðar handvirkt (öryggisafrit, flutningur á aðra tölvu — sjá kaflann hér að neðan). Ef þú manst hana ekki, eru tvær fljótlegar leiðir til að endurheimta hana. Windows 11: í samhengisvalmynd skjáborðstákns skaltu velja „Opna skráarstaðsetningu" (ef valkosturinn er ekki sýnilegur í nýju einfaldaðri samhengisvalmyndinni, veldu fyrst „Sýna fleiri valkosti" eða ýttu á Shift+F10 tvisvar til að opna strax fulla valmyndina), farðu upp um eitt stig með Backspace takkanum, veldu möppuna með forritinu og ýttu á Ctrl+Shift+C (eða veldu „Afrita sem slóð" úr samhengisvalmyndinni) — full slóð fer í klippiborðið í gæsalöppum (þegar þú límir í uppsetningarskrána skaltu muna að fjarlægja sjálfar gæsalappirnar). Eldri útgáfur af Windows (7/8/10): hægri-smelltu á táknið og veldu „Eiginleikar"; í flipanum „Flýtileið" í reitnum „Mark" sérðu fulla slóðina að keyrsluskránni (`.exe` í útgáfu 15.2.5+ eða `run.bat` í eldri útgáfum) — afritaðu hana og fjarlægðu endanlegt skráarnafn, þá verður eftir bara uppsetningarslóðin.

    Athugið við uppfærslu frá eldri útgáfum (v15.2.4 eða eldri, þegar forritið var keyrt með `run.bat` úr Portable ZIP pakkanum): núverandi skjáborðstákn gæti bent á `run.bat` í gömlu staðsetningunni, sem er ekki lengur til eftir uppfærslu í v15.2.5+ — útgáfur 15.2.5+ nota sjálfstæða `.exe` skrá sem uppsetningarskráin býr til. Ef táknið hættir að virka eftir uppfærslu, fjarlægðu það handvirkt og leyfðu uppsetningarskránni að búa til nýtt við enduruppsetningu.

    Ef þú notar Git geymslu (forritarar og macOS/Linux notendur): í stað tillögu um niðurhal sérðu upplýsingar um nýja útgáfu með beinni tengingu á útgáfusíðuna á GitHub. Sæktu þaðan „Source code" skjalasafnið eða uppfærðu geymsluna með skipuninni git pull.

    ### Flytja verkefni og API lykil (migrering)

    Ef þú vilt flytja verkefnin þín, API lykil og staðbundnar stillingar á aðra tölvu (eða endurheimta allt eftir að Windows hefur verið endursett), er ekki nauðsynlegt að afrita einstaka skrár handvirkt — öll forritsmappan er sjálfbær.

    1. Gakktu úr skugga um að forritið sé ALVEG lokað. Ef þú sérð forritstáknið í kerfisbakkanum (við hliðina á klukkunni, hægra megin á verkefnastikunni), hægri-smelltu á það og veldu „Loka". Opnar skrár hindra afritun.
    2. Finndu {app.nazwa} skjáborðstáknið. Hægri-smelltu á það (eða notaðu Umsóknarhnappinn eða Shift+F10 við NVDA leiðsögn) og veldu valkostinn „Opna skráarstaðsetningu". ATH á Windows 11: í nýju einfaldaðri samhengisvalmyndinni gæti þessi valkostur verið falinn — veldu fyrst „Sýna fleiri valkosti" (eða ýttu á Shift+F10 tvisvar til að opna strax fulla valmyndina með valkostinum).
    3. Windows Explorer gluggi opnast í uppsetningarmöppunni. Ýttu á Backspace takkann (einfaldasta leiðin, virkar alltaf) eða smelltu á „Upp" örina á tækjastikunni til að fara upp um eitt stig — þar sérðu fulla möppuna með forritinu. Athugið: Alt+Upp ör virkar aðeins þegar fókusinn er á skráarlistanum — ef Explorer opnast með fókus á slóðastikunni (algengt), þá gerir Alt+Upp ör ekkert, notaðu þá Backspace.
    4. Afritaðu alla þessa möppu á USB, skýjadrif (OneDrive, Google Drive, Dropbox) eða ytri disk. Möppan inniheldur allt sem þarf til að endurheimta vinnustöðu:
       - Verkefnin þín (möppan skrypty/ — .txt skrár af frásögnum, .md Heimsbók og útkomuskrár eftirvinnslutækjanna: minni, kaflatitlar, útgáfukort; möppan opowiesci/ — gagnvirkir leikir).
       - API lykill (skráin golden_key.env í aðalmöppunni).
       - Þínar eigin hljóðreglur, hreim, dulmál, ef þú breyttir einhverju í Reglustjóra (möppan `dictionaries/<tungumálakóði>/`, t.d. dictionaries/pl/akcenty/wloski.yaml).
       - Forritsstillingar og val á skapandi ham (möppan runtime/skrypty/, .mode skrár).
       - Einangrað Python umhverfi (möppan runtime/), svo þú þarft ekki að setja neitt upp á nýju tölvunni.
    5. Á nýju tölvunni: sæktu nýjustu uppsetningarskrána frá Releases flipanum á GitHub og settu upp forritið á hefðbundinn hátt. Keyrðu forritið einu sinni til að búa til tóma skráarskipan. Lokaðu forritinu. Afritaðu síðan áður vistaða möppuna á uppsetningarstaðinn og skrifaðu yfir skrárnar — eða veldu sértækt aðeins þær möppur sem þú hefur áhuga á (skrypty/, opowiesci/, golden_key.env) og límdu þær á réttan stað í nýju uppsetningunni.

    **Ábending fyrir NVDA notendur:** samhengisvalmyndin „Opna skráarstaðsetningu" sem er kölluð fram með Umsóknarhnappinum er fullkomlega aðgengileg — NVDA les hvert atriði á íslensku. Eftir að Explorer hefur verið opnað í markmöppunni, notaðu Backspace takkann til að fara upp um eitt stig (virkar alltaf, óháð því hvort fókusinn er á skráarlistanum eða slóðastikunni), og síðan Ctrl+A til að velja allt og Ctrl+C til að afrita.

    **Ábending:** valkosturinn „Opna skráarstaðsetningu" er innfætt nafn fyrir íslenska útgáfu Windows. Í ensku kerfi heitir hann „Open file location", í öðrum tungumálaútgáfum — á sama hátt á staðbundnu tungumáli stýrikerfisins.
  krok_2_klucz_api: |
    ## SKREF 2: Að tengja API (ráðlagt Anthropic / Claude lykill)

    Ráðlagður og sjálfgefinn AI-veitandi er Anthropic (Claude) — allir kvaðningar forritsins eru fínstilltar fyrir hann, þannig að hann gefur hæstu gæði frásagnar og bestu fylgni við reglur heimsins. Í þessum (ráðlögðum) valkosti nægir EINN API-lykill í skránni golden_key.env:

    •  Anthropic-lykill (Claude) — knýr ALLA AI-vélina: frásögn Leikstjórans (hljóðbók, lesið leikhús, hugsunarflug), Söguham, Tungumálamann (þýðanda) og titlagjöf á kafla og tungumálagreiningu efnis. Byrjar á sk-ant-.

    Ef þú uppfærir úr eldri útgáfu: gamli OpenAI-lykillinn er ekki lengur nauðsynlegur fyrir sjálfgefna valkostinn — þú getur skilið eftir eða eytt línu hans í golden_key.env, forritið hunsar hana (nema þú sért meðvitað að stilla annan veitanda — sjá SKREF 2B hér að neðan).

    Hvernig á að fá Anthropic-lykil:
    1. Stofnaðu reikning á console.anthropic.com og bættu við fjármagni (flipinn Billing / Plans).
    2. Búðu til lykil í hlutanum API Keys (byrjar á sk-ant-). Afritaðu hann strax — hann er stundum aðeins sýndur einu sinni.

    Hvernig á að slá lykilinn inn í forritið:
    3. Á upphafsskjá forritsins, smelltu á hnappinn "{home.btn_generate}". Kerfið mun sjálfkrafa búa til hreina stillingarskrá á réttan stað og opna Notepad með sniðmáti tilbúið til breytinga.
    4. Í opnu skránni muntu sjá línuna: ANTHROPIC_API_KEY=PASTE_YOUR_KEY_HERE. Fjarlægðu staðgengistextann og límdu lykilinn þinn beint á eftir jafnaðarmerkinu (án bila og án gæsalappa). Vistaðu skrána og ræstu forritið aftur.

    **Ábending:** Eftir endurræsingu mun forritið athuga skrána og í hlutanum "{home.heading_system_check}" sýna stöðu lykilsins. Hún verður að vera græn til að allar AI-einingar séu tilbúnar til notkunar. Ef lykillinn vantar eða er rangur, mun forritið gefa skýrt til kynna og leyfa þér að opna textaritil til að laga villuna fljótt.
  krok_3_glowne_studio: |
    ## SKREF 3: Aðal Leikstjóraverkstæðið

    Þetta er stjórnmiðstöð þín fyrir uppfinning sagna og skrifun handrita. Farðu þangað með því að smella á hnappinn „{main.btn.rezyser}" á hnappaslánni eða velja Verkfæri → {main.menu.rezyser} úr valmyndinni (flýtilykill: Ctrl+1).



    ### Mikilvægt: Skráarsnið verkefna — aftur í .txt

    Í útgáfu 7 vistust verkefnaskrár á Markdown-sniði (.md), t.d. skrypty/znieczulica.md. Þetta var meðvituð tilraun — .md-sniðið átti að vera sálfræðileg hindrun fyrir ótæknilægar manneskjur, til að letja þær frá því að opna og breyta skránni handvirkt í Notepad (og skemma þannig uppbyggingarhausa fyrir slysni).

    Tilraunin tókst ekki. Gervigreind brýtur oft með dónalegum hætti eitt af grundvallarbönnunum (meira um það bráðum). Af þeim sökum var í útgáfu 8 snúið aftur í einfaldar .txt-skrár — þær eru innsæilegri og læsilegri fyrir alla. Til dæmis mun verkefni að nafni „znieczulica" nú vistast sem skrypty/znieczulica.txt og samantekt þess sem skrypty/znieczulica_streszczenie.txt. Þetta gerir öllum auðveldara að gera leikstjóralegar leiðréttingar eða skera í textann jafnóðum.


    ### ⚠️ Mikilvæg regla klippistjórans (lestu áður en þú byrjar!)

    Öll þín mynduð handrit og bækur vistast í venjulegum textaskrám (.txt) sem þú getur auðveldlega opnað í Notepad.

    Sem leikstjóri hefur þú FULLAN RÉTT (og jafnvel skyldu) til að breyta þessari skrá! Ef gervigreindin fer of langt og leysir til dæmis vandamál persónanna sjálf í lok myndaðs kafla, opnaðu skrána, eyddu síðustu línum og láttu textann hanga eftir á mest spennandi augnablikinu, smelltu síðan á „{rezyser.btn_przeladuj_label}" til að samstilla minni líkansins við leiðrétta skrána, og „{rezyser.btn_wyslij_label}" til að halda áfram.

    #### 🔴 Hins vegar — hvað má þú ekki snerta

    Breyttu aldrei, eyddu aldrei og umritaðu aldrei línum sem innihalda uppbyggingu (t.d. Þáttur 1, Atriði 2, Kafli 1, Formáli). Ef þú skemmdir þessa hausa:
    1. Saga þín mun brotna í skjálesara (NVDA).
    2. Hljóðbókararkitektinn, og þar með einnig ElevenLabs Studio, mun ekki geta skipt bókinni þinni rétt í hluta til lestrar.
    3. Innbyggður umbreytir forritsins mun ekki búa til rétt efnisyfirlit í Word-skrá né á tímalínu í ElevenLabs.

    Breyttu samræðum, skertu aðgerðina, en láttu uppbygginguna vera í friði!


    ### Hvernig á að nota Leikstjóraverkstæðið?

    - Heimsbók (hliðarslá til vinstri): Hér skrifar þú reglur alheimsins. Hvert verkefni hefur nú sína eigin Bók tengda við skráarheitið — ef söguskráin þín er t.d. emilia_heist_audiobook.txt, mun Heimsbókin vistast sem skrypty/emilia_heist_audiobook.md. Þess vegna skiptir röðin máli: skrifaðu fyrst heiti verkefnisskrárinnar í reitinn „Heiti verkefnisskráar", og þá fyrst getur þú vistað Bókina. Hnappurinn „{rezyser.btn_zapisz_ksiege_label}" er grár þar til þú gefur upp heiti. Að hlaða inn fyrirliggjandi verkefni með hnappinum „{rezyser.btn_wczytaj_label}" hleður sjálfkrafa samsvarandi .md-skrá — þú þarft ekki að gera neitt handvirkt. Athugaðu: Án útfylltrar Heimsbókar mun forritið loka á sendingu fyrirspurna til gervigreindar — þetta er meðvituð öryggisráðstöfun sem verndar þig gegn því að búa til texta án nokkurra reglna.
    - Langtímaminni (hliðarslá til vinstri): Annar reiturinn í hliðarslánni. Hingað ratar samantekt sögunnar — gerð með verkfærinu í eftirvinnslupanelnum (SKREF 4) eða, við viðvörunarstig minnisins, sjálfkrafa. Þú getur líka skrifað þínar eigin athugasemdir hér handvirkt — líkanið mun meðhöndla þær sem „það sem ég veit nú þegar" áður en það les núverandi senu. SÖGULEGUR GALLI (lagaður í v15.5): Áður, ef þú skrifaðir mjög stutta athugasemd hér og smellir á „Vista samantekt" áður en eitthvað marktækt var í frásagnaskránni, hlóð forritið við næstu opnun FORGANGSRÖÐUN samantektina og SLEPPTI fullri sögunni — líkanið fékk þá aðeins Heimsbókina og einnar setningar athugasemd, án samhengis tóns og nýjustu sena. Frá v15.5 er hleðslan gáleg: ef öll sagan passar í samhengisgluggann er hún hlaðin í heild (og óþarfa gömul samantekt eytt), þannig að líkanið missir ekki samhengi. Og eftir handvirka breytingu á frásagnaskránni í ritlinum skaltu nota nýja hnappinn „{rezyser.btn_przeladuj_label}" (frá v15.5), sem samstillir innra minni við disk með einum smelli; til að opna skrána sjálfa í ritlinum þjónar enn „{rezyser.btn_otworz_narracje_label}".
    - Hugstormsstilling: Skrifaðu lauslega hugmynd og gervigreindin gefur þér 3 valkosti um þróun sögunnar. Fyrir hvern valkost mun hún strax búa til tilbúinn blokk „--- HVETJINGARDRÖG ---". Eftir að þú velur einn skaltu líma þessa hvetjingu í Handritsstillingu eða Hljóðbókarstillingu og bæta við athugasemdum eða upplýsingum fyrir líkanið. Söguleg minni breytist ekki meðan á Hugstormi stendur — þú getur gert tilraunir án áhættu!
    - Hráhandritsstilling (frá v16.0 — lesleikrit): Hér límir þú „HVETJINGARDRÖG" sem mynduð voru í Hugstormi. Gervigreindin mun skrifa langan frásagnar-samræðubút: frásögn (senumynd, tími, aðgerð) í merkjum [Narrator: ...] og orð persóna í merkjum [Nafn: tilfinning]. Engin hljóðáhrif — samhengið ber frásögnin með orðum. Textanum er sjálfkrafa bætt við skrána þína (t.d. nowa_scena.txt) í möppunni skrypty/. Slíkt tilbúið handrit getur þú síðan breytt í fjölraddaða hljóðbók (brú að ElevenLabs Studio — sérstakur kafli hér að neðan).
    - Hefðbundin hljóðbókarstilling: Stilling fyrir rithöfunda. Gervigreindin myndar hreina bókmenntaprósu — engin merki, engin hljóðfræði, klassískar samræður fléttaðar inn í frásögnina. Textinn bætist við skrána á sama hátt og í Handritsstillingu.
    - Sjálfvirk persónusköpun: Handritið er forritað til að búa sjálfkrafa til ný [Speaker]-merki ef söguþráðurinn krefst nýrrar persónu. Ábending: Ef gervigreindin skapar flotta persónu, afritaðu merkið hennar og límdu það í Heimsbókina svo líkanið muni hana til frambúðar!

    Verkefnisstjórnun — þrír aðgerðahnappar:
    - {rezyser.btn_wczytaj_label}: Hleður fyrirliggjandi verkefni inn í minni. Tiltækt þegar núverandi minni er tómt. Frá útgáfu 15.2.3 styður það tvær leiðir: ef verkefnaheitisreiturinn er tómur opnast valgluggi með lista yfir öll verkefni sem finnast í möppunni skrypty/ (sleppir samantektarskrám) — NVDA les listann náttúrulega, spilarinn þarf ekki að muna og skrifa nafnið af lyklaborðinu. Ef reiturinn er útfylltur reynir forritið strax að hlaða verkefni með því nafni (sérfræðingaleið: Enter í nafnareitnum eða smellur eftir að hafa skrifað úr minni).
    - {rezyser.btn_hard_reset_label}: Hreinsar verkefnið að fullu. Eyðir sögu, samantekt, Heimsbók og núllstillir alla teljara. Notaðu við skipti á verkefni eða nýrri sögu.
    - {rezyser.btn_otworz_narracje_label} (frá v15.2.3): Neyðarbreytingar á frásagnaskrá í kerfisritli. Krefst útfyllts verkefnaheitis. Forritið opnar `skrypty/<nazwa>.txt` í Notepad (Windows), TextEdit (macOS) eða sjálfgefnum GUI-ritli (Linux). Dæmigerðar aðstæður: (a) Gervigreindin lokar ekki senu og þú vilt bæta við enda handvirkt; (b) þú hlóðst verkefni með samantekt og vilt afrita nýjustu senur í Langtímaminni svo líkanið hafi fullt samhengi tóns (arkitekturgalli lýst hér að ofan); (c) þú vilt gera skurð í miðjum kafla sem vélin í forritinu styður ekki innbyggt.

    - {rezyser.btn_przeladuj_label} (frá v15.5, endurbyggður í v17.6): Endurhleður ALLT verkefnið af diski eftir handvirka breytingu á frásagnaskrá — þetta er raunveruleg endurhleðsla, ekki bara uppfærsla á núverandi minni. Endurreiknar teljara Kafla/Þátta/Atriða, hleður Heimsbókina, Hugstormsstillingu og valkosti, og samstillir vinnsluminni. Ef öll sagan passar í samhengisgluggann er hún hlaðin í heild (og óþarfa gömul samantekt eytt, til að vélin vinni á fullum texta). Ef sagan er löng og hefur vistað samantekt er hún geymd ósnert og forritið spyr þig hvaðan á að byrja vinnsluminni gervigreindarinnar: í Hljóðbókarstillingu velur þú Kafla, í Handritsstillingu fyrst Akt og síðan Senu þess akts (eða allan Aktinn) — restina táknar samantektin. Að hætta við valið = neyðarskurður að síðasta textabút (þess vegna er gott að halda uppbyggingu hausa). Áður en það yfirskrifar reiti með útgáfu af diski varar það þig við ef þú ert með óvistaðar breytingar í þeim. Dæmigerðar aðstæður: Gervigreindin lokaði senu á rangan hátt (braut anti-closure), þú skerð af þér ranga endinguna í ritlinum og smellir á Endurhlaða — engin þörf á að leiðrétta á tveimur stöðum.

    Söguleg athugasemd — af hverju stillingar eru nú verndaðar gegn óviljandi breytingum:
    Í eldri útgáfum forritsins gætti enginn samræmis skapandi stillingar innan eins verkefnis. Afleiðingin var ákveðin fágæt skapandi möguleiki sem má lýsa svona: þú byrjar sögu í Handritsstillingu, setur inn „Þáttur 1" og „Atriði 1" (forritið er ánægt með samkvæmni þína), myndar nokkrar skjáar af spennu með merkjum [SFX: Trzask drzwi] og [Speaker 1: Marek - zrezygnowany]... og síðan — vegna þess að innblástur kemur — smellir þú á „Setja inn skurð Kafli 1". Forritið bætir við haus „Kafli 1" í skrána án þess að hika, rétt á eftir „Atriði 3". Þú ert nú með blendning af útvarpsleikriti frá fimmtugsárunum og samtímasmásögu í sömu skrá. ElevenLabs lítur á þessa uppbyggingu, sér kaflahaus í miðjum akti og ákveður að þetta sé líklega villa í fylkinu. Efnisyfirlit lítur út eins og verk framúrstefnulistamanns. Hljóðbókararkitektinn gerir hins vegar ráð fyrir að þú sért fullorðið fólk og vinnur einfaldlega úr þessu án orðs — en einnig án nokkurra ábyrgðar á niðurstöðunni. Frá útgáfu 12.0 reyndi viðmótið að loka á breytingu á skráningarstillingu — að minnsta kosti í kenningunni. Í reyndinni reyndist þetta skapandi: Hugstormurinn (alltaf virkur sem skipulagsstilling) var bakdyrnar þar sem hægt var að fara á milli Handrits og Hljóðbókar með upp- og niðurörvum (Hljóðbók → Hugstormur → Handrit og öfugt). Fyrsti smellur á „Setja inn Þátt 1" eða „Setja inn Kafli 1" í nývalda stillingu yfirskrifaði .mode-skrána þægilega og blandaði aktum og köflum í sömu frásagnaskrá. Fyrst frá útgáfu 15.2.3 höfum við raunverulega vernd: þegar stillingarákvörðun hefur verið staðfest (fyrsta uppbygging eða fyrsta vel heppnuð framleiðslusending) er önnur skráningarstaðan í stillingarvali í raun læst. Hugstormurinn er alltaf virkur sem skipulagsstilling — hann býður söguþráðarvalkosti — en ekki er lengur hægt að nota hann til að hoppa yfir í aðra skráningarstillingu. (Frá útgáfu 18.13 tekur Hugstormurinn ekkert lengur saman; það verk tók verkfæri Langtímaminnis í eftirvinnslupanelnum yfir.)


    ### Showrunner-hvetjingar — Gervigreind sem handritshöfundur sjónvarpsþáttar (frá útgáfu 7, varðveitt)

    Þetta er stærsta breyting sem kynnt var í útgáfu 7 og hefur verið varðveitt óbreytt. Hún er ekki sýnileg í viðmótinu en breytir gæðum mynduðrar söguþráðar á róttækan hátt.

    Showrunner er í sjónvarpsiðnaðinum sá aðili sem ber ábyrgð á heildarmynd þáttaraðar — tryggir að söguþráðurinn stefni aldrei að auðveldum lausnum, heldur þéttist stöðugt, hrúgi upp átökum og haldi áhorfandanum í spennu í margar leiktíðir. Í útgáfu 7 var þessi heimspeki innbyggð beint í kerfislegar leiðbeiningar gervigreindarinnar.

    ### Anti-Closure-tilskipunin — og hvað Anthropic-vélin (Claude) breytti

    Showrunner-heimspekin er framfylgt með Anti-Closure-tilskipun sem er innbyggð í hverja stillingu: bann við því að loka senum með samantektum, siðferðislegum lærdómi og fölskum hamingjusömum endingum. Í gömlu tímabilinu (GPT-líkan) var þetta nákvæmlega öfugt við það sem er í dag — vélin braut þetta bann stöðugt og „lokaði" sögunni við hvert tækifæri: fléttaði inn samantektarsetningar um söguþráðinn, bjó til falskar hamingjusælar endingar eða lokaði þráðum í miðjum kafla, eins og hvert brot væri það síðasta. Frá útgáfu 18 vinnur öll gervigreindarvélin sjálfgefið á Anthropic (Claude) — og frá útgáfu 18.4 getur þú valfrjálst tilgreint þinn eigin þjónustuaðila (SKREF 2B) — og Claude fylgir Anti-Closure mun strangari.

    Þetta hefur leitt til annars, hreinlega tæknilegs aukaverkunar: þar sem líkanið lokar senu ekki stöðugt getur framlag þess náð lengdarmörkum einstakrar svörunar og brotnað af í miðri setningu (og stundum jafnvel í miðju orði). Forritið sér sjálft um þetta — þegar það greinir að brot brotnaði af við mörkin, lokar það síðustu setningunni með einni stuttri viðbótarfyrirspurn þannig að hún hljómar náttúrulega á tungumáli sögunnar þinnar, og vistar textann fyrst þá. Ef þetta tekst ekki af einhverjum ástæðum muntu sjá varlega viðvörun, og textinn vistast engu að síður í núverandi mynd — við lokum aldrei á vistun, brotna endinguna getur þú alltaf fínpússað handvirkt.

    Klippistjórareglan sem lýst er hér að ofan gildir óbreytt: ef líkanið lokar senu of þægilega þrátt fyrir allt, er það réttur þinn (og jafnvel skylda) sem Leikstjóra að opna .txt-skrána, eyða þessum síðustu setningum, láta textann hanga eftir á mest spennandi augnablikinu og smella á „{rezyser.btn_przeladuj_label}" til að samstilla minni við leiðrétta skrána.

    Hvert stig hefur innbyggða Anti-Closure-tilskipun:

    - Hugstormur: Gervigreindin virkar eins og handritshöfundur fjölþáttaraðar. Hver af 3 framlögðum valkostum VERÐUR að hrúga upp hindrunum, kynna nýjar dilemmur, opna þræði og cliffhangara. Algjört bann við því að leggja til valkosti þar sem persónur sættast til frambúðar, sigrast á aðalhindruninni án þungra afleiðinga eða sagan stefnir að flýtilokum. Bann við því að finna upp ódýrar, töfralegar staðsetningar sem brjóta uppbyggingu heimsins.
    - Hráhandritsstilling: Algjört bann við því að ljúka texta með samantektum, siðferðislegum lærdómi eða rammagerð. Gervigreindin á að skera af aðgerðinni náttúrulega á mest spennandi augnablikinu (cliffhanger), forðast niðurstöður þannig að næsta brot geti tekið við frásögninni þægilega.
    - Hefðbundin hljóðbókarstilling: Algjört bann við því að ljúka texta með hátíðlegum samantektum, loka þráðum eða gefa í skyn lok sögunnar (t.d. „Hún var tilbúin fyrir ný áskoranir", „Hún skildi að tíminn væri kominn til að halda áfram"). Textinn á að brotna af í miðjum yfirstandandi aðgerðum, spennu eða opinni hugsun.

    Undantekning frá reglunni: Ef þú biður sérstaklega um endi, lokaþátt eða epilóg mun gervigreindin búa til fullnægjandi lok sögunnar — bannið gildir ekki þegar þú biður sjálfur um það.


    ### Stjórnun Akta og Sena (Handritsstilling, frá útgáfu 7, varðveitt)

    Hráhandritsstillingin hefur sérstakt spjald „{rezyser.struktura_heading}" með hnöppum til að byggja upp uppbyggingu útvarpsleikritsins í rauntíma.

    - Setja inn Þátt X: Setur inn akthaus (t.d. „Þáttur 2") OG bætir sjálfkrafa við „Atriði 1" undir honum — vegna þess að sérhver nýr aktur byrjar á fyrstu senu. Aktateljari hoppar á næsta númer og senuteljari núllstillir sig á 2 (tilbúinn fyrir næstu senu í þessum akti).
    - Setja inn Senu X: Setur aðeins inn senuhaus (t.d. „Atriði 3") innan núverandi akts. Senuteljari hækkar sjálfkrafa.

    Greind hleðsla skráar: Þegar þú hleður inn fyrirliggjandi handritsskrá skannar forritið hana sjálfkrafa og stillir akta- og senuteljara á réttar tölur. Senuteljari er alltaf reiknaður innan síðasta akts í skránni.

    Prológur og Epilógur: Hnappar „{rezyser.btn_prolog_label}" og „{rezyser.btn_epilog_label}" eru sameiginlegir fyrir báðar stillingar og aðgengilegir á sama spjaldinu.

    Hljóðbókararkitektinn mun sjálfkrafa breyta Aktum í aðal leiðsögupunkta (Heading 1) fyrir ElevenLabs og NVDA — Senur verða feitletraður texti sem sést í skjalinu en ekki í efnisyfirliti.


    ### Greind stjórnun kafla (Hljóðbókarstilling, frá útgáfu 5, varðveitt)

    LLM myndar að hámarki um 5000 stafi á hverja fyrirspurn — það er of lítið fyrir fullan kafla. Þess vegna vinnur þú í ítrekunum: myndar fleiri brot með hnappinum „Senda til gervigreindar" þar til þú telur viðkomandi kafla tilbúinn. Þá smellir þú á „Setja inn kaflasnið" — forritið bætir haus við skrána og minni, og kaflateljari hoppar sjálfkrafa á næsta númer.

    Hnappar á spjaldinu:

    - Setja inn snið (Kafli X): Setur inn haus (t.d. „Kafli 3") í skrána og minni. Kaflateljari uppfærist sjálfkrafa.
    - Setja inn Prológ: Virkar aðeins í upphafi þegar minni er tómt. Vörn gegn því að setja Prológ inn í miðja sögu fyrir slysni.
    - Setja inn Epilóg: Lokar sögunni. Þegar Epilóg hefur verið settur inn með efni mun forritið loka á myndun nýrra brota — þetta er vísvitandi, því eftir lok sögunnar er ekkert meira að bæta við.

    Greind hleðsla skráar: Þegar þú hleður inn fyrirliggjandi skrá skannar forritið hana sjálfkrafa og stillir kaflateljara á rétt númer. Ef skráin hefur Prológ og þrjá kafla mun teljarinn sýna „Kafli 4" — án þess að þurfa að telja handvirkt.


    ### Söguþráðarsöfnuður — hvernig minni gervigreindarinnar virkar

    Í minni líkansins fer eingöngu hreinn texti sögunnar — það sem gervigreindin skrifaði í raun og veru. Leiðbeiningar, valkostir og áætlanir hverfa eftir notkun og menga ekki samhengið. Áhrifin? Líkanið heldur einbeitingu lengur, man betur eftir persónueinkennum og „flýr" sjaldnar frá reglum Heimsbókarinnar.

    Mælirinn „Minni líkansins" á skjánum sýnir hversu mikið samhengisgluggi líkansins er fylltur. Frá útgáfu 15.1 er þetta EKKI lengur bara talning stafa sögunnar — forritið telur raunveruleg TÓKEN (með sömu aðferð og líkanið notar) og leggur saman ALLA farminn sem sendur er til gervigreindarinnar: núverandi sögu, Langtímaminni (samantekt) OG Heimsbókina. Þess vegna hækkar mælirinn líka þegar þú þróar Heimsbókina eða ert með langa samantekt — ekki bara vegna frásagnarinnar sjálfrar. Gildið er sýnt sem hlutfall af fyllingu gluggans:
    - Grænt (upp að um 70%): Líkanið er fullkomlega einbeitt, þú ert með öruggan biðminni.
    - Gult (um 70–90%): Þú ert að nálgast mörkin. Gervigreindin gæti byrjað að stytta svör og hunsa reglur. Þetta er stundin til að vista Langtímaminnið sjálfur — og byrja hægt að loka þræðinum.
    - Rautt (yfir um 90%): Gagnrýnin yfirfylling! Frá útgáfu 18.13 keyrir forritið á þessu stigi sjálft, eftir hverja heppnaða sendingu, verkfæri Langtímaminnis úr eftirvinnslupanelnum og vistar samantektina — þú færð skilaboð um það og panelinn læsist á meðan textinn er búinn til.

    Greining á samantektarþröskuldi (þegar gervigreindin hallucinerar fyrr en þröskuldurinn gerir ráð fyrir): þröskuldar (viðvörun ~70%, alarm ~90%) eru metnir með reynslu. Ef þú tekur eftir endurteknum tilhneigingum þess að líkanið „flýi" frá reglum eða byrji að hallucinera ÁÐUR en mælirinn fer í gult/rautt — þ.e. fyrr en þröskuldurinn gerir ráð fyrir — opnaðu issue í geymslu forritsins og lýstu við hvaða fyllingu (hlutfalli) það byrjar í raun að bila, helst með dæmi. Ef þessi tilhneiging staðfestist víðar (hjá öðrum notendum, á mismunandi verkefnum) verður þröskuldur sjálfvirkrar samantektar lækkaður í næsta plástri. Þetta er meðvitað ítrekuð aðferð — betra er að stilla hana á raunverulegum gögnum en að giska fyrirfram.

    ### Óendanlegt minni (frá útgáfu 6, varðveitt)

    Þegar rauður alarm kveikist þarftu ekki lengur að afrita samantekt handvirkt. Frá útgáfu 18.13 sér sérstakt verkfæri í eftirvinnslupanelnum (SKREF 4) um það: einn smellur býr til hnitmiðaða þekkingarpillu um allan söguþráðinn hingað til, vistar hana sem minnisskrá í möppunni skrypty/ (í íslenska pakkanum `<nafn>_samantekt.txt`) og setur hana strax í reit Langtímaminnis. Eftir vistun máttu hreinsa minnið og halda áfram að skrifa í sömu skrá — söguna má halda áfram endalaust, án nokkurra lengdartakmarkana.

    Hvað breyttist frá fyrri útgáfum: fram að v18.12 var samantekt pöntuð í Hugstormi með því að skrifa orðið „samantekt" eða „yfirlit" í fyrirmælin. Sú leið hafði galla sem var innbyggður í hönnunina: hvatning Hugstormsins bannar líkaninu að skrifa nokkuð annað en þrjá söguþráðarkosti, svo beiðni um hreina samantekt setti það frammi fyrir tveimur andstæðum fyrirmælum í einu — og gat endað með villu í stað niðurstöðu. Þess vegna er samantektin nú sjálfstætt verkfæri með eigin, ómótsagnakenndum fyrirmælum, og Hugstormurinn er kominn aftur í eitt hlutverk: að skipuleggja söguþráðinn.

    Hvenær á að taka saman (uppfært í v15.5): Þú þarft ekki lengur að fylgjast með föstum stafamörkum „áður en þú hættir að vinna". Best er að taka saman eftir náttúrulega lokun stærri uppbyggingarhluta — eftir lok senu, akts eða kafla. Ástæðan: þegar þú leiðréttir síðar handvirkt endinguna í frásagnaskránni og smellir á „{rezyser.btn_przeladuj_label}" mun forritið spyrja þig frá hvaða haus á að endurreikna ferskt brot — og samantekt fyrri hlutans verður ósnert (engin þörf á að leiðrétta á tveimur stöðum). Þess vegna er enn mikilvægara að halda uppbyggingu: settu reglulega inn Kafli/Akt/Senu-hausa af uppbyggingarspjaldinu (ekki er mælt með löngum myndum án nokkurra akta/kafla, t.d. „módernískt leikrit" í einum streng). UNDANTEKNING: ef þú ert að skrifa mjög langa sögu ALGERLEGA án hausa er það enn nauðsynlegt að mynda og vista samantekt fyrir hlé — án merkja getur forritið aðeins endurreiknað síðasta brot talið í stöfum, og vélin án samhengis gæti „brugðist".

    Sjálfvirk samantekt (endurbyggð í v18.13): þegar minnismælirinn fer í viðvörunarástand (yfir um 90%) keyrir forritið sjálft verkfæri Langtímaminnis um leið og sendingunni lýkur — án þess að spyrja, því á því stigi er hvert næsta kall þegar í hættu. Niðurstaðan fer beint í samantektarskrána og í reit Langtímaminnis, og þú færð skilaboð um að þetta hafi gerst. Ekkert handvirkt starf. Samantektina máttu að sjálfsögðu lagfæra í reitnum og vista aftur með vistunarhnappi Minnisins.

    Samantektin er STIGVAXANDI: verkfærið les ekki allt verkefnið upp á nýtt í hvert sinn. Það fær núverandi Langtímaminni ásamt þeim hluta frásagnarinnar sem varð til eftir síðustu samantekt (forritið man við hvaða fyrirsögn það hætti) og steypir hvoru tveggja saman. Þannig vex kostnaður næstu samantekta ekki með lengd skáldsögunnar og eldri atburðir glatast ekki við hverja endurnýjun.

    Greind hleðsla og endurhleðsla af diski (uppfært í v17.6): Bæði við hleðslu verkefnis og eftir smell á „{rezyser.btn_przeladuj_label}" (eftir handvirka breytingu á frásagnaskrá í ritlinum) samræmir forritið minni við disk í einum farvegi — endurreiknar uppbyggingarteljara og hleður Heimsbókina og stillingu. Ef ÖLL sagan passar í samhengisgluggann — hleður hana í heild og eyðir óþarfa gömlu samantektinni svo vélin vinni á fullum texta (þetta lokar gömlu bili þar sem líkanið fékk bara samantekt án samhengis síðustu sena). Ef sagan er LÖNG og hefur vistaða samantektarskrá — geymir samantektina ósnerta og spyr þig frá hvaða uppbyggingarhaus (Kafli/Akt/Sena) vinnsluminni gervigreindarinnar á að byrja; restina af söguþráðinum táknar samantektin. Þannig eyðir þú ekki tóknum í að hlaða allri sögunni aftur, og um leið myndast næsta samantekt ekki á úreltum gögnum.
