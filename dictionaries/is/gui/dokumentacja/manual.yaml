    ## SKREF 3b: Tveir útgangar Handritsins — fjölrödduð hljóðbók (ElevenLabs) og útgáfa fyrir skjálesara

    Tilbúið handrit lesleikjans (Handritsstilling) hefur tvo sjálfstæða útganga: fjölraddað ElevenLabs Studio verkefni (hljóð) og HTML-útgáfu fyrir skjálesara. Þetta eru tvær leiðir til að „heyra" sama leikritið — þú getur notað aðra, hina eða báðar. Báðar eru valkvæðar og breyta ekki hefðbundnu flæðinu með umbreytaranum.

    ### Brú að ElevenLabs Studio (hljóð, valkvæð)

    Brúin breytir handritinu í fjölraddað Studio-verkefni — frásagnarinn og hver persóna fær sína eigin rödd. Án ElevenLabs-lykils breytist ekkert: brúin er einfaldlega falin.

    #### ElevenLabs-lykill (valkvæður)

    Límdu ElevenLabs-lykilinn þinn í skrána golden_key.env, í sérstakri línu: ELEVENLABS_API_KEY=sk_... Athugið: ElevenLabs-lykillinn byrjar á sk_ (með UNDIRSTRIK), ólíkt Anthropic-lyklinum (sk-ant-). Ef þú notar lykil með takmörkunum (restricted key), gefðu honum heimildir (scopes) projects_write og voices_read. Staða lykils sést á aðalskjánum (System Check) — skortur á lykli er ekki villa, brúin er einfaldlega falin.

    Brúin birtist í Leikstjórasvæðinu í Handritsstillingu (þegar lykillinn er réttur). Hún virkar á tilbúið leikrit sem er vistað á disk — búðu fyrst til eða hladdu inn verkefni, farðu síðan að brúnni.

    #### Skref 1 — Raddaval

    Smelltu á „Raddaval…". Forritið les persónurnar sem hafa línur úr handritinu þínu og bætir alltaf við rödd sögumanns (frásagnarinn er sjálfgefin rödd — les kaflaheiti og alla frásögn). Fyrir hvern ræðumann límirðu voice ID. MIKILVÆGT: sérhver rödd sem notuð er í leikritinu verður fyrst að vera í „My Voices" þínum — raddir sem þú skapar sjálfur (t.d. í „Voice Design") fara þangað sjálfkrafa, en raddir úr opinberu safninu skoðar þú í flipanum „Explore" og bætir við með hnappinum „Add to My Voices". Hvernig á að fá voice ID í ElevenLabs (í vafra): finndu röddina, spilaðu sýnishorn til að vera viss um að það sé rétt, og afritaðu auðkennið með hnappinum „Copy Voice ID"; þegar rödd er þegar í „My Voices" er þessi hnappur tiltækur strax — án þess að opna „More actions". Val á röddum: til að draga úr mögulegum endurgerðum er auðveldast að velja úr safninu „Best for Eleven v3" (raddir prófaðar með v3-líkaninu sem verkefnið er byggt á); að öðrum kosti hannaðu þína eigin rödd í „Voice Design", og fyrir hinn djarfa er klónun IVC (Instant Voice Cloning) eða PVC (Professional Voice Cloning) til staðar. Þú getur skilið reiti eftir tóma og komið aftur síðar — vistunin er drög.

    #### Skref 2 — Byggðu verkefnið

    Smelltu á „Búa til ElevenLabs Studio-verkefni…". Forritið athugar hvort handritið hafi að minnsta kosti einn kafla (Prolog/Þáttur/Kafli) og hvort sérhver ræðumaður og frásagnarinn hafi úthlutaða rödd, og stofnar síðan í reikningnum þínum fjölraddað Studio-verkefni skipt í kafla. Stofnun verkefnisins eitt og sér EYÐIR EKKI kreditum. Forritið stillir strax tungumál verkefnisins (rétt framburður haustalína) og hljóðstyrkjajöfnun að staðli hljóðbókar — þetta gerist í gegnum API svo þú þurfir ekki að fara inn í verkefnisstillingar í vafranum.

    Sniðvörður (viðbót við Klipparegluna): brúin krefst þess að í handritinu sé SÉRHVER lína annaðhvort framburður með ræðumannsmerki ([Narrator: …] eða [Nafn: …]), eða skipulagshaus (Prolog, Þáttur, Atriði, Kafli). Venjuleg, ómerkt prósa skrifuð „laust" — til dæmis höfundarskilaboð eða frásagnarbrot án taga — fer ekki til neinnar raddar og er þögult sleppt við byggingu, svo tilbúna verkefnið gæti vikið frá skránni þinni. Þess vegna, ef forritið greinir slíkar einyrðislínur, sýnir það lista þeirra með númerum og spyr hvort byggja eigi þrátt fyrir það: þú getur þá hætt við og leiðrétt handritið (opnaðu það með hnappinum „Opna frásagnarskrá…", bættu við ræðumannsmerkjum sem vantar eða fjarlægðu þær línur) eða byggt meðvitað þrátt fyrir það, samþykkt að þær verði sleppt. Þetta er náttúrulegt framhald Klippareglunnar: rétt eins og ekki má skemma skipulagshausa, ætti sérhver lína í handriti ætluðu undir brúna að hafa sinn ræðumann eða vera haus.

    #### Skref 3 — Render í vafra

    Eftir stofnun verkefnisins sýnir forritið auðkennið og hnapp sem opnar ElevenLabs Studio. Í vafranum finnurðu verkefnið, renderarðu tal (þetta eyðir fyrst kreditum — u.þ.b. 1 kreditt á staf), og flytur síðan út hljóðskrá eða birtir verkefnið í Eleven Reader. Render og birting fara fram af þinni hálfu, meðvitað — forritið byggir aðeins verkefnið.

    #### Tjáning og hreim (líkan Eleven v3)

    Verkefnið er byggt á líkaninu Eleven v3 (yfir 70 tungumál). Tilfinningar eru EKKI tjáðar með hástöfum, þrípunktum eða bandstrikum — vélin hunsar þetta. Í staðinn vefur Leikstjórinn inn í línur enskum hljóðtögum v3, til dæmis [whispers], [sighs], [angry], [laughs] — þeir stjórna tjáningu og virka óháð tungumáli tals. HREIM persónu kemur hins vegar úr RADDARSÝNISHORNINU: ef þú vilt að einhver tali t.d. á pólsku með erlendum hreimi, veldu eða hannaðu í Voice Design rödd þar sem sýnishornið hefur þann hreim. Í reynd skaltu gera tilraunir með raddprómptinn þar til þú heyrir t.d. pólskt sýnishorn með finnskum hreimi — líkan v3 mun varðveita þann hreim í tilbúna hljóðritinu. Ábending: mjög langar setningar veikja hreim, þess vegna er Leikstjórinn þegar beðinn í prómptinum um stuttar setningar.

    #### Meðvitund um v3-líkan (alpha-stig)

    Eleven v3 er tjáningarmesta líkanið, en er enn á alpha-stigi. Það getur gerst að ein einstök replika renderi sem kraðak í stað tals — nóg er að endurgera hana í Studio (sérhver blokk hefur nokkrar ókeypis endurgerðir). Í verkefnisstillingum ElevenLabs gætu einnig birst tillögur um að skipta um líkan (yfir í Eleven Flash v2.5 eða Multilingual v2) — þetta er EKKI villa, aðeins ábending vélarinnar. Ef þú vilt ekki sjá þessi skilaboð, opnaðu einfaldlega ekki verkefnisstillingarnar: forritið hefur þegar stillt í gegnum API allt sem þarf (líkan, tungumál, hljóðstyrkjajöfnun).

    Af hverju lesleikur, en ekki hljóðbrellur? Í eldri útgáfum framleiddi Handritsstillingin hrá hljóðbrellur [SFX: ...] án frásagnarans. Brúin að tilbúnu, fjölrödduðu hljóðriti krefst hins vegar þess að samhengi (staður, tími, aðgerð) beri frásagnarinn með orðum: hljóðbrellur í Studio eru ekki aðgengilegar fyrir skjálesara, og líkanið framkvæmir hvort sem er annaðhvort frásagnara eða hljóðbrellur — aldrei stöðugt bæði í senn. Þess vegna er Handritsstillingin lesleikur: frásagnarinn plús samræður, án SFX.

    ### Útgáfa fyrir skjálesara (HTML, án ElevenLabs)

    Í Handritsstillingu, óháð ElevenLabs-lykli, hefurðu hnappinn „Búðu til útgáfu fyrir skjálesara". Hann skapar skrána `skrypty/<nazwa>_screen_reader.html` — sérstakt úttak fyrir einstaklinga sem nota skjálesara (t.d. NVDA). Þetta virkar svona: línur persóna sem hafa skilgreindan hreim í Heimsbókinni (t.d. færslan „[Joana] akcent fiński") fá hljóðfræðilega ritun (vísvitandi „skemmd" stafsetning) og tungumálamark (lang-eigind), þannig að skjálesarinn les þær með réttum, erlendum hreimi. Hljóð-taggarnir v3 (t.d. [whispers]) eru fjarlægðir í þessari útgáfu — skjálesarinn á ekki að lesa þá upphátt. Hausar Prolog/Þáttur/Atriði verða HTML-hausar, svo auðvelt er að flakka um skjalið.

    Þetta er meðvitað viðbót við hljóðbrúna: hreim fyrir v3-líkanið ber raddarsýnishornið, en fyrir skjálesara — stafsetning plús tungumálamark. Þess vegna er stafsetning í hljóðútgáfunni hrein (v3 velur tungumál sjálfur), og „skemmda" stafsetningin fer eingöngu í sérstaka HTML-skrá, þar sem hún er æskileg.
