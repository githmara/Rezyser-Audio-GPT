    ## SKREF 4: Eftirvinnsla í Leikstjórn

    Eftir að hafa skrifað söguna hefur þú til umráða spjald eftirvinnslutækja neðst í Leikstjórnarspjaldinu. Spjaldið er hreyfanlegt: hvert tæki er sérstök YAML-skrá í möppunni `rezyser/` (`kategoria: postprodukcja`), og reiturinn `dla_trybow` ræður því í hvaða skapandi hömum tækið birtist. Sett af hnöppum breytist því eftir völdum ham — og þegar ekkert tæki hentar núverandi ham, helst spjaldið falið. Þitt eigið tæki býrðu til í Reglustjóranum (sniðmát af gerðinni postprodukcja — sjá SKREF 7b).

    Tæki vinnur í einu af þremur sviðum (reiturinn `zakres` í YAML):

    - `per_rozdzial` — fer yfir kaflana í vistaðri skrá og vinnur hvern þeirra sérstaklega (svona virkar Titlagjöf hér fyrir neðan),
    - `calosc` — sendir alla verkefnisskrána til gervigreindarinnar í einu kalli (t.d. skýrsla eða úttekt á allri sögunni); ef verkefnið hefur Heimsbók, getur tækið bætt henni við sem viðbótarsamhengi,
    - `rekoncyliacja` (frá og með útgáfu 18.13) — í stað allrar skrárinnar sendir það núverandi Langtímaminni ásamt þeim hluta frásagnarinnar sem varð til eftir síðustu samantekt. Þannig vinnur tækið Langtímaminni sem lýst er hér að neðan; þökk sé þessu vex kostnaður næstu kalla ekki í takt við lengd skáldsögunnar.

    Niðurstaðan birtist alltaf í samræðuglugga (til afritunar), og tæki með stilltri viðskeytisheiti niðurstöðuskrár vistar hana að auki við hlið frásagnarinnar í möppunni `skrypty/` (t.d. `nazwa_audyt.txt`). Áður en fyrirliggjandi niðurstöðuskrá er skrifað yfir, spyr forritið um samþykki — áður en einni krónu er eytt í kall til gervigreindarinnar. Ef efnið fyrir tækið fer yfir samhengisgluggann sem forritið notar til að mæla minni (128 þúsund tákneiningar), sérðu fyrst viðvörun með spurningu um hvort keyra eigi tækið samt sem áður. Þetta er aðeins viðvörun: Claude-líkön hafa mun stærri glugga en þessi teljari, en þinn eigin gervigreindarveitandi með minni glugga mun hafna slíkri fyrirspurn — og þú borgar samt fyrir tilraunina.

    ### Titlagjöf fyrir kafla (Hljóðbókarhamur)

    Gervigreindin greinir alla söguna og stingur upp á lýsandi, bókmenntalegum titlum fyrir hvern kafla (og hugsanlega Formála og Eftirmála). Einingin fer yfir kaflana í vistaðri skrá og gefur þeim stuttan titil, með því að greina aðeins upphaf hvers kafla (allt að 6000 stöfum). Hún skilar eingöngu tölusettum lista titla — án þess að endurskrifa efni bókarinnar.

    ### Langtímaminni — samantekt verkefnis (frá og með útgáfu 18.13)

    Tæki tiltækt í báðum vistunarhömum (Handrit og Hljóðbók). Býr til hnitmiðaða skráningu staðreynda: framvindu atburða, ákvarðanir persóna og afleiðingar þeirra, persónur, staði, opna söguþræði, og að lokum eina setningu um stíl og tón frásagnarinnar. Viðtakandi þessa texta er frásagnarvélin, ekki lesandinn — þess vegna er samantektin þurr og staðreyndamiðuð, án skrauts.

    Hún hefur einn eiginleika sem önnur tæki hafa ekki: niðurstaða hennar lendir ekki „við hlið" verkefnisins eins og skýrsla, heldur VERÐUR Langtímaminni — hún fer samtímis í minnisskrána í möppunni `skrypty/` (nafn hennar kemur úr uppskrift verkfærisins; í íslenska pakkanum er það `<nafn>_samantekt.txt`), í reitinn „Langtímaminni" í spjaldinu og í innra merki sem forritið notar til að vita hversu langt samantektin nær (það er þetta merki sem gerir kleift að taka saman í áföngum og spyr þig um viðmiðunarpunkt þegar verkefni er endurhlaðið af diski). Tækið ræsist einnig sjálfkrafa þegar minnisvísir líkansins fer í viðvörunarástand — sjá SKREF 3.

    **Nafn minnisskrárinnar er staðfært (frá v18.14).** Hver tungumálapakki tilgreinir sitt eigið orð í reitnum `sufiks_pliku_wyniku` í skránni `rezyser/postprod_streszczenie.yaml`: íslenska `_samantekt`, enska `_overview`, þýska `_zusammenfassung`, finnska `_yhteenveto` og svo framvegis. Þú getur breytt gildinu í Reglustjóranum í hvað sem þú vilt (t.d. `_minni`) — forritið sér um umskiptin, því það leitar minnisskrárinnar út frá LISTA MÖGULEGRA VIÐSKEYTA:

    - það athugar í röð viðskeyti minnisverkfæra úr pakka INNIHALDSMÁLS verkefnisins (ekki viðmótsmálsins — skráin tilheyrir sögunni, ekki valmyndinni), síðan hlutlausa `_overview` og loks hið sögulega `_streszczenie`;
    - finni það NÁKVÆMLEGA EINA skrá undir öðru nafni en núgildandi, endurnefnir það hana ásamt innra merkinu — þú þarft ekkert að gera handvirkt;
    - finni það FLEIRI (því þú heldur sérstakt minnisverkfæri „fyrir þig" og „fyrir gervigreindina", eða skrár frá tímum annars viðmótsmáls), spyr það þig hver eigi að vera Langtímaminni og hreyfir ekki við hinum. Að hætta við þessa spurningu þýðir setu án minnis: reiturinn er tómur, engri skrá er breytt eða eytt, og við langa frásögn biður forritið þig um að velja viðmiðunarpunkt vinnsluminnisins.

    ### Útgáfukort ElevenReader (frá v18.14)

    Verkfærið les allan texta verkefnisins og setur saman fullbúið safn lýsigagna fyrir útgáfuform hljóðbókar á ElevenReader og vistar útkomuna í möppunni `skrypty/` (í íslenska pakkanum sem `<nafn>_utgafa.txt`). Kortið inniheldur: titil og valkvæðan undirtitil, lýsingu upp í 1000 stafi (hámark vettvangsins), einn eða tvo flokka EINGÖNGU af kanónlista ElevenReader með 22 flokkum, markhóp, merkingu efnis fyrir fullorðna með einni réttlætingarsetningu, tvö til þrjú brot valin sem frítt sýnishorn, fullbúna leiðbeiningu fyrir forsíðumyndgervil (lóðrétt 1200×1800 px, með rými fyrir læsilegan titil og höfundarnafn) og áminningu um reitina sem þú skilur eftir á sjálfgefnu í forminu.

    Heiti reitanna í kortinu eru Á ENSKU (`Title:`, `Description`, `Genres:`, `Target audience:`, `Mature content:`, `Sample chapters:`, `ISBN:`) — form vettvangsins er aðeins til á ensku, svo þú afritar þau 1:1. Innihald reitanna er á máli verkefnisins, en GILDI lokaðra reita (flokkar, markhópur, `Yes`/`No` fyrir efni fyrir fullorðna) eru líka á ensku, því vettvangurinn tekur þau aðeins af sínum eigin lista.

    Hvað kortið gerir ekki fyrir þig: það býr hvorki til útgefanda né ISBN-númer — skilur þau eftir sem reiti til handvirkrar útfyllingar (ISBN er skráð númer og ranghugsun hér væri fölsk útgáfuyfirlýsing). Höfundarprófíll er skylda á ElevenReader, því nafnlausar útgáfur eru ekki leyfðar og það hangir saman við yfirlýsingu um höfundarrétt — verkfærið afritar því nafn eða höfundarnafn úr Heimsbókinni, og finni það ekkert þar, setur það reit til útfyllingar. Sýnishornsbrotin velur það ALLTAF, því formið krefst að minnsta kosti eins, óháð greiðslufyrirkomulaginu sem þú velur síðar.

    Eftir að kortið er búið til athugar forritið það sín vegna: hvort lýsingin er innan hámarks, hvort flokkar og markhópur koma af lista vettvangsins, hvort skyldureitir eru útfylltir og hvort tölur hafi birst í ISBN-reitnum. Frávik birtir það sem mildar athugasemdir — þú fær útkomuna í heild og ákveður sjálf/ur hverju þú breytir. Þetta er vörn gegn því að líkanið búi til flokk sem er ekki til og formið hafni honum aðeins í lok leiðsagnarinnar.

    **Athugið:** Eftirvinnslutæki krefjast þess að verkefnisskráin sé þegar vistuð á diski (búin til eða hlaðin inn). Ef skráin er ekki til, birtir forritið viðeigandi skilaboð.
  krok_5_poliglota_intro: |
    ## SKREF 5: Tungumálamaður AI

    Forrit til þýðinga og þvingunar á hreimum á skjálesaralesurum. Fara í það með því að smella á hnappinn "{main.btn.poliglota}" á hnappastikunni eða velja Verkfæri → {main.menu.poliglota} úr valmyndinni (flýtilykill: Ctrl+2).

    ### Hamur 1: Venjulegur Þýðandi (Notar AI - Greitt)

    Tilvalið til að hlusta á sögur á fallegu, réttmætu erlendu máli.

    - Hladdu inn skrá með hnappnum "{poliglota.btn_wczytaj}" eða með því að nota hnappinn "Skoða..." til að velja skrá í kerfisglugganum.
    - Veldu "AI Þýðandi" ham, sláðu inn markmálið (t.d. "Finska").
    - Forritið mun þýða efnið. Ef þú hleður inn .html skrá, mun það aðeins þýða textann sem er sýnilegur lesandanum og uppfæra tungumálakóðann í html taginu.
    - Ef þú hleður inn venjulegri .txt eða .md skrá (t.d. skrá sem er búin til af Leikstjóra), mun forritið sjálfkrafa vista niðurstöðuna sem .html skrá með innbyggðum tungumálakóða eftir þýðingu — tilbúið til að lesa með NVDA án viðbótarvinnu.
    - Styður einnig .docx skrár.

    Snjöll skipting í blokkir: Löngum textum er sjálfkrafa skipt í blokkir sem mældar eru í tókum líkansins (ekki stöfum) og þýddir í röð með framvindustiku. Þannig rúmast einnig þétt rituð tungumál, eins og kínverska eða japanska, innan svarmarka líkansins, og afklippt svar er greint og sjálfkrafa reynt aftur á minni hlutum.

    Örugg framvinduvistun (NÝTT í útgáfu 9): Hver þýdd blokk er strax vistuð í falda tímabundna skrá í kerfismöppu forritsins. Ef þýðingin er rofin vegna þess að API kvótinn er uppurinn, mun forritið sjálfkrafa greina þessa skrá við næstu ræsingu, endurheimta þegar greidda framvindu og ljúka verkinu rólega frá því sem var rofið — án handvirkrar afritunar. Eftir árangursríka lokun er tímabundna skráin sjálfkrafa fjarlægð.

    Af hverju er þetta mikilvægt? Í útgáfu 8 var nálgunin við að halda áfram þýðingu með alvarlegum, hljóðlátum galla: ef þú endurnefndir ekki skrána með hlutþýðingu og skarst þýdda hlutann af samkvæmt leiðbeiningum, og síðan hélt áfram að þýða restina strax — opnaði forritið útskriftarskrána í yfirskriftarham. Greiddri framvindu var óafturkræft og ómeðvitað eytt áður en þú tókst eftir neinu. Útgáfa 9 útrýmir þessari gildru algjörlega: vistun er varanleg eftir hverja blokk, óháð því hvað þú gerir síðan.

    ### Hamur 2: Leikstjórnarhamur / Hreimar (Ókeypis - Virkar staðbundið)

    Tól til að "spilla" texta. Þvingar brotna pólsku á talgervla.

    Samþætt fellivalmynd Leikstjórnarhams gerir þér kleift að velja hreim beint af einum lista. Í boði eru:
    Enska (Samantha / Mark — Vocalizer/Apple, Zira / Hazel — OneCore)
    Rússneska (Milena — Vocalizer/Apple, Irina / Pavel / Yuri — OneCore, eSpeak)
    Franska (Thomas / Amelie — Vocalizer/Apple, Julie — OneCore)
    Þýska (Markus / Stefan — Vocalizer/Apple, Hedda / Katja — OneCore)
    Spænska (Jorge / Monica — Vocalizer/Apple, Helena — OneCore)
    Pólska (Ewa — Vocalizer, Paulina — OneCore)
    Ítalska (Alice / Luca — Vocalizer/Apple, Elsa — OneCore)
    Finska (Satu / Mikko — Vocalizer/Apple, Heidi — OneCore)
    Og einnig tveir hreinsunarvalkostir án hreims:
    "Enginn (Hreinsun ÁN talnaviðmiðunar)"
    "Enginn (Hreinsun MEÐ talnaviðmiðun)"
    Valmöguleikinn með talnaviðmiðun breytir sjálfkrafa tölum í orðform (t.d. 15 verður "fimmtán") fyrir vinnslu — þannig les NVDA tölur áreynslulaust, og ef textinn hefur þvingaðan hreim, fær talan hann líka, án undantekninga.
    Þú spyrð kannski hvort talgervillinn muni geta beygt slíkar tölur eftir samhengi? Svarið er: nei. Og það er viljandi eiginleiki. Eins og alkunna er: "pólska erfið mál" — og útlendingur sem brýtur málfræðina okkar bætir aðeins við áreiðanleika brotins hreims!

    Tagaviðgerðarmaður (NÝTT í útgáfu 9): Neðst á listanum finnurðu viðbótarvalkost — Tagaviðgerðarmaður. Hann beitir engum hljóðreglum eða hreinsun. Hann gerir eitt: sprautar inn í skrána þann ISO tungumálakóða sem þú gefur upp — tveggja stafa (t.d. "fi" fyrir finska, "en" fyrir enska) eða með svæðis- eða leturmerki (t.d. "pt-BR" fyrir brasilíska portúgölsku, "zh-Hans" fyrir einfaldaða kínversku). Gagnlegt þegar þú hefur þegar tilbúna skrá — t.d. áður þýdda af AI Þýðanda — en af einhverjum ástæðum kom hún út með röngu tungumálamerki eða tungumálamerki sem vantar. Í stað þess að þýða hana aftur, einfaldlega keyrirðu Tagaviðgerðarmanninn með réttum ISO kóða og eftir smá stund hefurðu rétta skrá.

    Forritið hreinsar leikstjóraleiðbeiningar í sviga — fjarlægir alla texta sem eru í sviga (t.d. "(með innfelldum andardráttum)", "(hvíslað)", "(háðslega)"). ElevenLabs á að lesa aðeins samtöl og frásögn, ekki leikstjóraleiðbeiningar innfelldar í textann.

    Forritið hreinsar einnig Markdown merki — fjarlægir fyrirsagnahashmerki (t.d. #, ##, ###), jafnaðarmerki notuð sem undirstrikanir á fyrirsögnum og munaðarlausar kommur sem gætu truflað lestrarhrynjandi talgervilsins.

    - Verndarskjöldur: Forritið verndar öll HTML merki. Það spillir aðeins samtölum og frásögn.
    - Virkar staðbundið og kostar ekkert!
  krok_5_tryb_szyfrant: |
    ## Hamur 3: Dulritari (NÝTT í 13.0 — skemmtun með texta, frítt, staðbundið)

    Þriðji RadioButton í Tungumálamanninum, við hliðina á AI Þýðanda og Leikstjórnarham: „Dulritarahamur (skemmtun með texta, tilviljanakennd truflun)". Virkjar sex staðbundnar reiknirit sem afmynda texta — til skemmtunar, gátna, tungumálalegra þrauta. Eftir að hamurinn er valinn birtist fellilisti með reikniritum, og fyrir eitt þeirra (Cæsar dulritið) er viðbótar reitur fyrir færslu.

    Aðgengileg reiknirit (veldu í valmyndinni „Veldu afmyndar reiknirit"):

    - Texta Afturköllun (Lesið afturábak með stórum staf) — hver setning er snúin við staf fyrir staf, með punktum/upphrópunarmerki/spurningarmerki á enda og stórum staf í upphafi. Áður en snúið er við, stækkar skriftin vinsælar skammstafanir (t.d., þ.e., m.a., u.þ.b., o.s.frv.), svo útkoman eftir viðsnúning hafi enn merkingu — án þess myndi „t.d." snúast við í fáránlegt „.d.t".

      Innblástur: verkefni úr þættinum „The Traitors. Zdrajcy". Þegar stjórnandinn sýndi þátttakendum vinsælt pólskt lag úr teiknimynd — einfaldlega spilað afturábak — voru viðbrögðin á borð við „hvaða tungumál er þetta?", „þetta er líklega armenska", „ungverska eða finnska". Verkefnið var að eitt lið fékk texta lagsins í skóginum, skrifað afturábak, og átti að syngja það í þessari snúnu mynd, hitt liðið tók það upp, spilaði það afturábak — og í kenningu endurheimti upprunalega lagið til að giska á. Nákvæmlega sama fyndna hljóðvilla myndar okkar Afturköllun þegar þú spilar breytta skrá í gegnum TTS.

    - Typoglycemia (Blandaður miðhluti orða) — klassískur sálfræðilegur áhrif: „Þú gtiær lseið txeta í hvðaa röð sem er, svo fralarmega sem ftysri og sðsíiasti sftaur hvres oðrs er á rttéum saðt". Skriftin blandar tilviljanakennt miðhluta hvers orðs lengra en 4 stafir, fyrsti og síðasti stafur eru óbreyttir. Frábært til að prófa „hversu mikið sé ég í raun, og hversu mikið ályktar heilinn minn".

    - Skemmdur Sími / Ormadíalekt — hvert „s", „z" eða tvíhljóð „sz" er tilviljanakennt lengt í hvæs af lengd 4-8 stafa („ssssss", „zzzzzz", „ssssssz"). Innblástur: Snecko úr leiknum „Slay the Spire". Áhrif: textinn hljómar eins og hann hafi verið lesinn af ormi með talgalla.

    - Sérhljóðari (Allt hljómar á „O") — hverjum sérhljóða í textanum er breytt í „o", með varðveislu íslenskra mýkinga. „Góðan daginn" → „Góðon doginn". Því lengri texti, því skemmtilegri áhrif (og skjálesari les þetta með fullri sannfæringu).

    - Sterkt Stam / Skemmdur Vélmenni — bætir við stami í upphafi orða: „st-st-stelpa", „þr-þr-þrjótur". Fyrir stutt orð (minna en 3 stafir) sleppir reikniritið þeim. Ef annar stafur orðsins er samhljóði, endurtekur það fyrstu tvo stafina (náttúrulegri áhrif); ef sérhljóði — endurtekur aðeins fyrsta.

    - Cæsar Dulrit (færslu íslenska stafrófsins) — klassískt staðgengils dulrit: hver stafur er færður um N stöður í íslenska stafrófinu (AÁBDÐEÉFGHIÍJKLMNOÓPRSTUÚVXYÝÞÆÖ, 32 stafir). Færslugildið slærðu inn í reitinn „Færsla Cæsar dulrits (0 = tilviljun, bil -32…32)". Ef þú slærð inn 0 — forritið velur tilviljanakennda færslu á bilinu 1-31 og sýnir hana í skilaboðum eftir að ljúka (svo þú getir síðan afkóðað). Stafir utan stafrófsins (tölur, greinarmerki, bil) eru óbreyttir.

    Hagnýt notkun: dulritin vista niðurstöðuna á sama formi og Leikstjórnarhamur (.html með lang tagi eða .docx með XML merkjum), þannig að NVDA les þau með rödd viðeigandi tungumáls. Sérstaklega Afturköllun og Sérhljóðari hljóma í talgervli mun áhugaverðari en þegar þú lest þau með augunum — því heilinn reynir sjálfkrafa að „afkóða" textann við sjónlestur, en TTS les hann nákvæmlega eins og hann er skráður.

    Öll sex dulritin eru einnig lýst á breiðari, aðgengilegri hátt í skjalinu docs/dictionaries.pl.html í forritapakkanum — ásamt ráðum um hvernig á að bæta við eigin dulriti af gerðinni „skipta um stafi" án þess að kunna forritun (t.d. skólaslang, grasamál).
  krok_5_jezyk_pipeline: |
    ## Vinnslutungumál, þvingun og gæðahamur (NÝTT í 18.11)

    Skjalahlutinn hefur nú fellilista fyrir vinnslutungumál. Með honum velur þú samkvæmt reglum hvaða tungumáls Leikstjórnar- og Dulkóðunarhamur vinna: hreimlista og dulmálslista, ásamt stafrófi Sesarslykils og tilfærsluspönn þess.

    - Sjálfgefna stillingin „{poliglota.jezyk_auto}" heldur fyrra hegðunarmynstri: tungumálið ákvarðast út frá innlesnu skjali, og ef það er annað en tungumál forritsins færðu stutta tilkynningu um að listunum hafi verið skipt yfir.
    - Val á tilteknu tungumáli úr listanum er bindandi — forritið breytir því ekki sjálfkrafa við innlestur skjals.

    Undir listanum er valreitur sem þvingar valið tungumál fyrir allt skjalið. Sjálfgefið er hver efnisgrein unnin samkvæmt tungumáli sem greinist fyrir þá efnisgrein — það er yfirleitt besti kosturinn, því innskot á öðrum tungumálum fá sínar eigin, réttu reglur. Merktu við þvingun þegar þú vilt samræmda vinnslu á öllu skjalinu. Dæmi þar sem þetta er nauðsynlegt: afturkræf fjöllaga dulritun. Stafróf Sesarslykils er mislangt eftir tungumálum, svo án þvingunar verður texti með blönduðum tungumálum dulritaður með nokkrum ólíkum stafrófum — og þá krefst afkóðun þess að vita hvar tungumálamörkin lágu. Með þvinguðu tungumáli dulritar og afkóðar allt skjalið eitt og sama stafróf. Fyrirvari: í tungumálum þar sem Caesar-stafrófið inniheldur broddstafi sem eru samræmdir við innlestur (pólska, þýska) er afkóðunin ekki fullkomlega trú — broddstafir dulritextans eru umbreyttir í grunnform sín við endurinnlestur, áður en þeir ná afkóðuninni. Full afturkræfni fæst með stafrófum án slíkra tákna (t.d. ensku).

    Gervigreindarþýðandinn hefur hins vegar fengið nýjan valreit fyrir gæðahaminn. Þegar merkt er við hann fær líkanið aukið svigrúm fyrir innri textagreiningu áður en þýtt er (svokölluð extended thinking) — þýðingin tekur lengri tíma og kostar fleiri tákneiningar (tokens), en erfiðir kaflar verða vandaðri. Valkosturinn virkar eingöngu með Anthropic Claude-líkönum; ef þú notar annan þjónustuveitanda gegnum OpenAI-samhæfðan endapunkt hefur merking við hann engin áhrif.

    Skyld smáatriði: Stafir með makron sem notaðir eru við umritun japönsku (t.d. Tōkyō, rāmen, jūdō) eru frá og með þessari útgáfu samræmdir eins og aðrir erlendir broddstafir — í flestum tungumálum í hreinan staf (Tokyo), en í finnska pakkanum með tvöföldun sérhljóðans (Tookyoo), í samræmi við finnsku venjuna við ritun langra hljóða. Þannig detta þeir ekki lengur út úr stafrófi Sesarslykils sem opinská tákn í dulritextanum.
  krok_5_detekcja_jezyka: |
    ## Málgreining

    Áður en skriftin "spillar" textanum, athugar hún hvaða tungumál textinn er skrifaður á. Ef hún greinir að það sé ekki pólskur texti, birtir hún viðvörun. Hljóðfræðilegu reglurnar eru sniðnar fyrir pólsku — að beita þeim á texta á öðru tungumáli myndi leiða til ófyrirsjáanlegra áhrifa.
  krok_5_akcenty_nvda: |
    ## Hreimar hannaðir fyrir staðbundna talgervla (NVDA)

    Hreimarnir hafa verið 100% hannaðir fyrir staðbundna, ókeypis og greidda talgervla fyrir skjálesara — Vocalizer og eSpeak í NVDA. Þetta tryggir stöðugleika og fyrirsjáanleika á hverri tölvu.

    Af hverju ekki ElevenLabs? Prófanir á lengri skjölum sýndu að hljóðfræðileg afbökun texta í vélum eins og ElevenLabs þvingar ekki fram tilætlaðan hreim — vélin "giskar" einfaldlega á tungumálið og gerir frekar hreim vestur-/suður-slavneskan. Staðbundnir talgervlar NVDA eru mun hlýðnari í þessu efni.
  krok_5_specyfika_tts: |
    ## Sérkenni staðbundinna talgervla (TTS)

    Mismunandi TTS-vélar hegða sér á ólíkan hátt. Hér að neðan eru lykilmunir sem hafa bein áhrif á framburð:

    ### eSpeak (Open Source)
    Léttur, ókeypis vél með gríðarlega stórt tungumálasafn — styður m.a. íslensku. Mjög strangur varðandi kóðun tákna, sem gerir hann fyrirsjáanlegan. Hins vegar hefur hann hljóðfræðilegar takmarkanir: oft deilir hann hljóðönum milli tungumála, sem veldur því að til dæmis úkraínska hljómar með rússneskum blæ.
  krok_5_tiflotecnia: |
    ## Tiflotecnia Voices fyrir NVDA (raddir Cerrence — áður Vocalizer frá Nuance)

    Tiflotecnia Voices er beinn arftaki Vocalizer frá Nuance — viðskiptahugbúnaður með raddir af nýrri kynslóð frá fyrirtækinu Cerrence, dreift sem .nvda-addon pakki í NVDA Add-on Store. Gamli Vocalizer (32-bita .dll bókasöfn frá Nuance) var lagður af með NVDA 2026.1; Cerrence endursamdi raddirnar í 64-bita og Tiflotecnia gaf þær út undir nýju nafni. Gæði framburðar eru áberandi betri en í fyrri kynslóðinni.

    Hvernig á að setja upp: NVDA → Verkfæri → Add-on Store → leita að „Tiflotecnia Voices for NVDA" → Setja upp. Eftir uppsetningu birtist sérstök undirvalmynd „Tiflotecnia Voices" í NVDA valmyndinni og eigin flokkur í stillingum NVDA. GUI viðbótarinnar leiðir þig skref fyrir skref í gegnum kaup á leyfi (eða virkjun 7 daga prufutímabils), val og uppsetningu fyrstu raddanna (t.d. pólsku Ewa fyrir fljótlegan lestur á kerfisstýringum, finnsku Satu fyrir hreim í Tungumálamanninum). Innbyggð hjálp viðbótarinnar er skýr, svo við endurtökum ekki ferlið hér — það er nóg að láta viðbótina leiða þig.

    **Ábending fyrir þá sem flytja frá Vocalizer og Eloquence:** uppfærsla á lægra verði er í boði. Ferli: eftir að greiðsla hefur verið staðfest, sendu strax tölvupóst á netfangið sem er tengt á skjánum eftir greiðslu og biddu um staðfestingu á gamla virkjunarkóðanum — Tiflotecnia mun staðfesta rétt til afsláttar og laga verðið. Án þessa tölvupósts mun kerfið meðhöndla þig sem nýjan viðskiptavin.

    Aðgengi að röddum: Tiflotecnia Voices styður flest tungumál sem Vocalizer hafði (m.a. pólsku, ensku, þýsku, frönsku, spænsku, finnsku, ítölsku, rússnesku). Listi yfir raddir fyrir hvert tungumál er sýnilegur í stillingaflokki viðbótarinnar áður en leyfi er keypt.
  krok_5_onecore: |
    ## Microsoft OneCore
    Ókeypis raddir sem eru innbyggðar í Windows kerfið (Mobile Voices). Gott jafnvægi milli gæða og aðgengis tungumála. Býður upp á hágæði og hefur stuðning fyrir íslensku (Gudrun), finnsku (Heidi) og ítölsku (Elsa). Athugið: OneCore styður EKKI sjálfvirka tungumálaskiptingu byggða á lang-tögum (nema þú notir innbyggðan skjálesara kerfisins, sögumann) — sjá kafla hér að neðan.

    Hvernig á að sækja OneCore raddir á Windows? OneCore raddir eru ókeypis, en flest tungumál eru ekki uppsett sjálfgefið. Til að sækja tungumál sem vantar, farðu í Windows Stillingar → Tími og tungumál → Tal → Stjórna röddum (eða "Bæta við röddum"). Veldu tungumál af listanum (t.d. Íslenska, Finnska, Ítalska) og smelltu á Sækja. Eftir niðurhal birtist röddin sjálfkrafa í NVDA — án nokkurrar viðbótarstillingar.
  krok_5_apple: |
    ## Apple (iPhone / iPad / Mac) — VoiceOver með Vocalizer
    Á Apple tækjum er Vocalizer vél innbyggð í stýrikerfið og styður öll tungumál án nokkurra viðbótarkaupa. Sjálfgefið er þó uppsett þétt útgáfa af röddum sem hljóma dálítið vélrænt. Til að fá mun betri og náttúrulegri hljóm er gott að hlaða niður útvíkkuðum eða úrvalsútgáfum:
    - Á iPhone/iPad: Stillingar → Aðgengi → VoiceOver → Tal → Rödd → veldu tungumál (t.d. Finnska) → snertu nafn raddarinnar (t.d. Satu) → þú munt sjá valkostina "Útvíkkað" og "Úrvals". Sæktu valda útgáfu — hún tekur meira pláss á disknum, en munurinn á gæðum er áberandi.
    - Á Mac: Kerfisvalkostir (eða Kerfisstillingar) → Aðgengi → VoiceOver → Opna VoiceOver verkfæri → Tal → Rödd → smelltu á "Sérsníða" við valda rödd og sæktu útvíkkaða eða úrvalsútgáfu.
  krok_5_android: |
    ## Android — Vocalizer greitt fyrir hverja rödd
    Á Android er Vocalizer fáanlegt sem forrit í Google Play Store (leitaðu að "Vocalizer TTS"). Athugið: hvert tungumál og rödd er keypt sérstaklega — það er ekki til eitt leyfi fyrir allt. Áður en þú kaupir geturðu prófað röddina í nokkrar mínútur í kynningarham. Eftir kaup er röddin tengd við Google reikninginn þinn og hægt er að setja hana upp á hvaða tæki sem er með sama reikningi.
  krok_5_tagi_jezykowe: |
    ## Killer Feature fyrir blinda: Skrár með tungumálamerkjum

    Þetta er sannkölluð bylting. Unnar skrár eru nú vistaðar sem:

    - .html með lang eiginleika (t.d. lang="fi" fyrir finnsku) — NVDA les þennan merkimiða og skiptir sjálfkrafa yfir á viðeigandi tungumálatalgervil. Engin handvirk stilling!
    - .docx með varðveittum sniði — hver textahluti hefur innsprautað tungumálamerki í XML skjalsins, þannig að Word og NVDA vita hvaða rödd á að nota fyrir hvern hluta.

    Unnar skrár eru alltaf vistaðar sem NÝ skjöl (t.d. akcent_Finski.html).
  krok_5_auto_jezyk_nvda: |
    ## Sjálfvirk tungumálaskipting í NVDA — það sem þú þarft að vita

    Til að NVDA skipti raunverulega um rödd byggt á lang tag, þarf að vera virk stilling "Skiptu sjálfkrafa um tungumál þegar það er stutt". Þú finnur það í NVDA Valmynd → Tal. Sjálfgefið er það virkt við fyrstu ræsingu lesarans — en það er gott að athuga hvort einhver hafi slökkt á því.

    **Mikilvægt takmörkun á OneCore röddum:** Microsoft OneCore raddir styðja ekki innfæddan þennan eiginleika með NVDA, aðeins með innbyggða Windows lesaranum. Það er til óopinber viðbót við NVDA sem heitir „One Core Autolang", sem reynir að laga þetta — en þróun þess hefur verið stöðvuð fljótt. Ástæðan er einföld: á hverju ári, með fyrstu útgáfu NVDA á því ári, koma breytingar sem brjóta samhæfni API (svokallaðar API Breaking Changes). Stundum er nóg að uppfæra reitinn „last tested version" í yfirlýsingu viðbótarinnar, en stundum þarf raunverulegar breytingar á kóðanum — og höfundurinn nær ekki að fylgja eftir með uppfærslum. Ef þú vilt sjálfvirka tungumálaskiptingu, eru öruggari valkostir Tiflotecnia Voices (greitt, kafli hér að ofan) eða eSpeak (ókeypis, lakari gæði), sem styðja þennan eiginleika innfæddan — en varúð: núna í Tiflotecnia Voices virkar það með forgangsvillu (sjá „Kritískur krókur" hér að neðan). Eftir að hafa afritað plásturinn gengur sjálfvirk skipting eins og í gamla Vocalizer.
  krok_5_alarm_detekcja_jezyka: |
    ## Kritískur galli Tiflotecnia Voices: biluð tungumálagreining

    Fyrst góðu fréttirnar — viðvörunin um NVDA 2026.1 úr fyrri útgáfum handbókarinnar endaði með góðum árangri: Cerrence afhenti 64-bita bókasöfn, Tiflotecnia gaf þau út í .nvda-addon pakka sem er aðgengilegur í Add-on Store (sjá kaflann hér að ofan), og Vocalizer hjá þeim sem héldu honum til loka kom aftur undir nýju nafni — með betri gæðum og án 32-bita takmarkana.

    Með útgáfu Tiflotecnia Voices kom hins vegar nýr kritískur galli — í tungumálagreiningu. Í stillingum viðbótarinnar er hægt að stilla hvaða rödd á að nota fyrir ákveðna stafi (t.d. latneska, kyrillíska) eftir því hvaða raddir eru uppsettar. Vandamálið er í forgangsröðinni: núna er fyrst beitt yfirskrift á hvern staf, síðan fallbakki til ISO tungumálakóða (í reynd óaðgengilegt fyrir SAMA stafróf, sem yfirskriftin hefur nú þegar verið stillt á), og að lokum valin rödd. Afleiðingin birtist innan sama stafrófs: þú ert með texta á finnsku með réttum `lang="fi"` merkimiða, uppsett Satu sem finnska rödd Tiflotecnia, EN í stillingum er valin pólsk rödd fyrir latneska stafi — Satu LES ekki þennan texta, þrátt fyrir réttan ISO merkimiða. Yfirskrift á hvern staf „pólsk rödd fyrir latínu" vinnur á fyrsta stigi, ISO `fi` er aldrei athugað. Fyrir pör með mismunandi stafróf virkar kerfið rétt (rússneskur texti + Milena fyrir kyrillískt + pólsk rödd fyrir latínu — allt kyrillískt fer með Milenu, möguleg latnesk nöfn með pólskri rödd; hvert stafróf er í sinni yfirskrift). Eftir flutning frá Vocalizer, þar sem tungumálaskipting á grundvelli ISO virkaði fullkomlega, munu notendur taka eftir þessari afturför strax — sérstaklega þeir sem nota nokkra evrópska hreima í Tungumálamanninum (Satu, Alice, Markus) á sama latneska stafrófi.

    Greining og plástur: Ég greindi vandamálið á Python stigi í kóða viðbótarinnar og útbjó plástur sem breytir forgangsröðinni í: ISO → valin rödd → stafayfirskrift. Plásturinn viðheldur gagnlegri skiptingu á latínu fyrir latnesk nöfn í rússneskum texta, þegar „tungumálagreining á grundvelli Unicode stafa" er virk í stillingum. Ég sendi plásturinn til þróunaraðila Tiflotecnia — enn án svars, svo þeir halda sig líklega við sína eigin lausn. Ef viðbótin fær uppfærslu mun ég uppfæra plásturinn ef þörf krefur.

    Hvað á að gera á meðan: ef þú vilt hafa rétta tungumálagreiningu (það er þess virði — þetta var eitt af „killer features" gamla Vocalizer, sjá „Killer Feature fyrir blinda" hér að ofan), opnaðu mál í forritasafni á GitHub með merkimiðanum `tiflotecnia-patch` og netfangið þitt í textanum. Það er þess virði að bæta við stuttri lýsingu á vandamálinu á eigin tungumáli (2–3 setningar duga) — vélmennið greinir tungumálið (stuðningur: pólska, enska, þýska, spænska, finnska, franska, íslenska, ítalska, rússneska) og svarar á sama tungumáli; án lýsingar eða á öðru tungumáli kemur svarið á ensku. Sjálfvirka vélmennið mun strax loka málinu með staðfestingu á innsendingu (án ummerkja í opinberu þræðinum), og þú færð plásturinn í tölvupósti yfirleitt innan nokkurra daga. Plásturinn er EKKI birtur í forritasafninu né sem Gist — Tiflotecnia Voices fyrir NVDA er viðskiptahugbúnaður, og leyfi viðbótarinnar leyfir ekki endurdreifingu á skrám þess, jafnvel ekki breyttum. Eftir að þú hefur fengið plásturinn þarftu að afrita innihald hans í `%appdata%\Roaming\nvda\addons\TiflotecniaVoices`, skipta út skrám. Varúð við afritun: ef Windows spurði ekki um skipti, þá hefurðu líklega afritað alla `TiflotecniaVoices_edits` möppuna með innihaldi hennar Í STAÐINN FYRIR einungis innihaldið — í slíku tilviki farðu inn í nýju undirmöppuna, klipptu allt, límdu það upp um eitt stig og skrifaðu yfir. Eftir að plástrinum hefur verið beitt með góðum árangri, endurræstu NVDA — njóttu betri gæða Cerrence 64-bita radda og réttrar tungumálagreiningar, sem er sambland sem enginn einstakur framleiðandi á markaðnum býður upp á. Við gerum ráð fyrir að þú hafir gilt leyfi fyrir Tiflotecnia Voices — við staðfestum það ekki, en þú getur ekki beitt plástrinum á möppu annarra án leyfis.
  krok_6_architekt: |
    ## SKREF 6: Arkitekt hljóðbóka

    Tól til að undirbúa faglega skráarskipulag fyrir skjálesara og ElevenLabs. Farðu í það með því að smella á hnappinn „{main.btn.konwerter}" á hnappaslánni eða velja Verkfæri → {main.menu.konwerter} úr valmyndinni (flýtilykill: Ctrl+3).


    ### Hvernig virkar þetta?

    1. Sláðu inn slóð að upprunaskránni í textareitinn eða smelltu á hnappinn „Skoða..." til að velja skrá í kerfisglugga. Skriftin tekur við bæði .txt og .docx, sem og .html og .htm skrám.
    2. Smelltu á „{konwerter.btn_buduj}".
    3. Skriftin mun skanna hverja línu texta og breyta lykilorðum (Þáttur, Kafli, Formáli, Eftirskrift, Upphaf) í „Heading 1" fyrirsagnir í Word-skjalinu.
    4. Senur (línur sem byrja á orðinu „Atriði") breytast í feitletraðan texta — sýnilegar í skjalinu en ósýnilegar í efnisyfirliti ElevenLabs.
    5. Allur annar texti (samræður, lýsingar) fer óbreyttur í gegn.
    6. Þú færð skrána arkitektúr_[nazwa_oryginału].docx — faglegt Word-skjal tilbúið til frekari vinnslu. Til dæmis ef inntaksskráin þín hét znieczulica.txt, mun úttaksskráin heita arkitektúr_znieczulica.docx og birtast í sömu möppu og frumskráin.

    Hreinsun samhliða: Skriftin fjarlægir sjálfkrafa HTML-merki (ef textinn kemur úr vafra eða úr staðbundinni .html skrá, t.d. þeirri sem Poliglótan bjó til) og Markdown-fyrirsagnarmerki (t.d. ### eða ####) áður en vinnsla hefst. Þú þarft ekki að hreinsa skrána handvirkt.

    ### Söguhamur: sjálfvirk flokkun leiktíma í senur (frá v15.1)

    Ef þú hleður inn í Arkitektinn skrána `opowiesci/<gra>.txt` sem Gagnvirka Söguhlutinn bjó til, mun umbreytirinn þekkja leiktímamerki (t.d. „--- Tura 7 ---" — einnig á öðrum studdum tungumálum ef þú lékst á öðru) og setja inn nýja fyrsta stigs fyrirsögn „Atriði N" á fimm leiktíma fresti (númerið byrjar á 1, á tungumáli leiksins þíns). Önnur leiktímamerki eru fjarlægð — þau birtast ekki í frásögn hljóðbókarinnar, því „Tura 7" lesið upp af TTS brýtur innlifun hlustandans. Útkoman er Word-skjal með náttúrulegu senuskipulagi, nokkrar mínútur af hljóði í hverri senu, tilbúið til innflutnings í ElevenLabs. Virkni þessi er sjálfvirk — venjulegar hljóðbókarskrár án leiktímamerkja (klassísk frásögn úr Leikstjóra) eru unnar nákvæmlega eins og áður.

    ### Öflugur kostur fyrir NVDA og ElevenLabs notendur

    „Heading 1" snið fyrir kafla er ekki bara fagurfræðilegt. Í NVDA geturðu flett yfir fyrirsagnir á ljóshraða með því að ýta á H-takkann (eða 1 fyrir fyrirsagnir á fyrsta stigi). Í stað þess að fletta í gegnum hundruð síður hoppar þú úr kafla í kafla á broti úr sekúndu. Þetta breytir vinnulaginu með löngum skjölum. Í ElevenLabs hefurðu vissu fyrir því að vélin setji sjálfkrafa inn skurði og hengist ekki upp við stjórnun hljóðklippa.
  krok_7_ksiega_swiata: |
    ## SKREF 7: Hvernig á að skrifa Heimsbókina (Kvaðning Arkitektsins og Markdown-smánámskeið)

    Gervigreind sem knýr Aðalstúdíóið skilur skipanir best þegar þær eru sniðnar á Markdown-merkingarmálinu. Ef þú gefur gervigreind í Leikstjóranum aðeins lauslega hugmynd (t.d. „tvær systur í hinum heimi"), mun vélin fara í uppnám vegna skorts á upplýsingum og búa til banallega, fyrirsjáanlega sögu sem hunsar rökfræðina.

    Til að koma í veg fyrir þetta skaltu nota ytri spjallbot (t.d. ókeypis ChatGPT eða Claude) sem persónulegan Arkitekt þinn. Í útgáfu 13.0 þarftu ekki lengur að afrita kvaðninguna úr leiðbeiningunum handvirkt — í stjórnborði Leikstjórans, rétt undir hnappinum „{rezyser.btn_zapisz_ksiege_label}", finnur þú hnappinn „{rezyser.btn_prompt_architekta_label}". Smelltu á hann og gluggi opnast með tilbúnum kvaðningstexta í „eingöngu lestur" reitnum ásamt hnappinum „Afrita á klippiborð". NVDA tilkynnir allt innihaldið strax þegar glugginn opnast — nóg er að smella á „Afrita", líma (Ctrl+V) í ChatGPT/Claude og skipta út hlutanum „[SETTU HUGMYND ÞÍNA HÉR]" fyrir eigin frumkeim sögunnar.

    Af hverju svona en ekki með afritun úr leiðbeiningunum? Glugginn í GUI hefur lykilforskot hvað aðgengi varðar: hann er innbyggður og lesinn án truflana af skjálesara, krefst ekki þess að skipta yfir í textaritil (þar sem pólskir „ogonki"-stafir og gæsalappir geta afritast rangt) og virkar eins á öllum stýrikerfum. Sama mynstur — gluggi með kvaðningu til afritunar — er einnig notað í Reglustjóranum (sjá SKREF 7b hér að neðan).

    Hvernig gervigreind svarar: Í svarinu færðu texta í tveimur hlutum. Fyrsti hlutinn er Heimsbókin lokuð í Markdown-kóðablokk (merki ```markdown … ```). Afritaðu EINGÖNGU innihald kóðablokkanna (án sjálfra merkjanna ```) og límdu í reitinn „Heimsbókin" í Leikstjóranum, og smelltu síðan á „{rezyser.btn_zapisz_ksiege_label}". Annar hlutinn er ráðlegging um hvaða skapandi ham (Skript eða Hljóðbók) hentar hugmynd þinni best — líttu á hana sem vísbendingu þegar þú velur ham í hamsvalsreitnum.

    Markdown-smánámskeið í Bókinni: eitt myllumerki (#) er aðalhluti (t.d. „# Persónur"), tvöfalt myllumerki (##) er undirhluti, bandstrik (-) búa til lista, og tvöföldar stjörnur (**texti**) feitletra algerar, óbrigðular reglur (t.d. „**Hetjan LYGAR ALDREI**"). Fyrir erlendmælandi persónu skaltu bæta við merki með hreim, t.d. „[Speaker 1: Marek] - hefur franskan hreim". Lykilorðið „akcent" er NAUÐSYNLEGT — vélin í forritinu greinir það sjálfkrafa og beitir réttum hljóðfræðireglum á samræður viðkomandi persónu.

    Ráðlegging: Mundu að uppfæra Heimsbókina þína reglulega (þegar söguþráðurinn þróast með nýjum stöðum eða mikilvægum persónum). Þetta er hægt að gera handvirkt eða með hjálp ytri spjallbots. Því ríkulegri sem grunnurinn er, þeim mun betri verða niðurstöðurnar í Leikstjóranum!
  krok_7b_manager_regul: |
    ## SKREF 7b: Reglustjóri (Ctrl+4) — orðabækur fyrir málfræðinga án Python

    Útgáfa 13.0 kynnir fjórða tólið á stikunni: Reglustjóra. Þú opnar það með Ctrl+4 eða úr Verkfæravalmyndinni. Þetta er sjónrænn skoðari fyrir möppuna dictionaries/, þar sem forritið geymir allar hljóðreglur (hreim), dulmál og hami Leikstjóra í YAML skrám (mannlesanlegt snið, einfaldara en JSON).

    Af hverju YAML? Fram að útgáfu 12.0 voru allir hreimar, skapandi hamir og síur „innbyggðar" í Python kóðann. Að bæta við nýjum hreim þurfti forritara. Í útgáfu 13.0 var þetta allt flutt í .yaml skrár í möppunni dictionaries/ — hver sem er sem getur opnað Notepad getur stillt núverandi hreim („skipta sz fyrir sh fyrir sch") eða bætt við alveg nýjum (sænskur, danskur, rússneskur mállýska).

    Hvað finnur þú í Stjórnanda Reglna:
    - Skjalamappa — fullur listi yfir allar YAML skrár í dictionaries/ með skiptingu eftir grunnmálum (nú fullkomlega útfærð: {lista_kompletnych_jezykow_natywnie}) og flokkum (akcenty/, szyfry/, rezyser/, opowiesci/, gui/). Leiðsögn með örvum eins og í Windows File Explorer, fullur NVDA-stuðningur.
    - Hnappur „{manager.btn_otworz_label}" — opnar valda skrá í sjálfgefnum Notepad kerfisins. Þú breytir, vistar, smellir á „{manager.btn_odswiez_label}" og búið.
    - Hnappur „{manager.btn_duplikuj_label}" — fljótlegasta leiðin til nýs hreims: þú tekur núverandi skrá (t.d. finski.yaml), gefur nýtt nafn (t.d. sænska), Stjórnandi býr til afrit með athugasemd „breyta reitnum merki og lýsing" og opnar hana í ritli.
    - Hnappur „{manager.btn_nowy_label}" — skapalón með vali á tegund (hreim, dulmál, ham Leikstjóra, nýtt grunnmál, reiknirit dulmál). Fyrir venjuleg tilfelli (hreim, dulmál eins og „skipta um stafi") býr skapalónið til tilbúið YAML sniðmát til að breyta. Fyrir tilfelli sem krefjast forritara (nýtt grunnmál, reiknirit eins og „blanda miðju orða") býr skapalónið til skeyti fyrir AI spjallmenni — þú límir það í ChatGPT, færð tilbúna YAML skrá, vistar í dictionaries/ og búið.

    Hagnýt notkun: Viltu bæta við sænskum hreim? Opnaðu Stjórnanda Reglna, veldu dictionaries/pl/akcenty/finski.yaml, smelltu á „Afrita", nefndu skrána sænska, breyttu reitnum merki í "Sænska (Alva / Oskar)", iso kóða í sv, breyttu nokkrum reglum um skipti og vistaðu. Farðu aftur á Heimaskjáinn og ræstu forritið aftur. Nýi hreimurinn birtist í valmynd Tungumálamanns (í Leikstjórnarham) og — ef þú bætir honum við Persónuheimsbókina („[Marek] - hefur sænskan hreim") — einnig í sjálfvirkri hreimsgreiningu Leikstjórans.

    Hvar á að leita að frekari skjölum um möppuna dictionaries/:
    - Skjal `docs/dictionaries.pl.html` (aðgengilegt í pakkanum fyrir endanotendur frá Releases flipanum) — stutt, einföld lýsing á hverri undirmöppu, 6 tilbúin dulmál, 8 tilbúnir hreimar og hugmyndir um hvað hægt er að gera sjálfstætt, án Python þekkingar.
    - Skjal `dictionaries/README.md` (aðeins aðgengilegt við klónun úr GitHub geymslu — útgáfupakkar sía .md skrár) — ítarleg tæknileg skjölun á YAML sniðinu með dæmum, lista yfir reiti, reglur um leiðslur, regex. Þetta skjal er ætlað málvísindamönnum sem þekkja grunnatriði forritunar og þróunaraðilum.
  nvda_a11y: |
    ## Mikilvæg atriði fyrir notendur skjálesara (NVDA)

    ### 1. Tilkynningar um árangur og villur

    Þegar forritið lýkur aðgerð (t.d. vista skrá eða lendir í villu), birtist valmyndargluggi með titli eins og "Árangur", "Viðvörun" eða "Villa". NVDA mun strax tilkynna þennan glugga og lesa innihald hans. Þú þarft ekki að gera neitt — valmyndirnar eru fullkomlega aðgengilegar með lyklaborðinu og fókus lendir sjálfkrafa á "OK" hnappinum. Það eru engar brellur með forskeytið "Viðvörun" — innbyggðir valmyndargluggar wxPython eru studdir beint af lesaranum.

    ### 2. Mikilvæg viðvörun: hljóðlaus bakgrunnsvinnsla

    Eftir að smellt er á hnappa eins og "{rezyser.btn_wyslij_label}" eða "{poliglota.btn_process}", byrjar forritið strax að vinna í bakgrunni. Framvindustika (Gauge) birtist á skjánum, en NVDA LES ekki gildi hennar í rauntíma — skjálesarinn er hljóður á meðan unnið er. Ekki smella á hnappinn aftur. Bíddu þar til valmyndargluggi með niðurstöðu eða villuskilaboðum birtist — NVDA mun tilkynna það sjálfkrafa.

    ### 3. Leiðsögn milli verkfæra

    Færsla milli verkfæra (Leikstjóri, Tungumálamaður, Umbreyting, Reglustjóri) fer fram í einum forritsglugga með fjórum hnöppum á verkfæraslánni eða í gegnum Verkfæri valmyndina (Alt, síðan N). Aðgengilegir lyklaborðsskammtar: Ctrl+0 (Heimasíða), Ctrl+1 (Leikstjóri), Ctrl+2 (Tungumálamaður), Ctrl+3 (Umbreyting), Ctrl+4 (Reglustjóri — nýjung í 13.0). Eftir að verkfæri er skipt, lendir fókus sjálfkrafa á lýsingu nýja einingarsins — NVDA byrjar strax að lesa nýja útsýnið.

    ### 4. Röð flipa og nöfn búnaðar

    Hvert viðmótselement hefur skýrt íslenskt nafn — NVDA mun lesa það þegar það er í fókus. Röð flipa er rökrétt: frá lýsingu verkfæris, í gegnum stillingarsvæði, til aðgerðahnappa. Það eru engin óvænt atriði — lyklaborðsleiðsögn virkar eins og í hverju öðru innfæddu Windows forriti. Allar valmyndir og allir hnappar eru á íslensku og NVDA mun lesa þau með íslenskum hreim án nokkurra viðbótarstillinga.
  changelog_9: |
    ## Mikilvæg atriði fyrir útgáfu 9.0 / Breytingaskrá

    ### Nýir eiginleikar og breytingar í útgáfu 9

    **Bilunarþolið skráning á framvindu þýðingar (BREYTING — viðgerð á alvarlegum galla)**
    Í útgáfu 8 var endurupptaka rofinna þýðinga með hljóðlausri, eyðileggjandi gildru: ef notandi fylgdi leiðbeiningum (handvirkt klipping á þýddum hluta) og hélt síðan áfram með þýðingu á restinni, opnaði forritið útgangsskrána í yfirskriftarham — eyðandi óafturkræft og óafvitandi alla greidda framvindu. Í útgáfu 9 hefur allt kerfið verið endurhannað. Hver þýdd blokk er nú þegar skráð í tímabundna skrá (.jsonl) með úthlutaðri vísitölu. Endurupptaka er fullkomlega sjálfvirk — forritið greinir sjálfkrafa skrána og endurheimtir framvindu án nokkurrar íhlutunar notanda. Eftir vel heppnaða lokun er tímabundna skráin sjálfkrafa fjarlægð.

    **Tagaviðgerð í Leikstjórnarhami (NÝTT)**
    Nýjum valkosti hefur verið bætt við Leikstjórnarhami — Tagaviðgerð. Það sprautar aðeins inn tveggja stafa ISO tungumálakóða sem notandi gefur upp, án þess að nota neinar hljóðreglur eða hreinsun. Neyðartæki ef tilbúin skrá kemur út með röngu tungumálamerki eða tungumálamerki sem vantar.

    **Sjálfvirk umbreyting .txt í .html í Þýðingaham (BREYTING)**
    Textaskrár (.txt og .md) sem þýddar eru af AI þýðanda eru nú sjálfkrafa vistaðar á .html formi með innbyggðu tungumálamerki. Þannig les NVDA strax skrána með réttri rödd — án nokkurra viðbótar skrefa af hálfu notanda.

    **Snjöll skráarheiti í Arkitektinum (BREYTING)**
    Arkitekt hljóðbóka vistar ekki lengur niðurstöðuskrána alltaf undir sama nafni arkitektura_gotowa.docx. Nú kemur nafnið frá inntaksskránni — til dæmis fyrir znieczulica.txt verður niðurstöðuskráin arkitektura_znieczulica.docx. Skráin birtist í sömu möppu og upprunalega skráin.

    ### Eiginleikar haldnir óbreyttir frá útgáfu 8

    **Afturhvarf til .txt-sniðs fyrir verkefnaskrár (BREYTING)**
    Verkefnaskrár og samantektir eru nú vistaðar á .txt formi í stað .md (Markdown). Tilraun með .md form sem sálfræðileg hindrun gegn breytingum reyndist árangurslaus — AI brýtur oft regluna um anti-closure og oft er betra að breyta skrá á staðnum og síðan endurhlaða minni, svo AI, eftir því sem mögulegt er, fái ekki leynilegt leyfi til að brjóta bannið. .txt formið er meira innsæi og læsilegt fyrir alla.

    **Regla Klipparans — ný viðvörun**
    Í leiðbeiningunum (og í framtíðarútgáfum viðmótsins) hefur verið bætt við skýrri viðvörun sem útskýrir hvað má og hvað má ekki breyta í verkefnaskrám. Notandi hefur fullan rétt til að breyta samtölum og efni, en má alls ekki breyta línustrúktúr (Aðgerð, Sena, Kafli, Prolog, Epilog) — skemmdir á þeim skemma leiðsögn NVDA, skiptingu í ElevenLabs og efnisyfirlit í Word.

    **Uppfærð Ábending Arkitekts (BREYTING)**
    Ábending til ytri spjallbots (ChatGPT/Claude) hefur verið endurhönnuð. Í stað þess að skila hráu Markdown kóða, skilar AI nú svari í tveimur skýrt aðskildum hlutum: Hluti 1 er Heimsbók lokuð í Markdown kóðablokk (auðvelt að afrita án merkja), og Hluti 2 er Ráðlegging um Ham sem venjulegur texti utan bloksins — ráðleggur hvort betra sé að nota Hráa Handritsham eða Hefðbundinn Hljóðbókarham. Lýsing á persónumerkjum hefur einnig verið breytt: í stað "hljóðlegra" er nú talað um hreim og tón raddar í merkinu, t.d. [Speaker 1: Nafn] - smámæltur og með franskan hreim.

    **Útskýring á stöðu Anti-Closure tilskipunar (SKJÖL)**
    Leiðbeiningarnar innihalda nú heiðarlega útskýringu á því að þrátt fyrir innbyggð bönn Anti-Closure brýtur líkanið ennþá oft þessa reglu, sérstaklega í Hljóðbókarham. Í stað þess að fela þennan vanda, setur útgáfa 8 málið skýrt fram og færir ábyrgðina á "handvirkri lokun" aftur til Leikstjórans — þannig er Regla Klipparans sem opinbert vinnuverkfæri og afturhvarf til venjulegs textaforms.

    ### Eiginleikar haldnir óbreyttir frá útgáfu 7

    **Showrunner Prompts — Anti-Closure tilskipun (Leikstjórn — allir hamir)**
    Allir þrír hamir Leikstjórnar halda innbyggðum showrunner tilskipunum. Hugstormun virkar eins og handritshöfundur margra þátta sjónvarpsþáttar. Hrá Handritshamur og Hljóðbókarhamur hafa bann við að ljúka texta með samantektum, siðferðislegum boðskap og frásagnarlokum — nema þegar notandi beinlínis biður um lokaorð eða epilog.

    **Stjórnun Aðgerða og Sena í rauntíma (Leikstjórn — Handritshamur)**
    Hrá Handritshamur hefur spjald með hnöppum "Setja inn Aðgerð X" og "Setja inn Sena X". Teljarar uppfærast sjálfkrafa. Hleðsla á núverandi skrá stillir báða teljara á réttan fjölda.

    **Hreinsun á sviga leikstjórnarleiðbeiningum (Tungumálamaður — Leikstjórnarhami)**
    Skriptið fjarlægir alla textahluta sem eru í sviga (t.d. "(hvíslað)", "(með innfelldum andardráttum)"). ElevenLabs les aðeins samtöl og frásögn.

    **Óendanlegt Minni og Sjálfvirk Samantekt (Leikstjórn — Sögugeymir)**
    Þegar minnivísir fer í rauða viðvörunarástand, býr Hugstormun sjálfkrafa til samantekt á sögunni og vistar hana í Langtímaminni. Að smella á "Vista Samantekt (varanlega)" býr til skrá _streszczenie.txt. Eftir að hreinsa minni og hlaða inn samantekt er hægt að halda áfram með söguna án nokkurra lengdarmarka.

    **Arkitekt hljóðbóka**
    Tólið styður lykilorð Aðgerð, Kafli, Prolog, Epilog og Upphaf sem fyrirsagnir á fyrsta stigi. Senur breytast í feitletraðan texta. Skriptið hreinsar sjálfkrafa HTML-merki og Markdown-merki áður en það er unnið.

    **Snjöll Stjórnun Kafla (Hljóðbókarhamur)**
    Sérstakt spjald með hnöppum til að setja inn Prolog, Epilog og kaflaskiptingar beint úr viðmótinu. Kaflateljarinn uppfærist sjálfkrafa. Hleðsla á núverandi skrá stillir teljarann á réttan fjölda án handvirkrar talningar.

    **Nafngift Kafla (Eftirvinnsla — Hljóðbókarhamur)**
    Módúll gengur í gegnum kafla úr vistaðri skrá og gefur þeim stutt, bókmenntalegt nafn með því að nota hraðvirkt AI líkan, sem greinir aðeins upphaf hvers kafla.

    ### Fjarlægðir eiginleikar (óbreyttir frá útgáfu 7)

    Klippikort (Handritshamur) — skipt út fyrir rauntíma stjórnun á Aðgerðum og Senum.
    Aðlögun Handrits í Hljóðbók (Handritshamur) — fjarlægt af fjárhagsástæðum. Vinnuflæðið skapaði þrjú aðskilin kostnað: sköpun handrits, möguleg samantekt við minnisofhleðslu, og loks endursköpun alls sem hljóðbókarprósa. Við mælum með að skrifa beint í Hefðbundnum Hljóðbókarham frá upphafi.

    ### Eiginleikar frá útgáfu 10.0 (haldnir óbreyttir í útgáfum 11.0 og 12.0)

    - Sjálfvirkur stillingaskrárframleiðandi golden_key.env innbyggður beint í aðalviðmót forritsins. Notandi þarf ekki lengur að búa til skrá handvirkt eða hafa áhyggjur af gildru .txt viðbótar — aðeins einn smell á hnappinn sem er í boði á upphafsskjánum, og kerfið býr til hreina, tilbúna skrá á réttum stað.
    - Algjör fjarlæging úrelts skripts napraw_api.bat, sem er ekki lengur nauðsynlegt. Vandamálið sem þetta skript leysti (röng viðbótarskrá gefin af Notepad) er nú algjörlega útrýmt þökk sé innbyggðum framleiðanda.
    - Heimsbók fyrir mörg verkefni — hvert verkefni hefur nú sína eigin lore skrá (NÝTT). Áður var ein sameiginleg skrá moje_lore.md, sem var hlaðin við hvert upphaf forritsins — óháð því hvaða verkefni þú ert að vinna að. Frá útgáfu 10 er Heimsbók náið tengd við nafn verkefnisskrárinnar: ef saga þín er skrypty/emilia_heist_audiobook.txt, þá er Heimsbók hennar skrypty/emilia_heist_audiobook.md. Hnappurinn "Vista Heimsbók varanlega" er grár þar til þú slærð inn skráarnafn — röðin er hér markviss og þvinguð af viðmótinu. Að smella á "Hlaða sögu" hleður sjálfkrafa samsvarandi .md skrá af disknum, ef hún er til. Breytingin hefur einnig hagnýtan skipulagsvídd: þú getur nú sinnt nokkrum verkefnum samtímis, og hvert þeirra mun hafa sínar eigin, einangruðu reglur heimsins og persónulista — án áhættu að Emilia úr bankaráninu endi skyndilega í geimóperu.
  changelog_11: |
    ## Nýir eiginleikar og breytingar í útgáfu 11.0

    - Nýir hreimsetningar í Tungumálamanninum (NÝTT — fjögur ný evrópsk tungumál). Fjórum nýjum valkostum fyrir hljóðfræðilega "spillingu" texta hefur verið bætt við í Leikstjórnarham: Enska (Samantha / Mark / Zira / Hazel), Franska (Thomas / Amelie / Julie), Þýska (Stefan / Markus / Katja / Hedda), Spænska (Jorge / Monica / Helena). Hver nýr hreimur sprautar sjálfkrafa inn viðeigandi ISO kóða (en, fr, de, es) í framleitt .html eða .docx skjal — NVDA notar strax rétta rödd fyrir unnin texta.

    - Þverpallur: Stuðningur fyrir macOS og Linux (BREYTING á skjölum). Kaflinn "Fyrsta keyrsla" hefur verið endurskrifaður frá grunni. Nú greinir hann þrjár leiðir: Windows notendur sækja tilbúið ZIP pakka frá Releases flipanum og keyra run.bat; Windows forritarar setja upp umhverfi með setup_dev.bat; macOS og Linux notendur setja upp umhverfi með ./setup_dev.sh og keyra ./run.sh. (Athugið: í útgáfum 11.x–13.0 hétu sömu skriftur öðruvísi — `Uruchom_Rezysera.bat`, `skonfiguruj_dev.bat`, `skonfiguruj_dev.sh`, `uruchom_rezysera.sh` — þau voru endurnefnd í 13.1 í enskum samsvörunum, því erlendir forritarar sem klónuðu geymsluna kvörtuðu yfir því að pólsku skráarnöfnin gerðu þeim erfitt fyrir að slá inn skipanir í skelinni.)

    - Mappa runtime/ — útskýring á stöðu (SKJÖL). Kaflinn "Fyrsta keyrsla" inniheldur nú skýra útskýringu á því að mappan runtime/ (Python umhverfi fyrir ZIP pakka) er aðeins dreift í tilbúnum pökkum fyrir Windows frá Releases flipanum. Í Git geymslunni er þessi mappa ekki til og ætti ekki að vera.

    - Uppfærsla á nöfnum talgervla í valmynd Tungumálamannsins (BREYTING). Nöfn radda í selectbox valmyndinni fyrir núverandi tungumál hafa verið uppfærð: Ítalska hefur nú einnig Luca (Vocalizer), Finnska hefur nú einnig Mikko (Vocalizer). Pólska hefur haldið nafninu án kommustafa (Ewa í stað Ewa með kommustaf) fyrir betri samhæfni.

    ### Eiginleikar haldnir óbreyttir frá útgáfu 10

    - Sjálfvirkur lykilskráargjafi golden_key.env innbyggður í viðmótið.
    - Heimsbók fyrir mörg verkefni (hvert verkefni hefur sína eigin .md skrá með reglum heimsins).
    - Bilunarþolið þýðingarskráningarferli (skráning í .jsonl).
    - Merkjaviðgerð í Leikstjórnarham (innsprautun ISO kóða).
  changelog_12: |
    ## Nýjar aðgerðir og breytingar í útgáfu 12.0 — Release Candidate

    - Algjör endurbygging notendaviðmótsins (SKIPULAGSBREYTING). Forritið er ekki lengur vefverkfæri sem keyrir í vafra. Allt viðmótið var skrifað upp á nýtt sem innfætt skjáborðsforrit byggt á wxPython ramma. Það er enginn staðbundinn þjónn, enginn vafri, enginn skipanalínugluggi sem keyrir í bakgrunni — það er einn, venjulegur forritsgluggi. Inngangspunkturinn er main.py.

    - Yfirlitsstika með flýtilyklahnöppum (NÝTT). Verkfærum er skipt yfir með þremur hnöppum á stikunni (Leikstjóri, Tungumálamaður, Breytingartæki) eða í gegnum Verkfæravalmyndina. Tiltækar flýtilyklar: Ctrl+0 (Heimasíða með System Check), Ctrl+1 (Leikstjóri), Ctrl+2 (Tungumálamaður), Ctrl+3 (Breytingartæki). Virkt verkfæri er sjónrænt auðkennt með feitletraðum hnappi.

    - Full fínstilling fyrir skjálesara frá grunni (NVDA, VoiceOver). Sérhver búnaður hefur fengið læsilegt aðgengisheiti. Fókus lendir sjálfkrafa á lýsingu eininganna eftir skipti á verkfæri — NVDA byrjar strax að lesa nýja sýnina. Gluggar wx.MessageBox eru tilkynntir af skjálesara á innfæðan hátt án nokkurra brella. Fliparöðin er rökrétt og samræmd í öllu viðmótinu. Sögulegar takmarkanir Streamlit og React ramma hverfa.

    - Engin stilling á eldvegg (BREYTING). Með því að fjarlægja staðbundinn vefþjón birtir Windows Firewall ekki lengur glugga þar sem spurt er um leyfi til netaðgangs við fyrstu ræsingu. Forritið ræsist einfaldlega.

    - Innfæddir skráarvalsgluggar (NÝTT). Einingarnar Tungumálamaður og Breytingartæki hafa nú hnapp „Vafra...", sem opnar kerfislægan skráarvalsglugga í stað þess að slá inn slóðina handvirkt.

    - Vernd skapandi ham (NÝTT). Í Leikstjóranum er ekki lengur hægt að skipta um vinnuham óvart (t.d. úr Audiobook í Skript) þegar minni er upptekið — viðmótið læsir skipti yfir í annan ritham þar til saga eða samantekt hefur verið hreinsuð. Hugsunarflughamur er alltaf tiltækur.

    - Harði endurstillingarhnappurinn í Leikstjóranum (NÝTT). Nýr hnappur „Loka verkefni (Harður endurstilling)" gerir kleift að hreinsa allt verkefnið með einum smelli: sögu, samantekt, Heimsbók og alla teljara — án þess að þurfa að núllstilla hvert svæði handvirkt.

    - Sjálfvirk hleðsla á skapandi ham (NÝTT). Þegar verkefni er hlaðið inn endurheimtir forritið sjálfkrafa síðast notaða vinnuham (Skript eða Audiobook) úr lýsigagnaskrá sem forritið stjórnar. Þannig stillir valreiturinn fyrir ham sig sjálfur þegar verkefnið er opnað aftur — þú þarft ekki að muna í hvaða ham þú varst að vinna.

    ### Aðgerðir sem haldist hafa óbreyttar frá útgáfu 11.0

    - Hljóðfræðilegir hreimar í Tungumálamanninum (Enska, Franska, Þýska, Spænska, Ítalska, Finnska, Íslenska).
    - Sjálfvirkur búnaður til að búa til golden_key.env skrá innbyggður í upphafsskjáinn.
    - Heimsbók fyrir mörg verkefni (hvert verkefni hefur sína eigin .md skrá).
    - Bilunarþolinn búnaður til að halda áfram þýðingu (vistun í .jsonl).
    - Tagaviðgerðarmaður í Leikstjórnarham (innspýting ISO kóða).
    - Allar gervigreindarlegar aðgerðir: Hugsunarflug, Skript, Audiobook, Söguuppsöfnunarkerfi, Óendanlegt minni, Titlagjöf.
  changelog_13: |
    ## Nýir eiginleikar og breytingar í útgáfu 13.0 — Útgáfukandídat

    - Endurskipulagning í YAML — hreimsetningar, dulmál og stillingar Leikstjórans í textaskrám (ARKITEKTÓNÍSK BREYTING, sú stærsta síðan flutningur yfir í wxPython). Fram að útgáfu 12.0 voru allar hljóðreglur (hreimsetningar) og skapandi hamir Leikstjórans (Stormur, Handrit, Hljóðbók, eftirvinnsla titla) „innbyggðar“ í Python kóðann sem fastar, föll og stífir strengir í skipunum, og heil flokkur dulmála/textaleikja var einfaldlega ekki til — þau eru kynnt með endurskipulagningu 13.0. Í útgáfu 13.0 er allt þetta í .yaml skrám í nýrri möppu `dictionaries/` — vélin (`core_poliglota.py`, `core_rezyser.py`, `przepisy_rezysera.py`) hleður þeim sjálfvirkt við ræsingu. Hagnýt áhrif: að bæta við nýjum hreim, nýju dulmáli byggðu á breytingum eða breyta hljómi kerfisskipunar fyrir einhvern ham Leikstjórans krefst ekki þekkingar á Python — aðeins textaritli. Stutt lýsing fyrir endanotendur er í `docs/dictionaries.pl.html` (fylgir með útgáfupökkum); full tæknileg skjölun á sniði — í `dictionaries/README.md` (aðeins í Git geymslu, því útgáfupakkar sía .md skrár).

    - Reglustjóri — fjórða tólið á stikunni (NÝTT, Ctrl+4). Sjónrænn könnuður fyrir `dictionaries/` möppuna með YAML skráatré (innfædd wx.TreeCtrl, fullur stuðningur NVDA) og sett af aðgerðum: „Opna í textaritli", „Ný skrá með reglum…" (töframaður með val um tegund: hreim, dulmál, ham, nýtt tungumál), „Afrita valda skrá", „Eyða skrá", „Endurnýja tré". Fyrir tilfelli sem fara út fyrir venjulegar breytingar (nýtt grunnmál, reiknirit dulmál) býr töframaðurinn til tilbúna skipun fyrir AI spjallmenni — full útskýring í nýju SKREFI 7b.

    - Skipun Arkitektsins beint í Leikstjórans pallborði (A11y BREYTING). Hingað til var skipun fyrir ytri spjallmenni til að búa til Heimsbókina aðeins í þessari leiðbeiningu — notandi þurfti að afrita hana úr textaskrá (sem getur verið vandamál á skjálesurum með íslenskum stöfum og gæsalöppum). Í útgáfu 13.0 hefur Leikstjórans pallborð nýjan hnapp „📖 Skipun Arkitekts fyrir AI…" (rétt undir „Vista Heimsbók varanlega"), sem opnar innfædda glugga með fullum texta skipunar í READONLY reit og sérstökum hnappi „Afrita í klippiborð". A11y sniðið er eins og fyrir niðurstöðugluggann í Reglustjórans töframanni — NVDA les strax allt gluggainnihaldið án viðbótarstillinga. Full lýsing í uppfærðu SKREFI 7.

    - Rússneskur hreimur í Tungumálamanninum (NÝTT — áttunda evrópska tungumálið í Leikstjórans stillingavalmynd). Í fellivalmyndinni „Leikstjórans stillingar / Hreimsetningar" bætist við valkosturinn „Rússneska (t.d. Milena / Irina / Yuri / Pavel)". Ólíkt öðrum hreimum, sem aðeins „spilla" íslenskum texta á latnesku stafi (t.d. „sj" → „sh", „v" → „v"), framkvæmir rússneski hreimurinn fulla umritun íslensks texta yfir á kyrillísku — þannig að rússneskumælandi TTS raddir (Vocalizer Milena, OneCore Irina / Pavel / Yuri, eSpeak „ru") hafa eitthvað til að „bera fram" orðin. Kortlagningin hefur verið bætt með jótun sérhljóða („ja" → „я", „je" → „е", „jo" → „ё", „ju" → „ю"), íslenskum mýkingum si/ci/ni/zi + sérhljóða (t.d. „frænka" → „цёця"), sem og sérstökum rússneskum tvíhljóðum: „ść" / „szcz" → „щ", „sz" → „ш", „cz" → „ч", „rz" → „ж", „ch" → „х".

      Hljóðskýrslun: Hreimurinn er ekki rússnesk fræðileg umritun (ISO 9, GOST, BGN/PCGN). Markmiðið er eingöngu að gera íslenskan texta hljóðlega líkan rússneskum — fyrir talgervil, ekki fyrir alvarlega umritun eiginnafna. Fyrir það verk notaðu sérstök málvísindatól.

      Tungumálakóði fyrir niðurstöðuskrá: „ru" (ISO 639-1). NVDA með valkostinn „Skipta sjálfkrafa um tungumál þegar stutt" virkt skiptir strax yfir í rússneska rödd.

    - Athugasemd um „ź": Í rússnesku er engin nákvæm samsvörun fyrir íslenska „ź", svo þessum staf er venjulega breytt í „ж" — líkt og „ż". Sumar norður-rússneskar og hvítrússneskar mállýskur bera „ź" nær „зь", en frá sjónarhóli talgervils er munurinn óverulegur. Ef málfræðingur telur að hann kjósi „зь", getur hann sjálfur skipt út þessari einu reglu í skránni `dictionaries/pl/akcenty/rosyjski.yaml` — vélin hleður YAML skrár sjálfvirkt, svo það krefst ekki endursamsetningar forritsins.

    - Útvíkkuð leiðarstika og Verkfæri valmynd (BREYTING). Stikan hefur nú fjórða hnappinn — Reglustjóri — og valmyndin „Verkfæri" styður nýja flýtileiðina Ctrl+4. Fyrri flýtileiðir (Ctrl+0 Heim, Ctrl+1 Leikstjóri, Ctrl+2 Tungumálamaður, Ctrl+3 Breytir) haldast óbreyttar.

    ### Eiginleikar haldnir óbreyttir frá útgáfu 12.0

    - Innfæddur skjáborðsviðmót byggt á wxPython (án vafra, án staðbundins netþjóns).
    - Leiðarstika með flýtileiðum (nú Ctrl+0/1/2/3/4 — bætt við Ctrl+4 fyrir Reglustjóra).
    - Full hagræðing fyrir skjálesara (NVDA, VoiceOver) — íslensk aðgengisnöfn, rétt röð á tökkum.
    - Verndun skapandi hams gegn óvart breytingu á meðan á vinnu stendur.
    - Hörð endurstilling verkefnis með einum smelli í Leikstjóra.
    - Sjálfvirk hleðsla skapandi hams úr verkefnismetaskrá.
    - Allir hreimar frá fyrri útgáfum (Enska, Franska, Þýska, Spænska, Ítalska, Finnska, Pólska) og Merkjaleiðréttari.
    - Fullir AI eiginleikar: Hugstormur, Handrit, Hljóðbók, Söguuppsöfnuður, Óendanlegt minni, Titlagjöf.
  krok_7b_manager_regul_kolejnosc_zamian: |
    ## SKREF 7b (viðbót): Röð reglna `zamiany:` skiptir máli

    Skrár í `dictionaries/<kod>/akcenty/*.yaml` innihalda lista af reglum `zamiany:` — pör `wzor → zamiana`, sem vélin framkvæmir Í RÖÐ. Hver næsta regla vinnur á útkomu fyrri. Þetta gerir kleift að byggja pípulagnir eins og „brjóta tvíhljóðið `szcz` í `shch`, og svo breyta `ch` í `h`", en opnar einnig klassíska gildru fyrir höfund tungumálapakkans.

    Gildra „röðunarhrings". Gerum ráð fyrir að fyrir spænska hreiminn sem á að líkja pólsku „ñ" við framburð Diego (Loquendo), bætir höfundur við tveimur reglum:
    1. `ñ → nj` (til að pólsku „ñ" hljómi eins og mjúkt „nj")
    2. `j → x` (til að pólsku „j" hljómi eins og spænska „j" — hljóðfræðilega /x/)

    Eftir keyrslu kemur í ljós að orð með „ñ" eru borin fram sem „nx", ekki „nj". Af hverju? Vegna þess að þegar fyrsta reglan breytir „ñ" í „nj", er nýja „j" strax gripið af annarri reglunni og breytt í „x". Niðurstaða: í stað fyrirhugaðs „ñ → nj", fáum við „ñ → nx".

    Regla um röðun (alhliða). Þegar ein regla kynnir tákn sem önnur regla hefur sem mynstur, SKIPTIR RÖÐIN MÁLI. Öruggur leiðarvísir: FYRST breyta TARGET (táknið sem er notað síðar sem `wzor` í annarri reglu) í eitthvað öruggt, SÍÐAN kynna SOURCE (táknið sem á að brotna í TARGET). Fyrir spænska dæmið rétt: fyrst `j → x`, síðan `ñ → nj`. Niðurstaða: „ñ" gefur „nj" (seinni „j" verður ekki étin, því reglan `j → x` var notuð áður, þegar „nj" var ekki enn til).

    Hvernig á að prófa. Eftir að hafa breytt röð reglna í hreimskránni, keyrðu setningu sem inniheldur BÆÐI stafi í gegnum Stjórnunarhaminn. Fyrir ES dæmi: „Niño de paja juega" → niðurstaðan verður að hafa bæði ñ hreim („ñ → nj") og j hreim („j → x"), sem er eitthvað á borð við „Ninjo de paxa xuega". Ef þú sérð „ninxo" í stað „ninjo" — er röðin röng.

    Staðfesting í vélinni (opt-in fyrir höfunda pakka). Forritið hefur innbyggða heuristík til að greina mögulegar lykkjur, en hún er sjálfgefið óvirk — því margar pípulagnir líta út eins og lykkja, þó þær séu viljandi (klassískt „szcz → shch" + „ch → h"). Til að virkja hana: stilltu umhverfisbreytuna `REZYSER_VALIDATE_ZAMIANY=1` og keyrðu forritið úr skel — úr kóðanum með `python main.py`, því frosið `.exe` í gluggaham (frá útgáfu 17.0) hefur ekki skelglugga. Vélin mun prenta eina samantektarlínu WARN fyrir hverja hreimskrá með fyrstu þremur mögulegum lykkjum og fjölda hinna. Athugaðu niðurstöðuna á prófunarsetningu — ef áhrifin eru fyrirhuguð, hunsaðu WARN.

    Hnappar til að færa reglur í Reglustjórnunarviðmótinu (drag-and-drop, „Upp / Niður") eru sérstök aðgerð sem er áætluð fyrir seinni útgáfutíma — krefst endurhönnunar á Stjórnandanum (núna sendir hann skráarbreytingar til utanaðkomandi Kerfisritils, en hefur ekki eigin reglusýn). Þar til hún er innleidd: breyttu YAML skránni handvirkt, færðu línur í `zamiany:` kaflanum, notaðu staðfestingarbreytuna ENV-var og prófaðu á prófunarsetningum.
  krok_7b_polskie_nazewnictwo: |
    ## SKREF 7b — Pólsk heiti á möppum og skrám (fyrir notendur utan Póllands)

    Forritið byggir á pólsku — það er aðaltungumál verkefnisins. Þegar þú skoðar möppuna dictionaries/ í Stjórnanda Reglna (Ctrl+4) eða opnar möppur með vistunum, rekstu á pólsk heiti. Þau eru EKKI villa né þýðingargalli: þau haldast pólsk af ásettu ráði, því þau eru innri auðkenni vélarinnar. Eftirfarandi orðalisti útskýrir hvað þau þýða.

    Undirmöppur í `dictionaries/<tungumálakóði>/` (þetta sérðu í Stjórnanda Reglna):
    - podstawy (basics) — uppsetning tungumálapakkans
    - akcenty (accents) — hljóðfræðireglur fyrir talgervla
    - szyfry (ciphers) — dulkóðunarhamir texta
    - rezyser (director) — skapandi hamir Leikstjóra-einingarinnar
    - opowiesci (stories) — hamir gagnvirkra Sagna

    Möppur með vistunum þínum (við hlið forritsins):
    - skrypty (scripts) — verkefni Leikstjórans: frásögn .txt, Heimsbók .md
    - opowiesci (stories) — vistanir gagnvirkra Sagna
  krok_2b_dostawca_zaawansowany: |
    ## SKREF 2B (ítarlegt, valfrjálst): Eigin AI-þjónustuaðili samhæfur OpenAI

    Flestir notendur ættu að halda sig við ráðlagðan Anthropic (SKREF 2) — hann gefur hæstu gæðin. Ef þú hefur þó eigin ástæðu (kostnaður, aðgangur, friðhelgi, eigið staðbundið líkan), getur þú frá útgáfu 18.4 bent á HVAÐA endpoint sem er samhæfan OpenAI API — til dæmis OpenRouter, Groq, Fireworks, DeepSeek, staðbundið Ollama eða OpenAI-compatible Gemini endpoint. Öll AI-vélin fer þá eina leið að þessum endpoint, án sérstakrar samþættingar per þjónustuaðila.

    Þetta er valkostur fyrir lengra komna: þú stillir hann handvirkt í skránni golden_key.env, með því að bæta við (eða í stað) Anthropic-lykils þremur línum og lykli valins þjónustuaðila:

    LLM_PROVIDER=openai_compat
    LLM_BASE_URL=heimilisfang_endpoint (t.d. https://openrouter.ai/api/v1)
    LLM_MODEL=nafn_líkans_hjá_þjónustuaðila (t.d. openai/gpt-4o-mini)
    OPENAI_API_KEY=þinn_lykill_hjá_þessum_þjónustuaðila

    Hvernig þetta virkar:
    •  Þegar LLM_PROVIDER=openai_compat, notar ÖLL AI-vélin (Leikstjóri, Sögur, Tungumálamaður, titlar, tungumálagreining) tilgreindan endpoint, og LLM_MODEL skrifar yfir líkansnafnið úr stillingarskrám.
    •  Þegar línan LLM_PROVIDER vantar (eða hefur gildið anthropic), virkar forritið eins og í SKREF 2 — eingöngu með Anthropic-lykli. Þú þarft ekki að breyta neinu.

    **Mikilvægt (gæði):** kerfisfyrirmæli forritsins eru skrifuð og fínstillt fyrir Claude. Annað líkan getur gefið lægri gæði — fylgt reglum heimsins verr, týnt JSON-uppbyggingu í stillingum með valmöguleikum eða skilað texta á röngu tungumáli. Þetta er meðvitað málamiðlun kostnaður↔gæði af þinni hálfu. Ef þér þykir vænt um besta niðurstöðuna, haltu þér við Anthropic.
