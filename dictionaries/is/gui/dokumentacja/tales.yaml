id: tales
tresc:
  naglowek: |
    Reżyser Audio GPT — Samtalslegar Sögur ({app.wersja})

    Annar aðalhamur forritsins við hliðina á Leikstjóra — í þetta sinn verður þú leikmaður í sögunni sem er dynamískt búin til í stað þess að vera höfundur hennar. Gervigreindin leiðir frásögnina í annarri persónu eintölu („Þú gengur í gegnum þokukenndan skóg, finnur lyktina af blautum laufum…"), og þú ákveður næstu aðgerð — skrifar hvaða aðgerð sem er með frjálsum texta eða velur eina af tölusettum valkostum.

    Einingin var hönnuð frá upphafi með blindum leikmönnum í huga — frásögnin er lesin línulega með skjálesara (NVDA) eða TTS-vél, valkostir eru í formi hnappa með raddlýsingum, hver lokið umferð er merkt með bjölluhljóði og sjálfvirkri færslu á nýjan texta.

    Þú opnar spjaldið með því að smella á "{main.btn.opowiesci}" á verkfærastikunni eða með lyklaborðsskipuninni Ctrl+5.
  krok_1_tryby_gry: |
    SKREF 1: Þrír leikir — veldu leikstíl

    Rétt undir nafnstiku leiksins finnur þú valmöguleika fyrir leikham (RadioBox). Leikhamurinn ákvarðar hvernig frásagnavélin hefur samskipti við þig:

    FRJÁLS HAMUR — þú slærð inn hvaða aðgerð sem er með frjálsum texta („ég reyni að opna dyrnar“, „ég spyr vörðinn um leiðina“, „ég flý bakdyramegin“). Frásagnavélin getur lagt til 1-3 tillögur, en þær eru aðeins vísbendingar — ekki skyldubundin leið. Mest frjálsi hamurinn, mælt með fyrir reynda leikmenn sem spinna eigin sögu.

    VALHAMUR — hver umferð endar með 3-5 tölusettum valkostum A-E í formi smellanlegra hnappa. Hver valkostur er sérstök aðgerð sem þú getur tekið. Þú getur einnig slegið inn eigin aðgerð með frjálsum texta — vélin passar hana við næsta valkost merkingarlega. Mest innsæi hamurinn fyrir blinda leikmenn: NVDA les fyrir þig alla valkosti, þú smellir á Tab á milli þeirra, Enter staðfestir.

    MINNA ILLT HAMUR — eins og Valhamur, en hver af 3-5 valkostum er siðferðilega, líkamlega eða strategískt óhagstæður. Enginn „hlutlaus“ valkostur, enginn hamingjusamur endir í þessari umferð. Hamur fyrir aðdáendur dökkra skáldskapa í anda „Tales of Consequence“ eða siðferðilegra drama.

    Flaska í Minna illt ham (frá v15.2): eftir fjórar umferðir leiks birtist aukaval, núll-númeraður valkostur „Opna flöskuna“ í valreitnum — og er áfram þar til leiksloka sem endurnýtanlegur valkostur (hverfur ekki eftir notkun, þú getur gripið til hennar ítrekað). Flaskan er valkostur „örvæntingarfullrar björgunar“, en virkni hennar er viljandi óútreiknanleg og því dramatískt þyngri, því sjaldgæfari sem hún gefur jákvæða niðurstöðu: í um 60% tilfella er innihald flöskunnar skaðlegt (eitrun, meiðsli, blindun), í 30% veldur það skyntruflunum eða draugum (ofskynjanir, breytt tal, læti), en aðeins í 10% reynist það sjaldan gagnlegt (tímabundin styrking, hjálplegur draugur, lykilupplýsingar). Dreifingin er þvinguð af Python (`random.choices` í forritinu), LLM fær tilbúinn fræ `{flokkur, lýsing}` og útskýrir það aðeins — líkanið getur ekki „fundið upp“ björgunarafleiðingu nema með útdrætti. Þannig verður flaskan ALDREI deus ex machina: jafnvel þegar gripið er til hennar í algjörri örvæntingu versnar ástandið yfirleitt. Val á frásagnarformi hennar (hvort flaskan brotnar endanlega eða er sett aftur í beltið) er á valdi frásagnavélarinnar — stundum eftir fyrstu af 60%-skaðlegu skömmtunum kemurðu aldrei aftur.

    Hægt er að skipta um ham á meðan á leik stendur, en aðeins með neyðarhnappinum „Breyta leikjaham…" við hliðina á RadioBox-inu (frá og með v15.2.3) — RadioBox-ið sjálft er fryst á þeim ham sem hefur verið læstur inni strax eftir að leikur er búinn til eða hlaðinn, sambærilegt við vörn Leikstjórans. Hnappurinn opnar samtalsglugga með viðvörun; dæmigert notkunartilvik þessarar undankomuleiðar er þegar AI í Valham eða Minna illt heldur þrjósklega áfram að búa til fleiri álitamál í stað þess að ljúka sögunni — að skipta yfir í Frjálsan ham gerir leikmanninum þá kleift að lýsa lokaatriðinu sjálfur. Ef þú vilt byrja annan leik í öðrum tóni, einfaldlega sláðu nýtt leiknafn inn í nafnareitinn — RadioBox-ið mun aflæsa sig sjálfkrafa, því forritið kannast við að þú sért að undirbúa nýtt verkefni. Athugið: flaskan er eingöngu eiginleiki Minna illt hams — þegar skipt er (gegnum undankomuleiðina) í Valham eða Frjálsan í sama leik, er tilvist hennar og umferðarvísir varðveitt í leikástandinu, en þar til þú kemur aftur í Minna illt ham birtist valkosturinn „Opna flöskuna" ekki.
  krok_2_quick_start: |
    SKREF 2: Quick Start — tilbúnir upphafsatburðir

    Undir leikjanafnareitnum finnurðu annan röð með merkinu „{opowiesci.lbl_quick_start}" og fellivalmynd (wx.Choice). Sjálfgefið val er "{opowiesci.quick_start_wlasna}" — vélin mun sjálf búa til heiminn út frá fyrstu aðgerð þinni.

    Þú getur þó valið einn af fimm tilbúnum forskriftum til að sökkva þér strax í ákveðinn heim:

    POKALYPSU SF — öld eftir vistfræðilega hörmung. Leifar mannkyns í skýlum undir Górami Świętokrzyskimi. Þú ert ungur sendiboði Klan Sztolnia með fyrsta alvarlega verkefnið. Sjálfgefinn hamur: Val.

    DÖKK FANTASÍA — landamæri Ríkisins Þriggja Strauma, níunda ár trúarstríðs. Þú ert yngri Rannsóknardómari á slóðum þorps þar sem einhver verndar andsetið barn. Sjálfgefinn hamur: Minna illt.

    URBAN FANTASÍA RANNSÓKNARMAÐUR — Varsjá 2008, októberkvöld. Þú ert einkaspæjari sem sér drauga. Viðskiptavinur vill finna eiginmann sem hvarf undir Konungshöllinni. Sjálfgefinn hamur: Val.

    GEIMHROLLVEKJA — árið 2247, rannsóknarstöð á braut um nifteindastjörnu. Þú vaknar úr dvala án skipstjóra — og án ummerkja um að skipstjórinn hafi nokkurn tíma verið til. Sjálfgefinn hamur: Frjáls (lovecraftskur andi verðlaunar spuna).

    RÓMANTÍSKUR GAMANLEIKUR — Saska Kępa apríl 2024, lítið kaffihús stendur frammi fyrir lokun. Þú ert barista-þjónn sem eigandinn segir að „vera vingjarnlegur" við feiminn ritstjóra sem þú hefur lengi viljað tala við sjálf. Sjálfgefinn hamur: Frjáls.

    Eftir að hafa valið forskrift skaltu smella á "{opowiesci.btn_nowa_gra_label}" — vélin mun sprauta stuttum lýsingu á heiminum og hetjunni inn í sig, stilla sjálfgefinn leikham (þú getur yfirskrifað hann með RadioBox áður en þú smellir á „Nýr leikur"). Fyrsta umferð LLM mun leika upphafssenuna.
  krok_3_pierwsza_gra: |
    SKREF 3: Fyrsta leikur frá grunni — án forstillingar

    Ef þú kýst fullkomið frelsi, skildu eftir "{opowiesci.quick_start_wlasna}" í reitnum Quick Start og undirbúðu þig fyrir að slá inn fyrstu aðgerðina handvirkt.

    1. Sláðu inn nafn leiksins í reitinn „{opowiesci.lbl_nazwa_gry}" (t.d. „min_ævintýri_1") — undir þessu nafni verða skráðar söguskrár, stöðuskrár og skráningarskrár.
    2. Veldu ham (Frjáls/Val/Minna illt).
    3. Smelltu á "{opowiesci.btn_nowa_gra_label}". Forritið mun búa til 2 skrár: stöðuskrá (.game.json) og stillingarskrá (.mode). Söguskráin (.txt) verður búin til eftir fyrstu umferð.
    4. Í reitnum „{opowiesci.lbl_akcja}" neðst á spjaldinu, sláðu inn fyrstu aðgerðina, t.d. „ég vakna í ókunnu herbergi". Smelltu á "{opowiesci.btn_wyslij_label}". Frásagnavélin mun opna heiminn byggt á aðgerðinni þinni — lýsing á herberginu, hljóð, persónur, fyrstu ákvarðanir.
    5. Hver umferð verður sjálfkrafa vistuð — þú getur lokað forritinu hvenær sem er og hlaðið leikinn aftur síðar með því að smella á "{opowiesci.btn_wczytaj_label}".
  krok_4_zasady_swiata: |
    SKREF 4: Reglur heimsins — eigin reglur sem vélin virðir í gegnum allt leikinn

    Frá útgáfu 15.1 finnurðu hnappinn "{opowiesci.btn_zasady_swiata_label}" fyrir ofan frásagnarreitinn. Hann opnar sérstakan ritglugga með fjölina línureit, þar sem þú getur slegið inn hvaða reglur sem er — hljóðfræðilegar, vélrænar eða dramatískar — sem frásagnarvélin mun virða í hverri næstu umferð þessa tiltekna leiks. Reglurnar eru vistaðar ásamt stöðu leiksins (.game.json), þannig að þegar leikur er hlaðinn aftur, eru þær varðveittar óbreyttar.

    Þrjú dæmigerð notkunarsvið reglna heimsins:

    HLJÓÐFRÆÐILEGAR REGLUR — stjórna framburði nafna persóna í TTS (Vocalizer, ElevenLabs). Dæmi: „Nafnið Joanna skal alltaf borið fram hart, pólsk [dż]; aldrei mjúkt [j]." Vélin mun setja þennan valkost inn í frásögnina frá næstu umferð, þannig að nafnið heldur fyrirhuguðum hljómi í hverri næstu senu þessa leiks.

    VÉLRÆNAR REGLUR — lýsa „eðlisfræðilögum" heimsins þíns, sem LLM á að fylgja. Dæmi: „Í þessum heimi virkar galdur aðeins á nóttunni; á daginn eru persónurnar venjulegt fólk." Vélin mun ekki búa til galdra í hádegi, jafnvel þótt aðgerð þinnar umferðar krefjist þess — í staðinn mun hún bjóða upp á valkost eða leiða þig að kvöldi.

    DRAMATÍSKAR REGLUR — skilgreina langtímaspennu milli persóna. Dæmi: „Andstæðingurinn Joana reynir að mýkja framburð nafns aðalpersónunnar með málfræðilegri beygingu." Vélin fléttar slíkum fíngerðum merkjum inn í samtöl Joönu, viðhalda átökum í mörgum umferðum án þess að þú þurfir að gefa endurteknar leiðbeiningar.

    Tómt reglureit = engar viðbótarreglur (sjálfgefin hegðun, eins og í v15.0). Þú þarft ekki að skilgreina reglur strax í upphafi — þú getur snúið aftur í gluggann í hvaða umferð sem er, bætt við reglum sem þú hefur tekið eftir í leiknum og smellt á "{opowiesci.dlg_zasady_swiata_btn_ok}". Breytingin tekur gildi frá næstu umferð.

    Athugið: reglur heimsins krefjast virks leiks. Ef þú smellir á "{opowiesci.btn_zasady_swiata_label}" án þess að hafa hlaðið/sett upp leik, færðu skilaboðin „{opowiesci.zasady_bez_gry_tytul}" — smelltu fyrst á "{opowiesci.btn_nowa_gra_label}" eða hlaðið vistaðan leik.
  krok_5_slash_komendy: |
    KROK 5: Slash-komendy — szybkie akcje bez API

    Í aðgerðarsvæðinu geturðu alltaf slegið inn skipun sem byrjar á skástriki `/`. Skipanirnar eru staðbundnar (þær kosta engin API-köll) og virka óháð leikstillingu. Bæði pólskar og enskar útgáfur eru samþykktar:

    /zapisz, /save — neyðir fram handvirka vistun á stöðu leiksins. Sjálfvirk vistun fer fram eftir hverja umferð, svo þessi skipun er aðallega til öryggis áður en forritið er lokað.

    /wczytaj, /load — opnar valglugga fyrir leik með lista yfir tiltæk nöfn (frá v15.2.3 í stað kerfisskrárvalglugga — beinn listi yfir vistaða leiki úr möppunni runtime/opowiesci/ sem greindir eru eftir tilvist .game.json skráar). NVDA les listann náttúrulega, blindur leikmaður þarf ekki að sigla um kerfisskrárvalgluggann. Eftir að hafa valið nafn leiksins, stillingu og fulla frásögn er endurheimt — þú getur haldið áfram frá þeirri umferð sem þú hættir á. Sama hegðun hefur hnappurinn "{opowiesci.btn_wczytaj_label}".

    Frásagnarkerfi allra Opowieści stillinga notar eitt Anthropic Claude Sonnet 4.6 líkan (frá v18.1; áður var OpenAI líkan valið fyrir hverja stillingu). Sterkara líkan heldur stranglega við reglur heimsins — þetta er sérstaklega mikilvægt í stillingunni Mniejsze zło, þar sem hver valkostur verður að vera raunverulega óhagstæður.

    /wizualizuj <opis>, /visualize <opis> — margskynjunar lýsing á núverandi sviði. Breytir ekki stöðu leiksins, býður ekki upp á valkosti — frásagnarkerfið notar öll fimm skilningarvitin (sjón, heyrn, lykt, snerting, bragð) til að sýna sviðið með meiri dýpt. Niðurstaðan birtist í sérstöku glugga, ER EKKI bætt við frásögnina né vistuð í hljóðbókarskrá. Dæmi: „/wizualizuj hvernig lítur vörðurinn út" eða „/wizualizuj lyktin af kaffihúsinu".

    /pomoc, /help — birtir valglugga með lista yfir allar tiltækar skipanir. Valglugginn er readonly og NVDA-vænn — textasvæðið fær sjálfkrafa fókus, skjálesarinn les strax allan listann án þess að þurfa að sigla.

    /koniec, /quit — lokar forritinu (eftir sjálfvirka vistun á umferð í gangi).
  krok_6_pliki_gry: |
    SKREF 6: Leikjaskrár — hvar þú finnur gögnin þín

    Hver leikur framleiðir fjórar skrár, hver í mismunandi möppu, með mismunandi hlutverkum:

    opowiesci/<nazwa>.txt — fullkomin frásögn tilbúin til að hlusta á sem hljóðbók. Hægt að opna í Notepad eða hlaða inn í Hljóðbókaarkitektinn (Breyti) og búa til Word-skrá með köflum eða tímasetningu fyrir ElevenLabs.

    runtime/opowiesci/<nazwa>.game.json — fullkomið ástand leiksins: nafn, hamur, virkar persónur, staðsetning, búnaður, opnir þræðir, síðustu 6 umferðir í styttri formi. Þetta er sannleiksgjafi til að hlaða leiknum — án þessarar skrár er ekki hægt að halda áfram.

    runtime/opowiesci/<nazwa>.story.jsonl — hrátt skrá yfir hverja umferð (beiðni leikmanns + svar módels í JSON). Skráin er ekki nauðsynleg fyrir leikinn — hún er notuð til villuleitar eða síðari greiningar (t.d. tölfræði um hversu margar umferðir ævintýrið stóð, hvaða þræði LLM kynnti).

    runtime/opowiesci/<nazwa>.mode — lýsigögn um númer ham (3=Frjáls, 4=Val, 5=Minna illt). Frá v17.4 í eigin Sögu-möppu. Áður lá skráin í runtime/skrypty/ sameiginlega með Leikstjóranum — þegar leikur og verkefni Leikstjórans báru sama nafn gat vistun annars einingarinnar þaggað niður og yfirskrifað ham hins; nú eru nafnrýmin aðskilin og gamlar skrár fluttar í eitt skipti við hleðslu leiksins.
  krok_7_pamiec_modelu: |
    KROK 7: Minnisvísir líkans — hvers vegna umferðir í gömlum leikjum krefjast ekki handvirkrar vinnu frá þér

    Undir RadioBox-stillingunni finnurðu minnisvísir líkans — framvindustiku (wx.Gauge) með stöðu lýsingu við hliðina. Vísirinn sýnir prósentu fyllingar samhengisglugga frásagnavélarinnar (biðminni reiknað upp í 128.000 tákn).

    Fjórar fyllingarstig:

    🟢 hreint (0%) — leikurinn er nýbyrjaður, engar vistaðar umferðir.
    🟢 OK (1-69%) — allt er í lagi, þú getur haldið áfram án takmarkana.
    ⚠️ viðvörun (70-89%) — vélin býr sjálfkrafa til útdrátt úr fyrri umferðum í bakgrunnsþræði. Skilaboðin „Sjálfvirkur útdráttur samhengis í gangi..." birtast — ekki senda næstu umferð fyrr en útdrátturinn er lokið. Eftir árangur verða fyrri umferðir sameinaðar í einn þéttan pakka, biðminni losnar og þú færð staðfestingu „Minnisvísir líkans endurheimtur" með fjölda sameinaðra umferða.
    🚨 VIÐVÖRUN (90%+) — sjálfvirkur útdráttur losaði ekki biðminni (sjaldgæft tilfelli eftir API bilun). Að senda næstu umferð er lokað. Þú þarft að ljúka leiknum með /koniec, síðan hlaða honum aftur — vélin mun hlaða ástand úr game.json án sögu síðustu umferða, biðminni verður ferskt.

    Í reynd er sjálfvirka minnkunarkerfið ósýnilegt — leikmaðurinn finnur ekki fyrir því að eitthvað sé að gerast, því bakgrunnsþráðurinn leysir vandamálið áður en það verður áberandi. Það er aðeins mikilvægt að þú sendir ekki næstu umferð meðan á sjálfvirkum útdrætti stendur (hnappurinn "{opowiesci.btn_wyslij_label}" er þá grár).
  krok_8_cinematic_warning: |
    SKREF 8: Cinematic Meta Warning — dramatískur millikafli eftir 150. umferð

    Eftir 150 umferðir í einum leik mun frásagnavélin EINU SINNI setja inn „Cinematic Meta Warning" — dramatískan millikafla með meta-frásögn. Hann mun birtast í sérstöku samtali með bjölluhljóði, með beinni ávarpi til þín í annarri persónu, samantekt á afrekum og viðvörun um mikilvægi ákvarðana sem teknar eru.

    Cinematic Warning ER EKKI hluti af hljóðbókarfrásögninni — .txt síuvélin fjarlægir sjálfkrafa innihald hennar (merkt með ⚠️🚨⚠️), svo þú heyrir ekki meta-athugasemd um eigin leik meðan á hlustun hljóðbókar stendur. Innihaldið fer aðeins í .story.jsonl skrána (til íhugunar eða varðveislu) og í samtali í GUI, þar sem þú getur lesið það einu sinni og haldið áfram.
  krok_10_dostepnosc_nvda: |
    SKREF 9: Aðgengi (NVDA og skjálesarar) — hannað frá upphafi

    Allur söguhlutinn hefur verið fínstilltur fyrir blinda notendur. Hvað við gerðum nákvæmlega:

    REITUR SÍÐASTA UMFERÐ — þetta er sérstakur wx.TextCtrl readonly marglínureitur (~140 px hæð) YFIR fullri frásögn. Eftir hverja umferð er reiturinn uppfærður með nýjum kafla (fyrirsögn „--- Umferð N ---" + innihald frásagnarinnar). NVDA les hann strax eftir fókus (sjálfvirkur fókus eftir vel heppnaða umferð), án þess að þurfa að fletta í gegnum hundruð lína af fullri sögu. Eftir að vistaður leikur er hlaðinn sýnir reiturinn YFIRLIT síðustu vistaðrar umferðar (úr `ostatnie_tury` buffer, skorið á setningamörkum niður í ~1200 stafi, þannig að það slítur ekki í miðju orði) með forskeyti sem upplýsir að full frásögn er í reitnum fyrir neðan.

    REITUR FULLRAR FRÁSAGNAR — þetta er wx.TextCtrl readonly marglínureitur sem vex eftir hverja umferð. NVDA les línulega alla frásögnina, þú getur flett með örvahnöppum innan textans, afritað hluta með Ctrl+C. Reiturinn er aldrei breytanlegur — þú breytir sögunni AÐEINS með nýrri umferð, með nýja hnappnum „Opna frásagnarskrá…" (frá v15.2.3, lýst hér að neðan) eða með beinni breytingu á .txt skrá úr skráaskoðaranum. Þessi reitur er samstilltur við skrána `opowiesci/<nazwa>.txt`, þú getur litið á hann sem forskoðun á hljóðbók.

    HNAPPUR „{opowiesci.btn_otworz_narracje_label}" (frá v15.2.3) — við hliðina á hnöppunum „Nýr leikur"/„Hlaða"/„Vista" birtist fjórði: „Opna frásagnarskrá…". Hann opnar skrána `opowiesci/<nazwa>.txt` í kerfis-textaritlinum (Notepad í Windows, TextEdit í macOS, sjálfgefnum GUI ritli í Linux — sambærilegt við hvernig Reglustjórnandinn opnar YAML skrár eða hvernig heimaspjaldið opnar `golden_key.env`). Dæmigert notkunartilvik er valkostur við undankomuleiðina „Breyta leikjaham…" → Frjáls: í stað þess að stökkva í annan ham til að skrifa lokaatriðið, geturðu einfaldlega opnað .txt skrána og bætt við lokaatriðinu handvirkt. VIÐVÖRUN UM HÆTTU Á ÓSAMRÆMI: áður en skráin er opnuð sýnir forritið modal viðvörunardialog, því .txt er AÐEINS frásögnin fyrir TTS, en sannleiksgjafi leikástandsins (persónur, staðsetning, búnaður, þræðir) er sérstök `.game.json` skrá. Breyting á .txt uppfærir ekki ástandið — næsta LLM umferð fær heiminn fyrir breytingu þína, þannig að t.d. þú getur lýst í skránni að persóna dó, en í leikástandinu er hún enn á lífi og birtist í næstu umferð. Notaðu meðvitað, helst aðeins til að bæta við lokaatriðinu, eftir sem þú ætlar hvort sem er ekki að fara í fleiri umferðir.

    DÝNAMÍSKIR VALHNAPPAR — í valmöguleikum og Minna illu hömum býr hver umferð til nýja wx.Button-a á valmöguleikasvæðinu. Hver hefur tooltip sem NVDA les („Veldu: farðu áfram í skóginn"). Tab á milli þeirra virkar eðlilega. Enter á völdum hnappi sendir sjálfkrafa þetta val til frásagnavélarinnar.

    FELA TÓM SVÆÐI — í Frjálsum ham er valmöguleikasvæðið ALGJÖRLEGA falið (wx.Hide), ekki bara grátt — Tab sleppir því, NVDA dregur það ekki inn í lista yfir hluti. Þetta kemur í veg fyrir rugling hjá notanda sem lendir í tómum placeholder. Í ham 4 og 5 birtist svæðið aðeins eftir að svar líkaninu hefur verið staðfest (ekki tómur valkostalisti); ofskynjun líkaninu (tómir valkostir) leiðir til fallbacks í frjálsan texta án þess að sóða til viðmótið.

    HLJÓÐMERKI — hver lokið umferð er merkt með wx.Bell (kerfisklukku), á eftir fylgir sjálfvirk tilfærsla á fókus á reitinn „Síðasta umferð". NVDA mun þá lesa ferska umferð frá upphafi, án þess að þurfa að sigla í gegnum alla söguna fram að þessu.

    LITIR Á MINNISSTÖÐU — vísir á minnisstöðu líkaninu breytir lit leturs (grænn/appelsínugulur/rauður) í samræmi við fyllingarstig. Fyrir notendur sem sjá er þetta viðbótar sjónrænt merki; NVDA les samt texta stöðunnar, svo blindir missa ekki af upplýsingum.

    LYKLARFLÝTILEIÐIR — allir takkar hafa `&` tákn fyrir einni af stöfum merkimiðans, sem virkjar flýtileið Alt+stafur. Virkar eins og í öðrum hlutum forritsins.
  najczestsze_problemy: |
    Najczęstsze problemy

    Problem: Po kliknięciu "{opowiesci.btn_nowa_gra_label}" pojawia się komunikat „Brak klucza API".
    Przyczyna i rozwiązanie: Plik golden_key.env w głównym folderze aplikacji nie ma poprawnego klucza Anthropic (to on zasila tryb Opowieści). Wróć do ekranu startowego (przycisk Home), kliknij "{home.btn_generate}" i postępuj zgodnie z instrukcjami (KROK 2 głównego manuala).

    Problem: Próbuję wysłać kolejną turę, ale przycisk "{opowiesci.btn_wyslij_label}" jest wyszarzony.
    Przyczyna i rozwiązanie: Trwa auto-streszczenie kontekstu albo generacja Cinematic Warning w wątku tła. Status pamięci pokaże „Auto-streszczenie kontekstu w toku…". Poczekaj kilkanaście sekund — przycisk odblokuje się automatycznie po sukcesie.

    Problem: Komunikat „Pamięć modelu przeładowana" blokuje grę.
    Przyczyna i rozwiązanie: Auto-streszczenie nie zwolniło bufora (np. rate limit API Anthropic). Zakończ grę komendą /koniec albo zamknij aplikację, potem wczytaj ją ponownie — silnik załaduje tylko stan z game.json bez historii ostatnich tur.

    Problem: W trybie Wyborów silnik nie wygenerował przycisków, mimo że spodziewałem się ich.
    Przyczyna i rozwiązanie: Halucynacja modelu — mimo trybu 4 LLM zwrócił pustą tablicę wyborów. Aplikacja świadomie ukrywa wtedy obszar wyborów (zamiast pokazać pusty placeholder) i pozwala kontynuować free-textem. Następna tura prawdopodobnie wygeneruje wybory poprawnie.

    Problem: Pliki .game.json i .story.jsonl nie są widoczne na pulpicie.
    Przyczyna i rozwiązanie: To celowe — runtime/ jest folderem systemowym dla zwykłych użytkowników, niewidocznym z poziomu eksploratora plików. Plik narracji (.txt) trafia do opowiesci/ — tam go znajdziesz.
