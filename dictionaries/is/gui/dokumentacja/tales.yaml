id: tales
tresc:
  naglowek: |
    # Reżyser Audio GPT — Samtalslegar Sögur ({app.wersja})

    Annar aðalhamur forritsins við hliðina á Leikstjóra — í þetta sinn verður þú leikmaður í sögunni sem er dynamískt búin til í stað þess að vera höfundur hennar. Gervigreindin leiðir frásögnina í annarri persónu eintölu („Þú gengur í gegnum þokukenndan skóg, finnur lyktina af blautum laufum…"), og þú ákveður næstu aðgerð — skrifar hvaða aðgerð sem er með frjálsum texta eða velur einn af tölusettum valkostum.

    Einingin var hönnuð frá upphafi með blindum leikmönnum í huga — frásögnin er lesin línulega með skjálesara (NVDA) eða TTS-vél, valkostir eru í formi hnappa með raddlýsingum, hver lokin umferð er merkt með bjölluhljóði og sjálfvirkri færslu á nýjan texta.

    Þú opnar spjaldið með því að smella á "{main.btn.opowiesci}" á verkfærastikunni eða með lyklaborðsskipuninni Ctrl+5.
  krok_1_tryby_gry: |
    ## SKREF 1: Þrír leikstílar — veldu spilunarstíl

    Rétt fyrir neðan nafnastiku leiksins finnur þú val-reit fyrir stíl. Stíllinn ákvarðar hvernig frásagnarvélin heldur uppi samræðum við þig:

    FRJÁLS STÍLL — þú skrifar hvaða aðgerð sem er í frjálsum texta („ég reyni að opna hurðina", „ég spyr vörðinn til vegar", „ég flý niður bakstigann"). Frásagnarvélin getur stungið upp á 1-3 tillögum, en það eru einungis ábendingar — ekki skyldubundin leið. Frjálsasti stíllinn, mælt með fyrir reynda leikmenn sem spinna sína eigin sögu.

    VALSTÍLL — hver umferð endar með 3-5 tölusettum valkostum A-E í formi smellanlegra hnappa. Hver valkostur er ákveðin aðgerð sem þú getur framkvæmt. Þú getur einnig skrifað eigin aðgerð í frjálsum texta — vélin passar hana við næsta valkost merkingarlega. Innsæisríkasti stíllinn fyrir blinda leikmenn: NVDA les upp alla valkostina fyrir þig, þú smellir á Tab milli þeirra, Enter staðfestir.

    STÍLLINN MINNA ILLT — eins og Valstíll, en hver af 3-5 valkostunum er óhagstæður siðferðislega, líkamlega eða hernaðarlega. Enginn „hlutlaus" valkostur, enginn hamingjusamur endir í þeirri umferð. Stíll fyrir unnendur dökkrar skáldsögu í anda „Tales of Consequence" eða siðferðislegra drama.

    Flaskan í stílnum Minna illt (frá útgáfu 15.2): eftir fjórar umferðir í leiknum birtist í valreitnum aukalegur, NÚLL-tölusettur valkostur „Opnaðu flöskuna" — og hann helst þar til leiksloka sem endurnýtanlegur valkostur (hverfur ekki eftir notkun, þú getur gripið til hans hvað eftir annað). Flaskan er valkostur „örvæntingarfullrar bjargar", en virkni hennar er vísvitandi ófyrirsjáanleg og því dramatískt þyngri sem sjaldnar hún gefur jákvæða niðurstöðu: í um það bil 60% tilvika er innihald flöskunnar skaðlegt (eitrar, særir, blindar), í 30% tilvika veldur það truflun á skynjun eða anda (ofskynjanir, breytt tal, skelfing), og einungis í 10% tilvika reynist það sjaldan-hagstætt (tímabundin styrking, hjálpsamur andi, mikilvæg upplýsing). Dreifinguna knýr Python (`random.choices` innan forritsins), LLM fær tilbúið sáðgildi `{kategoria, opis}` og gerir einungis frásögn úr því — líkanið hefur enga leið til að „finna upp" heillavænlega útkomu utan slembivalsins. Þannig verður flaskan ALDREI að deus ex machina: jafnvel þótt gripið sé til hennar á stundu ýtrustu örvæntingar versnar staðan yfirleitt. Val á frásagnarformi hennar (hvort flaskan brotni endanlega, eða hvort hún sé sett aftur við beltið) er á forræði frásagnarvélarinnar — stundum, eftir fyrsta af 60%-skaðlegu skömmtunum, kemur hún aldrei aftur.

    Hægt er að breyta stíl meðan á leik stendur, en einungis með neyðarhnappinum „Breyta leikstíl…" við hlið val-reitsins fyrir stíl (frá útgáfu 15.2.3) — sjálfur val-reiturinn er frystur á staðfestum stíl strax eftir að leikur er stofnaður eða hlaðinn inn, á sama hátt og öryggið í Leikstjóranum. Hnappurinn opnar viðvörunarglugga; dæmigert notkunartilvik þessarar smugu er þegar gervigreindin í Valstíl eða stílnum Minna illt heldur þrjóskulega áfram að búa til nýjar klemmur í stað þess að ljúka sögunni — stökk yfir í Frjálsan stíl gerir leikmanni þá kleift að lýsa lokaatriðinu sjálfur. Ef þú vilt stofna annan leik í öðrum tóni, nægir að skrifa nýtt heiti leiks í nafnareitinn — val-reiturinn losnar sjálfkrafa, því forritið greinir að þú sért að undirbúa nýtt verkefni. Athugið: flaskan er einkenni sem tilheyrir eingöngu stílnum Minna illt — við umskipti (í gegnum smuguna) yfir í Valstíl eða Frjálsan stíl innan sama leiks, varðveitast tilvist hennar og umferðateljari í leikstöðunni, en þar til þú snýrð aftur í Minna illt birtist valkosturinn „Opnaðu flöskuna" ekki.
  krok_2_quick_start: |
    ## SKREF 2: Quick Start — tilbúnar opnunarsenur

    Undir reitnum fyrir heiti leiksins finnur þú aðra röð með merkimiðanum „{opowiesci.lbl_quick_start}" og fellivalmynd. Sjálfgefna staðan er "{opowiesci.quick_start_wlasna}" — vélin mun sjálf finna upp heiminn út frá fyrstu aðgerð þinni.

    Þú getur þó valið eitt af fimm tilbúnum forstillingum til að sökkva þér strax inn í ákveðinn heim:

    EFTIRHEIMSENDIS-SF — öld eftir umhverfishamfarir. Leifar mannkynsins í skjólum undir Świętokrzyskie-fjöllum. Þú ert ungur sendiboði Klans Sztolnia með fyrsta alvarlega verkefnið. Sjálfgefinn háttur: Valhamur.

    DARK FANTASY — landamæri Konungsríkis Þriggja Strauma, níunda ár trúarstríðsins. Þú ert yngri Rannsóknardómari á slóð þorps þar sem einhver verndar barn sem er undir yfirráðum illra afla. Sjálfgefinn háttur: Minna illt.

    URBAN FANTASY SPÆJARI — Varsjá 2008, októberkveldi. Þú ert einkaspæjari sem sér drauga. Viðskiptavinurinn vill finna eiginmann sinn sem hvarf nærri Konunglega kastalanum. Sjálfgefinn háttur: Valhamur.

    KOSMÍSKUR HRYLLINGUR — árið 2247, rannsóknarstöð á braut um nifteindastjörnu. Þú vaknar úr dvala án skipstjóra — og án nokkurra ummerkja um að skipstjórinn hafi nokkurn tíma verið til. Sjálfgefinn háttur: Frjáls hamur (Lovecraft-stemning verðlaunar spuna).

    RÓMANTÍSK SAMFÉLAGSGAMANLEIKUR — Saska Kępa, apríl 2024, lítið kaffihús stendur frammi fyrir lokun. Þú ert baristi-þjónn, þar sem eigandinn biður þig um að „vera vingjarnleg" við feiminn ritstjóra sem þú hafðir lengi viljað tala við sjálf. Sjálfgefinn háttur: Frjáls hamur.

    Eftir að hafa valið forstillingu skaltu smella á "{opowiesci.btn_nowa_gra_label}" — vélin mun sprauta inn stuttri lýsingu á heiminum og hetjunni, stilla sjálfgefna leikhaminn (þú getur skrifað yfir hann með hamsvalreitnum áður en þú smellir á „Nýr leikur"). Fyrsta umferð LLM mun leika opnunarsenuna.
  krok_3_pierwsza_gra: |
    ## SKREF 3: Fyrsta leikurinn frá grunni — án forstillingar

    Ef þú kýst fullt frelsi, skildu „{opowiesci.quick_start_wlasna}" eftir í Quick Start reitnum og búðu þig undir að slá inn fyrstu aðgerðina handvirkt.

    1. Sláðu inn heiti leiksins í „{opowiesci.lbl_nazwa_gry}" stikuna (t.d. „moja_przygoda_1") — undir því heiti verða skrár fyrir frásögn, stöðu og kladda vistaðar.
    2. Veldu stillingu (Frjáls/Val/Minna illt).
    3. Smelltu á „{opowiesci.btn_nowa_gra_label}". Forritið stofnar nýjan leik og byrjar frá þeim tíma að vista stöðu hans sjálfkrafa. Skráin með tilbúinni frásögn verður til eftir fyrsta leiktímann.
    4. Í reitinn „{opowiesci.lbl_akcja}" neðst á spjaldinu skaltu slá inn fyrstu aðgerðina, t.d. „ég vakna í óþekktu herbergi". Smelltu á „{opowiesci.btn_wyslij_label}". Frásagnarvélin opnar heiminn á grundvelli aðgerðar þinnar — lýsing á rýminu, hljóð, persónur, fyrstu ákvarðanir.
    5. Sérhver leiktími verður vistaður sjálfkrafa — þú getur hvenær sem er lokað forritinu og hlaðið leiknum inn aftur með hnappinum „{opowiesci.btn_wczytaj_label}".
  krok_4_zasady_swiata: |
    ## SKREF 4: Reglur heimsins — eigin reglur sem vélin virðir allan leikinn í gegn

    Frá útgáfu 15.1 finnur þú hnappinn "{opowiesci.btn_zasady_swiata_label}" fyrir ofan frásagnarreitinn. Hann opnar sérstakan ritgluggann með fjöllínureit þar sem þú getur skrifað hvaða reglur sem er — hljóðfræðilegar, kerfislegar eða dramatúrgískar — sem frásagnarvélin mun virða í hverri einustu umferð þessa tiltekna leiks upp frá því. Reglurnar eru vistaðar ásamt stöðu leiksins, þannig að við endurhleðslu leiksins haldast þær óbreyttar.

    Þrjár dæmigerðar notkanir heimsreglna:

    HLJÓÐFRÆÐILEGAR REGLUR — stýra framburði nafna persóna í gegnum TTS (Vocalizer, ElevenLabs). Dæmi: „Nafnið Joanna skal alltaf borið fram hart, pólskt [dż]; aldrei mjúkt [j]." Vélin mun setja þennan framburðarvarianta inn í frásögnina frá og með næstu umferð, þannig að nafnið Joanna heldur ætluðum hljómi í hverri síðari senu þessa leiks.

    KERFISLEGAR REGLUR — lýsa „eðlisfræðilögmálum" heims þíns sem GPT-líkanið á að fylgja. Dæmi: „Í þessum heimi virkar galdur aðeins á nóttunni; á daginn eru persónurnar bara venjulegt fólk." Vélin mun ekki búa til galdra um hádegisbil, jafnvel þótt atburðarás umferðar þinnar krefjist þess — í staðinn mun hún stinga upp á öðrum kosti eða leiða þig í átt að rökkri.

    DRAMATÚRGÍSKAR REGLUR — skilgreina langtíma spennu milli persóna. Dæmi: „Andstæðingurinn Joana reynir að mýkja framburð nafns aðalpersónunnar með málfræðilegri beygingu." Vélin fléttar slíkum lúmskum vísbendingum inn í samtöl Joönu og heldur þannig átökunum lifandi yfir margar umferðir án þess að þú þurfir að endurtaka fyrirmælin.

    Tómur reglureitur = engar viðbótarreglur (sjálfgefin hegðun, eins og í v15.0). Þú þarft ekki að skilgreina reglur strax í upphafi — þú getur snúið aftur í gluggann í hvaða umferð sem er, bætt við reglum sem þú tókst eftir í leiknum og smellt á "{opowiesci.dlg_zasady_swiata_btn_ok}". Breytingin tekur gildi frá og með næstu umferð.

    Athugið: heimsreglur krefjast virks leiks. Ef þú smellir á "{opowiesci.btn_zasady_swiata_label}" án þess að hafa hlaðið inn/stofnað leik, færðu skilaboðin „{opowiesci.zasady_bez_gry_tytul}" — smelltu fyrst á "{opowiesci.btn_nowa_gra_label}" eða hladdu inn vistuðum leik.
  krok_5_slash_komendy: |
    ## SKREF 5: Skástrik-skipanir — hraðar aðgerðir án API

    Í aðgerðarreitnum getur þú hvenær sem er slegið inn skipun sem byrjar á skástriki `/`. Skipanirnar eru staðbundnar (kosta engin API-köll) og virka óháð leikstillingu. Bæði pólsk og ensk afbrigði eru samþykkt:

    /zapisz, /save — knýr fram handvirka vistun leikstöðunnar. Sjálfvirk vistun á sér stað eftir hverja umferð, svo þessi skipun er fyrst og fremst til öryggis fyrir lokun forritsins.

    /wczytaj, /load — opnar val-glugga fyrir leiki með lista yfir tiltæk nöfn (frá v15.2.3, í stað kerfisglugga fyrir skrár — beinn listi yfir öll þín vistuðu spil). NVDA les listann eðlilega, blindur leikmaður þarf ekki að rata um kerfisglugga fyrir skrár. Eftir að nafn leiksins hefur verið valið eru stillingin og öll frásögnin endurheimt — þú getur haldið áfram frá þeirri umferð sem þú hættir í. Hnappurinn "{opowiesci.btn_wczytaj_label}" hegðar sér nákvæmlega eins.

    Frásagnarvélin í öllum stillingum Sagna notar eina, sameiginlega líkan (sjálfgefið og mælt er með Anthropic Claude Sonnet 5; frá v18.4 getur lengra kominn notandi tilgreint eigin endapunkt sem er samhæfur við OpenAI — sjá aðalhandbókina, SKREF 2B). Öflugra líkanið heldur sig strangt við reglur heimsins — þetta skiptir sérstöku máli í stillingunni Minna illt, þar sem hver valkostur verður að haldast raunverulega óhagstæður.

    /wizualizuj `<opis>`, /visualize `<opis>` — fjölskynjanleg lýsing á núverandi atriði. Breytir ekki leikstöðunni, býður ekki upp á val — frásagnarvélin notar öll fimm skynfærin (sjón, heyrn, lykt, snertingu, bragð) til að sýna atriðið með meiri dýpt. Niðurstaðan birtist í sérstökum glugga og bætist EKKI við frásögnina. Dæmi: „/wizualizuj hvernig lítur vörðurinn út" eða „/wizualizuj lykt kaffihússins".

    /pomoc, /help — birtir samtalsglugga með lista yfir allar tiltækar skipanir. Glugginn er skrifvarinn og NVDA-vænn — textareiturinn fær sjálfkrafa fókus, skjálesarinn les strax upp allan listann án þess að þörf sé á að rata um.

    /koniec, /quit — lokar forritinu (eftir sjálfvirka vistun umferðarinnar sem er í gangi).
  krok_6_pliki_gry: |
    ## SKREF 6: Skrárnar þínar — hvar finnur þú tilbúna frásögnina

    Frá þínu sjónarmiði skiptir máli ein skrá — tilbúin frásögn:

    `opowiesci/<nazwa>.txt` — full frásögn tilbúin til hlustunar sem hljóðbók, í möppunni opowiesci/ við hliðina á forritinu. Þú getur opnað hana í Notepad, lesið hana með skjálesara eða hlaðið henni inn í Arkitekt Hljóðbóka (Konverter) og búið til Word-skjal með köflum eða tímalínu fyrir ElevenLabs.

    Öllu leikástandi — persónum, staðsetningu, búnaði, opnum þráðum og sögu fyrri umferða — stjórnar forritið sjálfkrafa fyrir þig. Það vistar hann eftir hverja umferð í falinn kerfisskrámöppu sem þú þarft ekki (og ættir ekki) að snerta. Til að hlaða vistað leik er notaður hnappurinn "{opowiesci.btn_wczytaj_label}" eða skipunin /wczytaj — þær sýna þér lista yfir öll leikjanna þín eftir nafni. Þannig getur þú hvenær sem er lokað forritinu og snúið aftur að leiknum síðar, án þess að hafa áhyggjur af því að vista neitt handvirkt.
  krok_7_pamiec_modelu: |
    ## SKREF 7: Minnismæling líkansins — af hverju þurfa þú ekki að vinna handvirkt í gömlum leikjum

    Undir reitnum fyrir val á ham finnurðu minnismælingu líkansins — framvindustiku með stöðulýsingu við hliðina. Mælingin sýnir hversu stór hluti samhengisglugga frásagnarvélarinnar er fylltur (biðminni reiknað upp í 128 000 tákn).

    Fjórir fyllningarstig:

    🟢 hreint (0%) — leikurinn er nýbyrjaður, engar vistar leggir.
    🟢 í lagi (1-69%) — allt eðlilegt, þú getur haldið áfram án takmarkana.
    ⚠️ viðvörun (70-89%) — vélin myndar sjálfkrafa samantekt á fyrri leggjum í bakgrunnsþræðinum. Skilaboðin „Sjálfvirk samantekt samhengis í gangi…" birtast — ekki senda næsta legg á meðan samantektin er í gangi. Þegar það tekst verða fyrri leggir felldir saman í eina þéttingu, biðminnið losnar og þú færð staðfestinguna „Minni líkansins endurheimt" með fjölda samandreginna leggja.
    🚨 VIÐVÖRUN (90%+) — sjálfvirk samantekt losnuðu ekki biðminnið (sjaldgæft tilvik eftir tengingarbilun við gervigreind). Sending næsta leggs er lokuð. Þvingaðu leikinn til loka með /koniec, hladdu hann síðan aftur — vélin hleður sjálfkrafa vistað leikstand án sögu síðustu leggja og biðminnið verður ferskt.

    Í reynd er sjálfvirka minnkunarferlið ósýnilegt — leikmaðurinn finnur ekki til þess að eitthvað sé að gerast, því bakgrunnsþræðurinn leysir vandann áður en hann verður merkjanlegur. Það eina sem skiptir máli er að þú sendur ekki næsta legg á meðan sjálfvirk samantekt er í gangi (hnappurinn „{opowiesci.btn_wyslij_label}" er þá gráur).
  krok_8_cinematic_warning: |
    ## SKREF 8: Cinematic Meta Warning — dramatískt hlé eftir 150. leikinn

    Eftir 150 leiki í einni lotu mun frásagnarvélin EINU SINNI setja inn „Cinematic Meta Warning" — meta-frásagnarlegt dramatískt hlé. Það birtist í sérstökum glugga með bjölluhljóði, með beinni ávarpi til þín í annarri persónu, samantekt á afrekum og viðvörun um þyngd þeirra ákvarðana sem teknar eru.

    Cinematic Warning er EKKI hluti af hljóðbókarfrásögninni — forritið klippir sjálfkrafa efni þess úr frásagnarskránni (merkt með ⚠️🚨⚠️ merkjum), svo þú heyrir ekki meta-athugasemd um eigin leik þegar þú hlustar á hljóðbókina. Þú sérð hana aðeins einu sinni, í sérstökum svarglugga, þar sem þú getur lesið hana og haldið leiknum áfram í ró og ro.
  krok_10_dostepnosc_nvda: |
    ## SKREF 9: Aðgengi (NVDA og skjálesarar) — hannað frá grunni

    Allt Sögur eininguna hefur verið fínstillt fyrir blinda leikendur. Hér er nákvæmlega hvað við gerðum:

    REITUR SÍÐASTA LEIKTÍÐ — þetta er sérstakur textareitur sem er eingöngu til lestrar (nokkrar línur á hæð) FYRIR OFAN fulla frásögnina. Eftir hverja leiktíð er reiturinn uppfærður með nýjum kafla (fyrirsögnin „--- Tura N ---" + efni frásagnarinnar). NVDA les hann strax þegar hann fær fókus (sjálfvirkt eftir vel heppnaða leiktíð), án þess að þurfa að fletta í gegnum hundruð lína af fullri sögu. Þegar vistuð leikur er hlaðinn sýnir reiturinn SAMANTEKT síðustu vistaðrar leiktíðar (klippt við setningamörk í um 1200 stafi, þannig að hún brotnar ekki mitt í orði) með forskeyti sem gefur til kynna að full frásögn sé í reitnum hér að neðan.

    REITUR FULLRAR FRÁSAGNAR — þetta er skrunanlegur textareitur (eingöngu til lestrar) sem vex eftir hverja leiktíð. NVDA les alla frásögnina línulega, þú getur flett með örvalyklum innan textans, afritað kafla með Ctrl+C. Reiturinn er aldrei breytanlegur — þú breytir sögunni EINGÖNGU með nýrri leiktíð, með nýjum hnappi „Opnaðu frásögnarskrá…" (frá v15.2.3, lýst hér að neðan) eða með beinum breytingum á .txt skránni úr Skráarstjóra. Þessi reitur er samstilltur við skrána `opowiesci/<nazwa>.txt`, þú getur litið á hann sem forskoðun hljóðbókar.

    HNAPPUR „{opowiesci.btn_otworz_narracje_label}" (frá v15.2.3) — við hliðina á hnöppunum „Ný leikur"/„Hlaða"/„Vista" birtist fjórði hnappurinn: „Opnaðu frásögnarskrá…". Hann opnar skrána `opowiesci/<nazwa>.txt` í kerfisritli (Notepad á Windows, TextEdit á macOS, sjálfgefinn GUI ritill á Linux — á sama hátt og Reglustjóri opnar YAML skrár eða heimapanelinn opnar `golden_key.env`). Dæmigerð notkun er sem valkostur við „Breyta leikhamur…" → Frjáls: í stað þess að skipta yfir í annan ham til að skrifa lokið, getur þú einfaldlega opnað .txt skrána og bætt við lokasenunni handvirkt. VARÚÐ VEGNA MISRÆMIS: áður en skráin er opnuð sýnir forritið viðvörunarglugga, vegna þess að .txt er EINGÖNGU frásögn fyrir TTS, en uppspretta sannleikans um leikstöðuna (persónur, staðsetning, búnaður, þræðir) er sérstakt, falið leikvistafall sem forritið stjórnar sjálft. Breytingar á .txt uppfæra ekki stöðuna — næsta LLM leiktíð fær heiminn eins og hann var fyrir breytingarnar þínar, þannig að þú getur til dæmis lýst því í skránni að persóna hafi dáið, en í leikstöðunni mun hún enn vera á lífi og birtast í næstu leiktíð. Notaðu meðvitað, best eingöngu til að bæta við lokasenunni, eftir hverja þú ætlar þér ekki fleiri leiktíðir.

    KVIKIR VALHNAPPÁR — í Vals- og Minna-illu-hömunum skapar hver leiktíð nýja hnappa á valsvæðinu. Hver þeirra hefur ábendingu (tooltip) sem NVDA les („Veldu: farðu áfram inn í skóginn"). Tab á milli þeirra virkar náttúrulega. Enter á völdum hnappi sendir valið sjálfvirkt til frásagnarvélarinnar.

    FELNING TÓMRA SVÆÐA — í Frjálsum ham er valsvæðið ALGERLEGA falið, ekki bara grátt — Tab sleppir því, NVDA mun ekki taka það með í þáttalistann. Þetta kemur í veg fyrir rugling leikanda sem lendir í tómum staðgengil. Í hömunum 4 og 5 birtist svæðið eingöngu eftir vel heppnaða staðfestingu á svari líkansins (ótóm valsfylki); ofskynjanir líkansins (tóm val) leiða til varaúrræðis í frjálsan texta án þess að sópa ruslinu í viðmótið.

    HLJÓÐMERKI — hverri lokinni leiktíð fylgir kerfisbjalla, á eftir henni kemur sjálfvirk flutningur fókuss á reitinn „Síðasta leiktíð". NVDA les þá nýju leiktíðina frá upphafi, án þess að þurfa að fletta í gegnum alla fyrri sögu.

    LITAÐAR MINNISSTAÐAR — minnismerki líkansins breytir leturlit (grænn/appelsínugulur/rauður) í samræmi við fyllingstig. Fyrir sjáandi notendur er þetta viðbótarsjónrænt merki; NVDA les stöðutextann engu að síður, þannig að blindir missa ekki af upplýsingum.

    LYKLABORÐSFLÝTILYKLAR — allir hnappar hafa `&` tákn á undan einum af stöfum merkimiðans, sem virkjar flýtilykil Alt+stafur. Virkar nákvæmlega eins og í öðrum einingum forritsins.
  najczestsze_problemy: |
    ## Algengustu vandamálin

    Vandamál: Eftir að smella á „{opowiesci.btn_nowa_gra_label}" birtist skilaboðin „Engin API-lykill".
    Orsök og lausn: Skráin golden_key.env í aðalmöppu forritsins er ekki með gildan Anthropic-lykil (hann knýr Söguham). Farðu aftur á upphafsskjáinn (Home-hnappur), smelltu á „{home.btn_generate}" og fylgdu leiðbeiningunum (SKREF 2 í aðalhandbókinni).

    Vandamál: Ég reyni að senda næstu umferð en „{opowiesci.btn_wyslij_label}"-hnappurinn er grár.
    Orsök og lausn: Sjálfvirk samantekt samhengis eða Cinematic Warning er í gangi í bakgrunnsþræði. Minnisstaðan mun sýna „Sjálfvirk samantekt samhengis í gangi…". Bíddu í nokkrar sekúndur — hnappurinn opnast sjálfkrafa þegar aðgerðinni lýkur.

    Vandamál: Ég smellti á val en í stað þess að senda það lenti innihald þess (án bókstafsins A-E) í aðgerðareitinn.
    Orsök og lausn: Þetta er sama staðan og vandamálið hér að ofan — „{opowiesci.btn_wyslij_label}"-hnappurinn var tímabundið grár á þeim tíma (sjálfvirk samantekt eða Cinematic Warning var í gangi í bakgrunni). Venjulega er smellur á val tilbúið ferli sem fer strax til vélarinnar; þegar sending er hins vegar lokuð glatast valið ekki — forritið skrifar innihald þess í aðgerðareitinn og setur bendilinn þar. Þá eru tvær leiðir. Fyrsta: bíddu í nokkrar sekúndur þar til hnappurinn opnast og sendu valið eins og það er — meðhöndlaðu það sem tilbúið drög (þetta er sjálfgefin hegðun frá útgáfu 15.1 og nýrri). Önnur: skiptu alveg um innihald reitsins með eigin texta — þetta er sérstaklega gott augnablik rétt eftir Cinematic Meta Warning, þegar þú vilt í stað þess að smella á næsta þversögn gefa skýra skipun um að loka sögunni og opnum þráðum, ef þér þykir það við hæfi. Eftir breytingu smelltu á „{opowiesci.btn_wyslij_label}" (eða ýttu á Enter).

    Vandamál: Skilaboðin „Minni líkansins ofhlaðið" loka á leikinn.
    Orsök og lausn: Sjálfvirk samantekt losnaði ekki biðminni (t.d. tímabundin takmörk á fyrirspurnum hjá AI-veitanda). Ljúktu leiknum með skipuninni /koniec eða lokaðu forritinu, opnaðu það síðan aftur — vélin hleður sjálfkrafa vistaðar leikstöður án sögu síðustu umferða.

    Vandamál: Í Valham myndaði vélin ekki hnappa þótt ég hefði búist við þeim.
    Orsök og lausn: Líkanshuggun — þrátt fyrir ham 4 skilaði LLM tómu valsviði. Forritið felur valsvæðið meðvitað í slíkum tilvikum (í stað þess að sýna tóman staðgengil) og leyfir þér að halda áfram með frjálsan texta. Næsta umferð mun líklega mynda val rétt.

    Vandamál: Ég sé engar vistaðar leikskrár.
    Orsök og lausn: Þetta er vísvitandi — forritið geymir leikstöðuna í falinn kerfismöppu og stjórnar henni sjálft, þannig að þú þarft ekki að leita að henni eða vista neitt handvirkt. Eina skráin sem þú þarft í raun er tilbúin frásögnin í möppunni opowiesci/ við hliðina á forritinu — þar finnur þú hana. Vistaðar leikstöður hleður þú með „{opowiesci.btn_wczytaj_label}"-hnappinum eða skipuninni /wczytaj.
