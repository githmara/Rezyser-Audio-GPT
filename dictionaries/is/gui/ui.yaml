    tryb_rezysera:
      etykieta: "Nýr Leikstjórnarhamur (skapandi hamur)"
      opis: |-
        Skrá í <jezyk>/rezyser/tryb_*.yaml. Sniðmát byggt á Hljóðbókastillingu + prompt fyrir AI sem þýðir prompt_systemowy, przypomnienie_uzytkownika og slowa_wyzwalajace á móðurmál grunnpakkans.
    tryb_opowiesci:
      etykieta: "Nýr Söguhamur (KREFST FORRITARA)"
      opis: |-
        Gagnvirkur leikhamur (Sögur). Ólíkt Leikstjórnarhömum er hann EKKI gagnadrifinn: sjálf YAML skráin er dauður kóði — vélin þekkir hami eftir tölulegum föstum og kortum í Python. Stjórnandi BÝR EKKI TIL skrá; gefur aðeins ábendingu fyrir AI/forritara með fullan lista af tengipunktum í kóða (töluleg föst, tvö kort, RadioBox, líkan fyrir hvern ham).
    postprodukcja:
      etykieta: "Ný eftirvinnsla (endurtekning eftir köflum)"
      opis: |-
        Skrá í <jezyk>/rezyser/postprod_*.yaml. Sniðmát með reitum fyrir prompt, regex og endurtekningarbreytur + prompt fyrir AI sem býr til móðurmál prompt_systemowy og regex_podzial_rozdzialow.
    jezyk_bazowy:
      etykieta: "Nýtt grunnmál (t.d. en, de, fr)"
      opis: |-
        Býr til möppu <jezyk>/ með podstawy.yaml og undirmöppum akcenty/, szyfry/, rezyser/, gui/. Hljóðfræðileg gögn eru búin til af AI úr prompti; þýðing UI – buduj_wielojezyczne_ui.py; Leikstjórastillingar eru afritaðar úr pl/rezyser/ (krafist er ≥1 skráar tryb_*.yaml, svo vélin viðurkenni tungumálið sem fullkomið).
    szyfr_algorytm:
      etykieta: "Nýtt reiknirit dulmál (KREFST FORRITARA)"
      opis: |-
        Reiknirit (t.d. umsnúningur, typoglycemia) krefjast aðgerða í core_poliglota.py. Stjórnandi gefur aðeins prompt fyrir AI með lýsingu á verkefninu.

