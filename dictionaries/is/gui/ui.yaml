  marker_dlg_plaski_lbl: Sagans er of löng til að rúmast í heild sinni. Frá hvaða Kafla á vinnuminni AI að byrja? (Fyrri atburðir eru táknaðir með Samantekt. Hætta við = síðasti textabútur.)
  marker_dlg_akt_lbl: Sagans er of löng til að rúmast í heild sinni. Frá hvaða Þætti á vinnuminni AI að byrja? (Hætta við = síðasti textabútur.)
  marker_dlg_scena_lbl: Frá hvaða Senu þessa Þáttar á vinnuminni AI að byrja?
  marker_dlg_caly_akt: ← allur Þáttur (frá fyrirsögn þáttar)
  punkt_odniesienia_tytul: Viðmiðunarpunktur vinnuminnis
  punkt_odniesienia_snap_tresc: Vinnuminni AI byrjar frá fyrirsögn „{naglowek}" ({liczba_znakow} stafir). Fyrri atburðir eru táknaðir með Langtíma Samantekt (óbreytt).
  punkt_odniesienia_fallback_tresc: 'Enginn viðmiðunarpunktur gefinn — síðasti hluti frásagnarinnar ({liczba_znakow} stafir) fór í vinnuminni. Samantektin er óbreytt. Ábending: settu inn fyrirsagnir Kafla/Þáttar/Senu til að geta valið upphaf vinnuminnis nákvæmlega.'
  punkt_odniesienia_za_dluga_tresc: 'Valinn hluti „{naglowek}" er svo umfangsmikill að hann passar ekki einn í vinnuminnisglugganum — neyðarskurður var gerður á síðustu {liczba_znakow} stafi. Leikstjóri, þetta er smá brjálæði: íhugaðu að skipta Þáttum/Köflum í minni Senur — styttri hlutar gera AI kleift að halda samræmdu samhengi.'
  kod_jezyka_blad_tytul: Óþekkt tungumál uppskriftar
  kod_jezyka_blad_tresc: Ekki tókst að ákvarða tungumálakóða (ISO) fyrir svarið „{jezyk_odpowiedzi}”. Opnaðu uppskriftina í Reglustjóra og stilltu reitinn kod_jezyka (t.d. „fi”), til að fyrirsagnir og áherslur passi við tungumál efnisins.
