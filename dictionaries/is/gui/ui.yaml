  przeladuj_tytul: Verkefni endurhlaðið af diski
  przeladuj_calosc_tresc: Öllu verkefninu var endurhlaðið af diski ({liczba_znakow} stafir). Uppbyggingarteljarar, Heimsbók, stilling og vinnuminni eru samstillt við skrána.
  przeladuj_calosc_skasowano_tresc: Öllu verkefninu var endurhlaðið af diski ({liczba_znakow} stafir) — allur textinn passaði í samhengi gluggans, svo óþarfa samantekt var fjarlægð (vélin vinnur nú með alla söguna). Teljarar og Heimsbók eru samstillt við skrána.
