  jezyk_naglowkow_ostrzezenie_tresc: Hlaðinn verkefni hefur fyrirsagnir sem líta út fyrir að vera á tungumálinu „{wykryty}”, en virka uppskriftin býr til efni á tungumálinu „{kod}”. Nýjar fyrirsagnir verða settar inn eftir „{kod}” — ef þetta er ekki ætlunin, stilltu reitinn kod_jezyka í uppskriftinni eða veldu annan ham.
  pamiec_status_czysta: 🟢 Minni hreint. Vél tilbúin fyrir nýja sögu.
  pamiec_status_ok: '🟢 Minni notkun: {tokeny} / {maks} tákn. Öruggur biðminni.'
  pamiec_status_ostrzezenie: '⚠️ VIÐVÖRUNARSTAÐA: {tokeny} af {maks} táknum notuð. Minnið er að fyllast – bráðlega verður nauðsynlegt að útbúa samantekt (hnappurinn Langtímaminni í eftirvinnslukaflanum).'
  pamiec_status_alarm: '🚨 ALVARLEG OFHLEÐSLA: {tokeny} af {maks} táknum notuð. Eftir næstu heppnuðu sendingu vistar forritið sjálfkrafa Langtímaminnið; til að losa vinnsluminnið skaltu síðan endurhlaða verkefninu af diski.'
  tytuly_postep: 'Titill: {naglowek} ({step}/{total})…'
  tytuly_blad_brak_struktury: Engir uppbyggingarmerki fundust (Formáli / Kafli N / Eftirorð) í skránni. Settu inn kaflaskil áður en titlar eru gefnir.
  kod_jezyka_rozjazd_tytul: Tungumálakóði passar ekki við innihald
  kod_jezyka_rozjazd_tresc: 'Í uppskriftinni var skráð tungumálakóði „{kod_wpisany}”, en svarmál er „{jezyk_odpowiedzi}” — sem samsvarar kóðanum „{kod_wykryty}”. Sjálft „jezyk_odpowiedzi” er EKKI nóg: það er ISO kóðinn sem stýrir fyrirsögnum uppbyggingar (Prolog/Akt/Scena), vali á áherslum og brú ElevenLabs. Kóðinn „{kod_wykryty}” var notaður. Ef þetta er mistök, leiðréttu kod_jezyka-reitinn í Reglustjóra.'
  kod_jezyka_edu_tytul: Ekki tókst að ákvarða tungumálakóða
  kod_jezyka_edu_naglowek: 'ISO tungumálakóði innihalds — nauðsynleg aðgerð:'
  kod_jezyka_edu_tresc: 'Ekki tókst að sjálfkrafa ákvarða ISO 639-1 kóða fyrir svarmál „{jezyk_odpowiedzi}” (engin tenging við API eða óljóst svar). Þessi tveggja stafa kóði er nauðsynlegur: hann stýrir fyrirsögnum uppbyggingar (Prolog/Akt/Scena), vali á áherslum og tungumáli verkefnis í ElevenLabs. Sjálf lýsingin „jezyk_odpowiedzi” er ekki nóg. Opnaðu uppskriftina í Reglustjóra og skráðu réttan kóða í kod_jezyka-reitinn (t.d. „fi” fyrir finnskt, „de” fyrir þýskt).'
  kod_jezyka_edu_prompt: "Ef þú þekkir ekki kóðann, afritaðu eftirfarandi spurningu og límdu hana í hvaða spjallmenni sem er (t.d. ChatGPT):\n\n„Gefðu upp tveggja stafa ISO 639-1 kóða fyrir tungumál sem lýst er sem: {jezyk_odpowiedzi}. Svaraðu eingöngu með kóðanum.”"
  kod_jezyka_edu_name: Útskýring á tungumálakóða og ábending fyrir spjallmenni
  ostrzezenie_urwane_tytul: Brot gæti hafa verið klippt af
  ostrzezenie_urwane_tresc: Svar líkansins náði lengdarmörkunum og brotnaði mitt í setningu, og sjálfvirk tilraun til að loka síðustu setningunni tókst ekki. Brotið var vistað eins og það er — athugaðu endann á því og bættu við niðurlagi handvirkt ef þörf krefur, eða sendu stutt framhaldsfyrirmæli.
  err_struktura: Gervigreindarlíkanið skilaði nokkrum sinnum ógildri gagnauppbyggingu og ekki tókst að leiðrétta hana. Reyndu aftur eða einfaldaðu leiðbeiningarnar — ef villan kemur ítrekað upp skaltu bæta skránni error_log.txt við tilkynninguna.
  pamiec_status_offline: '⚠️ Engin nettenging: nákvæmur minnisteljari er ekki tiltækur, gildin eru áætluð (~{tokeny} / {maks} tákneiningar). Endurræstu forritið þegar tenging kemst á að nýju.'
  err_timeout: Tími rann út meðan beðið var eftir svari líkansins. Athugaðu nettenginguna og reyndu aftur.
  postprod_postep_generowanie: 'Eftirvinnsla: úrvinnsla niðurstöðu…'
  postprod_postep_gotowe: Eftirvinnslu lokið.
  postprod_pusta_tresc: Líkanið sendi ekkert svar. Reyndu aftur.
  postprod_ucieta_tresc: Niðurstaða eftirvinnslu náði lengdarmörkum og því getur endirinn hafa verið skertur. Niðurstaðan er tiltæk — athugaðu endann og ef hann er ófullkominn, keyrðu verkfærið aftur eða hækkaðu gildið `max_tokens_wyjscia` í YAML-skrá verkfærisins.
  # Sameiginlegur titill fyrir viðvaranir um skerðingu OG athugasemdir
  # kortavalidatorsins (v18.14), því hlutlaus — meginmálið segir hvað þarf að skoða.
  postprod_ostrzezenie_tytul: "Niðurstaðan þarf athugun"
  postprod_nadpisac_tytul: Niðurstöðuskrá er þegar til
  postprod_nadpisac_tresc: Skráin {plik} er þegar til í möppunni skrypty. Viltu skrifa yfir hana með nýju niðurstöðunni?
  postprod_dlg_lbl: 'Niðurstaða verkfæris — afritaðu (Ctrl+A, Ctrl+C) eða lokaðu:'
  postprod_dlg_zapisano: 'Niðurstaðan var vistuð í skrána {plik} (mappa skrypty). Forskoðun hér að neðan:'
  postprod_dlg_name: Reitur fyrir niðurstöðu eftirvinnslu
  err_kontekst: Efnið sem sent var til líkansins rúmaðist ekki í samhengisglugga þess. Vistaðu langtímaminni (samantekt styttir samhengi næstu kalla), skiptu verkefninu í minni skrár, eða veldu líkan með stærri samhengisglugga — Claude-líkön hafa mest svigrúm hér.
  postprod_kontekst_tytul: Stórt verkefni — athugaðu samhengisglugga líkansins
  postprod_kontekst_tresc: "Efnið fyrir tólið er um það bil {tokeny} tákneiningar (tokens) og fer yfir {limit} tákneiningar, sem er samhengisglugginn sem forritið notar til að meta minnisnotkun.\n\nClaude-líkön hafa mun stærri samhengisglugga en þessi teljari gefur til kynna, svo kallið mun líklega heppnast. Ef þú notar hins vegar eigin AI-þjónustuaðila með minni glugga mun líkanið hafna beiðninni — og þú greiðir samt fyrir tilraunina.\n\nViltu keyra tólið samt sem áður?"
  pamiec_auto_start: Minni líkansins að fyllast — vista langtímaminni…
  pamiec_auto_zapisana_tytul: Langtímaminni vistað sjálfkrafa
  pamiec_auto_zapisana_tresc: "Minni líkansins fór yfir viðvörunarmörkin, svo að forritið útbjó sjálfkrafa samantekt á verkefninu {nazwa_projektu} og vistaði hana sem {plik}.\n\nSamantektin er sýnd í reitnum „Langtímaminni\" — þú getur breytt henni frjálslega og vistað aftur.\n\nSjálf vistunin dregur þó ekki strax úr minnisnotkuninni: mælirinn lækkar ekki fyrr en verkefnið er endurhlaðið af diskinum, því þá skiptir forritið út allri sögunni fyrir samantektina ásamt lokahluta frásagnarinnar. Fram að því endurtekur sjálfvirknin sig ekki — næstu samantekt getur þú pantað með hnappinum í eftirvinnslukaflanum."
