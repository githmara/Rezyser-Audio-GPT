manager:
  panel_name: "Reglustjóra spjaldið – orðabóka könnuður"
  desc: |-
    Reglustjóri leyfir að skoða og breyta YAML skrám í dictionaries/ möppunni án þess að fara inn í skráarkönnuð kerfisins. Veldu skrá í trénu til vinstri og notaðu síðan hnappana til hægri: opna í textaritli, búa til nýja skrá, afrita eða eyða.

    Fyrir erfiðari verkefni (nýtt tungumál, framandi hljóðfræði, dulmál) mun Reglustjóri búa til prompt fyrir AI spjallmenni – bara límdu það í ChatGPT eða Claude og vistaðu svarið.
  desc_name: "Lýsing Reglustjóra"
  # Drzewo
  tree_name: "Skráatré dictionaries"
  tree_tooltip: |-
    Tré allra YAML skráa í dictionaries/ möppunni. Stækkaðu tungumál, síðan flokk, og veldu síðan skrá. Örvar og Enter virka venjulega fyrir NVDA.
  tree_root: "Orðabækur (dictionaries/)"
  tree_brak_folderu: "⚠️  Engin dictionaries/ mappa – búðu til fyrsta tungumálið með „Ný regla skrá…\" hnappinum."
  # 13.2: filtr języka — domyślnie pokazujemy tylko aktywny język UI (A11y),
  # a osobna opcja „Wszystkie języki" jest dla autorów paczek językowych.
  dropdown_jezyk_label: "&Tungumál:"
  dropdown_jezyk_tooltip: |-
    Sía tréð í valda möppu í dictionaries/. Sjálfgefið stillt á viðmótstungumál til að listinn sé læsilegur fyrir skjálesara. Veldu „Öll tungumál" til að bera saman möppur hlið við hlið þegar ný pakki er búin til.
  opcja_wszystkie_jezyki: "🌍  Öll tungumál"
  tree_jezyk: "🌐  {kod_jezyka}  ({nazwa_jezyka})"
  tree_podstawy: "📄  podstawy.yaml  (diakritísk merki + stafróf)"
  tree_kategoria: "{etykieta}  [{liczba_plikow}]"
  tree_plik: "📄  {nazwa_pliku}"
