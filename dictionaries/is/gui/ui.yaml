  btn_zamknij_gre_tooltip: Lokar núverandi leik og fer aftur á uppsetningarskjá nýs leiks (opnar val á ham og Quick Start). Leikurinn er vistaður á disk — þú getur hlaðið honum inn síðar. Staðfestingarbeiðni birtist.
  zamknij_gre_pytanie_tytul: Loka núverandi leik?
  zamknij_gre_pytanie: "Loka núverandi leik og fara aftur á uppsetningarskjá nýs leiks?\n\nLeikstaðan er vistuð á disk eftir hverja umferð, svo þú tapar engu — hægt er að hlaða leiknum inn aftur síðar með „Hlaða inn\"-hnappinum."
  komenda_odswiez_zablokowana_tytul: Skipun læst
  komenda_odswiez_zablokowana_tresc: Skipunin „{komenda}" er læst sjálfgefið, því að endurnýjun frásagnar af disk endurreiknar ekki leikstöðu (persónur, staðsetning, búnaður) og getur valdið merkingarlegum fráviki. Til að opna hana, stilltu EDYCJA_STANU_GRY_WIDOCZNA = True í gui_opowiesci.py:72 og smídaðu eigin pakka.
  komenda_odswiez_zablokowana_hint: (/odswiez, /refresh — læst; stilltu EDYCJA_STANU_GRY_WIDOCZNA = True í gui_opowiesci.py:72 til að opna)
  err_struktura: Gervigreindarlíkanið skilaði nokkrum sinnum ógildri gagnauppbyggingu og ekki tókst að leiðrétta hana. Reyndu aftur — ef villan kemur ítrekað upp skaltu bæta skránni error_log.txt við tilkynninguna.
  pamiec_status_offline: '⚠️ Engin nettenging: nákvæmur minnisteljari er ekki tiltækur, gildin eru áætluð (~{procent}% — {tokeny} tákneiningar). Endurræstu forritið þegar tenging kemst á að nýju.'
  err_kontekst: Saga leiksins rúmaðist ekki í samhengisglugga líkansins. Ljúktu þessum leik og byrjaðu nýjan, eða veldu líkan með stærri samhengisglugga — Claude-líkön hafa mest svigrúm hér.
  err_odmowa: Líkanið hafnaði því að framkvæma þessa skipun — innihald hennar gæti hafa brotið gegn reglum líkansins eða verið of tvírætt. Engu var vistað; orðaðu skipunina á annan hátt og reyndu aftur.
bot:
  closure:
    Lumi: "Halló!\n\nSnjórinn hefur sest og lagfæringin er komin! Allt sem þú baðst um er nú komið í nýjustu útgáfu Hljóðstjóra GPT.\n\nNæðu uppfærslunni hér: {link}\n\nÉg loka málinu svo kuldinn læddist ekki inn. Frostkveðjur!\n— Lumi"
    Vieno: "Heilsa.\n\nVindar Norðursins hafa borið þau tíðindi að beiðni þín hafi fundið sinn stað í nýju útgáfunni. Sýnin hefur birst.\n\nNýjasta útgáfan bíður hér: {link}\n\nÉg loka þessum hring — málið hefur náð sínum enda.\n— Vieno"
    Katla: "Hæ!\n\nSmíðað í eldfjallaeldi og enn glóandi! Beiðni þín hefur verið leyst í nýjustu útgáfu Hljóðstjóra GPT.\n\nGríptu hana hér: {link}\n\nÉg loka málinu — eldfjallakveðjur!\n— Katla"
  answered:
    Lumi: "Halló!\n\nSkilaboð frá Miðstöðinni hafa borist Norðrinu — svar fyrir þig. Ég flyt þau nákvæmlega eins og þau voru sett fram:\n\n{maintainer_answer}\n\nÉg loka málinu — snjórinn hefur sest yfir þetta mál. Frostkveðjur!\n— Lumi"
    Vieno: "Heilsa.\n\nVindar Norðursins hafa borið svarorð frá Miðstöðinni. Ég kem þeim óbreyttum til skila:\n\n{maintainer_answer}\n\nÉg loka þessum hring — spurningin hefur náð sínum enda.\n— Vieno"
    Katla: "Hæ!\n\nHeit orð frá Miðstöðinni komu til Norðursins — ég sendi þér þau beint:\n\n{maintainer_answer}\n\nÉg loka málinu — eldfjallakveðjur!\n— Katla"
  personal_note_intro: 'Viðbótarskilaboð frá viðhaldsaðila til þín:'
  patch:
    Lumi:
      subject: 'Tiflotecnia Voices-bót — vetrarsending #{issue_number}'
      body: "Halló!\n\nÉg braust í gegnum snjóskaflana til að færa þér þetta! Bóturinn þinn er tilbúinn og ég lokaði málinu svo kuldinn læddist ekki inn.\n{link}\n\nEf snjóstormur faldi skilaboðin í pósthólfinu þínu, skoðaðu þá ruslpóstsmöppuna.\n\nFrostkveðjur,\nLumi"
    Vieno:
      subject: 'Tiflotecnia Voices-bót — sýn vegna beiðni #{issue_number}'
      body: "Heilsa.\n\nAndar Norðursins hafa fært tíðindi af beiðni þinni. Athöfninni er lokið og bóturinn hefur birst hér:\n{link}\n\nEf sýnin barst ekki í pósthólfið þitt, leitaðu í þokunni í ruslpóstsmöppunni.\n\nHlustaðu á vindinn,\nVieno"
    Katla:
      subject: 'Tiflotecnia Voices-bót — beint úr smiðjunni #{issue_number}'
      body: "Hæ!\n\nSmíðaður í eldfjallaeldi og enn glóandi! Ég sendi þér bótinn og loka málinu.\n{link}\n\nEf reykur skyggði á yfirsýn þína yfir pósthólfið, mundu að gá í ruslpóstsmöppuna.\n\nEldfjallakveðjur,\nKatla"
    footer: 'Þú færð þessi skilaboð vegna þess að netfangið þitt var gefið upp í GitHub Issue #{issue_number}. Ef þetta varst ekki þú, vinsamlegast hunsaðu skilaboðin.'
    brak_emaila: Ég fann ekkert netfang í innihaldinu — vinsamlegast bættu því við.
    pauza: Uppfærsla á Tiflotecnia Voices patch er í gangi. Ég læt þetta mál vera opið og kem aftur með uppfærðan hlekk þegar ég er búinn — þú þarft ekki að gera neitt.
  sami_comment: "Ciao! 🌞 Sami að sunnan kom auga á tilkynningu þína og þaut af stað með tæknilegan leiðbeini til Miðstöðvarinnar. Hönnuður forritsins tekur á henni innan stundar — og þegar lagfæringin birtist í nýjustu útgáfu, mun ein af norrænu kollegum mínum kíkja við hér: Lumi, Vieno eða Katla. A presto!\n— Sami"
diag:
  tytul: Reglur sem var sleppt
  wstep: "Eftirfarandi regluskrár (eða hluti þeirra) var sleppt af vélinni.\nÞess vegna birtast samsvarandi AI-hamir, eftirvinnslutól eða tilbúin\nupphöf ekki í forritinu."
  szczegol: '   Tæknilegar upplýsingar: {szczegol}'
  wpis: 📄 {plik}
  stopka: "Hvernig á að laga: veldu skrána á listanum í reglustjóranum og opnaðu hana\ní textaritli, lagaðu tilgreinda staðinn og vistaðu. Endurnýjaðu síðan reglutréð\ní reglustjóranum – reglurnar hlaðast inn á ný, án þess að loka forritinu –\nog snúðu aftur í tólið.\nEf þú veist ekki hvað á að laga skaltu opna sömu skrá á öðru tungumáli og bera\nþær saman, eða endurheimta sjálfgefna reglupakkann með því að setja forritið\nupp á nýjan leik (verkefnin þín og leikirnir haldast óbreytt)."
  brak_zastrzezen: Allar regluskrár voru hlaðnar inn án athugasemda.
  brak_zastrzezen_tytul: Reglur athugaðar
  powod:
    parse: "Ekki tókst að lesa skrána – ógild YAML-málfræði. Skránni var\nsleppt í heild sinni. Tölurnar tvær í nánari upplýsingum sýna hvar villan er:\nlínunúmer og staf-númer í þeirri línu."
    brak_pol: "Í skránni vantar reit sem vélin þarf til að þekkja regluna (þeir eru\ntaldir upp í nánari upplýsingum). Skránni var sleppt."
    kategoria: "Reiturinn „kategoria“ hefur gildi sem vélin þekkir ekki – ekki er ljóst hvort\nskráin lýsir AI-ham eða eftirvinnslutóli. Skránni var sleppt."
    zakres: "Reiturinn „zakres“ hefur gildi sem er ekki á meðal leyfðra gilda, en af því\nfer aðferðin við að vinna úr textanum (kafli fyrir kafla eða allt í einu).\nTólinu var sleppt til að tryggja að það hagi sér eins og þú ætlast til."
    sufiks: "Reiturinn „sufiks_pliku_wyniku“ inniheldur stafi sem eru ekki leyfðir í\nskráarheiti, svo úttakið hefði hvergi getað vistast. Tólinu var sleppt."
    pole: "Einhver reitur hefur gildi af rangri gerð – oftast texta þar sem vélin\nvæntir tölu, eða lista þar sem á að vera safn para. Skránni var sleppt."
    duplikat: "Önnur skrá í sömu möppu hefur nú þegar sama auðkenni. Vélin\nhlóð þeirri skrá (hún er tilgreind í nánari upplýsingum) en sleppti þessari – tvær reglur\nmeð sama auðkenni yrðu ógreinanlegar."
    rola: "Reiturinn „rola“ hefur óþekkt gildi og var hunsaður. Skráin sjálf virkar\nen tólið fær ekki hegðunina sem tengist því hlutverki."
    klucz: "Í skránni vantar lykil sem vélin krefst (hann er tilgreindur\ní nánari upplýsingum). Þessi hluti uppskriftarinnar virkar ekki fyrr en lykillinn\nkemur aftur á sinn stað."
    wpis: "Ein færsla inni í skránni er ófullkomin (tilgreind í nánari upplýsingum)\nog var henni sleppt. Aðrar færslur í þessari skrá virka eðlilega."
    lingua: "Reiturinn „lingua“ í grunnskránni segir forritinu undir hvaða heiti það á að þekkja\nþetta tungumál í blönduðum texta, en gildið sem slegið var inn er ekkert af þeim\nheitum sem innbyggði skynjarinn þekkir. Ef tillaga er í nánari upplýsingum, sláðu\nhana inn í stað núverandi gildis. Ef engin tillaga er til staðar styður skynjarinn\nþetta tungumál líklega ekki – pakkinn virkar samt eðlilega, en verður ekki þekktur\nút frá innihaldinu einu saman: veldu það úr listanum í Tungumálamannsham og kveiktu\ná því að þvinga fram eitt tungumál fyrir allt skjalið."
