  dlg_edytuj_tryb_ostrzezenie: "VIÐVÖRUN: breyting á hami á meðan á leik stendur getur valdið ósamræmi í frásagnarkerfinu.\n\nLeikjahamurinn ákvarðar hvernig næstu umferðir eru búnar til — AI módel fær mismunandi leiðbeiningar í frjálsum hami (leikmaður skrifar eigin aðgerðir) en í valhami (AI leggur til 3-5 valkosti, í „Minna illu\" eru allir óhagstæðir).\n\nDæmigert ástæða fyrir að nota þessa undankomuleið: AI heldur áfram að búa til fleiri álitamál í stað þess að ljúka sögunni — að skipta yfir í frjálsan ham gerir þér kleift að lýsa lokaatriðinu sjálfur.\n\nEftir breytingu mun næsta umferð nota nýjar reglur. Staða leiksins (persónur, heimur, fyrri frásögn) helst óbreytt."
