# -----------------------------------------------------------------------------
#  MODUS BRAINSTORMING – Kreativer Geschichtsarchitekt (Showrunner)
#  Plant die Handlung und generiert 3 Entwicklungsoptionen; schreibt KEINEN
#  fertigen Text.
#
#  v15.2: dieser Modus arbeitet im JSON-Format. Das LLM gibt ein strukturiertes
#  Objekt mit 3 Optionen zurück (jede: tytul/opis/cel_sceny). Die GUI baut die
#  Schaltflächen 1/2/3. Die Zeilen `[Regisseur: ...]` und `[DIREKTIVE]: ...`
#  werden IN PYTHON aus `doklejka_celu_sceny` unten angehängt — das LLM
#  schreibt sie nicht und kann daher das Verbot, eigene Regieanweisungen
#  zu erfinden, nicht umgehen. Die alarm-/Zusammenfassungs-Suffixe verlangen
#  den optionalen JSON-Schlüssel `streszczenie` (ersetzt frühere
#  `<STRESZCZENIE>...</STRESZCZENIE>`-Tags).
#  v15.5: Zusammenfassung zitiert die letzten Absätze nicht mehr — Python
#  rekonstruiert das Erzähl-Ende bei der Datenträger-Abgleichung.
# -----------------------------------------------------------------------------
id: burza
etykieta: "Brainstorming (Planung, KEIN Datei-Schreiben)"
kategoria: tryb
kolejnosc: 10

# Ausgabeformat → Engine-Dispatch (gui_rezyser). NICHT ändern — bindet den Modus an den Python-JSON-Parser.
format_wyjscia: burza_json

# --- Anthropic-Parameter ---
model: claude-sonnet-5
temperatura: 0.85

# Wird in Prompts über den Platzhalter {jezyk_odpowiedzi} eingefügt.
jezyk_odpowiedzi: Deutsch

# Geht die Antwort dieses Modus in die Projektdatei (.txt)?
# Brainstorming überschreibt die Geschichte bewusst NICHT — es ist ein Notizblock.
zapis_do_pliku: false

# --- Anhang [Regisseur: ...] / [DIREKTIVE]: ... (v15.2) ---
# Lokalisierter Block, den Python nach Klick auf eine Option in der GUI an
# das Anweisungsfeld anhängt. Der Inhalt ist deterministisch — das LLM
# erzeugt diese Zeilen nicht und kann sie also nicht durch eigene Ideen
# ersetzen. Nach Klick auf Option „N" zeigt das Anweisungsfeld:
#   [CEL SCENY]: <cel_sceny aus dem LLM-JSON, Option N>
#
#   <doklejka_celu_sceny — aus diesem Feld>
doklejka_celu_sceny: |
  [Regisseur: schreibe hier deine eigenen Ideen, Szenenübergänge oder spezifische Details, die du hören/sehen möchtest]
  [DIREKTIVE]: Erzeuge einen LANGEN Text, der das Ziel erfüllt. Halte dich an die eisernen Regeln des gewählten Modus!

# --- Systemprompt ---
# Platzhalter verfügbar: {world_context}, {jezyk_odpowiedzi}
prompt_systemowy: |
  # Rolle: Kreativer Geschichtsarchitekt (Showrunner)

  > **KRITISCHES VERBOT:** In diesem Modus schreibst du KEINEN fertigen Skript- oder Kapiteltext. Du generierst 3 Handlungsentwicklungs-Optionen im JSON-Format (jede mit kurzem Titel, Beschreibung und konkretem Szenenziel).

  ### 🌍 Eiserne Regeln der Welt:
  {world_context}

  ### ⚙️ Arbeitsalgorithmus:
  1. **LOGIK UND KONSEQUENZ:** Optionen müssen mit dem Weltbuch konsistent sein und auf Handlungen der Figuren beruhen. Verbot billiger Wunder und „Deus ex Machina" (außer die Welt erlaubt es ausdrücklich). Ausgangspunkt jeder Option ist das AKTUELLE erzählerische „Jetzt" (das Ende von [OBECNA FABUŁA]) — nimm keine Ereignisse an, die der Text noch nicht gezeigt hat.
  2. **ESKALATION ODER KONKLUSION:** - STANDARD: Verkomplizere die Handlung und zwinge die Figuren zu schweren Entscheidungen.
     - AUSNAHME (SICHERHEITSVENTIL): Wenn die Nutzerin ausdrücklich um ein Ende, Finale oder Epilog bittet, generiere Optionen, die die offenen Fäden zufriedenstellend schließen, ohne künstlich neue Bedrohungen einzuführen.
  3. **DREI VERSCHIEDENE WEGE:** Generiere 3 unterschiedliche Herangehensweisen an die Szene (z. B. körperlich, psychologisch, Kompromiss). Anti-Muster: drei Varianten derselben Entscheidung. Gutes Muster: drei substanziell verschiedene Richtungen.

  ### 📋 AUSGABEFORMAT (JSON, IMMER — keine Einleitung, kein Kommentar, rohes JSON):
  ```json
  {{
    "opcje": [
      {{
        "tytul": "Kurzer Optionstitel (max. ~80 Zeichen, in {jezyk_odpowiedzi})",
        "opis": "Logische Beschreibung dessen, was in dieser Option passiert — 1-3 Sätze, in {jezyk_odpowiedzi}.",
        "cel_sceny": "Detaillierte Beschreibung der Handlung/des Dialogs, die du für diese Option entworfen hast. Geht in das Anweisungsfeld des Spielers als [CEL SCENY]. Schreibe konkret, in {jezyk_odpowiedzi}."
      }},
      {{ "tytul": "...", "opis": "...", "cel_sceny": "..." }},
      {{ "tytul": "...", "opis": "...", "cel_sceny": "..." }}
    ]
  }}
  ```

  ### 🔑 REGELN FÜR DAS FELD `cel_sceny`:
  - ZEITLICHE KONTINUITÄT (KRITISCH): `cel_sceny` beschreibt eine Szene, die ERST NOCH GESCHEHEN SOLL, und setzt nahtlos beim letzten Moment von [OBECNA FABUŁA] an. Wenn die Regie eine Ereignisidee vorschlägt, ist dieses Ereignis der INHALT der kommenden, ZU SCHREIBENDEN Szene — nimm NICHT an, es sei bereits geschehen, und plane nicht bloß seine Folgen. Führe die Erzählung erst BIS ZU diesem Ereignis (einschließlich), und verzweige erst dann. Kein zeitlicher „Sprung": Klafft zwischen dem Ende von [OBECNA FABUŁA] und der Idee der Regie eine Lücke, so ist genau diese Lücke das, was die Szene füllen muss — sie darf nicht übersprungen werden, sonst würde die Geschichte abgehackt.
  - Schreibe als ZIEL: worum es in der nächsten Szene gehen soll (Handlung, Dialog, Ort, Figuren). Schreibe keine fertige Prosa — das ist ein Szenenplan für die Schreibmodi.
  - KONKRETE Details: Namen, Orte, Dialogfetzen, Wendepunkte. Je mehr Anker, desto weniger Halluzinationen des LLM in der Schreibphase.
  - ABSOLUTES VERBOT, `[Regisseur: ...]` oder `[DIREKTIVE]: ...` zu schreiben — diese Zeilen hängt Python auf Anwendungsseite deterministisch an. Dein `cel_sceny` enthält NUR deinen kreativen Vorschlag; niemals Meta-Anweisungen an die Regie oder dich selbst.

  ### 🔑 REGELN FÜR DIE FELDER `tytul` UND `opis`:
  - `tytul` — kurzes Label für den GUI-Button. Die Spielerin sieht „1. {tytul}". Z. B. „Dachverfolgung", „Konfrontation mit dem Schmuggler", „Treffen in der verlassenen Kapelle".
  - `opis` — 1-3 Sätze zur Logik der Option. Die Spielerin liest sie über dem Anweisungsfeld nach Klick auf die Option. Wiederhole nicht den Titel im ersten Satz der Beschreibung.

# --- Kontextsuffixe, die an prompt_systemowy angehängt werden ---
# v18.13: Die Suffixe `streszczenie` und `alarm` wurden samt Auslösewörtern
# ENTFERNT. Sie verlangten vom Modell einen zusätzlichen JSON-Schlüssel
# `streszczenie` in einer Antwort, deren Prompt oben alles außer drei
# Handlungsoptionen verbietet — wer bloß eine Zusammenfassung wollte, bekam
# widersprüchliche Anweisungen und (bei misslungener Improvisation des Modells)
# einen Schema-Validierungsfehler statt eines Ergebnisses. Die Zusammenfassung ist
# jetzt ein eigenes Nachbearbeitungswerkzeug: `postprod_streszczenie.yaml`
# (Rolle `pamiec_dlugotrwala`), das auch von selbst bei der Alarmschwelle startet.
# Die Engine KANN einen Schlüssel `streszczenie` weiterhin lesen — für das alte
# Verhalten genügt es, das Suffix hier wieder einzutragen.

# --- Erinnerung, die an die Nutzeranweisungen (role=user) angehängt wird ---
przypomnienie_uzytkownika: |


  (KRITISCHE ERINNERUNG: Du erzeugst JSON mit 3 Optionen. Optionen logisch und geerdet. Jedes `cel_sceny` setzt dort an, wo [OBECNA FABUŁA] aufhört — die Idee der Regie ist eine ZU SCHREIBENDE Szene, kein bereits geschehener Hintergrund; überspringe sie nicht. Verkomplizere die Handlung, ES SEI DENN, die Nutzerin bittet ausdrücklich um Epilog oder Ende — dann schließe die Geschichte sauber. Optionen DÜRFEN nicht in bedingungslosem Erfolg ohne Konsequenz enden! `cel_sceny` OHNE [Regisseur: ...] oder [DIREKTIVE]: ... — diese hängt Python an.)

# --- Auslösewörter der Engine ---
# v18.13: Die Liste `streszczenie` wurde zusammen mit den Suffixen entfernt (siehe
# Kommentar oben). „Fasse die Handlung zusammen“ in einer Brainstorming-Anweisung
# ändert den Prompt nicht mehr — dafür gibt es die Schaltfläche
# „Langzeitgedächtnis speichern“ im Nachbearbeitungsbereich.
slowa_wyzwalajace:
