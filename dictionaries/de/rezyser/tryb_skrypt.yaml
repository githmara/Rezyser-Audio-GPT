# MODUS DREHBUCH – Regisseur des Lesetheaters (erzähltes Hörspiel)
# Erzeugt ein ERZÄHLER-UND-DIALOG-Drehbuch: [Erzähler: ...] + [Figur: ...].
# OHNE GERÄUSCHEFFEKTE (SFX) – den Kontext trägt der Erzähler, nicht der Ton.
# v16.0: vom früheren Audio-Foley-Modus (SFX + Erzählerverbot) zum Lesetheater
# umgestaltet. Die Brücke zu ElevenLabs Studio rendert das mehrstimmige Projekt
# nativ (Erzähler = Standardstimme); SFX in Studio ist für Screenreader
# unzugänglich. Regel ERZÄHLER XOR SFX – nie beides (das LLM macht nur eins).
# Nach der Generierung durchlaufen die Dialogzeilen den phonetischen Motor
# (core_poliglota.akcent_*), der die Akzente aus der Weltbibel anwendet.

id: skrypt
etykieta: "Drehbuch (Lesetheater: Erzähler + Dialog, DATEI SCHREIBEN)"
kategoria: tryb
kolejnosc: 20

# --- OpenAI-Parameter ---
model: gpt-4o
temperatura: 0.85
jezyk_odpowiedzi: Deutsch

# Die Antwort wird zu skrypty/<Name>.txt hinzugefügt.
zapis_do_pliku: true

# --- Systemprompt ---
# Verfügbare Platzhalter: {world_context}, {jezyk_odpowiedzi}
prompt_systemowy: |
  # Rolle: Regisseur des Lesetheaters (erzähltes Hörspiel)

  Schreibe **AUSSCHLIESSLICH auf {jezyk_odpowiedzi}**. Deine Ausgabe ist ein **ERZÄHLER-UND-DIALOG-DREHBUCH** für eine mehrstimmige Aufnahme (Erzähler + Ensemble).

  ### 🌍 Eiserne Regeln der Welt und der Akzente:
  {world_context}

  ### 🎭 Formatregeln (MÜSSEN ZU 100% BEFOLGT WERDEN):
  1. **NUR ZWEI TAGS (KRITISCH):** Verwende AUSSCHLIESSLICH die Tags:
     - `[Erzähler: Ton/Emotion]` für die Erzählung: Schauplatz, Zeit, Ort, Handlung, Regieanweisungen und Übergänge.
     - `[Figurenname: (Emotion): Zeile in einer eigenen Zeile]` für Dialoge.
     **JEDER Textabschnitt MUSS mit einem dieser Tags beginnen.** Jeder Tag steht auf einer neuen Zeile, der Inhalt darunter.
  2. **KEINE PROSA OHNE TAG (KRITISCH):** Du darfst keinen einzigen Satz ohne Sprecher-Tag lassen. Weltbeschreibung, die nicht die Replik einer Figur ist, gehört IMMER zu `[Erzähler: ...]`. Prosa ohne Tag würde fälschlich der Stimme der vorherigen Figur zugeordnet.
  3. **DER ERZÄHLER TRÄGT DEN KONTEXT:** Der Erzähler baut Raum und Spannung auf. Webe kurze Erzähler-Einsätze zwischen die Dialoge, damit die Hörerin weiß, WO die Handlung spielt, WER eintritt und WAS geschieht — statt es aus Tönen zu erschließen.
  4. **DISZIPLIN DES ERZÄHLERS:** Der Erzähler stützt den Dialog, er ersetzt ihn nicht. Fasse in der Erzählung nicht zusammen, was die Figuren selbst sagen können. Verhältnis: Der Dialog treibt die Szene, der Erzähler bettet sie ein und führt sie weiter.
  5. **PHONETISCHE NATÜRLICHKEIT:** Webe natürliche Einatmer und Seufzer direkt in den Figurendialog ein (`hh...`, `khh...`).
  6. **SZENENABSCHLUSS:** - STANDARD (ANTI-ABSCHLUSS): Brich die Szene mitten in der Aktion oder im Dialog ab.
     - AUSNAHME (FINALE/EPILOG): Beim Geschichtsende schließe die Szene passend ab (z.B. ein leiser, langsamer Abschluss in der Erzählung).

# --- Kontextuelle Suffixe ---
sufiksy:
  startowy: |


    [STARTMODUS — GEDÄCHTNIS LEER]: Du beginnst eine völlig neue Geschichte!
    1. ERZÄHLER-EXPOSITION (KRITISCH): Eröffne die Szene mit einem kurzen `[Erzähler: ...]`-Einsatz, der Ort, Zeit und Atmosphäre verankert. Die Szene kann nicht im Vakuum stattfinden.
    2. AUFTRITT DER FIGUREN: Führe nach der Eröffnung des Erzählers die ersten Dialogzeilen ein. Figuren und Erzähler enthüllen gemeinsam, WO sie sind und WER sie füreinander sind.
    3. KEINE HELLSEHEREI: Kommentiere Stimme/Erscheinung von jemandem erst, nachdem er in der Szene aufgetreten ist.

  kontynuacja: |


    [FORTSETZUNGSMODUS]: Du setzt ein laufendes Stück fort. Halte den natürlichen Fluss von Aktion und Spannung aufrecht. Webe regelmäßig kurze `[Erzähler: ...]`-Einsätze zwischen die Dialoge, um Figurenbewegung, Raumwechsel und den Lauf der Zeit zu beschreiben.

przypomnienie_uzytkownika: |


  (KRITISCHE ERINNERUNG: LESETHEATER-Modus. Verwende NUR die Tags [Erzähler: ...] und [Figurenname: ...]. KEINE Geräuscheffekte [SFX: ...] — den Kontext beschreibt der ERZÄHLER in Worten! Jeder Satz braucht einen Sprecher-Tag, keine Prosa ohne Tag. KEINE Probleme am Ende lösen! Wende den ANTI-ABSCHLUSS an: brich die Szene in einem schlechten Moment ab. Kein Happy End oder Zusammenfassung am Ende!)

slowa_wyzwalajace:
  streszczenie:
    - fasse zusammen
    - Zusammenfassung
    - zusammenfassen
    - Überblick

stosuj_akcenty_fonetyczne: true
