# =============================================================================
#  GRUNDLAGEN DER DEUTSCHEN SPRACHE
# =============================================================================
#
#  Basisdatei für `dictionaries/de/`. Die Poliglota-Engine erfordert, dass
#  jede Sprache diese Datei hat — ohne sie wird eine neue Sprache überhaupt
#  nicht erkannt.
#
#  Struktur analog zu `dictionaries/pl/podstawy.yaml`. Das Feld
#  `polskie_znaki` enthält trotz des historischen Namens ALLE diakritischen
#  Zeichen, die vor der Anwendung von Chiffren oder Akzentregeln auf ASCII
#  normalisiert werden müssen.
#
#  Besonderer Hinweis: „ß" wird NICHT in das `alfabet`-Feld aufgenommen,
#  da es beim `.upper()`-Aufruf zu „SS" wird (2 Zeichen), was den
#  Caesar-Chiffre-Index-Mechanismus zerstören würde. Stattdessen wird „ß"
#  in `polskie_znaki` als „ss" transliteriert (wie in der Schweiz üblich).
# =============================================================================

id: podstawy
jezyk: de
# lingua-language-detector Enum (großgeschrieben, ohne Präfix).
# Vollständige Liste: https://github.com/pemistahl/lingua-py
lingua: GERMAN
etykieta: "Deutsch – phonetische Grundlagen"
opis: |
  Basisregeln für die deutsche Sprache:
    1. Normalisierung diakritischer Zeichen (`polskie_znaki`) — damit der
       Caesar-Chiffre und die Akzent-Engines nur das deutsche Alphabet
       aus 29 Buchstaben sehen (A–Z + Ä, Ö, Ü; ohne ß).
    2. Deutsches Alphabet (29 Großbuchstaben, Umlaute am Ende) —
       verwendet vom Caesar-Chiffre.

# -----------------------------------------------------------------------------
# Normalisierung diakritischer Zeichen. ß → ss (Schweizer Konvention);
# ä/ö/ü stehen im Alphabet und werden hier NICHT plattgemacht (v18.19).
#
# v19.7: DAS ZIEL IST DEUTSCH, NICHT DER NACKTE GRUNDBUCHSTABE. Bis v19.6 fiel
# jedes fremde Zeichen auf seinen Grundbuchstaben — das war Verarmung, keine
# Vereinfachung: der Vorab-Durchlauf läuft VOR der Liste `zamiany` JEDES
# Akzents dieses Pakets, also warf `š → s` genau die Regel weg, die die
# Akzente seit jeher haben (`sch → ш` im Russischen, `sch → sz` im Polnischen,
# `tsch → ч`/`cz`). Ein fremdes Zeichen, das STABIL einen Laut trägt, den das
# Deutsche selbst schreibt, bekommt ab jetzt die deutsche Schreibung — meist
# eine Buchstabengruppe, denn eine Gruppe ERZWINGT den Laut, den ein einzelner
# Buchstabe nur nahelegt:
#     š ş ŝ ž ĵ ś ź ż → sch      č ĉ ċ ć → tsch      đ ĝ ġ → dsch
#     ř → rsch    ñ ń ň ņ → nj    ţ → z (deutsches z ist /ts/)
#     ç → ss      ą → on    ę → en    å → o    ø œ ő → ö    ű → ü
#   Gemessen: „Škoda Žižek Dvořák Đoković" wird zu „Schkoda Schischek
#   Dvorschak Dschokovitsch" statt „Skoda Zizek Dvorak Dokovic", und
#   „Ångström garçon" zu „Ongström garsson" statt „Angstrom garcon".
#
# DER REST BLEIBT ASCII, UND AUCH DAS IST EINE ENTSCHEIDUNG. Das Kriterium hat
# zwei Seiten und beide müssen halten: die QUELLE muss in den Sprachen, aus
# denen sie kommt, einen Laut meinen (`æ` ist einmal dänisch /ɛ/ und einmal
# isländisch /ai/, `ó` polnisch /u/, isländisch /ou/ und spanisch betontes
# /o/ — deshalb bleiben beide beim Grundbuchstaben), und das ZIEL muss die
# Stimme DIESES Pakets jedes Mal gleich lesen. Deshalb `ł → l`: das Deutsche
# hat kein /w/, und es gibt nichts, worauf man zielen könnte.
#
# Die Grenze bewacht `audyt_podstaw` (Klasse `znaki-cel-obcy`): das Ziel darf
# ASCII sein oder ein Buchstabe aus `alfabet` weiter unten (deshalb ist `ö`
# hier erlaubt) — niemals ein Buchstabe einer dritten Sprache.
# -----------------------------------------------------------------------------
polskie_znaki:
  # -- ß → ss: beim `.upper()` wächst es (ß → SS), darum steht es NICHT
  #    im `alfabet` (dort sind nur Buchstaben mit einer Großform erlaubt) --
  - { wzor: "ß", zamiana: "ss" }
  - { wzor: "ẞ", zamiana: "SS" }
  # -- Ä/Ö/Ü: BEWUSST NICHT normalisiert (Korrektur v18.19) --
  #    Diese drei stehen im deutschen `alfabet` (29 Buchstaben) — sie sind
  #    also vollwertige Buchstaben dieser Sprache und keine Fremdzeichen.
  #    Sie hier zu plattzumachen widersprach der eigenen Alphabet-Angabe und
  #    hatte zwei Folgen: (1) die Caesar-Chiffre verschlüsselte „a" dort, wo
  #    das Alphabet „ä" anbietet, (2) im Akzent-Pipeline läuft dieser Schritt
  #    VOR der Liste `zamiany`, so dass ALLE Umlaut-Regeln der sieben
  #    Akzentdateien unerreichbar waren (26 tote Regeln; der Text versprach
  #    „ä → e", die Engine lieferte „a"). „ß" bleibt oben normalisiert — es
  #    steht bewusst NICHT im `alfabet`.
  # -- Polnische Zeichen: jeder dieser Buchstaben meint im Polnischen EINEN
  #    Laut, und für jeden hat das Deutsche eine Schreibung — also schreiben
  #    wir sie, statt das Diakritikum fallen zu lassen. `ó` und `ł` bleiben:
  #    das erste ist nicht nur polnisch /u/, das zweite ist /w/, und das
  #    Deutsche hat diesen Laut nicht --
  - { wzor: "ą", zamiana: "on" }
  - { wzor: "ć", zamiana: "tsch" }
  - { wzor: "ę", zamiana: "en" }
  - { wzor: "ł", zamiana: "l"  }
  - { wzor: "ń", zamiana: "nj" }
  - { wzor: "ó", zamiana: "o"  }
  - { wzor: "ś", zamiana: "sch" }
  - { wzor: "ź", zamiana: "sch" }
  - { wzor: "ż", zamiana: "sch" }
  - { wzor: "Ą", zamiana: "On" }
  - { wzor: "Ć", zamiana: "Tsch" }
  - { wzor: "Ę", zamiana: "En" }
  - { wzor: "Ł", zamiana: "L"  }
  - { wzor: "Ń", zamiana: "Nj" }
  - { wzor: "Ó", zamiana: "O"  }
  - { wzor: "Ś", zamiana: "Sch" }
  - { wzor: "Ź", zamiana: "Sch" }
  - { wzor: "Ż", zamiana: "Sch" }
  # -- Weitere europäische Diakritika → ASCII --
