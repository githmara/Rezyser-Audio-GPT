id: manual
tresc:
  naglowek: |
    Podręcznik Reżysera Audio AI - Komplettanleitung (Version {app.wersja})

    Willkommen im Hybriden Aufnahmestudio! Dieses Toolset ermöglicht das automatische Schreiben, Planen, Formatieren und Übersetzen von Hörspiel- und Hörbuchskripten. Es wurde für die Zusammenarbeit mit professionellen Sprachsynthesizern und lokalen Screenreader-Engines (NVDA) optimiert.

    Das Set besteht aus dem Hauptstudio (Regie), einem Übersetzungs- und Akzentwerkzeug (Polyglott), einem Werkzeug zum Erstellen der Dateistruktur (Hörbucharchitekt), einem Regelmanager (ab Version 13.0 — ohne Python kannst du einen neuen Akzent, ein Chiffre oder einen kreativen Modus hinzufügen, siehe SCHRITT 7b unten) und — ab Version 15.0 — einem Geschichtenmodul (interaktive, zweite Person AI-generierte Fiktion, gelesen von TTS oder Screenreader, beschrieben in einem separaten Handbuch opowiesci.pl.txt). Alle fünf Werkzeuge sind in einem Programmfenster verfügbar, das über Schaltflächen in der Leiste oder Tastenkombinationen Ctrl+1..Ctrl+5 umgeschaltet werden kann.
  krok_1_pierwsze_uruchomienie: |
    KROK 1: Erste Ausführung (Plattformübergreifend)

    Die Anwendung ist vollständig portabel und bereit zur Ausführung unter Windows. Gehe einfach in den Ordner und starte die Datei run.bat (durch Doppelklick oder durch Erstellen einer Verknüpfung auf dem Desktop). Ein kurzes Terminalfenster öffnet sich (verschwindet automatisch), und nach einem Moment erscheint das Hauptfenster des Programms — {app.nazwa}. Kein Browser, kein Hintergrundserver. Wenn du fertig bist, schließe einfach das Programmfenster.

    Wichtig: Der Ordner runtime/ ist nur Teil der fertigen Windows-Pakete, die im Bereich Releases auf GitHub heruntergeladen werden können. Er enthält eine isolierte Python-Umgebung, die ohne Installation einsatzbereit ist. Wenn du das Repository klonst, ist dieser Ordner nicht vorhanden und sollte es auch nicht sein — du verwendest dann die virtuelle Umgebung venv, die im Abschnitt für Entwickler unten beschrieben ist.

    --- Für Entwickler (Windows — Git-Repository) ---

    1. Klone das Repository auf deine Festplatte.
    2. Führe die Datei setup_dev.bat aus. Das Skript erstellt automatisch eine virtuelle Python-Umgebung (venv) und installiert alle erforderlichen Abhängigkeiten aus der Datei requirements.txt.
    3. Starte die Anwendung mit dem Befehl python main.py oder über die Datei run_dev.bat — das Skript erkennt automatisch den venv-Ordner und startet das Programm.

    --- Für Entwickler und normale Benutzer (macOS / Linux) ---

    1. Klone das Repository auf deine Festplatte.
    2. Öffne ein Terminal im Projektordner und erteile den Skripten Ausführungsrechte: chmod +x *.sh
    3. Führe das Konfigurationsskript aus: ./setup_dev.sh — das Skript erstellt die venv-Umgebung und installiert die Abhängigkeiten.
    4. Starte die Anwendung: python main.py oder ./run.sh

    Was du nach dem Start siehst: Nach dem Start des Programms öffnet sich ein Fenster mit dem Startbildschirm. Dort findest du eine kurze Beschreibung der verfügbaren Werkzeuge und den Abschnitt "{home.heading_system_check}". Wenn der API-Schlüssel noch nicht konfiguriert ist, siehst du eine rote Nachricht, die darauf hinweist, dass die KI-basierten Module (Regie, Übersetzer) nicht funktionieren werden — die kostenlosen lokalen Funktionen (Akzente, Architekt) sind jedoch sofort aktiv. Die Konfiguration des Schlüssels wird im nächsten Schritt beschrieben.

    Automatische Updates

    Die Anwendung überprüft beim Start, ob eine neuere Version auf GitHub verfügbar ist — die Überprüfung erfolgt im Hintergrund und blockiert die Benutzeroberfläche nicht.

    Wenn du das Programm über eine fertige Installationsdatei (.exe) installiert hast: Bei Erkennung einer neueren Version erscheint ein Fenster mit der Frage, ob du sie herunterladen möchtest. Nach der Bestätigung wird ein Fortschrittsbalken angezeigt, und wenn der Download abgeschlossen ist, schließt sich die Anwendung automatisch und der neue Installer startet von selbst — deine Projekte und der API-Schlüssel bleiben unberührt.

    Wenn du das Git-Repository verwendest (Entwickler und macOS/Linux-Benutzer): Anstelle des Vorschlags zum Herunterladen siehst du Informationen über die neue Version mit einem direkten Link zur Release-Seite auf GitHub. Lade von dort das „Source code“-Archiv herunter oder aktualisiere das Repository mit dem Befehl git pull.
  krok_2_klucz_api: |
    KROK 2: API-Zugang (OpenAI-Schlüssel)

    Damit die künstliche Intelligenz funktionieren kann, benötigt sie Zugriff auf die Server von OpenAI (den Entwicklern von ChatGPT).

    1. Erstellen Sie ein Konto auf platform.openai.com und laden Sie Ihr Konto im Bereich "Billing" auf.
    2. Generieren Sie einen Schlüssel im Bereich "API Keys" (beginnt mit sk-proj-). Achtung: Der Schlüssel wird nur einmal angezeigt — im Moment der Erstellung. Wenn Sie das Fenster schließen, ohne ihn zu kopieren, geht er unwiderruflich verloren und Sie müssen ihn sperren (Option "revoke secret key") und einen neuen generieren. Kopieren Sie ihn sofort, bevor Sie irgendetwas anklicken.
    3. Klicken Sie auf dem Startbildschirm des Programms auf die Schaltfläche "{home.btn_generate}". Das System erstellt automatisch eine leere Konfigurationsdatei an der richtigen Stelle und öffnet den Notizblock mit einer Vorlage, die zur Bearbeitung bereit ist.
    4. In der geöffneten Datei sehen Sie die Zeile OPENAI_API_KEY=HIER_IHREN_SCHLÜSSEL_EINFÜGEN. Entfernen Sie den Platzhaltertext und fügen Sie Ihren kopierten Schlüssel direkt nach dem Gleichheitszeichen ein (ohne Leerzeichen). Speichern Sie die Datei und starten Sie die Anwendung neu.

    Tipp: Nach dem Neustart überprüft die Anwendung die Datei und zeigt eine grüne Meldung im Abschnitt "{home.heading_system_check}" an — das bedeutet, dass alle KI-Module einsatzbereit sind. Andernfalls wird Ihnen klar mitgeteilt, was nicht stimmt, und Sie können den Texteditor öffnen, um den Fehler schnell zu beheben.
  krok_3_glowne_studio: |
    KROK 3: Hauptregiestudio

    Dies ist Ihr Kontrollzentrum zum Erfinden von Geschichten und Schreiben von Drehbüchern. Gehen Sie dorthin, indem Sie auf die Schaltfläche "{main.btn.rezyser}" in der Symbolleiste klicken oder im Menü Werkzeuge → {main.menu.rezyser} auswählen (Tastenkombination: Strg+1).



    WICHTIG: Projektdateiformat — Rückkehr zu .txt

    In Version 7 wurden Projektdateien im Markdown-Format (.md) gespeichert, z.B. skripty/znieczulica.md. Dies war ein bewusstes Experiment — das .md-Format sollte eine psychologische Barriere für nicht-technische Personen darstellen, um sie davon abzuhalten, die Datei im Notizblock zu öffnen und manuell zu bearbeiten (und damit versehentlich die Strukturüberschriften zu beschädigen).

    Das Experiment hat sich nicht bewährt. Die KI bricht oft notorisch eines der grundlegenden Verbote (mehr dazu in Kürze). Aus diesem Grund wurde in Version 8 zu einfachen .txt-Dateien zurückgekehrt — intuitiver und für jeden lesbarer. Beispielsweise wird ein Projekt namens "znieczulica" jetzt als skripty/znieczulica.txt gespeichert, und seine Zusammenfassung als skripty/znieczulica_streszczenie.txt. Dies ermöglicht es jedem, Regieanpassungen oder Textkürzungen leichter vorzunehmen.


    ⚠️ KRITISCHE REGEL FÜR DEN SCHNITTMEISTER (LESEN SIE, BEVOR SIE BEGINNEN!) ⚠️

    Alle Ihre generierten Skripte und Bücher werden in einfachen Textdateien (.txt) gespeichert, die Sie problemlos im Notizblock öffnen können.

    Als Regisseur haben Sie das VOLLE RECHT (und sogar die Pflicht), diese Datei zu bearbeiten! Wenn die künstliche Intelligenz sich überschlägt und z.B. das Problem der Protagonisten am Ende des generierten Fragments selbst löst, öffnen Sie die Datei, löschen Sie die letzten Zeilen und lassen Sie den Text an der spannendsten Stelle abbrechen, bevor Sie den Speicher löschen, die Datei erneut laden, um das Kontextfenster zu aktualisieren, und auf "{rezyser.btn_wyslij_label}" klicken, um fortzufahren.

    🔴 JEDOCH - WAS SIE NICHT ÄNDERN DÜRFEN:

    Ändern, löschen oder modifizieren Sie niemals Zeilen, die die Struktur enthalten (z.B. Akt 1, Szene 2, Kapitel 1, Prolog). Wenn Sie diese Überschriften beschädigen:
    1. Ihre Geschichte wird in Bildschirmlesern (NVDA) auseinanderfallen.
    2. Der Audiobook-Architekt und damit auch das Studio Eleven Labs werden nicht in der Lage sein, Ihr Buch korrekt in Lesefragmente zu unterteilen.
    3. Der interne Konverter der Anwendung wird kein korrektes Inhaltsverzeichnis in der Word-Datei oder auf der Zeitleiste in ElevenLabs generieren.

    Bearbeiten Sie Dialoge, kürzen Sie die Handlung, aber lassen Sie die Struktur in Ruhe!


    Wie benutzt man die Regie?

    - Weltbuch (linke Seitenleiste): Hier geben Sie die Regeln des Universums ein. Jedes Projekt hat jetzt ein eigenes Weltbuch, das mit dem Dateinamen verknüpft ist — wenn Ihre Geschichtsdatei z.B. emilia_heist_audiobook.txt heißt, wird das Weltbuch als skripty/emilia_heist_audiobook.md gespeichert. Daher ist die Reihenfolge wichtig: Geben Sie zuerst den Projektdateinamen im Feld "Projektdateiname" ein, erst dann können Sie das Weltbuch speichern. Die Schaltfläche "{rezyser.btn_zapisz_ksiege_label}" bleibt ausgegraut, bis Sie einen Namen eingeben. Das Laden eines bestehenden Projekts mit der Schaltfläche "{rezyser.btn_wczytaj_label}" lädt automatisch auch die entsprechende .md-Datei — Sie müssen nichts manuell tun. Hinweis: Ohne ausgefülltes Weltbuch blockiert die Anwendung das Senden von Anfragen an die KI — dies ist eine bewusste Sicherheitsmaßnahme, die Sie davor schützt, Text ohne Regeln zu generieren.
    - Langzeitspeicher (linke Seitenleiste): Das zweite Feld in der Seitenleiste. Hier speichert die KI automatisch eine Zusammenfassung der Handlung, wenn der Speicher voll zu werden droht. Sie können hier auch manuell eigene Notizen eingeben — das Modell behandelt sie als "was ich bereits weiß", bevor es die aktuelle Szene liest.
    - Brainstorming-Modus: Geben Sie eine lose Idee ein, und die KI gibt Ihnen 3 Optionen zur Weiterentwicklung der Handlung. Für jede Option wird sofort ein fertiger Block "--- PROMPT-ENTWURF ---" generiert. Nachdem Sie eine Option ausgewählt haben, fügen Sie diesen Prompt in den Skript- oder Audiobook-Modus ein und geben Sie eventuelle Anmerkungen oder Informationen für das Modell ein. Die Handlungsspeicherung ändert sich während des Brainstormings nicht — Sie können ohne Risiko experimentieren!
    - Rohskript-Modus: Hier fügen Sie den im Brainstorming generierten "Prompt-Entwurf" ein. Die KI schreibt ein langes Fragment mit vollständigen Tags [Sprecher X: Name - Emotion] für Dialoge und Effekten [SFX: ...] für Geräusche. Der Text wird automatisch zu Ihrer Datei (z.B. neue_szene.txt) im Ordner skripty/ hinzugefügt.
    - Traditioneller Audiobook-Modus: Modus für Schriftsteller. Die KI generiert reine literarische Prosa — keine Tags, keine Phonetik, klassische Dialoge in die Erzählung eingebettet. Der Text wird genauso wie im Skript-Modus zur Datei hinzugefügt.
    - Automatische Charaktererstellung: Das Skript ist so programmiert, dass es automatisch neue [Sprecher]-Tags erstellt, wenn die Handlung einen neuen Charakter erfordert. Tipp: Wenn die KI einen interessanten Charakter erstellt, kopieren Sie dessen Tag und fügen Sie ihn in das Weltbuch ein, damit das Modell ihn dauerhaft speichert!

    Projektverwaltung — drei Aktionsschaltflächen:
    - {rezyser.btn_wczytaj_label}: Lädt eine bestehende Projektdatei in den Speicher. Nur verfügbar, wenn der Speicher leer ist und ein Dateiname eingegeben wurde.
    - Aktuelle löschen (Zusammenfassung behalten): Löscht nur die aktuelle Geschichte. Die Zusammenfassung im Langzeitspeicher und das Weltbuch bleiben erhalten — ideal für die Fortsetzung eines langen Buches nach der Generierung einer Zusammenfassung.
    - Projekt schließen (Harter Reset): Löscht das Projekt vollständig. Entfernt die Geschichte, die Zusammenfassung, das Weltbuch und setzt alle Zähler zurück. Verwenden Sie dies beim Wechsel des Projekts oder einer neuen Geschichte.

    Historische Anmerkung — warum Modi jetzt vor versehentlicher Änderung geschützt sind:
    In früheren Versionen der Anwendung wurde die Konsistenz des kreativen Modus innerhalb eines Projekts nicht überwacht. Das Ergebnis war eine subtile kreative Möglichkeit, die man so beschreiben könnte: Sie beginnen die Geschichte im Skript-Modus, fügen "Akt 1" und "Szene 1" ein (die Anwendung ist begeistert von Ihrer Konsequenz), generieren einige Bildschirme Spannung mit Tags [SFX: Türknall] und [Sprecher 1: Marek - resigniert]... und dann — weil gerade die Inspiration kam — klicken Sie auf "Kapitel 1 einfügen". Die Anwendung fügt ohne zu zögern die Überschrift "Kapitel 1" in die Datei ein, direkt nach "Szene 3". Sie haben jetzt in der Datei eine Hybridstruktur aus einem Radiohörspiel der 50er Jahre und einem Gesellschaftsroman. ElevenLabs sieht diese Struktur, sieht die Kapitelüberschrift mitten im Akt und entscheidet, dass es wahrscheinlich ein Fehler in der Matrix ist. Das Inhaltsverzeichnis sieht aus wie das Werk eines avantgardistischen Künstlers. Der Audiobook-Architekt hingegen geht davon aus, dass Sie ein erwachsener Mensch sind und verarbeitet es einfach ohne ein Wort — aber auch ohne jegliche Garantie für das Ergebnis. Seit Version 12.0 blockiert die Benutzeroberfläche einfach den Moduswechsel, wenn bereits eine Geschichte im Speicher ist. Brainstorming ist immer verfügbar — Sie können dort ohne Einschränkungen planen.


    Showrunner-Prompts — KI als Serienautor (aus Version 7, beibehalten)

    Dies ist die größte Änderung, die in Version 7 eingeführt wurde und unverändert beibehalten wurde. Sie ist nicht in der Benutzeroberfläche sichtbar, verändert jedoch radikal die Qualität der generierten Handlung.

    Ein Showrunner ist in der Fernsehbranche die Person, die für das Gesamtbild einer Serie verantwortlich ist — er sorgt dafür, dass die Handlung niemals zu einer einfachen Lösung führt, sondern ständig dichter wird, Konflikte anhäuft und den Zuschauer über viele Staffeln hinweg in Spannung hält. In Version 7 wurde diese Philosophie direkt in die systemischen Anweisungen der KI eingebaut.

    Anti-Closure-Direktive — Stand in Version 8

    Trotz des Testens verschiedener Ansätze wird das Anti-Closure-Verbot oft notorisch vom Modell gebrochen, insbesondere im traditionellen Audiobook-Modus. Die KI hat eine starke Tendenz, die Geschichte bei jeder Gelegenheit "abzuschließen" — sie fügt zusammenfassende Sätze in die Handlung ein, schafft falsche Happy Ends oder schließt Handlungsstränge mitten im Kapitel ab, als wäre jedes Fragment das letzte. Das Ergebnis ist, dass das nächste Fragment von vorne beginnt, ohne natürliche Kontinuität.

    Deshalb ist die oben beschriebene Schnittmeisterregel so wichtig: Wenn die KI das Verbot bricht und die Szene selbst schließt, ist es Ihre Aufgabe als Regisseur, die .txt-Datei zu öffnen, diese letzten Sätze zu löschen und den Text an einer spannenden Stelle abzubrechen, bevor Sie ihn erneut in die Anwendung laden.

    Jeder Modus hat eine eingebaute Anti-Closure-Direktive:

    - Brainstorming: Die KI agiert wie ein Serienautor für eine mehrstaffelige Serie. Jede der 3 vorgeschlagenen Optionen MUSS Hindernisse anhäufen, neue Dilemmata einführen, offene Handlungsstränge und Cliffhanger schaffen. Absolutes Verbot, Optionen vorzuschlagen, in denen sich die Protagonisten dauerhaft versöhnen, das Hauptproblem ohne erhebliche Konsequenzen überwinden oder die Geschichte einem schnellen Ende zusteuert. Verbot, billige, magische Orte zu erfinden, die die Architektur der Welt brechen.
    - Rohskript-Modus: Absolutes Verbot, den Text mit Zusammenfassungen, Moralen oder Klammern zu beenden. Die KI soll die Handlung natürlich an einer spannenden Stelle (Cliffhanger) abbrechen, ohne eine Schlussfolgerung zu ziehen, damit das nächste Fragment die Erzählung nahtlos übernehmen kann.
    - Traditioneller Audiobook-Modus: Absolutes Verbot, den Text mit pathetischen Zusammenfassungen, dem Schließen von Handlungssträngen oder der Andeutung eines Endes der Geschichte zu beenden (z.B. "Sie war bereit für neue Herausforderungen", "Sie erkannte, dass es Zeit war, weiterzugehen"). Der Text soll mitten in der laufenden Handlung, Spannung oder einem offenen Gedanken abbrechen.

    Ausnahme von der Regel: Wenn Sie ausdrücklich um ein Ende, einen Abschluss oder einen Epilog bitten, wird die KI ein zufriedenstellendes Ende der Geschichte generieren — das Verbot gilt nicht, wenn Sie selbst darum bitten.


    Verwaltung von Akten und Szenen (Skript-Modus, aus Version 7, beibehalten)

    Der Rohskript-Modus verfügt über ein dediziertes Panel "{rezyser.struktura_heading}" mit Schaltflächen zum Aufbau der Hörspielstruktur in Echtzeit.

    - Akt X einfügen: Fügt eine Aktüberschrift ein (z.B. "Akt 2") UND fügt automatisch darunter "Szene 1" hinzu — denn jeder neue Akt beginnt mit der ersten Szene. Der Aktzähler springt auf die nächste Nummer, und der Szenenzähler wird auf 2 zurückgesetzt (bereit für die nächste Szene in diesem Akt).
    - Szene X einfügen: Fügt nur die Szenenüberschrift ein (z.B. "Szene 3") innerhalb des aktuellen Akts. Der Szenenzähler erhöht sich automatisch.

    Intelligentes Laden von Dateien: Wenn Sie eine vorhandene Skriptdatei laden, scannt die Anwendung sie automatisch und stellt die Akt- und Szenenzähler auf die richtigen Nummern ein. Der Szenenzähler wird immer innerhalb des letzten Akts in der Datei berechnet.

    Prolog und Epilog: Die Schaltflächen "{rezyser.btn_prolog_label}" und "{rezyser.btn_epilog_label}" sind für beide Modi gemeinsam und im selben Panel verfügbar.

    Der Audiobook-Architekt wandelt Akte automatisch in Hauptnavigationspunkte (Überschrift 1) für ElevenLabs und NVDA um — Szenen werden als fettgedruckter Text im Dokument sichtbar, aber im Inhaltsverzeichnis unsichtbar.


    Intelligentes Kapitelmanagement (Audiobook-Modus, aus Version 5, beibehalten)

    Das LLM generiert maximal etwa 5000 Zeichen pro Anfrage — das ist zu wenig für ein vollständiges Kapitel. Daher arbeiten Sie iterativ: Sie generieren fortlaufend Fragmente mit der Schaltfläche "An AI senden", bis Sie der Meinung sind, dass das Kapitel fertig ist. Dann klicken Sie auf "Kapiteltrennung einfügen" — die Anwendung fügt eine Überschrift in die Datei und den Speicher ein, und der Kapitelzähler springt automatisch auf die nächste Nummer.

    Schaltflächen im Panel:

    - Kapiteltrennung einfügen (Kapitel X): Fügt eine Überschrift (z.B. "Kapitel 3") in die Datei und den Speicher ein. Der Kapitelzähler aktualisiert sich automatisch.
    - Prolog einfügen: Funktioniert nur am Anfang, wenn der Speicher leer ist. Schutz vor versehentlichem Einfügen eines Prologs in der Mitte der Geschichte.
    - Epilog einfügen: Schließt die Geschichte ab. Nach dem Einfügen eines Epilogs mit Inhalt blockiert die Anwendung die Generierung neuer Fragmente — das ist beabsichtigt, denn nach dem Ende der Geschichte gibt es nichts mehr hinzuzufügen.

    Intelligentes Laden von Dateien: Wenn Sie eine vorhandene Datei laden, scannt die Anwendung sie automatisch und stellt den Kapitelzähler auf die richtige Nummer ein. Wenn die Datei einen Prolog und drei Kapitel hat, zeigt der Zähler "Kapitel 4" an — ohne manuelles Zählen.


    Handlungsakkumulator — wie der AI-Speicher funktioniert

    In den Modellspeicher gelangt ausschließlich der reine Text der Geschichte — das, was die KI tatsächlich geschrieben hat. Anweisungen, Optionen und Pläne verschwinden nach der Verwendung und belasten den Kontext nicht. Das Ergebnis? Das Modell bleibt länger fokussiert, erinnert sich besser an die Akzente der Charaktere und weicht seltener von den Regeln des Weltbuchs ab.

    Der "Modellspeicher"-Indikator auf dem Bildschirm zeigt an, wie viel Platz Ihre Geschichte bereits einnimmt:
    - Grün (bis zu 150.000 Zeichen): Das Modell ist voll fokussiert, Sie haben einen sicheren Puffer.
    - Gelb (150.000 – 175.000 Zeichen): Sie nähern sich der Grenze. Die KI könnte beginnen, Aussagen zu kürzen und Regeln zu ignorieren. Beginnen Sie langsam, den Handlungsstrang abzuschließen.
    - Rot (über 175.000 Zeichen): Kritische Überlastung!

    Unendlicher Speicher (aus Version 6, beibehalten)

    Wenn der rote Alarm aufleuchtet, müssen Sie nicht mehr manuell eine Zusammenfassung kopieren. Geben Sie im Brainstorming-Modus einen Befehl ein, der das Wort "Zusammenfassung" oder "Resümee" enthält — die KI generiert eine prägnante Wissenskapsel über die gesamte bisherige Handlung. Klicken Sie dann auf die Schaltfläche "Zusammenfassung speichern (dauerhaft)" — die Anwendung erstellt automatisch eine Datei _zusammenfassung.txt im Ordner skripty/ und schützt sie vor versehentlichem Überschreiben. Nach dem Speichern leeren Sie den Speicher und können im aktuellen Dokument weiterarbeiten. Die Zusammenfassung laden Sie vor der nächsten Sitzung in das Feld für Langzeitspeicher — und Sie können die Geschichte unendlich fortsetzen, ohne Längenbeschränkungen. Sie müssen nur daran denken, dass, wenn die gesamte Geschichtsdatei über 175.000 Zeichen enthält, um die Arbeit sicher zu unterbrechen und später fortzusetzen, Sie eine Zusammenfassung der Geschichte generieren und speichern müssen. Die KI fügt jetzt auch einige der letzten Absätze der Geschichte hinzu, wenn die Zusammenfassung erstellt wird.

    Automatische Zusammenfassung: Wenn der Speicher in den Alarmzustand wechselt, schaltet der Brainstorming-Modus automatisch in den Notfallmodus — anstatt sofort Optionen zu generieren, erstellt er zuerst eine detaillierte Zusammenfassung der gesamten bisherigen Handlung und speichert sie in <ZUSAMMENFASSUNG>-Tags. Die Anwendung erkennt diese Tags und überträgt die Zusammenfassung automatisch in das Langzeitspeicherfeld. Keine manuelle Arbeit!

    Intelligentes Laden mit Zusammenfassungsdatei: Wenn Sie ein Projekt laden, das bereits eine gespeicherte Zusammenfassungsdatei hat (z.B. znieczulica_zusammenfassung.txt), lädt die Anwendung die Zusammenfassung automatisch in den Langzeitspeicher und lässt den aktuellen Speicher leer. So verschwenden Sie keine Tokens für das erneute Laden der gesamten Geschichte — das Modell kennt den Kontext aus der Zusammenfassung und ist bereit für eine unendliche Fortsetzung.
  krok_4_postprodukcja: |
    SCHRITT 4: Postproduktion in der Regie

    Nach dem Schreiben der Geschichte steht Ihnen ein Postproduktionswerkzeug zur Verfügung, das unten im Regie-Panel verfügbar ist (erscheint nur im Hörbuchmodus).

    Kapitelüberschriften vergeben (Hörbuchmodus)

    Die KI analysiert die gesamte Geschichte und schlägt beschreibende, literarische Titel für jedes Kapitel (sowie gegebenenfalls Prolog und Epilog) vor. Das Modul iteriert über die Kapitel der gespeicherten Datei und vergibt kurze Titel, indem es nur die Anfänge jedes Kapitels analysiert (bis zu 6000 Zeichen). Es gibt ausschließlich eine nummerierte Liste von Titeln zurück — ohne den Inhalt des Buches neu zu schreiben.

    Hinweis: Das Modul erfordert, dass die Datei bereits auf der Festplatte gespeichert ist (generiert oder geladen). Wenn die Datei nicht existiert, zeigt die Anwendung eine entsprechende Meldung an.
  krok_5_poliglota_intro: |
    KROK 5: Poliglota AI

    Anwendung für Übersetzungen und das Erzwingen starker Akzente auf Screenreader-Synthesizern. Gehe zu ihr, indem du auf die Schaltfläche "{main.btn.poliglota}" in der Symbolleiste klickst oder Werkzeuge → {main.menu.poliglota} aus dem Menü wählst (Tastenkürzel: Strg+2).

    Modus 1: Normaler Übersetzer (Verwendet AI - Kostenpflichtig)

    Ideal zum Anhören von Geschichten in einer schönen, korrekten Fremdsprache.

    - Lade die Datei mit der Schaltfläche "{poliglota.btn_wczytaj}" oder durch Klicken auf "Durchsuchen..." zum Auswählen der Datei im Systemfenster.
    - Wähle den Modus "AI-Übersetzer", gib die Zielsprache ein (z.B. "Finnisch").
    - Das Skript übersetzt den Inhalt. Wenn du eine .html-Datei lädst, wird nur der für den Leser sichtbare Text übersetzt und der Sprachcode im HTML-Tag aktualisiert.
    - Wenn du eine normale .txt- oder .md-Datei lädst (z.B. ein vom Regisseur generiertes Skript), speichert das Skript das Ergebnis nach der Übersetzung automatisch als .html-Datei mit eingebettetem Sprach-Tag — bereit für NVDA ohne zusätzliche Arbeit.
    - Unterstützt auch .docx-Dateien.

    Intelligente Blockaufteilung: Lange Texte werden automatisch in Blöcke von bis zu 10.000 Zeichen aufgeteilt und sequentiell mit Fortschrittsbalken übersetzt.

    Fehlerresistentes Fortschrittsspeichern (NEU in Version 9): Jeder übersetzte Block wird sofort in einer versteckten temporären Datei im Systemordner der Anwendung gespeichert. Wenn die Übersetzung aufgrund eines erschöpften API-Limits unterbrochen wird, erkennt die Anwendung beim nächsten Start diese Datei automatisch, stellt den bereits bezahlten Fortschritt wieder her und setzt die Arbeit ruhig an der Unterbrechungsstelle fort — ohne manuelles Kopieren. Nach erfolgreichem Abschluss wird die temporäre Datei automatisch gelöscht.

    Warum ist das wichtig? In Version 8 hatte der Ansatz zur Wiederaufnahme der Übersetzung einen kritischen, stillen Fehler: Wenn man die Datei mit der Teilübersetzung nicht umbenannte und den übersetzten Abschnitt gemäß den Anweisungen ausschneidete und dann sofort die Übersetzung des Rests fortsetzte — öffnete die Anwendung die Ausgabedatei im Überschreibmodus. Der bezahlte Fortschritt wurde unwiderruflich und unbemerkt gelöscht, bevor man es überhaupt bemerkte. Version 9 eliminiert diese Falle vollständig: Das Speichern ist nach jedem Block dauerhaft, unabhängig davon, was man danach tut.

    Modus 2: Regisseur-Modus / Akzente (Kostenlos - Funktioniert lokal)

    Werkzeug zum "Verfälschen" von Text. Erzwingt gebrochenes Polnisch auf den Synthesizern.

    Das integrierte Dropdown-Menü des Regisseur-Modus ermöglicht die direkte Auswahl eines Akzents aus einer Liste. Verfügbare Optionen sind:
    Englisch (Samantha / Mark — Vocalizer/Apple, Zira / Hazel — OneCore)
    Russisch (Milena — Vocalizer/Apple, Irina / Pavel / Yuri — OneCore, eSpeak)
    Französisch (Thomas / Amelie — Vocalizer/Apple, Julie — OneCore)
    Polnisch (Ewa — Vocalizer, Paulina — OneCore)
    Spanisch (Jorge / Monica — Vocalizer/Apple, Helena — OneCore)
    Isländisch (Gudrun — OneCore, eSpeak; Hinweis: Vocalizer unterstützt diese Sprache nicht!)
    Italienisch (Alice / Luca — Vocalizer/Apple, Elsa — OneCore)
    Finnisch (Satu / Mikko — Vocalizer/Apple, Heidi — OneCore)
    Und zwei Optionen zur Bereinigung ohne Akzent:
    "Keiner (Bereinigung OHNE Normalisierung von Zahlen)"
    "Keiner (Bereinigung MIT Normalisierung von Zahlen)"
    Die Option mit Zahlen-Normalisierung wandelt automatisch Ziffern in ihre ausgeschriebene Form um (z.B. wird 15 zu "fünfzehn") vor der Verarbeitung — so liest NVDA Zahlen flüssig, und wenn der Text einen erzwungenen Akzent hat, bekommt die Zahl ihn auch, ohne Ausnahmen.
    Ihr fragt euch sicherlich, ob der Synthesizer in der Lage sein wird, solche normalisierten Zahlen je nach Kontext zu deklinieren? Die Antwort lautet: nein. Und das ist ein beabsichtigtes Feature. Wie allgemein bekannt ist: "Polnisch ist eine schwierige Sprache" — und ein Ausländer, der unsere Grammatik bricht, fügt dem gebrochenen Akzent nur Authentizität hinzu!

    Tag-Reparierer (NEU in Version 9): Am Ende der Liste findest du eine zusätzliche Option — den Tag-Reparierer. Er wendet keine phonetischen Regeln oder Bereinigungen an. Er macht nur eine Sache: Er injiziert in die Datei den von dir angegebenen zweibuchstabigen ISO-Sprachcode (z.B. "fi" für Finnisch, "en" für Englisch). Nützlich, wenn du bereits eine fertige Datei hast — z.B. zuvor vom AI-Übersetzer übersetzt — aber aus irgendeinem Grund mit einem falschen oder fehlenden Sprach-Tag herausgekommen ist. Anstatt sie neu zu übersetzen, startest du einfach den Reparierer mit dem richtigen ISO-Code und hast in Kürze eine korrekte Datei.

    Das Skript bereinigt Regieanweisungen in Klammern — es entfernt ganze Textabschnitte, die in runden Klammern stehen (z.B. "(mit eingeflochtenen Atemzügen)", "(flüsternd)", "(ironisch)"). ElevenLabs soll ausschließlich Dialoge und Erzählungen lesen, nicht in den Text eingeflochtene Regieanweisungen.

    Das Skript bereinigt auch Markdown-Markierungen — es entfernt Hashtags von Überschriften (z.B. #, ##, ###), Gleichheitszeichen, die als Unterstreichungen von Überschriften verwendet werden, sowie verwaiste Kommata, die den Lesefluss des Synthesizers stören könnten.

    - Schutzschild: Das Skript schützt alle HTML-Tags. Es verfälscht nur Dialoge und Erzählungen.
    - Funktioniert lokal und kostet nichts!

    Chiffre: Textumkehrer

    Der Textumkehrer erweitert Abkürzungen, bevor er den Satz umkehrt — ohne Erweiterung würden gepunktete Abkürzungen in phonetischen Unsinn umgekehrt werden (Deutsch Beispiel: ".bZ").

    - "z.B." → "zum Beispiel"
    - "d.h." → "das heißt"
    - "usw." → "und so weiter"
    - "bzw." → "beziehungsweise"
    - "ggf." → "gegebenenfalls"

    Beispiel für Unsinn: ".Bz"

    Chiffre: Typoglycemia

    Laut einer Untersuchung an der Cmabrigde Uinervtisy ist es egal, in welcher Reihenfolge die Buchstaben in einem Wort sind, das Einzige, was wichtig ist, ist, dass der erste und letzte Buchstabe am richtigen Platz sind.

    "Enitnrech gmeäß eneir Utnesurhc an der Cmabrigde Uinervtisy, ist es eagl, in wlehcer Rneiehfoge die Bcuhstbaen in eneim Wrot snid, das Eiznige, was wcihtig ist, ist, dass der esrte und ltzete Bchstabe am rcihtigen Paltz snid."
  krok_5_tryb_szyfrant: |
    Tryb 3: Verschlüsseler (NEU in 13.0 — Textspielereien, kostenlos, lokal)

    Der dritte RadioButton im Polyglot, neben dem AI-Übersetzer und dem Regisseur-Modus: „Verschlüsseler-Modus (Textspielereien, zufälliges Stottern)". Er aktiviert sechs lokale Algorithmen zur Textverzerrung — für Spiele, Rätsel, Sprachpuzzles. Nach Auswahl des Modus erscheint eine Dropdown-Liste der Algorithmen, und für einen von ihnen (Caesar-Verschlüsselung) ein zusätzliches Zahlenfeld für die Verschiebung.

    Verfügbare Algorithmen (im Menü „Wähle Verzerrungsalgorithmus" markieren):

    - Textumkehrer (Rückwärtslesen mit Großbuchstaben) — jeder Satz wird Zeichen für Zeichen umgekehrt, wobei Punkt/Ausrufezeichen/Fragezeichen am Ende und Großbuchstaben am Anfang beibehalten werden. Vor dem Umkehren erweitert das Skript gängige Abkürzungen (z.B., d.h., usw., bzw., ggf. usw.), damit das Ergebnis nach dem Umkehren noch Sinn ergibt — ohne dies würde „z.B." nach dem Umkehren in das unsinnige „.Bz" verwandelt.

      Inspiration: Mission aus dem Programm „The Traitors. Verräter". Als die Moderatorin den Teilnehmern ohne Vorwarnung ein bekanntes polnisches Lied aus einem Märchen zeigte — einfach rückwärts abgespielt — waren die Reaktionen wie „Welche Sprache ist das?", „Das muss Armenisch sein", „Ungarisch oder Finnisch". Die eigentliche Mission bestand darin, dass ein Team im Wald den rückwärts geschriebenen Text des Liedes erhielt, ihn in dieser umgekehrten Form singen sollte, das andere Team es aufnahm, rückwärts abspielte — und theoretisch das Originallied zur Erratung zurückgewann. Genau dasselbe lustige phonetische Missverständnis erzeugt unser Textumkehrer, wenn du die verarbeitete Datei durch einen TTS-Synthesizer laufen lässt.

    - Typoglycämie (Vermischte Wortmitten) — klassischer psycholinguistischer Effekt: „Man knan den Txet in jderer Riehnfolge der Bstuchaben lseen, solgne die erste und ltezte Bstuchabe am rcihtigen Platz sind". Das Skript mischt zufällig die Mitte jedes Wortes, das länger als 4 Zeichen ist, der erste und letzte Buchstabe bleiben unberührt. Hervorragend für den Test „Wie viel sehe ich wirklich, und wie viel errät mein Gehirn".

    - Kaputtes Telefon / Schlangendialekt — jedes „s", „z" oder der Doppelbuchstabe „sch" wird zufällig zu einem Zischen von 4-8 Zeichen verlängert („ssssss", „zzzzzz", „sssssssch"). Inspiration: Snecko aus dem Spiel „Slay the Spire". Effekt: Der Text klingt, als ob ihn eine Schlange mit Sprachfehler gelesen hätte.

    - Vokalisierer (Alles dröhnt auf „O") — jeder Vokal im Text wird durch „o" ersetzt, wobei die deutschen Umlaute erhalten bleiben. „Guten Tag" → „Goton Tog". Je länger der Text, desto lustiger der Effekt (und der Screenreader liest es mit voller Überzeugung).

    - Starkes Stottern / Beschädigter Roboter — fügt Stottern am Anfang von Wörtern hinzu: „Ko-ko-ko-komputer", „du-du-dusche". Bei kurzen Wörtern (weniger als 3 Zeichen) ignoriert der Algorithmus sie. Wenn der zweite Buchstabe des Wortes ein Konsonant ist, werden die ersten beiden Buchstaben wiederholt (natürlicherer Effekt); wenn ein Vokal, wird nur der erste wiederholt.

    - Caesar-Verschlüsselung (Verschiebung des deutschen Alphabets) — klassischer Substitutionscode: Jeder Buchstabe wird um N Positionen im deutschen Alphabet verschoben (ABCD…ÄÖÜ, 29 Zeichen). Den Verschiebungswert gibst du im Zahlenfeld „Caesar-Verschlüsselungsverschiebung (0 = zufällig, Bereich -28…28)" ein. Wenn du 0 eingibst — wählt die Anwendung eine Verschiebung im Bereich 1-27 zufällig aus und zeigt sie nach Abschluss in einer Nachricht an (damit du später entschlüsseln kannst). Zeichen außerhalb des Alphabets (Zahlen, Interpunktion, Leerzeichen) bleiben unverändert.

    Praktische Anwendung: Die Verschlüsselungen speichern das Ergebnis im gleichen Format wie der Regisseur-Modus (.html mit Sprach-Tag oder .docx mit XML-Tags), sodass NVDA sie mit der Stimme der entsprechenden Sprache liest. Besonders der Textumkehrer und der Vokalisierer klingen im Synthesizer viel interessanter, als wenn du sie mit den Augen liest — denn das Gehirn versucht beim visuellen Lesen automatisch, den Text zu „entschlüsseln", während TTS ihn genau so liest, wie er geschrieben ist.

    Alle sechs Verschlüsselungen sind auch in einer breiteren, zugänglichen Sprache in der Datei docs/dictionaries.pl.txt im Anwendungspaket beschrieben — zusammen mit Tipps, wie man ohne Programmierkenntnisse eine eigene Verschlüsselung vom Typ „Buchstabentausch" hinzufügen kann (z.B. Schulsprache, Kauderwelsch).
  krok_5_detekcja_jezyka: |
    Spracherkennung

    Bevor das Skript den Text "verändert", überprüft es, in welcher Sprache er geschrieben ist. Wenn es erkennt, dass es sich nicht um Polnisch handelt, wird eine Warnung angezeigt. Die phonetischen Regeln sind auf die polnische Sprache zugeschnitten — die Anwendung auf fremdsprachige Texte würde unvorhersehbare Ergebnisse liefern.
  krok_5_akcenty_nvda: |
    Akzente optimiert für lokale Sprachsynthesizer (NVDA)

    Die Akzente wurden zu 100 % für lokale, kostenlose und kostenpflichtige Sprachsynthesizer-Lesegeräte — Vocalizer und eSpeak in NVDA — entworfen. Dies garantiert Stabilität und Vorhersehbarkeit des Effekts auf jedem Computer.

    Warum nicht ElevenLabs? Tests mit längeren Dokumenten haben gezeigt, dass die phonetische Verzerrung des Textes in Engines wie ElevenLabs den beabsichtigten Akzent nicht erzwingt — die Engine "rät" einfach die Sprache und macht daraus eher einen west-/südslawischen Akzent. Lokale NVDA-Synthesizer sind in dieser Hinsicht deutlich gehorsamer.
  krok_5_specyfika_tts: |
    Spezifika lokaler Sprachsynthesizer (TTS)

    Verschiedene TTS-Engines verhalten sich unterschiedlich. Nachfolgend die wichtigsten Unterschiede, die direkten Einfluss auf die Akzente haben:

    eSpeak (Open Source)
    Leichte, kostenlose Engine mit einer riesigen Sprachdatenbank — unterstützt z.B. Isländisch. Sehr streng bei der Zeichenkodierung, was sie vorhersehbar macht. Hat jedoch phonetische Nachteile: Oft werden Phoneme zwischen Sprachen geteilt, wodurch z.B. Ukrainisch mit einem russischen Akzent klingt.
  krok_5_tiflotecnia: |
    Tiflotecnia Voices für NVDA (Cerrence-Stimmen — ehemals Vocalizer von Nuance)

    Tiflotecnia Voices ist der direkte Nachfolger des Vocalizers von Nuance — eine kommerzielle Engine mit Stimmen der neuen Generation von Cerrence, die als .nvda-addon-Paket im NVDA Add-on Store vertrieben wird. Der alte Vocalizer (32-Bit-.dll-Bibliotheken von Nuance) wurde mit NVDA 2026.1 eingestellt; Cerrence hat die Stimmen auf 64-Bit umkompiliert und Tiflotecnia hat sie unter neuem Namen veröffentlicht. Die Aussprachequalität ist spürbar besser als in der vorherigen Generation.

    Installation: NVDA → Werkzeuge → Add-on Store → suche nach „Tiflotecnia Voices for NVDA" → Installieren. Nach der Installation erscheint im NVDA-Menü ein dediziertes Untermenü „Tiflotecnia Voices" sowie eine eigene Kategorie in den NVDA-Einstellungen. Die GUI des Add-ons führt Schritt für Schritt durch den Kauf der Lizenz (oder die Aktivierung der 7-tägigen Testphase), die Auswahl und Installation der ersten Stimmen (z.B. die polnische Ewa für flüssiges Lesen von Systemsteuerungen, die finnische Satu für Akzente im Polyglot). Die integrierte Hilfe des Add-ons ist klar, daher wiederholen wir das Verfahren hier nicht — lassen Sie sich einfach vom Add-on führen.

    Hinweis für Umsteiger von Vocalizer und Eloquence: Es ist ein Upgrade zu einem günstigeren Preis verfügbar. Verfahren: Nach erfolgreicher Zahlung schreiben Sie sofort eine E-Mail an die auf dem Erfolgsbildschirm der Zahlung verlinkte Adresse und bitten um Validierung des alten Aktivierungscodes — Tiflotecnia bestätigt das Recht auf den Rabatt und regelt den Preis. Ohne diese E-Mail behandelt das System Sie als neuen Kunden.

    Verfügbarkeit der Stimmen: Tiflotecnia Voices unterstützt die meisten Sprachen, die der Vocalizer hatte (z.B. Polnisch, Englisch, Deutsch, Französisch, Spanisch, Finnisch, Italienisch, Russisch). Die Liste der Stimmen pro Sprache ist in der Kategorie der Add-on-Einstellungen vor dem Kauf der Lizenz sichtbar.
  krok_5_onecore: |
    Microsoft OneCore
    Kostenlose Stimmen, die in Windows integriert sind (Mobile Voices). Ein guter Kompromiss zwischen Qualität und Verfügbarkeit der Sprachen. Bietet hohe Qualität und unterstützt die isländische (Gudrun), finnische (Heidi) und italienische (Elsa) Sprache. Hinweis: OneCore unterstützt NICHT nativ das automatische Umschalten der Sprache basierend auf lang-Tags (es sei denn, Sie verwenden den in das System integrierten Bildschirmleser Narrator) — siehe Abschnitt unten.

    Wie lädt man OneCore-Stimmen auf Windows herunter? OneCore-Stimmen sind kostenlos, aber die meisten Sprachen sind nicht standardmäßig installiert. Um fehlende Sprachen herunterzuladen, gehen Sie zu Windows-Einstellungen → Zeit und Sprache → Sprache → Stimmen verwalten (oder "Stimmen hinzufügen"). Wählen Sie eine Sprache aus der Liste (z.B. Isländisch, Finnisch, Italienisch) und klicken Sie auf Herunterladen. Nach dem Herunterladen erscheint die Stimme automatisch in NVDA — ohne zusätzliche Konfiguration.
  krok_5_apple: |
    Apple (iPhone / iPad / Mac) — VoiceOver mit Vocalizer
    Auf Apple-Geräten ist die Vocalizer-Engine nativ im Betriebssystem integriert und unterstützt alle Sprachen ohne zusätzliche Käufe. Standardmäßig sind jedoch kompakte Versionen der Stimmen installiert, die etwas mechanisch klingen. Um ein deutlich besseres, natürlicheres Klangbild zu erhalten, empfiehlt es sich, die erweiterten oder Premium-Versionen herunterzuladen:
    - Auf dem iPhone/iPad: Einstellungen → Bedienungshilfen → VoiceOver → Sprache → Stimme → Sprache auswählen (z.B. Finnisch) → auf den Namen der Stimme tippen (z.B. Satu) → Sie sehen die Optionen "Erweitert" und "Premium". Laden Sie die gewünschte Version herunter — sie benötigt mehr Speicherplatz, aber der Qualitätsunterschied ist deutlich.
    - Auf dem Mac: Systemeinstellungen (oder Systemeinstellungen) → Bedienungshilfen → VoiceOver → VoiceOver-Dienstprogramm öffnen → Sprache → Stimme → auf "Anpassen" neben der ausgewählten Stimme klicken und die erweiterte oder Premium-Version herunterladen.
  krok_5_android: |
    Android — Vocalizer kostenpflichtig pro Stimme
    Auf Android ist Vocalizer als App im Google Play Store verfügbar (suche nach "Vocalizer TTS"). Hinweis: Jede Sprache und Stimme wird separat gekauft — es gibt keine All-in-One-Lizenz. Vor dem Kauf kannst du die Stimme für ein paar Minuten im Demo-Modus testen. Nach dem Kauf ist die Stimme mit deinem Google-Konto verknüpft und kann auf jedem Gerät mit demselben Konto installiert werden.
  krok_5_tagi_jezykowe: |
    Killer-Feature für Blinde: Dateien mit Sprach-Tags

    Das ist eine echte Revolution. Verarbeitete Dateien werden jetzt gespeichert als:

    - .html mit dem Attribut lang (z.B. lang="fi" für Finnisch) — NVDA liest diesen Tag und wechselt automatisch zur entsprechenden Sprachsynthese. Keine manuelle Konfiguration nötig!
    - .docx mit Formatierungserhaltung — jeder Textabschnitt hat ein Sprach-Tag im XML-Dokument eingebettet, sodass Word und NVDA wissen, mit welcher Stimme jeder Abschnitt gelesen werden soll.

    Verarbeitete Dateien werden immer als NEUE Dokumente gespeichert (z.B. akzent_Finski.html).
  krok_5_auto_jezyk_nvda: |
    Automatisches Umschalten der Sprache in NVDA — was Sie wissen müssen

    Damit NVDA die Stimme tatsächlich basierend auf dem lang-Tag umschaltet, muss die Einstellung "Sprache automatisch ändern, wenn unterstützt" aktiviert sein. Sie finden diese in den NVDA-Einstellungen → Sprache. Standardmäßig ist sie beim ersten Start des Screenreaders aktiviert — es ist jedoch ratsam zu überprüfen, ob sie nicht deaktiviert wurde.

    Wichtiges Einschränkung der OneCore-Stimmen: Microsoft OneCore-Stimmen unterstützen diesen Mechanismus nativ nicht mit NVDA, sondern nur mit dem in Windows integrierten Narrator. Es gibt ein inoffizielles NVDA-Add-on namens „One Core Autolang", das versucht, dies zu beheben — aber seine Entwicklung wurde schnell eingestellt. Der Grund ist banal: Jedes Jahr, mit der ersten NVDA-Version des Jahres, gibt es Änderungen, die die API-Kompatibilität brechen (sogenannte API Breaking Changes). Manchmal reicht es aus, das Feld „last tested version" im Add-on-Manifest zu aktualisieren, aber manchmal sind echte Änderungen im Code erforderlich — und der Autor kommt mit den Updates nicht hinterher. Wenn Ihnen das automatische Umschalten der Sprache wichtig ist, sind Tiflotecnia Voices (kostenpflichtig, siehe Abschnitt oben) oder eSpeak (kostenlos, geringere Qualität) eine sicherere Wahl, da sie diesen Mechanismus nativ unterstützen — aber Achtung: Aktuell funktioniert dies in Tiflotecnia Voices mit einem Prioritätsfehler (siehe „Kritischer Haken" unten). Nach dem Kopieren des Patches funktioniert das automatische Umschalten vorbildlich, wie im alten Vocalizer.
  krok_5_alarm_detekcja_jezyka: |
    Kritischer Haken bei Tiflotecnia Voices: fehlerhafte Spracherkennung

    Zunächst die gute Nachricht — der Alarm bezüglich NVDA 2026.1 aus den vorherigen Versionen des Handbuchs hat ein Happy End gefunden: Cerrence hat 64-Bit-Bibliotheken bereitgestellt, Tiflotecnia hat sie in einem .nvda-addon-Paket veröffentlicht, das im Add-on Store verfügbar ist (siehe Abschnitt oben), und der Vocalizer ist bei denen, die ihn bis zum Ende behalten haben, unter einem neuen Namen zurückgekehrt — mit besserer Qualität und ohne 32-Bit-Einschränkungen.

    Mit der Einführung von Tiflotecnia Voices ist jedoch ein neuer kritischer Haken aufgetreten — in der Spracherkennung. In den Einstellungen des Add-ons kann konfiguriert werden, welche Stimme für bestimmte Buchstaben (z.B. lateinische, kyrillische) je nach installierten Stimmen verwendet werden soll. Das Problem liegt in der Prioritätenreihenfolge: Derzeit wird zuerst das Override pro Buchstabe angewendet, dann der Fallback auf den ISO-Sprachcode (in der Praxis unerreichbar für DASSELBE Alphabet, für das bereits ein Override angewendet wurde), und schließlich die gewählte Stimme. Das Ergebnis zeigt sich innerhalb desselben Alphabets: Du hast einen finnischen Text mit dem korrekten Tag `lang="fi"`, Satu als finnische Tiflotecnia-Stimme installiert, ABER in den Einstellungen eine polnische Stimme für lateinische Buchstaben eingestellt — Satu wird diesen Text NICHT lesen, trotz des korrekten ISO-Tags. Das Override pro Buchstabe „polnische Stimme für Latein" gewinnt auf der ersten Ebene, ISO `fi` wird nie geprüft. Für unterschiedliche Alphabet-Paare funktioniert der Mechanismus korrekt (russischer Text + Milena für Kyrillisch + polnische Stimme für Latein — das gesamte Kyrillisch wird mit Milena gelesen, eventuelle lateinische Eigennamen mit der polnischen Stimme; jedes Alphabet bleibt in seinem Override). Nach der Migration vom Vocalizer, bei dem der Sprachwechsel auf Basis von ISO vorbildlich funktionierte, werden Benutzer diesen Rückschritt sofort bemerken — insbesondere diejenigen, die im Polyglot mehrere europäische Akzente (Satu, Alice, Markus) auf derselben lateinischen Buchstabenmenge verwenden.

    Diagnose und Patch: Ich habe das Problem auf Python-Ebene im Add-on-Code diagnostiziert und einen Patch vorbereitet, der die Prioritätenreihenfolge ändert zu: ISO → gewählte Stimme → Buchstaben-Override. Der Patch behält das nützliche Umschalten auf Latein für lateinische Namen im russischen Text bei, wenn in den Einstellungen „Spracherkennung basierend auf Unicode-Zeichen" aktiviert ist. Ich habe den Patch vor 5 Tagen an die Entwickler von Tiflotecnia gesendet — bisher ohne Antwort.

    Was man in der Zwischenzeit tun kann: Wenn dir die korrekte Spracherkennung wichtig ist (es lohnt sich — das war eines der Killer-Features des alten Vocalizers, siehe „Killer-Feature für Blinde" oben), öffne ein Issue im Anwendungs-Repository auf GitHub mit dem Label `tiflotecnia-patch` und deiner E-Mail-Adresse im Inhalt. Ein automatischer Bot wird das Issue sofort mit einer Bestätigung der Meldung schließen (ohne Spur im öffentlichen Thread), und du erhältst den Patch in der Regel innerhalb weniger Tage privat per E-Mail. Der Patch wird NICHT im Anwendungs-Repository oder als Gist veröffentlicht — Tiflotecnia Voices for NVDA ist kommerzielle Software, und die Lizenz des Add-ons erlaubt keine Weiterverbreitung seiner Dateien, auch nicht in modifizierter Form. Nach Erhalt des Patches musst du dessen Inhalt in `%appdata%\Roaming\nvda\addons\TiflotecniaVoices` kopieren und die Dateien ersetzen. Vorsicht beim Kopieren: Wenn Windows nicht nach einer Ersetzung gefragt hat, hast du wahrscheinlich den gesamten Ordner `TiflotecniaVoices_edits` mit seinem Inhalt anstatt nur den Inhalt kopiert — in diesem Fall gehe in den erstellten Unterordner, schneide alles aus, füge es eine Ebene höher ein und überschreibe. Nach erfolgreicher Anwendung des Patches starte NVDA neu — du genießt bessere Cerrence 64-Bit-Stimmenqualität und korrekte Spracherkennung, ein Combo, das kein einzelner Hersteller auf dem Markt bietet. Wir gehen natürlich davon aus, dass du eine gültige Lizenz für Tiflotecnia Voices hast — wir überprüfen das nicht, aber ohne Lizenz kannst du den Patch sowieso nicht auf einen fremden Ordner anwenden.
  krok_6_architekt: |
    SCHRITT 6: Hörbuch-Architekt

    Ein Werkzeug zur Erstellung einer professionellen Dateistruktur für Screenreader und ElevenLabs. Gehe zu ihm, indem du auf die Schaltfläche "{main.btn.konwerter}" in der Symbolleiste klickst oder Werkzeuge → {main.menu.konwerter} aus dem Menü wählst (Tastenkombination: Strg+3).

    Wie funktioniert es?

    1. Gib den Pfad zur Quelldatei in das Textfeld ein oder klicke auf die Schaltfläche "Durchsuchen...", um die Datei im Systemdialog auszuwählen. Das Skript akzeptiert sowohl .txt- als auch .docx-Dateien sowie .html- und .htm-Dateien.
    2. Klicke auf "{konwerter.btn_buduj}".
    3. Das Skript scannt jede Textzeile und wandelt Schlüsselwörter (Akt, Kapitel, Prolog, Epilog, Vorspann) in "Überschrift 1" im Word-Dokument um.
    4. Szenen (Zeilen, die mit dem Wort "Szene" beginnen) werden in fettgedruckten Text umgewandelt — sichtbar im Dokument, aber unsichtbar im Inhaltsverzeichnis von ElevenLabs.
    5. Der gesamte übrige Text (Dialoge, Beschreibungen) bleibt unverändert.
    6. Du erhältst eine Datei architektur_[originalname].docx — ein professionelles Word-Dokument, bereit für die weitere Bearbeitung. Wenn deine Eingabedatei beispielsweise znieczulica.txt hieß, wird die Ergebnisdatei architektur_znieczulica.docx heißen und im selben Ordner wie das Original erscheinen.

    Automatische Bereinigung: Das Skript entfernt automatisch HTML-Tags (wenn der Text aus einem Browser oder einer lokalen .html-Datei stammt, z.B. von Poliglot generiert) sowie Markdown-Überschriften (z.B. ### oder ####) vor der Verarbeitung. Du musst die Datei nicht manuell bereinigen.

    Geschichtenmodus: Automatisches Gruppieren von Zügen in Szenen (ab v15.1)

    Wenn du eine Datei skripte/<spiel>.txt, die vom Modul Interaktive Geschichten generiert wurde, in den Architekten lädst, erkennt der Konverter Zugmarkierungen (z.B. „--- Zug 7 ---") in 9 Sprachen (Zug, Turn, Runde, Turno, Vuoro, Tour, Umferð, Turno, Ход) und fügt alle fünf Züge eine neue Überschrift ersten Grades in der Form „Szene N" ein (die Nummer beginnt bei 1, lokal für die jeweilige Sprache — im Englischen „Scene N", im Deutschen „Szene N" usw.). Die übrigen Zugmarkierungen werden entfernt — sie erscheinen nicht in der Erzählung des Hörbuchs, da „Zug 7" vom TTS ausgesprochen die Immersion des Zuhörers bricht. Das Ergebnis ist eine Word-Datei mit einer natürlichen Aufteilung in Szenen von jeweils einigen Minuten Audio, bereit für den Import in ElevenLabs. Der Mechanismus ist autodetektioniert — gewöhnliche Hörbuchdateien ohne Zugmarkierungen (klassische Erzählung aus dem Regisseur) werden genau wie bisher verarbeitet.

    Ein großer Vorteil für NVDA- und ElevenLabs-Nutzer

    Das Formatieren von "Überschrift 1" für Kapitel ist nicht nur Ästhetik. In NVDA kannst du blitzschnell durch Überschriften navigieren, indem du die Taste H (oder 1 für Überschriften ersten Grades) drückst. Anstatt Hunderte von Seiten zu scrollen, springst du in Bruchteilen von Sekunden von Kapitel zu Kapitel. Das verändert die Arbeitsweise mit langen Dokumenten. In ElevenLabs kannst du sicher sein, dass die Engine automatisch Schnitte einfügt und sich nicht aufhängt, während sie Audioclips dirigiert.
  krok_7_ksiega_swiata: |
    SCHRITT 7: Wie man das Buch der Welt schreibt (Prompt des Architekten und Mini-Markdown-Kurs)

    Die künstliche Intelligenz, die das Hauptstudio antreibt, versteht Befehle am besten, wenn sie im Markdown-Markup-Format formatiert sind. Wenn Sie der KI im Regisseur nur eine lose Idee geben (z.B. "zwei Schwestern im Jenseits"), wird die Maschine aufgrund fehlender Details in Panik geraten und eine banale, vorhersehbare Geschichte erstellen, die die Logik ignoriert.

    Um dies zu verhindern, verwenden Sie einen externen Chatbot (z.B. den kostenlosen ChatGPT oder Claude) als Ihren persönlichen Architekten. In Version 13.0 müssen Sie den Prompt nicht mehr aus der Anleitung abschreiben — im Regisseur-Panel finden Sie direkt unter dem Button „{rezyser.btn_zapisz_ksiege_label}" den Button „{rezyser.btn_prompt_architekta_label}". Klicken Sie darauf, und ein Dialogfenster öffnet sich mit dem fertigen Prompt-Text im „Nur-Lesen"-Feld sowie einem „In die Zwischenablage kopieren"-Button. NVDA gibt den gesamten Inhalt sofort nach dem Öffnen des Fensters bekannt — einfach auf „Kopieren" klicken, in ChatGPT/Claude einfügen (Strg+V) und den Abschnitt „[HIER IHRE IDEE EINFÜGEN]" durch Ihren eigenen Handlungsansatz ersetzen.

    Warum so und nicht durch Kopieren aus der Anleitung? Der Dialog im GUI hat einen entscheidenden Vorteil in Bezug auf die Barrierefreiheit: Er ist nativ und wird ohne Unterbrechungen vom Bildschirmleser gelesen, erfordert keinen Wechsel zum Texteditor (wo polnische „Schwänzchen" und Anführungszeichen oft falsch kopiert werden) und funktioniert identisch auf jedem Betriebssystem. Dasselbe Muster — ein Dialog mit einem kopierbaren Prompt — wird auch im Regelmanager verwendet (siehe SCHRITT 7b unten).

    Wie die KI antwortet: Sie erhalten eine Antwort in zwei Teilen. Der erste Teil ist das Buch der Welt, eingeschlossen in einem Markdown-Codeblock (Markierungen ```markdown … ```). Kopieren Sie NUR den Inhalt des Codeblocks (ohne die Markierungen ```) und fügen Sie ihn in das Feld „Buch der Welt" im Regisseur ein, und klicken Sie dann auf „{rezyser.btn_zapisz_ksiege_label}". Der zweite Teil ist eine Empfehlung, welcher der kreativen Modi (Skript oder Hörbuch) am besten zu Ihrer Idee passt — betrachten Sie dies als Hinweis bei der Auswahl des Modus im RadioBox.

    Mini-Markdown-Kurs im Buch: Ein einzelnes Hashtag (#) ist der Hauptabschnitt (z.B. „# Charaktere"), ein doppeltes Hashtag (##) ist ein Unterabschnitt, Bindestriche (-) erstellen Listen, und doppelte Sternchen (**Text**) heben absolute, unveränderliche Regeln hervor (z.B. „**Der Held LÜGT NIE**"). Für einen fremdsprachigen Charakter fügen Sie einen Akzent-Tag hinzu, z.B. „[Sprecher 1: Marek] - hat einen französischen Akzent". Das Schlüsselwort „Akzent" ist NOTWENDIG — die Anwendungs-Engine erkennt es automatisch und wendet die richtigen phonetischen Regeln auf die Dialoge des Charakters an.

    Tipp: Denken Sie daran, Ihr Buch der Welt regelmäßig zu aktualisieren, wenn Sie die Handlung um neue Orte oder wichtige Charaktere erweitern. Sie können dies manuell oder mit Hilfe eines externen Chatbots tun. Je reicher das Fundament, desto bessere Ergebnisse in der Regie!

    ### Verfügbare Akzente
    - Englisch (Samantha/Mark in Vocalizer, Zira/Hazel in OneCore)
    - Finnisch (Satu/Mikko in Vocalizer, Heidi in OneCore)
    - Italienisch (Alice/Luca in Vocalizer, Elsa in OneCore)
    - Polnisch (Ewa in Vocalizer, Paulina in OneCore)
    - Französisch (Thomas/Amelie in Vocalizer, Julie in OneCore)
    - Spanisch (Jorge/Monica in Vocalizer, Helena in OneCore)

    ### Chiffre: Textumkehrer
    Der Textumkehrer-Chiffre-Abschnitt listet deutsche Abkürzungen (z.B., d.h., usw., bzw., ggf.) auf, die das Skript ERWEITERT, BEVOR es den Satz umkehrt — ohne Erweiterung würden gepunktete Abkürzungen in phonetischen Unsinn umgekehrt (deutsches Beispiel: ".bZ").

    Beispiel für Unsinn: ".bZ"

    ### Chiffre: Typoglycämie
    Laut einer Utnseirchung an der Cmabrigde Uinervtisy ist es eagl, in wlehcer Riehnfolge die Bstuchaben in einem Wrot sind, das Ezniige, was wcihtig ist, ist, dass der erste und ltezte Bstuchabe am rcihtigen Paltz sind.
  krok_7b_manager_regul: |
    KROK 7b: Manager Reguł (Ctrl+4) — Wörterbücher für Linguisten ohne Python

    Version 13.0 führt ein viertes Werkzeug in der Leiste ein: den Manager Reguł. Du öffnest ihn mit der Taste Ctrl+4 oder über das Menü Werkzeuge. Es ist ein visueller Explorer des Ordners dictionaries/, in dem die Anwendung alle phonetischen Regeln (Akzente), Chiffren und Modi des Regisseurs in YAML-Dateien (ein für Menschen lesbares Format, einfacher als JSON) speichert.

    Warum YAML? Bis Version 12.0 waren alle Akzente, kreativen Modi und Filter im Python-Code „eingebettet“. Das Hinzufügen eines neuen Akzents erforderte einen Programmierer. In Version 13.0 wurde alles in .yaml-Dateien im Ordner dictionaries/ ausgelagert — jeder, der den Notizblock öffnen kann, kann einen bestehenden Akzent anpassen („tausche sz gegen sh gegen sch“) oder einen völlig neuen hinzufügen (schwedisch, dänisch, russischer Dialekt).

    Was du im Manager Reguł findest:
    - Dateibaum — vollständige Liste aller YAML-Dateien in dictionaries/ mit Aufteilung nach Quellsprachen (derzeit vollständig implementiert: {lista_kompletnych_jezykow_natywnie}) und Kategorien (akzente/, chifren/, regisseur/). Navigation mit Pfeiltasten wie im Windows-Dateiexplorer, vollständige NVDA-Unterstützung.
    - Schaltfläche „{manager.btn_otworz_label}“ — öffnet die ausgewählte Datei im standardmäßigen System-Notizblock. Du bearbeitest, speicherst, klickst „{manager.btn_odswiez_label}“ und fertig.
    - Schaltfläche „{manager.btn_duplikuj_label}“ — der schnellste Weg zu einem neuen Akzent: Du nimmst eine bestehende Datei (z.B. finski.yaml), gibst einen neuen Namen an (z.B. schwedisch), der Manager erstellt eine Kopie mit dem Kommentar „ändere Felder label und description“ und öffnet sie im Editor.
    - Schaltfläche „{manager.btn_nowy_label}“ — ein Assistent mit Auswahl des Typs (Akzent, Chiffre, Regisseurmodus, neue Quellsprache, algorithmische Chiffre). Für einfache Fälle (Akzent, Chiffre vom Typ „Buchstabentausch“) erstellt der Assistent eine bearbeitbare YAML-Vorlage. Für Fälle, die einen Programmierer erfordern (neue Quellsprache, Algorithmus vom Typ „Wortmitte mischen“), generiert der Assistent ein Prompt für einen AI-Chatbot — du fügst es in ChatGPT ein, erhältst eine fertige YAML-Datei, speicherst sie in dictionaries/ und fertig.

    Praktische Anwendung: Du möchtest einen schwedischen Akzent hinzufügen? Öffne den Manager Reguł, wähle dictionaries/pl/akzente/finski.yaml, klicke „Duplikat“, benenne die Datei in schwedisch um, ändere das Feld label in "Schwedisch (Alva / Oskar)", den ISO-Code in sv, ändere einige Tauschregeln und speichere. Kehre zur Startseite zurück, klicke „{home.btn_odswiez_label}“ und starte die Anwendung neu. Der neue Akzent erscheint im Menü Polyglot (im Regisseurmodus) und — wenn du ihn dem Buch der Welt der Charaktere hinzufügst („[Marek] - hat einen schwedischen Akzent“) — auch in der automatischen Akzenterkennung des Regisseurs.

    Wo du weitere Dokumentation zum Ordner dictionaries/ findest:
    - Datei `docs/dictionaries.pl.txt` (verfügbar im Paket für Endbenutzer im Reiter Releases) — eine kurze, einfache Beschreibung jedes Unterordners, 6 fertige Chiffren, 8 fertige Akzente sowie Ideen, was man selbst ohne Python-Kenntnisse machen kann.
    - Datei `dictionaries/README.md` (nur beim Klonen des Repositories von GitHub verfügbar — Release-Pakete filtern .md-Dateien) — detaillierte technische Dokumentation des YAML-Formats mit Beispielen, Feldlisten, Pipeline-Regeln, Regex. Dieses Dokument richtet sich an Linguisten mit Grundkenntnissen in Programmierung und an Entwickler.
  nvda_a11y: |
    Wichtige Hinweise für Benutzer von Bildschirmlesegeräten (NVDA)

    1. Erfolgs- und Fehlermeldungen

    Wenn die Anwendung ihre Aufgabe beendet (z.B. eine Datei speichert oder auf einen Fehler stößt), erscheint ein Dialogfenster mit einem Titel wie "Erfolg", "Warnung" oder "Fehler". NVDA wird dieses Fenster sofort ankündigen und seinen Inhalt vorlesen. Sie müssen nichts tun — die Dialoge sind vollständig über die Tastatur zugänglich, und der Fokus landet automatisch auf der Schaltfläche "OK". Es gibt keine Tricks mehr mit dem Präfix "Alert" — native wxPython-Dialogfenster werden direkt vom Leser unterstützt.

    2. Wichtige Warnung: Stille Hintergrundverarbeitung

    Nach dem Klicken auf Schaltflächen wie "{rezyser.btn_wyslij_label}" oder "{poliglota.btn_process}" beginnt das Programm sofort mit der Hintergrundverarbeitung. Auf dem Bildschirm erscheint eine Fortschrittsanzeige (Gauge), aber NVDA liest ihren Wert nicht in Echtzeit vor — der Bildschirmleser bleibt während der Arbeit stumm. Klicken Sie nicht erneut auf die Schaltfläche. Warten Sie, bis ein Dialogfenster mit dem Ergebnis oder einer Fehlermeldung erscheint — NVDA wird es automatisch ankündigen.

    3. Navigation zwischen den Werkzeugen

    Die Navigation zwischen den Werkzeugen (Regisseur, Polyglott, Konverter, Regelmanager) erfolgt in einem einzigen Programmfenster über vier Schaltflächen in der Symbolleiste oder über das Menü Werkzeuge (Alt, dann N). Verfügbare Tastenkombinationen: Strg+0 (Startseite), Strg+1 (Regisseur), Strg+2 (Polyglott), Strg+3 (Konverter), Strg+4 (Regelmanager — neu in 13.0). Nach dem Umschalten des Werkzeugs landet der Fokus automatisch auf der Beschreibung des neuen Moduls — NVDA beginnt sofort, die neue Ansicht zu lesen.

    4. Tabulatorreihenfolge und Widget-Namen

    Jedes Interface-Element hat einen klaren deutschen Namen — NVDA wird ihn beim Fokussieren vorlesen. Die Tabulatorreihenfolge ist logisch: von der Werkzeugbeschreibung über die Konfigurationsfelder bis zu den Aktionsschaltflächen. Es gibt keine Überraschungen — die Tastaturnavigation funktioniert wie in jedem anderen nativen Windows-Programm. Alle Menüs und Schaltflächen sind auf Deutsch, und NVDA wird sie mit einer deutschen Stimme ohne zusätzliche Einstellungen vorlesen.
  changelog_9: |
    Wichtige Hinweise zur Version 9.0 / Changelog

    Neue Funktionen und Änderungen in Version 9

    Fehlertolerante Speicherung des Übersetzungsfortschritts (ÄNDERUNG — Behebung eines kritischen Fehlers)
    In Version 8 war das Fortsetzen einer unterbrochenen Übersetzung mit einer stillen, destruktiven Falle behaftet: Wenn der Benutzer den Anweisungen folgte (manuelles Ausschneiden des übersetzten Abschnitts) und dann sofort die Übersetzung des Rests fortsetzte, öffnete die Anwendung die Ausgabedatei im Überschreibmodus — unwiderruflich und unbemerkt wurde der gesamte bezahlte Fortschritt gelöscht. In Version 9 wurde der gesamte Mechanismus neu gestaltet. Jeder übersetzte Block wird jetzt sofort in einer temporären Datei (.jsonl) mit einem zugewiesenen Index gespeichert. Das Fortsetzen erfolgt vollständig automatisch — die Anwendung erkennt die Datei selbst und stellt den Fortschritt ohne jegliches Eingreifen des Benutzers wieder her. Nach erfolgreichem Abschluss wird die temporäre Datei automatisch gelöscht.

    Tag-Reparatur im Regisseur-Modus (NEU)
    Dem Menü des Regisseur-Modus wurde eine neue Option hinzugefügt — der Tag-Reparatur. Es injiziert ausschließlich den vom Benutzer angegebenen zweibuchstabigen ISO-Sprachcode in die Datei, ohne jegliche phonetischen Regeln oder Bereinigungen anzuwenden. Ein Rettungswerkzeug für den Fall, dass die fertige Datei mit einem falschen oder fehlenden Sprach-Tag herauskommt.

    Automatische Konvertierung von .txt zu .html im Übersetzer-Modus (ÄNDERUNG)
    Textdateien (.txt und .md), die vom KI-Übersetzer übersetzt werden, werden jetzt automatisch im .html-Format mit eingebettetem Sprach-Tag gespeichert. Dadurch liest NVDA die Datei sofort mit der richtigen Stimme — ohne zusätzliche Schritte seitens des Benutzers.

    Intelligente Dateibenennung im Architekt (ÄNDERUNG)
    Der Audiobook-Architekt speichert die Ergebnisdatei nicht mehr immer unter dem gleichen Namen architektura_gotowa.docx. Jetzt ergibt sich der Name aus der Eingabedatei — z.B. für znieczulica.txt ist die Ergebnisdatei architektura_znieczulica.docx. Die Datei erscheint im gleichen Ordner wie das Original.

    Funktionen unverändert aus Version 8

    Rückkehr zum .txt-Format für Projektdateien (ÄNDERUNG)
    Projektdateien und Zusammenfassungen werden jetzt im .txt-Format statt .md (Markdown) gespeichert. Das Experiment mit dem .md-Format als psychologische Barriere gegen Bearbeitung erwies sich als ineffektiv — die KI bricht notorisch die Anti-Closure-Regel, und es ist oft besser, die Datei laufend zu bearbeiten und dann den Speicher neu zu laden, damit die KI, soweit möglich, keine versteckte Erlaubnis zum Brechen des Verbots erhält. Das .txt-Format ist für jeden intuitiver und lesbarer.

    Regel des Montageleiters — neue Warnung
    In der Anleitung (und in zukünftigen Versionen der Benutzeroberfläche) wurde eine deutliche Warnung hinzugefügt, die erklärt, was in Projektdateien bearbeitet werden darf und was nicht. Der Benutzer hat das volle Recht, Dialoge und Inhalte zu bearbeiten, darf jedoch keinesfalls die Strukturzeilen (Akt, Szene, Kapitel, Prolog, Epilog) modifizieren — deren Beschädigung beeinträchtigt die Navigation in NVDA, die Aufteilung in ElevenLabs und das Inhaltsverzeichnis in Word.

    Aktualisierter Prompt des Architekten (ÄNDERUNG)
    Der Prompt an den externen Chatbot (ChatGPT/Claude) wurde neu gestaltet. Anstatt rohen Markdown-Code zurückzugeben, gibt die KI jetzt die Antwort in zwei deutlich getrennten Teilen zurück: Teil 1 ist das Buch der Welt, eingeschlossen in einem Markdown-Codeblock (leicht ohne Markierungen zu kopieren), und Teil 2 ist die Modusempfehlung als normaler Text außerhalb des Blocks — es wird beraten, ob besser der Modus des Rohskripts oder der Modus des traditionellen Audiobooks verwendet werden sollte. Auch die Beschreibung der Charakter-Tags wurde geändert: statt "klanglich" wird jetzt von Akzent und Stimmton im Tag gesprochen, z.B. [Speaker 1: Name] - lispelt und französischer Akzent.

    Erklärung des Anti-Closure-Direktivzustands (DOKUMENTATION)
    Die Anleitung enthält jetzt eine ehrliche Erklärung, dass trotz der eingebauten Anti-Closure-Verbote das Modell diese Regel weiterhin notorisch bricht, insbesondere im Audiobook-Modus. Anstatt dieses Problem zu verbergen, stellt Version 8 die Sache klar und überträgt die Verantwortung für das "manuelle Schließen" zurück an den Regisseur — daher die Regel des Montageleiters als offizielles Arbeitswerkzeug und die Rückkehr zum normalen Textformat.

    Funktionen unverändert aus Version 7

    Showrunner-Prompts — Anti-Closure-Direktive (Regie — alle Modi)
    Alle drei Regiemodi behalten die eingebauten Showrunner-Direktiven bei. Brainstorming fungiert als Drehbuchautor einer mehrstaffeligen Serie. Der Modus des Rohskripts und der Audiobook-Modus haben das Verbot, den Text mit Zusammenfassungen, Moral und narrativen Klammern zu beenden — außer wenn der Benutzer ausdrücklich nach einem Finale oder Epilog fragt.

    Verwaltung von Akten und Szenen in Echtzeit (Regie — Skriptmodus)
    Der Modus des Rohskripts verfügt über ein Panel mit den Schaltflächen "Akt X einfügen" und "Szene X einfügen". Die Zähler aktualisieren sich automatisch. Das Laden einer vorhandenen Datei setzt beide Zähler auf die richtigen Nummern.

    Bereinigung von Regieanweisungen in Klammern (Polyglott — Regisseur-Modus)
    Das Skript entfernt ganze Textabschnitte, die in runde Klammern gesetzt sind (z.B. "(flüsternd)", "(mit eingeflochtenen Atemzügen)"). ElevenLabs liest nur Dialoge und Erzählungen.

    Unendlicher Speicher und automatisches Zusammenfassen (Regie — Geschichtenspeicher)
    Wenn der Speicherindikator in den roten Alarmzustand wechselt, generiert das Brainstorming automatisch eine Zusammenfassung der Handlung und speichert sie im Feld für Langzeitspeicher. Ein Klick auf "Zusammenfassung speichern (dauerhaft)" erstellt die Datei _zusammenfassung.txt. Nach dem Löschen des Speichers und dem Laden der Zusammenfassung kann die Geschichte ohne Längenbeschränkungen fortgesetzt werden.

    Audiobook-Architekt
    Das Tool unterstützt die Schlüsselwörter Akt, Kapitel, Prolog, Epilog und Vorspann als Überschriften der ersten Ebene. Szenen werden in Fettschrift umgewandelt. Das Skript bereinigt automatisch HTML-Tags und Markdown-Markierungen vor der Verarbeitung.

    Intelligente Kapitelverwaltung (Audiobook-Modus)
    Ein dediziertes Panel mit Schaltflächen zum Einfügen von Prolog, Epilogen und Kapitelschnitten direkt aus der Benutzeroberfläche. Der Kapitelzähler aktualisiert sich automatisch. Das Laden einer vorhandenen Datei setzt den Zähler auf die richtige Nummer ohne manuelles Zählen.

    Kapitelbenennung (Postproduktion — Audiobook-Modus)
    Das Modul iteriert über die Kapitel der gespeicherten Datei und gibt ihnen einen kurzen, literarischen Titel mithilfe eines schnellen KI-Modells, das nur die Anfänge jedes Kapitels analysiert.

    Entfernte Funktionen (unverändert seit Version 7)

    Schnittkarte (Skriptmodus) — ersetzt durch das Panel zur Verwaltung von Akten und Szenen in Echtzeit.
    Skriptadaption zum Audiobook (Skriptmodus) — aus finanziellen Gründen entfernt. Der Arbeitsablauf erzeugte drei separate Kosten: Skripterstellung, potenzielles Zusammenfassen bei Speicherüberlauf und schließlich erneute Generierung des Ganzen als Audiobook-Prosa. Wir empfehlen, direkt im Modus des traditionellen Audiobooks von Anfang an zu schreiben.

    Funktionen aus Version 10.0 (unverändert in Versionen 11.0 und 12.0)

    - Automatischer Generator für die Konfigurationsdatei golden_key.env direkt in die Hauptoberfläche der Anwendung integriert. Der Benutzer muss die Datei nicht mehr manuell erstellen oder sich um die .txt-Fallen-Erweiterung kümmern — ein Klick auf die Schaltfläche auf dem Startbildschirm genügt, und das System erstellt eine saubere, fertige Datei an der richtigen Stelle.
    - Vollständige Entfernung des veralteten Skripts napraw_api.bat, das nicht mehr benötigt wird. Das Problem, das dieses Skript löste (falsche Dateierweiterung, die von Notepad vergeben wurde), ist jetzt vollständig durch den eingebauten Generator eliminiert.
    - Mehrbuchigkeit des Buches der Welt — jedes Projekt hat jetzt seine eigene Lore-Datei (NEU). Früher gab es eine gemeinsame Datei moje_lore.md, die bei jedem Start der Anwendung geladen wurde — unabhängig davon, an welchem Projekt du arbeitest. Seit Version 10 ist das Buch der Welt eng mit dem Namen der Projektdatei verbunden: Wenn deine Geschichte skripty/emilia_heist_audiobook.txt ist, dann ist ihr Buch skripty/emilia_heist_audiobook.md. Die Schaltfläche "Buch dauerhaft speichern" ist ausgegraut, bis du einen Dateinamen eingibst — die Reihenfolge ist hier absichtlich und wird durch die Benutzeroberfläche erzwungen. Ein Klick auf "Geschichte laden" lädt automatisch die entsprechende .md-Datei von der Festplatte, sofern sie existiert. Die Änderung hat auch einen praktischen organisatorischen Aspekt: Du kannst jetzt mehrere Projekte gleichzeitig führen, und jedes wird seine eigenen, isolierten Weltregeln und Charakterlisten haben — ohne das Risiko, dass Emilia aus dem Tresorraub plötzlich in einer Weltraumoper landet.

    Verfügbare Akzente:
    - Englisch (Samantha/Mark in Vocalizer, Zira/Hazel in OneCore)
    - Finnisch (Satu/Mikko in Vocalizer, Heidi in OneCore)
    - Italienisch (Alice/Luca in Vocalizer, Elsa in OneCore)
    - Polnisch (Ewa in Vocalizer, Paulina in OneCore)
    - Französisch (Thomas/Amelie in Vocalizer, Julie in OneCore)
    - Spanisch (Jorge/Monica in Vocalizer, Helena in OneCore)

    Chiffre: Textumkehrer
    Der Textumkehrer erweitert bestimmte Abkürzungen, bevor er den Satz umkehrt. Ohne diese Erweiterung würden punktierte Abkürzungen in phonetischen Unsinn umgekehrt werden (Deutsch Beispiel: ".b.z").

    Erweiterte Abkürzungen:
    - "z.B." → "zum Beispiel"
    - "d.h." → "das heißt"
    - "usw." → "und so weiter"
    - "bzw." → "beziehungsweise"
    - "ggf." → "gegebenenfalls"

    Chiffre: Typoglycämie
    Laut einer Utnersuchung an der Cmabrigde Uinervtisy ist es eagl, in wlehcer Riehnfolge die Bstuchaben in eneim Wrot sind, das Ezinge, was wcihtig ist, ist, dass der erste und der leztte Bstuchabe am rcihtigen Paltz sind.
  changelog_11: |
    Neue Funktionen und Änderungen in Version 11.0

    - Neue Akzente im Polyglot (NEUHEIT — vier neue europäische Sprachen). Dem Regisseur-Modus-Menü wurden vier neue Optionen zur phonetischen "Verfälschung" von Text hinzugefügt: Englisch (Samantha / Mark / Zira / Hazel), Französisch (Thomas / Amelie / Julie), Spanisch (Jorge / Monica / Helena), Polnisch (Ewa in Vocalizer, Paulina in OneCore). Jeder neue Akzent injiziert automatisch den entsprechenden ISO-Code (en, fr, es, pl) in die generierte .html- oder .docx-Datei — NVDA wird sofort die richtige Stimme für den verarbeiteten Text verwenden.

    - Cross-platform: Unterstützung für macOS und Linux (ÄNDERUNG der Dokumentation). Der Abschnitt "Erster Start" wurde gründlich überarbeitet. Jetzt unterscheidet er drei Pfade: Windows-Endbenutzer laden das fertige ZIP-Paket von der Registerkarte Releases herunter und führen run.bat aus; Windows-Entwickler konfigurieren die Umgebung über setup_dev.bat; macOS- und Linux-Benutzer konfigurieren die Umgebung über ./setup_dev.sh und führen ./run.sh aus. (Hinweis: In den Versionen 11.x–13.0 hießen dieselben Skripte anders — `Uruchom_Rezysera.bat`, `skonfiguruj_dev.bat`, `skonfiguruj_dev.sh`, `uruchom_rezysera.sh` — sie wurden in 13.1 in englische Äquivalente umbenannt, da ausländische Entwickler, die das Repo klonen, meldeten, dass polnische Dateinamen das Eingeben von Befehlen im Terminal erschweren.)

    - Ordner runtime/ — Erklärung des Status (DOKUMENTATION). Der Abschnitt "Erster Start" enthält jetzt eine explizite Erklärung, dass der Ordner runtime/ (Python-Umgebung für ZIP-Pakete) ausschließlich in fertigen Paketen für Windows von der Registerkarte Releases verteilt wird. Im Git-Repository existiert dieser Ordner nicht und sollte es auch nicht.

    - Aktualisierung der Synthesizer-Namen im Polyglot-Menü (ÄNDERUNG). Die Namen der Stimmen im Selectbox-Menü für bestehende Sprachen wurden aktualisiert: Italienisch hat jetzt auch Luca (Vocalizer), Finnisch hat jetzt auch Mikko (Vocalizer). Isländisch behielt den Namen ohne diakritische Zeichen (Gudrun statt Gudrun mit eth-Zeichen) für bessere Kompatibilität.

    Unveränderte Funktionen aus Version 10

    - Automatischer Generator für die Datei golden_key.env in die Benutzeroberfläche integriert.
    - Mehrbuchsystem des Buchs der Welt (jedes Projekt hat seine eigene .md-Datei mit Weltregeln).
    - Ausfallsicherer Mechanismus zur Wiederaufnahme der Übersetzung (Speicherung in .jsonl).
    - Tag-Reparatur im Regisseur-Modus (Injektion des ISO-Codes).
  changelog_12: |
    Neue Funktionen und Änderungen in Version 12.0 — Release Candidate

    - Kompletter Umbau der Benutzeroberfläche (ARCHITEKTONISCHE ÄNDERUNG). Die Anwendung ist nicht mehr ein webbasiertes Tool, das im Browser läuft. Die gesamte Benutzeroberfläche wurde von Grund auf als native Desktop-Anwendung auf Basis des wxPython-Frameworks neu geschrieben. Es gibt keinen lokalen Server mehr, keinen Browser, kein Terminalfenster, das im Hintergrund läuft — es gibt nur ein normales Programmfenster. Der Einstiegspunkt ist main.py.

    - Navigationsleiste mit Tastenkombinationen (NEUHEIT). Die Werkzeuge werden über drei Schaltflächen in der Leiste (Regisseur, Polyglot, Konverter) oder über das Menü Werkzeuge umgeschaltet. Verfügbare Tastenkombinationen: Strg+0 (Startseite mit Systemprüfung), Strg+1 (Regisseur), Strg+2 (Polyglot), Strg+3 (Konverter). Das aktive Werkzeug wird visuell durch eine fettgedruckte Schaltfläche hervorgehoben.

    - Vollständige Optimierung für Bildschirmlesegeräte von Grund auf (NVDA, VoiceOver). Jedes Widget hat einen klaren deutschen Zugänglichkeitsnamen. Der Fokus landet nach dem Wechsel des Werkzeugs automatisch auf der Modulbeschreibung — NVDA beginnt sofort, die neue Ansicht zu lesen. wx.MessageBox-Dialoge werden nativ vom Bildschirmlesegerät ohne Tricks angekündigt. Die Tabulatorreihenfolge ist im gesamten Interface logisch und konsistent. Die historischen Einschränkungen von Streamlit und dem React-Framework entfallen.

    - Keine Firewall-Konfiguration (ÄNDERUNG). Die Eliminierung des lokalen WWW-Servers bedeutet, dass die Windows-Firewall beim ersten Start kein Fenster mehr anzeigt, das um Erlaubnis für den Netzwerkzugang bittet. Die Anwendung startet einfach.

    - Native Dateiauswahldialoge (NEUHEIT). Die Module Polyglot und Konverter haben jetzt eine "Durchsuchen..."-Schaltfläche, die einen systemeigenen Dateiauswahldialog öffnet, anstatt den Pfad manuell einzugeben.

    - Schutz des Kreativmodus (NEUHEIT). Im Regisseur kann der Arbeitsmodus nicht mehr versehentlich geändert werden (z.B. von Hörbuch zu Skript), wenn der Speicher belegt ist — die Benutzeroberfläche blockiert das Umschalten auf den zweiten Aufnahmemodus, bis der Verlauf oder die Zusammenfassung gelöscht wird. Der Brainstorming-Modus ist immer verfügbar.

    - Schaltfläche für den harten Reset im Regisseur (NEUHEIT). Die neue Schaltfläche "Projekt schließen (Harter Reset)" ermöglicht es, das gesamte Projekt mit einem Klick zu löschen: Verlauf, Zusammenfassung, Weltbuch und alle Zähler — ohne jedes Feld einzeln zurücksetzen zu müssen.

    - Automatisches Laden des Kreativmodus (NEUHEIT). Beim Laden eines Projekts stellt die Anwendung automatisch den zuletzt verwendeten Arbeitsmodus (Skript oder Hörbuch) aus der von der Anwendung verwalteten Metadatendatei wieder her. Dadurch wird beim erneuten Öffnen des Projekts der RadioBox automatisch eingestellt — Sie müssen sich nicht merken, in welchem Modus Sie gearbeitet haben.

    Funktionen unverändert aus Version 11.0

    - Phonetische Akzente im Polyglot (Englisch, Französisch, Polnisch, Spanisch, Italienisch, Finnisch, Isländisch).
    - Automatischer Generator der Datei golden_key.env im Startbildschirm integriert.
    - Mehrbuchsystem des Weltbuchs (jedes Projekt hat eine eigene .md-Datei).
    - Ausfallsicherer Mechanismus zur Wiederaufnahme der Übersetzung (Speicherung in .jsonl).
    - Tag-Reparatur im Regisseur-Modus (ISO-Code-Injektion).
    - Alle KI-Funktionen: Brainstorming, Skript, Hörbuch, Plot-Akku, Unendlicher Speicher, Titelvergabe.
  changelog_13: |
    Neue Funktionen und Änderungen in Version 13.0 — Release Candidate

    - Refactoring auf YAML — Akzente, Chiffren und Modi des Regisseurs in Textdateien (ARCHITEKTONISCHE ÄNDERUNG, die größte seit der Migration zu wxPython). Bis Version 12.0 waren alle phonetischen Regeln (Akzente) und kreativen Modi des Regisseurs (Sturm, Skript, Hörbuch, Titel-Nachbearbeitung) im Python-Code als Konstanten, Funktionen und feste Prompt-Strings „eingebettet", und eine ganze Kategorie von Chiffren/Textspielen existierte einfach nicht — sie werden zusammen mit dem Refactoring 13.0 eingeführt. In Version 13.0 liegt all dies in .yaml-Dateien im neuen Ordner `dictionaries/` — der Motor (`core_poliglota.py`, `core_rezyser.py`, `przepisy_rezysera.py`) lädt sie dynamisch beim Start. Praktischer Effekt: Das Hinzufügen eines neuen Akzents, einer neuen chiffrenbasierten Umwandlung oder das Ändern des System-Prompts für einen der Modi des Regisseurs erfordert keine Python-Kenntnisse — ein einfacher Texteditor genügt. Eine kurze Beschreibung für Endbenutzer befindet sich in `docs/dictionaries.pl.txt` (im Lieferumfang der Releases enthalten); die vollständige technische Dokumentation des Formats — in `dictionaries/README.md` (nur im Git-Repository, da die Release-Pakete .md-Dateien herausfiltern).

    - Regelmanager — viertes Werkzeug in der Leiste (NEU, Ctrl+4). Visueller Explorer des Ordners `dictionaries/` mit einer Baumansicht der YAML-Dateien (native wx.TreeCtrl, volle NVDA-Unterstützung) und einem Aktionssatz: „In Texteditor öffnen", „Neue Regeldatei…" (Assistent mit Auswahl des Typs: Akzent, Chiffre, Modus, neue Sprache), „Ausgewählte Datei duplizieren", „Datei löschen", „Baum aktualisieren". Für Fälle, die über einfache Umwandlungen hinausgehen (neue Basissprache, algorithmische Chiffre), generiert der Assistent ein kopierfertiges Prompt für den AI-Chatbot — vollständige Erklärung im neuen SCHRITT 7b.

    - Architekten-Prompt direkt im Regisseur-Panel (A11y-ÄNDERUNG). Bisher lebte der Prompt für den externen Chatbot zur Erstellung des Weltbuchs nur in dieser Anleitung — der Benutzer musste ihn aus einer Textdatei kopieren (was bei Bildschirmlesegeräten problematisch sein kann, insbesondere bei polnischen Zeichen und Anführungszeichen). In Version 13.0 hat das Regisseur-Panel einen neuen Button „📖 Architekten-Prompt für AI…" (direkt unter „Buch dauerhaft speichern"), der ein natives Dialogfenster mit dem vollständigen Prompt-Text im READONLY-Feld sowie einem separaten Button „In Zwischenablage kopieren" öffnet. Das A11y-Muster ist identisch mit dem des Ergebnisdialogs des Assistenten im Regelmanager — NVDA liest sofort den gesamten Inhalt des Fensters ohne zusätzliche Konfiguration. Vollständige Beschreibung im aktualisierten SCHRITT 7.

    - Russischer Akzent im Polyglot (NEU — achte europäische Sprache im Menü des Regisseur-Modus). Zur Dropdown-Liste „Regisseur-Modus / Akzente" wird die Option „Russisch (z.B. Milena / Irina / Yuri / Pavel)" hinzugefügt. Im Gegensatz zu den anderen Akzenten, die nur den polnischen Text auf lateinischer Ebene „verfälschen" (z.B. „sz" → „sh", „w" → „v"), führt der russische Akzent eine vollständige Transliteration des polnischen Textes ins Kyrillische durch — so können russischsprachige TTS-Stimmen (Vocalizer Milena, OneCore Irina / Pavel / Yuri, eSpeak „ru") die Wörter „aussprechen". Die Zuordnung wurde um jodierte Vokale („ja" → „я", „je" → „е", „jo" → „ё", „ju" → „ю"), polnische Weichungen si/ci/ni/zi + Vokal (z.B. „ciocia" → „цёця") sowie spezielle russische Digraphen: „ść" / „szcz" → „щ", „sz" → „ш", „cz" → „ч", „rz" → „ж", „ch" → „х" erweitert.

      Phonetische Anmerkung: Der Akzent ist keine akademische russische Transliteration (ISO 9, GOST, BGN/PCGN). Ziel ist es, den polnischen Text klanglich dem Russischen anzunähern — für die Zwecke der Sprachsynthese, nicht für die ernsthafte Transliteration von Eigennamen. Für letztere Arbeit verwenden Sie bitte spezielle sprachwissenschaftliche Werkzeuge.

      Sprachcode für die Ergebnisdatei: „ru" (ISO 639-1). NVDA mit aktivierter Option „Sprache automatisch wechseln, wenn unterstützt" schaltet sofort auf die russische Stimme um.

    - Anmerkung zu „ź": Im Russischen gibt es kein genaues Äquivalent zum polnischen „ź", daher normalisieren wir dieses Zeichen zu „ж" — ähnlich wie „ż". Einige nordrussische Dialekte und das Belarussische sprechen „ź" näher an „зь" aus, aber aus Sicht des Sprachsynthesizers ist der Unterschied vernachlässigbar. Sollte ein Linguist „зь" bevorzugen, kann er diese eine Regel im `dictionaries/pl/akcenty/rosyjski.yaml` selbstständig ändern — der Motor lädt die YAMLs dynamisch, daher ist keine Neukompilierung der Anwendung erforderlich.

    - Erweiterte Navigationsleiste und Werkzeugmenü (ÄNDERUNG). Die Leiste hat jetzt einen vierten Button — Regelmanager — und das Menü „Werkzeuge" unterstützt den neuen Shortcut Ctrl+4. Die bisherigen Shortcuts (Ctrl+0 Startseite, Ctrl+1 Regisseur, Ctrl+2 Polyglot, Ctrl+3 Konverter) bleiben unverändert.

    - Button „Akzente des Regisseurs aus YAML aktualisieren" auf der Startseite (NEU). Nach dem Hinzufügen eines neuen Akzents durch den Regelmanager (oder der manuellen Bearbeitung der YAML-Datei) lädt ein Klick auf diesen Button die Akzent-Wrapper im Polyglot- und Regisseur-Motor neu, sodass der neue Akzent im Menü und in der automatischen Akzenterkennung basierend auf den Charakter-Tags im Weltbuch sichtbar ist. Polyglot erkennt YAMLs automatisch (ohne Aktualisierung), aber der Regisseur benötigt eine Regeneration der Wrapper — in der Regel muss die Anwendung nach der Aktualisierung neu gestartet werden.

    Funktionen unverändert aus Version 12.0

    - Native Desktop-GUI basierend auf wxPython (ohne Browser, ohne lokalen Server).
    - Navigationsleiste mit Tastenkombinationen (jetzt Ctrl+0/1/2/3/4 — Ctrl+4 für den Regelmanager hinzugefügt).
    - Vollständige Optimierung für Bildschirmlesegeräte (NVDA, VoiceOver) — polnische Zugänglichkeitsnamen, korrekte Tabulatorreihenfolge.
    - Schutz des kreativen Modus vor versehentlicher Änderung während der Arbeit.
    - Harte Projektzurücksetzung mit einem Klick im Regisseur.
    - Automatisches Laden des kreativen Modus aus der Projekt-Metadatendatei.
    - Alle Akzente aus früheren Versionen (Englisch, Französisch, Deutsch, Spanisch, Italienisch, Finnisch, Isländisch) sowie Tag-Reparatur.
    - Volle AI-Funktionen: Brainstorming, Skript, Hörbuch, Plot-Akkumulator, Unendliches Gedächtnis, Titelvergabe.
