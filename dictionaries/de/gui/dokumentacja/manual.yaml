id: manual
tresc:
  naglowek: |
    # Reżyser Audio GPT — Komplettanleitung (Version {app.wersja})

    Willkommen im Hybriden Aufnahmestudio! Dieses Toolset ermöglicht das automatische Schreiben, Planen, Formatieren und Übersetzen von Hörspiel- und Hörbuchskripten. Es wurde für die Zusammenarbeit mit professionellen Sprachsynthesizern und lokalen Screenreader-Engines (NVDA) optimiert.

    Das Set besteht aus dem Hauptstudio (Regie), einem Übersetzungs- und Akzentwerkzeug (Polyglott), einem Werkzeug zum Erstellen der Dateistruktur (Hörbucharchitekt), einem Regelmanager (ab Version 13.0 — ohne Python kannst du einen neuen Akzent, ein Chiffre oder einen kreativen Modus hinzufügen, siehe SCHRITT 7b unten) und — ab Version 15.0 — einem Geschichtenmodul (interaktive, zweite Person AI-generierte Fiktion, gelesen von TTS oder Screenreader, beschrieben in einem separaten Handbuch tales.de.html). Alle fünf Werkzeuge sind in einem Programmfenster verfügbar, das über Schaltflächen in der Leiste oder Tastenkombinationen Ctrl+1..Ctrl+5 umgeschaltet werden kann.
  krok_1_pierwsze_uruchomienie: |
    ## SCHRITT 1: Erste Ausführung (Cross-Platform)

    Laden Sie den neuesten Installer von der Registerkarte Releases auf GitHub herunter (Datei `Rezyser_Audio_v<numer>_Installer.exe`) und starten Sie ihn durch Doppelklick. Der Installer schlägt einen Standardinstallationspfad vor — den Ordner Programme im lokalen Verzeichnis Ihres Kontos — und erfordert keine Administratorrechte. Sie können einen eigenen Pfad mit der Schaltfläche „Durchsuchen" wählen; merken Sie sich diesen Pfad (er wird bei Updates nützlich sein — siehe „Automatische Updates" unten). Nach der Installation starten Sie das Programm über das Desktop-Icon oder das Startmenü. Nach kurzer Zeit erscheint das Hauptfenster des Programms — {app.nazwa}. Ab Version 17.0 ist die Anwendung als nativer ausführbarer Datei im Fenstermodus eingefroren, sodass kein Terminalfenster mehr blinkt und sie schneller startet als zuvor. Kein Browser, kein Hintergrundserver. Wenn Sie die Arbeit beendet haben, schließen Sie einfach das Programmfenster.

    Die gesamte Anwendung, einschließlich der Python-Engine, der Projekte und des API-Schlüssels, befindet sich in einem einzigen Ordner unter dem Installationspfad — der gesamte Ordner kann auf einen USB-Stick, in die Cloud oder auf einen anderen Computer verschoben werden (detaillierte Anleitung im Abschnitt „Projekte und API-Schlüssel übertragen" unten).

    **Wichtig:** Der Ordner runtime/ im Installationsordner ist das PyInstaller-Bundle (ab Version 17.0) — er enthält einen isolierten Python-Interpreter und Bibliotheken, die ohne separate Systeminstallation einsatzbereit sind; er dient auch als Container für versteckte Projektdaten. Wenn Sie das Repository klonen (Entwicklungspfad), gibt es diesen Ordner nicht und sollte es auch nicht geben — Sie verwenden dann die virtuelle Umgebung venv, die im Abschnitt für Entwickler unten beschrieben ist.

    ### Für Entwickler (Windows — Git-Repository)

    1. Klonen Sie das Repository auf Ihre Festplatte.
    2. Führen Sie die Datei setup_dev.bat aus. Das Skript erstellt automatisch eine virtuelle Python-Umgebung (venv) und installiert alle erforderlichen Abhängigkeiten aus der Datei requirements.txt.
    3. Starten Sie die Anwendung mit dem Befehl python main.py oder über die Datei run_dev.bat — das Skript erkennt automatisch den venv-Ordner und startet das Programm.

    ### Für Entwickler und normale Benutzer (macOS / Linux)

    1. Klonen Sie das Repository auf Ihre Festplatte.
    2. Öffnen Sie das Terminal im Projektordner und geben Sie den Skripten Ausführungsrechte: chmod +x *.sh
    3. Führen Sie das Konfigurationsskript aus: ./setup_dev.sh — das Skript erstellt die venv-Umgebung und installiert die Abhängigkeiten.
    4. Starten Sie die Anwendung: python main.py oder ./run.sh

    Was Sie beim Start sehen: Beim Start des Programms öffnet sich ein Fenster mit dem Startbildschirm. Dort finden Sie eine kurze Beschreibung der verfügbaren Werkzeuge sowie den Abschnitt "{home.heading_system_check}". Wenn der API-Schlüssel noch nicht konfiguriert ist, sehen Sie eine rote Nachricht, die darauf hinweist, dass KI-basierte Module (Regie, Übersetzer) nicht funktionieren — kostenlose lokale Funktionen (Akzente, Architekt) sind jedoch sofort aktiv. Die Konfiguration des Schlüssels wird im nächsten Schritt beschrieben.

    ### Automatische Updates

    Die Anwendung überprüft beim Start, ob auf GitHub eine neuere Version verfügbar ist — die Überprüfung erfolgt im Hintergrund und blockiert die Benutzeroberfläche nicht.

    Wenn Sie das Programm über die fertige Installationsdatei (.exe) installiert haben: Bei Erkennung einer neueren Version erscheint ein Fenster mit der Frage, ob Sie diese herunterladen möchten. Nach Bestätigung wird ein Fortschrittsbalken angezeigt, und wenn der Download abgeschlossen ist, schließt sich die Anwendung automatisch und der neue Installer startet von selbst. WICHTIG: Stellen Sie im Fenster des neuen Installers sicher, dass der vorgeschlagene Installationspfad DERSELBE ist wie bei der ersten Installation (normalerweise im Feld „Zielordner" sichtbar). Wenn Sie den Standardvorschlag akzeptieren und ursprünglich einen anderen Pfad mit der Schaltfläche „Durchsuchen" gewählt haben, erhalten Sie eine ZWEITE leere Installation ohne Ihre Projekte und den API-Schlüssel — die erste bleibt an der alten Stelle, aber die Verknüpfung auf dem Desktop und im Startmenü wird auf die neue umgestellt. Wenn Sie denselben Pfad wie ursprünglich akzeptieren, überschreibt der Installer die Dateien der Anwendungs-Engine und das gesamte Regelpaket (Ordner dictionaries/) — Ihre Projekte (Ordner skrypty/, opowiesci/) und der API-Schlüssel (golden_key.env) bleiben unberührt. WICHTIG: Wenn Sie mit dem Regelmanager Dateien bearbeitet haben, die im Paket vorhanden sind (z.B. Akzentänderungen in `dictionaries/pl/akcenty/wloski.yaml`), werden diese Änderungen BEI EINEM UPDATE ÜBERSCHRIEBEN — machen Sie vor der Bestätigung des Updates ein Backup des Ordners `dictionaries/` gemäß der Anleitung im Abschnitt „Projekte und API-Schlüssel übertragen" unten (es reicht, den Ordner `dictionaries/` auf einen USB-Stick zu kopieren) und laden Sie ihn nach dem Update zurück, indem Sie die neueren Dateien überschreiben. Ganz neue Regeln, die Sie von Grund auf erstellt haben und die nicht im Paket enthalten sind (z.B. eine eigene zusätzliche Basissprache oder ein eigener Code), bleiben automatisch unberührt — der Installer entfernt keine Dateien außerhalb des Pakets. Ab Version 15.2.8 zeigt der Dialog, der das Update vorschlägt, diese Warnung direkt im Text an und enthält eine Schaltfläche „Ordner dictionaries öffnen", die mit einem Klick den Explorer an der richtigen Stelle öffnet — drücken Sie ihn vor der Bestätigung des Updates, um bequem ein Backup zu machen, und kehren Sie dann zum Dialog zurück und klicken Sie auf „Herunterladen und installieren".

    Wenn Sie Ihren Installationspfad nicht mehr wissen, gibt es zwei schnelle Möglichkeiten, ihn wiederherzustellen. Windows 11: Wählen Sie im Kontextmenü der Desktop-Verknüpfung „Dateispeicherort öffnen" (wenn die Option im neuen vereinfachten Kontextmenü nicht sichtbar ist, wählen Sie zuerst „Weitere Optionen anzeigen" oder drücken Sie Shift+F10 zweimal, um sofort das vollständige Menü zu öffnen), gehen Sie eine Ebene höher mit der Rücktaste, markieren Sie den Ordner mit der Anwendung und drücken Sie Ctrl+Shift+C (oder wählen Sie „Als Pfad kopieren" im Kontextmenü) — der vollständige Pfad wird in Anführungszeichen in die Zwischenablage kopiert (beim Einfügen in den Installer denken Sie daran, die Anführungszeichen zu entfernen). Ältere Windows-Versionen (7/8/10): Klicken Sie mit der rechten Maustaste auf die Verknüpfung und wählen Sie „Eigenschaften"; auf der Registerkarte „Verknüpfung" im Feld „Ziel" sehen Sie den vollständigen Pfad zur ausführbaren Datei (`.exe` in Version 15.2.5+ oder `run.bat` in älteren Versionen) — kopieren Sie ihn und entfernen Sie den Dateinamen am Ende, es bleibt nur der Installationsordnerpfad.

    Hinweis beim Update von älteren Versionen (v15.2.4 oder älter, als die Anwendung über `run.bat` aus dem Portable-ZIP-Paket gestartet wurde): Die vorhandene Desktop-Verknüpfung kann auf `run.bat` in der alten Location verweisen, die nach dem Update auf v15.2.5+ nicht mehr existiert — Versionen 15.2.5+ verwenden eine eigenständige `.exe`-Datei, die vom Installer erstellt wurde. Wenn die Verknüpfung nach dem Update nicht mehr funktioniert, löschen Sie sie manuell und lassen Sie den Installer während der Neuinstallation eine neue erstellen.

    Wenn Sie das Git-Repository verwenden (Entwickler und macOS/Linux-Benutzer): Anstelle eines Vorschlags zum Herunterladen sehen Sie eine Information über die neue Version mit einem direkten Link zur Release-Seite auf GitHub. Laden Sie von dort das „Source code"-Archiv herunter oder aktualisieren Sie das Repository mit dem Befehl git pull.

    ### Projekte und API-Schlüssel übertragen (Migration)

    Wenn Sie Ihre Projekte, den API-Schlüssel und lokale Einstellungen auf einen anderen Computer übertragen möchten (oder alles nach einer Neuinstallation von Windows wiederherstellen möchten), müssen Sie keine einzelnen Dateien manuell kopieren — der gesamte Anwendungsordner ist autark.

    1. Stellen Sie sicher, dass die Anwendung VOLLSTÄNDIG geschlossen ist. Wenn Sie das Programmsymbol im Systemtray sehen (neben der Uhr, rechts in der Taskleiste), klicken Sie mit der rechten Maustaste darauf und wählen Sie „Schließen". Geöffnete Dateien blockieren das Kopieren.
    2. Finden Sie die Verknüpfung {app.nazwa} auf dem Desktop. Klicken Sie mit der rechten Maustaste darauf (oder mit der Anwendungstaste oder Shift+F10 bei NVDA-Navigation) und wählen Sie die Option „Dateispeicherort öffnen". ACHTUNG bei Windows 11: Im neuen, vereinfachten Kontextmenü kann diese Option versteckt sein — wählen Sie zuerst „Weitere Optionen anzeigen" (oder drücken Sie Shift+F10 zweimal, um sofort das vollständige Menü mit der Option zu öffnen).
    3. Es öffnet sich ein Windows-Explorer-Fenster im Installationsordner des Programms. Drücken Sie die Rücktaste (der einfachste Weg, funktioniert immer) oder klicken Sie auf den Pfeil „Nach oben" in der Symbolleiste, um eine Ebene höher zu gehen — dort sehen Sie den vollständigen Ordner mit der Anwendung. Hinweis: Die Tastenkombination Alt+Pfeil nach oben funktioniert nur, wenn der Fokus auf der Dateiliste liegt — wenn der Explorer mit dem Fokus auf der Adressleiste geöffnet wurde (typisch), macht Alt+Pfeil nach oben nichts, verwenden Sie dann die Rücktaste.
    4. Kopieren Sie diesen gesamten Ordner auf einen USB-Stick, ein Cloud-Laufwerk (OneDrive, Google Drive, Dropbox) oder eine externe Festplatte. Der Ordner enthält alles, was zur Wiederherstellung des Arbeitszustands benötigt wird:
       - Ihre Projekte (Ordner skrypty/ — .txt-Dateien der Erzählungen, .md der Weltbücher, _streszczenie.txt; Ordner opowiesci/ — interaktive Spiele).
       - API-Schlüssel (Datei golden_key.env im Hauptordner der Anwendung).
       - Eigene phonetische Regeln, Akzente, Codes, wenn Sie etwas im Regelmanager bearbeitet haben (Ordner `dictionaries/<kod>/`, z.B. dictionaries/pl/akcenty/wloski.yaml).
       - Anwendungseinstellungen und Auswahl der kreativen Modi (Ordner runtime/skrypty/, .mode-Dateien).
       - Isolierte Python-Umgebung (Ordner runtime/), sodass Sie nichts auf dem neuen Computer installieren müssen.
    5. Auf dem neuen Computer: Laden Sie den neuesten Installer von der Registerkarte Releases auf GitHub herunter und installieren Sie die Anwendung standardmäßig. Starten Sie das Programm einmal, um die leere Struktur der Konfigurationsdateien zu erstellen. Schließen Sie die Anwendung. Kopieren Sie dann den zuvor gespeicherten Ordner an den Installationsort und überschreiben Sie die Dateien — oder wählen Sie selektiv nur die für Sie interessanten Ordner (skrypty/, opowiesci/, golden_key.env) und fügen Sie sie an den entsprechenden Stellen der neuen Installation ein.

    **Tipp für NVDA-Benutzer:** Das Kontextmenü „Dateispeicherort öffnen", das mit der Anwendungstaste aufgerufen wird, ist vollständig zugänglich — NVDA liest jeden Eintrag auf Deutsch. Nachdem der Explorer im Zielordner geöffnet wurde, verwenden Sie die Rücktaste, um eine Ebene höher zu gehen (funktioniert immer, unabhängig davon, ob der Fokus auf der Dateiliste oder der Adressleiste liegt), und dann Ctrl+A, um alles auszuwählen, und Ctrl+C, um zu kopieren.

    **Hinweis:** Die Option „Dateispeicherort öffnen" ist der native Name für die deutsche Version von Windows. Im englischen System lautet sie „Open file location", in anderen Sprachversionen — analog in der lokalen Sprache des Betriebssystems.
  krok_2_klucz_api: |
    ## SCHRITT 2: API-Versorgung (empfohlener Anthropic / Claude-Schlüssel)

    Der empfohlene und standardmäßige KI-Anbieter ist Anthropic (Claude) — alle Prompts der Anwendung sind auf ihn abgestimmt, sodass er die höchste Erzählqualität und die beste Einhaltung der Weltregeln bietet. Bei dieser (empfohlenen) Variante genügt EIN API-Schlüssel in der Datei golden_key.env:

    •  Anthropic-Schlüssel (Claude) — versorgt die GESAMTE KI-Engine: die Narration des Regisseurs (Hörbuch, Lesebühne, Brainstorming), den Geschichten-Modus, den Polyglott (Übersetzer) sowie die Vergabe von Kapiteltiteln und die Erkennung der Inhaltssprache. Beginnt mit sk-ant-.

    Falls Sie von einer älteren Version aktualisieren: Der frühere OpenAI-Schlüssel wird für die Standardvariante nicht mehr benötigt — Sie können seine Zeile in golden_key.env belassen oder löschen, die Anwendung ignoriert sie (es sei denn, Sie konfigurieren bewusst einen anderen Anbieter — siehe SCHRITT 2B weiter unten).

    So erhalten Sie einen Anthropic-Schlüssel:
    1. Erstellen Sie ein Konto auf console.anthropic.com und laden Sie Guthaben auf (Reiter Billing / Plans).
    2. Generieren Sie einen Schlüssel im Bereich API Keys (beginnt mit sk-ant-). Kopieren Sie ihn sofort — er wird mitunter nur einmal angezeigt.

    So tragen Sie den Schlüssel in das Programm ein:
    3. Klicken Sie auf dem Startbildschirm des Programms auf die Schaltfläche „{home.btn_generate}". Das System erstellt automatisch eine saubere Konfigurationsdatei am richtigen Speicherort und öffnet den Editor mit einer bearbeitungsbereiten Vorlage.
    4. In der geöffneten Datei sehen Sie die Zeile: ANTHROPIC_API_KEY=PASTE_YOUR_KEY_HERE. Löschen Sie den Platzhaltertext und fügen Sie Ihren Schlüssel direkt nach dem Gleichheitszeichen ein (ohne Leerzeichen und ohne Anführungszeichen). Speichern Sie die Datei und starten Sie die Anwendung neu.

    **Hinweis:** Nach dem Neustart prüft die Anwendung die Datei und zeigt im Bereich „{home.heading_system_check}" den Status des Schlüssels an. Er muss grün sein, damit alle KI-Module einsatzbereit sind. Fehlt der Schlüssel oder ist er fehlerhaft, weist das Programm klar darauf hin und ermöglicht es, den Texteditor zu öffnen, um den Fehler schnell zu beheben.
  krok_3_glowne_studio: |
    ## SCHRITT 3: Das Haupt-Regie-Studio

    Dies ist Ihre Kommandozentrale zum Entwickeln von Geschichten und Schreiben von Drehbüchern. Wechseln Sie dorthin, indem Sie auf die Schaltfläche "{main.btn.rezyser}" in der Schaltflächenleiste klicken oder im Menü Werkzeuge → {main.menu.rezyser} wählen (Tastenkürzel: Ctrl+1).



    ### Wichtig: Dateiformat der Projektdateien — Rückkehr zu .txt

    In Version 7 wurden Projektdateien im Markdown-Format (.md) gespeichert, z. B. skrypty/znieczulica.md. Dies war ein bewusster Versuch — das .md-Format sollte als psychologische Hürde für nicht-technische Personen dienen und sie davon abhalten, die Datei im Texteditor zu öffnen und manuell zu bearbeiten (und dabei versehentlich die Strukturüberschriften zu beschädigen).

    Der Versuch hat sich nicht bewährt. Die KI bricht häufig eines der grundlegenden Verbote auf eigenmächtige Weise (mehr dazu gleich). Aus diesem Grund wurde in Version 8 zu einfachen .txt-Dateien zurückgekehrt — intuitiver und für jeden lesbarer. Ein Projekt mit dem Namen „znieczulica" wird nun beispielsweise als skrypty/znieczulica.txt gespeichert, seine Zusammenfassung als skrypty/znieczulica_streszczenie.txt. So kann jeder laufend Regiekorrekturen oder Textkürzungen leichter vornehmen.


    ### ⚠️ Kritische Regel des Cutters (lesen Sie dies, bevor Sie beginnen!)

    Alle Ihre generierten Skripte und Bücher werden in einfachen Textdateien (.txt) gespeichert, die Sie problemlos im Texteditor öffnen können.

    Als Regisseur haben Sie das VOLLE RECHT (ja, sogar die Pflicht), diese Datei zu bearbeiten! Wenn die künstliche Intelligenz zu weit geht und z. B. das Problem der Figuren am Ende des generierten Abschnitts selbst löst, öffnen Sie die Datei, löschen Sie die letzten Zeilen und lassen Sie den Text an der spannendsten Stelle abbrechen, klicken Sie dann auf "{rezyser.btn_przeladuj_label}", um den Modellspeicher mit der korrigierten Datei zu synchronisieren, und auf "{rezyser.btn_wyslij_label}", um fortzufahren.

    #### 🔴 Jedoch — was Sie nicht anfassen dürfen

    Ändern, löschen oder verändern Sie niemals Zeilen, die die Struktur enthalten (z. B. Akt 1, Szene 2, Kapitel 1, Prolog). Wenn Sie diese Überschriften beschädigen:
    1. Zerfällt Ihre Geschichte in Screenreadern (NVDA).
    2. Wird der Hörbuch-Architekt und damit auch das ElevenLabs Studio Ihr Buch nicht korrekt in Leseabschnitte aufteilen können.
    3. Wird der interne Konverter der Anwendung kein korrektes Inhaltsverzeichnis in der Word-Datei und keine korrekte Zeitachse in ElevenLabs erzeugen.

    Bearbeiten Sie Dialoge, kürzen Sie die Handlung, aber lassen Sie die Struktur in Ruhe!


    ### Wie verwendet man das Regie-Studio?

    - Weltenbuch (linke Seitenleiste): Hier tragen Sie die Regeln des Universums ein. Jedes Projekt hat nun ein eigenes Weltenbuch, das mit dem Dateinamen verknüpft ist — wenn Ihre Geschichtsdatei z. B. emilia_heist_audiobook.txt heißt, wird das Weltenbuch als skrypty/emilia_heist_audiobook.md gespeichert. Daher ist die Reihenfolge wichtig: Geben Sie zuerst den Dateinamen des Projekts im Feld „Projektdateiname" ein, und erst dann können Sie das Weltenbuch speichern. Die Schaltfläche "{rezyser.btn_zapisz_ksiege_label}" bleibt ausgegraut, solange kein Name angegeben wurde. Beim Laden eines vorhandenen Projekts über die Schaltfläche "{rezyser.btn_wczytaj_label}" wird automatisch auch die zugehörige .md-Datei geladen — Sie müssen nichts manuell tun. Hinweis: Ohne ausgefülltes Weltenbuch blockiert die Anwendung das Senden von Anfragen an die KI — dies ist eine bewusste Schutzmaßnahme, die Sie davor bewahrt, Text ohne jegliche Regeln zu generieren.
    - Langzeitgedächtnis (linke Seitenleiste): Das zweite Feld in der Seitenleiste. Hier speichert die KI automatisch eine Handlungszusammenfassung, wenn der Speicher voll zu werden droht. Sie können hier auch eigene Notizen manuell eintragen — das Modell behandelt sie als „was ich bereits weiß", bevor es die aktuelle Szene liest. HISTORISCHE LÜCKE (behoben in v15.5): Früher, wenn Sie hier eine sehr kurze Notiz eingetragen und auf „Zusammenfassung speichern" geklickt hatten, bevor in der Erzähldatei etwas Wesentliches stand, lud die Anwendung beim nächsten Öffnen VORRANGIG die Zusammenfassung und ÜBERSPRANG die vollständige Geschichte — das Modell erhielt dann nur das Weltenbuch und eine einzeilige Notiz, ohne den Kontext des Tons und der letzten Szenen. Ab v15.5 ist das Laden intelligent: Wenn die gesamte Geschichte in das Kontextfenster passt, wird sie vollständig geladen (und eine überflüssige alte Zusammenfassung gelöscht), sodass das Modell keinen Kontext verliert. Nach manueller Bearbeitung der Erzähldatei im Editor verwenden Sie die neue Schaltfläche „{rezyser.btn_przeladuj_label}" (ab v15.5), die mit einem Klick den internen Speicher mit der Festplatte synchronisiert; zum bloßen Öffnen der Datei im Editor dient weiterhin „{rezyser.btn_otworz_narracje_label}".
    - Brainstorming-Modus: Geben Sie eine lose Idee ein, und die KI liefert Ihnen 3 Optionen zur Handlungsentwicklung. Für jede Option generiert sie sofort einen fertigen Block „--- PROMPT-ENTWURF ---". Nachdem Sie eine Option gewählt haben, fügen Sie diesen Prompt in den Skript- oder Hörbuchmodus ein und ergänzen Sie eventuelle Anmerkungen oder Informationen für das Modell. Der Handlungsspeicher ändert sich während des Brainstormings nicht — Sie können experimentieren, ohne Risiko!
    - Rohskript-Modus (ab v16.0 — Lesebühne): Hier fügen Sie den in der Brainstorming-Sitzung generierten „Szkic Promptu" ein. Die KI schreibt einen langen erzählerisch-dialogischen Abschnitt: Erzählung (Szenerie, Zeit, Handlung) in den Tags [Narrator: ...] sowie Figurenrepliken in den Tags [Name: Emotion]. Keine Soundeffekte — der Kontext wird vom Erzähler durch Worte getragen. Der Text wird automatisch an Ihre Datei (z. B. nowa_scena.txt) im Ordner skrypty/ angehängt. Ein solches fertiges Skript können Sie anschließend in ein mehrstimmiges Hörbuch umwandeln (Brücke zu ElevenLabs Studio — separates Kapitel weiter unten).
    - Traditioneller Hörbuchmodus: Ein Modus für Schriftsteller. Die KI generiert reine literarische Prosa — keine Tags, keine Phonetik, klassische Dialoge in die Erzählung eingebettet. Der Text wird genauso wie im Skriptmodus an die Datei angehängt.
    - Automatische Figurenerstellung: Das Skript ist so programmiert, dass es automatisch neue [Speaker]-Tags erstellt, wenn die Handlung eine neue Figur erfordert. Tipp: Wenn die KI eine tolle Figur erschafft, kopieren Sie deren Tag und fügen Sie ihn in das Weltenbuch ein, damit das Modell sie dauerhaft im Gedächtnis behält!

    Projektverwaltung — drei Aktionsschaltflächen:
    - {rezyser.btn_wczytaj_label}: Lädt ein vorhandenes Projekt in den Speicher. Verfügbar, wenn der aktuelle Speicher leer ist. Ab Version 15.2.3 werden zwei Pfade unterstützt: Wenn das Projektnamenfeld leer ist, öffnet sich ein Auswahldialog mit einer Liste aller im Ordner skrypty/ gefundenen Projekte (Zusammenfassungsdateien werden ausgelassen) — NVDA liest die Liste auf natürliche Weise vor, der Nutzer muss den Namen nicht auswendig kennen und abtippen. Wenn das Namensfeld ausgefüllt ist, versucht die Anwendung sofort, das Projekt mit diesem Namen zu laden (Expertenpfad: Enter im Namensfeld oder Klick nach dem Eintippen aus dem Gedächtnis).
    - {rezyser.btn_hard_reset_label}: Löscht das Projekt vollständig. Entfernt Geschichte, Zusammenfassung, Weltenbuch und setzt alle Zähler zurück. Verwenden Sie dies beim Wechsel des Projekts oder bei einer neuen Geschichte.
    - {rezyser.btn_otworz_narracje_label} (ab v15.2.3): Notfallbearbeitung der Erzähldatei im systemeigenen Texteditor. Erfordert einen eingetragenen Projektnamen. Die Anwendung öffnet `skrypty/<nazwa>.txt` im Texteditor (Windows), TextEdit (macOS) oder dem Standard-GUI-Editor (Linux). Typische Szenarien: (a) Die KI schließt eine Szene nicht ab und Sie möchten das Ende manuell ergänzen; (b) Sie haben ein Projekt mit Zusammenfassung geladen und möchten die letzten Szenen in das Langzeitgedächtnis kopieren, damit das Modell den vollständigen Tonkontext hat (oben beschriebene Architekturlücke); (c) Sie möchten eine Textkürzung mitten in einem Kapitel vornehmen, die die Anwendungs-Engine nativ nicht unterstützt.

    - {rezyser.btn_przeladuj_label} (ab v15.5, umgebaut in v17.6): Lädt das GESAMTE Projekt nach manueller Bearbeitung der Erzähldatei neu von der Festplatte — dies ist ein echter Reload, nicht nur eine Aktualisierung des aktuellen Speichers. Berechnet die Zähler für Kapitel/Akte/Szenen neu, lädt das Weltenbuch, den Modus und die Brainstorming-Optionen und synchronisiert den Arbeitsspeicher. Wenn die gesamte Geschichte in das Kontextfenster passt, wird sie vollständig geladen (und eine überflüssige alte Zusammenfassung gelöscht, damit die Engine auf dem vollständigen Text arbeitet). Wenn die Geschichte lang ist und eine gespeicherte Zusammenfassung hat, bleibt diese unberührt, und Sie werden gefragt, ab welcher Überschrift der KI-Arbeitsspeicher starten soll: Im Hörbuchmodus wählen Sie ein Kapitel, im Skriptmodus zuerst einen Akt und dann eine Szene dieses Akts (oder den gesamten Akt) — den Rest repräsentiert die Zusammenfassung. Abbrechen der Auswahl = Notfallschnitt zum letzten Textfragment (deshalb lohnt es sich, die Überschriftenstruktur beizubehalten). Bevor die Felder mit der Version von der Festplatte überschrieben werden, warnt die Anwendung, wenn Sie darin ungespeicherten Inhalt haben. Typisches Szenario: Die KI hat eine Szene falsch abgeschlossen (Anti-Closure verletzt), Sie kürzen das fehlerhafte Ende im Editor und klicken auf Neu laden — kein mühsames Korrigieren an zwei Stellen mehr.

    Historische Anmerkung — warum die Modi jetzt vor versehentlicher Änderung geschützt sind:
    In früheren Versionen der Anwendung wurde die Konsistenz des kreativen Modus innerhalb eines Projekts nicht überwacht. Das Ergebnis war eine gewisse subtile kreative Möglichkeit, die sich so beschreiben lässt: Sie beginnen eine Geschichte im Skriptmodus, fügen „Akt 1" und „Szene 1" ein (die Anwendung ist begeistert von Ihrer Konsequenz), generieren einige Bildschirme voller Spannung mit Tags wie [SFX: Türknall] und [Speaker 1: Marek - resigniert] ... und dann — weil die Inspiration gerade zuschlägt — klicken Sie auf „Kapitel 1 einfügen". Die Anwendung fügt ohne mit der Wimper zu zucken die Überschrift „Kapitel 1" in die Datei ein, direkt nach „Szene 3". Sie haben nun in der Datei eine Mischung aus einem Radiohörspiel der 1950er Jahre und einem Gesellschaftsroman. ElevenLabs betrachtet diese Struktur, sieht eine Kapitelüberschrift mitten in einem Akt und entscheidet, dass dies wohl ein Fehler in der Matrix ist. Das Inhaltsverzeichnis sieht aus wie das Werk eines Avantgarde-Künstlers. Der Hörbuch-Architekt geht seinerseits davon aus, dass Sie ein erwachsener Mensch sind, und verarbeitet das einfach kommentarlos — aber auch ohne jegliche Ergebnisgarantie. Ab Version 12.0 versuchte die Benutzeroberfläche, die Änderung des Aufzeichnungsmodus zu blockieren — zumindest in der Theorie. Die Praxis erwies sich als kreativer: Das Brainstorming (immer als Planungsmodus aktiv) war eine Hintertür, durch die man mit den Pfeiltasten auf und ab zwischen Skript und Hörbuch wechseln konnte (Hörbuch → Brainstorming → Skript und analog in die andere Richtung). Der erste Klick auf „Akt 1 einfügen" oder „Kapitel 1 einfügen" im neu gewählten Modus überschrieb reibungslos die .mode-Datei und mischte Akte mit Kapiteln in einer einzigen Erzähldatei. Erst ab Version 15.2.3 gibt es echten Schutz: Sobald die Modusentscheidung festgeschrieben ist (erste Struktur oder erster erfolgreicher Produktionsversand), ist die zweite Aufzeichnungsposition im Modusauswahlfeld tatsächlich gesperrt. Das Brainstorming bleibt immer als Notfallmechanismus aktiv — es erzeugt eine Zusammenfassung bei Überfüllung des Kontextfensters und Handlungsoptionen — aber man kann durch es nicht mehr seitwärts in einen anderen Aufzeichnungsmodus springen.


    ### Showrunner-Prompts — KI als Seriendrehbuchautor (ab Version 7, beibehalten)

    Dies ist die größte Änderung, die in Version 7 eingeführt wurde und unverändert erhalten geblieben ist. Sie ist in der Benutzeroberfläche nicht sichtbar, verändert aber die Qualität der generierten Handlung grundlegend.

    Ein Showrunner ist in der Fernsehbranche die Person, die für das Gesamtbild einer Serie verantwortlich ist — er sorgt dafür, dass die Handlung nie einer einfachen Lösung zustrebt, sondern sich ständig verdichtet, Konflikte aufschichtet und den Zuschauer über viele Staffeln hinweg in Spannung hält. In Version 7 wurde diese Philosophie direkt in die System-Anweisungen der KI eingebaut.

    ### Die Anti-Closure-Direktive — und was die Anthropic-Engine (Claude) verändert hat

    Die Showrunner-Philosophie wird durch die in jeden Modus eingebaute Anti-Closure-Direktive durchgesetzt: ein Verbot, Szenen mit Zusammenfassungen, Moralen und falschen Happy Ends abzuschließen. In der alten Ära (GPT-Modell) war es genau das Gegenteil von heute — die Engine brach dieses Verbot notorisch und „schloss" die Geschichte bei jeder Gelegenheit selbst ab: Sie flocht handlungszusammenfassende Sätze ein, erzeugte falsche Happy Ends oder schloss Handlungsstränge mitten in einem Kapitel ab, als wäre jedes Fragment das letzte. Ab Version 18 arbeitet die gesamte KI-Engine standardmäßig mit Anthropic (Claude) — und ab Version 18.4 können Sie optional einen eigenen Anbieter angeben (SCHRITT 2B) — und Claude hält sich deutlich strenger an die Anti-Closure-Direktive.

    Dadurch ist ein anderer, rein technischer Nebeneffekt entstanden: Da das Modell eine Szene konsequent nicht abschließt, kann seine Ausgabe das Längenlimit einer einzelnen Antwort erreichen und mitten in einem Satz abreißen (manchmal sogar mitten in einem Wort). Die Anwendung behandelt das selbstständig — wenn sie erkennt, dass ein Fragment am Limit abgebrochen wurde, schließt sie mit einer kurzen zusätzlichen Anfrage den letzten Satz so ab, dass er in der Sprache Ihrer Geschichte natürlich klingt, und speichert den Text erst dann. Wenn das aus irgendeinem Grund nicht gelingt, sehen Sie eine dezente Warnung, und der Text wird trotzdem in seinem aktuellen Zustand gespeichert — das Speichern wird niemals blockiert, ein abgebrochenes Ende können Sie jederzeit manuell nachbessern.

    Die oben beschriebene Cutter-Regel gilt unverändert: Wenn das Modell eine Szene trotz allem zu glatt abschließt, ist es Ihr Recht (ja, Ihre Pflicht) als Regisseur, die .txt-Datei zu öffnen, diese letzten Sätze zu löschen, den Text an einem angespannten Moment abreißen zu lassen und auf „{rezyser.btn_przeladuj_label}" zu klicken, um den Speicher mit der korrigierten Datei zu synchronisieren.

    Jeder Modus verfügt über eine eingebaute Anti-Closure-Direktive:

    - Brainstorming: Die KI agiert wie ein Drehbuchautor einer mehrstaffeligen Serie. Jede der 3 vorgeschlagenen Optionen MUSS Hindernisse aufschichten, neue Dilemmata, offene Handlungsstränge und Cliffhanger einführen. Absolutes Verbot, Optionen vorzuschlagen, bei denen sich die Figuren dauerhaft versöhnen, das Haupthindernis ohne schwerwiegende Konsequenzen überwinden oder die Geschichte auf ein hastiges Ende zusteuert. Verbot, billige, magische Schauplätze zu erfinden, die die Weltarchitektur brechen.
    - Rohskript-Modus: Absolutes Verbot, den Text mit Zusammenfassungen, Moralen oder Klammern zu beenden. Die KI soll die Handlung an einem natürlichen Spannungsmoment abreißen lassen (Cliffhanger) und Schlussfolgerungen vermeiden, damit das nächste Fragment die Erzählung nahtlos übernehmen kann.
    - Traditioneller Hörbuchmodus: Absolutes Verbot, den Text mit pathetischen Zusammenfassungen, dem Abschließen von Handlungssträngen oder dem Andeuten eines Geschichtsendes zu beenden (z. B. „Sie war bereit für neue Herausforderungen", „Sie verstand, dass es Zeit war weiterzugehen"). Der Text soll mitten in einer laufenden Handlung, Spannung oder einem offenen Gedanken abreißen.

    Ausnahme von der Regel: Wenn Sie ausdrücklich um ein Ende, ein Finale oder einen Epilog bitten, erzeugt die KI einen befriedigenden Abschluss der Geschichte — das Verbot gilt nicht, wenn Sie selbst darum bitten.


    ### Verwaltung von Akten und Szenen (Skriptmodus, ab Version 7, beibehalten)

    Der Rohskript-Modus verfügt über ein dediziertes Panel „{rezyser.struktura_heading}" mit Schaltflächen zum Aufbau der Hörspielstruktur in Echtzeit.

    - Akt X einfügen: Fügt eine Aktüberschrift ein (z. B. „Akt 2") UND schreibt automatisch darunter „Szene 1" — denn jeder neue Akt beginnt mit der ersten Szene. Der Aktzähler springt zur nächsten Nummer, und der Szenenzähler wird auf 2 zurückgesetzt (bereit für die nächste Szene in diesem Akt).
    - Szene X einfügen: Fügt nur eine Szenenüberschrift ein (z. B. „Szene 3") innerhalb des aktuellen Akts. Der Szenenzähler erhöht sich automatisch.

    Intelligentes Laden der Datei: Wenn Sie eine vorhandene Skriptdatei laden, scannt die Anwendung sie automatisch und setzt die Akt- und Szenenzähler auf die richtigen Nummern. Der Szenenzähler wird immer innerhalb des letzten Akts in der Datei berechnet.

    Prolog und Epilog: Die Schaltflächen „{rezyser.btn_prolog_label}" und „{rezyser.btn_epilog_label}" sind für beide Modi gemeinsam und im selben Panel verfügbar.

    Der Hörbuch-Architekt wandelt Akte automatisch in die wichtigsten Navigationspunkte (Heading 1) für ElevenLabs und NVDA um — Szenen werden zu fett formatiertem Text, der im Dokument sichtbar ist, aber nicht im Inhaltsverzeichnis erscheint.


    ### Intelligente Kapitelstruktur (Hörbuchmodus, ab Version 5, beibehalten)

    Das LLM generiert pro Anfrage maximal etwa 5000 Zeichen — das reicht nicht für ein vollständiges Kapitel. Daher arbeiten Sie iterativ: Sie generieren mit der Schaltfläche „Senden an KI" aufeinanderfolgende Fragmente, bis Sie das jeweilige Kapitel für abgeschlossen halten. Dann klicken Sie auf „Kapitelschnitt einfügen" — die Anwendung schreibt die Überschrift in die Datei und den Speicher, und der Kapitelzähler springt automatisch zur nächsten Nummer.

    Schaltflächen im Panel:

    - Schnitt einfügen (Kapitel X): Fügt eine Überschrift (z. B. „Kapitel 3") in die Datei und den Speicher ein. Der Kapitelzähler wird automatisch aktualisiert.
    - Prolog einfügen: Funktioniert nur am Anfang, wenn der Speicher leer ist. Schutz vor versehentlichem Einfügen des Prologs mitten in der Geschichte.
    - Epilog einfügen: Schließt die Geschichte ab. Nachdem der Epilog mit Inhalt eingefügt wurde, blockiert die Anwendung die Generierung neuer Fragmente — das ist beabsichtigt, denn nach dem Ende der Geschichte gibt es nichts mehr hinzuzufügen.

    Intelligentes Laden der Datei: Wenn Sie eine vorhandene Datei laden, scannt die Anwendung sie automatisch und setzt den Kapitelzähler auf die richtige Nummer. Hat die Datei einen Prolog und drei Kapitel, zeigt der Zähler „Kapitel 4" — ohne manuelles Zählen.


    ### Handlungsspeicher — wie das KI-Gedächtnis funktioniert

    In den Modellspeicher fließt ausschließlich der reine Erzähltext — das, was die KI tatsächlich geschrieben hat. Anweisungen, Optionen und Pläne verschwinden nach der Verwendung und belasten den Kontext nicht. Das Ergebnis: Das Modell behält länger seinen Fokus, erinnert sich besser an Charakterakzente und „flüchtet" seltener von den Regeln des Weltenbuchs.

    Der Indikator „Modellspeicher" auf dem Bildschirm zeigt an, wie stark das Kontextfenster des Modells gefüllt ist. Ab Version 15.1 werden dabei NICHT mehr nur die Zeichen der Geschichte gezählt — die Anwendung zählt echte TOKEN (nach derselben Methode, die das Modell selbst verwendet) und summiert die GESAMTE an die KI gesendete Last: die aktuelle Geschichte, den Langzeitspeicher (Zusammenfassung) UND das Weltenbuch. Daher steigt der Indikator auch dann, wenn Sie das Weltenbuch ausbauen oder eine lange Zusammenfassung haben — nicht nur durch die Erzählung selbst. Der Wert wird als prozentualer Füllstand des Fensters angezeigt:
    - Grün (bis ca. 70 %): Das Modell ist voll konzentriert, Sie haben einen sicheren Puffer.
    - Gelb (ca. 70–90 %): Sie nähern sich der Grenze. Die KI kann beginnen, Aussagen zu kürzen und Regeln zu ignorieren; im Planungsmodus (Brainstorming) beginnt die Engine, eine Zusammenfassung zu erzwingen. Beginnen Sie, den Handlungsstrang langsam abzuschließen.
    - Rot (über ca. 90 %): Kritische Überlastung!

    Diagnose des Zusammenfassungsschwellenwerts (wenn die KI früher halluziniert als der Schwellenwert annimmt): Die Schwellenwerte (Warnung ~70 %, Alarm ~90 %) sind empirisch geschätzt. Wenn Sie eine wiederkehrende Tendenz bemerken, dass das Modell von den Regeln „flüchtet" oder zu halluzinieren beginnt, BEVOR der Indikator in den gelben/roten Bereich eintritt — also früher als der Schwellenwert annimmt — öffnen Sie ein Issue im Repository der Anwendung und beschreiben Sie, bei welcher ungefähren Auslastung (Prozentsatz) es tatsächlich zu Problemen kommt, am besten mit einem Beispiel. Wenn sich diese Tendenz breiter bestätigt (bei anderen Nutzern, in verschiedenen Projekten), wird der Schwellenwert für die automatische Zusammenfassung im nächsten Patch gesenkt. Das ist ein bewusst iterativer Mechanismus — es ist besser, ihn anhand realer Daten zu kalibrieren, als im Voraus zu raten.

    ### Unendliches Gedächtnis (ab Version 6, beibehalten)

    Wenn der rote Alarm aufleuchtet, müssen Sie die Zusammenfassung nicht mehr manuell kopieren. Geben Sie im Brainstorming einen Befehl ein, der das Wort „Zusammenfassung" oder „Resümee" enthält — die KI generiert eine prägnante Wissenskapsel über die gesamte bisherige Handlung. Klicken Sie dann auf die Schaltfläche „Zusammenfassung speichern (dauerhaft)" — die Anwendung erstellt automatisch eine Datei _streszczenie.txt im Ordner skrypty/ und schützt sie vor versehentlichem Überschreiben. Nach dem Speichern leeren Sie den Speicher und können die Erstellung in der aktuellen Datei fortsetzen. Die Zusammenfassung laden Sie vor der nächsten Sitzung in das Feld des Langzeitspeichers — und Sie können die Geschichte unbegrenzt fortsetzen, ohne jegliche Längenbeschränkung.

    Wann zusammenfassen (aktualisiert in v15.5): Sie müssen keinen starren Zeichenschwellenwert mehr „vor dem Beenden der Arbeit" im Auge behalten. Am besten fassen Sie nach dem natürlichen Abschluss eines größeren Strukturteils zusammen — nach dem Ende einer Szene, eines Akts oder eines Kapitels. Der Grund: Wenn Sie später das Ende in der Erzähldatei manuell korrigieren und auf „{rezyser.btn_przeladuj_label}" klicken, fragt die Anwendung, ab welcher Überschrift das frische Fragment wiederhergestellt werden soll — und die Zusammenfassung des früheren Teils bleibt unberührt (kein lästiges Korrigieren an zwei Stellen mehr). Deshalb lohnt es sich umso mehr, die Struktur beizubehalten: Fügen Sie regelmäßig Kapitel-/Akt-/Szenenüberschriften aus dem Strukturpanel ein (von langen Formen ganz ohne Akte/Kapitel wird abgeraten, z. B. ein „modernistisches Drama" als ein einziger Textblock). AUSNAHME: Wenn Sie eine sehr lange Geschichte VÖLLIG ohne Überschriften führen, bleibt das Generieren und Speichern einer Zusammenfassung vor einer Pause notwendig — ohne Marker kann die Anwendung nur das letzte zeichenbasierte Fragment wiederherstellen, und die Engine könnte ohne Kontext „in Panik geraten".

    Automatisches Zusammenfassen: Wenn der Speicher in den Alarmzustand eintritt, schaltet das Brainstorming automatisch in den Notfallmodus — anstatt sofort Optionen zu generieren, erstellt es zunächst eine detaillierte Zusammenfassung der gesamten bisherigen Handlung und speichert sie in den Tags `<STRESZCZENIE>`. Die Anwendung erkennt diese Tags und überträgt die Zusammenfassung automatisch in das Feld des Langzeitspeichers. Null manuelle Arbeit!

    Intelligentes Laden und Neuladen von der Festplatte (aktualisiert in v17.6): Sowohl beim Laden eines Projekts als auch nach dem Klicken auf „{rezyser.btn_przeladuj_label}" (nach manueller Bearbeitung der Erzähldatei im Editor) gleicht die Anwendung in einem einzigen Vorgang den Speicher mit der Festplatte ab — sie berechnet die Strukturzähler neu und lädt das Weltenbuch sowie den Modus. Wenn die GESAMTE Geschichte in das Kontextfenster passt, wird sie vollständig geladen, und eine überflüssige alte Zusammenfassung wird gelöscht, damit die Engine auf dem vollständigen Text arbeitet (das schließt eine frühere Lücke, bei der das Modell nur die Zusammenfassung ohne den Kontext der letzten Szenen erhielt). Wenn die Geschichte LANG ist und eine gespeicherte Zusammenfassungsdatei hat, bleibt die Zusammenfassung unberührt, und Sie werden gefragt, ab welcher Strukturüberschrift (Kapitel/Akt/Szene) der KI-Arbeitsspeicher starten soll; den Rest der Handlung repräsentiert die Zusammenfassung. Dadurch verschwenden Sie keine Token für das erneute Laden der gesamten Geschichte, und gleichzeitig entsteht die nächste Zusammenfassung nicht auf Basis veralteter Daten.
