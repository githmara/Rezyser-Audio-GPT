# UPDATER – auto-aktualizacja (core_updater.py + wątek tła w main.py)
# -----------------------------------------------------------------------------
  typ:
    akcent:
      etykieta: "Phonetischer Akzent (cross-language, z.B. Schwedisch, Finnisch)"
      opis: |-
        Datei in <jezyk>/akcenty/<id>.yaml mit `kategoria: akcent`. Der Text des Basispakets (jezyk_bazowy) wird in die Aussprache des Zielsynthesizers transliteriert (iso != jezyk_bazowy). Der Manager erstellt eine Vorlage + Prompt für den KI-Agenten, der die Liste `zamiany:` entwirft.
    akcent_oczyszczenie:
      etykieta: "Reinigungsakzent (Preprozessor, ohne Phonetik)"
      opis: |-
        Datei in <jezyk>/akcenty/<id>.yaml mit `kategoria: oczyszczenie`. Reinigt den Text für TTS (entfernt Kauderwelsch, normalisiert Zahlen) OHNE die Phonetik zu ändern. iso == jezyk_bazowy. Der Manager erstellt eine Vorlage (fertiges Muster) + Prompt zur Übersetzung des Labels/Beschreibung ins Native.
    akcent_naprawiacz:
      etykieta: "Tag-Reparatur (injiziert ISO in HTML/DOCX)"
      opis: |-
        Datei in <jezyk>/akcenty/<id>.yaml mit `kategoria: naprawiacz`. Ändert den Inhalt NICHT — injiziert den ISO-Sprachcode in die Ergebnisdateien (<html lang>, <w:lang>). iso leer (Code wird vom Benutzer im GUI angegeben). Der Manager erstellt eine Vorlage + Prompt zur Übersetzung des Labels/Beschreibung ins Native.
    szyfr_zamiany:
      etykieta: 'Neuer Chiffretyp „reine Ersetzungen"'
      opis: |-
        Datei in <jezyk>/szyfry/. Der Manager erstellt eine Vorlage + Prompt für die KI, die Labels/Kommentare in die native Sprache des Pakets übersetzt und eine Liste von Muster→Ersetzung-Paaren generiert.
    tryb_rezysera:
      etykieta: "Neuer Regisseurmodus (kreativer Modus)"
      opis: |-
        Datei in <jezyk>/rezyser/tryb_*.yaml. Vorlage basierend auf dem Hörbuch-Modus + Prompt für die KI, die prompt_systemowy, przypomnienie_uzytkownika und slowa_wyzwalajace in die native Sprache des Basispakets übersetzt.
    tryb_opowiesci:
      etykieta: "Neuer Erzählmodus (ERFORDERT ENTWICKLER)"
      opis: |-
        Interaktiver Spielmodus (Erzählungen). Im Gegensatz zu Regisseur-Modi ist er NICHT datengetrieben: Die YAML-Datei allein ist toter Code — die Engine erkennt Modi anhand von Konstanten und Dictionaries in Python. Der Manager erstellt keine Datei; er gibt nur einen Prompt für die KI/den Entwickler mit einer vollständigen Liste von Anknüpfungspunkten im Code (int-Konstante, zwei Dictionaries, RadioBox, Modell pro Modus).
    postprodukcja:
      etykieta: "Neue Postproduktion (Iteration über Kapitel)"
      opis: |-
        Datei in <jezyk>/rezyser/postprod_*.yaml. Vorlage mit Feldern für Prompt, Regex und Iterationsparameter + Prompt für die KI, die einen nativen prompt_systemowy und regex_podzial_rozdzialow generiert.
    jezyk_bazowy:
      etykieta: "Neue Basissprache (z.B. en, de, fr)"
      opis: |-
