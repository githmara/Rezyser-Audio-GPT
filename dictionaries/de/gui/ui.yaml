  postprod_ucieta_tresc: Das Ergebnis der Postproduktion hat das Längenlimit erreicht und könnte am Ende abgeschnitten sein. Das Ergebnis ist verfügbar — prüfen Sie das Ende, und falls es abgeschnitten ist, führen Sie das Tool erneut aus oder erhöhen Sie den Wert `max_tokens_wyjscia` in der YAML-Datei des Tools.
  postprod_ostrzezenie_tytul: Das Ergebnis wurde möglicherweise abgeschnitten
