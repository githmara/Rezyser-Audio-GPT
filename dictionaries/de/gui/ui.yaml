  btn_otworz_narracje_tooltip: 'Öffnet die Erzählungsdatei des Spiels (opowiesci/<nazwa>.txt) im systemeigenen Texteditor. Verwenden Sie dies im Notfall, wenn die KI die Geschichte im Modus Entscheidungen/Weniger Übel nicht abschließt und Sie das Ende manuell hinzufügen möchten. ACHTUNG: .txt enthält nur Text für TTS; der Spielzustand (Charaktere, Ort, Inventar) lebt in .game.json und wird NICHT aktualisiert — die nächste Runde LLM kann mit der geänderten Erzählung nicht übereinstimmen. Vor dem Öffnen erscheint ein Bestätigungsdialog.'
  otworz_narracje_ostrzezenie_tytul: Bearbeitung der Erzählungsdatei — Risiko der Zustandsabweichung
  otworz_narracje_ostrzezenie_tresc: "Sie werden gleich die Erzählungsdatei (.txt) im systemeigenen Editor öffnen.\n\nACHTUNG: Die .txt-Datei enthält nur den Erzähltext für TTS, während der Spielzustand (Charaktere, Ort, Inventar, offene Handlungsstränge) in einer separaten Datei .game.json lebt. Die Bearbeitung von .txt aktualisiert den Zustand nicht — die nächste Runde LLM erhält die Welt vor Ihrer Bearbeitung, sodass es zu semantischen Abweichungen kommen kann (z.B. Sie haben beschrieben, dass ein Charakter gestorben ist, aber im Spielzustand lebt er noch).\n\nTypischer sicherer Fall: Hinzufügen einer abschließenden Szene, wenn die KI die Geschichte nicht beenden möchte (Alternative zur Option „Spielmodus bearbeiten…\" → Frei).\n\nFortfahren?"
  blad_otwarcia_tytul: Datei konnte nicht geöffnet werden
  blad_otwarcia_tresc: "Der Versuch, die Datei {sciezka_pliku} zu öffnen, ist fehlgeschlagen:\n{tresc_bledu}\n\nÖffnen Sie die Datei manuell über den Datei-Explorer."
  plik_narracji_brak_tytul: Keine Erzählungsdatei vorhanden
  plik_narracji_brak_tresc: Die Erzählungsdatei des Spiels „{nazwa}" existiert nicht auf der Festplatte. Die Erzählungsdatei wird nach der ersten Runde erstellt — senden Sie die erste Aktion, damit die Erzählmaschine die Datei erstellt.
  # v15.5: Vom Datenträger aktualisieren — Synchronisierung des internen
  # Gedächtnisses nach manueller Bearbeitung von opowiesci/<nazwa>.txt.
  btn_odswiez_z_dysku_label: "Vom Datenträger &aktualisieren"
  btn_odswiez_z_dysku_tooltip: "Lädt die Erzählungsdatei (opowiesci/<nazwa>.txt) erneut und synchronisiert das interne Gedächtnis mit Ihren manuellen Änderungen — ohne harten Reset und erneutes Laden des Spiels. Das frische Ende gelangt in den Kontext der Engine; die bestehende Zusammenfassung früherer Runden bleibt unberührt. ACHTUNG: der Spielstand (Figuren, Ort, Inventar) in .game.json wird NICHT aktualisiert — die nächste Runde kann auseinanderlaufen, wenn Sie Weltfakten geändert haben."
  odswiez_z_dysku_tytul: "Erzählung vom Datenträger aktualisiert"
  odswiez_calosc_tresc: "Die Erzählung wurde erneut vom Datenträger geladen, der Kontext der Engine ist mit dem Ende des Textes synchronisiert.\n\nACHTUNG: der Spielstand (Figuren, Ort, Inventar, Handlungsfäden) in .game.json wurde NICHT geändert — wenn die Bearbeitung Weltfakten verändert hat, kann die nächste Runde mit ihnen auseinanderlaufen."
  odswiez_streszczenie_tresc: "Der Kontext der Engine wurde mit dem frischen Ende vom Datenträger aktualisiert. Die Zusammenfassung früherer Runden bleibt unberührt, sodass die nächste Zusammenfassung und Runde nicht auf veralteten Daten entstehen.\n\nACHTUNG: der Spielstand in .game.json wurde NICHT geändert — bei geänderten Weltfakten kann die nächste Runde auseinanderlaufen."
  odswiez_zajete_tytul: "Vorgang läuft"
  odswiez_zajete_tresc: "Es wird gerade eine Runde oder Zusammenfassung generiert. Warten Sie, bis der Vorgang abgeschlossen ist, bevor Sie die Erzählung vom Datenträger aktualisieren."
  btn_edytuj_stan_label: Spielstand &bearbeiten…
  btn_edytuj_stan_tooltip: 'Öffnet die Rohdatei des Spielstands (.game.json) zur direkten Bearbeitung in einem Fenster mit JSON-Validierung. Für Fortgeschrittene: Ermöglicht manuelle Korrekturen an Charakteren, Standort, Ausrüstung, Handlungssträngen und Zählern, wenn die manuelle Bearbeitung der Erzählung nicht mehr mit dem strukturellen Zustand übereinstimmt. WARNUNG: Fehlerhafte Bearbeitung kann die Speicherung beschädigen — Änderungen werden vor dem Speichern als JSON validiert, aber die inhaltliche Korrektheit (Sinnhaftigkeit der Felder) liegt in Ihrer Verantwortung.'
  dlg_edytuj_stan_tytul: Bearbeitung des Spielstands (.game.json)
  dlg_edytuj_stan_lbl: 'Rohzustand des Spiels im JSON-Format. Vorsichtig bearbeiten: Nach dem Speichern wird das Spiel aus dieser Datei neu geladen. Der Inhalt muss ein gültiges JSON-Objekt bleiben — andernfalls wird die Speicherung abgelehnt.'
  dlg_edytuj_stan_name: Bearbeitungsfeld für den Rohzustand des Spiels im JSON-Format
  dlg_edytuj_stan_btn_ok: '&Speichern und neu laden'
  dlg_edytuj_stan_btn_anuluj: '&Abbrechen'
  edytuj_stan_blad_json_tytul: Ungültiges JSON
  edytuj_stan_blad_json_tresc: "Der Inhalt ist kein gültiges JSON und wurde daher nicht gespeichert (das Spiel wäre beschädigt worden). Korrigieren Sie die Syntax und versuchen Sie es erneut.\n\nFehlerdetails:\n{tresc_bledu}"
  edytuj_stan_blad_typ_tresc: Das Hauptelement des Spielstands muss ein JSON-Objekt sein (ein Schlüssel-Wert-Paar in geschweiften Klammern), keine Liste oder ein einfacher Wert. Stellen Sie die Objektstruktur wieder her und versuchen Sie es erneut.
  edytuj_stan_zapisano_tytul: Spielstand gespeichert
  edytuj_stan_zapisano_tresc: Der Spielstand „{nazwa}" wurde gespeichert und von der Festplatte neu geladen. Charaktere, Standort, Ausrüstung, Handlungsstränge und Zähler spiegeln jetzt Ihre Bearbeitung wider.
  err_dlugosc: Die Antwort des Modells wurde abgeschnitten, bevor es sie abschließen konnte (Längenlimit überschritten). Kürzen Sie den Kontext und versuchen Sie es erneut.
  odrzucenie_tytul: Aktion nicht ausführbar
  odrzucenie_tresc: Der Erzählmotor kann diese Aktion nicht ausführen — sie könnte themenfremd, in dieser Welt unmöglich oder nicht mit den Inhaltsrichtlinien vereinbar sein. Die Runde wurde nicht gespeichert. Formuliere die Aktion anders und versuche es erneut.
  btn_zamknij_gre_label: Spiel &schließen
  btn_zamknij_gre_tooltip: Schließt das aktuelle Spiel und kehrt zum Bildschirm für ein neues Spiel zurück (entsperrt die Modusauswahl und Quick Start). Das Spiel ist auf der Festplatte gespeichert – Sie können es später laden. Eine Bestätigung wird angefordert.
  zamknij_gre_pytanie_tytul: Aktuelles Spiel schließen?
  zamknij_gre_pytanie: "Aktuelles Spiel schließen und zum Bildschirm für ein neues Spiel zurückkehren?\n\nDer Spielstand wird nach jeder Runde auf der Festplatte gespeichert, sodass nichts verloren geht – das Spiel kann später über die Schaltfläche „Laden\" erneut geladen werden."
  komenda_odswiez_zablokowana_tytul: Befehl gesperrt
  komenda_odswiez_zablokowana_tresc: Der Befehl „{komenda}" ist standardmäßig gesperrt, da das Aktualisieren der Erzählung von der Festplatte den Spielzustand (Charaktere, Ort, Ausrüstung) nicht neu berechnet und semantische Abweichungen verursachen kann. Um ihn zu entsperren, setzen Sie EDYCJA_STANU_GRY_WIDOCZNA = True in gui_opowiesci.py:72 und erstellen Sie Ihr eigenes Paket.
  komenda_odswiez_zablokowana_hint: (/odswiez, /refresh — gesperrt; setzen Sie EDYCJA_STANU_GRY_WIDOCZNA = True in gui_opowiesci.py:72, um zu entsperren)
  err_struktura: Das KI-Modell hat mehrfach eine ungültige Datenstruktur zurückgegeben, die nicht korrigiert werden konnte. Versuchen Sie es erneut – wenn der Fehler weiterhin auftritt, fügen Sie der Meldung die Datei error_log.txt bei.
  pamiec_status_offline: '⚠️ Keine Internetverbindung: Der genaue Speicherzähler ist nicht verfügbar, die Werte sind Näherungswerte (~{procent}% — {tokeny} Token). Starten Sie die Anwendung nach Wiederherstellung der Verbindung neu.'
bot:
  closure:
    Lumi: "Hallo!\n\nDer Schnee hat sich gelegt und der Fix ist da! Alles, worum du gebeten hast, ist gerade in der neuesten Audio-GPT-Regisseur-Veröffentlichung gelandet.\n\nHol dir das Update hier: {link}\n\nIch schließe das Anliegen, damit es nicht kalt hereinzieht. Bleib frostig!\n— Lumi"
    Vieno: "Sei gegrüßt.\n\nDie Winde des Nordens haben Kunde gebracht, dass dein Anliegen seinen Platz in der neuen Veröffentlichung gefunden hat. Die Vision ist manifest geworden.\n\nDie neueste Veröffentlichung erwartet dich hier: {link}\n\nIch schließe diesen Kreis — die Angelegenheit hat ihr Ende erreicht.\n— Vieno"
    Katla: "Hey!\n\nIm vulkanischen Feuer geschmiedet und noch glühend! Dein Anliegen wurde in der neuesten Audio-GPT-Regisseur-Veröffentlichung gelöst.\n\nGreif zu hier: {link}\n\nIch schließe das Anliegen — vulkanische Grüße!\n— Katla"
  answered:
    Lumi: "Hallo!\n\nVom Zentrum ist eine Nachricht in den Norden gelangt — eine Antwort für dich. Ich gebe sie genau so weiter, wie sie formuliert wurde:\n\n{maintainer_answer}\n\nIch schließe das Anliegen — der Schnee hat sich auf diese Sache gelegt. Bleib frostig!\n— Lumi"
    Vieno: "Sei gegrüßt.\n\nDie Winde des Nordens haben Worte der Antwort vom Zentrum gebracht. Ich überbringe sie unverändert:\n\n{maintainer_answer}\n\nIch schließe diesen Kreis — die Frage hat ihr Ende erreicht.\n— Vieno"
    Katla: "Hey!\n\nEin heißes Wort vom Zentrum ist im Norden eingetroffen — ich gebe es dir direkt weiter:\n\n{maintainer_answer}\n\nIch schließe das Anliegen — vulkanische Grüße!\n— Katla"
  personal_note_intro: 'Eine zusätzliche Nachricht vom Maintainer für dich:'
  patch:
    Lumi:
      subject: 'Tiflotecnia Voices Patch — Winter-Lieferung #{issue_number}'
      body: "Hallo!\n\nIch habe mich durch die Schneewehen gekämpft, um das zu liefern! Dein Patch ist bereit und ich habe das Anliegen geschlossen, damit es nicht kalt hereinzieht.\n{link}\n\nFalls ein Schneesturm die Nachricht versteckt hat, prüfe bitte deinen Spam- oder Junk-Ordner.\n\nBleib frostig,\nLumi"
    Vieno:
      subject: 'Tiflotecnia Voices Patch — eine Vision für Anfrage #{issue_number}'
      body: "Sei gegrüßt.\n\nDie Geister des Nordens haben Kunde von deinem Anliegen gebracht. Das Ritual ist vollendet und der Patch hat sich hier manifestiert:\n{link}\n\nWenn die Vision deinen Posteingang nicht erreicht hat, durchsuche den Nebel im Spam-Ordner.\n\nLausche dem Wind,\nVieno"
    Katla:
      subject: 'Tiflotecnia Voices Patch — heiß aus der Schmiede #{issue_number}'
      body: "Hey!\n\nIm vulkanischen Feuer geschmiedet und noch glühend! Ich schicke dir den Patch und schließe das Anliegen.\n{link}\n\nFalls Rauch deinen Blick auf den Posteingang versperrt hat, prüfe unbedingt den Spam-Ordner.\n\nMit vulkanischen Grüßen,\nKatla"
    footer: 'Du erhältst diese Nachricht, weil deine E-Mail-Adresse in GitHub Issue #{issue_number} angegeben wurde. Falls du diese Anfrage nicht gestellt hast, ignoriere sie bitte.'
    brak_emaila: Im Inhalt wurde keine E-Mail-Adresse gefunden — bitte trage sie nach.
    pauza: Der Tiflotecnia Voices-Patch wird gerade aktualisiert. Ich lasse dieses Ticket offen und melde mich mit einem aktuellen Link, sobald ich fertig bin — du musst nichts weiter tun.
  sami_comment: "Ciao! 🌞 Sami aus dem Süden hat deine Meldung entdeckt und ist mit dem technischen Prompt zum Zentrum geflitzt. Der App-Entwickler kümmert sich gleich darum — und sobald die Korrektur in der neuesten Veröffentlichung landet, meldet sich hier eine meiner nordischen Kolleginnen: Lumi, Vieno oder Katla. A presto!\n— Sami"
