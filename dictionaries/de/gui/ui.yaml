  btn_przeladuj_label: '&Projekt von der Festplatte neu laden'
  btn_przeladuj_tooltip: 'Lädt das gesamte Projekt erneut von der Festplatte, nachdem Sie manuelle Änderungen an der Erzählungsdatei (skrypty/<name>.txt) vorgenommen haben — berechnet die Zähler für Kapitel/Akte/Szenen neu, hebt das Weltbuch, den Modus und die Brainstorming-Optionen an und synchronisiert den Arbeitsspeicher. Eine kurze Geschichte wird vollständig geladen; bei einer langen wird gefragt, ab welcher Überschrift der Arbeitsspeicher der KI starten soll (der Rest wird durch die Zusammenfassung dargestellt). ACHTUNG: überschreibt den Inhalt der Felder mit der Version von der Festplatte — speichern Sie zuerst ungespeicherte Änderungen.'
  przeladuj_ostrzezenie_tytul: Projekt von der Festplatte neu laden?
  przeladuj_ostrzezenie_tresc: "Das Neuladen ersetzt den aktuellen Inhalt (Weltbuch, Langzeitspeicher, Erzählung, Strukturzähler) mit der auf der Festplatte gespeicherten Version. Ungespeicherte Änderungen in den Feldern gehen verloren.\n\nFortfahren?"
  przeladuj_tytul: Projekt von der Festplatte neu geladen
  przeladuj_calosc_tresc: Gesamtes Projekt von der Festplatte neu geladen ({liczba_znakow} Zeichen). Strukturzähler, Weltbuch, Modus und Arbeitsspeicher sind mit der Datei synchronisiert.
  przeladuj_calosc_skasowano_tresc: Gesamtes Projekt von der Festplatte neu geladen ({liczba_znakow} Zeichen) — der gesamte Text passte in das Kontextfenster, daher wurde die überflüssige Zusammenfassung entfernt (die Engine arbeitet jetzt mit der vollständigen Geschichte). Zähler und Weltbuch sind mit der Datei synchronisiert.
  marker_dlg_tytul: Referenzpunkt des Arbeitsspeichers
  marker_dlg_plaski_lbl: Die Geschichte ist zu lang, um vollständig zu passen. Ab welchem Kapitel soll der Arbeitsspeicher der KI starten? (Frühere Ereignisse werden durch die Zusammenfassung dargestellt. Abbrechen = letzter Textabschnitt.)
  marker_dlg_akt_lbl: Die Geschichte ist zu lang, um vollständig zu passen. Ab welchem Akt soll der Arbeitsspeicher der KI starten? (Abbrechen = letzter Textabschnitt.)
  marker_dlg_scena_lbl: Ab welcher Szene dieses Aktes soll der Arbeitsspeicher der KI starten?
  marker_dlg_caly_akt: ← ganzer Akt (ab Aktüberschrift)
  punkt_odniesienia_tytul: Referenzpunkt des Arbeitsspeichers
  punkt_odniesienia_snap_tresc: Der Arbeitsspeicher der KI beginnt mit der Überschrift „{naglowek}" ({liczba_znakow} Zeichen). Frühere Ereignisse werden durch die Langzeit-Zusammenfassung dargestellt (unberührt geblieben).
  punkt_odniesienia_fallback_tresc: 'Kein Referenzpunkt angegeben — der letzte Erzählungsabschnitt ({liczba_znakow} Zeichen) wurde in den Arbeitsspeicher übernommen. Die Zusammenfassung blieb unberührt. Tipp: Fügen Sie Kapitel-/Akt-/Szenenüberschriften ein, um den Beginn des Speichers genau auszuwählen.'
  punkt_odniesienia_za_dluga_tresc: 'Der ausgewählte Abschnitt „{naglowek}" ist so umfangreich, dass er allein nicht in das Arbeitsspeicherfenster passt — ein Notfall-Schnitt wurde auf die letzten {liczba_znakow} Zeichen angewendet. Regisseur, das ist ein wenig verrückt: Erwägen Sie, Akte/Kapitel in kleinere Szenen zu unterteilen — kürzere Abschnitte ermöglichen es der KI, den Kontext konsistent zu halten.'
  kod_jezyka_blad_tytul: Unbekannte Rezept-Sprache
  kod_jezyka_blad_tresc: Der Sprachcode (ISO) für die Antwort „{jezyk_odpowiedzi}” konnte nicht ermittelt werden. Öffnen Sie das Rezept im Regelmanager und setzen Sie das Feld kod_jezyka (z.B. „fi”), damit die Strukturüberschriften und Akzente zur Inhaltssprache passen.
  jezyk_naglowkow_ostrzezenie_tytul: Sprache der Überschriften und Sprache des Rezepts
  jezyk_naglowkow_ostrzezenie_tresc: Das geladene Projekt hat Strukturüberschriften, die wie die Sprache „{wykryty}” aussehen, und das aktive Rezept generiert Inhalte in der Sprache „{kod}”. Neue Überschriften werden nach „{kod}” eingefügt — wenn dies nicht beabsichtigt ist, passen Sie das Feld kod_jezyka im Rezept an oder wählen Sie einen anderen Modus.
  pamiec_status_czysta: 🟢 Speicher ist leer. Maschine bereit für eine neue Geschichte.
  pamiec_status_ok: '🟢 Speichernutzung: {tokeny} / {maks} Tokens. Sicherer Puffer.'
