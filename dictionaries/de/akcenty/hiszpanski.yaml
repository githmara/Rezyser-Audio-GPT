# SPANISCHER AKZENT (Deutsch → spanischer TTS)
# Für Synthesizer: Pablo / Helena / ähnliche spanische TTS-Stimmen.

id: hiszpanski
etykieta: "Spanisch (z.B. Pablo / Helena)"
opis: |
  Passt deutschen Text für einen spanischen Sprachsynthesizer an.
  Spanisches TTS liest lateinische Buchstaben nach spanischen Regeln.

  Wichtigste Anpassungen:
    - „j" → „y" (dt. /j/ — span. „j" wäre /x/, „Jahr" also [xar])
    - „sch" → „sh" (spanisches TTS liest sh als /ʃ/ — besser als sch → /sk/)
    - „tsch" → „ch" (spanisches TTS liest ch als /tʃ/; läuft über den
      Zwischenschritt „jj" — siehe Kommentar in der Tabelle)
    - „ch" → „j" (dt. /x/ = span. „j"; bis v18.20 stand hier „k", und die
      Kaskade verschluckte dabei das /tʃ/: „Tschüss" wurde zu „Kuss")
    - „ei" → „ei" (bleibt — spanisch liest ei gut)
    - „eu" → „eu" (bleibt)
    - „ü" → „u" (span. hat kein /y/ → u)
    - „ö" → „o" (span. hat kein /ø/ → o)
    - „ä" → "e" (span. hat kein /ɛ/ → e)
    - „ß" → „ss"
    - „w" → „v" → am Ende „b" (Kaskade, gewollt: die Regel „v" → „b" greift
      danach, und span. /v/ ≈ /b/ klingt ohnehin gleich)
    - „z" → „s" (span. TTS liest z als /s/ in Lateinamerika)
    - „v" → „b" (span. v und b klingen gleich: /b/)
iso: es
kategoria: akcent
kolejnosc: 80

czysc_tekst_tts: true
normalizuj_liczby: true
usun_polskie_znaki: true
skleja_pojedyncze_litery: true

zamiany:
  # AUDYT 18.21: kolejność jest tu nietrywialna i opiera się na dwóch krokach.
  # (1) „j" → „y" MUSI iść PIERWSZE: niemieckie „j" to /j/, a hiszpańskie „j"
  #     czyta się /x/ („Jahr" jako [xar]) — przy okazji ten krok OPRÓŻNIA
  #     literę „j", która niżej pełni rolę warty.
  # (2) Trzy dźwięki — /tʃ/ (tsch), /ʃ/ (sch) i /x/ (samotne ch) — nachodzą na
  #     siebie w sekwencyjnym `str.replace`: świeże „ch" z reguły tsch zjadałaby
  #     niższa reguła „ch" → „j". Dlatego tsch idzie na WARTĘ „jj", przywracaną
  #     na „ch" na samym końcu listy. Naturalne „jj" nie może już wystąpić, bo
  #     krok (1) usunął z tekstu wszystkie „j".
  #     Do v18.20 kaskada spadała na /k/: „Tschüss" → „Kuss", „Deutsch" → „Deuk".
  - { wzor: "j",    zamiana: "y"   }
  - { wzor: "J",    zamiana: "Y"   }
  # --- Trigramme zuerst (KASKADA ZAMIERZONA: warta „jj", patrz koniec listy) ---
  - { wzor: "tsch", zamiana: "jj"  }
  - { wzor: "Tsch", zamiana: "Jj"  }
  - { wzor: "TSCH", zamiana: "JJ"  }
  # --- Digramme ---
  - { wzor: "sch",  zamiana: "sh"  }
  - { wzor: "Sch",  zamiana: "Sh"  }
  - { wzor: "SCH",  zamiana: "SH"  }
  - { wzor: "ch",   zamiana: "j"   }
  - { wzor: "Ch",   zamiana: "J"   }
  - { wzor: "CH",   zamiana: "J"   }
  - { wzor: "ie",   zamiana: "i"   }
  - { wzor: "Ie",   zamiana: "I"   }
  - { wzor: "IE",   zamiana: "I"   }
  # --- Umlaute ---
  - { wzor: "ü",    zamiana: "u"   }
  - { wzor: "Ü",    zamiana: "U"   }
  - { wzor: "ö",    zamiana: "o"   }
  - { wzor: "Ö",    zamiana: "O"   }
  - { wzor: "ä",    zamiana: "e"   }
  - { wzor: "Ä",    zamiana: "E"   }
  # --- Einzelne Konsonanten (KASKADA ZAMIERZONA: „w" → „v" → „b" — reguła
  #     „v" → „b" łapie świeże „v", a span. /v/ ≈ /b/ brzmi tak samo) ---
  - { wzor: "w",    zamiana: "v"   }
  - { wzor: "W",    zamiana: "V"   }
  - { wzor: "v",    zamiana: "b"   }
  - { wzor: "V",    zamiana: "B"   }
  - { wzor: "z",    zamiana: "s"   }
  - { wzor: "Z",    zamiana: "S"   }
  # --- warta tsch przywrócona na /tʃ/ (PO wszystkich regułach na „ch") ---
  - { wzor: "jj",   zamiana: "ch"  }
  - { wzor: "Jj",   zamiana: "Ch"  }
  - { wzor: "JJ",   zamiana: "CH"  }
