# Strona „New issue”: zwykłe zgłoszenia zostają tutaj (Sami przyjmuje je jak
# dotąd — ten plik nie dodaje szablonów i nie zmienia intake'u), a prośba
# o czytanie SKANÓW dostaje adres od razu. Reżyser czyta wyłącznie warstwę
# tekstu PDF-a; OCR świadomie poza zakresem (torch + easyocr + modele to
# 4–5× instalatora, a OCR form i tabel daje tekst czytany wierszami na przekrój
# kolumn). accessible_text_analyst ma OCR stron bez tekstu, także w PDF-ie
# mieszanym. Lustro: ATA odsyła tutaj prośby o patch TiflotecniaVoices.
blank_issues_enabled: true
contact_links:
  - name: Scanned PDFs and images (OCR)
    url: https://github.com/githmara/accessible-text-analyst
    about: Reżyser Audio GPT reads only the text layer of a PDF and will not add OCR. For scans and photos of pages, use accessible_text_analyst (Python notebook, OCR via easyocr), then load its accessible_text.docx or .html here.
