name: Patch Bot

on:
  issues:
    types: [labeled]

jobs:
  handle_patch_request:
    # Wymagamy, aby etykietą wyzwalającą była DOKŁADNIE tiflotecnia-patch
    if: github.event.label.name == 'tiflotecnia-patch'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # NOWY KROK: Instalacja Lingua
      - name: Instalacja zależności
        run: pip install lingua-language-detector

      - name: Wysłanie maila z patchem
        id: send_patch
        # UWAGA: argumentow NIE przekazujemy przez CLI, bo bash robi
        # word-splitting na cudzyslowach / backtickach w tresci issue
        # (klasyczna pulapka shellu). Skrypt czyta wszystko z os.environ.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python .github/scripts/send_patch.py

      - name: Komentarz potwierdzający dla użytkownika
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "PL: Patch wysłany na podany adres, zgłoszenie zostaje zamknięte. Jeśli nie widzisz wiadomości, sprawdź folder Spam lub Wiadomości-śmieci. / EN: The patch has been sent and the issue is now closed. If you don't see the email, please check your Spam or Junk folder."

      - name: Redact body issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "[redacted by bot — patch wysłany / Patch sent]"

      - name: Zamknięcie issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Zablokowanie dalszej dyskusji
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue lock "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason resolved