name: Patch Bot

on:
  issues:
    types: [opened, labeled]

jobs:
  handle_patch_request:
    # Uruchom tylko wtedy, gdy issue ma odpowiednią etykietę
    if: contains(github.event.issue.labels.*.name, 'tiflotecnia-patch')
    runs-on: ubuntu-latest
    permissions:
      issues: write   # close, edit, lock, comment — wystarczy domyślny GITHUB_TOKEN

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wysłanie maila z patchem
        id: send_patch
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python .github/scripts/send_patch.py "$ISSUE_BODY" "$ISSUE_NUMBER"

      # Poniższe kroki uruchamiają się TYLKO gdy poprzedni step zakończył się sukcesem
      # (skrypt Python zwrócił exit 0, czyli email został wysłany). Jeśli skrypt
      # zfailował (np. brak adresu email w treści), workflow kończy się tutaj —
      # komentarz informujący użytkownika dodaje sam skrypt Python przed exit 1.

      - name: Komentarz potwierdzający dla użytkownika
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Patch wysłany na podany adres, zgłoszenie zostaje zamknięte."

      - name: Redact body issue (usunięcie adresu email z publicznego wątku)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "[redacted by bot — patch wysłany]"

      - name: Zamknięcie issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Zablokowanie dalszej dyskusji
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue lock "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason resolved
