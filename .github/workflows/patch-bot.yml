name: Patch Bot

on:
  issues:
    types: [labeled]

jobs:
  handle_patch_request:
    # Wymagamy, aby etykietą wyzwalającą była DOKŁADNIE tiflotecnia-patch
    if: github.event.label.name == 'tiflotecnia-patch'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wysłanie maila z patchem
        id: send_patch
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python .github/scripts/send_patch.py "$ISSUE_BODY" "$ISSUE_NUMBER"

      - name: Komentarz potwierdzający dla użytkownika
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Patch wysłany na podany adres, zgłoszenie zostaje zamknięte."

      - name: Redact body issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "[redacted by bot — patch wysłany]"

      - name: Zamknięcie issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Zablokowanie dalszej dyskusji
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue lock "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason resolved