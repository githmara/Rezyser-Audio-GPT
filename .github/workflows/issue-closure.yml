name: Issue Closure (North — Lumi/Vieno/Katla)

# Etap „Polnoc" obiegu „Z Poludnia na Polnoc". Dwie etykiety wyzwalajace
# (od v15.2.6):
#   * `fixed-in-release` — bug-fix flow: jedna z bohaterek Polnocy
#     (Lumi/Vieno/Katla) komentuje z linkiem do najnowszego Release
#     i zamyka issue w jezyku oryginalnego zgloszenia.
#   * `answered` — answer flow: bohaterka Polnocy wyciaga ostatni komentarz
#     na issue (zostawiony przez maintainera jako odpowiedz na pytanie),
#     opakowuje go w styl persony BEZ linku do release i zamyka issue.
#     Konwencja: maintainer komentuje z odpowiedzia, POTEM nadaje etykiete
#     `answered` — bot bierze chronologicznie ostatni komentarz.

on:
  issues:
    types: [labeled]

concurrency:
  group: issue-closure-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  zamknij_z_polnocy:
    if: github.event.label.name == 'fixed-in-release' || github.event.label.name == 'answered'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja srodowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zaleznosci (lingua)
        run: pip install lingua-language-detector

      - name: Polnocna bohaterka komentuje i zamyka
        # UWAGA: argumentow NIE przekazujemy przez CLI, bo bash robi
        # word-splitting na cudzyslowach / backtickach w tresci issue
        # (klasyczna pulapka shellu). Skrypt czyta wszystko z os.environ.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: python .github/scripts/issue_closure_north.py
