name: Issue Closure (North — Lumi/Vieno/Katla)

# Etap „Polnoc" obiegu „Z Poludnia na Polnoc". Od v17.1 JEDNA etykieta
# wyzwalajaca: `fixed-in-release` (bug-fix flow). Jedna z bohaterek Polnocy
# (Lumi/Vieno/Katla) komentuje issue z linkiem do najnowszego Release i zamyka
# je w jezyku oryginalnego zgloszenia.
#
# Flow `answered` (odpowiedzi na pytania) zostal w v17.1 PRZENIESIONY do
# LOKALNEGO skryptu `odpowiedz_lokalnie.py` — maintainer ma lokalny gh CLI, wiec
# nie potrzeba juz obiegu przez zacommitowany plik. Zniknela maszyneria
# pending_answer.md + commit + atomic-reset / cleanup-commit / force-push + tryb
# COMMENT. Dlatego ten workflow nie potrzebuje juz `contents: write` ani
# `fetch-depth: 2` na checkout — robi wylacznie comment/close/lock przez gh.

on:
  issues:
    types: [labeled]

concurrency:
  group: issue-closure-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  zamknij_z_polnocy:
    if: github.event.label.name == 'fixed-in-release'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v5

      - name: Konfiguracja srodowiska Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalacja zaleznosci (lingua + pyyaml)
        run: pip install lingua-language-detector pyyaml

      - name: Polnocna bohaterka komentuje i zamyka
        # UWAGA: argumentow NIE przekazujemy przez CLI, bo bash robi
        # word-splitting na cudzyslowach / backtickach w tresci issue.
        # Skrypt czyta wszystko z os.environ.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: python .github/scripts/issue_closure_north.py
