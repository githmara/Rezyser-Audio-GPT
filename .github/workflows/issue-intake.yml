name: Issue Intake (South — Sami)

# Etap „Poludnia" obiegu „Z Poludnia na Polnoc": Sami (wloska dyspozytorka)
# odbiera nowe zgloszenia, uzywa OpenAI do przerobienia tresci na techniczny
# prompt po polsku, wysyla mail do Centrum (maintainer).

on:
  issues:
    types: [opened, labeled]

# Concurrency: na issue × workflow — jesli ktos kliknie etykiete dwa razy,
# druga akcja anuluje pierwsza i nie poleci podwojny mail.
concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  redaguj_i_wyslij:
    # Filtr na poziomie joba: pomijamy etykiety zarezerwowane dla innych
    # workflowow (patch-bot, closure) i porzadkowe (wontfix/duplicate).
    # Logika szczegolowa (akceptowalne etykiety) siedzi w skrypcie Pythonowym,
    # zeby latwo dodawac nowe bez touchowania YAML-a.
    if: >-
      github.event.action == 'opened' ||
      (github.event.action == 'labeled' &&
       github.event.label.name != 'tiflotecnia-patch' &&
       github.event.label.name != 'fixed-in-release' &&
       github.event.label.name != 'wontfix' &&
       github.event.label.name != 'duplicate')
    runs-on: ubuntu-latest
    permissions:
      # write — Sami zostawia komentarz na issue po pomyslnej wysylce
      # maila do Centrum (zeby user nie patrzyl w "czarna dziure" miedzy
      # nadaniem etykiety a komentarzem Lumi/Vieno/Katla po fix-ie).
      issues: write

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja srodowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zaleznosci (openai + lingua)
        run: |
          pip install --upgrade "openai>=1.40,<2.0"
          pip install lingua-language-detector

      - name: Zbierz etykiety issue do CSV
        id: labels
        env:
          LABELS_JSON: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          python - <<'PY'
          import json, os
          labels = json.loads(os.environ.get("LABELS_JSON", "[]"))
          csv = ",".join(labels)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"csv={csv}\n")
          PY

      - name: Sami przetwarza zgloszenie, wysyla mail i komentuje issue
        # UWAGA: argumentow NIE przekazujemy przez CLI, bo bash robi
        # word-splitting na cudzyslowach / backtickach w tresci issue
        # (klasyczna pulapka shellu). Skrypt czyta wszystko z os.environ.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAINTAINER_EMAIL: ${{ secrets.MAINTAINER_EMAIL }}
          # GH_TOKEN + GITHUB_REPOSITORY do `gh issue comment` po wysylce
          # maila (Sami zostawia melodunek na issue, zeby user wiedzial
          # ze sprawa zostala odebrana).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ steps.labels.outputs.csv }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python .github/scripts/issue_intake_sami.py
