name: Draft Release (auto-tag + RELEASE_NOTES.md sekcja -> draft)

# Workflow eliminujacy user errors przy tworzeniu Release (od v15.2.9):
#
# Trigger: workflow_dispatch z inputem `potwierdz=tak` (szyba bezpieczenstwa
# przeciw przypadkowemu uruchomieniu z Web UI Actions). Bot wykonuje:
#   1. Odczytuje VERSION z roota repo.
#   2. Sprawdza czy tag v<wersja> juz istnieje lokalnie LUB na origin.
#      Jesli tak — przerywa workflow z czytelnym komunikatem (bump VERSION
#      lub usun tag jesli to pomylka).
#   3. Wyciaga sekcje `## <wersja> — ...` z RELEASE_NOTES.md regexem
#      lookahead na nastepny naglowek `## ` lub EOF.
#   4. Tworzy tag v<wersja> wskazujacy na obecny HEAD main, pushuje na origin.
#   5. Tworzy draft Release przez `gh release create --draft` z tytulem
#      „Reżyser Audio GPT — version <wersja>" (tytul EN od v17.6.0 — A11y:
#      body Release zaczyna sie od EN, screen reader nie wpada w PL bez ostrzezenia)
#      i tresc
#      z wyciagnietej sekcji RELEASE_NOTES.md.
#
# Co maintainer ROBI po workflow:
#   * Web GitHub → Releases → wybierz nowy draft → upload Installer EXE
#     (`Rezyser_Audio_v<wersja>_Installer.exe`) → Publish.
#
# Eliminuje user errors:
#   * Literowka w numerze wersji (auto z VERSION, nie z palca w UI).
#   * Bledny commit-target tagu (bot wskazuje HEAD, nie domyslny dropdown).
#   * Pomylka tresci release notes (auto-ekstrakcja zamiast Ctrl-V z Notatnika).
#   * Duplikat tagu (workflow sprawdza i fail-fast).
#   * Brak tytulu / przypadkowy „Untitled release" (auto-formatowanie).

on:
  workflow_dispatch:
    inputs:
      potwierdz:
        description: 'Wpisz „tak" (bez cudzyslowow) zeby potwierdzic tworzenie draft Release dla wersji z pliku VERSION. Inny tekst = no-op.'
        required: true
        default: 'nie'

jobs:
  utworz_draft:
    # Szyba bezpieczenstwa na poziomie joba — input `potwierdz` musi byc
    # dokladnie „tak" (case-sensitive). Inny tekst -> job nie odpala.
    if: github.event.inputs.potwierdz == 'tak'
    runs-on: ubuntu-latest
    permissions:
      # contents: write — workflow tworzy tag (git push origin v<wersja>)
      # i Release (gh release create wymaga write). secrets.GITHUB_TOKEN
      # automatycznie ma contents: write gdy workflow deklaruje to permission.
      contents: write

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v5
        # fetch-depth: 0 — pelna historia, zeby git tag dzialal na obecnym
        # HEAD. fetch-tags: true (default w v5 ale explicit dla jasnosci) —
        # bot musi widziec istniejace tagi zeby wykryc duplikat.
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Odczyt VERSION z roota repo
        id: wersja
        run: |
          WERSJA=$(tr -d '[:space:]' < VERSION)
          if [ -z "$WERSJA" ]; then
            echo "::error::Plik VERSION pusty albo niesparsowalny. Przerywam."
            exit 1
          fi
          echo "wersja=$WERSJA" >> "$GITHUB_OUTPUT"
          echo "tag=v$WERSJA" >> "$GITHUB_OUTPUT"
          echo "Odczytano VERSION=$WERSJA, planowany tag=v$WERSJA"

      - name: Sprawdz czy tag juz istnieje (lokalnie + na origin)
        env:
          TAG: ${{ steps.wersja.outputs.tag }}
        run: |
          # Sprawdzenie lokalne (po fetch-tags: true mamy wszystkie tagi origin)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG juz istnieje (znaleziony lokalnie po fetch). Przerywam — bump VERSION w roocie repo lub usun istniejacy tag jesli to pomylka. Wskazowka: jesli zamierzasz przeniesc tag na inny commit, uzyj force-push tag-only manualnie zamiast tego workflow."
            exit 1
          fi
          # Dodatkowe sprawdzenie na origin (bezpieczenstwo — fetch-tags
          # mogl nie zlapac jesli tag pojawil sie pomiedzy fetch a teraz).
          if git ls-remote --tags --exit-code origin "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG juz istnieje na origin (race condition po fetch). Przerywam — odswiez stan repo i ponow workflow."
            exit 1
          fi
          echo "Tag $TAG nie istnieje ani lokalnie ani na origin. Kontynuuje."

      - name: Wytnij sekcje `## <wersja>` z RELEASE_NOTES.md
        env:
          WERSJA: ${{ steps.wersja.outputs.wersja }}
        # Inline Python heredoc — regex lookahead na nastepny naglowek
        # `## ` lub EOF (struktura RELEASE_NOTES.md od v15.2.5).
        run: |
          python3 - <<'PY'
          import pathlib, re, os, sys
          wersja = os.environ["WERSJA"]
          t = pathlib.Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          # Wzorzec: "## <wersja> — patch release ..." (od v15.2.6+) LUB
          # "## <wersja> ..." (kompatybilne wstecznie z wczesniejszymi formatami).
          # Konczy sie zaraz przed nastepnym "## " (nastepna sekcja wersji).
          escaped = re.escape(wersja)
          pattern = rf"(## {escaped}(?:\s+—|\s+\W).*?)(?=\n## )"
          m = re.search(pattern, t, re.DOTALL)
          if not m:
              sys.stderr.write(
                  f"::error::Sekcja `## {wersja}` nie znaleziona w "
                  f"RELEASE_NOTES.md. Dopisz pelna sekcje wersji (## <wersja> — "
                  f"patch release ...) przed odpaleniem workflow.\n"
              )
              sys.exit(2)
          tresc = m.group(1).rstrip()
          # Usun koncowy separator sekcji `---` (nalezy MIEDZY sekcje, nie do
          # tresci) — inaczej body Release (a wiec i changelog w DialogAktualizacji)
          # konczy sie nieeleganckimi myslnikami.
          tresc = re.sub(r"\n+-{3,}[ \t]*$", "", tresc).rstrip() + "\n"
          out = pathlib.Path("/tmp/release_notes.md")
          out.write_text(tresc, encoding="utf-8")
          print(f"OK: {len(tresc)} znakow z sekcji ## {wersja} zapisanych w {out}")
          PY

      - name: Utworz tag i wypchnij na origin
        env:
          TAG: ${{ steps.wersja.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          HEAD_SHA=$(git rev-parse HEAD)
          echo "Tag $TAG utworzony i wypchniety na origin. Wskazuje na HEAD = $HEAD_SHA"

      - name: Utworz draft Release przez gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.wersja.outputs.tag }}
          WERSJA: ${{ steps.wersja.outputs.wersja }}
        # gh release create --draft tworzy draft (nie publikuje). Maintainer
        # po workflow musi: Web Releases -> draft -> upload Installer EXE ->
        # Publish. To eliminuje ryzyko zapomnienia o Installerze (czesty
        # user error przy recznym tworzeniu Release).
        run: |
          gh release create "$TAG" \
            --draft \
            --title "Reżyser Audio GPT — version $WERSJA" \
            --notes-file "/tmp/release_notes.md"
          echo "Draft Release dla $TAG utworzony."
          echo "Nastepny krok (rola maintainera): Web Releases -> wybierz draft -> upload Installer EXE -> Publish."
